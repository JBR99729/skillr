reen</span></section></main><script>const slides=[['title','Understanding Time: Days, Hours, Minutes & Seconds','Recognising, estimating, comparing and measuring durations',['AC9M3M03','24 hours','60 minutes','60 seconds']],['single','Acknowledgement of Country','We acknowledge the Traditional Custodians of the land on which we learn, and pay our respects to Elders past and present.',['Continuing connection to Country','Knowledge of seasons, skies and cycles','Teacher prompt: insert the name of the Country your school is on']],['single','Lesson Map: Three Lessons','This deck runs across three 60-minute lessons.',['Lesson 1: Units of time • Slides 5–11','Lesson 2: Timers & measuring • Slides 12–18','Lesson 3: Cycles in nature • Slides 19–26','Warm-up 10 min • Teaching 20 min • Activity 25 min • Exit 5 min']],['goals','Learning Goals','Students will learn to:',['Recognise formal units of time','Estimate how long events take','Compare durations','Plan a sequence of events','Read and set digital timers','Measure short durations','Explore First Nations Australian time cycles']],['lesson','LESSON 1','Units of Time',['60 minutes','Warm-up: what can you do in one minute?','Teaching: formal units and key relationships','Activity: Estimate & Check','Wrap-up: share closest estimates']],['cards','What Are Formal Units of Time?','Time units help us measure how long things take.',['Days: long events','Hours: medium events','Minutes: short events','Seconds: very short events','1 day = 24 hours','1 hour = 60 minutes','1 minute = 60 seconds']],['cards','Why Do We Need Different Units?','We do not measure everything the same way.',['A movie → hours','A game → minutes','A blink → seconds','A school week → days','Teacher prompt: Which unit makes sense?']],['cards','Examples of Time Units','Match the event to the correct unit.',['Brushing teeth → minutes','Jumping once → seconds','Sleeping overnight → hours','Weekend → days']],['cards','Estimating Duration','Students estimate how long tasks take.',['Reading a short passage: 2 min','Sharpening a pencil: 10 sec','Walking to the library: 3 min','Saying the alphabet: 20 sec','How long do you think this will take? Why?']],['activity','Activity: Estimate & Check','Students guess first, then measure with timers.',['25 minutes','Clap 20 times','Write your name','Tie your shoelace','Read 3 sentences','Check with digital timer, stopwatch or sand timer']],['sheet','Student Sheet: Estimate & Check','Print one per student. Estimate first, then time it.',['Name and date','Task | My estimate | Actual time | Difference','Clap 20 times','Write your name','Tie your shoelace','Read 3 sentences']],['cards','Planning Events','Example: our class party plan.',['Musical chairs: 10 minutes','Balloon relay: 8 minutes','Snack break: 12 minutes','Dance time: 15 minutes','Total = 45 minutes. It fits.']],['activity','Activity: Build a Schedule','Students create a schedule and check whether it fits.',['25 minutes','Class party','Sports afternoon','Reading session','Science experiment','Estimate, add and compare with available time']],['lesson','LESSON 2','Timers & Measuring',['60 minutes','Warm-up: read digital times aloud','Teaching: reading and setting timers','Activity: One-Minute Challenge','Wrap-up: compare durations']],['digital','Reading Digital Time','Digital devices show time using numbers.',['3:00 = 3 minutes','0:45 = 45 seconds','1:30 = 1 minute 30 seconds','10:00 = 10 minutes','Teacher prompt: What does 2:15 mean?']],['digital','Setting Digital Timers','Students practise setting digital devices.',['Countdown timer','Stopwatch','Microwave timer','Tablet or phone timer','Try 3:00, 0:45 and 1:10']],['activity','Measuring Short Durations','Students use timers to measure short intervals.',['Sand timers','Stopwatches','Digital timers','Measure 1:00, 3:00 and 5:00','How close was your estimate?']],['activity','Activity: One-Minute Challenge','Can you do each of these for exactly one minute?',['Jump for 1 minute','Draw for er:',['Which unit measures very short events?','How many minutes are in an hour?','Estimate how long it takes to read one page.','Name one way First Nations Australians understand time.','Time to answer: 5:00']],['answers','Exit Ticket: Answer Key','Accept answers that show the same thinking.',['Very short events: seconds','One hour = 60 minutes','Reading one page: about 1–3 minutes with a reason','First Nations time: moon phases, star positions, sun movement or seasonal change on Country']],['end','Great work today!','You now understand how time units help us measure and plan our day.',['skillrhub.com','AC9M3M03']]];let i=0;const stage=document.getElementById('stage'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){stage.innerHTML=slides.map((s,n)=>`<article class="slide ${s[0]} ${n===i?'active':''}"><span class="num">${n+1}/29</span><p class="eyebrow">AC9M3M03 • Year 3 Mathematics</p><h1>${esc(s[1])}</h1><p class="lead">${esc(s[2])}</p><ul>${s[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="brand"><span>skillrhub.com</span><span>AC9M3M03</span></div></article>`).join('');count.textContent=`${i+1} / ${slides.length}`;prev.disabled=i===0;next.disabled=i===slides.length-1;history.replaceState(null,'',`#slide=${i+1}`)}function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.querySelector('.deck').requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='Home'){i=0;render()}if(e.key==='End'){i=slides.length-1;render()}});let sx=null
