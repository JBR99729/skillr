<style>
:root{--navy:#111827;--ink:#173b6d;--line:#d8e3f7;--bg:#f4f7fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:#172033}body{overflow:auto}
.top{min-height:52px;display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.55rem .85rem;background:var(--navy);border-bottom:1px solid #24344f;position:relative;z-index:5}.top a{color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}.meta{font-size:.86rem;color:#d1d5db;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer{width:min(100%,1280px);margin:0 auto;padding:10px 10px 18px}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #26344f}.slide{width:100%;height:100%;object-fit:contain;display:block;background:#000;user-select:none;-webkit-user-drag:none}.tap-zone{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;z-index:2}.tap-zone.prev{left:0}.tap-zone.next{right:0}
.controls{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.65rem .4rem;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;box-shadow:0 4px 14px rgba(19,49,92,.08)}.ctrl{min-width:46px;height:44px;border:1px solid #cbd8ea;border-radius:12px;background:#eef4fb;color:var(--ink);font-size:1.35rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.ctrl:hover,.ctrl:focus-visible{background:#dfeafb;outline:2px solid #2457d6;outline-offset:2px}.ctrl[disabled]{opacity:.35;cursor:default}.count{min-width:86px;text-align:center;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}.help{margin-left:auto;font-size:.8rem;color:#5d6b7d;padding-right:.35rem}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:#000;z-index:1}.loading[hidden]{display:none}
@media(max-width:640px){.top{min-height:46px;padding:.45rem .6rem;flex-wrap:wrap;gap:.25rem .6rem}.top a{font-size:.78rem}.meta{font-size:.72rem;flex:1 1 100%;text-align:left}.viewer{padding:0 0 10px}.stage{border-left:0;border-right:0}.controls{border-left:0;border-right:0;border-radius:0;gap:.45rem;padding:.55rem .45rem}.ctrl{min-width:44px;height:42px}.help{display:none}}
@media(orientation:landscape) and (max-height:700px){html,body{background:#000}body{overflow:hidden}.top{display:none}.viewer{width:100vw;height:100dvh;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:#000}.stage{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));aspect-ratio:auto;border:0}.controls{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:14px;padding:.35rem .5rem;background:rgba(255,255,255,.94);z-index:10}.help{display:none}}

<nav class="top"><a href="/year3/maths/ac9m3m03-and-use-the-relationship-between-formal-units-of-time-including/">← Topic Guide</a><span class="meta">AC9M3M03 • Year 3 Maths • Teacher Slides</span></nav>
<main class="viewer" id="viewer" tabindex="0" aria-label="AC9M3M03 teacher slide presentation">
<div class="stage" id="stage"><div class="loading" id="loading">Loading slide…</div><img class="slide" id="slide" alt="Teacher slide 1 of 29" draggable="false"><button class="tap-zone prev" id="tapPrev" aria-label="Previous slide"></button><button class="tap-zone next" id="tapNext" aria-label="Next slide"></button></div>
<div class="controls"><button class="ctrl" id="prev" aria-label="Previous slide" title="Previous slide">‹</button><span class="count" id="count">1 / 29</span><button class="ctrl" id="next" aria-label="Next slide" title="Next slide">›</button><button class="ctrl" id="full" aria-label="Full screen" title="Full screen">⛶</button><span class="help">← → keys • swipe • tap sides</span></div>
</main>
<script>
const deckId='1SDKdi6qVUxVyWIDWeSEC0Nhz9JwyCqpa_tIFP1XeQT8';
const slideIds=['p1','p2','p3','p4','p5','p6','p7','p8','p9','p10','p11','p12','p13','p14','p15','p16','p17','p18','p19','p20','p21','p22','p23','p24','p25','p26','p27','p28','p29'];
let index=0;const img=document.getElementById('slide'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage'),viewer=document.getElementById('viewer'),loading=document.getElementById('loading');
function srcFor(i){return `https://docs.google.com/presentation/d/${deckId}/export/png?id=${deckId}&pageid=${slideIds[i]}`}
function render(){loading.hidden=false;img.src=srcFor(index);img.alt=`Teacher slide ${index+1} of ${slideIds.length}`;count.textContent=`${index+1} / ${slideIds.length}`;prev.disabled=index===0;next.disabled=index===slideIds.length-1;history.replaceState(null,'',`#slide=${index+1}`);if(index+1<slideIds.length){const p=new Image();p.src=srcFor(index+1)}}
function go(n){index=Math.max(0,Math.min(slideIds.length-1,n));render()}
img.addEventListener('load',()=>loading.hidden=true);img.addEventListener('error',()=>{loading.textContent='Slide could not load — sign in to Google or check deck sharing.'});
prev.addEventListener('click',()=>go(index-1));next.addEventListener('click',()=>go(index+1));document.getElementById('tapPrev').addEventListener('click',()=>go(index-1));document.getElementById('tapNext').addEventListener('click',()=>go(index+1));document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement)viewer.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(index+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(index-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slideIds.length-1)}});
let startX=null,startY=null;stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2)go(index+(dx<0?1:-1));startX=startY=null},{passive:true});
const m=location.hash.match(/slide=(\d+)/);if(m)index=Math.max(0,Math.min(slideIds.length-1,Number(m[1])-1));render();viewer.focus({preventScroll:true});
</script>
