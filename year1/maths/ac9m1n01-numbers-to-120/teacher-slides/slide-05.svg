<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 1 Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">5 / 5</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Quick number check</text><g font-family="Arial"><rect x="120" y="295" width="1360" height="110" rx="22" fill="#eff6ff"/><text x="170" y="365" fill="#1d4ed8" font-size="30" font-weight="700">1.</text><text x="235" y="365" fill="#0f172a" font-size="30">Write the numeral for ninety-two.</text><rect x="120" y="445" width="1360" height="110" rx="22" fill="#ecfdf5"/><text x="170" y="515" fill="#166534" font-size="30" font-weight="700">2.</text><text x="235" y="515" fill="#0f172a" font-size="30">How many tens and ones are in 74?</text><rect x="120" y="595" width="1360" height="110" rx="22" fill="#fff7ed"/><text x="170" y="665" fill="#9a3412" font-size="30" font-weight="700">3.</text><text x="235" y="665" fill="#0f172a" font-size="30">Put these in order from smallest to largest: 105, 99, 112.</text></g><rect x="250" y="735" width="1100" height="70" rx="20" fill="#fefce8"/><text x="800" y="780" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="29" font-weight="700">Read → represent → locate → compare → order</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M1N01 • SkillrHub • skillrhub.com</text></svg>