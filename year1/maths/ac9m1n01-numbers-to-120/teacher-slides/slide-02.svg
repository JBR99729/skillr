<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 1 Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 5</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Tens and ones help us build two-digit numbers</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Example: 67 = 6 tens + 7 ones</text><g font-family="Arial"><rect x="160" y="320" width="580" height="360" rx="28" fill="#eff6ff"/><text x="450" y="385" text-anchor="middle" fill="#1d4ed8" font-size="32" font-weight="700">6 TENS</text><g fill="#60a5fa"><rect x="220" y="430" width="55" height="170"/><rect x="300" y="430" width="55" height="170"/><rect x="380" y="430" width="55" height="170"/><rect x="460" y="430" width="55" height="170"/><rect x="540" y="430" width="55" height="170"/><rect x="620" y="430" width="55" height="170"/></g><rect x="860" y="320" width="580" height="360" rx="28" fill="#ecfdf5"/><text x="1150" y="385" text-anchor="middle" fill="#166534" font-size="32" font-weight="700">7 ONES</text><g fill="#4ade80"><circle cx="980" cy="485" r="28"/><circle cx="1050" cy="485" r="28"/><circle cx="1120" cy="485" r="28"/><circle cx="1190" cy="485" r="28"/><circle cx="1260" cy="485" r="28"/><circle cx="1330" cy="485" r="28"/><circle cx="1155" cy="560" r="28"/></g></g><text x="800" y="755" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="46" font-weight="700">60 + 7 = 67</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M1N01 • SkillrHub • skillrhub.com</text></svg>