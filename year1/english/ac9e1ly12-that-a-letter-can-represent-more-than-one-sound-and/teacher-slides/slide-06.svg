<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9E1LY12 — Common mix-ups and quick check</title><desc id="d">Letter has only one sound. Try instead: Some letters represent different sounds in different words. Counting written vowels only. Try instead: Listen for vowel sounds. Syllable without vowel. Try instead: Every syllable needs a vowel sound. Clap robot. Can a letter make more than one sound? What must every syllable contain? Name a vowel letter.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".05" fill="#2457d6" font-family="Arial" font-size="34" font-weight="700"><text x="120" y="310" transform="rotate(-18 120 310)">SkillrHub • skillrhub.com</text><text x="720" y="590" transform="rotate(-18 720 590)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="98" fill="#173968"/><text x="88" y="63" fill="#fff" font-family="Arial" font-size="31" font-weight="700">SkillrHub • Year 1 English</text><text x="1485" y="63" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">6 / 6</text><text x="92" y="150" fill="#2457d6" font-family="Arial" font-size="23" font-weight="700">Check your understanding</text><text x="92" y="215" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="700" fill="#173968">Common mix-ups and quick check</text><rect x="92" y="345" width="1416" height="405" rx="26" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="135" y="405" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">Letter has only one sound. Try instead: Some letters represent</text><text x="135" y="447" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">different sounds in different words. Counting written vowels only. Try</text><text x="135" y="489" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">instead: Listen for vowel sounds. Syllable without vowel. Try instead:</text><text x="135" y="531" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">Every syllable needs a vowel sound. Clap robot. Can a letter make more</text><text x="135" y="573" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">than one sound? What must every syllable contain? Name a vowel letter.</text><rect y="835" width="1600" height="65" fill="#173968"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9E1LY12 • Classroom View • skillrhub.com</text></svg>
