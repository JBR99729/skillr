<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9E1LY06 — I can create, reread and edit a short text so its sentences, vocabulary, punctuation and spelling make sense.</title><desc id="d">Use an appropriate text structure and correct simple sentences when creating a text. Use learning-area vocabulary where it helps meaning. Sequence images and captions in a digital story or information text. Add, remove or change words to improve meaning. Use dictionaries and other resources to check spelling. Notice words that may need a spelling check.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".05" fill="#2457d6" font-family="Arial" font-size="34" font-weight="700"><text x="120" y="310" transform="rotate(-18 120 310)">SkillrHub • skillrhub.com</text><text x="720" y="590" transform="rotate(-18 720 590)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="98" fill="#173968"/><text x="88" y="63" fill="#fff" font-family="Arial" font-size="31" font-weight="700">SkillrHub • Year 1 English</text><text x="1485" y="63" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 6</text><text x="92" y="150" fill="#2457d6" font-family="Arial" font-size="23" font-weight="700">Learning goal</text><text x="92" y="215" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="700" fill="#173968">I can create, reread and edit a short text</text><text x="92" y="270" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="700" fill="#173968">so its sentences, vocabulary, punctuation…</text><rect x="92" y="345" width="1416" height="405" rx="26" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="135" y="405" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">Use an appropriate text structure and correct simple sentences when</text><text x="135" y="447" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">creating a text. Use learning-area vocabulary where it helps meaning.</text><text x="135" y="489" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">Sequence images and captions in a digital story or information text.</text><text x="135" y="531" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">Add, remove or change words to improve meaning. Use dictionaries and</text><text x="135" y="573" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">other resources to check spelling. Notice words that may need a</text><text x="135" y="615" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="#203047">spelling check.</text><rect y="835" width="1600" height="65" fill="#173968"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9E1LY06 • Classroom View • skillrhub.com</text></svg>
