<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M9M02 — Write extreme measurements in scientific notation</title><desc id="desc">Represent very large and small real numbers in scientific notation, converting real numbers expressed in scientific notation into decimal form.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 9 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">2 / 5</text><text x="90" y="175" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Write extreme measurements in scientific</text><text x="90" y="233" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">notation</text><text x="90" y="310" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">Represent very large and small real numbers in scientific notation,</text><text x="90" y="352" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">converting real numbers expressed in scientific notation into decimal</text><text x="90" y="394" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">form.</text><rect x="90" y="415" width="1420" height="190" rx="26" fill="#e8eef9"/><text x="135" y="466" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Model / key relationship</text><text x="135" y="518" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">The approximate geological age of the earth is 4.6× 10^9 years, the mass</text><text x="135" y="558" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">of a sugar molecule is 5.68× 10^(-21) grams.</text><rect x="90" y="635" width="1420" height="155" rx="26" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="135" y="683" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Student prompt</text><text x="135" y="730" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">For write extreme measurements in scientific notation, which units,</text><text x="135" y="768" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">bounds or accuracy statement belong in the result?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M9M02 • SkillrHub • skillrhub.com</text></svg>
