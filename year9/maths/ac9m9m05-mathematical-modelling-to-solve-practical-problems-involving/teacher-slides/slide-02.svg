<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M9M05 — Model direct proportion</title><desc id="desc">Model situations involving direct proportion such as pro rata pay rates, exchange rates, multiple quotes for a job, conversion between scales or other appropriate science contexts.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 9 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">2 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Model direct proportion</text><text x="90" y="255" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">Model situations involving direct proportion such as pro rata pay rates,</text><text x="90" y="297" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">exchange rates, multiple quotes for a job, conversion between scales or</text><text x="90" y="339" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">other appropriate science contexts.</text><rect x="90" y="415" width="1420" height="190" rx="26" fill="#e8eef9"/><text x="135" y="466" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Model / key relationship</text><text x="135" y="518" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">Hooke’s law and other science contexts involving wave lengths and</text><text x="135" y="558" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">frequencies.</text><rect x="90" y="635" width="1420" height="155" rx="26" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="135" y="683" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Student prompt</text><text x="135" y="730" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">For model direct proportion, which quantities must scale or compare by</text><text x="135" y="768" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">the same factor?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M9M05 • SkillrHub • skillrhub.com</text></svg>
