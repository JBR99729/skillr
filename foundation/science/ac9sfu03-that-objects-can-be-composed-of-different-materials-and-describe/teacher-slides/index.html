bservable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li><li>E2: recognising that tools such as magnifying glasses enable more-detailed observations Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li></ul></div><footer>AC9SFU03 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU03</p><span>4 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E3: sorting and grouping materials based on observed properties such as colour, hardness, texture and flexibility Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li><li>E4: creating a display of different materials, naming each material and exploring language to describe properties of materials Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li></ul></div><footer>AC9SFU03 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU03</p><span>5 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>E5: using a digital camera to collect images of objects on a materials scavenger hunt Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li><li>E6: suggesting why different parts of everyday objects, such as saucepans and clothing, are made from different materials Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li></ul></div><footer>AC9SFU03 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU03</p><span>6 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 4</h2><ul><li>E7: investigating the ways in which First Nations Australians make utensils for different purposes by combining different materials Learning connection: Objects can be made from one or more materials. Materials can be described using observable properties such as hard, soft, smooth, rough, bendy, stiff, shiny or dull.</li><li>Object → material → property: chair → wood → hard / stiff cloth → fabric → soft / bendy spoon → metal → hard / shiny</li><li>Match a material to a use: towel → absorbent fabric window → transparent glass raincoat → water-resistant material Use an observable or safely testable property to explain the choice.</li></ul></div><footer>AC9SFU03 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU03</p><span>7 / 11</span></header><div class="slide-content"
