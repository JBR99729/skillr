<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">5 / 5</text><text x="90" y="170" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">Quick scientist check</text><text x="90" y="220" fill="#475569" font-family="Arial" font-size="28">Point, name, describe and explain.</text><g font-family="Arial"><rect x="120" y="300" width="650" height="180" rx="24" fill="#eff6ff"/><text x="160" y="355" fill="#1d4ed8" font-size="30" font-weight="700">1. NAME THE MATERIAL</text><text x="160" y="415" fill="#0f172a" font-size="29">A metal spoon is made from ______.</text><rect x="830" y="300" width="650" height="180" rx="24" fill="#fdf2f8"/><text x="870" y="355" fill="#be185d" font-size="30" font-weight="700">2. DESCRIBE A PROPERTY</text><text x="870" y="415" fill="#0f172a" font-size="29">Give one property of fabric.</text><rect x="120" y="525" width="650" height="180" rx="24" fill="#fff7ed"/><text x="160" y="580" fill="#9a3412" font-size="30" font-weight="700">3. MORE THAN ONE MATERIAL</text><text x="160" y="640" fill="#0f172a" font-size="29">Name an object made from 2 materials.</text><rect x="830" y="525" width="650" height="180" rx="24" fill="#ecfdf5"/><text x="870" y="580" fill="#166534" font-size="30" font-weight="700">4. EXPLAIN THE CHOICE</text><text x="870" y="630" fill="#0f172a" font-size="28">Why might a raincoat use a</text><text x="870" y="668" fill="#0f172a" font-size="28">water-resistant material?</text></g><rect x="250" y="745" width="1100" height="60" rx="18" fill="#dcfce7"/><text x="800" y="785" text-anchor="middle" fill="#166534" font-family="Arial" font-size="28" font-weight="700">Material → property → purpose</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFU03 • SkillrHub • skillrhub.com</text></svg>