<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 5</text><text x="90" y="170" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">One object can use more than one material</text><text x="90" y="220" fill="#475569" font-family="Arial" font-size="28">Look at the saucepan. Different parts need different properties.</text><ellipse cx="750" cy="500" rx="260" ry="150" fill="#cbd5e1" stroke="#64748b" stroke-width="12"/><rect x="930" y="460" width="330" height="65" rx="28" fill="#334155"/><rect x="650" y="330" width="200" height="70" rx="20" fill="#94a3b8"/><g font-family="Arial"><text x="370" y="420" font-size="34" font-weight="700" fill="#1e293b">METAL</text><text x="370" y="465" font-size="27" fill="#475569">hard • strong</text><line x1="500" y1="450" x2="590" y2="480" stroke="#64748b" stroke-width="5"/><text x="1210" y="380" font-size="34" font-weight="700" fill="#1e293b">PLASTIC / WOOD</text><text x="1210" y="425" font-size="27" fill="#475569">handle is easier to hold</text><line x1="1210" y1="445" x2="1100" y2="475" stroke="#64748b" stroke-width="5"/></g><rect x="180" y="690" width="1240" height="100" rx="22" fill="#ecfdf5"/><text x="800" y="735" text-anchor="middle" fill="#166534" font-family="Arial" font-size="29" font-weight="700">Say it: “The saucepan is made from ___ and ___.”</text><text x="800" y="773" text-anchor="middle" fill="#166534" font-family="Arial" font-size="27">Which material is used for each part?</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFU03 • SkillrHub • skillrhub.com</text></svg>