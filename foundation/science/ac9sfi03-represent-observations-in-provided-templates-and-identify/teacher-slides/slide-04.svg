<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">4 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Observe → Record → Compare → Pattern</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="330" width="300" height="260" rx="28" fill="#fef3c7"/><text x="240" y="405" fill="#92400e" font-size="34" font-weight="700">1. OBSERVE</text><text x="240" y="485" fill="#334155" font-size="27">look carefully</text><rect x="465" y="330" width="300" height="260" rx="28" fill="#eff6ff"/><text x="615" y="405" fill="#1d4ed8" font-size="34" font-weight="700">2. RECORD</text><text x="615" y="485" fill="#334155" font-size="27">draw • tally • write</text><rect x="840" y="330" width="300" height="260" rx="28" fill="#fdf2f8"/><text x="990" y="405" fill="#be185d" font-size="34" font-weight="700">3. COMPARE</text><text x="990" y="485" fill="#334155" font-size="27">same? different?</text><rect x="1215" y="330" width="300" height="260" rx="28" fill="#ecfdf5"/><text x="1365" y="405" fill="#166534" font-size="34" font-weight="700">4. PATTERN</text><text x="1365" y="485" fill="#334155" font-size="27">what happens often?</text></g><g stroke="#64748b" stroke-width="9" fill="#64748b"><line x1="390" y1="460" x2="450" y2="460"/><polygon points="450,460 420,440 420,480"/><line x1="765" y1="460" x2="825" y2="460"/><polygon points="825,460 795,440 795,480"/><line x1="1140" y1="460" x2="1200" y2="460"/><polygon points="1200,460 1170,440 1170,480"/></g><rect x="260" y="680" width="1080" height="105" rx="22" fill="#fff7ed"/><text x="800" y="727" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="30" font-weight="700">Teacher prompt: “What do our records show us?”</text><text x="800" y="765" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="27">Use the evidence, not a guess.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI03 • SkillrHub • skillrhub.com</text></svg>