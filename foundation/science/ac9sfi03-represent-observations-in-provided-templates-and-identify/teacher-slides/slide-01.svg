<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Scientists record what they observe</text><text x="90" y="225" fill="#475569" font-family="Arial" font-size="28">Look carefully, then put what you noticed into a simple record.</text><circle cx="330" cy="470" r="120" fill="#fde68a"/><circle cx="300" cy="440" r="12" fill="#0f172a"/><circle cx="360" cy="440" r="12" fill="#0f172a"/><path d="M285 505 Q330 545 375 505" fill="none" stroke="#0f172a" stroke-width="8"/><text x="330" y="650" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="34" font-weight="700">OBSERVE</text><path d="M500 470 H650" stroke="#64748b" stroke-width="12"/><polygon points="650,470 610,440 610,500" fill="#64748b"/><rect x="700" y="310" width="700" height="390" rx="28" fill="#fff" stroke="#94a3b8" stroke-width="4"/><line x1="700" y1="405" x2="1400" y2="405" stroke="#cbd5e1" stroke-width="4"/><line x1="930" y1="310" x2="930" y2="700" stroke="#cbd5e1" stroke-width="4"/><text x="815" y="370" text-anchor="middle" fill="#334155" font-family="Arial" font-size="30" font-weight="700">What?</text><text x="1165" y="370" text-anchor="middle" fill="#334155" font-family="Arial" font-size="30" font-weight="700">What I noticed</text><text x="815" y="485" text-anchor="middle" fill="#166534" font-family="Arial" font-size="29">leaf</text><text x="1165" y="485" text-anchor="middle" fill="#166534" font-family="Arial" font-size="29">green • smooth</text><text x="815" y="585" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="29">rock</text><text x="1165" y="585" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="29">grey • rough</text><rect x="90" y="735" width="1420" height="70" rx="20" fill="#ecfdf5"/><text x="800" y="780" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">A record can use drawings, marks, words or numbers.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI03 • SkillrHub • skillrhub.com</text></svg>