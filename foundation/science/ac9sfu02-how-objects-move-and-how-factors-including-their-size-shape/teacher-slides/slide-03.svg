<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 5</text><text x="90" y="165" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Surface can change how far something moves</text><g transform="translate(120 300)"><rect width="620" height="390" rx="30" fill="#ecfdf5"/><rect x="80" y="260" width="470" height="28" rx="14" fill="#94a3b8"/><circle cx="145" cy="205" r="58" fill="#34d399"/><path d="M220 205 H470" stroke="#059669" stroke-width="14"/><polygon points="470,205 425,180 425,230" fill="#059669"/><text x="310" y="345" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">Smooth surface → travels farther</text></g><g transform="translate(860 300)"><rect width="620" height="390" rx="30" fill="#fff7ed"/><path d="M80 275 L115 245 L150 275 L185 245 L220 275 L255 245 L290 275 L325 245 L360 275 L395 245 L430 275 L465 245 L500 275 L535 245" fill="none" stroke="#92400e" stroke-width="18"/><circle cx="145" cy="205" r="58" fill="#fb923c"/><path d="M220 205 H360" stroke="#c2410c" stroke-width="14"/><polygon points="360,205 315,180 315,230" fill="#c2410c"/><text x="310" y="345" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="30" font-weight="700">Rough surface → stops sooner</text></g><rect x="260" y="735" width="1080" height="80" rx="22" fill="#eef6ff"/><text x="800" y="786" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="30" font-weight="700">Fair test: keep the object and push the same; change only the surface.</text><rect y="845" width="1600" height="55" fill="#173a72"/><text x="70" y="882" fill="#fff" font-family="Arial" font-size="24" font-weight="700">AC9SFU02 • SkillrHub • skillrhub.com</text></svg>