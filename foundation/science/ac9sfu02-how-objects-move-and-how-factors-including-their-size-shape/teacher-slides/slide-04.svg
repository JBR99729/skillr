<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">4 / 5</text><text x="90" y="165" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Try a ramp: observe before you explain</text><polygon points="250,620 250,330 820,620" fill="#dbeafe" stroke="#60a5fa" stroke-width="5"/><circle cx="370" cy="385" r="62" fill="#2563eb"/><path d="M430 420 L690 570" stroke="#1d4ed8" stroke-width="14"/><polygon points="690,570 640,568 663,527" fill="#1d4ed8"/><g font-family="Arial" font-size="28" font-weight="700"><rect x="900" y="300" width="500" height="110" rx="22" fill="#ecfdf5"/><text x="950" y="350" fill="#166534">1. Predict</text><text x="950" y="385" fill="#0f172a" font-weight="400">What do you think will happen?</text><rect x="900" y="440" width="500" height="110" rx="22" fill="#eff6ff"/><text x="950" y="490" fill="#1d4ed8">2. Observe</text><text x="950" y="525" fill="#0f172a" font-weight="400">What did you actually see?</text><rect x="900" y="580" width="500" height="110" rx="22" fill="#fff7ed"/><text x="950" y="630" fill="#9a3412">3. Compare</text><text x="950" y="665" fill="#0f172a" font-weight="400">Was your prediction the same?</text></g><rect x="250" y="735" width="1100" height="80" rx="22" fill="#fef3c7"/><text x="800" y="786" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="30" font-weight="700">Change one thing: a steeper ramp, a different object, or a different surface.</text><rect y="845" width="1600" height="55" fill="#173a72"/><text x="70" y="882" fill="#fff" font-family="Arial" font-size="24" font-weight="700">AC9SFU02 • SkillrHub • skillrhub.com</text></svg>