<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">5 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">Quick scientist check</text><g font-family="Arial"><rect x="120" y="300" width="1360" height="110" rx="22" fill="#fef3c7"/><text x="170" y="370" font-size="30" font-weight="700" fill="#92400e">1.</text><text x="235" y="370" font-size="30" fill="#0f172a">Ask one question about what might happen to ice in the sun.</text><rect x="120" y="450" width="1360" height="110" rx="22" fill="#ecfdf5"/><text x="170" y="520" font-size="30" font-weight="700" fill="#166534">2.</text><text x="235" y="520" font-size="30" fill="#0f172a">Make a prediction using “I think ___ because ___.”</text><rect x="120" y="600" width="1360" height="110" rx="22" fill="#eff6ff"/><text x="170" y="670" font-size="30" font-weight="700" fill="#1d4ed8">3.</text><text x="235" y="670" font-size="30" fill="#0f172a">What should you do after making the prediction?</text></g><rect x="180" y="735" width="1240" height="60" rx="18" fill="#fff7ed"/><text x="800" y="775" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="28" font-weight="700">Question → Predict → Check</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI01 • SkillrHub • skillrhub.com</text></svg>