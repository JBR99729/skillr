<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">A prediction is not a guess with no reason</text><g font-family="Arial"><rect x="140" y="315" width="580" height="360" rx="30" fill="#fee2e2"/><text x="430" y="385" text-anchor="middle" fill="#b91c1c" font-size="34" font-weight="700">WEAK</text><text x="430" y="490" text-anchor="middle" fill="#0f172a" font-size="42">“The red one.”</text><text x="430" y="565" text-anchor="middle" fill="#475569" font-size="28">No reason given.</text><rect x="880" y="315" width="580" height="360" rx="30" fill="#dcfce7"/><text x="1170" y="385" text-anchor="middle" fill="#166534" font-size="34" font-weight="700">STRONGER</text><text x="1170" y="475" text-anchor="middle" fill="#0f172a" font-size="36">“I think the larger ball</text><text x="1170" y="525" text-anchor="middle" fill="#0f172a" font-size="36">will roll farther because</text><text x="1170" y="575" text-anchor="middle" fill="#0f172a" font-size="36">I saw that happen before.”</text></g><rect x="180" y="720" width="1240" height="75" rx="20" fill="#fef3c7"/><text x="800" y="768" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="30" font-weight="700">Use: “I think ___ because ___.”</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI01 • SkillrHub • skillrhub.com</text></svg>