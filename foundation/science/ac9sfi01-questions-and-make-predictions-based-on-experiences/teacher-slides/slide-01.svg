<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Ask a question. Make a prediction.</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">A prediction is what you think will happen before you check.</text><rect x="150" y="330" width="500" height="300" rx="28" fill="#fef3c7"/><text x="400" y="400" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="34" font-weight="700">QUESTION</text><text x="400" y="500" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="38">Will the ball roll farther</text><text x="400" y="550" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="38">on the smooth surface?</text><rect x="950" y="330" width="500" height="300" rx="28" fill="#ecfdf5"/><text x="1200" y="400" text-anchor="middle" fill="#166534" font-family="Arial" font-size="34" font-weight="700">PREDICTION</text><text x="1200" y="500" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="38">I think it will roll farther</text><text x="1200" y="550" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="38">because it feels smoother.</text><path d="M680 480 H910" stroke="#64748b" stroke-width="14"/><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI01 • SkillrHub • skillrhub.com</text></svg>