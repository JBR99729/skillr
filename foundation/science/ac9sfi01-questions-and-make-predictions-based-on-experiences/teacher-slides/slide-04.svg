<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">4 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">Then check what really happens</text><g font-family="Arial" text-anchor="middle"><rect x="120" y="330" width="380" height="300" rx="28" fill="#fef3c7"/><text x="310" y="405" font-size="30" font-weight="700" fill="#92400e">QUESTION</text><text x="310" y="510" font-size="34" fill="#0f172a">Which rolls farther?</text><rect x="610" y="330" width="380" height="300" rx="28" fill="#ecfdf5"/><text x="800" y="405" font-size="30" font-weight="700" fill="#166534">PREDICT</text><text x="800" y="500" font-size="32" fill="#0f172a">“I think the ball</text><text x="800" y="545" font-size="32" fill="#0f172a">on smooth ground.”</text><rect x="1100" y="330" width="380" height="300" rx="28" fill="#eff6ff"/><text x="1290" y="405" font-size="30" font-weight="700" fill="#1d4ed8">CHECK</text><text x="1290" y="500" font-size="32" fill="#0f172a">Try it safely.</text><text x="1290" y="545" font-size="32" fill="#0f172a">Observe the result.</text></g><path d="M510 480 H590 M1000 480 H1080" stroke="#64748b" stroke-width="12"/><rect x="180" y="710" width="1240" height="80" rx="20" fill="#ecfdf5"/><text x="800" y="760" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">Predictions do not have to be right — checking helps us learn.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI01 • SkillrHub • skillrhub.com</text></svg>