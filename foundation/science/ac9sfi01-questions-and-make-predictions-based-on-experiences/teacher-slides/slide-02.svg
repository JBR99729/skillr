<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 5</text><text x="90" y="175" fill="#14532d" font-family="Arial" font-size="50" font-weight="700">Use what you already know</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Predictions can come from past experiences.</text><g font-family="Arial" text-anchor="middle"><rect x="130" y="330" width="400" height="320" rx="28" fill="#eff6ff"/><text x="330" y="395" font-size="31" font-weight="700" fill="#1d4ed8">PAST EXPERIENCE</text><circle cx="330" cy="500" r="75" fill="#60a5fa"/><text x="330" y="615" font-size="27" fill="#0f172a">Ice melted in the sun.</text><rect x="600" y="330" width="400" height="320" rx="28" fill="#fef3c7"/><text x="800" y="395" font-size="31" font-weight="700" fill="#92400e">NEW QUESTION</text><text x="800" y="515" font-size="38" font-weight="700" fill="#0f172a">Which ice cube</text><text x="800" y="565" font-size="38" font-weight="700" fill="#0f172a">will melt first?</text><rect x="1070" y="330" width="400" height="320" rx="28" fill="#ecfdf5"/><text x="1270" y="395" font-size="31" font-weight="700" fill="#166534">PREDICT</text><text x="1270" y="505" font-size="36" fill="#0f172a">The one in the sun</text><text x="1270" y="555" font-size="36" fill="#0f172a">will melt first.</text></g><rect x="180" y="710" width="1240" height="80" rx="20" fill="#ecfdf5"/><text x="800" y="760" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">A good prediction gives a reason.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFI01 • SkillrHub • skillrhub.com</text></svg>