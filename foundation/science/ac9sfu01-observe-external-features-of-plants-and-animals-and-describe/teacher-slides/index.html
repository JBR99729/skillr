 class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU01</p><span>4 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E4: sorting collections of model animals and explaining different grouping strategies.</li><li>Learn: Observe → Name features → Compare → Group → Explain Goal: identify external features of plants and animals and explain a sensible grouping rule using what can be seen.</li><li>Teach It: Look closely at visible features</li></ul></div><footer>AC9SFU01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU01</p><span>5 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>Apply the Idea: Group by an observable rule: Body covering Group animals as feathers / fur / scales . Movement feature Group animals by visible features such as wings / fins / legs . Plant feature Group plants by visible features such as flowers / no flowers or broad / narrow leaves . Important: more than one sensible grouping rule can be correct. The student should state the rule and use visible evidence.</li></ul></div><footer>AC9SFU01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU01</p><span>6 / 10</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about living things and external features?</dt><dd>Living Things and External Features</dd><dt>Which model or example can show living things and external features?</dt><dd>Learn: Observe → Name features → Compare → Group → Explain Goal: identify external features of plants and animals and explain a sensible grouping rule using what can be seen.</dd></dl></div><footer>AC9SFU01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU01</p><span>7 / 10</span></header><div class="slide-content"><h2>Important questions and answers 2</h2><dl><dt>What common mistake should be corrected when learning about living things and external features?</dt><dd>Teach It: Look closely at visible features</dd><dt>What routine can students use for living things and external features?</dt><dd>More than one grouping can be correct when each uses a consistent observable rule.</dd></dl></div><footer>AC9SFU01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="assessment" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFU01</p><span>8 / 10</span></header><div class="slide-content"><h2>Assessment-style questions and review hints 1</h2><div class="two-column"><section><h3>Questions</h3><ul><li>What is the key idea when learning about living things and external features?</li><li>Which model or example can show living things and external features?</li></ul></section><section><h3>Review hints</h3><ul><li>An external feature is visible on the outside of a plant or animal.</li><li>Observe first: describe only what
