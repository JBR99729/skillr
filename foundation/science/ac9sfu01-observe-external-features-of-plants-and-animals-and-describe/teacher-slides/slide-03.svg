<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9SFU01 — Features have jobs</title><desc id="d">Simple visual examples connecting external features with functions.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".05" fill="#166534" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="290" transform="rotate(-18 100 290)">SkillrHub • skillrhub.com</text><text x="850" y="650" transform="rotate(-18 850 650)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 5</text><text x="90" y="165" fill="#14532d" font-family="Arial" font-size="48" font-weight="700">Features have jobs</text><text x="90" y="215" fill="#475569" font-family="Arial" font-size="27">Observe the feature. Then ask: how might it help?</text><rect x="90" y="275" width="440" height="420" rx="28" fill="#eff6ff"/><text x="310" y="330" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="32" font-weight="700">DUCK FEET</text><path d="M210 470 Q310 385 410 470 Q355 485 330 535 Q300 495 270 535 Q250 490 210 470" fill="#f59e0b"/><path d="M310 400 L310 485" stroke="#92400e" stroke-width="16"/><text x="310" y="600" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">webbed feet</text><text x="310" y="642" text-anchor="middle" fill="#334155" font-family="Arial" font-size="25">help push through water</text><rect x="580" y="275" width="440" height="420" rx="28" fill="#ecfdf5"/><text x="800" y="330" text-anchor="middle" fill="#166534" font-family="Arial" font-size="32" font-weight="700">PLANT ROOTS</text><line x1="800" y1="385" x2="800" y2="505" stroke="#166534" stroke-width="18"/><path d="M800 500 C735 555 700 585 665 635 M800 500 C865 555 900 585 935 635 M800 530 C760 585 755 610 750 650 M800 530 C840 585 845 610 850 650" fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round"/><text x="800" y="600" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">roots</text><text x="800" y="642" text-anchor="middle" fill="#334155" font-family="Arial" font-size="25">hold the plant and take in water</text><rect x="1070" y="275" width="440" height="420" rx="28" fill="#fff7ed"/><text x="1290" y="330" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="32" font-weight="700">RABBIT EARS</text><ellipse cx="1245" cy="450" rx="42" ry="125" fill="#d6d3d1" transform="rotate(-10 1245 450)"/><ellipse cx="1335" cy="450" rx="42" ry="125" fill="#d6d3d1" transform="rotate(10 1335 450)"/><circle cx="1290" cy="555" r="80" fill="#d6d3d1"/><text x="1290" y="625" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">large ears</text><text x="1290" y="667" text-anchor="middle" fill="#334155" font-family="Arial" font-size="25">help detect sounds</text><rect x="90" y="735" width="1420" height="80" rx="20" fill="#fefce8"/><text x="800" y="785" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="30" font-weight="700">Choose another feature: “I observe ___ . It may help ___.”</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFU01 • SkillrHub • skillrhub.com</text></svg>