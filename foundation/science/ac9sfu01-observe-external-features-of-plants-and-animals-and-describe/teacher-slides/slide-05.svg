<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9SFU01 — Quick scientist check</title><desc id="d">Final visual observation check for external features.</desc><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">5 / 5</text><text x="90" y="165" fill="#14532d" font-family="Arial" font-size="48" font-weight="700">Quick scientist check</text><text x="90" y="215" fill="#475569" font-family="Arial" font-size="27">Observe first. Then explain.</text><circle cx="800" cy="450" r="155" fill="#fde68a"/><ellipse cx="690" cy="385" rx="55" ry="135" fill="#d6d3d1" transform="rotate(-15 690 385)"/><ellipse cx="910" cy="385" rx="55" ry="135" fill="#d6d3d1" transform="rotate(15 910 385)"/><circle cx="750" cy="450" r="13" fill="#0f172a"/><circle cx="850" cy="450" r="13" fill="#0f172a"/><ellipse cx="800" cy="515" rx="45" ry="28" fill="#fb7185"/><rect x="130" y="300" width="400" height="110" rx="22" fill="#eff6ff"/><text x="330" y="345" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="27" font-weight="700">1. OBSERVE</text><text x="330" y="382" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">Name 2 visible features.</text><rect x="1070" y="300" width="400" height="110" rx="22" fill="#ecfdf5"/><text x="1270" y="345" text-anchor="middle" fill="#166534" font-family="Arial" font-size="27" font-weight="700">2. EXPLAIN</text><text x="1270" y="382" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">What might one feature help with?</text><rect x="130" y="590" width="1340" height="125" rx="24" fill="#fff7ed"/><text x="800" y="642" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="29" font-weight="700">Say it like a scientist:</text><text x="800" y="687" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="30">“I observe ______. I think it may help ______.”</text><rect x="300" y="750" width="1000" height="65" rx="18" fill="#dcfce7"/><text x="800" y="792" text-anchor="middle" fill="#166534" font-family="Arial" font-size="27" font-weight="700">Next: practise identifying and explaining external features.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9SFU01 • SkillrHub • skillrhub.com</text></svg>