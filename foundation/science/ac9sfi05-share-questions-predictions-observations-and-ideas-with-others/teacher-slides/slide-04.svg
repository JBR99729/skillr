<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Science sharing goes both ways</text><g font-family="Arial" text-anchor="middle"><rect x="150" y="330" width="380" height="300" rx="28" fill="#eff6ff"/><text x="340" y="410" fill="#1d4ed8" font-size="34" font-weight="700">1. SHARE</text><text x="340" y="500" fill="#334155" font-size="28">tell your observation</text><rect x="610" y="330" width="380" height="300" rx="28" fill="#ecfdf5"/><text x="800" y="410" fill="#166534" font-size="34" font-weight="700">2. LISTEN</text><text x="800" y="500" fill="#334155" font-size="28">hear another idea</text><rect x="1070" y="330" width="380" height="300" rx="28" fill="#fdf2f8"/><text x="1260" y="410" fill="#be185d" font-size="34" font-weight="700">3. RESPOND</text><text x="1260" y="485" fill="#334155" font-size="27">“I noticed that too.”</text><text x="1260" y="530" fill="#334155" font-size="27">“Mine was different…”</text></g><rect x="250" y="710" width="1100" height="90" rx="22" fill="#fefce8"/><text x="800" y="765" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="30" font-weight="700">Different observations can help the class learn more.</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>