<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Share the observation, not just the answer</text><rect x="140" y="315" width="580" height="350" rx="30" fill="#fff7ed"/><text x="430" y="390" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="32" font-weight="700">TOO VAGUE</text><text x="430" y="500" text-anchor="middle" fill="#334155" font-family="Arial" font-size="31">“It was different.”</text><rect x="880" y="315" width="580" height="350" rx="30" fill="#ecfdf5"/><text x="1170" y="390" text-anchor="middle" fill="#166534" font-family="Arial" font-size="32" font-weight="700">CLEAR SCIENCE SHARE</text><text x="1170" y="475" text-anchor="middle" fill="#334155" font-family="Arial" font-size="28">“I observed the wet sponge</text><text x="1170" y="520" text-anchor="middle" fill="#334155" font-family="Arial" font-size="28">was heavier than the dry sponge.”</text><rect x="240" y="720" width="1120" height="80" rx="22" fill="#eff6ff"/><text x="800" y="770" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="30" font-weight="700">Useful sharing includes what you actually noticed.</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>