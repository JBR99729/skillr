<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">There are many ways to share</text><g font-family="Arial" text-anchor="middle"><rect x="130" y="320" width="400" height="350" rx="28" fill="#eff6ff"/><text x="330" y="395" fill="#1d4ed8" font-size="34" font-weight="700">SAY IT</text><path d="M250 470 q80 -90 160 0 q-80 90 -160 0" fill="#bfdbfe"/><text x="330" y="610" fill="#334155" font-size="27">tell a partner or class</text><rect x="600" y="320" width="400" height="350" rx="28" fill="#ecfdf5"/><text x="800" y="395" fill="#166534" font-size="34" font-weight="700">DRAW IT</text><rect x="700" y="445" width="200" height="120" fill="white" stroke="#86efac" stroke-width="4"/><circle cx="800" cy="505" r="38" fill="#fde68a"/><text x="800" y="610" fill="#334155" font-size="27">picture + labels</text><rect x="1070" y="320" width="400" height="350" rx="28" fill="#fff7ed"/><text x="1270" y="395" fill="#9a3412" font-size="34" font-weight="700">SHOW IT</text><rect x="1170" y="450" width="200" height="105" rx="15" fill="#fdba74"/><text x="1270" y="610" fill="#334155" font-size="27">object • model • record</text></g><rect x="250" y="720" width="1100" height="80" rx="22" fill="#fefce8"/><text x="800" y="770" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="30" font-weight="700">Choose the way that helps others understand your idea.</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>