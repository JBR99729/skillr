<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Prediction → Observation → Compare</text><text x="90" y="235" fill="#475569" font-family="Arial" font-size="29">A prediction is what you think will happen. An observation is what actually happened.</text><rect x="120" y="330" width="400" height="300" rx="28" fill="#fff7ed"/><text x="320" y="400" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="34" font-weight="700">PREDICT</text><text x="320" y="490" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">“I think the ball</text><text x="320" y="530" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">will roll far.”</text><rect x="600" y="330" width="400" height="300" rx="28" fill="#eff6ff"/><text x="800" y="400" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700">OBSERVE</text><circle cx="735" cy="500" r="45" fill="#60a5fa"/><path d="M800 500 H900" stroke="#1d4ed8" stroke-width="10"/><text x="800" y="585" text-anchor="middle" fill="#334155" font-family="Arial" font-size="27">watch what happens</text><rect x="1080" y="330" width="400" height="300" rx="28" fill="#ecfdf5"/><text x="1280" y="400" text-anchor="middle" fill="#166534" font-family="Arial" font-size="34" font-weight="700">COMPARE</text><text x="1280" y="490" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">same?</text><text x="1280" y="540" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">different?</text><rect x="220" y="700" width="1160" height="90" rx="22" fill="#fefce8"/><text x="800" y="755" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="31" font-weight="700">Scientists do not change the observation to make a prediction “right”.</text><rect y="835" width="1600" height="65" fill="#14532d"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9SFI04 • SkillrHub • skillrhub.com</text></svg>