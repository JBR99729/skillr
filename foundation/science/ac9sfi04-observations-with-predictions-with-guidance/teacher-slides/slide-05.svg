<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Quick scientist check</text><text x="90" y="235" fill="#475569" font-family="Arial" font-size="29">Prediction: “The big ball will roll farther.”</text><rect x="180" y="320" width="1240" height="300" rx="28" fill="#eff6ff"/><text x="800" y="390" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="31" font-weight="700">Observation</text><circle cx="500" cy="500" r="55" fill="#60a5fa"/><path d="M580 500 H850" stroke="#1d4ed8" stroke-width="10"/><circle cx="980" cy="500" r="35" fill="#f59e0b"/><path d="M1040 500 H1160" stroke="#9a3412" stroke-width="10"/><text x="800" y="585" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">The big ball travelled farther than the small ball.</text><rect x="220" y="690" width="1160" height="115" rx="22" fill="#ecfdf5"/><text x="800" y="738" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">Did the observation match the prediction?</text><text x="800" y="780" text-anchor="middle" fill="#166534" font-family="Arial" font-size="28">Answer and point to the evidence.</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>