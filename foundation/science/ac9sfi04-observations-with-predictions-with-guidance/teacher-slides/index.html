he prediction with the observation. A different result is useful because it helps us update our thinking.</li></ul></div><footer>AC9SFI04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFI04</p><span>4 / 9</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E3: using a provided table to draw or dictate their prediction and their observation and identifying whether they are the same or different Learning connection: After an investigation, compare the prediction with the observation. A different result is useful because it helps us update our thinking.</li><li>Prediction and observation have different jobs: Prediction: “The large marble will roll farther.” Observation: “The small marble rolled farther.” Compare: The observation was different from the prediction. Think aloud: Describe what is observed first, then use that evidence to explain the idea.</li><li>Use evidence, not embarrassment: We do not change the prediction after the test. We keep it, record the observation and explain whether they matched.</li></ul></div><footer>AC9SFI04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Science • AC9SFI04</p><span>5 / 9</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about compare predictions and observations?</dt><dd>compare observations with predictions with guidance</dd><dt>Which model or example can show compare predictions and observations?</dt><
