<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Compare with guidance</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="330" width="300" height="260" rx="28" fill="#fff7ed"/><text x="250" y="405" fill="#9a3412" font-size="32" font-weight="700">1. REMEMBER</text><text x="250" y="490" fill="#334155" font-size="27">What did I predict?</text><rect x="470" y="330" width="300" height="260" rx="28" fill="#eff6ff"/><text x="620" y="405" fill="#1d4ed8" font-size="32" font-weight="700">2. LOOK</text><text x="620" y="490" fill="#334155" font-size="27">What happened?</text><rect x="840" y="330" width="300" height="260" rx="28" fill="#ecfdf5"/><text x="990" y="405" fill="#166534" font-size="32" font-weight="700">3. COMPARE</text><text x="990" y="490" fill="#334155" font-size="27">Same or different?</text><rect x="1210" y="330" width="300" height="260" rx="28" fill="#fdf2f8"/><text x="1360" y="405" fill="#be185d" font-size="32" font-weight="700">4. EXPLAIN</text><text x="1360" y="490" fill="#334155" font-size="27">What is the evidence?</text></g><rect x="260" y="690" width="1080" height="110" rx="22" fill="#fefce8"/><text x="800" y="738" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="30" font-weight="700">Teacher guidance can be a question, picture, pointing cue or sentence starter.</text><text x="800" y="777" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="27">The student still uses the observation to answer.</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>