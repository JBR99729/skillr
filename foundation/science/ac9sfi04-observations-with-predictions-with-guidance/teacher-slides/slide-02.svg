<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#14532d"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Science</text><text x="90" y="180" fill="#14532d" font-family="Arial" font-size="52" font-weight="700">Was your prediction the same as the observation?</text><rect x="150" y="300" width="570" height="370" rx="30" fill="#ecfdf5"/><text x="435" y="370" text-anchor="middle" fill="#166534" font-family="Arial" font-size="34" font-weight="700">SAME</text><text x="435" y="460" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">Prediction: ice will melt</text><text x="435" y="515" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">Observation: ice melted</text><text x="435" y="600" text-anchor="middle" fill="#166534" font-family="Arial" font-size="32" font-weight="700">✓ matched</text><rect x="880" y="300" width="570" height="370" rx="30" fill="#fff7ed"/><text x="1165" y="370" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="34" font-weight="700">DIFFERENT</text><text x="1165" y="460" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">Prediction: block will roll</text><text x="1165" y="515" text-anchor="middle" fill="#334155" font-family="Arial" font-size="29">Observation: block slid</text><text x="1165" y="600" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="32" font-weight="700">That is useful too!</text><rect x="260" y="720" width="1080" height="80" rx="22" fill="#eff6ff"/><text x="800" y="770" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="30" font-weight="700">Say: “I predicted ___. I observed ___. They were same/different.”</text><rect y="835" width="1600" height="65" fill="#14532d"/></svg>