<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY06 — Edit a sentence about an event</title><desc id="d">Say the idea, draft it, reread and edit sentence boundaries.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Say → draft → reread → edit</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Editing helps the reader see where the sentence starts and ends.</text><g font-family="Arial"><rect x="85" y="335" width="330" height="220" rx="26" fill="#e8eef9"/><text x="250" y="390" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">1. SAY IDEA</text><text x="250" y="465" text-anchor="middle" fill="#0f172a" font-size="28">Sam fed</text><text x="250" y="505" text-anchor="middle" fill="#0f172a" font-size="28">the class cat.</text><rect x="455" y="335" width="330" height="220" rx="26" fill="#fff7e6"/><text x="620" y="390" text-anchor="middle" fill="#9a5b00" font-size="26" font-weight="700">2. DRAFT</text><text x="620" y="475" text-anchor="middle" fill="#0f172a" font-size="34">sam fed the cat</text><rect x="825" y="335" width="330" height="220" rx="26" fill="#eefbf4"/><text x="990" y="390" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">3. REREAD</text><text x="990" y="455" text-anchor="middle" fill="#0f172a" font-size="28">Does it say</text><text x="990" y="495" text-anchor="middle" fill="#0f172a" font-size="28">the whole idea?</text><rect x="1195" y="335" width="320" height="220" rx="26" fill="#e8eef9"/><text x="1355" y="390" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">4. EDIT</text><text x="1355" y="455" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">Sam fed the cat.</text><text x="1355" y="505" text-anchor="middle" fill="#475569" font-size="24">capital + full stop</text><text x="430" y="465" fill="#64748b" font-size="36">→</text><text x="800" y="465" fill="#64748b" font-size="36">→</text><text x="1170" y="465" fill="#64748b" font-size="36">→</text></g><rect x="285" y="590" width="1030" height="70" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="635" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Editing changes the writing — not the event we want to report.</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">What two sentence-boundary edits changed the draft into the finished sentence?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY06 • SkillrHub • skillrhub.com</text></svg>