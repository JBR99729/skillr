<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY06 — Spell a CVC word inside a sentence</title><desc id="d">Segment cat into three sounds, map the letters and use the word in a complete observation.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Spell a CVC word inside real writing</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Say the word slowly, hear each sound, write its letter, then reread the whole sentence.</text><g font-family="Arial"><rect x="100" y="330" width="315" height="220" rx="26" fill="#e8eef9"/><text x="258" y="385" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">SAY</text><text x="258" y="472" text-anchor="middle" fill="#0f172a" font-size="50" font-weight="700">cat</text><rect x="475" y="330" width="315" height="220" rx="26" fill="#eefbf4"/><text x="633" y="385" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">SEGMENT</text><text x="633" y="472" text-anchor="middle" fill="#0f172a" font-size="40">/c/ /a/ /t/</text><rect x="850" y="330" width="315" height="220" rx="26" fill="#fff7e6"/><text x="1008" y="385" text-anchor="middle" fill="#9a5b00" font-size="26" font-weight="700">MAP</text><text x="1008" y="472" text-anchor="middle" fill="#0f172a" font-size="50" font-weight="700">c  a  t</text><rect x="1225" y="330" width="285" height="220" rx="26" fill="#e8eef9"/><text x="1368" y="385" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">USE</text><text x="1368" y="448" text-anchor="middle" fill="#0f172a" font-size="27">We saw</text><text x="1368" y="488" text-anchor="middle" fill="#0f172a" font-size="27">a cat.</text><text x="445" y="458" fill="#64748b" font-size="36">→</text><text x="820" y="458" fill="#64748b" font-size="36">→</text><text x="1195" y="458" fill="#64748b" font-size="36">→</text></g><rect x="280" y="590" width="1040" height="72" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="637" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Word spelling works inside a meaningful sentence.</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">Say “cat” slowly. What three sounds do you hear, and which letters write them?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY06 • SkillrHub • skillrhub.com</text></svg>