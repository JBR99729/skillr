<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA08 — Grow a word from meaning to use</title><desc id="d">Build vocabulary through word, meaning and use.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Grow a word from meaning to use</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">A useful word becomes stronger when we know what it means and use it.</text><g font-family="Arial"><rect x="90" y="330" width="410" height="215" rx="28" fill="#e8eef9"/><text x="295" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">1. WORD</text><text x="295" y="470" text-anchor="middle" fill="#0f172a" font-size="48" font-weight="700">observe</text><rect x="595" y="330" width="410" height="215" rx="28" fill="#eefbf4"/><text x="800" y="385" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">2. MEANING</text><text x="800" y="465" text-anchor="middle" fill="#0f172a" font-size="35">look carefully</text><rect x="1100" y="330" width="410" height="215" rx="28" fill="#fff7e6"/><text x="1305" y="385" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">3. USE IT</text><text x="1305" y="448" text-anchor="middle" fill="#0f172a" font-size="29">“I observe tiny</text><text x="1305" y="488" text-anchor="middle" fill="#0f172a" font-size="29">spots on the leaf.”</text><text x="547" y="450" fill="#64748b" font-size="42">→</text><text x="1052" y="450" fill="#64748b" font-size="42">→</text></g><rect x="90" y="585" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="628" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="666" fill="#0f172a" font-family="Arial" font-size="27">What does “observe” mean in “We observe the snail closely”? What clue helps?</text><rect x="90" y="710" width="1420" height="95" rx="22" fill="#ecfdf5"/><text x="130" y="751" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="786" fill="#0f172a" font-family="Arial" font-size="25">Say the word, connect it to a simple meaning, then model it in a new familiar sentence.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA08 • SkillrHub • skillrhub.com</text></svg>