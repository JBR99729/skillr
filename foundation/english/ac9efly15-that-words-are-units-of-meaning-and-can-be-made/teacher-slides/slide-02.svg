<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY15 — Words can contain meaningful parts</title><desc id="d">Show how dog keeps its meaning inside dogs and how s adds the meaning more than one.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">A word can keep its meaning and gain another part</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Split the word into meaningful parts and explain what each part contributes.</text><g font-family="Arial"><rect x="140" y="340" width="500" height="260" rx="30" fill="#e8eef9"/><text x="390" y="410" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">BASE WORD</text><text x="390" y="510" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">dog</text><text x="390" y="570" text-anchor="middle" fill="#334155" font-size="27">means one kind of animal</text><rect x="730" y="340" width="300" height="260" rx="30" fill="#fff7e6"/><text x="880" y="410" text-anchor="middle" fill="#9a5b00" font-size="28" font-weight="700">ADDED PART</text><text x="880" y="510" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">s</text><text x="880" y="570" text-anchor="middle" fill="#334155" font-size="27">adds “more than one”</text><rect x="1120" y="340" width="340" height="260" rx="30" fill="#ecfdf5"/><text x="1290" y="410" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">NEW WORD</text><text x="1290" y="510" text-anchor="middle" fill="#0f172a" font-size="82" font-weight="700">dogs</text><text x="1290" y="570" text-anchor="middle" fill="#334155" font-size="27">more than one dog</text><path d="M660 470h50M1045 470h55" stroke="#173a72" stroke-width="8"/><text x="800" y="670" text-anchor="middle" fill="#173a72" font-size="52" font-weight="700">dog + s → dogs</text><rect x="90" y="705" width="1420" height="90" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="744" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="778" fill="#0f172a" font-size="28">What meaning does dog keep inside dogs? What new meaning does s add?</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY15 • SkillrHub • skillrhub.com</text></svg>