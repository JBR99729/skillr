<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY15 — Join meaningful words to make sunhat</title><desc id="d">Show how sun and hat combine to form the compound word sunhat.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 7</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Two complete words can join to make a new word</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Keep the meaning of both parts in mind as you work out the compound word.</text><g font-family="Arial"><rect x="130" y="345" width="410" height="255" rx="30" fill="#fff7e6"/><text x="335" y="410" text-anchor="middle" fill="#9a5b00" font-size="28" font-weight="700">WORD 1</text><text x="335" y="510" text-anchor="middle" fill="#0f172a" font-size="82" font-weight="700">sun</text><text x="335" y="570" text-anchor="middle" fill="#334155" font-size="27">sunlight / the sun</text><text x="620" y="505" fill="#173a72" font-size="80" font-weight="700">+</text><rect x="720" y="345" width="410" height="255" rx="30" fill="#e8eef9"/><text x="925" y="410" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">WORD 2</text><text x="925" y="510" text-anchor="middle" fill="#0f172a" font-size="82" font-weight="700">hat</text><text x="925" y="570" text-anchor="middle" fill="#334155" font-size="27">a covering for your head</text><path d="M1160 475h120" stroke="#173a72" stroke-width="8"/><path d="M1265 455l25 20-25 20" fill="none" stroke="#173a72" stroke-width="8"/><rect x="1300" y="345" width="250" height="255" rx="30" fill="#ecfdf5"/><text x="1425" y="410" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">NEW WORD</text><text x="1425" y="500" text-anchor="middle" fill="#0f172a" font-size="56" font-weight="700">sunhat</text><text x="1425" y="565" text-anchor="middle" fill="#334155" font-size="23">a hat worn for sun protection</text><text x="800" y="665" text-anchor="middle" fill="#173a72" font-size="52" font-weight="700">sun + hat → sunhat</text><rect x="90" y="705" width="1420" height="90" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="744" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="778" fill="#0f172a" font-size="28">Which two meaningful words join to make sunhat, and what does the new word mean?</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY15 • SkillrHub • skillrhub.com</text></svg>