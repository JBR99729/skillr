<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY07 — Use visual prompts to stay on topic</title><desc id="d">Use three ordered picture prompts as memory supports for a short spoken report.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Pictures can help you remember the order</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Use each picture as a memory clue, then speak in your own words.</text><g font-family="Arial"><rect x="120" y="340" width="400" height="220" rx="28" fill="#e8eef9"/><text x="320" y="395" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">1. BEFORE</text><text x="320" y="468" text-anchor="middle" fill="#0f172a" font-size="30">empty garden bed</text><rect x="600" y="340" width="400" height="220" rx="28" fill="#eefbf4"/><text x="800" y="395" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">2. THEN</text><text x="800" y="468" text-anchor="middle" fill="#0f172a" font-size="30">seed planted</text><rect x="1080" y="340" width="400" height="220" rx="28" fill="#fff7e6"/><text x="1280" y="395" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">3. NOW</text><text x="1280" y="468" text-anchor="middle" fill="#0f172a" font-size="30">small shoot</text><text x="560" y="465" fill="#64748b" font-size="42">→</text><text x="1040" y="465" fill="#64748b" font-size="42">→</text></g><rect x="250" y="595" width="1100" height="70" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="640" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Look → remember → speak. Do not just name the pictures.</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">Use the three prompts to give a short report. Which picture helps you begin?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY07 • SkillrHub • skillrhub.com</text></svg>