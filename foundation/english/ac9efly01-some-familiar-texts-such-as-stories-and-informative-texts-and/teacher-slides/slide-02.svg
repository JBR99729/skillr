<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY01 — Use cover clues to identify purpose</title><desc id="d">Compare story and informative text clues, then check inside the text.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Use cover clues to identify purpose</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Predict from the cover, then check the text inside.</text><g font-family="Arial"><rect x="110" y="330" width="640" height="245" rx="28" fill="#e8eef9"/><text x="430" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">STORY</text><text x="430" y="438" text-anchor="middle" fill="#0f172a" font-size="30">illustrated character</text><text x="430" y="480" text-anchor="middle" fill="#0f172a" font-size="30">+ adventure title</text><text x="430" y="530" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">purpose: entertain</text><rect x="850" y="330" width="640" height="245" rx="28" fill="#eefbf4"/><text x="1170" y="385" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">INFORMATIVE</text><text x="1170" y="438" text-anchor="middle" fill="#0f172a" font-size="30">photograph</text><text x="1170" y="480" text-anchor="middle" fill="#0f172a" font-size="30">+ labels / facts</text><text x="1170" y="530" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">purpose: inform</text></g><rect x="350" y="600" width="900" height="65" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="642" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">CHECK INSIDE: connected events or factual information?</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">Which clue suggests a story? What would you check inside to confirm?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY01 • SkillrHub • skillrhub.com</text></svg>