<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY01 — Identify the purpose of an everyday symbol</title><desc id="d">Use visible symbol clues to infer a practical message and purpose.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Identify the purpose of an everyday symbol</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Notice the symbol features, work out the message, then name its job.</text><g font-family="Arial"><rect x="120" y="340" width="400" height="220" rx="28" fill="#e8eef9"/><text x="320" y="395" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">CLUE 1</text><text x="320" y="470" text-anchor="middle" fill="#0f172a" font-size="31">running figure</text><rect x="600" y="340" width="400" height="220" rx="28" fill="#eefbf4"/><text x="800" y="395" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">CLUE 2</text><text x="800" y="450" text-anchor="middle" fill="#0f172a" font-size="31">arrow</text><text x="800" y="492" text-anchor="middle" fill="#0f172a" font-size="31">to doorway</text><rect x="1080" y="340" width="400" height="220" rx="28" fill="#fff7e6"/><text x="1280" y="395" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">PURPOSE</text><text x="1280" y="450" text-anchor="middle" fill="#0f172a" font-size="30">show people</text><text x="1280" y="492" text-anchor="middle" fill="#0f172a" font-size="30">the way out</text><text x="555" y="468" fill="#64748b" font-size="42">+</text><text x="1035" y="468" fill="#64748b" font-size="42">→</text></g><rect x="90" y="610" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="653" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="691" fill="#0f172a" font-family="Arial" font-size="27">What does the EXIT symbol help people do? Which visible feature gives the strongest clue?</text><rect x="90" y="735" width="1420" height="70" rx="22" fill="#ecfdf5"/><text x="130" y="779" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: connect feature → message → action instead of asking students to memorise the sign name.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY01 • SkillrHub • skillrhub.com</text></svg>