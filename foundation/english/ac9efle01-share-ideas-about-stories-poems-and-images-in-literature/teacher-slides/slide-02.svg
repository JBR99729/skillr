<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE01 — Make a respectful text-to-self connection</title><desc id="d">Connect one exact story experience to one personal experience without overgeneralising.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Make a respectful text-to-self connection</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Use one exact text clue, then compare it with one experience from your own life.</text><g font-family="Arial"><rect x="90" y="330" width="420" height="225" rx="28" fill="#e8eef9"/><text x="300" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">1. TEXT</text><text x="300" y="450" text-anchor="middle" fill="#0f172a" font-size="29">The child cooks</text><text x="300" y="490" text-anchor="middle" fill="#0f172a" font-size="29">with an aunt.</text><rect x="590" y="330" width="420" height="225" rx="28" fill="#eefbf4"/><text x="800" y="385" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">2. ME</text><text x="800" y="450" text-anchor="middle" fill="#0f172a" font-size="29">I cook with</text><text x="800" y="490" text-anchor="middle" fill="#0f172a" font-size="29">my grandparent.</text><rect x="1090" y="330" width="420" height="225" rx="28" fill="#fff7e6"/><text x="1300" y="385" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">3. CONNECTION</text><text x="1300" y="442" text-anchor="middle" fill="#0f172a" font-size="27">Similar:</text><text x="1300" y="480" text-anchor="middle" fill="#0f172a" font-size="27">both cook</text><text x="1300" y="518" text-anchor="middle" fill="#0f172a" font-size="27">with family.</text><text x="548" y="455" fill="#64748b" font-size="42">→</text><text x="1048" y="455" fill="#64748b" font-size="42">→</text></g><rect x="90" y="590" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="633" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="671" fill="#0f172a" font-family="Arial" font-size="27">The character eats outside with family. What connection could you make to your own life?</text><rect x="90" y="715" width="1420" height="90" rx="22" fill="#ecfdf5"/><text x="130" y="755" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="789" fill="#0f172a" font-family="Arial" font-size="25">Keep the response tied to this text and this learner: text clue → personal experience → similar/different.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE01 • SkillrHub • skillrhub.com</text></svg>