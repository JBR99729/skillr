<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE01 — Explain a difference without judging it</title><desc id="d">Compare a story experience with the reader's own experience using evidence and neutral language.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Explain a difference without judging it</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Different means “not the same” — not better or worse.</text><g font-family="Arial"><rect x="105" y="330" width="620" height="225" rx="28" fill="#e8eef9"/><text x="415" y="386" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">IN THE STORY</text><text x="415" y="448" text-anchor="middle" fill="#0f172a" font-size="30">A long trip to</text><text x="415" y="490" text-anchor="middle" fill="#0f172a" font-size="30">collect family mail.</text><rect x="875" y="330" width="620" height="225" rx="28" fill="#eefbf4"/><text x="1185" y="386" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">IN MY LIFE</text><text x="1185" y="448" text-anchor="middle" fill="#0f172a" font-size="30">A short walk to</text><text x="1185" y="490" text-anchor="middle" fill="#0f172a" font-size="30">the letterbox.</text><text x="800" y="463" text-anchor="middle" fill="#64748b" font-size="52">↔</text><rect x="365" y="575" width="870" height="82" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="627" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="700">Different because the journeys are different lengths.</text></g><rect x="90" y="680" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="720" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="755" fill="#0f172a" font-family="Arial" font-size="27">Choose “similar” or “different”. Which exact clue proves your comparison?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE01 • SkillrHub • skillrhub.com</text></svg>