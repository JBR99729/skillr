<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY13 — Spell dog</title><desc id="d">Map three speech sounds to d o g and blend to check the spelling.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Say the word → hear each sound → choose the letters</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Spelling starts from the sounds you can hear in the spoken word.</text><g font-family="Arial"><rect x="130" y="345" width="360" height="260" rx="30" fill="#e8eef9"/><rect x="620" y="345" width="360" height="260" rx="30" fill="#ecfdf5"/><rect x="1110" y="345" width="360" height="260" rx="30" fill="#fff7e6"/><text x="310" y="405" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">FIRST</text><text x="800" y="405" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">MIDDLE</text><text x="1290" y="405" text-anchor="middle" fill="#9a5b00" font-size="28" font-weight="700">FINAL</text><text x="310" y="510" text-anchor="middle" fill="#0f172a" font-size="68" font-weight="700">/d/ → d</text><text x="800" y="510" text-anchor="middle" fill="#0f172a" font-size="68" font-weight="700">/o/ → o</text><text x="1290" y="510" text-anchor="middle" fill="#0f172a" font-size="68" font-weight="700">/g/ → g</text><text x="800" y="665" text-anchor="middle" fill="#173a72" font-size="66" font-weight="700">d  o  g  →  dog</text><rect x="90" y="705" width="1420" height="90" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="745" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="778" fill="#0f172a" font-size="28">Which three sound positions do you hear in dog? Say them, spell them, then blend to check.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY13 • SkillrHub • skillrhub.com</text></svg>