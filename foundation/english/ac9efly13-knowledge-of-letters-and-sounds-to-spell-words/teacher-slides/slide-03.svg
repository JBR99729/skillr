<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY13 — Use a letter team in fish</title><desc id="d">Show three speech sounds mapped to four letters because sh represents one sound.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 7</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Sometimes two letters work together for one sound</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Count the speech sounds first; then choose the letters that represent them.</text><g font-family="Arial"><circle cx="390" cy="440" r="100" fill="#e8eef9"/><circle cx="800" cy="440" r="100" fill="#ecfdf5"/><circle cx="1210" cy="440" r="100" fill="#fff7e6"/><text x="390" y="460" text-anchor="middle" fill="#173a72" font-size="58" font-weight="700">/f/</text><text x="800" y="460" text-anchor="middle" fill="#166534" font-size="58" font-weight="700">/i/</text><text x="1210" y="460" text-anchor="middle" fill="#9a5b00" font-size="58" font-weight="700">/sh/</text><text x="390" y="585" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">f</text><text x="800" y="585" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">i</text><text x="1210" y="585" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">sh</text><text x="800" y="665" text-anchor="middle" fill="#173a72" font-size="62" font-weight="700">3 sounds → 4 letters → fish</text><rect x="90" y="705" width="1420" height="90" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="745" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="778" fill="#0f172a" font-size="28">Why does fish use four letters for only three speech sounds? Point to the letter team.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY13 • SkillrHub • skillrhub.com</text></svg>