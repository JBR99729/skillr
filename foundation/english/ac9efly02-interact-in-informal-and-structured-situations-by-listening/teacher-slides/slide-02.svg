<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY02 — Listen and take a turn</title><desc id="d">Show listen, wait, respond on topic and use a suitable partner voice.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Listen and take a turn</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Good interaction means hearing the whole idea, waiting, then responding to that idea.</text><g font-family="Arial"><rect x="80" y="335" width="340" height="220" rx="28" fill="#e8eef9"/><text x="250" y="390" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">1. LISTEN</text><text x="250" y="448" text-anchor="middle" fill="#0f172a" font-size="27">“My bean seed</text><text x="250" y="488" text-anchor="middle" fill="#0f172a" font-size="27">has two leaves.”</text><rect x="470" y="335" width="300" height="220" rx="28" fill="#fff7e6"/><text x="620" y="390" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">2. WAIT</text><text x="620" y="468" text-anchor="middle" fill="#0f172a" font-size="31">speaker finishes</text><rect x="820" y="335" width="400" height="220" rx="28" fill="#eefbf4"/><text x="1020" y="390" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">3. RESPOND</text><text x="1020" y="448" text-anchor="middle" fill="#0f172a" font-size="27">“My seed has</text><text x="1020" y="488" text-anchor="middle" fill="#0f172a" font-size="27">leaves too.”</text><rect x="1270" y="335" width="250" height="220" rx="28" fill="#e8eef9"/><text x="1395" y="390" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">VOICE</text><text x="1395" y="448" text-anchor="middle" fill="#0f172a" font-size="27">quiet</text><text x="1395" y="488" text-anchor="middle" fill="#0f172a" font-size="27">+ clear</text><text x="440" y="464" fill="#64748b" font-size="36">→</text><text x="790" y="464" fill="#64748b" font-size="36">→</text><text x="1240" y="464" fill="#64748b" font-size="36">→</text></g><rect x="90" y="605" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="648" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="686" fill="#0f172a" font-family="Arial" font-size="27">What did Mia say? Give one response that stays on the same topic.</text><rect x="90" y="730" width="1420" height="75" rx="22" fill="#ecfdf5"/><text x="130" y="777" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: evidence of listening = accurately recalling and responding, not one required body pose.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY02 • SkillrHub • skillrhub.com</text></svg>