<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY02 — Change volume for the audience</title><desc id="d">Use different suitable voice volumes for a nearby partner and a whole class.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Change volume for the audience</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">The message can stay the same while the voice changes for distance and audience size.</text><g font-family="Arial"><rect x="130" y="340" width="580" height="235" rx="28" fill="#eefbf4"/><text x="420" y="395" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">ONE NEARBY PARTNER</text><text x="420" y="458" text-anchor="middle" fill="#0f172a" font-size="31">quiet + clear</text><text x="420" y="510" text-anchor="middle" fill="#475569" font-size="25">only one person needs to hear</text><rect x="890" y="340" width="580" height="235" rx="28" fill="#e8eef9"/><text x="1180" y="395" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">WHOLE CLASS</text><text x="1180" y="458" text-anchor="middle" fill="#0f172a" font-size="31">clear + stronger</text><text x="1180" y="510" text-anchor="middle" fill="#475569" font-size="25">back row can hear comfortably</text><text x="800" y="465" text-anchor="middle" fill="#64748b" font-size="54">↔</text></g><rect x="300" y="610" width="1000" height="65" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="652" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Suitable volume = listeners can hear comfortably, not “as loud as possible”</text><rect x="90" y="700" width="1420" height="90" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="739" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="773" fill="#0f172a" font-family="Arial" font-size="27">Say the same greeting to a partner, then to the class. What changed, and why?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY02 • SkillrHub • skillrhub.com</text></svg>