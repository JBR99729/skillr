<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY11 — Match upper- and lower-case letters</title><desc id="d">Show that different letter shapes can share one letter name and common sound cue.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">One letter name can have two printed shapes</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Match the case pair, say the letter name, then connect the common sound cue.</text><g font-family="Arial"><rect x="160" y="335" width="520" height="260" rx="32" fill="#e8eef9"/><text x="420" y="395" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">UPPER + LOWER</text><text x="420" y="520" text-anchor="middle" fill="#0f172a" font-size="118" font-weight="700">A   a</text><rect x="920" y="335" width="520" height="260" rx="32" fill="#ecfdf5"/><text x="1180" y="395" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">SAME LETTER NAME</text><text x="1180" y="485" text-anchor="middle" fill="#0f172a" font-size="72" font-weight="700">“A”</text><text x="1180" y="545" text-anchor="middle" fill="#334155" font-size="28">short sound cue: apple</text><path d="M705 465h190" stroke="#173a72" stroke-width="8"/><path d="M880 445l25 20-25 20" fill="none" stroke="#173a72" stroke-width="8"/><rect x="90" y="660" width="1420" height="120" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-size="26" font-weight="700">Student check</text><text x="130" y="758" fill="#0f172a" font-size="30">What letter name do A and a share? Which cue word helps you remember its common short sound?</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY11 • SkillrHub • skillrhub.com</text></svg>