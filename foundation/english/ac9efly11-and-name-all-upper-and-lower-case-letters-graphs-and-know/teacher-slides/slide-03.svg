<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY11 — Compare common short-vowel cues</title><desc id="d">Compare A E I O U case pairs and common short-vowel cue words.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Five vowel letters — five useful short-sound cues</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Match each upper/lower pair and say the cue word aloud.</text><g font-family="Arial"><g transform="translate(85 330)"><rect width="270" height="275" rx="28" fill="#e8eef9"/><text x="135" y="75" text-anchor="middle" fill="#173a72" font-size="64" font-weight="700">A a</text><text x="135" y="145" text-anchor="middle" fill="#0f172a" font-size="30">apple</text><text x="135" y="205" text-anchor="middle" fill="#334155" font-size="34" font-weight="700">short a</text></g><g transform="translate(375 330)"><rect width="270" height="275" rx="28" fill="#ecfdf5"/><text x="135" y="75" text-anchor="middle" fill="#166534" font-size="64" font-weight="700">E e</text><text x="135" y="145" text-anchor="middle" fill="#0f172a" font-size="30">egg</text><text x="135" y="205" text-anchor="middle" fill="#334155" font-size="34" font-weight="700">short e</text></g><g transform="translate(665 330)"><rect width="270" height="275" rx="28" fill="#fff7e6"/>