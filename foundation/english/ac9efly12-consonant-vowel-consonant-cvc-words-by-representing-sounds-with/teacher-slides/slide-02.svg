<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY12 — Build and read cat</title><desc id="d">Map three speech sounds to c a t, then blend to read cat.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 6</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Say it → map the sounds → blend the word</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">A CVC word has a consonant, vowel and consonant sound position.</text><g font-family="Arial"><circle cx="420" cy="430" r="100" fill="#e8eef9"/><circle cx="800" cy="430" r="100" fill="#ecfdf5"/><circle cx="1180" cy="430" r="100" fill="#fff7e6"/><text x="420" y="450" text-anchor="middle" fill="#173a72" font-size="58" font-weight="700">/k/</text><text x="800" y="450" text-anchor="middle" fill="#166534" font-size="58" font-weight="700">/a/</text><text x="1180" y="450" text-anchor="middle" fill="#9a5b00" font-size="58" font-weight="700">/t/</text><text x="420" y="580" text-anchor="middle" fill="#0f172a" font-size="92" font-weight="700">c</text><text x="800" y="580" text-anchor="middle" fill="#0f172a" font-size="92" font-weight="700">a</text><text x="1180" y="580" text-anchor="middle" fill="#0f172a" font-size="92" font-weight="700">t</text><path d="M505 430h190M905 430h190" stroke="#173a72" stroke-width="8"/><text x="800" y="665" text-anchor="middle" fill="#173a72" font-size="58" font-weight="700">c  a  t  →  cat</text><rect x="90" y="700" width="1420" height="95" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="742" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="777" fill="#0f172a" font-size="28">How many sound positions are in cat? Point to each one, then blend the whole word.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY12 • SkillrHub • skillrhub.com</text></svg>