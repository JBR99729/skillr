<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY10 — Blend and change a spoken word</title><desc id="d">Blend three speech sounds to make mat, then change the first sound to make sat.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Blend separate sounds to make a spoken word</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Listen to each sound, sweep them together, then change one sound and listen again.</text><g font-family="Arial"><circle cx="410" cy="445" r="105" fill="#e8eef9"/><circle cx="800" cy="445" r="105" fill="#ecfdf5"/><circle cx="1190" cy="445" r="105" fill="#fff7e6"/><text x="410" y="465" text-anchor="middle" fill="#173a72" font-size="58" font-weight="700">/m/</text><text x="800" y="465" text-anchor="middle" fill="#166534" font-size="58" font-weight="700">/a/</text><text x="1190" y="465" text-anchor="middle" fill="#9a5b00" font-size="58" font-weight="700">/t/</text><path d="M520 445h165M915 445h160" stroke="#173a72" stroke-width="8"/><text x="800" y="615" text-anchor="middle" fill="#0f172a" font-size="76" font-weight="700">/m/ /a/ /t/ → mat</text><rect x="90" y="675" width="1420" height="120" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="720" fill="#173a72" font-size="26" font-weight="700">Student check</text><text x="130" y="765" fill="#0f172a" font-size="29">Change /m/ to /s/. What new spoken word do you make?  /s/ /a/ /t/ → ?</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY10 • SkillrHub • skillrhub.com</text></svg>