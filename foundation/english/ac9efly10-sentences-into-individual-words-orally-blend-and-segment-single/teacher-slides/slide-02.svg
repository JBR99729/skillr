<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY10 — Segment a sentence into words</title><desc id="d">Show one spoken sentence separated into four individual spoken words.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">A sentence is made of separate spoken words</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Say the whole sentence, then move one counter for each word you hear.</text><g font-family="Arial"><text x="800" y="360" text-anchor="middle" fill="#0f172a" font-size="62" font-weight="700">“The dog ran home.”</text><rect x="115" y="440" width="300" height="150" rx="28" fill="#e8eef9"/><rect x="470" y="440" width="300" height="150" rx="28" fill="#ecfdf5"/><rect x="825" y="440" width="300" height="150" rx="28" fill="#fff7e6"/><rect x="1180" y="440" width="300" height="150" rx="28" fill="#f1f5f9"/><text x="265" y="535" text-anchor="middle" fill="#173a72" font-size="46" font-weight="700">The</text><text x="620" y="535" text-anchor="middle" fill="#166534" font-size="46" font-weight="700">dog</text><text x="975" y="535" text-anchor="middle" fill="#9a5b00" font-size="46" font-weight="700">ran</text><text x="1330" y="535" text-anchor="middle" fill="#334155" font-size="46" font-weight="700">home</text><circle cx="265" cy="625" r="28" fill="#173a72"/><circle cx="620" cy="625" r="28" fill="#166534"/><circle cx="975" cy="625" r="28" fill="#9a5b00"/><circle cx="1330" cy="625" r="28" fill="#64748b"/><rect x="90" y="690" width="1420" height="105" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="735" fill="#173a72" font-size="26" font-weight="700">Student check</text><text x="130" y="775" fill="#0f172a" font-size="29">How many words do you hear? Touch one counter as you say each word.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY10 • SkillrHub • skillrhub.com</text></svg>