<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA06 — Change one group and notice the new meaning</title><desc id="d">Keep one word group the same and change the second group to show how sentence meaning changes.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 7</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Change one group → change the meaning</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Keep the WHO group. Swap the detail group and listen for the new message.</text><rect x="125" y="325" width="1350" height="145" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="150" y="350" width="400" height="95" rx="20" fill="#dbeafe"/><text x="350" y="408" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="32" font-weight="700">My red hat</text><text x="610" y="408" fill="#64748b" font-family="Arial" font-size="34">+</text><rect x="670" y="350" width="520" height="95" rx="20" fill="#dcfce7"/><text x="930" y="408" text-anchor="middle" fill="#166534" font-family="Arial" font-size="31" font-weight="700">is on the hook.</text><rect x="125" y="500" width="1350" height="145" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="150" y="525" width="400" height="95" rx="20" fill="#dbeafe"/><text x="350" y="583" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="32" font-weight="700">My red hat</text><text x="610" y="583" fill="#64748b" font-family="Arial" font-size="34">+</text><rect x="670" y="525" width="520" height="95" rx="20" fill="#fef3c7"/><text x="930" y="583" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="31" font-weight="700">is under the chair.</text><text x="1285" y="575" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="25" font-weight="700">New detail</text><text x="1285" y="610" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="25">new location</text><rect x="90" y="680" width="1420" height="125" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="725" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="770" fill="#0f172a" font-family="Arial" font-size="28">Replace the action group in “My brother laughed.” What new meaning did you make?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA06 • SkillrHub • skillrhub.com</text></svg>