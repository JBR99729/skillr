<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA06 — Build meaning from two word groups</title><desc id="d">Show how a who group and a what-happened group combine into a meaningful sentence.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Build meaning from two word groups</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Keep words together when they do one job in the sentence.</text><rect x="135" y="335" width="585" height="245" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="880" y="335" width="585" height="245" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="428" y="400" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="31" font-weight="700">WHO?</text><text x="428" y="485" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">The little dog</text><text x="1172" y="400" text-anchor="middle" fill="#166534" font-family="Arial" font-size="31" font-weight="700">WHAT HAPPENED?</text><text x="1172" y="485" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="40" font-weight="700">ran to the gate</text><text x="800" y="632" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="33" font-weight="700">Together: The little dog ran to the gate.</text><rect x="90" y="680" width="1420" height="125" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="725" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="770" fill="#0f172a" font-family="Arial" font-size="28">In “The yellow duck splashed in the pond”, which words belong in the WHO group?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA06 • SkillrHub • skillrhub.com</text></svg>