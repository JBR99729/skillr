<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA02 — Build a preference with a reason</title><desc id="d">Show a clear choice, preference and because-reason model.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Build a preference with a reason</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="30">Say what you prefer, then add why.</text><rect x="90" y="330" width="430" height="260" rx="28" fill="#e8eef9"/><text x="305" y="385" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">1. CHOICES</text><text x="305" y="485" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="38">apple  or  pear</text><rect x="585" y="330" width="430" height="260" rx="28" fill="#ecfdf5"/><text x="800" y="385" text-anchor="middle" fill="#166534" font-family="Arial" font-size="27" font-weight="700">2. PREFERENCE</text><text x="800" y="470" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="36" font-weight="700">I prefer pear</text><rect x="1080" y="330" width="430" height="260" rx="28" fill="#fff7e6"/><text x="1295" y="385" text-anchor="middle" fill="#9a5b00" font-family="Arial" font-size="27" font-weight="700">3. REASON</text><text x="1295" y="455" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">because it is juicy.</text><text x="800" y="640" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="32" font-weight="700">I prefer pear because it is juicy.</text><rect x="90" y="685" width="1420" height="120" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="773" fill="#0f172a" font-family="Arial" font-size="27">Choose drawing or building. Say: “I prefer ___ because ___.”</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA02 • SkillrHub • skillrhub.com</text></svg>