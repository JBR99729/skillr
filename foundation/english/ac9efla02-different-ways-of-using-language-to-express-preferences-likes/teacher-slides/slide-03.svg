<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA02 — Different preferences can both be valid</title><desc id="d">Compare two respectful preferences side by side.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Different preferences can both be valid</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="30">Listen for the choice and the reason — not for one “correct” favourite.</text><rect x="110" y="330" width="650" height="300" rx="28" fill="#e8eef9"/><text x="435" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">ARI</text><text x="435" y="475" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">“I prefer the swings</text><text x="435" y="520" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">because they feel like flying.”</text><rect x="840" y="330" width="650" height="300" rx="28" fill="#ecfdf5"/><text x="1165" y="390" text-anchor="middle" fill="#166534" font-family="Arial" font-size="30" font-weight="700">MIA</text><text x="1165" y="475" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">“I prefer the sandpit</text><text x="1165" y="520" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">because I like building.”</text><text x="800" y="675" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="31" font-weight="700">Different choice + real reason + respectful listening = both can be valid</text><rect x="90" y="705" width="1420" height="100" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="746" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="781" fill="#0f172a" font-family="Arial" font-size="27">Tell a partner your preference. Then say one sentence that respects their different choice.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA02 • SkillrHub • skillrhub.com</text></svg>