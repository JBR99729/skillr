<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA02 — 60-second Quick Check / Turn and Talk</title><desc id="d">Use a short partner check to gather evidence before moving to Practice or Test.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">8 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">60-second Quick Check / Turn and Talk</text><text x="90" y="245" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">Use a short partner check to gather evidence before moving to Practice or</text><text x="90" y="284" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">Test.</text><rect x="90" y="375" width="1420" height="175" rx="26" fill="#e8eef9"/><text x="132" y="422" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">See / hear / notice</text><text x="132" y="468" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">Choose drawing or building and state your preference with because. •</text><text x="132" y="504" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">Which part of ‘I prefer mango because it is sweet’ gives the reason? •</text><text x="132" y="540" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">Two classmates prefer different games. Can both preferences be valid?</text><rect x="90" y="575" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="618" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="656" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400">Turn and talk for 60 seconds. Share one answer and the evidence that</text><text x="130" y="690" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400">supports it.</text><rect x="90" y="700" width="1420" height="105" rx="22" fill="#ecfdf5"/><text x="130" y="742" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="780" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">Sample two responses, then move into Practice when the class is ready.</text><a href="/quiz/grade-k/english/ac9efla02/practice/" target="_top" aria-label="Open AC9EFLA02 Practice"><rect x="1120" y="724" width="330" height="62" rx="18" fill="#173a72"/><text x="1285" y="764" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Practice this topic →</text></a><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA02 • SkillrHub • skillrhub.com</text></svg>