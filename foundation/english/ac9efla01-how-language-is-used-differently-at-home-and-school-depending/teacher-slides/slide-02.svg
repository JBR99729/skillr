<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA01 — Ask a Friend</title><desc id="d">Compare a request for a friend with language chosen for another relationship.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Ask a Friend</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Keep the purpose the same; choose words that fit the relationship.</text><rect x="90" y="320" width="1420" height="300" rx="26" fill="#e8eef9"/><text x="130" y="375" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">SAME PURPOSE: ask for help</text><rect x="155" y="415" width="580" height="145" rx="22" fill="#fff"/><text x="445" y="458" text-anchor="middle" fill="#475569" font-family="Arial" font-size="24" font-weight="700">FRIEND • PLAY AREA</text><text x="445" y="515" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="31">“Can you help me?”</text><rect x="865" y="415" width="580" height="145" rx="22" fill="#fff"/><text x="1155" y="458" text-anchor="middle" fill="#475569" font-family="Arial" font-size="24" font-weight="700">TEACHER • CLASSROOM</text><text x="1155" y="505" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29">“Excuse me, could you</text><text x="1155" y="542" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29">please help me?”</text><text x="800" y="600" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">Both can be kind and clear; the relationship changes the wording.</text><rect x="90" y="650" width="1420" height="115" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="692" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="735" fill="#0f172a" font-family="Arial" font-size="27">What changed between the two requests? What stayed the same?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA01 • SkillrHub • skillrhub.com</text></svg>