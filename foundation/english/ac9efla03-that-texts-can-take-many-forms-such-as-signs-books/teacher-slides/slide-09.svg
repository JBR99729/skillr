<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA03 — Guided activity and differentiation</title><desc id="d">Move from teacher modelling to student action inside the concept boundary.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">9 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Guided activity and differentiation</text><text x="90" y="245" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">Move from teacher modelling to student action inside the concept</text><text x="90" y="284" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">boundary.</text><rect x="90" y="375" width="1420" height="175" rx="26" fill="#e8eef9"/><text x="132" y="422" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">See / hear / notice</text><text x="132" y="468" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">Connect each text form to its job. STOP sign → safety message Picture</text><text x="132" y="504" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">book → story Weather page → information Read the cards from left to</text><text x="132" y="540" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">right. Follow one message across different forms. Door sign: Library…</text><rect x="90" y="575" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="618" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="656" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400">Text hunt: Find three classroom texts, such as a label, book and screen</text><text x="130" y="690" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400">notice. Name each form.</text><rect x="90" y="700" width="1420" height="105" rx="22" fill="#ecfdf5"/><text x="130" y="742" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="780" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">Run the first activity, then choose Support, Core or Extend.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA03 • SkillrHub • skillrhub.com</text></svg>
