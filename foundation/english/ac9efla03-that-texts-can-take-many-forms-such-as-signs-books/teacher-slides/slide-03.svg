<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA03 — Follow one message across different forms</title><desc id="d">Show one message communicated through print, speech and a screen.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">One message, different forms</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">The message can stay the same even when the text form changes.</text><rect x="90" y="330" width="430" height="300" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="585" y="330" width="430" height="300" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="1080" y="330" width="430" height="300" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="305" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">PRINT</text><rect x="185" y="425" width="240" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="305" y="476" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="26" font-weight="700">LIBRARY</text><text x="305" y="510" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="26" font-weight="700">CLOSED TODAY</text><text x="305" y="592" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">door sign</text><text x="800" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">SPOKEN</text><circle cx="725" cy="485" r="52" fill="#dbeafe"/><path d="M790 460 Q850 485 790 510" fill="none" stroke="#2563eb" stroke-width="7"/><path d="M812 442 Q900 485 812 528" fill="none" stroke="#2563eb" stroke-width="5"/><text x="800" y="585" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">“The library is closed today.”</text><text x="1295" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">DIGITAL</text><rect x="1170" y="425" width="250" height="140" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><text x="1295" y="495" text-anchor="middle" fill="#0c4a6e" font-family="Arial" font-size="27" font-weight="700">CLOSED</text><text x="1295" y="530" text-anchor="middle" fill="#0c4a6e" font-family="Arial" font-size="27" font-weight="700">TODAY</text><text x="1295" y="592" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">screen message</text><rect x="90" y="655" width="1420" height="150" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="703" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="750" fill="#0f172a" font-family="Arial" font-size="28">How could we share the same excursion reminder as print, speech and a digital message?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA03 • SkillrHub • skillrhub.com</text></svg>