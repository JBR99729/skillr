<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA03 — Connect each text form to its job</title><desc id="d">Compare three familiar text forms and the jobs they do.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Connect each text form to its job</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">The form changes, but every text communicates a message.</text><rect x="90" y="330" width="430" height="290" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="585" y="330" width="430" height="290" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="1080" y="330" width="430" height="290" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="305" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">SIGN</text><polygon points="235,430 375,430 410,465 375,500 235,500 200,465" fill="#fee2e2" stroke="#b91c1c" stroke-width="5"/><text x="305" y="478" text-anchor="middle" fill="#991b1b" font-family="Arial" font-size="34" font-weight="700">STOP</text><text x="305" y="555" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="26">Job: quick safety message</text><text x="800" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">PICTURE BOOK</text><rect x="690" y="425" width="220" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><line x1="800" y1="425" x2="800" y2="555" stroke="#2563eb" stroke-width="3"/><text x="800" y="598" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="26">Job: tell a story</text><text x="1295" y="390" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="30" font-weight="700">WEATHER PAGE</text><rect x="1180" y="425" width="230" height="130" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/><circle cx="1240" cy="480" r="28" fill="#fde68a"/><path d="M1290 510 C1310 460 1380 465 1395 510" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/><text x="1295" y="598" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="26">Job: share information</text><rect x="90" y="655" width="1420" height="150" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="703" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="750" fill="#0f172a" font-family="Arial" font-size="28">A door card says “Quiet, baby sleeping.” What is its form? What message does it give?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA03 • SkillrHub • skillrhub.com</text></svg>