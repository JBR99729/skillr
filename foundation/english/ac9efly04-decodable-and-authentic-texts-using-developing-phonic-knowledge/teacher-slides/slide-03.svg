<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY04 — Repair a word that does not fit</title><desc id="d">Use the printed vowel to repair din to den, then reread and confirm meaning.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">When reading does not fit: stop and repair</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Meaning can alert you to a problem; the printed letters tell you how to repair it.</text><g font-family="Arial"><rect x="95" y="335" width="330" height="220" rx="26" fill="#fee2e2"/><text x="260" y="390" text-anchor="middle" fill="#991b1b" font-size="26" font-weight="700">FIRST READ</text><text x="260" y="466" text-anchor="middle" fill="#0f172a" font-size="48" font-weight="700">“din” ✗</text><rect x="475" y="335" width="330" height="220" rx="26" fill="#e8eef9"/><text x="640" y="390" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">LOOK AGAIN</text><text x="640" y="458" text-anchor="middle" fill="#0f172a" font-size="48" font-weight="700">d  e  n</text><text x="640" y="505" text-anchor="middle" fill="#173a72" font-size="25">printed e matters</text><rect x="855" y="335" width="300" height="220" rx="26" fill="#eefbf4"/><text x="1005" y="390" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">REBLEND</text><text x="1005" y="466" text-anchor="middle" fill="#0f172a" font-size="48" font-weight="700">den ✓</text><rect x="1205" y="335" width="310" height="220" rx="26" fill="#fff7e6"/><text x="1360" y="390" text-anchor="middle" fill="#9a5b00" font-size="26" font-weight="700">REREAD</text><text x="1360" y="445" text-anchor="middle" fill="#0f172a" font-size="25">A fox hid</text><text x="1360" y="481" text-anchor="middle" fill="#0f172a" font-size="25">in a den.</text><text x="450" y="462" fill="#64748b" font-size="36">→</text><text x="830" y="462" fill="#64748b" font-size="36">→</text><text x="1180" y="462" fill="#64748b" font-size="36">→</text></g><rect x="280" y="590" width="1040" height="72" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="637" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">Repair with print → reread → confirm grammar and meaning</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">Which printed letter proves “din” is not the word? What is the repaired word?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY04 • SkillrHub • skillrhub.com</text></svg>