<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY04 — Decode and check mat</title><desc id="d">Use complete letter evidence to blend mat, then reread and check the sentence.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Decode first. Then check meaning.</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Look through the whole printed word from left to right.</text><g font-family="Arial"><rect x="95" y="330" width="300" height="215" rx="26" fill="#e8eef9"/><text x="245" y="382" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">LOOK</text><text x="245" y="472" text-anchor="middle" fill="#0f172a" font-size="54" font-weight="700">m  a  t</text><rect x="455" y="330" width="300" height="215" rx="26" fill="#eefbf4"/><text x="605" y="382" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">SOUNDS</text><text x="605" y="472" text-anchor="middle" fill="#0f172a" font-size="40">/m/ /a/ /t/</text><rect x="815" y="330" width="300" height="215" rx="26" fill="#fff7e6"/><text x="965" y="382" text-anchor="middle" fill="#9a5b00" font-size="26" font-weight="700">BLEND</text><text x="965" y="472" text-anchor="middle" fill="#0f172a" font-size="48" font-weight="700">mat</text><rect x="1175" y="330" width="330" height="215" rx="26" fill="#e8eef9"/><text x="1340" y="382" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">REREAD</text><text x="1340" y="444" text-anchor="middle" fill="#0f172a" font-size="26">The cat sat</text><text x="1340" y="482" text-anchor="middle" fill="#0f172a" font-size="26">on the mat.</text><text x="425" y="453" fill="#64748b" font-size="38">→</text><text x="785" y="453" fill="#64748b" font-size="38">→</text><text x="1145" y="453" fill="#64748b" font-size="38">→</text></g><rect x="285" y="580" width="1030" height="72" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="627" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">Letters fit ✓   Grammar fits ✓   Meaning fits ✓</text><rect x="90" y="680" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="723" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="761" fill="#0f172a" font-family="Arial" font-size="27">Blend “mat”. What should you do straight after you read the word?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY04 • SkillrHub • skillrhub.com</text></svg>