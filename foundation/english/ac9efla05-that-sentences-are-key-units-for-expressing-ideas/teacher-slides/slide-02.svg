<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA05 — Does it make one whole idea?</title><desc id="d">Compare a complete sentence, an unfinished group and words that do not yet make sense.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Does it make one whole idea?</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Listen for meaning, not just the number of words.</text><rect x="90" y="310" width="1420" height="330" rx="26" fill="#e8eef9"/><g font-family="Arial" text-anchor="middle"><rect x="145" y="385" width="390" height="175" rx="22" fill="#fff"/><text x="340" y="430" fill="#166534" font-size="26" font-weight="700">WHOLE IDEA</text><text x="340" y="485" fill="#0f172a" font-size="31">The frog jumps.</text><text x="340" y="530" fill="#475569" font-size="24">We know who + what happens.</text><rect x="605" y="385" width="390" height="175" rx="22" fill="#fff"/><text x="800" y="430" fill="#b45309" font-size="26" font-weight="700">NEEDS MORE</text><text x="800" y="485" fill="#0f172a" font-size="31">The green frog</text><text x="800" y="530" fill="#475569" font-size="24">What about the frog?</text><rect x="1065" y="385" width="390" height="175" rx="22" fill="#fff"/><text x="1260" y="430" fill="#991b1b" font-size="26" font-weight="700">DOESN’T MAKE SENSE YET</text><text x="1260" y="485" fill="#0f172a" font-size="31">Jumps under</text><text x="1260" y="530" fill="#475569" font-size="24">Rearrange or add meaning.</text></g><rect x="90" y="665" width="1420" height="120" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="708" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="752" fill="#0f172a" font-family="Arial" font-size="27">Do the words “The sleepy koala” give a whole idea yet? What is missing?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA05 • SkillrHub • skillrhub.com</text></svg>