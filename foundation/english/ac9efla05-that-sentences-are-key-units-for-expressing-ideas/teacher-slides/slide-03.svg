<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA05 — Complete an unfinished idea</title><desc id="d">Build an unfinished group of words into one complete sentence.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Complete an unfinished idea</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Add the missing meaning, then check the whole sentence.</text><rect x="90" y="310" width="1420" height="330" rx="26" fill="#e8eef9"/><g font-family="Arial" text-anchor="middle"><rect x="150" y="400" width="360" height="145" rx="22" fill="#fff"/><text x="330" y="445" fill="#b45309" font-size="24" font-weight="700">START</text><text x="330" y="500" fill="#0f172a" font-size="31">My red kite</text><text x="590" y="480" fill="#173a72" font-size="50">→</text><rect x="620" y="400" width="360" height="145" rx="22" fill="#fff"/><text x="800" y="445" fill="#173a72" font-size="24" font-weight="700">ADD WHAT HAPPENS</text><text x="800" y="500" fill="#0f172a" font-size="31">flew high</text><text x="1060" y="480" fill="#173a72" font-size="50">→</text><rect x="1090" y="400" width="360" height="145" rx="22" fill="#fff"/><text x="1270" y="445" fill="#166534" font-size="24" font-weight="700">WHOLE SENTENCE</text><text x="1270" y="493" fill="#0f172a" font-size="28">My red kite</text><text x="1270" y="528" fill="#0f172a" font-size="28">flew high.</text></g><text x="800" y="600" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">Meaning first → sentence boundary marks when the idea is complete.</text><rect x="90" y="665" width="1420" height="120" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="708" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="752" fill="#0f172a" font-family="Arial" font-size="27">Complete “Our class …” so your listener understands one whole idea.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA05 • SkillrHub • skillrhub.com</text></svg>