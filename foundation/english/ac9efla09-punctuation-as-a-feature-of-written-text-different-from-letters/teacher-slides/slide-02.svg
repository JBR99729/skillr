<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA09 — Mark the beginning, name and end</title><desc id="d">Show how a capital letter and punctuation mark the boundaries of a written sentence.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Mark the beginning, name and end</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Letters make words; capitals and punctuation also show sentence boundaries.</text><rect x="90" y="310" width="1420" height="330" rx="26" fill="#e8eef9"/><text x="800" y="405" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="70" font-weight="700"><tspan fill="#1d4ed8">M</tspan><tspan>ia runs</tspan><tspan fill="#b45309">.</tspan></text><g font-family="Arial" text-anchor="middle"><rect x="145" y="470" width="390" height="105" rx="18" fill="#fff"/><text x="340" y="510" fill="#1d4ed8" font-size="24" font-weight="700">CAPITAL M</text><text x="340" y="548" fill="#475569" font-size="23">starts the name Mia and the sentence</text><rect x="605" y="470" width="390" height="105" rx="18" fill="#fff"/><text x="800" y="510" fill="#173a72" font-size="24" font-weight="700">LETTERS</text><text x="800" y="548" fill="#475569" font-size="23">build the words “Mia runs”</text><rect x="1065" y="470" width="390" height="105" rx="18" fill="#fff"/><text x="1260" y="510" fill="#b45309" font-size="24" font-weight="700">FULL STOP</text><text x="1260" y="548" fill="#475569" font-size="23">signals the sentence has ended</text></g><rect x="90" y="665" width="1420" height="120" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="708" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="752" fill="#0f172a" font-family="Arial" font-size="27">In “Ava hops.”, which capital begins the name and which mark is punctuation?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA09 • SkillrHub • skillrhub.com</text></svg>