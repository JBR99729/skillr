<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY05 — Summarise the main idea</title><desc id="d">Combine important details into one short main-idea summary.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Summarise the main idea</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Keep the important connected details; leave out extras that do not change the main message.</text><g font-family="Arial"><rect x="90" y="325" width="420" height="230" rx="28" fill="#e8eef9"/><text x="300" y="380" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">DETAIL 1</text><text x="300" y="458" text-anchor="middle" fill="#0f172a" font-size="30">Bees visit</text><text x="300" y="498" text-anchor="middle" fill="#0f172a" font-size="30">flowers.</text><rect x="590" y="325" width="420" height="230" rx="28" fill="#eefbf4"/><text x="800" y="380" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">DETAIL 2</text><text x="800" y="438" text-anchor="middle" fill="#0f172a" font-size="28">Pollen sticks</text><text x="800" y="478" text-anchor="middle" fill="#0f172a" font-size="28">to their bodies.</text><rect x="1090" y="325" width="420" height="230" rx="28" fill="#fff7e6"/><text x="1300" y="380" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">DETAIL 3</text><text x="1300" y="438" text-anchor="middle" fill="#0f172a" font-size="28">They carry pollen</text><text x="1300" y="478" text-anchor="middle" fill="#0f172a" font-size="28">to other flowers.</text></g><rect x="260" y="590" width="1080" height="85" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="625" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="25" font-weight="700">MAIN IDEA</text><text x="800" y="658" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28">Bees move pollen between flowers.</text><rect x="90" y="700" width="1420" height="90" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="739" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="773" fill="#0f172a" font-family="Arial" font-size="27">Which detail belongs in the summary? Which detail would be an unnecessary extra?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY05 • SkillrHub • skillrhub.com</text></svg>