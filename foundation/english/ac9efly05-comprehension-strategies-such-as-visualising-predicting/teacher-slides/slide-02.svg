<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY05 — Predict and confirm</title><desc id="d">Make a prediction from evidence, read on, then confirm or change the prediction.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Predict — then check your thinking</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">A prediction is a thinking guess supported by a clue, not a random guess.</text><g font-family="Arial"><rect x="100" y="335" width="390" height="225" rx="28" fill="#e8eef9"/><text x="295" y="390" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">1. NOTICE CLUES</text><text x="295" y="448" text-anchor="middle" fill="#0f172a" font-size="27">title: The Missing Boot</text><text x="295" y="490" text-anchor="middle" fill="#0f172a" font-size="27">muddy pawprints</text><rect x="605" y="335" width="390" height="225" rx="28" fill="#fff7e6"/><text x="800" y="390" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">2. PREDICT</text><text x="800" y="448" text-anchor="middle" fill="#0f172a" font-size="29">An animal may</text><text x="800" y="490" text-anchor="middle" fill="#0f172a" font-size="29">have taken the boot.</text><rect x="1110" y="335" width="390" height="225" rx="28" fill="#eefbf4"/><text x="1305" y="390" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">3. READ &amp; CHECK</text><text x="1305" y="448" text-anchor="middle" fill="#0f172a" font-size="28">new evidence:</text><text x="1305" y="490" text-anchor="middle" fill="#0f172a" font-size="28">confirm or change</text><text x="545" y="462" fill="#64748b" font-size="42">→</text><text x="1050" y="462" fill="#64748b" font-size="42">→</text></g><rect x="280" y="595" width="1040" height="70" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="640" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Good readers change a prediction when the text gives better evidence.</text><rect x="90" y="690" width="1420" height="95" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">Which clue supports the animal prediction? What would make you change it?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY05 • SkillrHub • skillrhub.com</text></svg>