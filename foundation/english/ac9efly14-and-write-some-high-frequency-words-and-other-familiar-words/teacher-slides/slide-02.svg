<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY14 — Learn the high-frequency word the</title><desc id="d">Use a look, say, cover, write and check routine for the word the.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Build a strong memory for a frequent word</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Look carefully at every letter, then practise recalling the whole word.</text><g font-family="Arial"><text x="800" y="360" text-anchor="middle" fill="#0f172a" font-size="92" font-weight="700">the</text><g font-size="27" font-weight="700"><rect x="80" y="430" width="270" height="150" rx="28" fill="#e8eef9"/><text x="215" y="520" text-anchor="middle" fill="#173a72">1. LOOK</text><rect x="370" y="430" width="270" height="150" rx="28" fill="#ecfdf5"/><text x="505" y="520" text-anchor="middle" fill="#166534">2. SAY</text><rect x="660" y="430" width="270" height="150" rx="28" fill="#fff7e6"/><text x="795" y="520" text-anchor="middle" fill="#9a5b00">3. COVER</text><rect x="950" y="430" width="270" height="150" rx="28" fill="#f1f5f9"/><text x="1085" y="520" text-anchor="middle" fill="#475569">4. WRITE</text><rect x="1240" y="430" width="270" height="150" rx="28" fill="#ede9fe"/><text x="1375" y="520" text-anchor="middle" fill="#5b21b6">5. CHECK</text></g><text x="800" y="650" text-anchor="middle" fill="#334155" font-size="31">“The dog is on the rug.”  Find both examples of <tspan font-weight="700">the</tspan>.</text><rect x="90" y="700" width="1420" height="95" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="742" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="777" fill="#0f172a" font-size="28">After you cover the word, what do you do next? Then uncover it and check every letter.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY14 • SkillrHub • skillrhub.com</text></svg>