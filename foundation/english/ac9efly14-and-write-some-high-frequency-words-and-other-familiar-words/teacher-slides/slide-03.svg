<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY14 — Learn a personally familiar word</title><desc id="d">Apply look, say, cover, write and check to a familiar name.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Use the same memory routine for a familiar word</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Names and classroom words can become instantly recognisable through careful practice.</text><g font-family="Arial"><rect x="180" y="330" width="500" height="270" rx="32" fill="#e8eef9"/><text x="430" y="395" text-anchor="middle" fill="#173a72" font-size="28" font-weight="700">MODEL WORD</text><text x="430" y="510" text-anchor="middle" fill="#0f172a" font-size="88" font-weight="700">Mia</text><text x="430" y="565" text-anchor="middle" fill="#334155" font-size="26">notice M - i - a</text><rect x="920" y="330" width="500" height="270" rx="32" fill="#ecfdf5"/><text x="1170" y="395" text-anchor="middle" fill="#166534" font-size="28" font-weight="700">RECALL IT</text><text x="1170" y="470" text-anchor="middle" fill="#0f172a" font-size="33" font-weight="700">cover → write → uncover</text><text x="1170" y="535" text-anchor="middle" fill="#334155" font-size="28">check every letter in order</text><path d="M705 465h190" stroke="#173a72" stroke-width="8"/><path d="M880 445l25 20-25 20" fill="none" stroke="#173a72" stroke-width="8"/><rect x="90" y="675" width="1420" height="120" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="720" fill="#173a72" font-size="25" font-weight="700">Student check</text><text x="130" y="765" fill="#0f172a" font-size="29">What happens after you cover the model word? Write it from memory, then check it carefully.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY14 • SkillrHub • skillrhub.com</text></svg>