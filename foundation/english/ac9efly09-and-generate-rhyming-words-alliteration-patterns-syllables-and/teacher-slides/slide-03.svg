<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY09 — Compare sound patterns</title><desc id="d">Compare alliteration, syllables and individual speech sounds.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Different sound patterns need different listening</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Say it, clap it, or stretch it to notice the pattern.</text><g font-family="Arial"><rect x="90" y="320" width="430" height="300" rx="28" fill="#e8eef9"/><text x="305" y="375" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">ALLITERATION</text><text x="305" y="470" text-anchor="middle" fill="#0f172a" font-size="52" font-weight="700">helpful Henry</text><text x="305" y="535" text-anchor="middle" fill="#334155" font-size="27">same beginning sound</text><text x="305" y="580" text-anchor="middle" fill="#173a72" font-size="34" font-weight="700">/h/  /h/</text><rect x="585" y="320" width="430" height="300" rx="28" fill="#ecfdf5"/><text x="800" y="375" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">SYLLABLES</text><text x="800" y="470" text-anchor="middle" fill="#0f172a" font-size="56" font-weight="700">sun-flower</text><text x="800" y="535" text-anchor="middle" fill="#334155" font-size="27">clap the word parts</text><text x="800" y="580" text-anchor="middle" fill="#166534" font-size="34" font-weight="700">2 claps</text><rect x="1080" y="320" width="430" height="300" rx="28" fill="#fff7e6"/><text x="1295" y="375" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">ONE SOUND</text><text x="1295" y="470" text-anchor="middle" fill="#0f172a" font-size="70" font-weight="700">mmm</text><text x="1295" y="535" text-anchor="middle" fill="#334155" font-size="27">stretch one speech sound</text><text x="1295" y="580" text-anchor="middle" fill="#9a5b00" font-size="34" font-weight="700">/m/</text><rect x="90" y="660" width="1420" height="120" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="710" fill="#173a72" font-size="26" font-weight="700">Student check</text><text x="130" y="755" fill="#0f172a" font-size="29">What repeated beginning sound do you hear in “helpful Henry”?</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY09 • SkillrHub • skillrhub.com</text></svg>