<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLY09 — Hear and make a rhyme</title><desc id="d">Listen for matching end sounds and generate a rhyming word.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Hear the ending sound — then make a rhyme</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Rhyme is about what words sound like when we say them.</text><g font-family="Arial"><rect x="110" y="335" width="600" height="245" rx="30" fill="#e8eef9"/><text x="410" y="400" text-anchor="middle" fill="#173a72" font-size="30" font-weight="700">LISTEN</text><text x="410" y="495" text-anchor="middle" fill="#0f172a" font-size="76" font-weight="700">cake</text><text x="410" y="545" text-anchor="middle" fill="#334155" font-size="27">say it aloud</text><rect x="890" y="335" width="600" height="245" rx="30" fill="#ecfdf5"/><text x="1190" y="400" text-anchor="middle" fill="#166534" font-size="30" font-weight="700">MATCH THE END</text><text x="1190" y="495" text-anchor="middle" fill="#0f172a" font-size="76" font-weight="700">lake</text><text x="1190" y="545" text-anchor="middle" fill="#334155" font-size="27">same ending sound</text><path d="M735 460h120" stroke="#173a72" stroke-width="8"/><path d="M845 440l25 20-25 20" fill="none" stroke="#173a72" stroke-width="8"/><rect x="90" y="650" width="1420" height="130" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="704" fill="#9a5b00" font-size="26" font-weight="700">Student check</text><text x="130" y="753" fill="#0f172a" font-size="31">Which word rhymes with lake: cake or fish? Say both aloud to prove it.</text></g><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLY09 • SkillrHub • skillrhub.com</text></svg>