<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA07 — 60-second Quick Check / Turn and Talk</title><desc id="d">Use a short partner check, then move directly into Practice.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">8 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">60-second Quick Check / Turn and Talk</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">Choose one question, explain your evidence, then practise independently.</text><rect x="90" y="330" width="1420" height="220" rx="26" fill="#e8eef9"/><text x="130" y="380" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">Pick one</text><text x="130" y="430" fill="#0f172a" font-family="Arial" font-size="27">• “Lina heard a crash” + a fallen-pot picture: what does each clue add?</text><text x="130" y="475" fill="#0f172a" font-family="Arial" font-size="27">• What can a labelled butterfly diagram show faster than a sentence?</text><text x="130" y="520" fill="#0f172a" font-family="Arial" font-size="27">• Name one detail words could tell that a picture might not show.</text><rect x="90" y="580" width="850" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="625" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="670" fill="#0f172a" font-family="Arial" font-size="27">Turn and talk. Give your answer and point to the evidence.</text><a href="/quiz/grade-k/english/ac9efla07/practice/" target="_top"><rect x="1010" y="580" width="500" height="140" rx="26" fill="#173a72"/><text x="1260" y="638" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Ready to continue?</text><text x="1260" y="684" text-anchor="middle" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Practice this topic →</text></a><text x="90" y="785" fill="#475569" font-family="Arial" font-size="24">Teacher: sample two responses, then use Practice for independent checking.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA07 • SkillrHub • skillrhub.com</text></svg>