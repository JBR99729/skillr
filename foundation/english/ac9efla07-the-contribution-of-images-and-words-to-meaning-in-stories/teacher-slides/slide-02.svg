<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA07 — Combine picture and word clues</title><desc id="d">Show how picture and word clues combine to build fuller meaning.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Combine picture and word clues</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">Each clue adds something. Put them together for fuller meaning.</text><rect x="90" y="330" width="430" height="260" rx="28" fill="#eef2ff" stroke="#a5b4fc" stroke-width="3"/><text x="305" y="385" text-anchor="middle" fill="#3730a3" font-family="Arial" font-size="28" font-weight="700">WORD CLUE</text><text x="305" y="465" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="35" font-weight="700">“The puppy hid.”</text><text x="305" y="530" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">Tells WHAT happened</text><rect x="585" y="330" width="430" height="260" rx="28" fill="#ecfdf5" stroke="#86efac" stroke-width="3"/><text x="800" y="385" text-anchor="middle" fill="#166534" font-family="Arial" font-size="28" font-weight="700">PICTURE CLUE</text><rect x="680" y="430" width="240" height="110" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="5"/><circle cx="800" cy="475" r="32" fill="#c08457"/><circle cx="782" cy="450" r="14" fill="#92400e"/><circle cx="818" cy="450" r="14" fill="#92400e"/><text x="800" y="575" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">Shows WHERE: inside the box</text><text x="1060" y="470" fill="#173a72" font-family="Arial" font-size="44" font-weight="700">→</text><rect x="1110" y="330" width="400" height="260" rx="28" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="1310" y="385" text-anchor="middle" fill="#9a5b00" font-family="Arial" font-size="28" font-weight="700">TOGETHER</text><text x="1310" y="465" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="31" font-weight="700">The puppy hid</text><text x="1310" y="505" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="31" font-weight="700">inside the box.</text><text x="1310" y="555" text-anchor="middle" fill="#475569" font-family="Arial" font-size="24">WHAT + WHERE</text><rect x="90" y="635" width="1420" height="145" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="682" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="730" fill="#0f172a" font-family="Arial" font-size="27">The words say “Lina heard a crash.” The picture shows a fallen pot.</text><text x="130" y="765" fill="#0f172a" font-family="Arial" font-size="27">What does each clue add to the meaning?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA07 • SkillrHub • skillrhub.com</text></svg>