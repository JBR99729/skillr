stroke-width="3"/><text x="1010" y="550" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">egg</text><text x="1080" y="492" fill="#173a72" font-family="Arial" font-size="34">→</text><path d="M1160 505 C1190 455 1230 455 1260 505 C1230 540 1190 540 1160 505 Z" fill="#94a3b8"/><text x="1210" y="550" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">tadpole</text><text x="1300" y="492" fill="#173a72" font-family="Arial" font-size="34">→</text><circle cx="1410" cy="485" r="42" fill="#86efac" stroke="#166534" stroke-width="3"/><text x="1410" y="550" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">frog</text><text x="1185" y="590" text-anchor="middle" fill="#475569" font-family="Arial" font-size="26">Shows the STAGES</text><rect x="90" y="660" width="1420" height="120" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="704" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="750" fill="#0f172a" font-family="Arial" font-size="27">In a labelled butterfly diagram, what can the image show more quickly than a sentence?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA07 • SkillrHub • skillrhub.com</text></svg>