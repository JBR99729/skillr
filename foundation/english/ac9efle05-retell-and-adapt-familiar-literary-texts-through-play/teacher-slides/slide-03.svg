<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE05 — Adapt one part of a familiar story</title><desc id="d">Keep anchor features from a familiar story and change one clear part.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Adapt one part of a familiar story</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Change one clear part while keeping enough of the original for listeners to recognise it.</text><g font-family="Arial"><rect x="120" y="335" width="420" height="225" rx="28" fill="#eefbf4"/><text x="330" y="390" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">KEEP</text><text x="330" y="450" text-anchor="middle" fill="#0f172a" font-size="29">Tama plants</text><text x="330" y="490" text-anchor="middle" fill="#0f172a" font-size="29">and waters.</text><rect x="590" y="335" width="420" height="225" rx="28" fill="#fff7e6"/><text x="800" y="390" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">CHANGE</text><text x="800" y="448" text-anchor="middle" fill="#0f172a" font-size="28">yellow flower</text><text x="800" y="493" text-anchor="middle" fill="#0f172a" font-size="36" font-weight="700">→ bean vine</text><rect x="1060" y="335" width="420" height="225" rx="28" fill="#e8eef9"/><text x="1270" y="390" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">NEW VERSION</text><text x="1270" y="448" text-anchor="middle" fill="#0f172a" font-size="28">Tama stands</text><text x="1270" y="488" text-anchor="middle" fill="#0f172a" font-size="28">beside the tall vine.</text><text x="560" y="462" fill="#64748b" font-size="42">+</text><text x="1030" y="462" fill="#64748b" font-size="42">=</text></g><rect x="250" y="585" width="1100" height="70" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="630" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Recognisable original + one purposeful change = adaptation</text><rect x="90" y="680" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="721" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="759" fill="#0f172a" font-family="Arial" font-size="27">What stayed the same? What changed? How do you still know which story this came from?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE05 • SkillrHub • skillrhub.com</text></svg>