<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE05 — Worked example 2: adapt one part of the known story</title><desc id="d">Apply the same concept without changing the underlying model.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Worked example 2: adapt one part of the</text><text x="90" y="223" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">known story</text><text x="90" y="300" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">Apply the same concept without changing the underlying model.</text><rect x="90" y="375" width="1420" height="175" rx="26" fill="#e8eef9"/><text x="132" y="422" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">See / hear / notice</text><text x="132" y="468" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">Worked example 2: adapt one part of the known story. Keep Tama, the</text><text x="132" y="504" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">planting and the daily care. Change the final plant from a yellow flower</text><text x="132" y="540" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400">to a tall bean vine. Keep: Tama plants and waters Change: yellow flower →…</text><rect x="90" y="575" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="618" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="656" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400">Which details stay the same when the flower becomes a bean vine?</text><rect x="90" y="700" width="1420" height="105" rx="22" fill="#ecfdf5"/><text x="130" y="742" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="780" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">Connect the application directly back to Worked example 1: retell the</text><text x="130" y="811" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">main events in sequence.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE05 • SkillrHub • skillrhub.com</text></svg>
