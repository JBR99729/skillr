<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE05 — Retell the main events in sequence</title><desc id="d">Use first, next and finally to retell three main events in order.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Retell the main events in sequence</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Keep the events the listener needs and put them in story order.</text><g font-family="Arial"><rect x="100" y="335" width="400" height="225" rx="28" fill="#e8eef9"/><text x="300" y="390" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">FIRST</text><text x="300" y="456" text-anchor="middle" fill="#0f172a" font-size="30">Tama plants</text><text x="300" y="496" text-anchor="middle" fill="#0f172a" font-size="30">the seed.</text><rect x="600" y="335" width="400" height="225" rx="28" fill="#eefbf4"/><text x="800" y="390" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">NEXT</text><text x="800" y="456" text-anchor="middle" fill="#0f172a" font-size="30">Tama waters</text><text x="800" y="496" text-anchor="middle" fill="#0f172a" font-size="30">the shoot.</text><rect x="1100" y="335" width="400" height="225" rx="28" fill="#fff7e6"/><text x="1300" y="390" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">FINALLY</text><text x="1300" y="456" text-anchor="middle" fill="#0f172a" font-size="30">A yellow</text><text x="1300" y="496" text-anchor="middle" fill="#0f172a" font-size="30">flower opens.</text><text x="548" y="465" fill="#64748b" font-size="42">→</text><text x="1048" y="465" fill="#64748b" font-size="42">→</text></g><rect x="90" y="600" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="643" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="681" fill="#0f172a" font-family="Arial" font-size="27">Retell the story using first, next and finally. Which small details can you leave out?</text><rect x="90" y="725" width="1420" height="80" rx="22" fill="#ecfdf5"/><text x="130" y="774" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: choose main-event pictures first; use them as memory clues, not single-word answers.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE05 • SkillrHub • skillrhub.com</text></svg>