<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE04 — Copy a repeating sound-and-action pattern</title><desc id="d">Show one repeating chant unit and its matching action unit twice.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Copy a repeating sound-and-action pattern</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Listen for the whole unit, copy it once, then repeat the same order.</text><g font-family="Arial"><rect x="105" y="320" width="1390" height="245" rx="28" fill="#e8eef9"/><text x="800" y="370" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">ONE REPEATING UNIT</text><rect x="165" y="405" width="350" height="105" rx="18" fill="#fff"/><text x="340" y="448" text-anchor="middle" fill="#0f172a" font-size="28">red bird</text><text x="340" y="487" text-anchor="middle" fill="#475569" font-size="24">tap</text><rect x="625" y="405" width="350" height="105" rx="18" fill="#fff"/><text x="800" y="448" text-anchor="middle" fill="#0f172a" font-size="28">blue bird</text><text x="800" y="487" text-anchor="middle" fill="#475569" font-size="24">tap</text><rect x="1085" y="405" width="350" height="105" rx="18" fill="#fff"/><text x="1260" y="448" text-anchor="middle" fill="#0f172a" font-size="28">hop-hop-stop</text><text x="1260" y="487" text-anchor="middle" fill="#475569" font-size="24">clap • clap • freeze</text><text x="555" y="466" fill="#64748b" font-size="38">→</text><text x="1015" y="466" fill="#64748b" font-size="38">→</text></g><rect x="300" y="590" width="1000" height="70" rx="18" fill="#eefbf4"/><text x="800" y="635" text-anchor="middle" fill="#166534" font-family="Arial" font-size="29" font-weight="700">UNIT 1 → UNIT 2: repeat exactly the same order</text><rect x="90" y="685" width="1420" height="100" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="726" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="763" fill="#0f172a" font-family="Arial" font-size="27">What action comes after the two claps? Can you perform the whole unit twice?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE04 • SkillrHub • skillrhub.com</text></svg>