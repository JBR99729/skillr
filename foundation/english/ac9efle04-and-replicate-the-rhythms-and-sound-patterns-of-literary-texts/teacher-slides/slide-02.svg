<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE04 — Keep the beat and hear the rhyme</title><desc id="d">Separate the steady beat from matching end sounds in a short rhyme.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Keep the beat and hear the rhyme</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">The beat is the steady pulse. Rhyme is the matching sound at the end of words.</text><g font-family="Arial"><rect x="100" y="330" width="650" height="235" rx="28" fill="#e8eef9"/><text x="425" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">STEADY BEAT</text><text x="425" y="445" text-anchor="middle" fill="#0f172a" font-size="30">Tap your knee, count to three.</text><text x="425" y="500" text-anchor="middle" fill="#173a72" font-size="34" font-weight="700">●   ●   ●   ●</text><rect x="850" y="330" width="650" height="235" rx="28" fill="#fff7e6"/><text x="1175" y="385" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">RHYME</text><text x="1175" y="445" text-anchor="middle" fill="#0f172a" font-size="30">count to <tspan font-weight="700">three</tspan></text><text x="1175" y="495" text-anchor="middle" fill="#0f172a" font-size="30">sway with <tspan font-weight="700">me</tspan></text><text x="1175" y="535" text-anchor="middle" fill="#9a5b00" font-size="25">same ending sound</text></g><rect x="90" y="600" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="643" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="681" fill="#0f172a" font-family="Arial" font-size="27">Tap the beat. Then say the two rhyming words. What is different about beat and rhyme?</text><rect x="90" y="725" width="1420" height="80" rx="22" fill="#ecfdf5"/><text x="130" y="774" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: keep the beat going while changing the words so children hear that beat ≠ rhyme.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE04 • SkillrHub • skillrhub.com</text></svg>