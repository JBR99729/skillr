<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE02 — Respond to a story event with evidence</title><desc id="d">Link the story event to a reader feeling or thought and support it with a story clue.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Respond to a story event with evidence</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">A strong response says what happened, how you responded, and what clue caused it.</text><g font-family="Arial"><rect x="80" y="330" width="340" height="220" rx="28" fill="#e8eef9"/><text x="250" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">EVENT</text><text x="250" y="448" text-anchor="middle" fill="#0f172a" font-size="29">Niko loses</text><text x="250" y="488" text-anchor="middle" fill="#0f172a" font-size="29">a red boot.</text><rect x="470" y="330" width="340" height="220" rx="28" fill="#fff7e6"/><text x="640" y="385" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">MY RESPONSE</text><text x="640" y="465" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="700">worried</text><rect x="860" y="330" width="340" height="220" rx="28" fill="#eefbf4"/><text x="1030" y="385" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">STORY CLUE</text><text x="1030" y="448" text-anchor="middle" fill="#0f172a" font-size="28">rain +</text><text x="1030" y="488" text-anchor="middle" fill="#0f172a" font-size="28">missing boot</text><rect x="1250" y="330" width="270" height="220" rx="28" fill="#e8eef9"/><text x="1385" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">LATER</text><text x="1385" y="448" text-anchor="middle" fill="#0f172a" font-size="28">boot returns</text><text x="1385" y="490" text-anchor="middle" fill="#0f172a" font-size="31" font-weight="700">relieved</text><text x="438" y="455" fill="#64748b" font-size="38">→</text><text x="828" y="455" fill="#64748b" font-size="38">→</text><text x="1218" y="455" fill="#64748b" font-size="38">→</text></g><rect x="90" y="590" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="633" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="671" fill="#0f172a" font-family="Arial" font-size="27">When Niko loses the boot, how do you respond? Which story clue caused that response?</text><rect x="90" y="715" width="1420" height="90" rx="22" fill="#ecfdf5"/><text x="130" y="755" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="789" fill="#0f172a" font-family="Arial" font-size="25">Keep “character feeling” separate from “reader response”, then point back to exact story evidence.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE02 • SkillrHub • skillrhub.com</text></svg>