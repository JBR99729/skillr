<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE02 — Explain a thought about a character</title><desc id="d">Use a character action as evidence for a reader thought.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 8</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Explain a thought about a character</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">A reader thought becomes stronger when a character action proves it.</text><g font-family="Arial"><rect x="120" y="340" width="410" height="220" rx="28" fill="#e8eef9"/><text x="325" y="395" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">ACTION</text><text x="325" y="452" text-anchor="middle" fill="#0f172a" font-size="28">Gives the last</text><text x="325" y="492" text-anchor="middle" fill="#0f172a" font-size="28">fruit to a hungry friend.</text><rect x="595" y="340" width="410" height="220" rx="28" fill="#fff7e6"/><text x="800" y="395" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">MY THOUGHT</text><text x="800" y="472" text-anchor="middle" fill="#0f172a" font-size="36" font-weight="700">caring</text><rect x="1070" y="340" width="410" height="220" rx="28" fill="#eefbf4"/><text x="1275" y="395" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">WHY?</text><text x="1275" y="452" text-anchor="middle" fill="#0f172a" font-size="28">The friend</text><text x="1275" y="492" text-anchor="middle" fill="#0f172a" font-size="28">was hungry.</text><text x="555" y="462" fill="#64748b" font-size="42">→</text><text x="1030" y="462" fill="#64748b" font-size="42">→</text></g><rect x="90" y="610" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="653" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="691" fill="#0f172a" font-family="Arial" font-size="27">What action shows the character is caring? Could a different supported thought also fit?</text><rect x="90" y="735" width="1420" height="70" rx="22" fill="#ecfdf5"/><text x="130" y="779" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: ask for the action first, then the thought it supports.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE02 • SkillrHub • skillrhub.com</text></svg>