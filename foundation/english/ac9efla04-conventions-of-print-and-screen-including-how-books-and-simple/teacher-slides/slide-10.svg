<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA04 — 60-second Quick Check / Turn and Talk</title><desc id="d">Use one quick check, then move directly into the matching Practice activity.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">10 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">60-second Quick Check / Turn and Talk</text><text x="90" y="245" fill="#334155" font-family="Arial" font-size="30">Use one question to check understanding before independent practice.</text><rect x="90" y="340" width="1420" height="205" rx="26" fill="#e8eef9"/><text x="132" y="390" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">Choose one quick check</text><text x="132" y="440" fill="#0f172a" font-family="Arial" font-size="28">• Show where reading begins and trace the path across a book page.</text><text x="132" y="482" fill="#0f172a" font-family="Arial" font-size="28">• What might a speaker icon do? What clue supports your answer?</text><text x="132" y="524" fill="#0f172a" font-family="Arial" font-size="28">• Name one clue shared by books and screens, and one that is different.</text><rect x="90" y="575" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="618" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="656" fill="#0f172a" font-family="Arial" font-size="27">Turn and talk for 60 seconds. Share one answer and the evidence that supports it.</text><rect x="90" y="700" width="1420" height="105" rx="22" fill="#ecfdf5"/><text x="130" y="742" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move</text><text x="130" y="785" fill="#0f172a" font-family="Arial" font-size="24">Sample two responses, then send students straight into Practice.</text><a href="/quiz/grade-k/english/ac9efla04/practice/" target="_top"><rect x="1110" y="726" width="355" height="62" rx="18" fill="#173a72"/><text x="1287" y="766" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Practice this topic →</text></a><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA04 • SkillrHub • skillrhub.com</text></svg>