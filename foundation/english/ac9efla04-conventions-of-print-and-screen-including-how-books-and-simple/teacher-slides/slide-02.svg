<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA04 — Trace the reading path through a book</title><desc id="d">Show cover, first page, reading direction and page turn as a clear sequence.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Trace the reading path through a book</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Book clues help us know where to start and how to move through the text.</text><rect x="100" y="330" width="320" height="285" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="465" y="330" width="320" height="285" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="830" y="330" width="320" height="285" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="1195" y="330" width="320" height="285" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="260" y="385" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">1. COVER + TITLE</text><rect x="175" y="420" width="170" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="260" y="490" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="27" font-weight="700">BUSY BEES</text><text x="625" y="385" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">2. FIRST PAGE</text><circle cx="545" cy="445" r="15" fill="#16a34a"/><text x="625" y="455" fill="#0f172a" font-family="Arial" font-size="27">Start here</text><text x="545" y="515" fill="#0f172a" font-family="Arial" font-size="26">Bees buzz.</text><text x="990" y="385" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">3. READ ACROSS</text><path d="M900 455 H1075" stroke="#2563eb" stroke-width="7" marker-end="url(#a)"/><path d="M1070 505 C1015 550 950 545 905 545" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><text x="990" y="585" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">left → right, then next line</text><text x="1355" y="385" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">4. TURN PAGE</text><path d="M1280 430 Q1390 485 1280 545" fill="none" stroke="#d97706" stroke-width="10"/><text x="1355" y="585" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">continue to the next page</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect x="90" y="655" width="1420" height="150" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="703" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="750" fill="#0f172a" font-family="Arial" font-size="28">Show where you would begin reading, then trace the path your eyes would follow.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA04 • SkillrHub • skillrhub.com</text></svg>