<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLA04 — Use screen clues to choose the next action</title><desc id="d">Show how a title, speaker icon and Next button guide a reader through a simple screen text.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Use screen clues to choose the next action</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="29">Screen features tell us where we are and what we can do next.</text><rect x="200" y="320" width="1200" height="335" rx="28" fill="#fff" stroke="#94a3b8" stroke-width="4"/><rect x="200" y="320" width="1200" height="70" rx="28" fill="#dbeafe"/><text x="250" y="365" fill="#1e3a8a" font-family="Arial" font-size="30" font-weight="700">Australian Animals</text><circle cx="420" cy="500" r="70" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/><path d="M385 500 l30 -25 v50 z" fill="#0891b2"/><path d="M430 475 Q470 500 430 525" fill="none" stroke="#0891b2" stroke-width="7"/><text x="420" y="600" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">Speaker icon</text><text x="420" y="632" text-anchor="middle" fill="#334155" font-family="Arial" font-size="23">hear the words</text><rect x="650" y="435" width="300" height="135" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="800" y="490" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">TITLE</text><text x="800" y="532" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24">tells what the page is about</text><rect x="1080" y="455" width="210" height="85" rx="20" fill="#173a72"/><text x="1185" y="507" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Next →</text><text x="1185" y="600" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25">move to next page</text><rect x="90" y="680" width="1420" height="125" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="725" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="770" fill="#0f172a" font-family="Arial" font-size="28">What might the speaker icon do? Which clue helped you decide?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLA04 • SkillrHub • skillrhub.com</text></svg>