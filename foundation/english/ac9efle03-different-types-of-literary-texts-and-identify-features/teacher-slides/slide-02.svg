<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE03 — Map the features of a short story</title><desc id="d">Identify character, beginning, events and ending in a short story.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Map the features of a short story</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">Characters are who. Events are what happens. Beginning and ending mark the story boundaries.</text><g font-family="Arial"><rect x="80" y="330" width="340" height="225" rx="28" fill="#e8eef9"/><text x="250" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">CHARACTER</text><text x="250" y="465" text-anchor="middle" fill="#0f172a" font-size="38" font-weight="700">Mina</text><rect x="470" y="330" width="340" height="225" rx="28" fill="#eefbf4"/><text x="640" y="385" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">BEGINNING</text><text x="640" y="448" text-anchor="middle" fill="#0f172a" font-size="28">finds a</text><text x="640" y="488" text-anchor="middle" fill="#0f172a" font-size="28">shining shell</text><rect x="860" y="330" width="340" height="225" rx="28" fill="#fff7e6"/><text x="1030" y="385" text-anchor="middle" fill="#9a5b00" font-size="27" font-weight="700">EVENTS</text><text x="1030" y="448" text-anchor="middle" fill="#0f172a" font-size="28">takes it home</text><text x="1030" y="488" text-anchor="middle" fill="#0f172a" font-size="28">listens to it</text><rect x="1250" y="330" width="270" height="225" rx="28" fill="#e8eef9"/><text x="1385" y="385" text-anchor="middle" fill="#173a72" font-size="27" font-weight="700">ENDING</text><text x="1385" y="448" text-anchor="middle" fill="#0f172a" font-size="27">returns shell</text><text x="1385" y="488" text-anchor="middle" fill="#0f172a" font-size="27">to beach</text><text x="438" y="458" fill="#64748b" font-size="38">→</text><text x="828" y="458" fill="#64748b" font-size="38">→</text><text x="1218" y="458" fill="#64748b" font-size="38">→</text></g><rect x="90" y="600" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="643" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="681" fill="#0f172a" font-family="Arial" font-size="27">Who is the character? What happens first, in the middle, and at the end?</text><rect x="90" y="725" width="1420" height="80" rx="22" fill="#ecfdf5"/><text x="130" y="774" fill="#166534" font-family="Arial" font-size="25" font-weight="700">Teacher move: ask “who?” for character and “what happened?” for event.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE03 • SkillrHub • skillrhub.com</text></svg>