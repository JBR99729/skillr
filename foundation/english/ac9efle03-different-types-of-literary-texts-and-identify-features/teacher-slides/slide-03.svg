<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9EFLE03 — Find a story inside a poem</title><desc id="d">Identify a character and ordered story events carried by a poem.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="270" transform="rotate(-18 100 270)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="780" transform="rotate(-18 180 780)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation English</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="168" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">Find a story inside a poem</text><text x="90" y="236" fill="#334155" font-family="Arial" font-size="29">A poem can use lines and rhythm while still carrying a character and ordered events.</text><g font-family="Arial"><rect x="90" y="330" width="300" height="210" rx="26" fill="#e8eef9"/><text x="240" y="382" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">TEXT TYPE</text><text x="240" y="462" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="700">story poem</text><rect x="435" y="330" width="300" height="210" rx="26" fill="#eefbf4"/><text x="585" y="382" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">CHARACTER</text><text x="585" y="462" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="700">sleepy bird</text><rect x="780" y="330" width="300" height="210" rx="26" fill="#fff7e6"/><text x="930" y="382" text-anchor="middle" fill="#9a5b00" font-size="26" font-weight="700">BEGINNING</text><text x="930" y="462" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="700">wakes</text><rect x="1125" y="330" width="385" height="210" rx="26" fill="#e8eef9"/><text x="1318" y="382" text-anchor="middle" fill="#173a72" font-size="26" font-weight="700">ENDING</text><text x="1318" y="444" text-anchor="middle" fill="#0f172a" font-size="30">reaches</text><text x="1318" y="484" text-anchor="middle" fill="#0f172a" font-size="30">the tree</text></g><rect x="245" y="565" width="1110" height="72" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="800" y="611" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29">wakes → stretches → flies → reaches the tree</text><rect x="90" y="665" width="1420" height="105" rx="22" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="708" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="746" fill="#0f172a" font-family="Arial" font-size="27">Which event begins the poem? Which event ends it? What happens in between?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9EFLE03 • SkillrHub • skillrhub.com</text></svg>