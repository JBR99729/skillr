<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Always name the reference object</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="28">Position words need something to be relative to.</text><rect x="90" y="300" width="1420" height="340" rx="26" fill="#e8eef9"/><g font-family="Arial" text-anchor="middle"><text x="360" y="370" fill="#173a72" font-size="28" font-weight="700">INSIDE THE BOX</text><rect x="260" y="415" width="200" height="120" rx="12" fill="#fff" stroke="#475569" stroke-width="4"/><circle cx="360" cy="475" r="28" fill="#f0b429"/><text x="800" y="370" fill="#173a72" font-size="28" font-weight="700">UNDER THE TABLE</text><line x1="690" y1="445" x2="910" y2="445" stroke="#475569" stroke-width="8"/><line x1="720" y1="445" x2="720" y2="545" stroke="#475569" stroke-width="8"/><line x1="880" y1="445" x2="880" y2="545" stroke="#475569" stroke-width="8"/><circle cx="800" cy="520" r="28" fill="#f0b429"/><text x="1240" y="370" fill="#173a72" font-size="28" font-weight="700">BESIDE THE CHAIR</text><rect x="1150" y="420" width="95" height="95" fill="#fff" stroke="#475569" stroke-width="4"/><line x1="1170" y1="515" x2="1170" y2="565" stroke="#475569" stroke-width="5"/><line x1="1225" y1="515" x2="1225" y2="565" stroke="#475569" stroke-width="5"/><circle cx="1325" cy="490" r="28" fill="#f0b429"/></g><text x="800" y="600" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">ball + position word + reference object = precise location</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Choose one picture and describe the ball’s position in a complete sentence.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFSP02 • SkillrHub • skillrhub.com</text></svg>