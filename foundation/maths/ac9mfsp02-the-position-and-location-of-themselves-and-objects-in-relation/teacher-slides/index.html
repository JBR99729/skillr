: Position words describe where something is in relation to another person, object or place.</li></ul></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>4 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E2: describing where they have moved themselves and items in relation to other items within a space, using familiar terms; for example, playing a hiding game and when asked “Where did you hide the ball?”, responding, “I hid it behind the garbage bin over there near the bench” Learning connection: Position words describe where something is in relation to another person, object or place.</li><li>E3: describing the position of a robotic toy in relation to other objects as it moves around a familiar space; for example, describing the position of a robotic car as being under the desk or next to the chair Learning connection: Position words describe where something is in relation to another person, object or place.</li></ul></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>5 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>E4: exploring First Nations Australians’ instructive games; for example, Thapumpan from the Wik-Mungkan Peoples of Cape Bedford in north Queensland, describing position and movement of self in relation to other participants, objects or locations Learning connection: Position words describe where something is in relation to another person, object or place.</li><li>Always name the reference object: INSIDE [ ● ] The ball is inside the box. UNDER TABLE ───── ● The ball is under the table. BESIDE CHAIR ● The ball is beside the chair. Think aloud: Build or point to the model first, explain what each part shows, then state the answer.</li></ul></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>6 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 4</h2><ul><li>Use more than one clue: “The scissors are in the box, on the bottom shelf, at the back of the classroom.” Specific relational words make a location easier to find.</li></ul></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>7 / 11</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about describe position and location in familiar spaces?</dt><dd>describe the position and location of themselves and objects in relation to other people and objects within a familiar space</dd><dt>Which model or example can show describe position and location in familiar spaces?</dt><dd>Always name the reference object: INSIDE [ ● ] The ball is inside the box. UNDER TABLE ───── ● The ball is under the table. BESIDE CHAIR ● The ball is beside the chair. Think aloud: Build or point to the model first, explain what each part shows, then state the answer.</dd></dl></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>8 / 11</span></header><div class="slide-content"><h2>Important questions and answers 2</h2><dl><dt>What common mistake should be corrected when learning about describe position and location in familiar spaces?</dt><dd>Use more than one clue: “The scissors are in the box, on the bottom shelf, at the back of the classroom.” Specific relational words make a location easier to find.</dd><dt>What routine can students use for describe position and location in familiar spaces?</dt><dd>Best self-check: explain one new example without copying the worked model.</dd></dl></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="assessment" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFSP02</p><span>9 / 11</span></header><div class="slide-content"><h2>Assessment-style questions and review hints 1</h2><div class="two-column"><section><h3>Questions</h3><ul><li>Where is a ball if it is inside a box?</li><li>Which is more precise: “there” or “beside the desk”?</li></ul></section><section><h3>Review hints</h3><ul><li>Main idea: Position words describe where something is in relation to another person, object or place.</li><li>Useful routine: Choose reference → Say position → Move → Describe again → Follow route → Check</li></ul></section></div></div><footer>AC9MFSP02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="assessment" hidden>
