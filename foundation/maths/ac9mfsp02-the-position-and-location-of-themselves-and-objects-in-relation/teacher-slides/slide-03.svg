<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Use more than one clue</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="28">Combine relations to make a location easy to find.</text><rect x="90" y="300" width="1420" height="340" rx="26" fill="#e8eef9"/><text x="130" y="370" fill="#173a72" font-family="Arial" font-size="28" font-weight="700">CLASSROOM LOCATION</text><rect x="190" y="420" width="1220" height="150" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="800" y="475" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="31" font-weight="700">“The scissors are IN the box, ON the bottom shelf, AT the back.”</text><text x="800" y="535" text-anchor="middle" fill="#475569" font-family="Arial" font-size="26">object → relation 1 → reference → relation 2 → second reference</text><text x="800" y="605" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="28" font-weight="700">More precise clues = easier to locate</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Hide a classroom object. Give two position clues so a partner can find it.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFSP02 • SkillrHub • skillrhub.com</text></svg>