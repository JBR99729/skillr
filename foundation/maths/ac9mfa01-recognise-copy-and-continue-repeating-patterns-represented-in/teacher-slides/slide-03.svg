<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Same pattern, new representation</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">The objects can change while the repeating structure stays the same.</text><rect x="90" y="320" width="1420" height="320" rx="26" fill="#e8eef9"/><text x="130" y="370" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">AB structure</text><g><circle cx="230" cy="455" r="38" fill="#ef4444"/><circle cx="330" cy="455" r="38" fill="#2563eb"/><circle cx="430" cy="455" r="38" fill="#ef4444"/><circle cx="530" cy="455" r="38" fill="#2563eb"/></g><text x="380" y="535" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="27" font-weight="700">red – blue – red – blue</text><path d="M650 455 L840 455" stroke="#173a72" stroke-width="6"/><path d="M810 430 L845 455 L810 480" fill="none" stroke="#173a72" stroke-width="6"/><text x="1040" y="430" text-anchor="middle" fill="#7c3aed" font-family="Arial" font-size="34" font-weight="700">CLAP</text><text x="1220" y="430" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="34" font-weight="700">STAMP</text><text x="1040" y="500" text-anchor="middle" fill="#7c3aed" font-family="Arial" font-size="34" font-weight="700">CLAP</text><text x="1220" y="500" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="34" font-weight="700">STAMP</text><text x="1130" y="565" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="27" font-weight="700">same AB pattern in movement</text><rect x="90" y="675" width="1420" height="130" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="718" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="760" fill="#0f172a" font-family="Arial" font-size="27">Turn red–blue–red–blue into a movement pattern. How do you know it is the same pattern?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFA01 • SkillrHub • skillrhub.com</text></svg>