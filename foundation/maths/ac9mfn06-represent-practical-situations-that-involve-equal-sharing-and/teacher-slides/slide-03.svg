<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">3 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Fair or unfair?</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">Compare every share. If the amounts differ, fix the share and check again.</text><rect x="90" y="320" width="650" height="315" rx="26" fill="#feecec"/><rect x="860" y="320" width="650" height="315" rx="26" fill="#ecf8ef"/><text x="130" y="370" fill="#b91c1c" font-family="Arial" font-size="29" font-weight="700">UNFAIR SHARE</text><text x="900" y="370" fill="#166534" font-family="Arial" font-size="29" font-weight="700">FAIR SHARE</text><g fill="#dc2626"><circle cx="230" cy="460" r="22"/><circle cx="290" cy="460" r="22"/><circle cx="350" cy="460" r="22"/><circle cx="410" cy="460" r="22"/><circle cx="230" cy="550" r="22"/><circle cx="290" cy="550" r="22"/></g><g fill="#0f172a" font-family="Arial" font-size="27" font-weight="700"><text x="145" y="470">A</text><text x="145" y="560">B</text></g><text x="485" y="470" fill="#b91c1c" font-family="Arial" font-size="28" font-weight="700">4 ≠ 2</text><text x="485" y="520" fill="#475569" font-family="Arial" font-size="23">Move one counter</text><text x="485" y="552" fill="#475569" font-family="Arial" font-size="23">from A to B.</text><g fill="#16a34a"><circle cx="1010" cy="460" r="22"/><circle cx="1070" cy="460" r="22"/><circle cx="1130" cy="460" r="22"/><circle cx="1010" cy="550" r="22"/><circle cx="1070" cy="550" r="22"/><circle cx="1130" cy="550" r="22"/></g><g fill="#0f172a" font-family="Arial" font-size="27" font-weight="700"><text x="925" y="470">A</text><text x="925" y="560">B</text></g><text x="1250" y="470" fill="#166534" font-family="Arial" font-size="28" font-weight="700">3 = 3</text><text x="1250" y="520" fill="#475569" font-family="Arial" font-size="23">Both shares match.</text><text x="1250" y="552" fill="#475569" font-family="Arial" font-size="23">The share is fair.</text><path d="M745 480 L840 480" stroke="#173a72" stroke-width="6"/><path d="M820 460 L845 480 L820 500" fill="none" stroke="#173a72" stroke-width="6"/><rect x="90" y="675" width="1420" height="130" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="718" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="760" fill="#0f172a" font-family="Arial" font-size="27">Make 2 equal groups from 8 objects. How many are in each group, and how do you know?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN06 • SkillrHub • skillrhub.com</text></svg>