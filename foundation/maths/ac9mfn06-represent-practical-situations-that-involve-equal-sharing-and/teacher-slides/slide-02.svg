<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 9</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Share fairly and check</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">Deal one at a time, then prove every share or group is equal.</text><rect x="90" y="315" width="690" height="330" rx="26" fill="#e8eef9"/><rect x="820" y="315" width="690" height="330" rx="26" fill="#eef6ee"/><text x="130" y="365" fill="#173a72" font-family="Arial" font-size="29" font-weight="700">SHARE 8 BETWEEN 4</text><g fill="#1d4ed8"><circle cx="240" cy="430" r="19"/><circle cx="300" cy="430" r="19"/><circle cx="240" cy="490" r="19"/><circle cx="300" cy="490" r="19"/><circle cx="240" cy="550" r="19"/><circle cx="300" cy="550" r="19"/><circle cx="240" cy="610" r="19"/><circle cx="300" cy="610" r="19"/></g><g fill="#0f172a" font-family="Arial" font-size="27" font-weight="700"><text x="150" y="439">A</text><text x="150" y="499">B</text><text x="150" y="559">C</text><text x="150" y="619">D</text></g><text x="400" y="500" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">2 each</text><text x="400" y="545" fill="#475569" font-family="Arial" font-size="24">Every person has the same amount.</text><text x="860" y="365" fill="#166534" font-family="Arial" font-size="29" font-weight="700">GROUP 9 INTO 3</text><g fill="#16a34a"><circle cx="965" cy="455" r="20"/><circle cx="1025" cy="455" r="20"/><circle cx="1085" cy="455" r="20"/><circle cx="1160" cy="455" r="20"/><circle cx="1220" cy="455" r="20"/><circle cx="1280" cy="455" r="20"/><circle cx="1355" cy="455" r="20"/><circle cx="1415" cy="455" r="20"/><circle cx="1475" cy="455" r="20"/></g><rect x="925" y="410" width="200" height="90" rx="18" fill="none" stroke="#166534" stroke-width="3"/><rect x="1120" y="410" width="200" height="90" rx="18" fill="none" stroke="#166534" stroke-width="3"/><rect x="1315" y="410" width="200" height="90" rx="18" fill="none" stroke="#166534" stroke-width="3"/><text x="1165" y="560" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">3 equal groups of 3</text><text x="1165" y="602" text-anchor="middle" fill="#475569" font-family="Arial" font-size="24">Count each group to check.</text><rect x="90" y="675" width="1420" height="130" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="718" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="760" fill="#0f172a" font-family="Arial" font-size="27">Share 6 counters equally between 3 people. How can you prove the share is fair?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN06 • SkillrHub • skillrhub.com</text></svg>