 cards, and counting the number of cards after the deal to ensure they have the same amount Learning connection: A fair share gives each person the same amount, and equal grouping makes groups with the same number of items.</li></ul></div><footer>AC9MFN06 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN06</p><span>4 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E2: representing situations that involve counting several items; for example, 9 beads or 6 \$1 coins, and sharing them equally between 3 people by subitising or counting each group by ones to decide how many beads or coins each person will receive Learning connection: A fair share gives each person the same amount, and equal grouping makes groups with the same number of items.</li><li>E3: exploring instructive games of First Nations Australians that involve sharing; for example, playing Yangamini of the Tiwi Peoples of Bathurst Island to investigate and discuss equal sharing Learning connection: A fair share gives each person the same amount, and equal grouping makes groups with the same number of items.</li></ul></div><footer>AC9MFN06 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN06</p><span>5 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>Share fairly and check: SHARE 8 BETWEEN 4 A: ● ● B: ● ● C: ● ● D: ● ● Each person gets 2. GROUP 9 INTO 3 ● ● ● | ● ● ● | ● ● ● 3 equal groups of 3. CH
