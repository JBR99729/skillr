s Monday, what was yesterday and what is tomorrow? How do you know?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFM02 • SkillrHub • skillrhub.com</text></svg>