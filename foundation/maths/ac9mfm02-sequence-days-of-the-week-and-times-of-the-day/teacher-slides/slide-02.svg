<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Build the day and week sequences</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="28">Use familiar events to make time order visible.</text><rect x="90" y="300" width="1420" height="340" rx="26" fill="#e8eef9"/><text x="130" y="355" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">DAY</text><text x="130" y="410" fill="#0f172a" font-family="Arial" font-size="32">🌅 morning  →  🥪 lunchtime  →  ☀️ afternoon  →  🌙 night</text><text x="130" y="475" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">WEEK</text><text x="130" y="530" fill="#0f172a" font-family="Arial" font-size="30">Mon → Tue → Wed → Thu → Fri → Sat → Sun ↻ Mon</text><text x="130" y="585" fill="#475569" font-family="Arial" font-size="25">The day has an order. The week repeats in a cycle.</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Put in order: night, morning, afternoon, lunchtime. What clue helped you?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFM02 • SkillrHub • skillrhub.com</text></svg>