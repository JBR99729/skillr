iv class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>4 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E4: recognise, write and read numerals on familiar objects, images, texts and labels.</li><li>E5: connect quantities to number names and numerals through stories, counting games and culturally responsive contexts.</li><li>Use first, second, before, after and between: Ordinal words describe position from a clearly marked starting end. START 1st — red 2nd — blue 3rd — green blue is after red • before green • between both Teach: Mark the starting end first. Ask “Which is second?”, “What is before green?” and “Which object is between red and green?” E4</li></ul></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>5 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>Read numerals in familiar places: A numeral may show an amount, an order or a label; it keeps the same number name. 7 door 7 12 bus 12 20 page 20 Teach: Read each numeral aloud, then ask what it is doing there. These examples are labels or positions—not collections to count. E5</li></ul></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>6 / 10</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about numbers to 20?</dt><dd>Numbers to 20</dd><dt>Which model or example can show numbers to 20?</dt><dd>Use first, second, before, after and between: Ordinal words describe position from a clearly marked starting end. START 1st — red 2nd — blue 3rd — green blue is after red • before green • between both Teach: Mark the starting end first. Ask “Which is second?”, “What is before green?” and “Which object is between red and green?” E4</dd></dl></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>7 / 10</span></header><div class="slide-content"><h2>Important questions and answers 2</h2><dl><dt>What common mistake should be corrected when learning about numbers to 20?</dt><dd>Read numerals in familiar places: A numeral may show an amount, an order or a label; it keeps the same number name. 7 door 7 12 bus 12 20 page 20 Teach: Read each numeral aloud, then ask what it is doing there. These examples are labels or positions—not collections to count. E5</dd><dt>What routine can students use for numbers to 20?</dt><dd>Words such as first, second, before, after and between describe order and position.</dd></dl></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="assessment" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>8 / 10</span></header><div class="slide-content"><h2>Assessment-style questions and review hints 1</h2><div class="two-column"><section><h3>Questions</h3><ul><li>What is the key idea when learning about numbers to 20?</li><li>Which model or example can show numbers to 20?</li></ul></section><section><h3>Review hints</h3><ul><li>A number tells how many; a numeral is the written symbol for that number.</li><li>Zero means none. It belongs before 1 when numbers are ordered from 0 to 20.</li></ul></section></div></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="assessment" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>9 / 10</span></header><div class="slide-content"><h2>Assessment-style questions and review hints 2</h2><div class="two-column"><section><h3>Questions</h3><ul><li>What common mistake should be corrected when learning about numbers to 20?</li><li>What routine can students use for numbers to 20?</li></ul></section><section><h3>Review hints</h3><ul><li>A quantity can be shown with objects, dots, ten-frames, number names or numerals.</li><li>Teen numbers are one full ten and some extra ones: 14 is 10 and 4 more.</li></ul></section></div></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="exit-ticket" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN01</p><span>10 / 10</span></header><div class="slide-content"><h2>Exit ticket</h2><ul><li>What is the key idea when learning about numbers to 20?</li><li>Which model or example can show numbers to 20?</li><li>What common mistake should be corrected when learning about numbers to 20?</li><li>What routine can students use for numbers to 20?</li></ul></div><footer>AC9MFN01 • SkillrHub • skillrhub.com</footer></figure></div><div class="fixed-slide-viewer__controls"><button type="button" d
