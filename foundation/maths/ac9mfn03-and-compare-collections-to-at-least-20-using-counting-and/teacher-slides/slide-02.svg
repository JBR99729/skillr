<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Count once and keep the total</text><text x="90" y="248" fill="#334155" font-family="Arial" font-size="30">Touch or move each object once. The final count tells how many.</text><rect x="90" y="330" width="1420" height="310" rx="26" fill="#e8eef9"/><text x="130" y="380" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">Model / example</text><rect x="125" y="410" width="420" height="180" rx="20" fill="white"/><text x="155" y="450" fill="#173a72" font-family="Arial" font-size="24" font-weight="700">1. TOUCH OR MOVE</text><g fill="#2563eb"><circle cx="180" cy="510" r="18"/><circle cx="230" cy="510" r="18"/><circle cx="280" cy="510" r="18"/><circle cx="330" cy="510" r="18"/><circle cx="380" cy="510" r="18"/><circle cx="430" cy="510" r="18"/><circle cx="480" cy="510" r="18"/></g><text x="170" y="558" fill="#334155" font-family="Arial" font-size="22">Count 1, 2, 3, 4, 5, 6, 7</text><rect x="590" y="410" width="330" height="180" rx="20" fill="white"/><text x="620" y="450" fill="#173a72" font-family="Arial" font-size="24" font-weight="700">2. STATE TOTAL</text><text x="755" y="535" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="82" font-weight="700">7</text><rect x="965" y="410" width="505" height="180" rx="20" fill="white"/><text x="995" y="450" fill="#173a72" font-family="Arial" font-size="24" font-weight="700">3. REARRANGE</text><g fill="#2563eb"><circle cx="1040" cy="500" r="18"/><circle cx="1110" cy="470" r="18"/><circle cx="1190" cy="525" r="18"/><circle cx="1270" cy="475" r="18"/><circle cx="1350" cy="525" r="18"/><circle cx="1420" cy="470" r="18"/><circle cx="1135" cy="550" r="18"/></g><text x="995" y="578" fill="#334155" font-family="Arial" font-size="22">Still 7 — spacing does not change quantity.</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Count the 7 counters, rearrange them, then explain why the total stays 7.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN03 • SkillrHub • skillrhub.com</text></svg>
