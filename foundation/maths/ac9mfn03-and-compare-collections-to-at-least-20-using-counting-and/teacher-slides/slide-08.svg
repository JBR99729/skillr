<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">8 / 11</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">E5: Use one-to-one body tallying from an</text><text x="90" y="226" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">appropriate source</text><text x="90" y="300" fill="#334155" font-family="Arial" font-size="30" font-weight="400">Teach E5 explicitly and visually.</text><rect x="90" y="385" width="1420" height="255" rx="26" fill="#e8eef9"/><text x="130" y="432" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">Model / example</text><text x="130" y="482" fill="#0f172a" font-family="Arial" font-size="28" font-weight="400">In a taught body-tally system, each next object is paired with the next</text><text x="130" y="519" fill="#0f172a" font-family="Arial" font-size="28" font-weight="400">body point in a fixed sequence. This uses the same one-to-one principle as</text><text x="130" y="556" fill="#0f172a" font-family="Arial" font-size="28" font-weight="400">touching each object while counting.</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27" font-weight="400">Using the sourced sequence, match 5 objects to 5 taught body points and</text><text x="130" y="789" fill="#0f172a" font-family="Arial" font-size="27" font-weight="400">explain the one-to-one correspondence.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN03 • SkillrHub • skillrhub.com</text></svg>
