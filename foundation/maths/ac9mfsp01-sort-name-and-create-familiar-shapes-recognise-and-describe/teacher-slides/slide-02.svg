<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 11</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Describe features, not just appearance</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="28">Use sides, corners and curves as evidence.</text><rect x="90" y="300" width="1420" height="340" rx="26" fill="#e8eef9"/><g font-family="Arial" text-anchor="middle"><text x="350" y="395" fill="#173a72" font-size="30" font-weight="700">TRIANGLE</text><text x="350" y="505" fill="#0f172a" font-size="100">△</text><text x="350" y="570" fill="#475569" font-size="26">3 straight sides • 3 corners</text><text x="800" y="395" fill="#173a72" font-size="30" font-weight="700">SQUARE</text><text x="800" y="505" fill="#0f172a" font-size="100">□</text><text x="800" y="570" fill="#475569" font-size="26">4 equal straight sides • 4 corners</text><text x="1250" y="395" fill="#173a72" font-size="30" font-weight="700">CIRCLE</text><text x="1250" y="505" fill="#0f172a" font-size="100">○</text><text x="1250" y="570" fill="#475569" font-size="26">curved boundary • no corners</text></g><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Choose one shape. Name it and prove your answer using its features.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFSP01 • SkillrHub • skillrhub.com</text></svg>