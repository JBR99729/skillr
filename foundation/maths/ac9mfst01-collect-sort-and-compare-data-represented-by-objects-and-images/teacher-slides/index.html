ted consistently, displayed clearly and compared.</li><li>E2: collecting and deciding how to organise data to answer “Yes/No” questions; for example, “Do more people in our class today have shoes with laces than without?”; explaining that lining up, and matching shoes with and without laces one-to-one will answer the question Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li></ul></div><footer>AC9MFST01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFST01</p><span>4 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E3: creating classroom charts and rosters using stickers to represent data; comparing and interpreting representations Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li><li>E4: role-playing being a robot that sorts objects into groups based on a set of instructions; for example, imitating a robot designed to pack things away in the classroom or an industrial robot programmed to sort products on an assembly line by colour or shape Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li></ul></div><footer>AC9MFST01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFST01</p><span>5 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>E5: role-playing, as a class, at training an artificial intelligence system to recognise objects, asking yes/no questions to gather data to make the best guess about the identification of a mystery object Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li><li>E6: investigating statistical contexts after reading a story, such as &quot;The Waterhole&quot; by Graeme Base; asking and responding to questions like “What different animals did you see?”, “How many different types of animals were there?” or “Were there more tigers or kangaroos?” Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li></ul></div><footer>AC9MFST01 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFST01</p><span>6 / 11</span></header><div class="slide-content"><h2>Elaboration expansion and examples 4</h2><ul><li>E7: exploring what and how information from the environment is collected and used by First Nations Australians to predict weather events Learning connection: Data helps answer a question when responses are collected, sorted consistently, displayed clearly and compared.</li><li>From question to answer: ASK “Do more children have shoes with laces or without laces?” COLLECT + SORT laces: 👟 👟 👟 👟 no laces: 👟 👟 👟 COMPARE Line rows up. The laces category has one more response. Think aloud: Build or point to the model first, explain what each part shows, then state the answer.</li><li>Display data so comparison is easy: moves: ● ● ● ● ● doesn&#39;t move:● ● ● Aligned rows make “most”, “least” and “same” easier to see.</li></ul></div><footer>AC9MF
