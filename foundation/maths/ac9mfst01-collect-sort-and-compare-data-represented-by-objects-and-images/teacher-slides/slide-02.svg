th="3"/><text x="1230" y="515" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="25" font-weight="700">COMPARE</text><text x="1230" y="560" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="27" font-weight="700">laces has 1 more</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Which category has more? Point to the evidence in the display.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFST01 • SkillrHub • skillrhub.com</text></svg>