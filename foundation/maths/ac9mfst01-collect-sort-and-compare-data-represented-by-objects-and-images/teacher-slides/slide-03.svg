<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">3 / 13</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Display data so comparison is easy</text><text x="90" y="235" fill="#334155" font-family="Arial" font-size="28">Aligned rows let us match one-to-one and see what is left unmatched.</text><rect x="90" y="300" width="1420" height="340" rx="26" fill="#e8eef9"/><line x1="390" y1="370" x2="390" y2="585" stroke="#94a3b8" stroke-width="4"/><text x="130" y="430" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">moves</text><text x="430" y="430" fill="#0f172a" font-family="Arial" font-size="40">●  ●  ●  ●  ●</text><text x="130" y="520" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">doesn't move</text><text x="430" y="520" fill="#0f172a" font-family="Arial" font-size="40">●  ●  ●</text><path d="M920 405 L920 545" stroke="#b45309" stroke-width="4" stroke-dasharray="8 8"/><text x="1090" y="430" fill="#b45309" font-family="Arial" font-size="25" font-weight="700">2 unmatched</text><text x="1090" y="475" fill="#0f172a" font-family="Arial" font-size="28">so “moves” has</text><text x="1090" y="515" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">2 more</text><text x="800" y="600" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">Same starting line + one marker per response = fair comparison</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">How many more are in the first category? Show the unmatched markers.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFST01 • SkillrHub • skillrhub.com</text></svg>