<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">3 / 10</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Find different partitions</text><text x="90" y="248" fill="#334155" font-family="Arial" font-size="30">Different pairs of parts can make the same whole.</text><rect x="90" y="360" width="1420" height="300" rx="26" fill="#e8eef9"/><text x="165" y="430" fill="#173a72" font-family="Arial" font-size="26" font-weight="700">WHOLE = 6</text><rect x="150" y="465" width="400" height="150" rx="20" fill="#ffffff"/><rect x="600" y="465" width="400" height="150" rx="20" fill="#ffffff"/><rect x="1050" y="465" width="400" height="150" rx="20" fill="#ffffff"/><text x="350" y="515" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">● ● ● ● ● | ●</text><text x="350" y="575" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="38" font-weight="700">5 + 1 = 6</text><text x="800" y="515" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">● ● ● ● | ● ●</text><text x="800" y="575" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="38" font-weight="700">4 + 2 = 6</text><text x="1250" y="515" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="34">● ● ● | ● ● ●</text><text x="1250" y="575" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="38" font-weight="700">3 + 3 = 6</text><rect x="90" y="685" width="1420" height="120" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="772" fill="#0f172a" font-family="Arial" font-size="27">Show another way to make 6 using two parts. What stays the same?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN04 • SkillrHub • skillrhub.com</text></svg>
