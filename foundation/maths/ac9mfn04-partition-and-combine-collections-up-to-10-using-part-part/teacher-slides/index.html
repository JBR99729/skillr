ning collections of up to 10 objects in different ways and saying the part-part-whole relationship; for example, partitioning a collection of 6 counters into 4 counters and 2 counters and saying, “6 is 4 and 2 more, it’s 2 and 4”, then partitioning the same collection into 5 and one or 3 and 3 Learning connection: A whole number can be split into parts in different ways, and the parts can be recombined to make the same whole.</li></ul></div><footer>AC9MFN04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN04</p><span>4 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E3: representing part-part-whole relationships in numbers up to 10 using physical or virtual materials; for example, identifying numbers represented by dots in standard number configurations such as dominos and dice by recognising parts that form the whole Learning connection: A whole number can be split into parts in different ways, and the parts can be recombined to make the same whole.</li></ul></div><footer>AC9MFN04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN04</p><span>5 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>E4: exploring number groupings in First Nations Australians’ counting systems and the different ways of representing these groupings to form and partition numbers, applying this to quantify collections of objects in the environment on Country/Place up to 10 Learning connection: A whole number can be split into parts in different ways, and the parts can be recombined to make the same whole.</li><li>Build, split and recombine 7: WHOLE ● ● ● ● ● ● ● 7 SPLIT ● ● ● ● ● | ● ● 5 and 2 are parts of 7. RECOMBINE 5 + 2 = 7 2 + 5 = 7 The whole stays 7. Think aloud: Build or point to the model first, explain what each part shows, then state the answer.</li><li>Find different partitions: 6 = 5 + 1 6 = 4 + 2 6 = 3 + 3 Ask: “Can you find another way to split 6?”</li></ul></div><footer>AC9MFN04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN04</p><span>6 / 10</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about partition and combine collections up to 10 using part-part-whole relationships?</dt><dd>partition and combine collections up to 10 using part-part-whole relationships and subitising to recognise and name the parts</dd><dt>Which model or example can show partition and combine collections up to 10 using part-part-whole relationships?</dt><dd>Build, split and recombine 7: WHOLE ● ● ● ● ● ● ● 7 SPLIT ● ● ● ● ● | ● ● 5 and 2 are parts of 7. RECOMBINE 5 + 2 = 7 2 + 5 = 7 The whole stays 7. Think aloud: Build or point to the model first, explain what each part shows, then state the answer.</dd></dl></div><footer>AC9MFN04 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN04</p><span>7 / 10</span></header><div class="slide-content"><h2>Important questions
