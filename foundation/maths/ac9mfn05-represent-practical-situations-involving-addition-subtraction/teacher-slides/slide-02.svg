xt><text x="800" y="575" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="30">2 more arrive</text><text x="1260" y="520" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="42">● ● ● ● ● ● ●</text><text x="1260" y="575" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="38" font-weight="700">7 altogether</text><rect x="90" y="685" width="1420" height="120" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="730" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="772" fill="#0f172a" font-family="Arial" font-size="27">3 bears are playing. 2 more join. Show the start, action and result.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN05 • SkillrHub • skillrhub.com</text></svg>
