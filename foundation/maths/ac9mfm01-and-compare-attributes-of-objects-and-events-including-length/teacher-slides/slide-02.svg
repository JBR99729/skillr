<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 10</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">Use a fair comparison method</text><text x="90" y="238" fill="#334155" font-family="Arial" font-size="30">Name the attribute first, then compare it in a fair way.</text><rect x="90" y="315" width="680" height="145" rx="22" fill="#e8eef9"/><rect x="830" y="315" width="680" height="145" rx="22" fill="#eef6ee"/><rect x="90" y="485" width="680" height="145" rx="22" fill="#fff4e8"/><rect x="830" y="485" width="680" height="145" rx="22" fill="#f4eefb"/><text x="130" y="355" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">LENGTH</text><line x1="160" y1="405" x2="355" y2="405" stroke="#1d4ed8" stroke-width="10"/><line x1="160" y1="430" x2="500" y2="430" stroke="#1d4ed8" stroke-width="10"/><line x1="160" y1="385" x2="160" y2="448" stroke="#0f172a" stroke-width="4"/><text x="535" y="420" fill="#0f172a" font-family="Arial" font-size="25">same start → longer</text><text x="870" y="355" fill="#166534" font-family="Arial" font-size="27" font-weight="700">MASS</text><circle cx="965" cy="402" r="38" fill="#94a3b8"/><circle cx="1115" cy="402" r="27" fill="#64748b"/><path d="M900 430 L1180 430" stroke="#166534" stroke-width="5"/><path d="M1040 390 L1040 448" stroke="#166534" stroke-width="5"/><text x="1230" y="420" fill="#0f172a" font-family="Arial" font-size="25">heft or balance</text><text x="130" y="525" fill="#b45309" font-family="Arial" font-size="27" font-weight="700">CAPACITY</text><path d="M190 555 L190 605 L300 605 L300 555" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M380 545 L380 605 L540 605 L540 545" fill="none" stroke="#f59e0b" stroke-width="5"/><text x="580" y="585" fill="#0f172a" font-family="Arial" font-size="25">fill or pour → holds more</text><text x="870" y="525" fill="#7c3aed" font-family="Arial" font-size="27" font-weight="700">DURATION</text><line x1="920" y1="575" x2="1250" y2="575" stroke="#7c3aed" stroke-width="6"/><line x1="920" y1="552" x2="920" y2="598" stroke="#7c3aed" stroke-width="5"/><line x1="1110" y1="552" x2="1110" y2="598" stroke="#7c3aed" stroke-width="5"/><line x1="1250" y1="552" x2="1250" y2="598" stroke="#7c3aed" stroke-width="5"/><text x="920" y="620" fill="#0f172a" font-family="Arial" font-size="20">same start</text><text x="1110" y="620" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="20">A stops</text><text x="1250" y="620" text-anchor="end" fill="#0f172a" font-family="Arial" font-size="20">B stops later</text><rect x="90" y="675" width="1420" height="130" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="718" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="760" fill="#0f172a" font-family="Arial" font-size="27">Which word compares length: heavier or longer? What would make the comparison fair?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFM01 • SkillrHub • skillrhub.com</text></svg>