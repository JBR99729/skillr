<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="100" y="260" transform="rotate(-18 100 260)">SkillrHub • skillrhub.com</text><text x="760" y="565" transform="rotate(-18 760 565)">SkillrHub • skillrhub.com</text><text x="180" y="775" transform="rotate(-18 180 775)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Foundation Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">2 / 8</text><text x="90" y="170" fill="#173a72" font-family="Arial" font-size="49" font-weight="700">See 5 without counting one by one</text><text x="90" y="248" fill="#334155" font-family="Arial" font-size="30">Flash → see familiar parts → name the whole.</text><rect x="90" y="330" width="1420" height="310" rx="26" fill="#e8eef9"/><text x="130" y="382" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">Quick-look model</text><rect x="170" y="420" width="350" height="165" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><g fill="#2563eb"><circle cx="260" cy="470" r="22"/><circle cx="330" cy="470" r="22"/><circle cx="260" cy="535" r="22"/><circle cx="330" cy="535" r="22"/></g><circle cx="430" cy="505" r="22" fill="#f59e0b"/><text x="345" y="615" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="29" font-weight="700">I see 4 and 1</text><text x="660" y="510" fill="#173a72" font-family="Arial" font-size="48" font-weight="700">→</text><text x="790" y="505" fill="#0f172a" font-family="Arial" font-size="38" font-weight="700">4 + 1 = 5</text><text x="790" y="555" fill="#475569" font-family="Arial" font-size="27">No one-by-one counting needed.</text><rect x="90" y="665" width="1420" height="140" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="710" fill="#9a5b00" font-family="Arial" font-size="25" font-weight="700">Student prompt</text><text x="130" y="754" fill="#0f172a" font-family="Arial" font-size="27">Look quickly: how many do you see? Which smaller parts helped you know?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9MFN02 • SkillrHub • skillrhub.com</text></svg>
