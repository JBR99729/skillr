ement on each is different; using subitising to compare and order collections and to say who has more when sharing items in a game</li></ul></div><footer>AC9MFN02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN02</p><span>4 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 2</h2><ul><li>E1 visual teaching: recognise a quantity with a quick look: Flash for two seconds: ● ● ● ● ● What the eyes can see: [● ● / ● ●] + [●] → 4 + 1 → 5 Teacher model: cover the dots and say, “I did not count every dot. I saw a group of 4 and 1 more. Four and one make 5.” Flash a new arrangement and ask the student to name the total and the parts they noticed. E1 guided check: briefly show ● ● ● with ● ● underneath. Cover it. Ask, “How many? What groups did you see?” A secure response names 5 without recounting and explains “3 and 2”.</li></ul></div><footer>AC9MFN02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="elaboration-examples" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN02</p><span>5 / 10</span></header><div class="slide-content"><h2>Elaboration expansion and examples 3</h2><ul><li>E2 visual teaching: match, compare and order different arrangements: Same quantity: Card A: ● ● ● ● ● = Card B: ● ● / ● ● ● Compare: Card B: ● ● / ● ● ● &gt; Card C: ● ● / ● ● Conclusion: 5 is one more than 4. Teacher model: say, “A and B look different, but both show 5 because no dot was added or removed. C shows 4, so A and B have more.” Match cards with equal quantities first, then arrange cards from fewer to more. E2 guided check: show differently arranged cards for 3, 4 and 5. Ask the student to match equal quantities, order them and explain which collection has more using the visual evidence.</li></ul></div><footer>AC9MFN02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN02</p><span>6 / 10</span></header><div class="slide-content"><h2>Important questions and answers 1</h2><dl><dt>What is the key idea when learning about recognise and name the number of objects within a collection up to 5 using subitising?</dt><dd>recognise and name the number of objects within a collection up to 5 using subitising</dd><dt>Which model or example can show recognise and name the number of objects within a collection up to 5 using subitising?</dt><dd>E1 visual teaching: recognise a quantity with a quick look: Flash for two seconds: ● ● ● ● ● What the eyes can see: [● ● / ● ●] + [●] → 4 + 1 → 5 Teacher model: cover the dots and say, “I did not count every dot. I saw a group of 4 and 1 more. Four and one make 5.” Flash a new arrangement and ask the student to name the total and the parts they noticed. E1 guided check: briefly show ● ● ● with ● ● underneath. Cover it. Ask, “How many? What groups did you see?” A secure response names 5 without recounting and explains “3 and 2”.</dd></dl></div><footer>AC9MFN02 • SkillrHub • skillrhub.com</footer></figure><figure class="fixed-slide-viewer__slide" data-slide data-slide-kind="important-questions" hidden><div class="slide-watermark" aria-hidden="true"><span>SkillrHub • skillrhub.com</span><span>SkillrHub • skillrhub.com</span></div><header><p>Foundation Maths • AC9MFN02</p><span>7 / 10</span></header><div class="slide-content"><h2>Important questions and answers 2</h2><dl><dt>What common mistake sh
