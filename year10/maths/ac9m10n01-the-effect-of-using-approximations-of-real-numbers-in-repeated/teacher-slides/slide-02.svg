<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Keep surds exact and apply valid root rules</title><desc id="desc">Exact surd notation preserves value through repeated calculations; early decimal rounding introduces error that later operations can compound.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">2 / 4</text><text x="90" y="175" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Keep surds exact and apply valid root</text><text x="90" y="233" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">rules</text><text x="90" y="310" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">Exact surd notation preserves value through repeated calculations; early</text><text x="90" y="352" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">decimal rounding introduces error that later operations can compound.</text><rect x="90" y="415" width="1420" height="190" rx="26" fill="#e8eef9"/><text x="135" y="466" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Model / key relationship</text><text x="135" y="518" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">√2 (exact) → calculate → round once; 1.414 (rounded early) → repeated</text><text x="135" y="558" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400">calculation → accumulated error</text><rect x="90" y="635" width="1420" height="155" rx="26" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="135" y="683" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Student prompt</text><text x="135" y="730" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">Why is √(a + b) = √a + √b not a valid general rule, and when should a</text><text x="135" y="768" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400">decimal approximation be introduced?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>
