<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Real Numbers: Exact and Approximate</title><desc id="desc">Rational and irrational real numbers, and the distinction between exact values and decimal approximations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">2 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Real Numbers: Exact and Approximate</text><rect x="90" y="230" width="690" height="470" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Real numbers</text><text x="130" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Rational numbers</text><text x="130" y="392" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Can be written as a fraction a/b, b ≠ 0.</text><text x="130" y="445" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Examples: 3/4, −2, 0.125, 1/3</text><text x="130" y="520" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Irrational numbers</text><text x="130" y="567" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Cannot be written as a terminating or recurring</text><text x="130" y="607" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">decimal.</text><text x="130" y="655" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Examples: π, √2, √3, e</text><rect x="820" y="230" width="690" height="470" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Exact vs approximate</text><text x="860" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Exact forms keep the full value:</text><text x="900" y="395" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">π,  √2,  1/3</text><text x="860" y="465" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Approximations replace them with rounded decimals:</text><text x="900" y="515" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">π ≈ 3.14   √2 ≈ 1.41   1/3 ≈ 0.333</text><text x="860" y="590" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Key idea</text><text x="860" y="638" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Every early rounding decision changes the value</text><text x="860" y="676" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">used in every later step.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>