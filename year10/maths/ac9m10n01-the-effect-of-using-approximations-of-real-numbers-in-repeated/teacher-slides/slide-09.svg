<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Applied Repetition: Trig and Finance</title><desc id="desc">Trigonometric and financial examples showing how retained decimal precision affects repeated calculations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">9 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Applied Repetition: Trig and Finance</text><rect x="90" y="230" width="690" height="470" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 8 — trigonometric repetition</text><text x="130" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">sin(37°) ≈ 0.601815…</text><text x="130" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using full calculator precision:</text><text x="130" y="450" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">[sin(37°)]¹² ≈ 0.00225713</text><text x="130" y="515" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using sin(37°) ≈ 0.6018:</text><text x="130" y="560" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">(0.6018)¹² ≈ 0.00225645</text><text x="130" y="625" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Difference ≈ 0.00000068</text><text x="130" y="675" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Good approximation because 0.6018 retains 4 d.p.</text><rect x="820" y="230" width="690" height="470" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 9 — financial rounding</text><text x="860" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">$10,000 at 5% p.a., compounded monthly</text><text x="860" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Unrounded monthly rate = 0.05/12</text><text x="860" y="450" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">After 12 months ≈ $10,511.62</text><text x="860" y="515" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Round monthly rate to 0.42%:</text><text x="860" y="560" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">After 12 months ≈ $10,515.81</text><text x="860" y="625" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Difference ≈ $4.19</text><text x="860" y="675" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Repeated financial calculations reward guard digits.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>