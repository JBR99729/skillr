<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Worked Example: Repeated Division</title><desc id="desc">Repeated division by one third compared with using the decimal approximation 0.333.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">6 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Worked Example: Repeated Division</text><rect x="90" y="230" width="1420" height="445" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Example 4 — repeated division by 1/3</text><text x="130" y="350" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Start with 1 and divide by 1/3 five times.</text><text x="130" y="415" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Exact:</text><text x="300" y="415" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">1 ÷ (1/3)⁵ = 3⁵ = 243</text><text x="130" y="485" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Approximate 1/3 as 0.333:</text><text x="300" y="485" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">1 ÷ (0.333)⁵ ≈ 244.2187</text><text x="130" y="555" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Absolute error ≈ 1.2187</text><text x="650" y="555" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Percentage error ≈ 0.50%</text><text x="130" y="620" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Because 0.333 is slightly smaller than 1/3, dividing by it repeatedly produces a result that is too large.</text><rect x="90" y="700" width="1420" height="85" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="753" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Teacher prompt: Predict the direction of the error before calculating. Will the approximation be high or low?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>