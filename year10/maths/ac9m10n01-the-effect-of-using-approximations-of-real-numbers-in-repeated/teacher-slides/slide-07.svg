<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Worked Example: Error Depends on Precision</title><desc id="desc">Cube-root power example showing that the size of accumulated error depends on the accuracy of the starting approximation.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">7 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Worked Example: Error Depends on Precision</text><rect x="90" y="230" width="1420" height="435" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Example 5 — repeated powers with ∛5</text><text x="130" y="350" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Exact:</text><text x="300" y="350" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">(∛5)⁶ = 5² = 25</text><text x="130" y="425" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Using ∛5 ≈ 1.71:</text><text x="300" y="425" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">(1.71)⁶ ≈ 25.0021</text><text x="130" y="510" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Absolute error ≈ 0.0021</text><text x="130" y="575" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">This approximation happens to stay very close because 1.71 is extremely close to ∛5.</text><text x="130" y="620" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">The important point is not that powers always create a large error — it is that repeated operations can magnify the error you start with.</text><rect x="90" y="700" width="1420" height="85" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="753" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Misconception check: “Repeated multiplication always causes a huge error.” False — size depends on the initial error and operation.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>