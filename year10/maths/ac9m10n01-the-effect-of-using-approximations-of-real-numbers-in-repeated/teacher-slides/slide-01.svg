<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Approximations and Repeated Calculations</title><desc id="desc">Learning goals and success criteria for comparing exact and approximate real-number calculations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">1 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Approximations and Repeated Calculations</text><text x="90" y="235" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="30">Approximations of Real Numbers in Repeated Calculations</text><rect x="90" y="300" width="690" height="350" rx="24" fill="#e8eef9"/><text x="130" y="355" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Learning intention</text><text x="130" y="410" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30">Understand how replacing exact values with</text><text x="130" y="452" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30">rounded decimals changes repeated calculations.</text><text x="130" y="525" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Curriculum focus</text><text x="130" y="578" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30">Compare exact and approximate results and</text><text x="130" y="620" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="30">explain how error can accumulate.</text><rect x="820" y="300" width="690" height="350" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="355" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Success criteria</text><text x="860" y="410" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29">• Identify exact and approximate forms.</text><text x="860" y="462" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29">• Calculate absolute / percentage error.</text><text x="860" y="514" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29">• Predict how repeated operations affect error.</text><text x="860" y="566" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29">• Choose sensible precision and round at the end.</text><text x="860" y="628" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Teacher prompt: When is “close enough” not enough?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>