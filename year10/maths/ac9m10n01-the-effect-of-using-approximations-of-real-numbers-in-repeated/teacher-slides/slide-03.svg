<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Why Approximations Matter</title><desc id="desc">Rounding error, error accumulation, and a strategy for retaining precision in repeated calculations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">3 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Why Approximations Matter</text><rect x="90" y="230" width="1420" height="170" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Rounding error</text><text x="130" y="338" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29">Approximation error = approximate value − exact value.</text><text x="920" y="338" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Absolute error = |approx − exact|</text><rect x="90" y="430" width="690" height="300" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="485" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">How error accumulates</text><text x="130" y="540" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Repeated addition: error usually grows linearly.</text><text x="130" y="590" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Repeated multiplication / powers: even a small</text><text x="130" y="630" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">relative error can be magnified.</text><text x="130" y="680" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Division by an approximation can magnify error too.</text><rect x="820" y="430" width="690" height="300" rx="24" fill="#e8f5e9" stroke="#4f8a55" stroke-width="3"/><text x="860" y="485" fill="#2f6d37" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Best practice</text><text x="860" y="540" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">1. Keep exact values where practical.</text><text x="860" y="590" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">2. Keep guard digits in intermediate steps.</text><text x="860" y="640" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">3. Round once — at the final answer.</text><text x="860" y="690" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">4. Check whether the remaining error is acceptable.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>