<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Summary and Exit Ticket</title><desc id="desc">Summary of approximation error and an exit ticket checking understanding of repeated calculations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">12 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Summary and Exit Ticket</text><rect x="90" y="230" width="690" height="430" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Summary</text><text x="130" y="350" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">• Approximations introduce rounding error.</text><text x="130" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">• Repeated calculations can accumulate that error.</text><text x="130" y="460" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">• Powers, products and division can magnify</text><text x="130" y="500" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">  relative error.</text><text x="130" y="555" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">• Addition/scaling often grows error predictably.</text><text x="130" y="610" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">• Keep exact values / guard digits, then round once.</text><rect x="820" y="230" width="690" height="430" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Exit ticket</text><text x="860" y="350" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">1. Why is (√2)¹⁰ preferable to (1.41)¹⁰?</text><text x="860" y="415" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">2. Does repeated multiplication always create</text><text x="860" y="455" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">   a large error? Explain.</text><text x="860" y="520" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">3. State one rule for reducing rounding error</text><text x="860" y="560" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">   in a multi-step calculation.</text><text x="860" y="625" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Extension: When might an approximation be</text><text x="860" y="665" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">more useful than an exact value?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>