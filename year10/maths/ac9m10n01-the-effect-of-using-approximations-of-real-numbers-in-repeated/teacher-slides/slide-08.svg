<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Applied Approximations: e and g</title><desc id="desc">Applied examples using the exponential constant e and gravitational acceleration g to compare exact or standard values with approximations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">8 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Applied Approximations: e and g</text><rect x="90" y="230" width="690" height="470" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 6 — exponential constant e</text><text x="130" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">A = 1000e⁰·⁵</text><text x="130" y="400" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using e exactly:</text><text x="130" y="445" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">A ≈ 1648.72</text><text x="130" y="505" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using e ≈ 2.72:</text><text x="130" y="550" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">A = 1000√2.72 ≈ 1649.24</text><text x="130" y="615" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Difference ≈ $0.52</text><text x="130" y="665" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Small here — but repeated compounding can build it.</text><rect x="820" y="230" width="690" height="470" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 7 — physics constant g</text><text x="860" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Distance fallen: s = ½gt², t = 4 s</text><text x="860" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using g = 9.81 m/s²:</text><text x="860" y="450" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">s = ½(9.81)(4²) = 78.48 m</text><text x="860" y="515" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using g ≈ 10 m/s²:</text><text x="860" y="560" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">s = ½(10)(4²) = 80.00 m</text><text x="860" y="625" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Difference = 1.52 m</text><text x="860" y="675" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Context decides whether that error is acceptable.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>