<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Worked Example: Powers Magnify Error</title><desc id="desc">Worked example comparing the exact value of square root two raised to the tenth power with a rounded approximation.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">4 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Worked Example: Powers Magnify Error</text><rect x="90" y="230" width="1420" height="430" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Example 1 — repeated multiplication with √2</text><text x="130" y="350" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Exact:</text><text x="300" y="350" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">(√2)¹⁰ = (2)⁵ = 32</text><text x="130" y="425" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Approximate √2 as 1.41:</text><text x="300" y="425" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">(1.41)¹⁰ ≈ 31.0593</text><text x="130" y="510" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Absolute error:</text><text x="390" y="510" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">|31.0593 − 32| ≈ 0.9407</text><text x="130" y="575" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Percentage error:</text><text x="420" y="575" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">0.9407 ÷ 32 × 100 ≈ 2.94%</text><rect x="90" y="690" width="1420" height="95" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="130" y="748" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Teacher prompt: √2 and 1.41 differ by only about 0.0021. Why is the final gap nearly 1?</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>