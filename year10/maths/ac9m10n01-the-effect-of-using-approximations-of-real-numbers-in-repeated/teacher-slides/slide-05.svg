<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Worked Examples: π and Linear Error</title><desc id="desc">Examples using pi in repeated addition and circle circumference to illustrate predictable accumulation of rounding error.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">5 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Worked Examples: π and Linear Error</text><rect x="90" y="230" width="690" height="470" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 2 — repeated addition of π</text><text x="130" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">Exact: 50π ≈ 157.0796</text><text x="130" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using π ≈ 3.14:</text><text x="130" y="452" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">50 × 3.14 = 157.00</text><text x="130" y="515" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Absolute error ≈ 0.0796</text><text x="130" y="580" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Each copy of π is low by ≈ 0.00159,</text><text x="130" y="620" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">so 50 copies build a predictable total error.</text><rect x="820" y="230" width="690" height="470" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Example 3 — geometry using π</text><text x="860" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Circle radius r = 18 cm</text><text x="860" y="402" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Circumference = 2πr = 36π</text><text x="860" y="458" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Exact decimal: 36π ≈ 113.0973 cm</text><text x="860" y="514" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Using π ≈ 3.14: 36 × 3.14 = 113.04 cm</text><text x="860" y="570" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Absolute error ≈ 0.0573 cm</text><text x="860" y="640" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">Takeaway: addition/scaling often makes error grow</text><text x="860" y="678" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">steadily rather than explosively.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>