<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AC9M10N01 — Choosing Precision in Repeated Calculations</title><desc id="desc">A practical precision strategy and guided practice prompts for repeated calculations.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".055" fill="#1d4ed8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><text x="120" y="255" transform="rotate(-18 120 255)">SkillrHub • skillrhub.com</text><text x="790" y="560" transform="rotate(-18 790 560)">SkillrHub • skillrhub.com</text><text x="220" y="765" transform="rotate(-18 220 765)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">SkillrHub • Year 10 Maths</text><text x="1430" y="62" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26">11 / 12</text><text x="90" y="170" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Choosing Precision in Repeated Calculations</text><rect x="90" y="230" width="690" height="470" rx="24" fill="#e8eef9"/><text x="130" y="285" fill="#173a72" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Precision strategy</text><text x="130" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">1. Identify exact forms: π, surds, fractions, e.</text><text x="130" y="400" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">2. Keep them exact for as long as possible.</text><text x="130" y="455" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">3. If decimals are required, keep guard digits.</text><text x="130" y="510" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">4. Perform repeated operations.</text><text x="130" y="565" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">5. Round only the final answer to the requested</text><text x="130" y="605" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">   accuracy.</text><text x="130" y="665" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">6. State units and check whether error is acceptable.</text><rect x="820" y="230" width="690" height="470" rx="24" fill="#fff7e6" stroke="#f0b429" stroke-width="3"/><text x="860" y="285" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Guided practice</text><text x="860" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">A. Compare (√5)⁸ with (2.24)⁸.</text><text x="860" y="405" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">B. Compare 80π with 80 × 3.142.</text><text x="860" y="465" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">C. Explain why rounding a monthly growth rate</text><text x="860" y="505" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="28">   before 60 compounding periods may matter.</text><text x="860" y="575" fill="#9a5b00" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Teacher moves</text><text x="860" y="625" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Ask students to predict high/low before calculating.</text><text x="860" y="670" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="27">Require one sentence interpreting the size of error.</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">AC9M10N01 • SkillrHub • skillrhub.com</text></svg>