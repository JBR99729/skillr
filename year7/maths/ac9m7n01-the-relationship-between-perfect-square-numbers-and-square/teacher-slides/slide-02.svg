<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Squares and square roots</title><desc id="desc">Connect the operation, notation and square model</desc>
<rect width="1280" height="720" fill="#f7faff"/><rect x="0" y="0" width="1280" height="92" fill="#173968"/>
<text x="58" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Squares and square roots</text>
<text x="58" y="128" fill="#2457d6" font-family="Arial,sans-serif" font-size="23" font-weight="700">Connect the operation, notation and square model</text>
<g opacity=".055" fill="#173968" font-family="Arial,sans-serif" font-size="28" font-weight="700">
<text x="110" y="220">SkillrHub • skillrhub.com</text><text x="710" y="220">SkillrHub • skillrhub.com</text>
<text x="110" y="420">SkillrHub • skillrhub.com</text><text x="710" y="420">SkillrHub • skillrhub.com</text>
<text x="110" y="600">SkillrHub • skillrhub.com</text><text x="710" y="600">SkillrHub • skillrhub.com</text></g>
<g font-family="Arial,sans-serif" fill="#18324f"><rect x="70" y="170" width="500" height="410" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="110" y="225" font-size="28" font-weight="700">Squaring</text><text x="110" y="280" font-size="27">12² = 12 × 12 = 144</text><text x="110" y="335" font-size="24">The exponent 2 means:</text><text x="140" y="380" font-size="24">use the same factor twice.</text><rect x="650" y="170" width="560" height="410" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="690" y="225" font-size="28" font-weight="700">Principal square root</text><text x="690" y="285" font-size="30">√144 = 12</text><text x="690" y="340" font-size="24">It reverses squaring and gives</text><text x="690" y="382" font-size="24">the non-negative root.</text><text x="690" y="455" font-size="24" font-weight="700">Check: 12² = 144</text><text x="110" y="525" font-size="23" fill="#b34b24">Trap: 12² is not 12 × 2.</text><text x="690" y="525" font-size="23" fill="#b34b24">√144 is not 144 ÷ 2.</text></g>
<rect x="0" y="670" width="1280" height="50" fill="#173968"/><text x="640" y="703" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">AC9M7N01 • SkillrHub • skillrhub.com</text>
</svg>
