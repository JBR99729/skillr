<g font-family="Arial,sans-serif" fill="#18324f"><rect x="70" y="170" width="540" height="420" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="110" y="225" font-size="27" font-weight="700">Bound √70</text><text x="110" y="285" font-size="25">8² = 64 and 9² = 81</text><text x="110" y="340" font-size="29" fill="#2457d6">8 &lt; √70 &lt; 9</text><text x="110" y="420" font-size="27" font-weight="700">Square tiled floor</text><text x="110" y="475" font-size="24">Area = 144 tiles</text><text x="110" y="520" font-size="24">Side = √144 = 12 tiles</text><text x="110" y="562" font-size="24">Perimeter = 4 × 12 = 48</text><rect x="670" y="170" width="540" height="420" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="710" y="225" font-size="27" font-weight="700">Exit check</text><text x="710" y="285" font-size="24">1. Between which integers is √130?</text><text x="710" y="350" font-size="24">2. Calculate 31² using 30 + 1.</text><text x="710" y="415" font-size="24">3. Why is the second difference 2?</text><text x="710" y="500" font-size="21" fill="#2457d6">Expected: 11–12; 961; odd first</text><text x="710" y="535" font-size="21" fill="#2457d6">differences increase by 2.</text></g>
<rect x="0" y="670" width="1280" height="50" fill="#173968"/><text x="640" y="703" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">AC9M7N01 • SkillrHub • skillrhub.com</text>
