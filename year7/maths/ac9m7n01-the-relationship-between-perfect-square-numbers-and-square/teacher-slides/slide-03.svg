<g font-family="Arial,sans-serif" fill="#18324f"><rect x="100" y="170" width="420" height="420" fill="#e7efff" stroke="#173968" stroke-width="4"/><line x1="450" y1="170" x2="450" y2="590" stroke="#173968" stroke-width="4"/><line x1="100" y1="520" x2="520" y2="520" stroke="#173968" stroke-width="4"/><text x="275" y="355" text-anchor="middle" font-size="25">40 × 40 = 1600</text><text x="485" y="355" text-anchor="middle" font-size="19">40 × 3</text><text x="275" y="562" text-anchor="middle" font-size="19">3 × 40</text><text x="485" y="562" text-anchor="middle" font-size="17">3 × 3</text><text x="275" y="160" text-anchor="middle" font-size="21">40</text><text x="485" y="160" text-anchor="middle" font-size="21">3</text><text x="610" y="235" font-size="28" font-weight="700">43² = (40 + 3)²</text><text x="610" y="305" font-size="25">= 40² + 2 × 40 × 3 + 3²</text><text x="610" y="375" font-size="25">= 1600 + 240 + 9</text><text x="610" y="445" font-size="31" font-weight="700" fill="#2457d6">= 1849</text><text x="610" y="525" font-size="23" fill="#b34b24">Why 2 × 40 × 3?</text><text x="610" y="565" font-size="22">There are two equal cross rectangles.</text></g>
