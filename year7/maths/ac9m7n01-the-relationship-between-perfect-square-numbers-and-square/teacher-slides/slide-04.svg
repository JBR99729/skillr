<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Patterns in consecutive square numbers</title><desc id="desc">E4: odd first differences and constant second difference</desc>
<rect width="1280" height="720" fill="#f7faff"/><rect x="0" y="0" width="1280" height="92" fill="#173968"/>
<text x="58" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Patterns in consecutive square numbers</text>
<text x="58" y="128" fill="#2457d6" font-family="Arial,sans-serif" font-size="23" font-weight="700">E4: odd first differences and constant second difference</text>
<g opacity=".055" fill="#173968" font-family="Arial,sans-serif" font-size="28" font-weight="700">
<text x="110" y="220">SkillrHub • skillrhub.com</text><text x="710" y="220">SkillrHub • skillrhub.com</text>
<text x="110" y="420">SkillrHub • skillrhub.com</text><text x="710" y="420">SkillrHub • skillrhub.com</text>
<text x="110" y="600">SkillrHub • skillrhub.com</text><text x="710" y="600">SkillrHub • skillrhub.com</text></g>
<g font-family="Arial,sans-serif" fill="#18324f"><rect x="70" y="170" width="1140" height="150" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="110" y="225" font-size="27" font-weight="700">Squares</text><text x="310" y="225" font-size="27">1</text><text x="450" y="225" font-size="27">4</text><text x="590" y="225" font-size="27">9</text><text x="725" y="225" font-size="27">16</text><text x="865" y="225" font-size="27">25</text><text x="1000" y="225" font-size="27">36</text><text x="110" y="285" font-size="25" font-weight="700">First difference</text><text x="385" y="285" font-size="25">+3</text><text x="525" y="285" font-size="25">+5</text><text x="665" y="285" font-size="25">+7</text><text x="805" y="285" font-size="25">+9</text><text x="940" y="285" font-size="25">+11</text><rect x="70" y="360" width="540" height="240" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="110" y="420" font-size="27" font-weight="700">What changes?</text><text x="110" y="475" font-size="24">The odd first differences rise by 2.</text><text x="110" y="525" font-size="24">Therefore the second difference is 2.</text><rect x="670" y="360" width="540" height="240" rx="20" fill="#fff" stroke="#cbd8ea" stroke-width="3"/><text x="710" y="420" font-size="27" font-weight="700">Useful shortcut</text><text x="710" y="475" font-size="24">16² = 15² + 31</text><text x="710" y="525" font-size="24">= 225 + 31 = 256</text><text x="710" y="570" font-size="21" fill="#2457d6">The next border contains 31 units.</text></g>
<rect x="0" y="670" width="1280" height="50" fill="#173968"/><text x="640" y="703" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">AC9M7N01 • SkillrHub • skillrhub.com</text>
</svg>
