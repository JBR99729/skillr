<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fbff"/><rect width="1600" height="84" fill="#173968"/><text x="72" y="55" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff">AC9M7N06 • Year 7 Maths • SkillrHub</text><text x="1528" y="55" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#dbeafe">8 / 25</text><text x="86" y="145" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#173968">Add fractions with different denominators</text><rect x="72" y="147" width="1456" height="364" rx="24" fill="#fff" stroke="#c5d8ea" stroke-width="3"/><text x="104" y="195" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">Find LCM(6, 5) = 30.</text><text x="104" y="244" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">Convert 5/6 to 25/30.</text><text x="104" y="293" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">Convert 3/5 to 18/30.</text><text x="104" y="342" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">Add: 25/30 + 18/30 = 43/30 .</text><text x="104" y="391" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">We are making equal-sized parts, not merely “matching bottom</text><text x="104" y="440" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="520" fill="#203b55">numbers”.</text><text x="800" y="770" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" fill="#173968" opacity="0.05">SKILLRHUB.COM</text><line x1="72" y1="822" x2="1528" y2="822" stroke="#c7d8e8" stroke-width="2"/><text x="72" y="860" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#173968">AC9M7N06 • SkillrHub • skillrhub.com</text><text x="1528" y="860" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#607991">Fixed classroom display • 8/25</text></svg>