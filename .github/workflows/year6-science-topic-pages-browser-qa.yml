name: Year 6 Science topic-page browser QA
on:
  pull_request:
    paths:
      - 'year6/science/**/index.html'
      - 'assets/css/year6-science-topic-pages.css'
      - 'assets/images/year6-science/**'
      - '.github/workflows/year6-science-topic-pages-browser-qa.yml'
      - 'scripts/qa_year6_science_topic_pages_browser.cjs'
      - 'docs/qa/year6-science-topic-pages-20261108/inventory.json'
permissions:
  contents: read
concurrency:
  group: year6-science-topic-pages-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check 12 authored pages at three screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/year6-science-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/qa_year6_science_topic_pages_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year6-science-topic-pages-browser
          path: artifacts/year6-science-topic-pages-browser/
          retention-days: 7
