name: Materialize Year 10 Science static v2

on:
  push:
    branches:
      - feat/year10-science-static-v2
    paths:
      - '.github/workflows/materialize-year10-science-static-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/year10-science-static-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polish durable Year 10 Science builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_year10_science_static_v2.mjs')
          s = p.read_text()
          old = "profile.mustTeach.map(x=>`<li>I can ${esc(x.charAt(0).toLowerCase()+x.slice(1))}</li>`)"
          new = "profile.mustTeach.map(x=>`<li><strong>I can explain and apply:</strong> ${esc(x)}</li>`)"
          if old in s:
              s = s.replace(old, new)
          elif '<strong>I can explain and apply:</strong>' not in s:
              raise SystemExit('Mastery-list builder marker not found')
          p.write_text(s)
          PY
      - name: Build Year 10 Science static v2 pages
        run: node scripts/build_year10_science_static_v2.mjs
      - name: Guard generated diff
        run: git diff --check
      - name: Commit polished Year 10 Science pages and durable builder locally
        shell: bash
        run: |
          git add year10/science scripts/build_year10_science_static_v2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish Year 10 Science mastery wording'
      - name: Validate static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Validate locked F-10 topic learning order
        run: node scripts/validate_f10_topic_learning_order.mjs --base origin/main
      - name: Require zero runtime curriculum topics
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics
      - name: Ensure Year 10 Science has no worksheet CTA
        run: |
          if grep -R -n -E '/worksheet/|>Worksheet<' year10/science/*/index.html; then
            echo 'Year 10 Science worksheet CTA regression detected.'
            exit 1
          fi
      - name: Push validated materialization
        run: git push origin HEAD:feat/year10-science-static-v2
