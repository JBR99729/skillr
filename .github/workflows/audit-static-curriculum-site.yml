name: Audit static curriculum site
# Re-run the restored post-merge curriculum state after the PR #661 rollback.

on:
  pull_request:
    paths:
      - 'foundation/**'
      - 'year*/**'
      - 'quiz/**'
      - 'worksheets/**'
      - 'assets/**'
      - 'scripts/audit_static_curriculum_site.mjs'
      - 'scripts/audit_curriculum_route_integrity.mjs'
      - 'scripts/audit_static_teacher_slides.mjs'
      - 'scripts/validate_static_curriculum_architecture.mjs'
      - 'scripts/migrate_runtime_topic_pages_static.mjs'
      - '.github/workflows/audit-static-curriculum-site.yml'
  push:
    branches: [main]
    paths:
      - 'foundation/**'
      - 'year*/**'
      - 'quiz/**'
      - 'worksheets/**'
      - 'assets/**'
      - 'scripts/audit_static_curriculum_site.mjs'
      - 'scripts/audit_curriculum_route_integrity.mjs'
      - 'scripts/audit_static_teacher_slides.mjs'
      - 'scripts/validate_static_curriculum_architecture.mjs'
      - 'scripts/migrate_runtime_topic_pages_static.mjs'
      - '.github/workflows/audit-static-curriculum-site.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Enforce static Teacher Slides architecture
        run: node scripts/audit_static_teacher_slides.mjs
      - name: Enforce curriculum route integrity
        run: node scripts/audit_curriculum_route_integrity.mjs
      - name: Enforce static HTML curriculum topic pages and inventory remaining non-blocking issues
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics --json=artifacts/static-curriculum-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: static-curriculum-audit
          path: artifacts/static-curriculum-audit.json
