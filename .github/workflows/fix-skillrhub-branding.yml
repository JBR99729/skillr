name: Fix persistent SkillrHub branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-skillrhub-branding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Record release base
        run: echo "RELEASE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fix stale footer branding in output and generators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('sitemap.html'),
              Path('scripts/generate_sitemap.py'),
              Path('scripts/tidy_sitemap_html.py'),
              Path('scripts/generate-sitemap.sh'),
              Path('scripts/build_worksheet_landing_pages.mjs'),
          ]
          old = 'Skillr Education. All rights reserved.'
          new = 'SkillrHub. All rights reserved.'
          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit intended branding changes locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.html scripts/generate_sitemap.py scripts/tidy_sitemap_html.py scripts/generate-sitemap.sh scripts/build_worksheet_landing_pages.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Fix stale SkillrHub branding in sitemap generators'
          fi
      - name: Verify AdSense cleanup is idempotent
        run: |
          python3 scripts/adsense_final_cleanup.py
          git diff --exit-code
      - name: Push permanent branding fix
        run: |
          if [ "$(git rev-parse HEAD)" = "$RELEASE_BASE" ]; then
            echo 'Branding already clean.'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$RELEASE_BASE" ]; then
            echo 'Main advanced during branding fix; rerun on current main.'
            exit 1
          fi
          git push origin HEAD:main
