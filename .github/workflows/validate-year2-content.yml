name: Validate Year 2 content

on:
  push:
    branches: [main]
    paths:
      - "assets/year2-*.js"
      - "assets/display-only.js"
      - "assets/multi-strand-worksheet-pack.js"
      - "assets/qa-complete-*.js"
      - "assets/assessment-banks/year2/**"
      - "assets/assessment-visuals/year2/**"
      - "quiz/year-2/**"
      - "quiz/assets/script.js"
      - "scripts/*year2_*.mjs"
      - "scripts/publish_production_question_bank.mjs"
      - "scripts/validate_production_question_bank.mjs"
      - "pwa-register.js"
      - "worksheets/year2/**"
      - "year2/curriculum/**"
      - ".github/workflows/validate-year2-content.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/year2-*.js"
      - "assets/display-only.js"
      - "assets/multi-strand-worksheet-pack.js"
      - "assets/qa-complete-*.js"
      - "assets/assessment-banks/year2/**"
      - "assets/assessment-visuals/year2/**"
      - "quiz/year-2/**"
      - "quiz/assets/script.js"
      - "scripts/*year2_*.mjs"
      - "scripts/publish_production_question_bank.mjs"
      - "scripts/validate_production_question_bank.mjs"
      - "pwa-register.js"
      - "worksheets/year2/**"
      - "year2/curriculum/**"
      - ".github/workflows/validate-year2-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/year2-science-data.js
          node --check assets/year2-science-render.js
          node --check assets/year2-science-practice-quick-read.js
          node --check assets/year2-science-worksheet-page.js
          node --check assets/year2-english-data.js
          node --check assets/year2-english-render.js
          node --check assets/year2-english-practice-quick-read.js
          node --check assets/year2-english-worksheet-page.js
          node --check assets/year2-english-assessment-ui.js
          node --check assets/display-only.js
          node --check assets/multi-strand-worksheet-pack.js
          node --check assets/qa-complete-badges.js
          node --check assets/qa-complete-ribbon.js
          node --check scripts/build_year2_english_quality_banks.mjs
          node --check scripts/publish_year2_english_quality_banks.mjs
          node --check scripts/validate_year2_english_quality_banks.mjs
          node --check scripts/validate_production_question_bank.mjs
          node --check scripts/year2_english_items_la123.mjs
          node --check scripts/year2_english_items_la.mjs
          node --check scripts/year2_english_items_le.mjs
          node --check scripts/year2_english_items_ly.mjs
          node --check quiz/assets/script.js
          node --check pwa-register.js
      - name: Validate Year 2 English assessment banks
        run: |
          for bank in assets/assessment-banks/year2/english/*.json; do
            node scripts/validate_production_question_bank.mjs "$bank"
          done
          node scripts/validate_year2_english_quality_banks.mjs
      - name: Validate unit and worksheet counts
        run: |
          node <<'NODE'
          global.window = {};
          require('./assets/year2-science-data.js');
          require('./assets/year2-english-data.js');

          const checks = [
            ['Science', window.SkillrYear2ScienceData, window.SkillrYear2ScienceOrder, 10],
            ['English', window.SkillrYear2EnglishData, window.SkillrYear2EnglishOrder, 27]
          ];

          for (const [subject, units, order, expected] of checks) {
            const codes = Object.keys(units || {});
            if (codes.length !== expected) throw new Error(`${subject}: expected ${expected} units, found ${codes.length}`);
            if (!Array.isArray(order) || order.length !== expected) throw new Error(`${subject}: order has incorrect length`);
            if (new Set(order).size !== expected) throw new Error(`${subject}: duplicate code in order`);

            for (const code of order) {
              const unit = units[code];
              if (!unit) throw new Error(`${subject}: missing ${code}`);
              const questions = unit.worksheet || [];
              const core = questions.filter((question) => !question.enrichment);
              const enrichment = questions.filter((question) => question.enrichment);
              if (core.length !== 8 || enrichment.length !== 2) {
                throw new Error(`${code}: expected 8 core and 2 enrichment, found ${core.length} and ${enrichment.length}`);
              }
              for (const field of ['slug','title','subtitle','desc','learn','model_html','apply_html']) {
                if (!unit[field]) throw new Error(`${code}: missing ${field}`);
              }
            }
          }

          console.log('Year 2 Science and English content validation passed.');
          NODE
