name: Temporary repository-wide AdSense disable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disable-adsense:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comment out AdSense loaders and runtime
        shell: bash
        run: |
          git grep -Ilz 'https://pagead2\.googlesyndication\.com' | xargs -0 perl -0pi -e 's{(<script\b[^>]*\bsrc=["\x27]https://pagead2\.googlesyndication\.com[^>]*>\s*</script>)}{<!-- ADSENSE DISABLED PENDING APPROVAL: $1 -->}g'
          perl -0pi -e 's{\n    const config = window\.SkillrAdConfig;}{\n    /* ADSENSE DISABLED PENDING APPROVAL\n    const config = window.SkillrAdConfig;}g; s{    document\.head\.appendChild\(loader\);\n  };}{    document.head.appendChild(loader);\n    END ADSENSE DISABLED PENDING APPROVAL */\n  };}g' assets/homework-page-runtime.js
          rm .github/workflows/temporary-disable-adsense.yml
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          if git grep -n '<script[^>]*pagead2\.googlesyndication\.com' -- '*.html' '*.js' '*.mjs' '*.py' '*.sh' | grep -v 'ADSENSE DISABLED PENDING APPROVAL'; then
            echo 'Active AdSense loader remains'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Temporarily disable Google AdSense scripts'
          git push origin HEAD:main
