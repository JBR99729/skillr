name: Author Year 9 Maths topic depth N01-A02

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-topic-depth-n01-a02.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write richer Year 9 topic pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const css = `<style>
          :root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.mini-table{width:100%;border-collapse:collapse;margin-top:10px}.mini-table th,.mini-table td{border:1px solid var(--line);padding:10px;text-align:left}.mini-table th{background:var(--soft)}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}
          </style>`;
          const pages = [
            {
              code:'AC9M9N01',
              path:'year9/maths/ac9m9n01-that-the-real-number-system-includes-the-rational-numbers-and/index.html',
              title:'Real numbers, rational numbers and irrational numbers',
              description:'Year 9 Australian Curriculum Maths topic guide for AC9M9N01: understand the real number system, rational and irrational numbers, exact values, surds and decimal approximations.',
              canonical:'https://skillrhub.com/year9/maths/ac9m9n01-that-the-real-number-system-includes-the-rational-numbers-and/',
              intro:'Students move beyond whole numbers, fractions and terminating decimals to see how all rational and irrational numbers sit inside the real number system. This page builds the idea carefully: classify numbers, compare exact and approximate values, and explain why some square roots cannot be written as fractions.',
              concepts:[
                ['Real number system','Real numbers include rational numbers, irrational numbers and all values that can be placed on the number line.'],
                ['Rational numbers','Numbers that can be written as a fraction a/b where a and b are integers and b is not zero. Terminating and recurring decimals are rational.'],
                ['Irrational numbers','Numbers that cannot be written as a fraction of integers. Their decimals are non-terminating and non-recurring, such as √2 and π.'],
                ['Exact vs approximate','√5 is exact. 2.236 is an approximation. Exact forms avoid rounding error in repeated calculations.']
              ],
              worked:[
                {title:'Classify a number',body:'Is 0.272727... rational? Yes. The decimal repeats, so it can be written as a fraction. A common trap is thinking all long decimals are irrational.'},
                {title:'Use exact form',body:'A square has area 18 cm². Side length = √18 = 3√2 cm. Leaving 3√2 is exact; using 4.24 cm is only approximate.'}
              ],
              quick:['Classify 7/9, √49, √7, 0.125 and π as rational or irrational.','Explain why √16 is rational but √17 is irrational.','Place √2 between two consecutive whole numbers.','Give an exact value and a decimal approximation for √20.'],
              misconceptions:['A decimal is not irrational just because it is long. Repeating decimals are rational.','A square root is not automatically irrational. Perfect square roots such as √25 are rational.','Rounding too early can change later results, especially when a value is used repeatedly.'],
              parent:'Ask the student to explain the difference between 3.14 and π, or between 1.414 and √2. Strong understanding appears when they can say which one is exact and why it matters.'
            },
            {
              code:'AC9M9A01',
              path:'year9/maths/ac9m9a01-apply-the-exponent-laws-to-numerical-expressions-with-integer/index.html',
              title:'Index laws, integer exponents and scientific notation',
              description:'Year 9 Australian Curriculum Maths topic guide for AC9M9A01: apply exponent laws with integer exponents, simplify powers, use zero and negative powers, and connect powers of 10 to scientific notation.',
              canonical:'https://skillrhub.com/year9/maths/ac9m9a01-apply-the-exponent-laws-to-numerical-expressions-with-integer/',
              intro:'Index laws help students simplify repeated multiplication and work fluently with very large and very small quantities. Year 9 students need more than memorised rules: they should understand why powers combine, why a zero power equals 1, and why negative powers create reciprocals.',
              concepts:[
                ['Multiplying powers','When bases are the same, add indices: a^m × a^n = a^(m+n).'],
                ['Dividing powers','When bases are the same, subtract indices: a^m ÷ a^n = a^(m−n), where a is not zero.'],
                ['Power of a power','Multiply the indices: (a^m)^n = a^(mn).'],
                ['Zero and negative powers','a^0 = 1 for a ≠ 0. A negative exponent means reciprocal: a^-n = 1/a^n.']
              ],
              worked:[
                {title:'Simplify with the same base',body:'2^5 × 2^3 = 2^8 because there are five factors of 2 and three more factors of 2. The result has eight factors of 2.'},
                {title:'Negative exponent',body:'3^-2 = 1/3^2 = 1/9. The negative index does not make the answer negative; it moves the power to the denominator.'}
              ],
              quick:['Simplify x^4 × x^7.','Simplify 5^6 ÷ 5^2.','Evaluate 10^-3 as a decimal.','Write 72 000 in scientific notation.'],
              misconceptions:['Do not add indices when the bases are different. 2^3 × 3^3 is not 6^6.','A negative exponent does not mean a negative number. It means reciprocal.','a^0 = 1, not 0, when a is not zero.'],
              parent:'Check whether the student explains the rule or only quotes it. Ask them to expand 2^3 × 2^2 as factors of 2; this quickly reveals whether the index law makes sense.'
            },
            {
              code:'AC9M9A02',
              path:'year9/maths/ac9m9a02-simplify-algebraic-expressions-expand-binomial-products-and/index.html',
              title:'Algebraic expressions, expansion and factorising',
              description:'Year 9 Australian Curriculum Maths topic guide for AC9M9A02: simplify algebraic expressions, expand binomial products, factorise by common factors and connect expressions to area models.',
              canonical:'https://skillrhub.com/year9/maths/ac9m9a02-simplify-algebraic-expressions-expand-binomial-products-and/',
              intro:'This topic develops algebra as a flexible language. Students simplify expressions, expand brackets, multiply binomials and reverse the process by factorising. The goal is not just procedural fluency; students should understand that expanding and factorising are inverse ways of writing equivalent expressions.',
              concepts:[
                ['Like terms','Terms can be combined only when the variable part is identical, such as 3x and 5x.'],
                ['Expansion','Use the distributive law: a(b + c) = ab + ac. For binomials, multiply every term in one bracket by every term in the other.'],
                ['Factorising','Reverse expansion by taking out a common factor or recognising a structure.'],
                ['Equivalent expressions','Different forms can represent the same quantity, such as 2(x+3) and 2x+6.']
              ],
              worked:[
                {title:'Expand a binomial product',body:'(x + 4)(x + 3) = x² + 3x + 4x + 12 = x² + 7x + 12. The middle terms combine because they are like terms.'},
                {title:'Factorise with a common factor',body:'6x² + 9x = 3x(2x + 3). Check by expanding: 3x × 2x = 6x² and 3x × 3 = 9x.'}
              ],
              quick:['Simplify 4x + 7x − 3.','Expand 3(x − 5).','Expand (x + 2)(x + 6).','Factorise 8x + 12.'],
              misconceptions:['x² and x are not like terms and cannot be combined.','When expanding two brackets, every term must multiply every term.','Always check factorising by expanding back to the original expression.'],
              parent:'Ask the student to expand, then factorise back. This back-and-forth check is one of the best signs that the concept is understood rather than memorised.'
            }
          ];
          function page(p){
            const concepts = p.concepts.map(([h,b])=>`<div class="grid-card"><h3>${esc(h)}</h3><p>${esc(b)}</p></div>`).join('');
            const worked = p.worked.map(w=>`<div class="grid-card worked"><h3>${esc(w.title)}</h3><p>${esc(w.body)}</p></div>`).join('');
            const quick = p.quick.map(q=>`<li>${esc(q)}</li>`).join('');
            const misc = p.misconceptions.map(m=>`<li>${esc(m)}</li>`).join('');
            const codeLower = p.code.toLowerCase();
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title)} | ${p.code} Year 9 Maths | SkillrHub</title><meta name="description" content="${esc(p.description)}"><link rel="canonical" href="${p.canonical}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css">${css}</head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/maths/">Year 9 Maths</a> › ${p.code}</p><section class="hero"><p class="kicker">Year 9 Maths • ${p.code} • Topic guide</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)}</p><div class="cta"><a class="primary" href="/quiz/year-9/math/${codeLower}/practice/">Start practice</a><a href="/quiz/year-9/math/${codeLower}/test/">Take test</a><a href="/quiz/year-9/math/${codeLower}/homework/">Open homework</a></div></section><section class="card"><p class="kicker">What students need to understand</p><h2>Core ideas</h2><div class="grid">${concepts}</div></section><section class="card"><p class="kicker">Worked thinking</p><h2>How the idea works</h2><div class="grid">${worked}</div></section><section class="card"><p class="kicker">Skill building</p><h2>Quick checks before practice</h2><ol class="steps">${quick}</ol><p class="note">These questions are designed to expose the common gap before students begin the SkillrHub practice set.</p></section><section class="card warning"><p class="kicker">Common mistakes</p><h2>Misconceptions to fix early</h2><ul class="checklist">${misc}</ul></section><section class="card"><p class="kicker">Support at home</p><h2>Parent and teacher tip</h2><p>${esc(p.parent)}</p></section><section class="card"><p class="kicker">Next step</p><h2>Practice pathway</h2><p>Use the topic guide first, then homework for written reasoning, practice for feedback, and the test when the student is ready to check retention.</p><div class="cta"><a href="/quiz/year-9/math/${codeLower}/homework/">Homework</a><a class="primary" href="/quiz/year-9/math/${codeLower}/practice/">Practice questions</a><a href="/quiz/year-9/math/${codeLower}/test/">Test bank</a></div></section><p class="footer">SkillrHub • Australian Curriculum Year 9 Maths • ${p.code}</p></main></body></html>`;
          }
          for (const p of pages) {
            fs.mkdirSync(p.path.replace('/index.html',''), {recursive:true});
            fs.writeFileSync(p.path, page(p));
          }
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add year9/maths/ac9m9n01-that-the-real-number-system-includes-the-rational-numbers-and/index.html year9/maths/ac9m9a01-apply-the-exponent-laws-to-numerical-expressions-with-integer/index.html year9/maths/ac9m9a02-simplify-algebraic-expressions-expand-binomial-products-and/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deepen Year 9 Maths N01-A02 topic pages"
          git push
