name: Author Year 9 Science topic depth H04-I02

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  author-topic-pages:
    if: ${{ hashFiles('.github/author-year9-science-topic-depth-h04-i02.trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Year 9 Science H04-I02 topic pages
        run: |
          python - <<'PY'
          from pathlib import Path
          STYLE = ":root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}"
          pages = [
            {
              'code':'AC9S9H04','path':'year9/science/ac9s9h04-examine-how-the-values-and-needs-of-society-influence-the/index.html',
              'title':'How society shapes science research and technology','description':'Year 9 Australian Curriculum Science topic guide for AC9S9H04: examine how the values and needs of society influence scientific research, applications and technology development.',
              'canonical':'https://skillrhub.com/year9/science/ac9s9h04-examine-how-the-values-and-needs-of-society-influence-the/',
              'intro':'This topic helps students see that science does not happen in isolation. Society’s needs, values, risks, ethics, culture, economy and environment can shape what scientists investigate and how new technologies are used.',
              'ideas':['Society can direct science by funding particular problems, such as health, food, water, energy or climate.','Values and ethics influence which investigations and applications are acceptable.','Scientific evidence can inform public decisions, but decisions also involve social, economic and cultural factors.','New technologies can create benefits, risks and new questions for society.'],
              'terms':['public need: a problem or goal that society wants science to address','values: beliefs about what is important, acceptable or responsible','ethics: questions about harm, fairness, consent and responsibility','risk-benefit analysis: comparing likely benefits with possible harms or costs'],
              'worked_title':'Worked example: vaccine research','worked':['A disease outbreak creates an urgent public health need.','Governments, universities and companies may fund research into vaccines and treatments.','Scientists test safety and effectiveness using evidence and peer review.','Society still considers access, cost, trust, consent and communication.','A strong answer explains both the science evidence and the social context.'],
              'mis':['Saying society has no role in science because science is only evidence.','Assuming social values can replace evidence.','Ignoring ethical responsibilities when discussing new technologies.','Only describing an invention without explaining why society needed or accepted it.'],
              'checks':['Give one example of a social need that could drive scientific research.','Why might ethics affect how a scientific investigation is conducted?','Explain why evidence alone may not settle every public decision.'],
              'tip':'Use current but age-appropriate examples such as renewable energy, water quality, vaccines, food production or assistive technology. Ask: what problem was society trying to solve?'
            },
            {
              'code':'AC9S9I01','path':'year9/science/ac9s9i01-develop-investigable-questions-reasoned-predictions-and/index.html',
              'title':'Investigable questions, predictions and hypotheses','description':'Year 9 Australian Curriculum Science topic guide for AC9S9I01: develop investigable questions, reasoned predictions and hypotheses to guide scientific investigations.',
              'canonical':'https://skillrhub.com/year9/science/ac9s9i01-develop-investigable-questions-reasoned-predictions-and/',
              'intro':'This topic builds the planning foundation for practical science. Students learn to turn a broad idea into a testable question, make a reasoned prediction and write a hypothesis that connects variables using science understanding.',
              'ideas':['An investigable question can be answered by collecting evidence, not by opinion alone.','A prediction states what is expected to happen.','A hypothesis explains why the predicted relationship may occur.','Clear variables make the investigation easier to plan and evaluate.'],
              'terms':['independent variable: the factor deliberately changed','dependent variable: the factor measured or observed','controlled variables: factors kept the same to make the test fair','hypothesis: a testable explanation linking variables and scientific reasoning'],
              'worked_title':'Worked example: improving a question','worked':['Broad idea: plants and light.','Weak question: Do plants like light?','Better question: How does the number of hours of light each day affect plant height over two weeks?','Prediction: Plants with more light each day will grow taller.','Hypothesis: More light allows more photosynthesis, so plants with more daily light should produce more biomass and grow taller.'],
              'mis':['Writing questions that are too vague to test.','Writing a prediction without explaining the science behind it.','Changing more than one independent variable at once.','Confusing the dependent variable with the independent variable.'],
              'checks':['Turn “temperature and dissolving” into an investigable question.','Identify the independent and dependent variables in your question.','Write a hypothesis that includes a because statement using science.'],
              'tip':'Use the sentence frame: “How does changing ___ affect ___?” Then extend it with a prediction and a because statement.'
            },
            {
              'code':'AC9S9I02','path':'year9/science/ac9s9i02-plan-and-conduct-valid-reproducible-investigations-to-answer/index.html',
              'title':'Planning valid and reproducible investigations','description':'Year 9 Australian Curriculum Science topic guide for AC9S9I02: plan and conduct valid, reproducible investigations to answer questions and test hypotheses.',
              'canonical':'https://skillrhub.com/year9/science/ac9s9i02-plan-and-conduct-valid-reproducible-investigations-to-answer/',
              'intro':'This topic helps students design investigations that can actually test a claim. Students focus on validity, reproducibility, controlled variables, repeated trials, risk management and clear procedures.',
              'ideas':['Validity means the investigation tests the question it claims to test.','Reproducibility means another person could repeat the method and obtain similar results.','Controlled variables help make a fair comparison.','Repeated trials and clear measurements improve confidence in the results.'],
              'terms':['validity: how well the method tests the intended relationship','reproducibility: whether the method can be repeated with similar results','risk assessment: identifying hazards and reducing harm','method: a clear, ordered procedure that another person can follow'],
              'worked_title':'Worked example: making a method more valid','worked':['Question: How does water temperature affect dissolving time?','Only change the water temperature.','Keep solute mass, water volume, stirring method and container type the same.','Measure dissolving time using the same timing rule each trial.','Repeat each temperature condition and calculate a typical result.'],
              'mis':['Thinking a method is valid just because it gives data.','Leaving controlled variables unstated.','Writing instructions that are too vague for another student to repeat.','Ignoring safety and ethical considerations in the plan.'],
              'checks':['Name two controlled variables in a dissolving-rate investigation.','Explain why repeated trials can improve confidence.','Write one safety control for heating water in a classroom investigation.'],
              'tip':'Ask students to swap methods with a partner. If the partner cannot repeat the investigation without asking questions, the method needs more detail.'
            }
          ]
          def card_items(items):
              return ''.join(f'<div class="grid-card"><h3>Key idea</h3><p>{x}</p></div>' for x in items)
          def term_items(items):
              return ''.join(f'<div class="grid-card"><span class="formula">{x}</span></div>' for x in items)
          def li(items):
              return ''.join(f'<li>{x}</li>' for x in items)
          def page(p):
              qbase=f"/quiz/year-9/science/{p['code'].lower()}"
              return f'''<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{p['title']} | {p['code']} Year 9 Science | SkillrHub</title><meta name="description" content="{p['description']}"><link rel="canonical" href="{p['canonical']}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css"><style>{STYLE}</style></head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/science/">Year 9 Science</a> › {p['code']}</p><section class="hero"><p class="kicker">Year 9 Science • {p['code']} • Topic guide</p><h1>{p['title']}</h1><p>{p['intro']}</p><div class="cta"><a class="primary" href="{qbase}/practice/">Start practice</a><a href="{qbase}/test/">Take test</a><a href="{qbase}/homework/">Open homework</a></div></section><section class="card"><p class="kicker">Core understanding</p><h2>What students need to know</h2><div class="grid three">{card_items(p['ideas'])}</div></section><section class="card"><p class="kicker">Scientific language and representations</p><h2>Useful terms and ways to represent the idea</h2><div class="grid">{term_items(p['terms'])}</div></section><section class="card worked"><p class="kicker">Worked example</p><h2>{p['worked_title']}</h2><ol class="steps">{li(p['worked'])}</ol></section><section class="card warning"><p class="kicker">Common misconceptions</p><h2>What to watch for</h2><ul class="checklist">{li(p['mis'])}</ul></section><section class="card"><p class="kicker">Quick check</p><h2>Try these before moving on</h2><ol class="steps">{li(p['checks'])}</ol></section><section class="card"><p class="kicker">Support tip</p><h2>For parents and teachers</h2><p class="note">{p['tip']}</p></section><section class="card"><p class="kicker">Next steps</p><h2>Practise this skill</h2><p>Use the linked homework, practice and test to move from recognition to independent explanation.</p><div class="cta"><a href="{qbase}/homework/">Homework</a><a class="primary" href="{qbase}/practice/">Practice</a><a href="{qbase}/test/">Test</a></div></section><p class="footer">SkillrHub • Australian Curriculum aligned Year 9 Science topic guide</p></main></body></html>'''
          for p in pages:
              path = Path(p['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(page(p), encoding='utf-8')
              print('wrote', path)
          PY
      - name: Commit topic pages
        run: |
          git config user.name "skillr-bot"
          git config user.email "actions@github.com"
          git add year9/science/ac9s9h04-examine-how-the-values-and-needs-of-society-influence-the/index.html year9/science/ac9s9i01-develop-investigable-questions-reasoned-predictions-and/index.html year9/science/ac9s9i02-plan-and-conduct-valid-reproducible-investigations-to-answer/index.html
          git commit -m "Deepen Year 9 Science H04-I02 topic pages" || exit 0
          git push
