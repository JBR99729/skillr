name: Validate Year 2 Maths static topic pages

on:
  pull_request:
    paths:
      - 'year2/maths/**'
      - 'quiz/year-2/math/**'
      - 'assets/curriculum.css'
      - 'scripts/validate_year2_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year2-maths-static-topic-pages.yml'
  push:
    branches: [ main ]
    paths:
      - 'year2/maths/**'
      - 'quiz/year-2/math/**'
      - 'assets/curriculum.css'
      - 'scripts/validate_year2_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year2-maths-static-topic-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Year 2 Maths static topic pages
        run: node scripts/validate_year2_maths_static_topic_pages.mjs
