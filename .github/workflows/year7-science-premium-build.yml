name: Finalize Year 7 Science premium topic pages

on:
  push:
    branches:
      - agent/year7-science-premium-topic-pages
    paths:
      - scripts/finalize_year7_science_premium.py
      - .github/workflows/year7-science-premium-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year7-science-premium-topic-pages
          fetch-depth: 0
      - name: Apply static architecture alignment
        run: python scripts/finalize_year7_science_premium.py
      - name: Validate architecture and output
        run: |
          node scripts/validate_static_curriculum_architecture.mjs
          python - <<'PY'
          from pathlib import Path
          expected = 18
          pages = [p for p in Path('year7/science').glob('ac9s7*/index.html') if 'science-premium-layer:' in p.read_text(encoding='utf-8')]
          assert len(pages) == expected, len(pages)
          for p in pages:
              text = p.read_text(encoding='utf-8')
              for phrase in ('Key concept','Worked example','Common misconception','Exam tip','Retrieval question'):
                  assert phrase in text, f'{p}: missing {phrase}'
          for p in Path('assets/illustrations/science').glob('*.webp'):
              assert p.stat().st_size <= 60 * 1024, p
          print('PASS: Year 7 Science premium static output')
          PY
          git diff --check
      - name: Commit finalized static pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add year7/science
          if git diff --cached --quiet; then
            echo 'No page changes to commit'
          else
            git commit -m 'Align Year 7 Science pages with static architecture'
            git push origin HEAD:agent/year7-science-premium-topic-pages
          fi
