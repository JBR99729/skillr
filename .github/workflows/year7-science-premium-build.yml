name: Repair AC9S7U01 topic structure

on:
  push:
    branches:
      - fix/year7-science-structural-layout

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year7-science-structural-layout
          fetch-depth: 2
      - name: Move AC9S7U01 premium layer inside lesson wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('year7/science/ac9s7u01-investigate-the-role-of-classification-in-ordering-and/index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(<main class="curriculum-layout">)'
              r'(<!-- science-premium-layer:AC9S7U01 --><details open class="science-premium-layer curriculum-topic-section">[\s\S]*?</details>)'
              r'(<div id="learn">)'
          )
          fixed, n = pattern.subn(r'\1\3\2', text, count=1)
          assert n == 1, 'AC9S7U01 structure pattern not found'
          path.write_text(fixed, encoding='utf-8')
          assert '<main class="curriculum-layout"><div id="learn"><!-- science-premium-layer:AC9S7U01 -->' in fixed
          assert '</div><aside class="curriculum-sidebar">' in fixed
          print('PASS: AC9S7U01 restored to main-content + sidebar structure')
          PY
          node scripts/validate_static_curriculum_architecture.mjs
      - name: Commit repaired page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year7/science/ac9s7u01-investigate-the-role-of-classification-in-ordering-and/index.html
          git commit -m "Restore AC9S7U01 page structure"
          git push
