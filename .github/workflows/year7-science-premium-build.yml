name: Validate Year 7 Science premium topic pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed static output
        run: |
          python - <<'PY'
          from pathlib import Path

          expected_codes = {
              'AC9S7U01','AC9S7U02','AC9S7U03','AC9S7U04','AC9S7U05','AC9S7U06',
              'AC9S7H01','AC9S7H02','AC9S7H03','AC9S7H04',
              'AC9S7I01','AC9S7I02','AC9S7I03','AC9S7I04','AC9S7I05','AC9S7I06','AC9S7I07','AC9S7I08',
          }
          pages = list(Path('year7/science').glob('ac9s7*/index.html'))
          found = set()
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for code in expected_codes:
                  marker = f'science-premium-layer:{code}'
                  if marker in text:
                      assert text.count(marker) == 1, f'duplicate premium layer: {code}'
                      for phrase in ('Worked example','Common misconception','Exam tip','Retrieval question'):
                          assert phrase in text, f'{code} missing {phrase}'
                      found.add(code)
          assert found == expected_codes, f'missing codes: {sorted(expected_codes-found)}'

          images = [
              'balanced-unbalanced-forces.webp',
              'classification-tree.webp',
              'earth-sun-moon-alignment.webp',
              'food-web-energy-flow.webp',
              'mixture-separation.webp',
              'particle-states.webp',
          ]
          for name in images:
              p = Path('assets/illustrations/science') / name
              assert p.exists(), name
              assert p.stat().st_size <= 60 * 1024, f'{name} exceeds 60 KB'
          print('PASS: 18/18 static Year 7 Science pages and 6 lightweight WebPs')
          PY
