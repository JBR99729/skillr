name: Validate Year 1 English student-facing content

on:
  pull_request:
    paths:
      - 'assets/year1-english-student-facing.js'
      - 'assets/foundation-topic-language.js'
      - 'assets/assessment-banks/year1/english/**'
      - 'scripts/build_year1_english_quality_banks.mjs'
      - 'scripts/rebuild_year1_english_student_facing.mjs'
      - 'scripts/polish_year1_english_student_facing.mjs'
      - 'scripts/rebuild_year1_english_static_student_facing.mjs'
      - 'scripts/validate_year1_english_student_facing.mjs'
      - '.github/workflows/generate-year1-english-student-facing.yml'
  workflow_dispatch:

# Reviewed banks and frozen teaching assets must never be regenerated by a PR check.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Year 1 English student-facing content
        run: node scripts/validate_year1_english_student_facing.mjs
      - name: Validate static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
