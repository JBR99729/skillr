name: Validate Foundation to Year 4 complete rollout

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "pwa-register.js"
      - "year4/**"
      - "worksheets/year4/**"
      - ".github/workflows/validate-foundation-year4-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shared and Year 4 JavaScript syntax
        run: |
          node --check pwa-register.js
          node --check assets/skillr-svg-runtime.js
          node --check assets/skillr-concept-svg.js
          node --check assets/curriculum-cluster-core.js
          node --check assets/curriculum-strand-coverage.js
          node --check assets/curriculum-visual-layer.js
          node --check assets/teacher-slide-clusters.js
          node --check assets/multi-strand-worksheet-pack.js
          node --check assets/qa-complete-ribbon.js
          node --check assets/foundation-test-quick-read.js
          node --check assets/year4-subject-data-base.js
          node --check assets/year4-science-data.js
          node --check assets/year4-english-data-la1.js
          node --check assets/year4-english-data-la2.js
          node --check assets/year4-english-data-le.js
          node --check assets/year4-english-data-ly1.js
          node --check assets/year4-english-data-ly2.js
          node --check assets/year4-subject-render.js
          node --check assets/year4-subject-quick-read.js
          node --check assets/year4-subject-worksheet-page.js
          node --check assets/year4-subject-slide.js

      - name: Validate Year 4 Science and English unit quality
        run: |
          node <<'NODE'
          global.window = {};
          require('./assets/year4-subject-data-base.js');
          require('./assets/year4-science-data.js');
          require('./assets/year4-english-data-la1.js');
          require('./assets/year4-english-data-la2.js');
          require('./assets/year4-english-data-le.js');
          require('./assets/year4-english-data-ly1.js');
          require('./assets/year4-english-data-ly2.js');

          const checks = [
            ['Science', window.SkillrYear4ScienceData, window.SkillrYear4ScienceOrder, 12],
            ['English', window.SkillrYear4EnglishData, window.SkillrYear4EnglishOrder, 28]
          ];

          for (const [subject, units, order, expected] of checks) {
            const codes = Object.keys(units || {});
            if (codes.length !== expected) throw new Error(`${subject}: expected ${expected} units, found ${codes.length}`);
            if (!Array.isArray(order) || order.length !== expected) throw new Error(`${subject}: expected ${expected} ordered codes, found ${order?.length}`);
            if (new Set(order).size !== expected) throw new Error(`${subject}: duplicate curriculum code in order`);

            for (const code of order) {
              const unit = units[code];
              if (!unit) throw new Error(`${subject}: missing ${code}`);
              for (const field of ['slug','title','subtitle','desc','routine','learn','model_title','model_html','apply_title','apply_html','hero_visual']) {
                if (!unit[field]) throw new Error(`${code}: missing ${field}`);
              }
              if (!Array.isArray(unit.activities) || unit.activities.length < 3) throw new Error(`${code}: fewer than 3 activities`);
              if (!Array.isArray(unit.mistakes) || unit.mistakes.length < 3) throw new Error(`${code}: fewer than 3 misconceptions`);
              if (!Array.isArray(unit.quick) || unit.quick.length < 4) throw new Error(`${code}: insufficient Quick Check prompts`);
              if (!Array.isArray(unit.mastery) || unit.mastery.length < 4) throw new Error(`${code}: insufficient mastery evidence`);

              const questions = unit.worksheet || [];
              const core = questions.filter((question) => !question.enrichment);
              const enrichment = questions.filter((question) => question.enrichment);
              if (core.length !== 8 || enrichment.length !== 2) throw new Error(`${code}: expected 8 core + 2 enrichment, found ${core.length} + ${enrichment.length}`);
              const types = new Set(core.map((question) => question.type));
              for (const required of ['single','fill-blank','match','text']) {
                if (!types.has(required)) throw new Error(`${code}: missing core question type ${required}`);
              }
              for (const [index, question] of questions.entries()) {
                if (!question.question || !question.type) throw new Error(`${code} Q${index + 1}: missing prompt or type`);
                if (question.type === 'single') {
                  if (!Array.isArray(question.answers) || question.answers.length !== 4) throw new Error(`${code} Q${index + 1}: expected 4 answer choices`);
                  if (new Set(question.answers).size !== 4) throw new Error(`${code} Q${index + 1}: duplicate answer choices`);
                }
                if (question.type === 'fill-blank' && !String(question.template || '').includes('{{blank}}')) throw new Error(`${code} Q${index + 1}: missing blank marker`);
                if (question.type === 'match') {
                  if (!Array.isArray(question.matchLeft) || !Array.isArray(question.matchRight)) throw new Error(`${code} Q${index + 1}: incomplete matching columns`);
                  if (question.matchLeft.length !== question.matchRight.length) throw new Error(`${code} Q${index + 1}: matching columns differ in length`);
                  if (new Set(question.matchLeft).size !== question.matchLeft.length) throw new Error(`${code} Q${index + 1}: duplicate left match item`);
                  if (new Set(question.matchRight).size !== question.matchRight.length) throw new Error(`${code} Q${index + 1}: duplicate right match item`);
                }
              }
            }
          }

          console.log('Year 4 Science and English data validation passed.');
          NODE

      - name: Validate Year 4 curriculum routes and files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const subjects = [
            ['maths', 'math', /^AC9M4/, 23],
            ['science', 'science', /^AC9S4/, 12],
            ['english', 'english', /^AC9E4/, 28]
          ];

          for (const [topicSubject, quizSubject, codePattern, expected] of subjects) {
            const indexPath = `year4/curriculum/${topicSubject}/index.html`;
            const html = fs.readFileSync(indexPath, 'utf8');
            const codes = [...new Set((html.match(/AC9[A-Z0-9]+/g) || []).filter((code) => codePattern.test(code)))];
            if (codes.length !== expected) throw new Error(`${topicSubject}: expected ${expected} curriculum codes in index, found ${codes.length}`);

            const links = [...html.matchAll(new RegExp(`href=["'](/year4/${topicSubject}/[^"']+/)["']`, 'g'))].map((match) => match[1]);
            const uniqueTopicLinks = [...new Set(links)];
            if (uniqueTopicLinks.length !== expected) throw new Error(`${topicSubject}: expected ${expected} topic links, found ${uniqueTopicLinks.length}`);

            for (const url of uniqueTopicLinks) {
              const file = path.join(url.replace(/^\//, ''), 'index.html');
              if (!fs.existsSync(file)) throw new Error(`Missing topic file ${file}`);
              const topicHtml = fs.readFileSync(file, 'utf8');
              if (!topicHtml.includes('Curriculum coverage and elaborations')) throw new Error(`${file}: missing curriculum elaborations section`);
              if (!topicHtml.includes('/pwa-register.js')) throw new Error(`${file}: missing shared loader`);
            }

            for (const code of codes) {
              const lower = code.toLowerCase();
              for (const mode of ['practice','test','worksheet']) {
                const file = `quiz/year-4/${quizSubject}/${lower}/${mode}/index.html`;
                if (!fs.existsSync(file)) throw new Error(`Missing quiz resource ${file}`);
              }
            }
          }

          for (const subject of ['maths','science','english']) {
            const file = `worksheets/year4/${subject}/teacher-slides/live.html`;
            if (!fs.existsSync(file)) throw new Error(`Missing live teacher slide ${file}`);
            if (!fs.readFileSync(file,'utf8').includes('/pwa-register.js')) throw new Error(`${file}: missing shared loader`);
          }

          console.log('Year 4 route and resource validation passed.');
          NODE

      - name: Confirm Foundation to Year 4 integration wiring
        run: |
          grep -q "skillr-svg-runtime.js" pwa-register.js
          grep -q "skillr-concept-svg.js" pwa-register.js
          grep -q "curriculum-cluster-core.js" pwa-register.js
          grep -q "curriculum-strand-coverage.js" pwa-register.js
          grep -q "curriculum-visual-layer.js" pwa-register.js
          grep -q "teacher-slide-clusters.js" pwa-register.js
          grep -q "multi-strand-worksheet-pack.js" pwa-register.js
          grep -q "qa-complete-ribbon.js" pwa-register.js
          grep -q "year1-english-data.js" pwa-register.js
          grep -q "year4-science-data.js" pwa-register.js
          grep -q "year4-english-data-la1.js" pwa-register.js
          grep -q "year4-subject-render.js" pwa-register.js
          grep -q "year4-subject-quick-read.js" pwa-register.js
          grep -q "year4-subject-worksheet-page.js" pwa-register.js
          grep -q "foundation-test-quick-read.js" assets/curriculum-visual-layer.js

      - name: Check visible release wording
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'assets/curriculum-cluster-core.js',
            'assets/curriculum-strand-coverage.js',
            'assets/curriculum-visual-layer.js',
            'assets/teacher-slide-clusters.js',
            'assets/multi-strand-worksheet-pack.js',
            'assets/qa-complete-ribbon.js',
            'assets/foundation-test-quick-read.js',
            'assets/year4-subject-data-base.js',
            'assets/year4-science-data.js',
            'assets/year4-english-data-la1.js',
            'assets/year4-english-data-la2.js',
            'assets/year4-english-data-le.js',
            'assets/year4-english-data-ly1.js',
            'assets/year4-english-data-ly2.js',
            'assets/year4-subject-render.js',
            'assets/year4-subject-quick-read.js',
            'assets/year4-subject-worksheet-page.js',
            'assets/year4-subject-slide.js',
            'worksheets/year4/science/teacher-slides/live.html',
            'worksheets/year4/english/teacher-slides/live.html'
          ];
          const prohibited = /\bartificial intelligence\b|\bgenerative ai\b|\bai-generated\b|\bcreated by ai\b/i;
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            if (prohibited.test(text)) throw new Error(`${file}: contains prohibited visible wording`);
          }
          console.log('Visible wording check passed.');
          NODE
