name: Materialize Year 9 Maths static v2

on:
  push:
    branches:
      - feat/year9-maths-static-v2
    paths:
      - '.github/workflows/materialize-year9-maths-static-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/year9-maths-static-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polish durable builder and permanently lock Year 9 Maths
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_year9_maths_static_v2.py')
          s = builder.read_text()
          old = '''    description = f'{code} Year 9 Maths: {profile["summary"]} Includes worked examples, guided practice, assessment and Australian curriculum mapping.'
              if len(description) > 270:
                  description = description[:267].rstrip() + '...'
          '''
          new = '''    description = f'{code} Year 9 Maths: {profile["title"]}. Worked examples, misconceptions, practice, assessment and Australian/VIC/NSW curriculum mapping.'
              if len(description) > 170:
                  description = description[:166].rsplit(' ', 1)[0] + '…'
          '''
          # Preserve exact indentation from the source rather than relying on the
          # triple-quoted helper text above if this workflow is retried.
          old2 = "    description = f'{code} Year 9 Maths: {profile[\"summary\"]} Includes worked examples, guided practice, assessment and Australian curriculum mapping.'\n    if len(description) > 270:\n        description = description[:267].rstrip() + '...'"
          new2 = "    description = f'{code} Year 9 Maths: {profile[\"title\"]}. Worked examples, misconceptions, practice, assessment and Australian/VIC/NSW curriculum mapping.'\n    if len(description) > 170:\n        description = description[:166].rsplit(' ', 1)[0] + '…'"
          if old2 in s:
              s = s.replace(old2, new2)
          elif "description[:166].rsplit(' ', 1)[0] + '…'" not in s:
              raise SystemExit('Expected Year 9 Maths meta-description builder block not found')
          builder.write_text(s)

          validator = Path('scripts/validate_f10_topic_learning_order.mjs')
          v = validator.read_text()
          if "'year9/maths'," not in v:
              marker = "  'year10/science',\n];"
              if marker not in v:
                  raise SystemExit('Permanent-root marker not found')
              v = v.replace(marker, "  'year10/science',\n  'year9/maths',\n];")
          validator.write_text(v)
          PY
      - name: Compile Year 9 Maths authoring scripts
        run: |
          python -m py_compile \
            scripts/year9_maths_v2_profiles_number_algebra.py \
            scripts/year9_maths_v2_profiles_measurement_space.py \
            scripts/year9_maths_v2_profiles_statistics_probability.py \
            scripts/build_year9_maths_static_v2.py
      - name: Rebuild all 23 Year 9 Maths static v2 pages
        run: python scripts/build_year9_maths_static_v2.py
      - name: Guard generated diff
        run: git diff --check
      - name: Commit polished Year 9 Maths pages and permanent lock locally
        shell: bash
        run: |
          git add year9/maths scripts/build_year9_maths_static_v2.py scripts/validate_f10_topic_learning_order.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish and permanently lock Year 9 Maths static v2'
      - name: Validate Year 9 Maths authored quality
        run: node scripts/validate_year9_maths_static_v2.mjs
      - name: Validate static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Validate locked F-10 topic learning order
        run: node scripts/validate_f10_topic_learning_order.mjs --base origin/main
      - name: Validate global topic action contract
        run: node scripts/validate_f10_topic_layout_contract.mjs
      - name: Require zero runtime curriculum topics
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics
      - name: Push validated materialization
        run: git push origin HEAD:feat/year9-maths-static-v2
