name: Validate Year 6 Maths static topic pages

on:
  pull_request:
    paths:
      - 'year6/maths/**'
      - 'quiz/year-6/math/**'
      - 'assets/year6-curriculum.css'
      - 'scripts/validate_year6_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year6-maths-static-topic-pages.yml'
  push:
    branches: [ main ]
    paths:
      - 'year6/maths/**'
      - 'quiz/year-6/math/**'
      - 'assets/year6-curriculum.css'
      - 'scripts/validate_year6_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year6-maths-static-topic-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Year 6 Maths static topic pages
        run: node scripts/validate_year6_maths_static_topic_pages.mjs
