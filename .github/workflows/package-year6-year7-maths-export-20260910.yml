name: Package Year 6 and Year 7 Maths export 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/package-year6-year7-maths-export-20260910.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare export
        run: |
          mkdir -p out
          cp reports/question-exports/year6-year7-maths-all-questions-main.txt out/year6_year7_maths_all_questions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: year6-year7-maths-all-questions-txt
          path: out/year6_year7_maths_all_questions.txt
