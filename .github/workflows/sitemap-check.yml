name: Check sitemap files

on:
  pull_request:
    paths:
      - "**/*.html"
      - "scripts/generate-sitemap.sh"
      - "sitemap.xml"
      - "sitemap.html"
      - ".github/workflows/sitemap-check.yml"
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "scripts/generate-sitemap.sh"
      - "sitemap.xml"
      - "sitemap.html"
      - ".github/workflows/sitemap-check.yml"

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: |
          chmod +x scripts/generate-sitemap.sh
          ./scripts/generate-sitemap.sh

      - name: Verify sitemap files committed
        run: |
          if ! git diff --quiet -- sitemap.xml sitemap.html; then
            echo "::error::Sitemap files are out of date. Run ./scripts/generate-sitemap.sh and commit updated sitemap.xml and sitemap.html."
            git --no-pager diff -- sitemap.xml sitemap.html
            exit 1
          fi
