name: Improve remaining Year 1 Maths SVG semantics

on:
  push:
    branches:
      - agent/year1-maths-full-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[year1-visuals-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-full-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply purpose-built semantic SVGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/year1-maths-visual-fix
          cat scripts/year1-maths-visual-fix-b64/part-* \
            | tr -d '\n\r ' \
            | base64 -d \
            > /tmp/year1-maths-visual-fix-tools.tar.gz
          gzip -t /tmp/year1-maths-visual-fix-tools.tar.gz
          tar -xzf /tmp/year1-maths-visual-fix-tools.tar.gz -C /tmp/year1-maths-visual-fix

          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/year1-maths-visual-fix/improve-year1-maths-remaining-visuals.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              'const questions=load(rel).map(question=>{',
              'const questions=load(rel).map((question,index)=>{'
          )

          source = source.replace(
              '''function removeFiller(text) {
            return clean(text)
              .replace(/^[A-Z][a-z]+ checks (?:another|a new) example\.\s*/i, "")
              .replace(/^A child checks (?:another|a new) example\.\s*/i, "");
          }''',
              '''function removeFiller(text) {
            return clean(text)
              .replace(/\\bA child checks (?:another|a new) example\\.\\s*/gi, "A child studies this example. ")
              .replace(/\\b([A-Z][a-z]+) checks (?:another|a new) example\\.\\s*/g, "$1 studies this example. ");
          }'''
          )

          old = '''        next.imageAlt=originalAlt
                    ? `${visual.alt} Specific example: ${short(originalAlt, 88)}`
                    : visual.alt;'''
          new = '''        const baseAlt=originalAlt
                    ? `${visual.alt} Specific example: ${short(originalAlt, 88)}`
                    : visual.alt;
                  next.imageAlt=`${baseAlt} This is ${bank} example ${index + 1}.`;'''

          if old not in source:
              raise SystemExit('Expected imageAlt assignment was not found')
          source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

          node --check /tmp/year1-maths-visual-fix/improve-year1-maths-remaining-visuals.js
          node --check /tmp/year1-maths-visual-fix/validate-year1-maths-remaining.js
          node /tmp/year1-maths-visual-fix/improve-year1-maths-remaining-visuals.js

      - name: Re-run full educational and technical QA
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/year1-maths-visual-fix/validate-year1-maths-remaining.js
          for file in quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,practice/practice-questions.js,test/questions.js}; do
            node --check "$file"
          done
          ! grep -RniE 'checks another example|checks a new example|self-check|answers may vary|a different choice|which learning goal best|which classroom activity best' \
            quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,test/questions.js}

      - name: Remove temporary visual-fix inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/year1-maths-visual-fix-b64
          rm -f scripts/year1-maths-visual-fix-tools.tar.gz
          rm -f scripts/run-year1-maths-visual-fix.txt
          rm -f .github/workflows/year1-maths-visual-fix.yml

      - name: Commit semantic visual audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve remaining Year 1 Maths SVG semantics [year1-visuals-built]"
          git push origin HEAD:agent/year1-maths-full-rebuild
