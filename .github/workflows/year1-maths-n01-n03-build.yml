name: Publish Year 1 Maths AC9M1N01-03 rebuild

on:
  push:
    branches:
      - agent/year1-maths-ac9m1n01-ac9m1n03-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[year1-maths-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-ac9m1n01-ac9m1n03-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/year1-maths-n01-n03-package-b64/part-* | tr -d '\n\r ' | base64 -d > /tmp/year1-maths-rebuild.zip
          unzip -oq /tmp/year1-maths-rebuild.zip -d .

      - name: Apply integrations and validate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-year1-maths-n01-n03.js
          node scripts/validate-year1-maths-n01-n03.js
          for file in \
            quiz/year-1/math/ac9m1n01/{practice,test}/questions.js \
            quiz/year-1/math/ac9m1n02/{practice,test}/questions.js \
            quiz/year-1/math/ac9m1n03/{practice,test}/questions.js \
            quiz/year-1/math/ac9m1n01/questions.js \
            quiz/year-1/math/ac9m1n02/questions.js \
            quiz/year-1/math/ac9m1n03/questions.js \
            quiz/assets/daily-drills/year1-maths-n01-n03-extensions.js; do
            node --check "$file"
          done
          node --check service-worker.js

      - name: Remove temporary packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/year1-maths-n01-n03-package-b64
          rm -f README-Year1-Maths-N01-N03-Rebuild.md
          rm -f .github/workflows/year1-maths-n01-n03-build.yml

      - name: Commit completed rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild AC9M1N01-AC9M1N03 Year 1 Maths banks [year1-maths-built]"
          git push origin HEAD:agent/year1-maths-ac9m1n01-ac9m1n03-rebuild
