name: Generate upper science static migration

on:
  pull_request:
    paths:
      - 'scripts/migrate_upper_science_static.mjs'
      - '.github/workflows/generate-upper-science-static-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static topic pages and fixed slide viewers
        run: node scripts/migrate_upper_science_static.mjs
      - name: Validate generated architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Verify no legacy upper Science live routes remain
        run: |
          if grep -R "worksheets/year\(8\|9\|10\)/science/teacher-slides/live.html" year8/curriculum/science year9/curriculum/science year10/curriculum/science; then
            echo 'Legacy upper Science teacher-slide route remains.'
            exit 1
          fi
      - name: Commit generated files to migration branch
        shell: bash
        run: |
          if git diff --quiet -- year8/science year9/science year10/science year8/curriculum/science/index.html year9/curriculum/science/index.html year10/curriculum/science/index.html; then
            echo 'Generated output is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add year8/science year9/science year10/science year8/curriculum/science/index.html year9/curriculum/science/index.html year10/curriculum/science/index.html
          git commit -m 'Generate static Years 8-10 Science curriculum pages'
          git push origin HEAD:${GITHUB_HEAD_REF}
