name: Free Maths growth QA
on:
  pull_request:
    branches: [skillr-dev]
    paths:
      - "index.html"
      - "assets/free-*"
      - "assets/learning-stats.js"
      - "tests/free-daily-maths.test.mjs"
      - ".github/workflows/free-learning-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-maths-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check free homepage, approved skill snapshot and critical site files
        run: node --test tests/free-daily-maths.test.mjs
