name: Year 3 English batch 1 topic-page browser QA
on:
  pull_request:
    paths:
      - 'year3/english/ac9e3la10*/index.html'
      - 'year3/english/ac9e3la0[1-9]*/index.html'
      - 'assets/css/year3-english-topic-pages-batch1.css'
      - 'style.css'
      - 'assets/curriculum.css'
      - 'assets/topic-practice-link.css'
      - 'assets/css/year3-science-topic-pages.css'
      - 'assets/css/science-topic-release.css'
      - 'assets/css/foundation-english-topic-pages.css'
      - 'assets/css/year1-english-topic-pages.css'
      - 'assets/learning-navigation.js'
      - 'assets/report-issue.js'
      - 'pwa-register.js'
      - 'assets/topic-visuals/year1/**'
      - 'assets/teaching-models/year1/**'
      - 'assets/topic-visuals/reused/growing-plants.webp'
      - '.github/workflows/year3-english-topic-pages-batch1-browser-qa.yml'
      - 'scripts/qa_year3_english_topic_pages_batch1_browser.cjs'
      - 'docs/qa/year3-english-topic-pages-batch1-20261110/inventory.json'
permissions:
  contents: read
concurrency:
  group: year3-english-topic-pages-batch1-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check 10 authored pages at three screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/year3-english-batch1-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/qa_year3_english_topic_pages_batch1_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year3-english-topic-pages-batch1-browser
          path: artifacts/year3-english-topic-pages-batch1-browser/
          retention-days: 7
