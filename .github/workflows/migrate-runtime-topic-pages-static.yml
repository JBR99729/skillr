name: Migrate remaining runtime topic pages to static HTML

on:
  push:
    branches:
      - guard/static-html-css-topic-pages
    paths:
      - '.github/workflows/migrate-runtime-topic-pages-static.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guard/static-html-css-topic-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate remaining runtime topic pages
        run: node scripts/migrate_runtime_topic_pages_static.mjs
      - name: Guard generated diff
        run: git diff --check
      - name: Commit migration locally
        shell: bash
        run: |
          git add foundation/science year3/maths
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make remaining F-10 topic lessons static HTML'
      - name: Validate changed static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Validate locked F-10 topic learning order
        run: node scripts/validate_f10_topic_learning_order.mjs --base origin/main
      - name: Require zero runtime curriculum topic pages sitewide
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics
      - name: Push validated migration
        run: git push origin HEAD:guard/static-html-css-topic-pages
