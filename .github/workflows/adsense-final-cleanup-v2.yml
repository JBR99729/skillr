name: AdSense final cleanup v2

on:
  push:
    branches:
      - agent/adsense-final-risk-cleanup-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final content cleanup and guard
        run: python3 scripts/adsense_final_cleanup.py

      - name: Strip all legacy Homework ad variants
        run: python3 scripts/strip_legacy_homework_ads.py

      - name: Protect legacy Practice-backed Homework and generator
        run: python3 scripts/adsense_legacy_homework_safety.py

      - name: Show changed files
        run: git status --short

      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Protect legacy Homework from AdSense indexing [skip ci]"
          git push
