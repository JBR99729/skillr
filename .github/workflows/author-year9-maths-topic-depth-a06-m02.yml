name: Author Year 9 Maths topic depth A06-M02

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-topic-depth-a06-m02.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write deeper topic pages
        run: |
          node <<'NODE'
          const fs=require('fs');
          const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const style=`<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.mini-table{width:100%;border-collapse:collapse;margin-top:10px}.mini-table th,.mini-table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.mini-table th{background:var(--soft)}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}</style>`;
          const pages=[
            {code:'AC9M9A06',path:'year9/maths/ac9m9a06-experiment-with-the-effects-of-the-variation-of-parameters-on/index.html',slug:'ac9m9a06',title:'Function transformations and changing parameters',meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9A06: experiment with how changing parameters affects graphs of functions and relations using tables, equations and digital tools.',intro:'This topic helps students see that graphs are not random shapes: changing a number in an equation changes the graph in predictable ways. Students compare equations, tables and graphs to explain shifts, stretches, reflections and changes in steepness.',core:['A parameter is a number in a rule that can be changed to create a related graph.','Changing the coefficient of x often changes steepness or rate of change.','Adding or subtracting outside the main expression often moves a graph up or down.','Using digital tools helps students test patterns quickly, but they still need to explain the mathematics.'],formula:['Linear example: y = mx + c','m controls gradient; c controls the y-intercept','Quadratic example: y = ax² + c','a changes width/reflection; c shifts the graph vertically'],workedTitle:'Worked example: compare y = 2x + 1 and y = 2x + 4',worked:['Both graphs have the same gradient, 2, so they are parallel.','The y-intercepts are 1 and 4.','The second graph is 3 units higher than the first at every matching x-value.','Changing +1 to +4 shifts the graph upward by 3 units.'],misconceptions:['Thinking every change makes the graph steeper. Some changes only move the graph.','Reading a graph visually without checking a table of matching values.','Saying “it changed” without naming the exact effect, such as shift, reflection or stretch.'],checks:['What happens to y = 3x + 2 if the 2 becomes 7?','How does y = x² compare with y = x² - 5?','Why is a table useful when comparing two related graphs?'],support:'Ask the student to change one number at a time and describe the graph before calculating. This builds a habit of predicting first, then checking with values or a digital graph.'},
            {code:'AC9M9M01',path:'year9/maths/ac9m9m01-solve-problems-involving-the-volume-and-surface-area-of-right/index.html',slug:'ac9m9m01',title:'Surface area and volume of right prisms and cylinders',meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9M01: solve problems involving volume and surface area of right prisms, cylinders and related composite solids.',intro:'This topic develops practical measurement skills for solids such as boxes, tanks, pipes, prisms and cylinders. Students learn to separate volume from surface area, choose the correct formula and interpret answers using appropriate units.',core:['Volume measures the space inside a solid and uses cubic units such as cm³ or m³.','Surface area measures the exposed outside area and uses square units such as cm² or m².','Right prisms have a constant cross-section, so volume can be found using cross-section area × length.','Cylinder problems often require π and careful rounding.'],formula:['Prism volume: V = area of cross-section × length','Cylinder volume: V = πr²h','Cylinder curved surface area: 2πrh','Total surface area adds all exposed faces'],workedTitle:'Worked example: cylinder volume',worked:['A cylinder has radius 4 cm and height 10 cm.','Use V = πr²h.','V = π × 4² × 10 = 160π cm³.','So V ≈ 502.7 cm³, depending on the required rounding.'],misconceptions:['Using square units for volume or cubic units for area.','Forgetting to include circular ends when total surface area is needed.','Using diameter as radius without halving it.','Rounding too early, especially when π is involved.'],checks:['What units should be used for a tank volume?','A cylinder has diameter 12 cm. What radius should be used?','Why does surface area matter when painting a solid?'],support:'Encourage students to draw and label the solid, identify whether the question asks for inside space or outside covering, then choose volume or surface area before substituting numbers.'},
            {code:'AC9M9M02',path:'year9/maths/ac9m9m02-solve-problems-involving-very-small-and-very-large-measurements/index.html',slug:'ac9m9m02',title:'Scientific notation for very small and very large measurements',meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9M02: solve problems involving very small and very large measurements using scientific notation, units and powers of 10.',intro:'This topic helps students work efficiently with measurements that are too large or too small for ordinary notation, such as distances in space, microscopic lengths, populations, data storage and scientific measurements.',core:['Scientific notation writes a number as a × 10ⁿ where 1 ≤ a < 10.','Positive powers of 10 represent large numbers.','Negative powers of 10 represent small decimals.','Unit choice matters: 0.00045 m and 0.45 mm describe the same length in different units.'],formula:['6 300 000 = 6.3 × 10⁶','0.00072 = 7.2 × 10⁻⁴','Move the decimal left for large numbers and right for small decimals.','Check whether the exponent is positive or negative.'],workedTitle:'Worked example: convert 0.000056 to scientific notation',worked:['Move the decimal so the first number is between 1 and 10: 5.6.','The decimal moved 5 places to the right.','Because the original number is less than 1, the exponent is negative.','0.000056 = 5.6 × 10⁻⁵.'],misconceptions:['Writing 56 × 10⁻⁶ instead of standard scientific notation.','Forgetting that small decimals use negative powers.','Changing units without tracking the power of 10.','Treating scientific notation as just a formatting trick instead of a multiplication by a power of 10.'],checks:['Write 4 500 000 in scientific notation.','Write 3.2 × 10⁻³ as an ordinary decimal.','Why must the first factor be at least 1 and less than 10?'],support:'Have students estimate the size first. If the number is huge, the exponent should be positive; if the number is a tiny decimal, the exponent should be negative.'}
          ];
          function list(items){return items.map(i=>`<li>${esc(i)}</li>`).join('')}
          function page(p){return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title)} | ${p.code} Year 9 Maths | SkillrHub</title><meta name="description" content="${esc(p.meta)}"><link rel="canonical" href="https://skillrhub.com/${p.path.replace('/index.html','/')}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/maths/">Year 9 Maths</a> › ${p.code}</p><section class="hero"><p class="kicker">Year 9 Maths • ${p.code} • Topic guide</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)}</p><div class="cta"><a class="primary" href="/quiz/year-9/math/${p.slug}/practice/">Start practice</a><a href="/quiz/year-9/math/${p.slug}/test/">Take test</a><a href="/quiz/year-9/math/${p.slug}/homework/">Open homework</a></div></section><section class="card"><p class="kicker">Core understanding</p><h2>What students need to know</h2><div class="grid three">${p.core.map(x=>`<div class="grid-card"><h3>Key idea</h3><p>${esc(x)}</p></div>`).join('')}</div></section><section class="card"><p class="kicker">Formulas and representations</p><h2>Useful rules and ways to represent the idea</h2><div class="grid">${p.formula.map(x=>`<div class="grid-card"><span class="formula">${esc(x)}</span></div>`).join('')}</div></section><section class="card worked"><p class="kicker">Worked example</p><h2>${esc(p.workedTitle)}</h2><ol class="steps">${list(p.worked)}</ol></section><section class="card warning"><p class="kicker">Common misconceptions</p><h2>What to watch for</h2><ul class="checklist">${list(p.misconceptions)}</ul></section><section class="card"><p class="kicker">Quick check</p><h2>Try these before moving on</h2><ol class="steps">${list(p.checks)}</ol></section><section class="card"><p class="kicker">Support tip</p><h2>For parents and teachers</h2><p class="note">${esc(p.support)}</p></section><section class="card"><p class="kicker">Next steps</p><h2>Practise this skill</h2><p>Use the linked homework, practice and test to move from recognition to independent problem solving.</p><div class="cta"><a href="/quiz/year-9/math/${p.slug}/homework/">Homework</a><a class="primary" href="/quiz/year-9/math/${p.slug}/practice/">Practice</a><a href="/quiz/year-9/math/${p.slug}/test/">Test</a></div></section><p class="footer">SkillrHub • Australian Curriculum aligned Year 9 Maths topic guide</p></main></body></html>`}
          for(const p of pages) fs.writeFileSync(p.path,page(p));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add year9/maths/ac9m9a06-experiment-with-the-effects-of-the-variation-of-parameters-on/index.html year9/maths/ac9m9m01-solve-problems-involving-the-volume-and-surface-area-of-right/index.html year9/maths/ac9m9m02-solve-problems-involving-very-small-and-very-large-measurements/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deepen Year 9 Maths A06-M02 topic pages"
          git push
