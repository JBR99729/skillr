name: Repair curriculum routes on PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_curriculum_route_targets.mjs'
      - '.github/workflows/repair-curriculum-routes-pr.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair known stale curriculum routes
        run: node scripts/fix_curriculum_route_targets.mjs
      - name: Commit repairs when needed
        run: |
          if git diff --quiet; then
            echo 'No route repairs needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add year3/curriculum/science/index.html year7/curriculum/english/index.html year8/curriculum/english/index.html year9/curriculum/english/index.html year10/curriculum/english/index.html year7/science/ac9s7i02-plan-and-conduct-reproducible-investigations-to-answer/index.html year7/science/ac9s7i03-select-and-use-equipment-to-generate-and-record-data-with/index.html year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html
          git commit -m 'Fix stale curriculum resource routes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
