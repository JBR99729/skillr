name: Foundation classroom alignment sweep
on: push
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: pip install beautifulsoup4
      - name: Replace generic Foundation classroom checks with topic-aligned teaching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re, html

          root=Path('.')
          changed=[]; skipped=[]
          GENERIC='What is the key idea when learning about'

          def clean(s):
            return re.sub(r'\s+',' ',s or '').strip()
          def clip(s,n=360):
            s=clean(s)
            return s if len(s)<=n else s[:n-1].rsplit(' ',1)[0]+'…'
          def first_text(soup, selectors):
            for sel in selectors:
              el=soup.select_one(sel)
              if el:
                t=clean(el.get_text(' ',strip=True))
                if t:return t
            return ''
          def paragraph_containing(soup, needle):
            for p in soup.find_all(['p','li','article']):
              t=clean(p.get_text(' ',strip=True))
              if needle.lower() in t.lower(): return t
            return ''
          def success_text(soup):
            # Prefer success criteria / ready to move on content.
            for h in soup.find_all(['h2','h3','h4','strong']):
              t=clean(h.get_text(' ',strip=True)).lower()
              if 'success criteria' in t or 'ready to move on' in t or 'success looks like' in t:
                parent=h.parent
                lis=parent.find_all('li') if parent else []
                if lis:return '; '.join(clean(li.get_text(' ',strip=True)) for li in lis[:3])
                nxt=h.find_next(['p','li'])
                if nxt:return clean(nxt.get_text(' ',strip=True))
            return ''
          def mistake_text(soup):
            for node in soup.find_all(['article','p','li']):
              t=clean(node.get_text(' ',strip=True))
              low=t.lower()
              if 'common mistake' in low or 'watch for this mistake' in low or 'misconception' in low:
                return t
            return ''

          classrooms=sorted(root.glob('foundation/*/*/teacher-slides/index.html'))
          for cp in classrooms:
            src=cp.read_text(errors='ignore')
            if GENERIC not in src and 'Copied content' not in src:
              skipped.append((str(cp),'already strong / no generic template residue'))
              continue
            topic=cp.parent.parent/'index.html'
            if not topic.exists():
              skipped.append((str(cp),'missing sibling topic page'))
              continue
            ts=BeautifulSoup(topic.read_text(errors='ignore'),'html.parser')
            cs=BeautifulSoup(src,'html.parser')
            code_match=re.search(r'\bAC9[A-Z0-9]+\b', clean(ts.get_text(' ',strip=True)), re.I)
            code=(code_match.group(0).upper() if code_match else cp.parent.parent.name.split('-')[0].upper())
            title=first_text(ts,['h1']) or code
            lead=first_text(ts,['.curriculum-hero__lead','.micro-hero__goal'])
            model=paragraph_containing(ts,'Teacher model:') or paragraph_containing(ts,'Worked example')
            check=paragraph_containing(ts,'guided check:') or paragraph_containing(ts,'Try and explain:') or paragraph_containing(ts,'Check understanding')
            success=success_text(ts)
            mistake=mistake_text(ts)
            curriculum=paragraph_containing(ts,'Content description:') or lead
            if not model:
              # Prefer a substantive paragraph from the open topic lesson, not metadata.
              for p in ts.select('main p, .curriculum-detail-body p'):
                t=clean(p.get_text(' ',strip=True))
                if len(t)>55 and 'curriculum' not in t.lower() and 'click' not in t.lower():
                  model=t; break
            if not check:
              check=f'Ask the learner to use a new example and explain how it demonstrates {lead or title}.'
            if not success:
              success=f'The learner can complete a fresh example and explain the reasoning without copying the model.'
            if not mistake:
              mistake='If the learner guesses or repeats a rule without evidence, return to the concrete or visual model and ask them to explain what each part shows.'

            # Replace misleading label globally on this classroom page.
            out=src.replace('<span>Copied content</span>','<span>Curriculum examples</span>')
            cs=BeautifulSoup(out,'html.parser')

            # Replace only the generic generated check-understanding details.
            for d in cs.find_all('details'):
              txt=clean(d.get_text(' ',strip=True))
              if GENERIC in txt and d.find('summary'):
                sumtxt=clean(d.find('summary').get_text(' ',strip=True)).lower()
                if 'check understanding' in sumtxt or 'questions and answers' in sumtxt:
                  new=BeautifulSoup(f'''<details name="lesson"><summary><span>Teach, ask and check</span><span>Topic-aligned</span></summary><div class="panel"><article class="content-block"><h2>{html.escape(code)} · {html.escape(clip(title,120))}</h2><p><strong>Learning focus:</strong> {html.escape(clip(lead or curriculum,420))}</p><p><strong>Model it:</strong> {html.escape(clip(model,520))}</p><p><strong>Ask the learner:</strong> {html.escape(clip(check,500))}</p><p><strong>Look for:</strong> {html.escape(clip(success,420))}</p><p><strong>If they are stuck:</strong> {html.escape(clip(mistake,420))}</p></article></div></details>''','html.parser').details
                  d.replace_with(new)
                elif 'exit ticket' in sumtxt:
                  new=BeautifulSoup(f'''<details name="lesson"><summary><span>Exit ticket</span><span>Independent check</span></summary><div class="panel"><article class="content-block"><h2>One fresh example</h2><p>{html.escape(clip(check,500))}</p><p><strong>Ready to move on when:</strong> {html.escape(clip(success,420))}</p></article></div></details>''','html.parser').details
                  d.replace_with(new)
            final=str(cs)
            # Preserve doctype if BeautifulSoup normalized it away.
            if src.lstrip().lower().startswith('<!doctype') and not final.lstrip().lower().startswith('<!doctype'):
              final='<!doctype html>\n'+final
            if final!=src:
              cp.write_text(final)
              changed.append((code,str(cp),bool(model),bool(check),bool(success)))

          Path('reports').mkdir(exist_ok=True)
          lines=['# Foundation Topic ↔ Worksheet ↔ Classroom alignment sweep','',
                 'Date: 2026-09-08','',
                 'Strength-first rule: topic pages and worksheets were preserved unless a concrete alignment gap existed. This pass targets older generic Classroom View template residue and replaces it with teaching/check language sourced from the sibling Topic Page.','',
                 f'Classroom files changed: {len(changed)}', f'Classroom files skipped: {len(skipped)}','', '## Changed']
          for code,path,*_ in changed: lines.append(f'- {code}: `{path}` — generic generated checking replaced with topic-aligned model / ask / look-for / misconception support; misleading “Copied content” label removed where present.')
          lines += ['', '## Skipped']
          for path,why in skipped: lines.append(f'- `{path}` — {why}.')
          Path('reports/foundation-classroom-alignment-sweep-20260908.md').write_text('\n'.join(lines))
          print(f'changed={len(changed)} skipped={len(skipped)}')
          assert changed, 'expected at least one Foundation classroom improvement'
          assert not any(GENERIC in p.read_text(errors='ignore') for p in classrooms), 'generic Foundation classroom QA remains'
          PY
      - name: Commit sweep and remove temporary workflow
        run: |
          rm .github/workflows/foundation-alignment-sweep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundation reports .github/workflows/foundation-alignment-sweep.yml
          git commit -m 'content: align Foundation classroom views to topic teaching'
          git push origin HEAD:${{ github.ref_name }}
