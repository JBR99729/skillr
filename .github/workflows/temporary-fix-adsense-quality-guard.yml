name: Temporary AdSense quality guard repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical guard output
        run: |
          python3 scripts/adsense_final_cleanup.py
          python3 scripts/strip_legacy_homework_ads.py
          python3 scripts/adsense_legacy_homework_safety.py
          rm .github/workflows/temporary-fix-adsense-quality-guard.yml
      - name: Verify idempotence and publish
        run: |
          git diff --check
          first="$(git diff | sha256sum)"
          python3 scripts/adsense_final_cleanup.py
          python3 scripts/strip_legacy_homework_ads.py
          python3 scripts/adsense_legacy_homework_safety.py
          second="$(git diff | sha256sum)"
          test "$first" = "$second"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Align generated pages with AdSense quality guard'
          git push origin HEAD:main
