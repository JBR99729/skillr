name: Remove expanded question banks section

on:
  push:
    branches:
      - cleanup/remove-expanded-question-banks-section
    paths:
      - scripts/remove_expanded_question_banks_section.mjs
      - .github/workflows/remove-expanded-question-banks-section.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-expanded-question-banks-section
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove_expanded_question_banks_section.mjs
      - name: Commit static page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year7/maths/ac9m7n06-the-4-operations-with-positive-rational-numbers-including/index.html
          git rm scripts/remove_expanded_question_banks_section.mjs .github/workflows/remove-expanded-question-banks-section.yml
          git commit -m "Remove expanded question banks section"
          git push origin HEAD:cleanup/remove-expanded-question-banks-section
