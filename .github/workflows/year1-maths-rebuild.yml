name: Complete remaining Year 1 Maths

on:
  push:
    branches:
      - agent/year1-maths-full-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[year1-maths-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-full-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate comprehensive source pools
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04; do
            curl -fsSL "https://raw.githubusercontent.com/JBR99729/skillr/b0e7d45231edb95e1e7f9b812b2daea4a528f1e7/scripts/year1-maths-rebuild-b64/part-${part}"
          done \
            | tr -d '\n\r ' \
            | base64 -d \
            | gzip -dc \
            > /tmp/build-year1-maths-rebuild.js
          node --check /tmp/build-year1-maths-rebuild.js
          node /tmp/build-year1-maths-rebuild.js

      - name: Protect completed AC9M1N01-AC9M1N06 resources
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            quiz/year-1/math/ac9m1n01 \
            quiz/year-1/math/ac9m1n02 \
            quiz/year-1/math/ac9m1n03 \
            quiz/year-1/math/ac9m1n04 \
            quiz/year-1/math/ac9m1n05 \
            quiz/year-1/math/ac9m1n06 \
            year1/maths/ac9m1n01-numbers-to-120 \
            year1/maths/ac9m1n02-partitioning-tens-and-ones \
            year1/maths/ac9m1n03-skip-counting-and-equal-groups \
            year1/maths/ac9m1n04-addition-and-subtraction-within-20 \
            year1/maths/ac9m1n05-additive-problem-solving-and-money \
            year1/maths/ac9m1n06-equal-sharing-and-grouping \
            year1/curriculum/index.html \
            year1/curriculum/maths/index.html \
            assets/year1-maths-data.js \
            assets/qa-complete-ribbon.js \
            quiz/assets/style.css \
            service-worker.js \
            pwa-register.js \
            quiz/assets/daily-drills/year1-maths-n01-n03-extensions.js \
            quiz/assets/daily-drills/year1-maths-n04-n06-extensions.js \
            year1-maths-ac9m1n04-n06-rebuild-report.json

      - name: Apply the 28-12-50 educator-reviewed standard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/year1-maths-remaining-tools
          cat scripts/year1-maths-remaining-tools-b64/part-* \
            | tr -d '\n\r ' \
            | base64 -d \
            > /tmp/year1-maths-remaining-tools.tar.gz
          gzip -t /tmp/year1-maths-remaining-tools.tar.gz
          tar -xzf /tmp/year1-maths-remaining-tools.tar.gz -C /tmp/year1-maths-remaining-tools
          node --check /tmp/year1-maths-remaining-tools/postprocess-year1-maths-remaining.js
          node --check /tmp/year1-maths-remaining-tools/validate-year1-maths-remaining.js
          node /tmp/year1-maths-remaining-tools/postprocess-year1-maths-remaining.js

      - name: Validate educational and technical quality gates
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/year1-maths-remaining-tools/validate-year1-maths-remaining.js
          for file in quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,practice/practice-questions.js,test/questions.js}; do
            node --check "$file"
          done
          node --check quiz/assets/daily-drills/year1-maths-remaining-extensions.js
          node --check assets/qa-complete-ribbon.js
          node --check service-worker.js
          ! grep -RniE 'self-check|answers may vary|a different choice|which learning goal best|which classroom activity best' \
            quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,test/questions.js} \
            quiz/assets/daily-drills/year1-maths-remaining-extensions.js

      - name: Remove temporary build inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/year1-maths-remaining-tools-b64
          rm -f scripts/run-year1-maths-remaining.txt
          rm -f .github/workflows/year1-maths-rebuild.yml

      - name: Commit completed Year 1 Maths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete remaining Year 1 Maths banks [year1-maths-built]"
          git push origin HEAD:agent/year1-maths-full-rebuild
