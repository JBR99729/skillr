name: Tighten Year 8 free-first claims

on:
  push:
    branches: ['content/blog-free-first-campaign']

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/blog-free-first-campaign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tighten promotional claims
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='blogs/free-year-8-english-worksheets-australia-practice-tests.html';
          let h=fs.readFileSync(file,'utf8');
          h=h.replace('<h2>Why you may not need another monthly or yearly learning subscription</h2>','<h2>Try free resources before committing to a subscription</h2>');
          h=h.replace(/<p>Paid learning platforms can be useful\.[\s\S]*?<p>The point is not that every paid platform is unnecessary\.[\s\S]*?<\/p>\n\n<h2>What makes topic-by-topic learning valuable\?<\/h2>/,
`<p>Paid learning platforms can add real value when a learner needs something extra such as live tutoring, teacher marking, adaptive diagnostics, formal school reporting or a highly personalised program. The point is not that paid services are unnecessary.</p>
<p>The practical question is whether a family needs to pay <em>before</em> the student has shown that they will consistently use the learning resources already available. Paying for a larger question bank does not itself guarantee that a student will complete more practice.</p>
<p>A sensible first test is simple: choose the school topic, read the free Topic Guide, complete the Practice activity, review mistakes and take the Test. Repeat that across several topics. If the student is regularly using those resources and genuinely needs more volume, personalisation or support, then a paid service has a much clearer purpose.</p>
<div class="guide-box"><strong>The free-first check:</strong><p>Before buying access to more questions, ask whether the student is already consistently completing the free <strong>Learn → Practice → Test</strong> pathway. If not, the immediate problem may be study routine or topic understanding rather than access to a bigger question bank.</p></div>
<h2>What makes topic-by-topic learning valuable?</h2>`);
          h=h.replace(/<p>Large subscription platforms often organise learning into courses, levels or proprietary sequences\.[\s\S]*?<\/p>/,
'<p>Different learning platforms organise content in different ways. For school revision, however, students often have a very specific need: “This is the exact topic my class is doing — where is the matching explanation and practice?”</p>');
          h=h.replace(/<p>This is the same basic learning loop many families are looking for when they subscribe to an education app:[\s\S]*?<\/p>/,
'<p>This creates a straightforward learning loop: <strong>learn → practise → check → improve → test</strong>. Use it consistently before deciding that the learner needs a larger paid program.</p>');
          h=h.replace(/<h2>Before paying for another education app<\/h2>[\s\S]*?<p>For many Year 8 English learners, the immediate need is not another platform\. It is a clear next topic and enough focused practice to master it\.<\/p>/,
`<h2>Before paying for another education app</h2>
<ul class="checklist"><li>Write down the exact extra feature you need: tutoring, marking, adaptive practice, reporting or something else.</li><li>Check whether school resources and free curriculum-linked resources already cover the core topic.</li><li>Use the free topic pathway consistently and see whether the learner actually completes the work.</li><li>If the free resources are being fully used and the learner still needs more support or volume, compare paid options based on that specific need.</li></ul>
<p>The free-first approach does not guarantee that SkillrHub alone will suit every learner. It simply gives families a low-risk way to test the student’s study routine and curriculum needs before committing to another recurring cost.</p>`);
          fs.writeFileSync(file,h);
          NODE
      - run: node scripts/validate_blog_free_first_campaign.mjs
      - name: Commit tightening
        run: |
          rm .github/workflows/tighten-year8-free-first-claims.yml
          git add blogs/free-year-8-english-worksheets-australia-practice-tests.html .github/workflows/tighten-year8-free-first-claims.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Tighten free-first claims in Year 8 English guide'
          git push origin HEAD:content/blog-free-first-campaign
