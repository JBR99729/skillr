name: Surface curriculum research evidence

on:
  push:
    branches: [main]
    paths:
      - 'scripts/surface_curriculum_research_evidence.py'
      - 'reports/**'
      - 'docs/research/**'
      - 'docs/question-bank-reviews/**'
      - '*Research_Master.txt'
      - '*Content_Verification_Master.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surface:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add evidence-gated research sections
        run: python3 scripts/surface_curriculum_research_evidence.py
      - name: Commit research evidence sections
        run: |
          if git diff --quiet; then
            echo "No research-evidence page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation year1 year2 year3 year4 year5 year6 year7 year8 year9 year10 reports/curriculum-research-evidence-surface.json
          git commit -m "Surface code-specific curriculum research evidence"
          git push
