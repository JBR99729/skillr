name: Finish Year 8 authored homework

on:
  push:
    branches: [main]
    paths:
      - '.github/finish-year8-homework-authoring.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Author remaining Year 8 Maths and Science homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff;color:var(--ink)}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}h2{margin:0 0 12px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          function guideFrom(file){const old=fs.existsSync(file)?fs.readFileSync(file,'utf8'):''; return (old.match(/<a href="([^"]+)">Topic guide<\/a>/)||[])[1] || '/year8/curriculum/';}
          function page({code, subject, pathPart, title, intro, short, long, task}) {
            const qShort = short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const qLong = long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            const yearSub = subject === 'Maths' ? 'math' : 'science';
            const file = `quiz/year-8/${yearSub}/${code.toLowerCase()}/homework/index.html`;
            const guide = guideFrom(file);
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${code} Authored Homework | ${esc(title)}</title><meta name="description" content="Authored SkillrHub homework for Year 8 ${subject} ${code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-8/${yearSub}/${code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 8 ${subject} • ${code} • Authored homework</p><h1>${esc(title)}</h1><p>${esc(intro)} Show reasoning in full sentences where useful, and check calculations or conclusions before finishing.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${qShort}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${qLong}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 8 ${subject} homework • Print or save as PDF</p></main></body></html>`;
          }
          function write(item) { const file = `quiz/year-8/${item.subject==='Maths'?'math':'science'}/${item.code.toLowerCase()}/homework/index.html`; fs.mkdirSync(path.dirname(file),{recursive:true}); fs.writeFileSync(file,page(item)); }
          const science = [
            {code:'AC9S8I02',subject:'Science',title:'Plan a Reproducible Investigation',intro:'Plan fair and reproducible investigations by identifying variables, controls, repeated trials, safety and useful data collection.',short:[`Write an investigable question about how light level affects plant growth.`,`Identify the independent variable, dependent variable and two controlled variables for testing salt concentration and seed germination.`,`What is the difference between a prediction and a hypothesis?`,`Why should a method include repeated trials?`,`Write one safety rule for heating water in a classroom investigation.`,`Explain why sample size matters when comparing two groups.`,`Name one piece of equipment needed to measure temperature accurately.`,`Write a control condition for testing whether fertiliser affects plant height.`,`What makes a method reproducible for another class?`,`Why should a data table be planned before the experiment begins?`],long:[`Design a fair test to investigate how the height of a ramp affects the distance a toy car travels. Include variables, equipment, method, repeats and safety.`,`A group wants to test whether sugar dissolves faster in warm water. Improve their method so it is fair, safe and reproducible.`,`Write a hypothesis for an investigation about exercise and heart rate, then explain how you would collect reliable data.`,`Compare two methods for testing absorbency of paper towels and decide which is more reproducible.`,`Plan a data table for an investigation into temperature and dissolving time. Explain why each column is needed.`,`Explain how risk assessment changes when using glassware, hot water or moving objects.`,`A student changes both water temperature and amount of stirring. Explain why this weakens the investigation and how to fix it.`,`Describe how to use a control group when testing a claim about plant fertiliser.`,`Write a step-by-step method another student could follow exactly to test a simple causal relationship.`,`Evaluate whether a proposed method with one trial and no controlled variables can support a strong conclusion.`],task:`Research one simple school science investigation online or in a textbook. Rewrite its method so it clearly identifies variables, controls, repeats, safety and the exact data to collect.`},
            {code:'AC9S8I03',subject:'Science',title:'Measure with Useful Precision',intro:'Choose equipment and record data with suitable units, precision and consistency so measurements are useful evidence.',short:[`What is the difference between accuracy and precision?`,`Which tool is more suitable for measuring 25 mL of water: a beaker or measuring cylinder? Explain.`,`Record 3.456 cm to one decimal place and to two decimal places.`,`Why should units be written in every data table heading?`,`What is a parallax error when reading a scale?`,`Why are repeated measurements useful?`,`Give one example of a digital sensor used in science.`,`Explain why measuring to the nearest metre is not useful for a leaf length.`,`What should you do if one measurement is very different from the others?`,`Write a correct table heading for time measured in seconds.`],long:[`A student measures reaction time with a stopwatch three times: 0.42 s, 0.45 s and 0.43 s. Calculate the mean and comment on precision.`,`Compare using a ruler, tape measure and laser measure for measuring a classroom. Which is most suitable and why?`,`Explain how to reduce measurement error when measuring the temperature change of water over 10 minutes.`,`A balance reads to the nearest 0.1 g. Explain what this tells you about precision and why it matters.`,`Design a measurement plan for plant growth over two weeks, including tool, units, frequency and table format.`,`Explain how poor measurement choices could make a fair investigation unreliable.`,`A student writes lengths as 12, 13 cm, and 0.14 m. Explain the problem and rewrite the data consistently.`,`Describe how to use repeated readings and averaging to improve confidence in results.`,`Choose suitable equipment to measure time, mass, length and temperature in a dissolving investigation. Justify each choice.`,`Evaluate whether a graph based on poorly labelled, inconsistent measurements can support a strong conclusion.`],task:`Find a real scientific instrument such as a microscope, thermometer, sensor, seismometer or data logger. Explain what it measures, its units, and why precision matters.`},
            {code:'AC9S8I04',subject:'Science',title:'Choose a Representation That Reveals the Pattern',intro:'Select tables, graphs, flow charts, diagrams or models that make patterns, relationships and comparisons clear.',short:[`When is a line graph better than a bar graph?`,`What type of graph suits categories such as rock type or organ system?`,`Write a clear title for a graph showing temperature over time.`,`Why should axes have labels and units?`,`What is a trend line?`,`How can a diagram show structure and function more clearly than text?`,`Why might a table be better than a paragraph for raw data?`,`What is one limitation of a model?`,`Choose a representation for showing the rock cycle and explain your choice.`,`What representation would you use for parts of a cell?`],long:[`Convert this data idea into a graph plan: time in minutes and temperature in degrees Celsius during cooling. Describe axes, scale and title.`,`Explain why a flow chart is useful for showing energy transfers in a system.`,`Compare a table and a graph for showing transpiration rates under four conditions. What does each show well?`,`Design a labelled diagram to compare plant and animal cells, including shared and different structures.`,`A student uses a pie chart to show temperature over time. Explain why this is unsuitable and choose a better representation.`,`Describe how a model of plate boundaries can show movement even though it is not the real Earth.`,`Create a table layout for an investigation with independent variable, dependent variable, repeats and mean.`,`Explain how a poor scale on a graph can hide or exaggerate a pattern.`,`Choose the best representation for comparing solution, suspension and colloid particles. Justify your choice.`,`Evaluate a graph that has no units, uneven scale and unclear title. Explain how to improve it.`],task:`Find a science diagram, table or graph from a reliable source. Explain what it shows, why the representation is useful, and one limitation it has.`},
            {code:'AC9S8I05',subject:'Science',title:'Find Patterns Without Ignoring Anomalies',intro:'Analyse data for trends, relationships and anomalies, then describe what the evidence suggests without overstating it.',short:[`What is a pattern in data?`,`What is an anomaly?`,`Why should anomalies not be ignored automatically?`,`How can a graph help reveal a trend?`,`What does a positive relationship between two variables mean?`,`What does it mean if results are scattered and show no clear trend?`,`Why is calculating a mean sometimes useful?`,`Give one reason a data point might be anomalous.`,`What is the difference between describing data and explaining data?`,`Write one cautious conclusion sentence using the word suggests.`],long:[`A plant growth graph rises as light hours increase. Describe the trend and give one possible explanation.`,`A class gets one temperature reading far above all the others. Explain three possible causes and what should be done before removing it.`,`Interpret a data set where reaction time decreases after practice. Describe the pattern and a limitation.`,`Explain why correlation does not always prove causation using a science example.`,`A graph shows that dissolving time decreases as temperature increases. Write a conclusion supported by the data.`,`Compare two sets of results and decide which is more reliable. Refer to spread, repeats and anomalies.`,`Explain how increasing sample size can make patterns clearer.`,`Write a paragraph interpreting a data table that shows heart rate before and after exercise.`,`Evaluate a conclusion that uses only the best-looking data points and ignores the rest.`,`Create a short data story: describe the trend, identify an anomaly, and make a careful claim.`],task:`Find a published graph or table about weather, health, sport, environment or technology. Identify the trend, one limitation, and whether any data point looks unusual.`},
            {code:'AC9S8I06',subject:'Science',title:'Test the Method and the Claim',intro:'Analyse methods, conclusions and claims for assumptions, bias, uncontrolled variables and evidence strength.',short:[`What is an assumption in an investigation?`,`What is bias in data collection?`,`Why can a small sample weaken a claim?`,`What is an uncontrolled variable?`,`Why should conclusions match the evidence collected?`,`Give one sign that a claim may be exaggerated.`,`What is the difference between evidence and an advertisement claim?`,`Why is peer review useful?`,`How can funding or personal interest influence a claim?`,`Write one question you would ask before trusting a science claim.`],long:[`Evaluate this claim: “This drink improves concentration because five students felt better after drinking it.” Identify weaknesses.`,`A method has no control group, no repeats and a vague measurement. Explain how these flaws affect the conclusion.`,`Compare a strong evidence-based claim with a weak claim based on opinion. Use examples.`,`Analyse a product claim about cleaning, health, fitness or energy use. What evidence would you need?`,`Explain how confirmation bias could affect how a student records observations.`,`Rewrite a weak conclusion so it accurately reflects limited evidence.`,`Describe how a fairer method could test whether music affects plant growth.`,`Explain why one surprising result should lead to more testing, not an immediate strong claim.`,`Evaluate whether a news headline about science gives enough information to judge the evidence.`,`Create a checklist for testing the quality of a scientific claim.`],task:`Choose one science-related claim from an advertisement, news headline or social media post. Identify the claim, evidence provided, missing evidence and your judgement.`},
            {code:'AC9S8I07',subject:'Science',title:'Communicate Science Clearly',intro:'Communicate scientific ideas and findings for a purpose and audience using evidence, correct vocabulary and clear structure.',short:[`Why does audience matter in science communication?`,`Write a clearer version of: “The stuff changed because it reacted.”`,`What is one feature of a good scientific explanation?`,`Why should evidence be included in a conclusion?`,`Name two ways to communicate scientific findings besides a written report.`,`What is the role of a labelled diagram?`,`How can headings improve a science report?`,`Why should scientific vocabulary be defined for younger readers?`,`What is one difference between a poster and a lab report?`,`Write one sentence that links evidence to a claim.`],long:[`Write a short explanation for Year 6 students about the difference between physical and chemical change.`,`Turn a set of investigation results into a clear claim-evidence-reasoning paragraph.`,`Design a one-page poster plan explaining why cells are the basic units of living things.`,`Explain how you would communicate plate tectonics differently to a teacher, a Year 5 student and a community group.`,`Rewrite a confusing conclusion so it includes the claim, evidence and reasoning.`,`Create a labelled flow chart explaining an energy transformation in an everyday device.`,`Compare a table, graph and paragraph for communicating results. Which is best for which audience?`,`Write a short speech explaining a science issue and include one piece of evidence.`,`Evaluate a science infographic: what makes it clear, and what might mislead readers?`,`Prepare a communication plan for a science investigation, including purpose, audience, format and key evidence.`],task:`Find a science communication example such as an infographic, museum panel, video or article. Explain who it is for, what it communicates well and how it could be improved.`},
            {code:'AC9S8I08',subject:'Science',title:'Reflect on Investigation Quality',intro:'Reflect on the quality of investigation processes and suggest specific improvements to methods, data and explanations.',short:[`What does it mean to evaluate an investigation?`,`Why is it useful to reflect after an experiment?`,`Name one way to improve reliability.`,`Name one way to improve accuracy.`,`What is a limitation of a method?`,`Why should improvements be specific rather than vague?`,`How can repeated trials improve confidence?`,`Why should safety be reviewed after practical work?`,`What is one reason results might not support the hypothesis?`,`Write one useful improvement for a method that had only one trial.`],long:[`Evaluate a dissolving investigation that used different water volumes each time. Identify the problem and improve the method.`,`A group measured plant growth for only one day. Explain why this limits the conclusion and suggest improvements.`,`Write a reflection paragraph for an investigation that had reliable repeats but poor equipment precision.`,`Compare two possible improvements and decide which would most strengthen the evidence.`,`Explain how a student could improve both the data table and graph in a future attempt.`,`Reflect on a method that was safe but not fair. Identify the controlled variables that need attention.`,`A hypothesis was not supported by the results. Explain why this can still be useful science.`,`Write a revised method after identifying one uncontrolled variable, one measurement issue and one safety issue.`,`Evaluate whether a conclusion should be strong, cautious or rejected when data are inconsistent.`,`Create a checklist for improving the next version of a Year 8 science investigation.`],task:`Choose one investigation you have done or read about. Write a reflection that identifies strengths, weaknesses and three specific improvements for next time.`}
          ];
          function mathProfile(code,title,q1,q2,q3,err,long1,long2,task){return {code,subject:'Maths',title,intro:`Practise ${title} through calculations, explanation, modelling and checking.`,short:[q1,q2,q3,err,`Write the rule or formula most useful for ${title}.`,`Show how to check one answer using estimation, substitution or inverse operations.`,`Write one common mistake students make in ${title} and correct it.`,`Create a small table, diagram or equation that represents this topic.`,`State where units, exact form or rounding matter in this topic.`,`Write one exam-style short question on ${title} and solve it.`],long:[long1,long2,`Solve a multi-step problem involving ${title} and explain every step clearly.`,`Create a realistic word problem for ${title}, solve it and interpret the answer.`,`Compare two methods for a problem in ${title} and explain which is more efficient.`,`Write a worked solution that includes a check for reasonableness.`,`Create a problem with a deliberate trap, then solve it correctly and explain the trap.`,`Use a diagram, table, graph or equation to model a situation involving ${title}.`,`Explain how this topic connects to a previous Year 7 or Year 8 maths skill.`,`Write a full-mark response to a challenging ${title} question, including reasoning and final answer.`],task};}
          const maths = [
            mathProfile('AC9M8N01','Irrational numbers in applied contexts','Estimate √45 to one decimal place and explain how you know it is between 6 and 7.','Use π to write the exact circumference of a circle with diameter 12 cm, then approximate it.','Explain why √36 is rational but √37 is irrational.','A student says π = 3.14 exactly. Correct the statement.','A circular garden has radius 2.8 m. Find its exact area in terms of π and an approximate area to one decimal place.','A square has area 50 cm². Estimate its side length and explain why the exact answer is irrational.','Research one real situation where π, square roots or irrational numbers are used, then create and solve a related problem.'),
            mathProfile('AC9M8N02','Exponent laws','Simplify 3² × 3⁵.','Simplify 7⁶ ÷ 7² and explain the exponent law used.','Evaluate 12⁰ and explain why the answer is not 0.','A student writes 2³ × 2⁴ = 4⁷. Find and correct the error.','Simplify (5²)³, 4³ × 4² and 9⁵ ÷ 9³, explaining the law used each time.','Write three equivalent expressions for 10⁶ using products, quotients or powers of powers.','Research one real use of exponent notation such as file size, population, astronomy or area growth. Explain the meaning of the exponent.'),
            mathProfile('AC9M8N03','Terminating and recurring decimals','Convert 3/8 to a decimal and state whether it terminates or recurs.','Convert 2/3 to recurring decimal notation.','Explain how a calculator can help identify a recurring decimal, but also why reasoning is needed.','A student says 0.333 is exactly 1/3. Correct the statement.','Classify 7/20, 5/6, 11/25 and 4/9 as terminating or recurring decimals and justify each one.','Compare 0.4, 0.44, 0.444... and 4/9 on a number line.','Research how recurring decimals are written in textbooks or calculators, then explain two notations with examples.'),
            mathProfile('AC9M8N04','Operations with integers and rational numbers','Calculate -7 + 12 - 5.','Evaluate (-3) × 8 ÷ (-4).','Calculate 2/3 + 5/6 and simplify.','A student writes -4² = 16 without brackets. Explain the issue.','Solve a bank account problem starting at -$18, adding $45, then spending $62. Interpret the result.','Evaluate -2.5 + 3/4 × 8 and explain the order of operations.','Research a real context using negative numbers, such as temperature, debt or elevation. Create and solve a mixed-operation problem.'),
            mathProfile('AC9M8N05','Rational number and percentage modelling','Find 15% of $240.','A jacket is discounted by 25% from $80. Find the sale price.','Increase 64 by 12.5% and show your method.','A student subtracts 20 from $200 to find a 20% discount. Correct the method.','Compare two phone plans: $25 plus $0.10 per text, or $40 with unlimited texts. Find when each is better.','A shop adds 10% GST after a 30% discount. Work out the final price of a $120 item and explain the order.','Research a real discount, fee, interest or budgeting context. Create a percentage model and solve it.'),
            mathProfile('AC9M8A01','Linear expressions','Expand 3(2x + 5).','Factorise 8x + 12.','Simplify 4a + 7 - 2a + 5.','A student writes 2(x + 3) = 2x + 3. Correct the expansion.','Simplify 5(2x - 1) - 3(x + 4) and explain each algebraic property used.','Create two different expressions that simplify to 6x + 9, then explain how you know.','Research one situation that can be represented by a linear expression, such as taxi fares or membership fees. Create and simplify an expression.'),
            mathProfile('AC9M8A02','Linear equations, inequalities and graphs','Solve 3x + 7 = 22.','Graph y = 2x + 1 for x = -2, -1, 0, 1, 2.','Solve x - 4 < 9 and show the solution on a number line.','A student solves 2x + 5 = 17 as x = 11. Find the error.','Graph y = -x + 4 and explain the meaning of the intercepts in a simple context.','Solve 4x - 3 = 2x + 9 algebraically, then verify by substitution.','Research a real graph with a constant rate. Identify the gradient and intercept and explain their meaning.'),
            mathProfile('AC9M8A03','Linear modelling','A gym charges $20 joining fee plus $8 per week. Write the cost equation.','For C = 5n + 12, find C when n = 10 and interpret the result.','Choose whether a table with constant differences represents a linear relation.','A student uses a curved graph for a fixed cost plus constant rate. Explain why a straight line is expected.','Compare two hire plans: A costs $15 + $4h and B costs $9 + $6h. Find the break-even time.','Model the cost of printing posters with a setup fee and per-poster charge, then interpret the equation and graph.','Research a bill, fare or subscription that has a fixed and variable cost. Build a linear model for it.'),
            mathProfile('AC9M8A04','Testing linear patterns','Complete the table for y = 3x - 2 when x = 0, 1, 2, 3.','Describe what happens to y = mx + c when c increases.','Make a conjecture about the graph of y = -2x + 5.','A student says every increasing pattern is linear. Give a counterexample.','Use a table to test whether the sequence 4, 7, 10, 13 is linear and write a rule.','Compare y = 2x + 1 and y = 5x + 1 using a table and graph. Explain what changes.','Use a digital graphing tool or spreadsheet to investigate how changing gradient affects a line. Record your observations.'),
            mathProfile('AC9M8M01','Area and perimeter of composite shapes','Find the perimeter of an L-shape made from a 10 m by 6 m rectangle with a 3 m by 2 m corner removed.','Find the area of that L-shape.','Explain why area units are squared but perimeter units are not.','A student adds all visible lengths but misses an inside edge. Explain how to avoid this.','A garden is made from two rectangles: 8 m by 5 m and 4 m by 3 m. Find total area and fencing length.','Design a composite floor plan and calculate the amount of carpet and skirting board needed.','Research a room, garden or playground layout. Draw a composite shape and calculate area and perimeter.'),
            mathProfile('AC9M8M02','Volume and capacity of right prisms','Find the volume of a rectangular prism 8 cm by 5 cm by 3 cm.','Convert 2500 cm³ to litres.','Explain why volume is measured in cubic units.','A student multiplies only length × width for a prism volume. Correct the method.','A fish tank is 60 cm by 30 cm by 40 cm. Find its capacity in litres.','Compare two containers and decide which holds more, showing unit conversions.','Research a real container, tank or package. Estimate its volume and capacity using measurements.'),
            mathProfile('AC9M8M03','Circumference and area of circles','Find the circumference of a circle with radius 7 cm in terms of π.','Find the area of a circle with diameter 10 m.','Explain the difference between radius, diameter, circumference and area.','A student uses 2πr for area. Correct the formula choice.','A circular path surrounds a pond of radius 4 m and has width 1 m. Find the area of the path.','Compare exact answers in terms of π with decimal approximations for two circle problems.','Research a circular object or space. Measure it and calculate circumference and area.'),
            mathProfile('AC9M8M04','Duration, time zones and itineraries','Convert 7:45 pm to 24-hour time.','Find the duration from 09:35 to 14:20.','If Perth is UTC+8 and Sydney is UTC+10, convert 6:30 pm Perth time to Sydney time.','A student subtracts clock times without crossing midnight correctly. Correct the method.','Plan an itinerary with a 2 h 35 min flight leaving at 22:40 and a 1 h time-zone change. Find arrival time.','Compare two meeting times for people in Sydney, Perth and Tokyo and justify the best option.','Research a real flight, online meeting or sports broadcast across time zones and calculate local times.'),
            mathProfile('AC9M8M05','Rates and comparisons','A runner travels 5 km in 25 minutes. Find the speed in km/h.','Find the unit price if 750 g costs $6.00.','Convert 90 km/h to metres per second.','A student compares $4 for 500 g with $7 for 1 kg using total price only. Correct the comparison.','Compare three internet plans using dollars per GB and explain the best value for different users.','A cyclist rides 18 km in 45 minutes, rests, then rides 12 km in 30 minutes. Find average speed for riding time.','Research a rate from sport, travel, shopping or utilities. Explain and compare it using unit rates.'),
            mathProfile('AC9M8M06','Pythagoras and right triangles','Find the hypotenuse of a right triangle with shorter sides 6 cm and 8 cm.','Find the missing side if the hypotenuse is 13 m and one side is 5 m.','Explain how to identify the hypotenuse.','A student adds side lengths instead of squaring them. Correct the method.','A ladder reaches a wall 4 m high and is 1.5 m from the wall. Find the ladder length.','Use Pythagoras to decide whether a triangle with sides 9, 12 and 15 is right-angled.','Research a real use of Pythagoras in building, sport, maps or design. Create and solve a related problem.'),
            mathProfile('AC9M8M07','Ratio and rate modelling','Simplify the ratio 18:24.','Share $84 in the ratio 2:5.','A map scale is 1:50 000. Find the real distance for 6 cm on the map.','A student adds the ratio parts incorrectly when sharing. Correct the method.','A recipe uses flour and sugar in the ratio 5:2. Scale it to use 350 g of flour.','Model a road trip using distance, time and fuel rate, then decide whether the plan is realistic.','Research a scale, recipe, map or speed context. Build a ratio/rate model and solve it.'),
            mathProfile('AC9M8SP01','Congruence and similarity','State the SSS, SAS, ASA or RHS condition for congruent triangles.','Decide whether triangles with sides 5, 7, 8 and 5, 7, 8 are congruent.','Find the scale factor from a triangle with side 4 cm to a similar triangle with matching side 10 cm.','A student says equal area proves two triangles are congruent. Correct the claim.','Use similarity to find a missing side when two matching sides are 6 cm and 15 cm.','Prove two triangles are congruent using a labelled diagram and a valid congruence condition.','Research a real use of similarity or congruence in maps, shadows, design or construction. Explain it with a diagram.'),
            mathProfile('AC9M8SP02','Quadrilateral properties and proof','State two properties of a parallelogram.','Find the missing angle in a quadrilateral with angles 95°, 80° and 110°.','Explain why a rectangle is also a parallelogram.','A student says every rhombus is a square. Correct the statement.','Use congruent triangles to justify why opposite sides of a parallelogram are equal.','Compare a kite, rhombus, rectangle and trapezium using sides, angles and diagonals.','Research a real structure that uses quadrilaterals. Identify the quadrilaterals and explain useful properties.'),
            mathProfile('AC9M8SP03','3D position and location','Write coordinates for a point 3 units east, 2 units north and 5 units up from the origin.','Describe a movement from (1, 2, 3) to (4, 2, 7).','Explain why three coordinates are needed in 3D location.','A student swaps height and northing in a coordinate. Explain why order matters.','Plot and describe the vertices of a rectangular prism using 3D coordinates.','Give step-by-step directions through a simple 3D grid, then write the final coordinate.','Research a real use of 3D coordinates such as gaming, GPS, warehouses, architecture or medical imaging.'),
            mathProfile('AC9M8ST01','Data collection and sampling','Identify the population and sample for a survey of 40 Year 8 students.','Classify a census, random sample and convenience sample.','Write one unbiased survey question about screen time.','A student surveys only their friends and claims it represents the school. Explain the problem.','Design a sampling plan to estimate how students travel to school. Include population, sample size and method.','Compare random sampling and convenience sampling for a canteen survey.','Research a public survey or poll. Identify the sample, population and possible bias.'),
            mathProfile('AC9M8ST02','Sampling methods and data distributions','Find the mean, median and range of 4, 6, 7, 9, 14.','Describe whether a data set with one very large value is skewed.','Explain how an outlier can affect the mean.','A student reports only the mean for a skewed distribution. Explain what else should be included.','Compare two class test-score distributions using centre and spread.','Use a dot plot or box-style description to compare two samples and make a claim.','Research two data sets on a topic such as weather, sport or prices. Compare their distributions.'),
            mathProfile('AC9M8ST03','Sample variation and distributions','Explain why two random samples from the same population may give different proportions.','In one sample 18 of 30 prefer buses; in another 42 of 70 prefer buses. Compare the proportions.','Describe how increasing sample size can affect variation.','A student expects every sample to match the population exactly. Correct this idea.','Simulate 20 coin tosses and 100 coin tosses, then compare how close the results are to 50%.','Compare proportions from two samples and decide whether the difference is likely meaningful or could be sample variation.','Research a poll or experiment where sample size matters. Explain how sample variation affects confidence.')
          ];
          [...science, ...maths].forEach(write);
