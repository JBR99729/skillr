name: Validate curriculum route integrity

on:
  pull_request:
    paths:
      - "foundation/**"
      - "year*/**"
      - "quiz/**"
      - "worksheets/**"
      - "scripts/audit_curriculum_route_integrity.mjs"
      - ".github/workflows/validate-curriculum-route-integrity.yml"
  push:
    branches: [main]
    paths:
      - "foundation/**"
      - "year*/**"
      - "quiz/**"
      - "worksheets/**"
      - "scripts/audit_curriculum_route_integrity.mjs"
      - ".github/workflows/validate-curriculum-route-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check curriculum and resource routes
        run: node scripts/audit_curriculum_route_integrity.mjs
