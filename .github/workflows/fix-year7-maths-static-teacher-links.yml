name: Fix Year 7 Maths static teacher links

on:
  push:
    branches:
      - fix/year7-maths-static-learn-content
    paths:
      - scripts/fix_year7_maths_static_teacher_links.mjs
      - .github/workflows/fix-year7-maths-static-teacher-links.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year7-maths-static-learn-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix_year7_maths_static_teacher_links.mjs
      - name: Commit corrected static pages only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year7/maths/*/index.html
          git rm scripts/fix_year7_maths_static_teacher_links.mjs .github/workflows/fix-year7-maths-static-teacher-links.yml
          git commit -m "Use fixed local Teacher Slides on Year 7 Maths Learn pages"
          git push origin HEAD:fix/year7-maths-static-learn-content
