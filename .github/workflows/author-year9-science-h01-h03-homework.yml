name: Author Year 9 Science H01-H03 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-science-h01-h03-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Science H homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lines = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9S9H01',title:'How Science Is Validated',guide:'/year9/science/ac9s9h01-explain-how-scientific-knowledge-is-validated-and-refined/',intro:'Explain how scientific knowledge is checked, challenged, validated and refined through evidence, peer review, repeated testing and collaboration.',short:['What does it mean to validate scientific knowledge?','Why is repeated testing important before accepting a result?','What is peer review?','Explain the difference between a claim and evidence.','Why should a scientific method be described clearly?','How can new evidence refine an existing explanation?','Give one reason scientists may reject a result.','Why is uncertainty not the same as guessing?','What is a limitation of using one small data set?','Correct this misconception: “Once science proves something, it never changes.”'],long:['Describe the steps scientists use to check whether a new finding is reliable.','Explain how peer review can identify weaknesses in methods, data or conclusions.','Compare a claim supported by repeated evidence with a claim supported by one surprising result.','A student says changing an explanation means science failed. Write a response that explains why refinement can strengthen science.','Use an example from atoms, energy, body systems or the carbon cycle to show how evidence can refine scientific knowledge.','Explain why another scientist should be able to repeat an investigation before accepting the findings.','Describe how bias, poor sampling or uncontrolled variables can weaken a scientific conclusion.','Create a checklist for judging whether a scientific claim is well supported.','Explain how collaboration between scientists can improve the quality of evidence.','Evaluate a headline that makes a strong science claim. What extra information would you need before trusting it?'],task:'Research one case where scientific knowledge changed after new evidence, repeated testing or peer review. Explain the old idea, the new evidence and how the current explanation was validated.'},
            {code:'AC9S9H02',title:'Science and Technology Advance Together',guide:'/year9/science/ac9s9h02-investigate-how-advances-in-technologies-enable-advances-in/',intro:'Investigate how scientific discoveries and technological advances influence each other, including how new tools allow better observations, measurements and applications.',short:['What is the difference between science and technology?','Give one example of technology that helped scientists collect better evidence.','How can scientific knowledge lead to a new technology?','Why did microscopes change the study of living things?','How can sensors improve data collection?','Name one technology used to study Earth or space.','Explain why better measurement can lead to better scientific models.','Give one example of a medical technology based on science.','How can technology also create new science questions?','Correct this misconception: “Technology is just applied science and never changes science itself.”'],long:['Explain how a technology such as the microscope, telescope or data logger enabled a major science advance.','Describe how scientific understanding of electricity made modern communication technologies possible.','Compare how old and modern measurement tools could affect the quality of investigation data.','Explain how satellite technology has improved understanding of weather, climate, oceans or land use.','A student says new technology only makes science faster, not better. Evaluate this claim using an example.','Describe how medical imaging uses science knowledge and also provides evidence for further science.','Explain how advances in computing or modelling can help scientists test complex systems.','Choose one technology and trace the cycle: science idea → technology → new evidence → improved science idea.','Discuss one ethical or social issue created by a new science-based technology.','Write a full response explaining why science and technology often develop together rather than separately.'],task:'Research one technology that transformed scientific understanding, such as microscopes, telescopes, DNA sequencing, satellites, particle accelerators or medical imaging. Explain the science behind it and what new evidence it made possible.'},
            {code:'AC9S9H03',title:'Why Society Adopts Scientific Practices',guide:'/year9/science/ac9s9h03-analyse-the-key-factors-that-contribute-to-science-knowledge-and/',intro:'Analyse why people, communities and governments adopt or reject scientific knowledge and practices, including evidence, trust, cost, access, ethics and cultural context.',short:['What does it mean for society to adopt a scientific practice?','Name two factors that influence whether people accept a science-based recommendation.','Why does trust matter in science communication?','How can cost affect whether a technology is used?','Give one example of an ethical concern linked to a scientific practice.','Why might access be different in different communities?','How can misinformation affect public decisions?','What is one reason a community may hesitate to adopt a new technology?','Why should decision-makers consider evidence and values?','Correct this misconception: “If the science is correct, everyone will automatically agree.”'],long:['Explain why vaccination, recycling, renewable energy or water treatment may be adopted differently by different communities.','Compare evidence, cost, access and trust as factors influencing one science-based practice.','A student says people reject science only because they do not understand it. Write a balanced response using social, economic or ethical factors.','Describe how science communication can increase or reduce public trust.','Evaluate a case where a science-based practice has strong evidence but faces social resistance.','Explain why governments may need to balance scientific evidence with cost, fairness and practicality.','Use an example to show how cultural context can influence acceptance of a scientific practice.','Create a decision table for adopting a new technology, including evidence, benefits, risks, cost and equity.','Explain how misinformation or poor communication could reduce adoption of a useful practice.','Write a recommendation about a science-based practice for a school or community and justify it with evidence and social considerations.'],task:'Research one science-based practice or technology that society has adopted unevenly, such as vaccination, solar power, water fluoridation, electric vehicles, recycling or disease control. Explain the evidence, benefits, barriers and your judgement.'}
          ];
          function page(p){const short=p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(4)}</li>`).join(''); const long=p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(8)}</li>`).join(''); return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Science ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/science/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Science • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Use evidence and clear reasoning in longer answers.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lines(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Science homework • Print or save as PDF</p></main></body></html>`;}
          for (const p of pages) { const file = path.join('quiz','year-9','science',p.code.toLowerCase(),'homework','index.html'); fs.writeFileSync(file,page(p)); }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/science/ac9s9h01/homework/index.html quiz/year-9/science/ac9s9h02/homework/index.html quiz/year-9/science/ac9s9h03/homework/index.html
          git commit -m "Author Year 9 Science H01-H03 homework"
          git push
