name: Build Year 9 Teacher Display pages
'on':
  push:
    branches:
      - feature/year9-teacher-display-pages
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/year9-teacher-display-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derive Year 9 converter
        run: |
          sed -e 's/year8/year9/g' -e 's/Year 8/Year 9/g' scripts/convert_year8_teacher_slides_to_display_pages.mjs > scripts/convert_year9_teacher_slides_to_display_pages.mjs
      - name: Generate Year 9 display pages
        run: node scripts/convert_year9_teacher_slides_to_display_pages.mjs
      - name: Validate Year 9 display pages
        run: |
          node scripts/validate_year9_teacher_display_pages.mjs
          node scripts/validate_static_curriculum_architecture.mjs
          node scripts/validate_f10_topic_layout_contract.mjs
          node scripts/audit_static_teacher_slides.mjs
          node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics
          git diff --check
      - name: Verify deterministic rebuild
        run: |
          node scripts/convert_year9_teacher_slides_to_display_pages.mjs
          node scripts/validate_year9_teacher_display_pages.mjs
          git diff --check
      - name: Commit generated Year 9 displays
        run: |
          rm .github/workflows/build-year9-teacher-display-pages.yml
          git add year9 scripts/convert_year9_teacher_slides_to_display_pages.mjs scripts/validate_year9_teacher_display_pages.mjs .github/workflows/build-year9-teacher-display-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Convert all Year 9 Teacher Slides to display pages'
          git push origin HEAD:feature/year9-teacher-display-pages
