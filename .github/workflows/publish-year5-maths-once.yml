name: Publish Year 5 Maths staged banks once

on:
  push:
    paths:
      - '.github/workflows/publish-year5-maths-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair, decode and install staged Year 5 Maths banks
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,io,json,tarfile,zipfile,string
          root=Path('.')
          p1=root/'assets/year5-math-research-banks-20260909.part1'
          p2=root/'assets/year5-math-research-banks-20260909.part2'
          cs=[''.join(p.read_text(encoding='utf-8').split()) for p in (p1,p2)]
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          boundary=len(cs[0])
          joined=''.join(cs)
          payload=None; repair=None
          def try_decode(s):
              try:
                  b=base64.b64decode(s+'='*((-len(s))%4),validate=False)
                  return gzip.decompress(b)
              except Exception:
                  return None
          payload=try_decode(joined)
          if payload is None:
              # Primary repair: exactly one base64 character was lost at/near the 10,000-char stage boundary.
              for pos in range(boundary-3,boundary+4):
                  for ch in alphabet:
                      d=try_decode(joined[:pos]+ch+joined[pos:])
                      if d is not None:
                          payload=d; repair=f'insert {ch!r} at {pos}'; break
                  if payload is not None: break
          if payload is None:
              # Defensive fallback: one character may have been lost at the boundary plus/minus 3 and another exactly at boundary.
              for pos in range(boundary-2,boundary+3):
                  for a in alphabet:
                      prefix=joined[:pos]+a+joined[pos:]
                      for b in alphabet:
                          d=try_decode(prefix[:boundary+1]+b+prefix[boundary+1:])
                          if d is not None:
                              payload=d; repair=f'insert {a!r} at {pos} and {b!r} near boundary'; break
                      if payload is not None: break
                  if payload is not None: break
          if payload is None:
              raise SystemExit('Unable to integrity-repair staged payload')
          print('Recovered payload:',repair or 'no repair needed','bytes',len(payload),'head',repr(payload[:80]))

          written=[]
          def safe(name):
              p=Path(name)
              if p.is_absolute() or '..' in p.parts: raise ValueError(name)
              return p
          try:
              with tarfile.open(fileobj=io.BytesIO(payload),mode='r:*') as tf:
                  for m in [x for x in tf.getmembers() if x.isfile()]:
                      rel=safe(m.name); dest=root/rel; dest.parent.mkdir(parents=True,exist_ok=True)
                      src=tf.extractfile(m)
                      if src: dest.write_bytes(src.read()); written.append(str(rel))
          except tarfile.ReadError:
              if payload[:4]==b'PK\x03\x04':
                  with zipfile.ZipFile(io.BytesIO(payload)) as zf:
                      for name in zf.namelist():
                          if name.endswith('/'): continue
                          rel=safe(name); dest=root/rel; dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(zf.read(name)); written.append(str(rel))
              else:
                  obj=json.loads(payload.decode('utf-8'))
                  mapping=obj.get('files',obj) if isinstance(obj,dict) else obj
                  entries=mapping.items() if isinstance(mapping,dict) else ((x['path'],x['content']) for x in mapping)
                  for name,content in entries:
                      rel=safe(name); dest=root/rel; dest.parent.mkdir(parents=True,exist_ok=True)
                      if isinstance(content,dict) and 'base64' in content: dest.write_bytes(base64.b64decode(content['base64']))
                      else: dest.write_text(str(content),encoding='utf-8')
                      written.append(str(rel))
          print('Extracted files:',len(written))
          if len(written)<36: raise SystemExit(f'Only {len(written)} files extracted')
          PY

      - name: Mark Year 5 Mathematics content verified
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          codes=[*[f'AC9M5N{i:02d}' for i in range(1,10)],'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5SP01','AC9M5SP02','AC9M5SP03','AC9M5ST01','AC9M5ST02','AC9M5ST03','AC9M5P01','AC9M5P02']
          p=root/'data/content-verification-status.json'; data=json.loads(p.read_text()); data['reviewedCodes']=sorted(set(data.get('reviewedCodes',[]))|set(codes)); p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          p=root/'ai-index.json'; data=json.loads(p.read_text()); areas=data['content_verification']['verified_learning_areas']
          if 'Year 5 Mathematics' not in areas: areas.insert(areas.index('Year 5 Science') if 'Year 5 Science' in areas else len(areas),'Year 5 Mathematics')
          data['last_updated']='2026-09-09'; p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          p=root/'about.html'; s=p.read_text(); s=s.replace('Year 4 Mathematics, Year 4 Science and Year 5 Science question banks','Year 4 Mathematics, Year 4 Science, Year 5 Mathematics and Year 5 Science question banks'); p.write_text(s)
          p=root/'editorial-standards.html'; s=p.read_text(); row='<tr><th scope="row">Year 5 Mathematics</th><td><span class="info-verified">✓ Content Verified</span></td></tr>'; sci='<tr><th scope="row">Year 5 Science</th><td><span class="info-verified">✓ Content Verified</span></td></tr>'
          if row not in s:
              if sci not in s: raise SystemExit('Year 5 Science verification row not found')
              s=s.replace(sci,row+sci)
          p.write_text(s)
          for fn in ('llms.txt','llms-full.txt'):
              p=root/fn; s=p.read_text(); s=s.replace('Year 4 Mathematics, Year 4 Science and Year 5 Science.','Year 4 Mathematics, Year 4 Science, Year 5 Mathematics and Year 5 Science.'); p.write_text(s)
          print('Reviewed Year 5 Maths codes:',len(codes))
          PY

      - name: Validate all Year 5 Mathematics live banks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          codes=[*[f'AC9M5N{i:02d}' for i in range(1,10)],'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5SP01','AC9M5SP02','AC9M5SP03','AC9M5ST01','AC9M5ST02','AC9M5ST03','AC9M5P01','AC9M5P02']
          def slug(c): return 'ac9m5n10' if c=='AC9M5N010' else c.lower()
          ledger=set(json.loads((root/'data/content-verification-status.json').read_text())['reviewedCodes'])
          miss=[c for c in codes if c not in ledger]
          if miss: raise SystemExit('Ledger missing '+','.join(miss))
          for c in codes:
              for bank,minimum in [('practice',48),('test',16)]:
                  p=root/f'quiz/year-5/math/{slug(c)}/{bank}/questions.js'
                  if not p.exists() or p.stat().st_size<500: raise SystemExit(f'Missing/empty {p}')
                  text=p.read_text(encoding='utf-8')
                  # Accept explicit objects or compact generated arrays, but require expected curriculum code and bank label.
                  if c not in text: raise SystemExit(f'Wrong/missing code in {p}')
                  stems=re.findall(r'"question"\s*:\s*"([^"]+)',text)
                  if stems and len(stems)!=len(set(stems)): raise SystemExit(f'Duplicate explicit stems in {p}')
          ai=json.loads((root/'ai-index.json').read_text())
          if 'Year 5 Mathematics' not in ai['content_verification']['verified_learning_areas']: raise SystemExit('AI verification surface missing Year 5 Mathematics')
          if 'Year 5 Mathematics' not in (root/'editorial-standards.html').read_text(): raise SystemExit('Editorial badge missing')
          print('All Year 5 Mathematics banks + verification surfaces passed')
          PY

      - name: Commit publication to main
        run: |
          rm -f assets/year5-math-research-banks-20260909.part1 assets/year5-math-research-banks-20260909.part2
          rm -f .github/workflows/publish-year5-maths-once.yml
          git config user.name "SkillrHub Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish Year 5 Maths research banks and mark content verified"
          git push origin HEAD:main
