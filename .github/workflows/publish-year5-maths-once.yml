            ['An algorithm sorts numbers into multiples of 4 using the last two digits. Where does 7,316 go?',['YES group','NO group','Cannot decide'],0,'The last two digits are 16, which is divisible by 4.','classification algorithm'],
            ['A student tests only one example and claims every even number is divisible by 4. Which counterexample disproves the claim?',['6','8','12'],0,'6 is even but 6÷4 is not a whole number.','counterexample'],
            ['A spreadsheet formula returns TRUE when MOD(A1,9)=0. What is it identifying?',['multiples of 9','factors of 9 only','prime numbers'],0,'A remainder of zero on division by 9 means the number is a multiple of 9.','digital rule'],
            ['A flowchart asks “digit sum divisible by 9?” If YES, what can also be concluded?',['The number is divisible by 3','The number is divisible by 2','The number is prime'],0,'Every multiple of 9 is also a multiple of 3.','branch inference'],
            ['Which algorithm correctly finds common multiples of 6 and 8 from a list?',['Keep numbers divisible by 6 AND by 8','Keep numbers divisible by 6 OR by 8','Keep numbers that divide 6 and 8'],0,'A common multiple must satisfy both divisibility conditions.','algorithm design'],
            ['A decision table marks 24 as divisible by 2, 3, 4 and 6. Which pattern is supported?',['One number can satisfy several divisibility rules','A number can have only one factor','Divisibility tests are mutually exclusive'],0,'24 has many factors, so several rules can return YES.','pattern reasoning'],
            ['A program repeatedly adds 12 starting from 12. What set is it generating?',['positive multiples of 12','factors of 12','prime numbers'],0,'12,24,36,… are multiples of 12.','generate pattern'],
            ['An algorithm says: if last digit is even, label “divisible by 4”. What is the bug?',['Evenness proves divisibility by 2, not always by 4','The rule should test divisibility by 5','All even numbers are divisible by 4'],0,'Numbers such as 6 and 10 are even but not divisible by 4.','debug algorithm'],
            ['Which test is most efficient for deciding whether 54,732 is divisible by 3?',['Add the digits','List all factors','Repeatedly subtract 3 until zero'],0,'The digit-sum test is a valid efficient divisibility rule for 3.','efficient algorithm'],
            ['A number passes tests for divisibility by 4 and 5. What is the smallest positive common pattern step it must be a multiple of?',['20','9','10'],0,'The LCM of 4 and 5 is 20.','combined decision rules'],
            ['A flowchart outputs “multiple of 10 but not 100” when a number ends in 0 but its last two digits are not 00. Which input fits?',['470','500','375'],0,'470 ends in 0 but not 00; 500 is divisible by 100 and 375 is not divisible by 10.','trace compound rule'],
            ['After testing 30, 60, 90 and 120, a student predicts every multiple of 30 is divisible by 3, 5 and 10. Why is this generalisation justified?',['30 itself contains factors 3, 5 and 10, so every multiple of 30 retains them','Four examples alone always prove any pattern','Multiples can lose factors'],0,'If n=30k, then n is divisible by each factor of 30, including 3, 5 and 10.','generalise algorithm']
          ];
          for(let i=0;i<R.length;i++) unique.push(item('AC9M5N010',33+i,R[i]));
          fs.writeFileSync(n10.file,'"use strict";\nwindow.skillrPracticeQuestions = '+JSON.stringify(unique,null,2)+';\n');
          console.log('AC9M5N010 deduplicated and restored to',unique.length);
          NODE

      - name: Apply Basic Medium Hard Very Hard research bands
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const pending=[...Array.from({length:9},(_,i)=>`AC9M5N${String(i+1).padStart(2,'0')}`),'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5ST02','AC9M5ST03'];
          const slug=c=>c==='AC9M5N010'?'ac9m5n10':c.toLowerCase();
          for(const code of pending){for(const bank of ['practice','test']){
            const file=path.join('quiz/year-5/math',slug(code),bank,'questions.js'), sandbox={window:{},console}; vm.createContext(sandbox); vm.runInContext(fs.readFileSync(file,'utf8'),sandbox);
            const key=bank==='practice'?'skillrPracticeQuestions':'skillrTestQuestions'; const arr=sandbox.window[key]||sandbox.window.quizQuestions;
            if(!Array.isArray(arr)) throw new Error(`${file}: missing array`);
            const size=bank==='practice'?12:4, bands=['basic','medium','hard','very_hard'];
            arr.forEach((q,i)=>{const b=Math.min(3,Math.floor(i/size)); q.difficulty=b+1; q.difficultyTier=bands[b]; q.sequencePriority=b+1; q.bank=bank; q.curriculumCode=code; if(!q.audioPrompt)q.audioPrompt=q.question; if(!q.structuredExplanation)q.structuredExplanation={summary:q.explanation||'',hint:'Use the defining features and check your reasoning.'};});
            fs.writeFileSync(file,'"use strict";\nwindow.'+key+' = '+JSON.stringify(arr,null,2)+';\n');
          }}
          NODE

      - name: Validate all 24 Year 5 Mathematics codes
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const codes=[...Array.from({length:9},(_,i)=>`AC9M5N${String(i+1).padStart(2,'0')}`),'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5SP01','AC9M5SP02','AC9M5SP03','AC9M5ST01','AC9M5ST02','AC9M5ST03','AC9M5P01','AC9M5P02'];
          const pending=new Set([...Array.from({length:9},(_,i)=>`AC9M5N${String(i+1).padStart(2,'0')}`),'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5ST02','AC9M5ST03']);
          const slug=c=>c==='AC9M5N010'?'ac9m5n10':c.toLowerCase();
          function load(code,bank){const f=path.join('quiz/year-5/math',slug(code),bank,'questions.js'),s={window:{},console};vm.createContext(s);vm.runInContext(fs.readFileSync(f,'utf8'),s,{filename:f});const a=bank==='practice'?(s.window.skillrPracticeQuestions||s.window.quizQuestions):(s.window.skillrTestQuestions||s.window.quizQuestions);return [f,a];}
          for(const c of codes){
            const [pf,p]=load(c,'practice'),[tf,t]=load(c,'test');
            if(!Array.isArray(p)||p.length!==48) throw new Error(`${pf}: expected 48, got ${p?.length}`);
            if(!Array.isArray(t)||t.length!==16) throw new Error(`${tf}: expected 16, got ${t?.length}`);
            for(const [f,a] of [[pf,p],[tf,t]]){const stems=a.map(q=>String(q.question||'').replace(/\s+/g,' ').trim().toLowerCase());if(stems.some(x=>!x))throw new Error(`${f}: blank stem`);if(new Set(stems).size!==stems.length)throw new Error(`${f}: duplicate stems`);a.forEach((q,i)=>{if(String(q.curriculumCode||q.curriculum_code||'').toUpperCase()!==c)throw new Error(`${f} #${i+1}: wrong code`);if(!Array.isArray(q.answers)||q.answers.length<3)throw new Error(`${f} #${i+1}: answers`);if(!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.answers.length)throw new Error(`${f} #${i+1}: correct index`);if(!String(q.explanation||'').trim())throw new Error(`${f} #${i+1}: explanation`);});}
            const ps=new Set(p.map(q=>q.question.replace(/\s+/g,' ').trim().toLowerCase())); const overlap=t.filter(q=>ps.has(q.question.replace(/\s+/g,' ').trim().toLowerCase())); if(overlap.length)throw new Error(`${c}: ${overlap.length} exact Practice/Test overlaps`);
            if(pending.has(c)){for(const [a,n] of [[p,12],[t,4]])for(const b of ['basic','medium','hard','very_hard'])if(a.filter(q=>q.difficultyTier===b).length!==n)throw new Error(`${c}: bad ${b} band`);}
            console.log(c,'PASS 48+16 unique');
          }
          console.log('ALL 24 YEAR 5 MATHEMATICS CODES PASS');
          NODE

