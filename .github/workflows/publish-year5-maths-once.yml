            ['Which plan best measures a 2.4 m bookshelf to the nearest centimetre?',['Use a tape measure marked in centimetres','Use a kitchen scale','Use a 1 L jug'],0,'A tape measure with centimetre divisions matches the attribute and precision.','measurement plan'],
