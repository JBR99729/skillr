name: Audit Year 5 Maths authored bank sources
on:
  push:
    paths: ['.github/workflows/publish-year5-maths-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Find strongest authored bank source per code
        run: |
          node <<'NODE'
          const cp=require('child_process'),vm=require('vm');
          const codes=[...Array.from({length:9},(_,i)=>`AC9M5N${String(i+1).padStart(2,'0')}`),'AC9M5N010','AC9M5A01','AC9M5A02','AC9M5M01','AC9M5M02','AC9M5M03','AC9M5M04','AC9M5ST02','AC9M5ST03'];
          const slug=c=>c==='AC9M5N010'?'ac9m5n10':c.toLowerCase();
          const refs=cp.execSync("git for-each-ref --format='%(refname:short)' refs/remotes/origin/agent/qa-year5-* refs/remotes/origin/agent/year5-* refs/remotes/origin/agent/clean-authored-year5-bank-prompts refs/remotes/origin/agent/year-5-maths-curriculum-banks",{encoding:'utf8'}).trim().split(/\n+/).filter(Boolean);
          refs.unshift('origin/main');
          function read(ref,p){try{return cp.execSync(`git show ${ref}:${p}`,{encoding:'utf8',stdio:['ignore','pipe','ignore'],maxBuffer:20*1024*1024})}catch{return null}}
          function evalBank(txt,bank){if(!txt)return null;const sandbox={window:{},console};vm.createContext(sandbox);try{vm.runInContext(txt,sandbox)}catch{return null}return bank==='practice'?(sandbox.window.skillrPracticeQuestions||sandbox.window.quizQuestions):(sandbox.window.skillrTestQuestions||sandbox.window.quizQuestions)}
          for(const c of codes){
            let best=[];
            for(const ref of refs){
              const base=`quiz/year-5/math/${slug(c)}`;
              const p=evalBank(read(ref,`${base}/practice/questions.js`),'practice');
              const t=evalBank(read(ref,`${base}/test/questions.js`),'test');
              if(Array.isArray(p)||Array.isArray(t)) best.push({ref,p:Array.isArray(p)?p.length:0,t:Array.isArray(t)?t.length:0,uniqueP:Array.isArray(p)?new Set(p.map(q=>q.question)).size:0,uniqueT:Array.isArray(t)?new Set(t.map(q=>q.question)).size:0});
            }
            best.sort((a,b)=>(b.p+b.t)-(a.p+a.t)||b.p-a.p);
            console.log('CODE',c,JSON.stringify(best.slice(0,8)));
          }
          NODE