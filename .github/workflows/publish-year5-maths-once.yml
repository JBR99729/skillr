name: Publish Year 5 Maths staged banks once

on:
  push:
    paths:
      - '.github/workflows/publish-year5-maths-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          ps=[Path('assets/year5-math-research-banks-20260909.part1'),Path('assets/year5-math-research-banks-20260909.part2')]
          ts=[p.read_text(encoding='utf-8') for p in ps]
          cs=[''.join(t.split()) for t in ts]
          for i,s in enumerate(cs,1):
              print('PART',i,'len',len(s),'mod4',len(s)%4,'head',repr(s[:12]),'tail',repr(s[-24:]),'eqcount',s.count('='))
          s=''.join(cs)
          print('JOIN len',len(s),'mod4',len(s)%4,'eqcount',s.count('='),'boundary',repr(cs[0][-20:]+cs[1][:20]))
          variants={
            'join':s,
            'join-noeq':s.replace('=',''),
          }
          # Also try repairing a padded first chunk by removing only its terminal padding before join.
          variants['drop-part1-padding']=cs[0].rstrip('=')+cs[1]
          for name,q in variants.items():
              q=q+'='*((-len(q))%4)
              try:
                  b=base64.b64decode(q,validate=False)
                  print(name,'decoded',len(b),'head',b[:12].hex(),'tail',b[-12:].hex())
                  try:
                      d=gzip.decompress(b); print(name,'GZIP OK',len(d),'payload-head',repr(d[:120]))
                  except Exception as e: print(name,'gzip ERR',repr(e))
              except Exception as e: print(name,'base64 ERR',repr(e))
          for slug in ('ac9m5n010','ac9m5n10'):
              print('folder',slug,'exists',Path('quiz/year-5/math',slug).exists())
          PY