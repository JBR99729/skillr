name: Complete Year 5 Mathematics once
on:
  push:
    paths: ['.github/workflows/publish-year5-maths-once.yml']
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}

      - name: Expand research-backed Year 5 Maths practice banks
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const slug=c=>c==='AC9M5N010'?'ac9m5n10':c.toLowerCase();
          const hint={
            AC9M5N01:'Align decimal places and compare from the greatest place value.',
            AC9M5N02:'Use factor pairs, multiples or the most efficient divisibility rule.',
            AC9M5N03:'Make sure the fractions refer to the same whole, then use equivalence or a benchmark.',
            AC9M5N04:'Treat 100% as the whole and connect percent, fraction and decimal forms.',
            AC9M5M01:'Match the attribute and object size to a sensible metric unit and precision.',
            AC9M5M02:'Decide whether the question needs boundary length or square units before calculating.',
            AC9M5M03:'Track am/pm or 24-hour time carefully, especially across noon and midnight.',
            AC9M5M04:'Locate the vertex, baseline and correct protractor scale before reading the angle.',
            AC9M5ST02:'Read the axes and scale first, then support conclusions with values from the graph.',
            AC9M5ST03:'Match the question, data type, collection method, display and conclusion.'
          };
          function load(code,bank){
            const file=path.join('quiz/year-5/math',slug(code),bank,'questions.js');
            const sandbox={window:{},console}; vm.createContext(sandbox); vm.runInContext(fs.readFileSync(file,'utf8'),sandbox,{filename:file});
            const arr=bank==='practice'?(sandbox.window.skillrPracticeQuestions||sandbox.window.quizQuestions):(sandbox.window.skillrTestQuestions||sandbox.window.quizQuestions);
            if(!Array.isArray(arr)) throw new Error(`Cannot load ${file}`); return {file,arr};
          }
          function item(code,i,raw){
            const [question,answers,correct,explanation,skill]=raw;
            return {id:`${slug(code)}-p-${String(i).padStart(3,'0')}`,curriculumCode:code,bank:'practice',skill:skill||'research transfer',printable:true,type:'single',question,audioPrompt:question,answers,correct,explanation,structuredExplanation:{summary:explanation,hint:hint[code]||'Use the defining features and check your reasoning.'},qualitySchema:'production-v1'};
          }
          const A={};

          A.AC9M5N01=[
            ['Four race times are 12.405 s, 12.45 s, 12.054 s and 12.450 s. Which statement is correct?',['12.054 < 12.405 < 12.45 = 12.450','12.405 < 12.054 < 12.450 < 12.45','12.45 < 12.405 < 12.054 < 12.450'],0,'Appending a zero does not change 12.45, so compare 12.450 with the other aligned decimals.','order decimals'],
            ['A number lies between 4.706 and 4.708 and has 7 in the thousandths place. Which number is it?',['4.707','4.770','4.7007'],0,'The only thousandth between 4.706 and 4.708 is 4.707.','locate decimal'],
            ['Which decimal is closest to 6.25?',['6.248','6.205','6.295'],0,'6.248 is 0.002 from 6.25, closer than the other options.','closest decimal'],
            ['A point is halfway between 3.416 and 3.418 on a number line. What is its value?',['3.417','3.4175','3.4165'],0,'The interval is 0.002, so halfway is 0.001 above 3.416: 3.417.','number line'],
            ['Which digit can replace □ so that 8.3□6 > 8.356 but is as small as possible?',['6','5','4'],0,'The tenths match; the hundredths must exceed 5, so the smallest choice is 6.','missing digit'],
            ['A student orders 0.908, 0.89 and 0.9008 as 0.89 < 0.908 < 0.9008. What is the first error?',['0.9008 is less than 0.908','0.89 is greater than 0.908','0.908 equals 0.9008'],0,'Write 0.9080 and 0.9008; at the hundredths place 0 is less than 8, so 0.9008 < 0.908.','error analysis'],
            ['A number line from 5.72 to 5.73 is divided into 20 equal intervals. What is one interval worth?',['0.0005','0.005','0.00005'],0,'The total difference is 0.01; 0.01 ÷ 20 = 0.0005.','number-line scale'],
            ['Which decimal has the same value as 2 + 7/10 + 3/1000?',['2.703','2.073','2.730'],0,'Seven tenths is 0.7 and three thousandths is 0.003, giving 2.703.','expanded notation'],
            ['Three measurements are 1.099 m, 1.101 m and 1.11 m. Which is the median value when ordered?',['1.101 m','1.099 m','1.11 m'],0,'The order is 1.099 < 1.101 < 1.110, so 1.101 is in the middle.','order decimals'],
            ['Which pair is equal?',['7.040 and 7.04','7.004 and 7.04','7.400 and 7.04'],0,'Trailing zeros after the last non-zero decimal digit do not change value.','decimal equality'],
            ['A decimal is greater than 0.499 but less than 0.501. Which could it be?',['0.5004','0.509','0.4905'],0,'0.5004 lies strictly between 0.4990 and 0.5010.','interval reasoning'],
            ['The digit 3 in 5.032 is how many times the value of the digit 3 in 5.0032?',['10 times','100 times','one tenth'],0,'0.03 is ten times 0.003. The second 3 is in the thousandths place.','place-value relation'],
            ['Five cards show 2.305, 2.350, 2.053, 2.503 and 2.035. Which card is second smallest?',['2.053','2.035','2.305'],0,'Ordering gives 2.035, 2.053, 2.305, 2.350, 2.503.','multi-decimal order'],
            ['A number rounds visually near 9.46 on a zoomed number line and is exactly 0.004 greater than 9.456. What is it?',['9.460','9.452','9.496'],0,'9.456 + 0.004 = 9.460, which equals 9.46.','decimal displacement'],
            ['Which statement proves 4.099 < 4.1 without rounding?',['4.1 = 4.100, and 99 thousandths < 100 thousandths','4.099 has more digits','4.099 rounds down'],0,'Writing 4.1 as 4.100 allows a direct place-value comparison.','justify comparison'],
            ['A missing decimal must make 6.708 < □ < 6.71. Which option works?',['6.7095','6.7015','6.7105'],0,'6.7095 is above 6.7080 and below 6.7100.','decimal interval'],
            ['A number line mark is 7 intervals after 1.204. Each interval is 0.0005. What value is marked?',['1.2075','1.211','1.2047'],0,'Seven intervals total 0.0035; 1.204 + 0.0035 = 1.2075.','scaled number line'],
            ['Which list is decreasing?',['3.405, 3.4005, 3.045, 3.0045','3.405, 3.045, 3.4005, 3.0045','3.0045, 3.045, 3.4005, 3.405'],0,'Aligned as four decimal places, each value in the first list is less than the one before it.','order decimals'],
            ['A student claims 10.0205 = 10.205 because zeros after a decimal do not matter. Which response is best?',['Only trailing zeros can be removed without shifting later digits','All decimal zeros can be removed','The two numbers are equal after rounding'],0,'The internal zero holds the tenths place; removing it changes the value.','zero role'],
            ['Two decimals differ only in the thousandths digit: 5.62a and 5.62b. If the first is greater, what must be true?',['a > b','a < b','a = b'],0,'All earlier places match, so the thousandths digits decide the comparison.','generalise comparison'],
            ['A sensor target is 2.500. Which reading is furthest from the target?',['2.489','2.507','2.495'],0,'Distances are 0.011, 0.007 and 0.005 respectively, so 2.489 is furthest.','decimal distance'],
            ['A decimal has 6 ones, 4 hundredths and 9 ten-thousandths. What is the number?',['6.0409','6.409','6.049'],0,'Four hundredths is 0.04 and nine ten-thousandths is 0.0009, giving 6.0409.','place-value construction'],
            ['Which number can be inserted so the order 0.709 < □ < 0.7092 is true?',['0.7091','0.7089','0.7101'],0,'0.7091 is one ten-thousandth above 0.7090 and below 0.7092.','fine interval'],
            ['Three students compare 8.040, 8.004 and 8.04. Which conclusion is correct?',['8.004 < 8.040 = 8.04','8.040 < 8.004 < 8.04','all three are equal'],0,'8.040 and 8.04 are equal; 8.004 has zero hundredths and is smaller.','equality and order']
          ];

          A.AC9M5N02=[
            ['Which number is a common factor of 84 and 126?',['21','18','28'],0,'84 ÷ 21 = 4 and 126 ÷ 21 = 6, so 21 is a factor of both.','common factors'],
            ['A number is divisible by both 6 and 9. Which must also divide it?',['3','12','18'],0,'Any number divisible by 6 and 9 is certainly divisible by 3.','divisibility reasoning'],
            ['Which prime factorisation equals 180?',['2² × 3² × 5','2 × 3 × 30','2³ × 3 × 5'],0,'180 = 18 × 10 = 2² × 3² × 5.','prime factorisation'],
            ['What is the highest common factor of 48 and 72?',['24','12','144'],0,'24 divides both, and no larger common factor divides both numbers.','HCF'],
            ['What is the lowest common multiple of 12 and 18?',['36','6','216'],0,'Multiples first meet at 36: 12×3 and 18×2.','LCM'],
            ['A number has digits 4, 8, 2 and □. What smallest digit can replace □ so the number 482□ is divisible by 9?',['4','5','7'],0,'4+8+2=14; the smallest digit making the sum a multiple of 9 is 4, giving 18.','divisibility rule'],
            ['Which statement about 1 is correct?',['1 is neither prime nor composite','1 is prime','1 is composite'],0,'A prime has exactly two positive factors; 1 has only one.','prime/composite'],
            ['A rectangular array has 96 tiles. Which dimensions show a factor pair?',['8 by 12','7 by 14','9 by 11'],0,'8×12 = 96.','factor pair'],
            ['Two bells ring every 15 minutes and every 20 minutes. If they ring together now, when next together?',['60 minutes','35 minutes','300 minutes'],0,'The LCM of 15 and 20 is 60.','LCM context'],
            ['A teacher has 84 red and 126 blue counters and wants the greatest number of identical packs with none left. How many packs?',['42','21','6'],0,'The HCF of 84 and 126 is 42, so 42 identical packs are possible.','HCF context'],
            ['Which number is divisible by 4 but not by 8?',['316','328','344'],0,'316 ÷4 is whole, but 316 ÷8 is not; 328 and 344 are divisible by 8.','multiple rules'],
            ['A student lists factors of 36 as 1,2,3,4,6,9,12,18,36. What does this show?',['The list is complete','6 should be removed','24 is missing'],0,'These are all factor pairs: 1×36, 2×18, 3×12, 4×9 and 6×6.','factor completeness'],
            ['Which number has exactly three positive factors?',['49','30','17'],0,'49 = 7² has factors 1,7,49.','factor structure'],
            ['If n is a multiple of 18, which statement must be true?',['n is divisible by 9 and 2','n is prime','n is not divisible by 3'],0,'18 contains factors 9 and 2, so every multiple of 18 is divisible by both.','multiple generalisation'],
            ['Which number is divisible by 3 and 4 but not by 5?',['132','120','145'],0,'132 has digit sum 6 and last two digits 32; it does not end in 0 or 5.','combined divisibility'],
            ['A factor tree for 90 ends with 2, 3, 3 and 5. Which product confirms it?',['2 × 3² × 5','2² × 3 × 5','2 × 3 × 5²'],0,'2×9×5 = 90.','factor tree'],
            ['What is the smallest number that is a multiple of 8, 12 and 18?',['72','144','36'],0,'72 is divisible by 8, 12 and 18 and is the least common multiple.','LCM multi-number'],
            ['Two numbers have HCF 6. Which pair could they be?',['18 and 30','12 and 24','14 and 28'],0,'The greatest common factor of 18 and 30 is 6.','inverse HCF'],
            ['A number is divisible by 10 and 9. What is the smallest positive possibility?',['90','45','180'],0,'The LCM of 10 and 9 is 90.','combined rules'],
            ['A student says 2345 is divisible by 3 because it ends in 5. What is the correct test?',['Add its digits; 2+3+4+5=14, so it is not divisible by 3','Check the last digit only','Check the last two digits'],0,'Divisibility by 3 depends on the digit sum, not the final digit.','error analysis'],
            ['Which claim is always true?',['Every factor of a number divides it with remainder 0','Every multiple of a number is smaller than it','Every composite number has exactly four factors'],0,'A factor is defined by exact division with no remainder.','definition reasoning'],
            ['A game awards points on every 6th turn and a bonus every 8th turn. On which earliest turn do both occur?',['24','14','48'],0,'The first common multiple of 6 and 8 is 24.','LCM context'],
            ['Which pair is relatively prime, meaning their HCF is 1?',['8 and 15','12 and 18','14 and 21'],0,'8 and 15 share no factor greater than 1.','HCF reasoning'],
            ['A number is divisible by 6. Which two tests together are sufficient?',['It is divisible by 2 and by 3','It is divisible by 2 and by 5','It is divisible by 3 and by 9'],0,'6 = 2×3, so divisibility by both 2 and 3 guarantees divisibility by 6.','divisibility algorithm']
          ];

          A.AC9M5N03=[
            ['Which fraction is greatest?',['7/8','5/6','11/14'],0,'Using a common denominator or decimals shows 7/8 = 0.875, greater than the others.','compare fractions'],
            ['Which order is correct?',['3/5 < 5/8 < 2/3','5/8 < 3/5 < 2/3','2/3 < 5/8 < 3/5'],0,'Using denominator 120 gives 72/120 < 75/120 < 80/120.','order fractions'],
            ['Which fraction is equivalent to 9/12?',['3/4','6/8 only','both 3/4 and 6/8'],2,'Both 9/12 and 6/8 simplify to 3/4.','equivalence'],
            ['A point is halfway between 1/2 and 3/4 on a number line. What fraction is it?',['5/8','2/3','7/8'],0,'Halfway between 4/8 and 6/8 is 5/8.','fraction number line'],
            ['Which mixed numeral is greater than 2 3/5 but less than 2 3/4?',['2 2/3','2 1/2','2 4/5'],0,'2/3 is between 3/5 and 3/4.','mixed-number comparison'],
            ['A student says 5/9 > 5/7 because 9 is larger. What is wrong?',['With equal numerators, the fraction with the smaller denominator is larger','Larger denominators always make larger fractions','The fractions are equal'],0,'Seven equal parts are larger than nine equal parts, so 5/7 > 5/9.','error analysis'],
            ['Which fraction is closest to 1?',['11/12','7/8','5/6'],0,'11/12 is only 1/12 below 1, a smaller gap than the others.','benchmark fraction'],
            ['Which comparison is true?',['1 5/6 > 1 4/5','1 5/6 < 1 4/5','1 5/6 = 1 4/5'],0,'The wholes match; 5/6 = 25/30 and 4/5 = 24/30.','mixed numbers'],
            ['Four runners completed 2/3, 3/4, 5/6 and 7/9 of a course. Who completed the largest fraction?',['5/6','7/9','3/4'],0,'5/6 is about 0.833, larger than 7/9≈0.778 and 3/4=0.75.','context comparison'],
            ['Which fraction lies between 4/7 and 5/7?',['9/14','3/7','11/14'],0,'4/7 = 8/14 and 5/7 = 10/14, so 9/14 lies between.','fraction interval'],
            ['A fraction equal to 3/4 has denominator 28. What is its numerator?',['21','24','18'],0,'Multiplying 4 by 7 requires multiplying 3 by 7: 21/28.','missing equivalent'],
            ['Which statement about 6/8 and 9/12 is correct?',['They are equal','6/8 is greater','9/12 is greater'],0,'Both simplify to 3/4.','fraction equality'],
            ['Order from least to greatest: 1 1/3, 7/6, 1 1/4.',['7/6, 1 1/4, 1 1/3','1 1/4, 7/6, 1 1/3','7/6, 1 1/3, 1 1/4'],0,'7/6=1 1/6, then 1 1/4, then 1 1/3.','mixed order'],
            ['Which fraction is more than 3/5 but less than 2/3?',['5/8','7/10','1/2'],0,'3/5=0.6, 5/8=0.625 and 2/3≈0.667.','fraction interval'],
            ['A shaded model shows 10 of 15 equal parts. Which fraction with denominator 6 represents the same amount?',['4/6','5/6','3/6'],0,'10/15 simplifies to 2/3, which equals 4/6.','model equivalence'],
            ['Two fractions have denominator 24. One is equivalent to 2/3 and one to 3/4. What are their numerators?',['16 and 18','12 and 18','16 and 20'],0,'2/3=16/24 and 3/4=18/24.','common denominator'],
            ['Which is the strongest reason that 7/10 > 2/3?',['21/30 > 20/30','10 > 3','7 > 2'],0,'Renaming both with denominator 30 compares equal-sized parts.','justify comparison'],
            ['A number line has marks at 0, 1/4, 1/2, 3/4 and 1. Where would 5/8 lie?',['Halfway between 1/2 and 3/4','between 1/4 and 1/2','above 3/4'],0,'1/2=4/8 and 3/4=6/8, so 5/8 is halfway.','number-line reasoning'],
            ['Which mixed numeral equals 13/5?',['2 3/5','3 2/5','2 2/5'],0,'13 ÷5 is 2 remainder 3, giving 2 3/5.','mixed conversion'],
            ['A student places 4/6 to the right of 3/4 on a number line. What correction is needed?',['4/6 = 2/3, so it should be left of 3/4','4/6 is greater because 6 > 4','The placement is correct'],0,'2/3≈0.667 is less than 0.75.','error analysis'],
            ['Which pair has the smaller difference in value?',['5/6 and 4/5','3/4 and 2/3','7/8 and 3/4'],0,'5/6−4/5 = 1/30, smaller than 1/12 or 1/8.','close fractions'],
            ['Three fractions are all greater than 1/2. Which is smallest?',['5/9','4/7','7/12'],0,'5/9≈0.556, 4/7≈0.571, 7/12≈0.583.','multi-comparison'],
            ['A recipe uses 1 2/3 cups in one batch and 1 3/5 cups in another. Which uses more?',['1 2/3 cups','1 3/5 cups','They are equal'],0,'2/3=10/15 and 3/5=9/15, so 1 2/3 is larger.','context mixed numbers'],
            ['Which statement is always valid when comparing fractions with the same positive denominator?',['The larger numerator gives the larger fraction','The larger denominator gives the larger fraction','They are always equal'],0,'With equal-sized parts, more parts means a larger amount.','generalisation']
          ];

          A.AC9M5N04=[
            ['Which is greatest?',['62%','0.6','3/5'],0,'0.6 and 3/5 are both 60%; 62% is greater.','compare percent forms'],
            ['35% of 240 students chose cycling. How many students is that?',['84','72','96'],0,'35% of 240 = 0.35×240 = 84.','percent of amount'],
            ['A tank is 0.72 full. What percentage is filled?',['72%','7.2%','720%'],0,'0.72 = 72 hundredths = 72%.','decimal to percent'],
            ['Which fraction equals 45%?',['9/20','4/5','45/10'],0,'45%=45/100=9/20.','percent to fraction'],
            ['A $80 item is discounted by 25%. What is the discount amount?',['$20','$60','$25'],0,'25% is one quarter; one quarter of $80 is $20.','money percent'],
            ['A hundred-grid has 68 squares shaded. Which decimal matches the shaded part?',['0.68','6.8','0.068'],0,'68 out of 100 is 68/100 = 0.68.','grid equivalence'],
            ['Which statement is true?',['125% is greater than one whole','125% equals 0.125','125% is less than 100%'],0,'100% is one whole, so 125% is 1.25 wholes.','percent whole'],
            ['A class of 40 has 30 students present. What percentage is present?',['75%','70%','80%'],0,'30/40=3/4=75%.','fraction to percent'],
            ['A battery falls from 80% to 55%. By how many percentage points did it fall?',['25 percentage points','31.25 percentage points','135 percentage points'],0,'80−55=25 percentage points.','percentage-point reasoning'],
            ['Which is equivalent to 7%?',['0.07','0.7','7.0'],0,'7%=7/100=0.07.','percent decimal'],
            ['A student says 0.4 = 4%. What is the correction?',['0.4 = 40%','0.4 = 0.4%','0.4 = 400%'],0,'0.4 is forty hundredths, so it is 40%.','error analysis'],
            ['15% of a quantity is 30. What is 5% of the same quantity?',['10','15','6'],0,'5% is one third of 15%, so one third of 30 is 10.','inverse percent reasoning'],
            ['A shop price is $120 and 30% is paid as a deposit. How much remains?',['$84','$36','$90'],0,'30% of 120 is $36; $120−$36=$84.','financial percent'],
            ['Which representation is closest to 83%?',['five-sixths','four-fifths','three-quarters'],0,'5/6≈83.3%, closer to 83% than 80% or 75%.','benchmark percent'],
            ['A survey shows 18 of 24 students prefer option A. What percentage is this?',['75%','72%','80%'],0,'18/24=3/4=75%.','context conversion'],
            ['A container is 65% full, then 20% of the whole container is added. How full is it?',['85%','78%','100%'],0,'The added amount is 20 percentage points of the whole, so 65%+20%=85%.','percent addition context'],
            ['Which amount is 120% of 50?',['60','55','600'],0,'120%=1.2, and 1.2×50=60.','percent over 100'],
            ['A $200 budget has 15% reserved for transport and 35% for food. What percentage remains for other costs?',['50%','150%','60%'],0,'15%+35%=50%, leaving 50%.','budget percent'],
            ['A student shades 0.08 of a hundred-grid and labels it 80%. What should the label be?',['8%','0.8%','80%'],0,'0.08=8/100=8%.','representation error'],
            ['Which pair is equivalent?',['12.5% and 1/8','12.5% and 1/5','12.5% and 0.125%'],0,'1/8=0.125=12.5%.','fraction percent'],
            ['A club has 60 members. If 40% are juniors, how many are not juniors?',['36','24','40'],0,'40% of 60 is 24 juniors, leaving 36.','complement percent'],
            ['A price after a 20% discount is $72. What was 80% of the original price?',['$72','$90','$57.60'],0,'After a 20% discount, the sale price represents 80% of the original.','inverse interpretation'],
            ['Two jars are 3/4 full and 72% full. Which is fuller?',['the 3/4 jar','the 72% jar','they are equal'],0,'3/4=75%, which is greater than 72%.','compare representations'],
            ['Why is saying “50%” incomplete in a practical problem?',['The whole or reference quantity must be known','50% always means 50 objects','Percentages cannot describe parts'],0,'A percentage describes a proportion of a specified whole.','percent meaning']
          ];

          A.AC9M5M01=[
            ['Which measurement is most sensible for the thickness of a credit card?',['about 1 mm','about 1 cm','about 1 m'],0,'A card is very thin, so millimetres give an appropriate scale.','choose metric unit'],
            ['A water bottle holds about 750 ___. Which unit completes the estimate?',['mL','L','kg'],0,'A typical bottle is less than 1 litre, so 750 mL is sensible.','capacity unit'],
            ['Which is a sensible mass for a school backpack with books?',['4 kg','4 g','400 kg'],0,'A few kilograms is realistic for a loaded backpack.','mass estimate'],
            ['A running track is 400 ___. Which unit is appropriate?',['m','cm','km'],0,'A running track is hundreds of metres long.','length unit'],
            ['For measuring the diameter of a small coin accurately, which combination is best?',['millimetres and a ruler with mm markings','kilometres and a map','litres and a jug'],0,'The attribute is short length and the required precision is millimetres.','tool and unit'],
