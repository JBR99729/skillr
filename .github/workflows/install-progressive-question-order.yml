name: Install progressive question ordering

on:
  push:
    branches:
      - main
      - agent/progressive-question-difficulty
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch shared quiz runtime
        run: node scripts/patch_progressive_question_order.mjs
      - name: Audit confidence-tier question quality
        run: node scripts/assign_confidence_question_tiers.mjs --check || true
      - name: Commit runtime patch only
        shell: bash
        run: |
          if git diff --quiet -- quiz/assets/script.js; then
            echo 'No generated runtime changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quiz/assets/script.js
          git commit -m 'apply progressive easy-to-hard question ordering'
          git push origin HEAD:${GITHUB_REF_NAME}
