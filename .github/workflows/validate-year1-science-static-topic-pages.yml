name: Validate Year 1 Science static topic pages

on:
  pull_request:
    paths:
      - 'year1/science/**'
      - 'quiz/year-1/science/**'
      - 'assets/curriculum.css'
      - 'scripts/validate_year1_science_static_topic_pages.mjs'
      - '.github/workflows/validate-year1-science-static-topic-pages.yml'
  push:
    branches: [ main ]
    paths:
      - 'year1/science/**'
      - 'quiz/year-1/science/**'
      - 'assets/curriculum.css'
      - 'scripts/validate_year1_science_static_topic_pages.mjs'
      - '.github/workflows/validate-year1-science-static-topic-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Year 1 Science static topic pages
        run: node scripts/validate_year1_science_static_topic_pages.mjs
