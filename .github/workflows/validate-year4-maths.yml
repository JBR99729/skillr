name: Validate Year 4 Maths content

on:
  push:
    branches: [main]
    paths:
      - "assets/year4-maths-*"
      - "assets/curriculum-strand-coverage.js"
      - "pwa-register.js"
      - "worksheets/year4/maths/teacher-slides/live.html"
      - "year4/maths/**/index.html"
      - "docs/skillr-long-life-curriculum-content-standard.md"
      - ".github/workflows/validate-year4-maths.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/year4-maths-data-base.js
          node --check assets/year4-maths-data-n1.js
          node --check assets/year4-maths-data-n2.js
          node --check assets/year4-maths-data-n3.js
          node --check assets/year4-maths-data-a.js
          node --check assets/year4-maths-data-m1.js
          node --check assets/year4-maths-data-m2.js
          node --check assets/year4-maths-data-sp.js
          node --check assets/year4-maths-data-st.js
          node --check assets/year4-maths-data-p.js
          node --check assets/year4-maths-render.js
          node --check assets/year4-maths-practice-quick-read.js
          node --check assets/year4-maths-worksheet-page.js
          node --check assets/year4-maths-slide-strands.js
          node --check assets/curriculum-strand-coverage.js
          node --check pwa-register.js
      - name: Validate unit quality, worksheets and elaboration coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          global.window = {};
          require('./assets/year4-maths-data-base.js');
          require('./assets/year4-maths-data-n1.js');
          require('./assets/year4-maths-data-n2.js');
          require('./assets/year4-maths-data-n3.js');
          require('./assets/year4-maths-data-a.js');
          require('./assets/year4-maths-data-m1.js');
          require('./assets/year4-maths-data-m2.js');
          require('./assets/year4-maths-data-sp.js');
          require('./assets/year4-maths-data-st.js');
          require('./assets/year4-maths-data-p.js');

          const units = window.SkillrYear4MathsData || {};
          const order = window.SkillrYear4MathsOrder || [];
          const expected = 23;
          const codes = Object.keys(units);
          let elaborationTotal = 0;

          if (codes.length !== expected) throw new Error(`Expected ${expected} Year 4 Maths units, found ${codes.length}`);
          if (order.length !== expected) throw new Error(`Order has ${order.length} codes instead of ${expected}`);
          if (new Set(order).size !== expected) throw new Error('Duplicate curriculum code in order');

          for (const code of order) {
            const unit = units[code];
            if (!unit) throw new Error(`Missing ${code}`);
            for (const field of ['slug','title','subtitle','desc','routine','learn','model_title','model_html','apply_title','apply_html','hero_visual']) {
              if (!unit[field]) throw new Error(`${code}: missing ${field}`);
            }
            if (!Array.isArray(unit.activities) || unit.activities.length < 3) throw new Error(`${code}: fewer than 3 activities`);
            if (!Array.isArray(unit.mistakes) || unit.mistakes.length < 3) throw new Error(`${code}: fewer than 3 misconceptions`);
            if (!Array.isArray(unit.quick) || unit.quick.length < 4) throw new Error(`${code}: insufficient Quick Check questions`);
            if (!Array.isArray(unit.mastery) || unit.mastery.length < 4) throw new Error(`${code}: insufficient mastery criteria`);

            const topicPath = path.join('year4','maths',unit.slug,'index.html');
            if (!fs.existsSync(topicPath)) throw new Error(`${code}: topic page not found at ${topicPath}`);
            const topicHtml = fs.readFileSync(topicPath, 'utf8');
            if (!topicHtml.includes('Curriculum coverage and elaborations')) throw new Error(`${code}: curriculum elaboration section missing`);
            const elaborations = [...topicHtml.matchAll(/<strong>E\d+:<\/strong>/gi)];
            if (!elaborations.length) throw new Error(`${code}: no curriculum elaborations found in topic page`);
            elaborationTotal += elaborations.length;

            const questions = unit.worksheet || [];
            const core = questions.filter((question) => !question.enrichment);
            const enrichment = questions.filter((question) => question.enrichment);
            if (core.length !== 8 || enrichment.length !== 2) {
              throw new Error(`${code}: expected 8 core and 2 enrichment, found ${core.length} and ${enrichment.length}`);
            }

            const types = new Set(core.map((question) => question.type));
            for (const requiredType of ['single','fill-blank','text','match']) {
              if (!types.has(requiredType)) throw new Error(`${code}: core worksheet missing ${requiredType}`);
            }

            for (const [index, question] of questions.entries()) {
              if (!question.question || !question.type) throw new Error(`${code} Q${index + 1}: missing question or type`);
              if (question.type === 'single') {
                if (!Array.isArray(question.answers) || question.answers.length !== 4) throw new Error(`${code} Q${index + 1}: expected 4 answer options`);
                if (new Set(question.answers).size !== question.answers.length) throw new Error(`${code} Q${index + 1}: duplicate answer option`);
              }
              if (question.type === 'match') {
                if (!Array.isArray(question.matchLeft) || !Array.isArray(question.matchRight)) throw new Error(`${code} Q${index + 1}: incomplete matching data`);
                if (question.matchLeft.length !== question.matchRight.length) throw new Error(`${code} Q${index + 1}: matching columns have different lengths`);
                if (new Set(question.matchLeft).size !== question.matchLeft.length) throw new Error(`${code} Q${index + 1}: duplicate left matching item`);
                if (new Set(question.matchRight).size !== question.matchRight.length) throw new Error(`${code} Q${index + 1}: duplicate right matching item`);
              }
              if (question.type === 'fill-blank' && !String(question.template || '').includes('{{blank}}')) {
                throw new Error(`${code} Q${index + 1}: fill-blank question has no blank marker`);
              }
            }
          }

          if (elaborationTotal < expected) throw new Error(`Only ${elaborationTotal} elaborations found across ${expected} units`);
          console.log(`Year 4 Maths content validation passed with ${elaborationTotal} curriculum elaborations preserved for teaching coverage.`);
          NODE
      - name: Confirm additive strand, worldwide and multi-slide wiring
        run: |
          grep -q "year4-maths-data-base.js" pwa-register.js
          grep -q "year4-maths-render.js" pwa-register.js
          grep -q "year4-maths-practice-quick-read.js" pwa-register.js
          grep -q "year4-maths-worksheet-page.js" pwa-register.js
          grep -q "curriculum-strand-coverage.js" pwa-register.js
          grep -q "year4-maths-slide-strands.js" worksheets/year4/maths/teacher-slides/live.html
          grep -q "Year 4 Maths" worksheets/year4/maths/teacher-slides/live.html
          grep -q "Worldwide audience" docs/skillr-long-life-curriculum-content-standard.md
          grep -q "Additive improvement" docs/skillr-long-life-curriculum-content-standard.md
