name: Audit F-10 revision visual gaps
on: push
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - run: pip install beautifulsoup4
      - name: Audit useful visual opportunities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re
          raw=Path('assets/f10-revision-cards-data.js').read_text()
          data=json.loads(raw.split('=',1)[1].rsplit(';',1)[0])
          out=[]
          selectors=['figure','svg','.diagram','.visual','.model','.number-line','.array','.bar-model','.graph','.table-wrap','table','.process','.cycle','.flow']
          for code,d in data.items():
              if d['subject'] not in ('maths','science') or d.get('visualSelector'): continue
              p=Path(d['topicPath'].strip('/'))/'index.html'
              if not p.exists(): continue
              soup=BeautifulSoup(p.read_text(errors='ignore'),'html.parser')
              found=[]
              for sel in selectors:
                  els=soup.select(sel)
                  if els: found.append({'selector':sel,'count':len(els)})
              # classify topics where a visual is pedagogically high value even if none exists yet
              text=(d.get('title','')+' '+d.get('remember','')+' '+d.get('example','')).lower()
              high=bool(re.search(r'fraction|place value|number line|shape|angle|area|perimeter|volume|measurement|graph|coordinate|transformation|symmetr|probab|data|array|multipli|divis|pattern|cycle|system|cell|atom|wave|force|energy|circuit|reaction|earth|space|ecosystem|food web|particle|genetic|mitosis|meiosis|carbon|rock|plate tectonic|body',text))
              out.append({'code':code,'year':d['year'],'subject':d['subject'],'title':d['title'],'topicPath':d['topicPath'],'existingCandidates':found,'highValue':high})
          Path('reports/f10-revision-visual-gap-audit.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('visual gaps',len(out),'high value',sum(x['highValue'] for x in out),'hidden candidates',sum(bool(x['existingCandidates']) for x in out))
          print(json.dumps([x for x in out if x['existingCandidates']][:40],indent=2,ensure_ascii=False))
          PY
      - name: Commit audit
        run: |
          rm .github/workflows/audit-f10-revision-visual-gaps.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/f10-revision-visual-gap-audit.json .github/workflows/audit-f10-revision-visual-gaps.yml
          git commit -m 'content: audit F-10 revision visual opportunities'
          git push origin HEAD:${{ github.ref_name }}
