name: Publish Release 10 Classroom View and curriculum mapping

on:
  push:
    branches: ['content/release-10-classroom-curriculum']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/release-10-classroom-curriculum
          fetch-depth: 0
      - name: Add Release 10.0 to Updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('updates.html')
          h = p.read_text()
          h = h.replace(
              'Follow SkillrHub updates for Australian Curriculum-aligned Maths, Science and English question banks, topic pages, practice, tests and worksheets.',
              'Follow SkillrHub updates for Australian Curriculum teaching resources, Classroom View, curriculum mapping, practice, tests and worksheets.'
          )
          h = h.replace(
              'Release notes for SkillrHub curriculum-aligned content and learning-experience improvements.',
              'Release notes for SkillrHub Australian Curriculum teaching resources, Classroom View, curriculum mapping, practice and tests.'
          )
          h = h.replace(
              '"description":"SkillrHub release notes for Australian Curriculum question banks, topic pages, practice, tests and worksheets.","inLanguage":"en-AU","dateModified":"2026-08-26"',
              '"description":"SkillrHub release notes for Australian Curriculum teaching resources, Classroom View, curriculum mapping, practice, tests and worksheets.","inLanguage":"en-AU","dateModified":"2026-08-29"'
          )
          marker = '        <div class="info-timeline">\n'
          if marker not in h:
              raise SystemExit('Updates timeline marker not found')
          if 'Release 10.0' in h:
              raise SystemExit('Release 10.0 already exists')
          release = '''          <article class="info-update"><div class="info-date"><time datetime="2026-08-29" title="29 Aug 2026">Release 10.0</time></div><div><h2>Classroom View and curriculum mapping expanded across F–10</h2><ul><li><strong>Classroom View</strong> is now a projection-ready Australian Curriculum teaching resource for interactive whiteboards, projectors and shared classroom screens, with Topic Guide, Practice and Test links kept together.</li><li>Related Classroom Views now connect nearby curriculum topics so teachers can move between prerequisite, current and extension concepts without breaking the lesson flow.</li><li>All 676 canonical Foundation–Year 10 Maths, English and Science topic pages now include curriculum mapping for the Australian Curriculum plus equivalent Victorian Curriculum, NSW, USA, Ontario, England and India references.</li><li>Try Classroom View: <a href="/year3/maths/ac9m3m04-the-relationship-between-the-hours-and-minutes-on-analog-and/teacher-slides/">Year 3 Maths — telling time</a>, <a href="/year8/english/ac9e8ly05-comprehension-strategies-such-as-visualising-predicting/teacher-slides/">Year 8 English — comprehension</a>, or <a href="/year10/science/ac9s10h01-scientific-validation-peer-review-evidence/teacher-slides/">Year 10 Science — scientific validation</a>.</li></ul></div></article>\n\n'''
          h = h.replace(marker, marker + release, 1)
          p.write_text(h)
          PY
      - name: Validate release note
        run: |
          grep -q 'Release 10.0' updates.html
          grep -q 'Classroom View and curriculum mapping expanded across F–10' updates.html
          grep -q 'All 676 canonical Foundation–Year 10 Maths, English and Science topic pages' updates.html
          grep -q 'year3/maths/ac9m3m04-the-relationship-between-the-hours-and-minutes-on-analog-and/teacher-slides/' updates.html
          grep -q 'year8/english/ac9e8ly05-comprehension-strategies-such-as-visualising-predicting/teacher-slides/' updates.html
          grep -q 'year10/science/ac9s10h01-scientific-validation-peer-review-evidence/teacher-slides/' updates.html
          test -f year3/maths/ac9m3m04-the-relationship-between-the-hours-and-minutes-on-analog-and/teacher-slides/index.html
          test -f year8/english/ac9e8ly05-comprehension-strategies-such-as-visualising-predicting/teacher-slides/index.html
          test -f year10/science/ac9s10h01-scientific-validation-peer-review-evidence/teacher-slides/index.html
          grep -q 'dateModified":"2026-08-29' updates.html
          git diff --check
      - name: Commit release note
        run: |
          rm .github/workflows/publish-release-10-classroom-curriculum.yml
          git add updates.html .github/workflows/publish-release-10-classroom-curriculum.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Release 10 Classroom View update'
          git push origin HEAD:content/release-10-classroom-curriculum
