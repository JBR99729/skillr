name: Author Year 9 Maths P01-P03 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-p01-p03-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Maths probability homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9P01',title:'Compound probability and tree diagrams',guide:'/year9/maths/ac9m9p01-list-all-outcomes-for-compound-events-both-with-and-without/',intro:'List all outcomes for compound events with and without replacement, use organised lists, tables and tree diagrams, and calculate probabilities by multiplying along branches and adding suitable outcomes.',short:['List all outcomes when a coin is tossed and a six-sided die is rolled.','A spinner has red, blue and green. It is spun twice. How many ordered outcomes are possible?','What does “with replacement” mean in a probability experiment?','What does “without replacement” mean?','Why does probability change on the second draw when an item is not replaced?','Draw the first two levels of a tree diagram for tossing two coins.','In a tree diagram, what operation is usually used along a branch pathway?','A bag has 3 red and 2 blue counters. What is P(red on the first draw)?','Two fair coins are tossed. Find P(two heads).','Correct this error: “P(red then blue) = P(red) + P(blue).”'],long:['A bag contains 4 red and 6 blue counters. One counter is drawn, replaced, then another is drawn. Draw a tree diagram and find P(two red).','The same bag has no replacement after the first draw. Draw a tree diagram and find P(red then blue).','Compare the probability of drawing two red counters with replacement and without replacement. Explain why the answers differ.','A cafe offers 3 drink sizes and 4 flavours. Use a table or tree diagram to list all possible orders.','A student chooses one shirt from 5 shirts and one pair of shoes from 3 pairs. Use multiplication to find the number of possible outfits and explain the method.','A family has three children. List the possible birth-order outcomes for boy/girl and find P(exactly two girls).','A spinner numbered 1 to 4 is spun twice. Find the probability that the total is 5. Show the sample space.','Create a compound probability problem involving cards, counters or spinners and solve it using a tree diagram.','Explain when an organised list is enough and when a tree diagram is more useful.','Write a full worked response for a compound event, including sample space, tree diagram reasoning, probability calculation and interpretation.'],task:'Design a fair compound chance game using coins, dice, cards, counters or spinners. List the sample space, calculate at least two probabilities, and explain whether the game is fair.'},
            {code:'AC9M9P02',title:'Relative frequency, Venn diagrams and simulation',guide:'/year9/maths/ac9m9p02-calculate-relative-frequencies-from-given-or-collected-data-to/',intro:'Calculate relative frequencies from data, use them to estimate probabilities, represent overlapping events with Venn diagrams, and compare simulations with theoretical expectations.',short:['What is relative frequency?','A coin lands heads 27 times in 50 tosses. Find the relative frequency of heads.','How can relative frequency estimate probability?','Why can relative frequency change as more trials are added?','What does the overlap in a Venn diagram represent?','In a class of 30 students, 18 play sport and 12 play music. What extra information is needed to find how many do both?','What does P(A or B) mean in a Venn diagram context?','What does P(A and B) mean?','Give one advantage of using simulation in probability.','Correct this misconception: “Relative frequency must equal theoretical probability exactly.”'],long:['A student rolls a die 60 times and gets 14 sixes. Calculate the relative frequency of rolling a six and compare it to the theoretical probability.','A survey of 40 students shows 22 like maths, 18 like science and 10 like both. Draw or describe a Venn diagram and find how many like maths or science.','Use a two-way table or Venn diagram to represent students who play netball, soccer, both or neither. Explain each region.','Explain why a simulation with 20 trials may give a less stable estimate than a simulation with 2000 trials.','A spinner is believed to be unfair. Design an experiment using relative frequency to test the claim.','Compare theoretical probability, experimental probability and relative frequency using one example.','A weather app says there is a 30% chance of rain. Explain why it can rain tomorrow without the app being wrong.','Create a Venn diagram problem involving two overlapping events and solve for the probability of one combined event.','Use collected or invented data to calculate relative frequency and make a cautious prediction.','Write a full response explaining how Venn diagrams and relative frequency can work together to analyse a chance situation.'],task:'Collect or invent a small data set for a two-event situation, such as students’ hobbies, transport choices or app usage. Represent it with a Venn diagram and use relative frequency to estimate one probability.'},
            {code:'AC9M9P03',title:'Simulations and repeated chance experiments',guide:'/year9/maths/ac9m9p03-design-and-conduct-repeated-chance-experiments-and-simulations/',intro:'Design and conduct repeated chance experiments and simulations, record results, compare experimental and theoretical probabilities, and explain the effect of sample size.',short:['What is a chance experiment?','What is a simulation in probability?','Why are repeated trials useful?','Give one example of using a random number generator to simulate an event.','What is the difference between experimental probability and theoretical probability?','Why might 10 trials give a misleading result?','What information should be recorded during a simulation?','How can technology make simulations faster?','What does it mean for results to stabilise over many trials?','Correct this error: “If the theoretical probability is 1/2, exactly half the trials must succeed.”'],long:['Design a simulation for flipping two coins and finding the probability of exactly one head. Include method, trial count and recording table.','A basketballer normally scores about 70% of free throws. Explain how to simulate 20 free throws using random digits.','Run a described simulation in theory: if 63 successes occur in 100 trials, calculate the experimental probability and compare it with 0.60.','Explain how increasing the number of trials can make experimental probability closer to theoretical probability.','Create a simulation for a game where a player wins if a die roll is 5 or 6. Predict and interpret results.','Evaluate a student’s conclusion after only 8 trials of a simulation. What should they do next?','Compare a physical experiment using dice with a digital simulation. Include advantages and limitations of each.','Design a repeated chance experiment to test whether a spinner is fair. Include data collection and decision criteria.','Use a table to show simulated results in batches of 20 trials and describe how relative frequency changes.','Write a full investigation plan for a probability simulation, including aim, model, assumptions, number of trials, table and conclusion.'],task:'Use a spreadsheet, calculator random number generator or physical materials to design a simulation for a real-life chance situation. Explain the model, run or outline repeated trials, and compare results with theoretical probability if known.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct probability language, and interpret answers in context.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            fs.writeFileSync(path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html'), page(p));
          }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9p01/homework/index.html quiz/year-9/math/ac9m9p02/homework/index.html quiz/year-9/math/ac9m9p03/homework/index.html
          git commit -m "Author Year 9 Maths P01-P03 homework"
          git push
