name: Run sitemap cleanup 20260829

on:
  push:
    branches: ['seo/fresh-google-sitemap-20260829']

permissions:
  contents: write

concurrency:
  group: sitemap-cleanup-20260829
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/fresh-google-sitemap-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate and curate sitemaps
        run: |
          # Pre-curate the human page so the search index sees the same source on every pass.
          python3 scripts/tidy_sitemap_html.py
          python3 scripts/generate_sitemap.py
          python3 scripts/prepare_google_sitemap.py
          python3 scripts/tidy_sitemap_html.py
      - name: Validate sitemap quality
        run: |
          python3 scripts/validate_sitemap_index_quality.py
          python3 scripts/validate_google_sitemap_submission.py
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = ['sitemap.xml'] + sorted(glob.glob('sitemap-*.xml'))
          for filename in files:
              ET.parse(filename)
          print(f'Validated {len(files)} sitemap XML files')
          PY
      - name: Verify deterministic rebuild
        run: |
          git diff > /tmp/first.diff
          python3 scripts/tidy_sitemap_html.py
          python3 scripts/generate_sitemap.py
          python3 scripts/prepare_google_sitemap.py
          python3 scripts/tidy_sitemap_html.py
          python3 scripts/validate_sitemap_index_quality.py
          python3 scripts/validate_google_sitemap_submission.py
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
      - name: Check scope and whitespace
        run: |
          git diff --check
          bad=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              sitemap.xml|sitemap-*.xml|sitemap.html|assets/site-search-index.json) ;;
              *) echo "Unexpected generated change: $file"; bad=1 ;;
            esac
          done < <(git diff --name-only)
          exit "$bad"
      - name: Commit generated cleanup
        run: |
          rm .github/workflows/run-sitemap-cleanup-20260829.yml
          git add sitemap.xml sitemap-*.xml sitemap.html assets/site-search-index.json .github/workflows/run-sitemap-cleanup-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild clean Search Console sitemaps'
          git push origin HEAD:seo/fresh-google-sitemap-20260829
