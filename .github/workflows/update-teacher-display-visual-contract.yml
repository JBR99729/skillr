name: Update Teacher Display visual contract

on:
  push:
    branches:
      - fix/remove-generic-teacher-display-icons

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update obsolete filler-SVG validator contract
        run: node scripts/update_teacher_display_visual_contract.mjs

      - name: Verify filler cleanup remains complete
        run: node scripts/remove_generic_teacher_display_icons.mjs

      - name: Validate Foundation Maths
        run: node scripts/validate_foundation_maths_static_topic_pages.mjs
      - name: Validate Foundation Science
        run: node scripts/validate_foundation_science_static_topic_pages.mjs
      - name: Validate Year 1 Maths
        run: node scripts/validate_year1_maths_static_topic_pages.mjs
      - name: Validate Year 1 Science
        run: node scripts/validate_year1_science_static_topic_pages.mjs
      - name: Validate Year 2 Maths
        run: node scripts/validate_year2_maths_static_topic_pages.mjs
      - name: Validate Year 2 Science
        run: node scripts/validate_year2_science_static_topic_pages.mjs
      - name: Validate Year 3 Maths
        run: node scripts/validate_year3_maths_static_topic_pages.mjs
      - name: Validate Year 3 Science
        run: node scripts/validate_year3_science_static_topic_pages.mjs
      - name: Validate Year 4 Maths
        run: node scripts/validate_year4_maths_static_topic_pages.mjs
      - name: Validate Year 4 Science
        run: node scripts/validate_year4_science_static_topic_pages.mjs

      - name: Audit static Teacher Slides
        run: node scripts/audit_static_teacher_slides.mjs
      - name: Validate static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Validate F-10 topic layout
        run: node scripts/validate_f10_topic_layout_contract.mjs
      - name: Audit static curriculum site
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics

      - name: Commit validator contract update
        shell: bash
        run: |
          rm -f .github/workflows/update-teacher-display-visual-contract.yml scripts/update_teacher_display_visual_contract.mjs
          git add scripts .github/workflows/update-teacher-display-visual-contract.yml
          if git diff --cached --quiet; then
            echo "No validator changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce meaningful-or-no-visual Teacher Displays"
          git push origin HEAD:fix/remove-generic-teacher-display-icons
