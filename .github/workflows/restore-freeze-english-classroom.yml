name: Restore and freeze Foundation and Year 1 Classroom Views

on:
  push:
    branches:
      - fix/freeze-foundation-year1-classroom
    paths:
      - '.github/workflows/restore-freeze-english-classroom.yml'
      - 'scripts/rebuild_foundation_english_student_facing.mjs'
      - 'scripts/rebuild_year1_english_static_student_facing.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Classroom Views to pre-rewrite state
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_BEFORE=499c8a75ccf3f978892a2e74dfbaf89d485bf650
          YEAR1_BEFORE=5636b201f2d592d9f830ecae577da4745ba62b92

          git ls-tree -r --name-only HEAD foundation/english | grep '/teacher-slides/' | while read -r file; do
            git rm -f --ignore-unmatch -- "$file" >/dev/null || true
          done
          git ls-tree -r --name-only "$FOUNDATION_BEFORE" foundation/english | grep '/teacher-slides/' | while read -r file; do
            git checkout "$FOUNDATION_BEFORE" -- "$file"
          done

          git ls-tree -r --name-only HEAD year1/english | grep '/teacher-slides/' | while read -r file; do
            git rm -f --ignore-unmatch -- "$file" >/dev/null || true
          done
          git ls-tree -r --name-only "$YEAR1_BEFORE" year1/english | grep '/teacher-slides/' | while read -r file; do
            git checkout "$YEAR1_BEFORE" -- "$file"
          done

          git status --short
      - name: Commit restored Classroom Views
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No classroom changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundation/english year1/english
          git commit -m 'Restore Foundation and Year 1 Classroom Views'
          git push origin HEAD:fix/freeze-foundation-year1-classroom
