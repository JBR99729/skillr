name: Inspect public TpT inventory payload
on:
  push:
    branches: [sync/tpt-missing-20261119]
    paths: ['.github/workflows/tpt-missing-sync-20261119.yml']
permissions: { contents: read }
jobs:
  inspect-store:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect product listing page payload encoding
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          for page in [1,2,35]:
            req=urllib.request.Request('https://www.teacherspayteachers.com/store/skillrhub?page='+str(page),headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'})
            raw=urllib.request.urlopen(req,timeout=20).read(2000000).decode('utf-8','replace')
            print('PAGE',page,'CHARS',len(raw))
            for term in ['18369585','18402013','Product/','\\u002FProduct','/Product','Year-4-Maths-Term','__next','__NEXT_DATA__','692','productId','tptProductId']:
              k=raw.find(term)
              print('TERM',repr(term),'index',k,'sample',repr(raw[max(0,k-100):k+230]) if k>=0 else '')
            print('html_unescape_product_URLs',len(set(re.findall(r'/Product/[^"<>\\ ]+?-(\\d{7,10})',html.unescape(raw)))))
          PY
