name: Verify published TpT product pages on SkillrHub
on:
  push:
    branches: [sync/tpt-missing-20261119]
    paths:
      - '.github/workflows/tpt-missing-sync-20261119.yml'
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production homepage, catalogue, and three new product routes
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          checks=[
              ("https://skillrhub.com/","SkillrHub"),
              ("https://skillrhub.com/products/","Browse resource folders"),
              ("https://skillrhub.com/products/tpt-18404544/","139 Slides"),
              ("https://skillrhub.com/products/tpt-18402013/","131 Slides"),
              ("https://skillrhub.com/products/tpt-18369585/","Year 4 Maths Term 2 Worksheets Bundle")
          ]
          for url,term in checks:
              req=Request(url+"?tpt_sync_qa=20261119",headers={'User-Agent':'Mozilla/5.0 (compatible; SkillrHubReleaseQA/1.0)', 'Cache-Control':'no-cache'})
              with urlopen(req,timeout=25) as resp:
                  body=resp.read().decode('utf-8','replace')
                  assert resp.status==200,(url,resp.status)
                  assert term in body,(url,'missing text',term)
                  print("LIVE_OK",resp.status,url,'bytes',len(body),'match',term)
          print('PASS: 5 URLs verified live; production delivery confirmed')
          PY
