name: Inspect public TpT listing structure
on:
  push:
    branches: [sync/tpt-missing-20261119]
    paths: ['.github/workflows/tpt-missing-sync-20261119.yml']
permissions: { contents: read }
jobs:
  inspect-store:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python3 -m pip install -q beautifulsoup4
      - name: Inspect two listing rows on both pages
        run: |
          python3 - <<'PY'
          import urllib.request,re
          from bs4 import BeautifulSoup
          for page in [1,2,35]:
            url='https://www.teacherspayteachers.com/store/skillrhub?page='+str(page)
            raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'}),timeout=25).read(2000000).decode('utf-8','replace')
            soup=BeautifulSoup(raw,'html.parser')
            rows=soup.select('[data-testid="ProductRow"]')
            print('page',page,'rows',len(rows),'row ids',[r.get('id') for r in rows[:5]])
            for row in rows[:1]:
              print('ROW_HTML',str(row)[:7500])
              print('ROW_TEXT',row.get_text(' ',strip=True)[:2000])
            print('page footer',soup.get_text(' ',strip=True)[-750:])
          PY
