name: Capture full public TpT store for deduplicated import
on:
  push:
    branches: [sync/tpt-missing-20261119]
    paths:
      - '.github/workflows/tpt-missing-sync-20261119.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tpt-store-scan-20261119
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/tpt-missing-20261119
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -q beautifulsoup4
      - name: Capture every public listing with pagination and ID validation
        run: python3 scripts/capture_tpt_store_20261119.py
      - name: Commit read-only snapshot for review
        env:
          BRANCH: sync/tpt-missing-20261119
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tpt-observed-store-20261119.json docs/qa/2026-11-19-tpt-scan.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture 19 Nov 2026 verified public TpT listings for safe catalogue sync'
          node scripts/check_release_integrity.mjs "$base" HEAD
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git push origin "HEAD:$BRANCH"
