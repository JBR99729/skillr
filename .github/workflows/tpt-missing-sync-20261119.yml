name: Import verified TpT products into SkillrHub resource sections
on:
  push:
    branches: [sync/tpt-missing-20261119]
    paths:
      - '.github/workflows/tpt-missing-sync-20261119.yml'
      - 'scripts/import_tpt_missing_20261119.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tpt-store-import-20261119
  cancel-in-progress: false
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/tpt-missing-20261119
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import only 47 missing IDs and place by year, subject, format and exact topic
        run: python3 scripts/import_tpt_missing_20261119.py
      - name: Normalise linked page copy without changing authored teaching content
        run: python3 scripts/normalize_resource_messaging.py
      - name: Validate no duplicates, pages, topic links and discovery
        run: |
          python3 scripts/validate_tpt_product_sync.py
          python3 scripts/validate_discovery_navigation.py
          python3 scripts/normalize_resource_messaging.py --check
          node scripts/audit_search_ai_integrity.mjs
          git diff --check
      - name: Save verified result without changing unrelated files
        env:
          BRANCH: sync/tpt-missing-20261119
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' data/print-and-go-products.json data/tpt-active-product-inventory.json assets/site-search-index.json ai-index.json sitemap-site.xml docs/qa/2026-11-19-tpt-import.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Add 47 missing verified TpT listings to existing SkillrHub resource sections'
          node scripts/check_release_integrity.mjs "$base" HEAD
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git push origin "HEAD:$BRANCH"
