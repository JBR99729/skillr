name: Materialize Year 7 Maths static Learn pages

on:
  push:
    branches:
      - fix/year7-maths-static-learn-content
    paths:
      - scripts/materialize_year7_maths_static_learn.mjs
      - .github/workflows/materialize-year7-maths-static-learn.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year7-maths-static-learn-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build rich static Learn pages
        run: node scripts/materialize_year7_maths_static_learn.mjs
      - name: Verify representative pages
        run: |
          grep -q "Equivalent Rational Numbers" year7/maths/ac9m7n04-find-equivalent-representations-of-rational-numbers-and/index.html
          grep -q "10 important problems to solve" year7/maths/ac9m7n04-find-equivalent-representations-of-rational-numbers-and/index.html
          grep -q "tmv2-instructional-svg" year7/maths/ac9m7a04-relationships-between-variables-represented-in-graphs-of/index.html
          ! grep -Rqi "Expanded question banks" year7/maths/*/index.html
          ! grep -Rqi "This unit helps students build a clear, usable understanding of" year7/maths/*/index.html
      - name: Commit static pages only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year7/maths/*/index.html
          git rm scripts/materialize_year7_maths_static_learn.mjs .github/workflows/materialize-year7-maths-static-learn.yml
          git commit -m "Materialize rich Year 7 Maths Learn pages"
          git push origin HEAD:fix/year7-maths-static-learn-content
