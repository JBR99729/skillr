name: Audit search and AI integrity

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap*.xml'
      - 'scripts/audit_search_ai_integrity.mjs'
      - 'scripts/geo-query-planner.mjs'
      - 'scripts/geo-chatgpt-scorecard.mjs'
      - 'data/geo-chatgpt-neutral-prompts.json'
      - 'llms.txt'
      - 'scripts/tests/geo-answer-map.test.mjs'
      - 'data/geo-bing-theme-evidence-20260928.json'
      - 'scripts/audit_internal_links.py'
      - 'data/print-and-go-products.json'
      - 'scripts/audit_product_guide_links.py'
      - 'assets/print-and-go-search.js'
      - 'scripts/build-product-pages.cjs'
      - 'scripts/lib/product-guide-links.cjs'
      - 'assets/resource-links.js'
      - 'assets/seo-routing.js'
      - 'scripts/tests/test_seo_routing_policy.mjs'
      - 'pwa-register.js'
      - 'quiz/assets/script.js'
      - 'quiz/assets/script-runtime-v115.js'
      - 'scripts/tests/test_quiz_audio_loading.mjs'
      - 'scripts/tests/test_internal_links.py'
      - '.github/workflows/audit-search-ai-integrity.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap*.xml'
      - 'scripts/audit_search_ai_integrity.mjs'
      - 'scripts/geo-query-planner.mjs'
      - 'scripts/geo-chatgpt-scorecard.mjs'
      - 'data/geo-chatgpt-neutral-prompts.json'
      - 'llms.txt'
      - 'scripts/tests/geo-answer-map.test.mjs'
      - 'data/geo-bing-theme-evidence-20260928.json'
      - 'scripts/audit_internal_links.py'
      - 'data/print-and-go-products.json'
      - 'scripts/audit_product_guide_links.py'
      - 'assets/print-and-go-search.js'
      - 'scripts/build-product-pages.cjs'
      - 'scripts/lib/product-guide-links.cjs'
      - 'assets/resource-links.js'
      - 'assets/seo-routing.js'
      - 'scripts/tests/test_seo_routing_policy.mjs'
      - 'pwa-register.js'
      - 'quiz/assets/script.js'
      - 'quiz/assets/script-runtime-v115.js'
      - 'scripts/tests/test_quiz_audio_loading.mjs'
      - 'scripts/tests/test_internal_links.py'
      - '.github/workflows/audit-search-ai-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit canonical, sitemap and indexability integrity
        run: node scripts/audit_search_ai_integrity.mjs

      - name: Smoke-test GEO query planner with dated repository samples
        run: |
          node --check scripts/geo-query-planner.mjs
          node scripts/geo-query-planner.mjs --out /tmp/skillr-geo-smoke.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("/tmp/skillr-geo-smoke.json","utf8")); if(p.summary.exact_query_rows!==38 || p.summary.theme_only_rows!==7 || p.summary.australia_rows!==38 || p.mode.indexOf("LIMITED HISTORICAL SAMPLE")<0) process.exit(1); console.log("GEO query smoke PASS",p.summary);'

      - name: Verify GEO canonical answer map and existing resources
        run: node --test scripts/tests/geo-answer-map.test.mjs

      - name: Verify untested ChatGPT Search prompts cannot be reported as zero citations
        run: |
          node --check scripts/geo-chatgpt-scorecard.mjs
          node scripts/geo-chatgpt-scorecard.mjs > /tmp/chatgpt-geo-scorecard.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("/tmp/chatgpt-geo-scorecard.json","utf8")); if(r.status!=="UNTESTED" || r.questions_in_set!==12 || r.inspected_answer_runs!==0 || r.observed_inclusion_rate!==null) process.exit(1); console.log("ChatGPT citation scorecard correctly remains UNTESTED");'

      - name: Check internal link destinations
        run: python3 scripts/audit_internal_links.py
      - name: Test internal link audit
        run: python3 -m unittest discover -s scripts/tests -p test_internal_links.py

      - name: Check shared navigation and quiz JavaScript syntax
        run: |
          node --check assets/resource-links.js
          node --check assets/seo-routing.js
          node --check assets/print-and-go-search.js
          node --check pwa-register.js
          node --check quiz/assets/script.js
          node --check quiz/assets/script-runtime-v115.js
      - name: Verify optional feedback audio loads lazily
        run: node --test scripts/tests/test_quiz_audio_loading.mjs

      - name: Preserve authored activity indexing policy
        run: node --test scripts/tests/test_seo_routing_policy.mjs

      - name: Check product links to matching free guides
        run: python3 scripts/audit_product_guide_links.py
