name: Author Year 10 Maths N01-A02 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year10-maths-n01-a01-a02-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {
              code:'AC9M10N01',
              title:'Exact values, surds and approximation error',
              guide:'/year10/maths/ac9m10n01-the-effect-of-using-approximations-of-real-numbers-in-repeated/',
              intro:'Compare exact and approximate representations of real numbers, including surds and pi, and explain how rounding error can accumulate in repeated calculations.',
              short:[
                'State whether sqrt(50) is rational or irrational, and explain your answer.',
                'Simplify sqrt(72) into exact surd form.',
                'Write sqrt(18) as a simplified surd and as a decimal rounded to 2 decimal places.',
                'Explain why pi should often be kept exact until the final step of a calculation.',
                'Round 7.3864 to 3 significant figures.',
                'A length is rounded from 12.48 cm to 12.5 cm. Find the absolute rounding error.',
                'Explain the difference between an exact value and an approximation.',
                'Estimate sqrt(63) without a calculator by comparing it to nearby square numbers.',
                'Correct this error: sqrt(20) = 10 because half of 20 is 10.',
                'Give one situation where repeated rounding could noticeably affect a final answer.'
              ],
              long:[
                'Simplify sqrt(48) + sqrt(75) exactly, then give a decimal approximation to 3 significant figures.',
                'A circle has radius 7 cm. Calculate its area exactly in terms of pi, then approximate it to 2 decimal places. Explain why both forms are useful.',
                'A student rounds sqrt(2) to 1.41 before multiplying by 100. Compare this with using sqrt(2) exactly and rounding only at the end.',
                'A calculation uses 3.14 instead of pi in five repeated steps. Explain why the final error may be larger than a single rounding error.',
                'Simplify 3sqrt(12) - 2sqrt(27) + sqrt(75), showing all surd steps.',
                'A diagonal of a square has exact length 8sqrt(2) cm. Approximate it to 1, 2 and 3 decimal places and compare the accuracy.',
                'Create a measurement problem where exact surd form is more precise than a rounded decimal, then solve it.',
                'Explain how significant figures, decimal places and exact values are different using examples.',
                'Evaluate a solution where a student rounded every intermediate answer to one decimal place. Describe the risk and a better process.',
                'Write a full worked response showing exact calculation first, then final rounding with a reason for the chosen accuracy.'
              ],
              task:'Find a real context involving repeated calculations, such as construction, GPS distance, circle measurement, engineering or finance. Explain where approximations occur and how keeping exact values longer can improve accuracy.'
            },
            {
              code:'AC9M10A01',
              title:'Expand, factorise, simplify and solve algebraically',
              guide:'/year10/maths/ac9m10a01-expand-factorise-and-simplify-expressions-and-solve-equations/',
              intro:'Expand, factorise and simplify algebraic expressions, apply index laws to variables, and solve algebraic equations using clear inverse operations.',
              short:[
                'Expand 5(2x - 3).',
                'Simplify 4a - 3b + 2a + 7b.',
                'Factorise 12x + 18 fully.',
                'Expand (x + 4)(x - 7).',
                'Factorise x^2 + 8x + 15.',
                'Simplify x^3 × x^5 using index laws.',
                'Simplify y^7 ÷ y^2 using index laws.',
                'Solve 3x - 7 = 11.',
                'Correct this error: (x + 5)^2 = x^2 + 25.',
                'Explain how expanding can be used to check factorising.'
              ],
              long:[
                'Expand and simplify 4(3x - 2) - 2(x + 5).',
                'Factorise 6x^2 - 15x fully and check by expanding.',
                'Expand (2x - 3)(x + 6), then substitute x = 2 to check the expression.',
                'Factorise x^2 - 9 and explain why it is a difference of squares.',
                'Solve 2(x - 3) + 5 = 3x - 4 and check your solution.',
                'Simplify (3x^2y)(4xy^3) using index laws and explain each exponent change.',
                'Factorise and solve x^2 + 5x + 6 = 0.',
                'A rectangle has side lengths x + 2 and x + 9. Write an expression for its area, expand it, then explain what each term represents.',
                'A student factorises 10x + 25 as 5(2x + 25). Explain the error and correct it.',
                'Write a full algebra solution that includes expansion, simplification, factorising and checking by substitution.'
              ],
              task:'Create an algebraic area model using a rectangle or composite shape. Write expressions for side lengths, expand to find area, factorise where possible, and explain the meaning of each expression.'
            },
            {
              code:'AC9M10A02',
              title:'Linear inequalities and simultaneous equations',
              guide:'/year10/maths/ac9m10a02-solve-linear-inequalities-and-simultaneous-linear-equations-in/',
              intro:'Solve linear inequalities and simultaneous linear equations in two variables using algebraic and graphical methods, and interpret solutions in context.',
              short:[
                'Solve x + 7 < 12.',
                'Solve 3x - 5 ≥ 10.',
                'Explain what happens to an inequality sign when both sides are multiplied by -1.',
                'Solve -2x < 8.',
                'Write the solution x ≥ 4 in words.',
                'Check whether x = 3 satisfies 2x + 1 > 8.',
                'Solve the simultaneous equations x + y = 9 and x - y = 1.',
                'State what the intersection point of two straight-line graphs represents.',
                'Correct this error: dividing -6x < 12 by -6 gives x < -2.',
                'Give one real context that could be modelled by simultaneous equations.'
              ],
              long:[
                'Solve 4x - 7 ≤ 17 and represent the solution on a number line.',
                'Solve -3(x - 2) > 12, explaining every inequality step clearly.',
                'Solve the system 2x + y = 11 and x - y = 1 using elimination.',
                'Solve the system y = 2x + 3 and y = -x + 12 using substitution.',
                'A movie ticket and snack cost $18. Two tickets and one snack cost $30. Form and solve simultaneous equations to find each cost.',
                'Graph or describe how you would solve y = x + 2 and y = -2x + 8, and interpret the intersection.',
                'Create a worded constraint that can be represented by x + y ≤ 20 and explain what values make sense.',
                'Compare solving a simultaneous system by graphing, substitution and elimination. State when each method is useful.',
                'A student solves 5 - 2x ≥ 13 and forgets to reverse the inequality. Find and correct the error.',
                'Write a full modelling problem involving two unknowns, form simultaneous equations, solve them and check the answer in context.'
              ],
              task:'Find or design a real situation with two unknown quantities, such as tickets and snacks, phone plans, transport fares or mixture problems. Write two equations, solve them and interpret the solution.'
            }
          ];
          function page(p){
            const short = p.short.map(q=>`<li><p>${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map(q=>`<li><p>${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 10 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-10/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 10 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct notation and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 10 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) fs.writeFileSync(`quiz/year-10/math/${p.code.toLowerCase()}/homework/index.html`, page(p));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz/year-10/math/ac9m10n01/homework/index.html quiz/year-10/math/ac9m10a01/homework/index.html quiz/year-10/math/ac9m10a02/homework/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Author Year 10 Maths N01-A02 homework"
          git push
