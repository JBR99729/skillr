name: Fix AC9M3M03 slide visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ac9m3m03-slide-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AC9M3M03 teacher deck visuals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('year3/maths/ac9m3m03-and-use-the-relationship-between-formal-units-of-time-including/teacher-slides/index.html'),
              Path('year3/maths/ac9m3m03-and-use-the-relationship-between-formal-units-of-time-including/teacher-deck/index.html'),
              Path('teacher-slides/year3/maths/AC9M3M03/index.html'),
              Path('teacher-slides/year3/maths/ac9m3m03/index.html'),
          ]

          css = r'''
/* ac9m3m03 visual fix: contextual right-side lesson panels */
.lesson .visual.clock,
.lesson .mini-clock{
  grid-template-columns:1fr 1fr!important;
  gap:14px!important;
  padding:28px!important;
  background:rgba(255,255,255,.12)!important;
  border-color:rgba(255,255,255,.30)!important;
  box-shadow:inset 0 0 0 10px rgba(255,255,255,.06)!important;
}
.lesson .visual.clock span,
.lesson .mini-clock span{
  color:#fff!important;
  background:rgba(255,255,255,.18)!important;
  border-color:rgba(255,255,255,.34)!important;
  min-height:74px!important;
  font-size:0!important;
  text-align:center!important;
}
.lesson .visual.clock span:first-child,
.lesson .mini-clock span:first-child{
  grid-column:1/-1!important;
  background:#fff7d6!important;
  border-color:#f2d37a!important;
  color:#173b6d!important;
  min-height:86px!important;
}
.lesson .visual.clock span:first-child::after,
.lesson .mini-clock span:first-child::after{content:'60 minutes';font-size:clamp(28px,4vw,48px);}
.lesson .visual.clock span:nth-child(2)::after,
.lesson .mini-clock span:nth-child(2)::after{content:'Warm-up 10 min';font-size:clamp(18px,2.2vw,28px);}
.lesson .visual.clock span:nth-child(3)::after,
.lesson .mini-clock span:nth-child(3)::after{content:'Teaching 20 min';font-size:clamp(18px,2.2vw,28px);}
.lesson .visual.clock::after,
.lesson .mini-clock::after{
  content:'Activity 25 min  •  Wrap-up 5 min';
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:64px;
  padding:8px 12px;
  border-radius:18px;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.34);
  color:#fff;
  font-size:clamp(18px,2vw,26px);
  font-weight:900;
}
/* make all generic unit blocks readable if used on dark slides */
.lesson .unit-stack span,
.lesson .lesson-stack span,
.lesson .goal-stack span,
.lesson .event-grid span,
.lesson .timer-card span,
.lesson .sheet-card span,
.lesson .schedule-card span,
.lesson .compare-card span,
.lesson .nature-card span,
.lesson .exit-card span,
.lesson .answer-card span,
.lesson .celebrate-card span{color:#173b6d;}
'''

          changed = False
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              if 'ac9m3m03 visual fix: contextual right-side lesson panels' in text:
                  continue
              if '</style>' not in text:
                  continue
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text)
              changed = True

          if not changed:
              print('No AC9M3M03 visual changes needed.')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'JBR99729'
          git config user.email 'jbhasker9@gmail.com'
          git add year3/maths/ac9m3m03-and-use-the-relationship-between-formal-units-of-time-including/teacher-slides/index.html \
                  year3/maths/ac9m3m03-and-use-the-relationship-between-formal-units-of-time-including/teacher-deck/index.html \
                  teacher-slides/year3/maths/AC9M3M03/index.html \
                  teacher-slides/year3/maths/ac9m3m03/index.html
          git commit -m 'Fix AC9M3M03 lesson slide visuals'
          git push

