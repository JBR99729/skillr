name: Author Year 9 Maths M03-M05 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-m03-m05-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Maths M03-M05 homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lines = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9M03',title:'Pythagoras, trigonometry and similarity',guide:'/year9/maths/ac9m9m03-solve-spatial-problems-applying-angle-properties-scale/',intro:'Solve spatial problems using right triangles, Pythagoras, simple trigonometric ratios, scale and similarity. Show diagrams, units and checks for reasonableness.',short:['Find the hypotenuse of a right triangle with shorter sides 9 cm and 12 cm.','A right triangle has hypotenuse 13 m and one shorter side 5 m. Find the other shorter side.','State the sine, cosine and tangent ratios using opposite, adjacent and hypotenuse.','In a right triangle, identify the hypotenuse and explain how you know.','A ladder is 4 m from a wall and reaches 7 m up the wall. Estimate the ladder length.','Find the scale factor from a triangle with side 6 cm to a similar triangle with matching side 15 cm.','Explain why similar triangles have equal matching angles.','Use tan θ = opposite/adjacent to write an equation for an unknown angle.','Correct this error: a^2 + b^2 = c can be used for Pythagoras.','Give one practical situation where right-triangle measurement is useful.'],long:['A 6 m ladder leans against a wall with its base 2 m from the wall. Find the height it reaches and explain your method.','A ramp rises 1.2 m over a horizontal distance of 4.5 m. Find the ramp length and estimate its angle to the ground.','Use similarity to find the height of a tree if a 1.5 m student casts a 2 m shadow and the tree casts a 10 m shadow.','Compare solving a right-triangle problem using Pythagoras and using trigonometry. State when each method is suitable.','A scale drawing uses 1 cm to represent 2.5 m. A path is 7.2 cm on the drawing. Find its real length.','A student uses the longest given side as the hypotenuse without checking the right angle. Explain the risk and correct approach.','Solve a navigation-style problem involving north/east distances and straight-line distance. Include a diagram.','Create a similar-triangles problem with missing side length, solve it and check with scale factor.','Explain how angle properties, scale and right-triangle methods can work together in a spatial problem.','Write a full worked solution to a measurement problem involving a right triangle, including diagram, formula, substitution, answer and units.'],task:'Research one real application of Pythagoras, trigonometry or similarity, such as building ramps, surveying, navigation, shadows or phone map distance. Create and solve a related measurement problem.'},
            {code:'AC9M9M04',title:'Error, accuracy and percentage error',guide:'/year9/maths/ac9m9m04-calculate-and-interpret-absolute-relative-and-percentage-errors/',intro:'Calculate and interpret absolute error, relative error and percentage error in practical measurement contexts. Explain what the error means and whether it is acceptable.',short:['Define absolute error.','Define relative error.','Write the percentage error formula.','A measured length is 24 cm but the true length is 25 cm. Find the absolute error.','Using the same values, find the percentage error.','Explain why percentage error can be more useful than absolute error when comparing measurements.','Round 8.764 to 2 decimal places and state the possible rounding error.','What is the difference between precision and accuracy?','Correct this error: percentage error = true value ÷ error × 100.','Give one situation where a small measurement error could matter.'],long:['A student measures a table as 1.18 m. The true length is 1.20 m. Calculate absolute error, relative error and percentage error.','Compare a 2 cm error in a 20 cm measurement with a 2 cm error in a 200 cm measurement. Which is more serious and why?','A scale has readings to the nearest 0.1 kg. Explain the maximum possible rounding error for one reading.','A class estimates a distance as 48 m when the actual distance is 52 m. Calculate percentage error and interpret it.','Explain how repeated measurements can reduce the effect of random error but not always remove systematic error.','A recipe uses 500 g of flour but a student uses 465 g. Calculate the percentage error and discuss whether it might matter.','A phone GPS reports a 5.0 km run as 4.8 km. Calculate percentage error and explain the impact on pace estimates.','Create a measurement table with true value, measured value, absolute error and percentage error for three items.','Evaluate whether it is better to report a measurement as 3 m, 3.0 m or 3.00 m in a given context.','Write a full worked response for a practical error problem, including formula, substitution, answer and interpretation.'],task:'Find a real measurement context, such as sport timing, cooking, construction, medicine, GPS, science practicals or manufacturing. Explain possible sources of error and calculate a sample percentage error.'},
            {code:'AC9M9M05',title:'Direct proportion, scale and rates',guide:'/year9/maths/ac9m9m05-mathematical-modelling-to-solve-practical-problems-involving/',intro:'Use direct proportion, scale factors and rates to model practical situations, compare options and interpret answers in context.',short:['What does direct proportion mean?','If 5 kg of apples cost $18, find the cost per kilogram.','A map scale is 1:50 000. What real distance does 3 cm represent?','A car travels 180 km in 2.5 hours. Find its average speed.','Scale the ratio 2:5 so the first part is 14.','Explain why a graph of direct proportion passes through the origin.','Convert 72 km/h to metres per second.','Find the constant of proportionality if y = kx and y = 24 when x = 6.','Correct this error: doubling one quantity always means direct proportion.','Give one real situation modelled by a rate.'],long:['A recipe for 4 people uses 300 g of rice. Scale the recipe for 10 people and explain the proportional reasoning.','A model car has scale 1:24. If the model is 18 cm long, find the real car length in metres.','Compare two internet plans using cost per gigabyte and explain which is better value for different users.','A tap fills 18 L in 3 minutes. Model the amount of water after t minutes and use it to find the time for 75 L.','A cyclist travels 42 km in 1.75 hours. Calculate average speed and interpret the answer.','A map shows two towns 7.6 cm apart with scale 1:250 000. Find the real distance and express it in kilometres.','Explain the difference between direct proportion and a relationship with a fixed starting cost. Use examples.','Create a direct-proportion table and graph, then identify the constant of proportionality.','Solve a multi-step travel problem involving speed, time, distance and a rest break.','Write a full modelling response for a proportional situation, including assumptions, equation, calculation and interpretation.'],task:'Research a practical rate or scale context, such as fuel use, map scale, recipe scaling, exchange rates, speed, population density or printing scale. Build a proportional model and solve one realistic problem.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct units or notation, and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lines(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file,page(p));
          }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9m03/homework/index.html quiz/year-9/math/ac9m9m04/homework/index.html quiz/year-9/math/ac9m9m05/homework/index.html
          git commit -m "Author Year 9 Maths M03-M05 homework"
          git push
