name: Year 7 Maths final reconcile and close v2 2026-09-10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/year7-maths-final-reconcile-close-v2-20260910.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Resolve historical authored branches and run reconciler
        run: |
          for b in \
            agent/year7-maths-n02-n04-quality \
            agent/year7-maths-n05-n07-quality \
            agent/year7-maths-n08-n09-a01-quality \
            agent/year7-maths-algebra-quality \
            agent/year7-maths-quality-batch2 \
            agent/year7-assessment-upgrade \
            quality/year7-stem-preservation-v2 \
            qa/year7-maths-ac9m7m01-upgrade \
            qa/year7-maths-ac9m7m02-upgrade; do
              git branch "$b" "origin/$b"
          done
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/year7-maths-final-reconcile-close-20260910.yml').read_text()
          marker="          cat > /tmp/y7close.js <<'NODE'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          NODE",start)
          lines=[]
          for line in src[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/y7close.js').write_text('\n'.join(lines)+'\n')
          PY
          node /tmp/y7close.js
      - name: Correct N01 scope and rebuild all Year 7 Maths learning surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/year7-maths-topic-v2-number-a01-overrides.mjs'); s=p.read_text()
          s=s.replace('ex("Bound a non-perfect square root",["Find the perfect square below 70: 8² = 64.","Find the next perfect square: 9² = 81.","Write 64 < 70 < 81.","Take roots to obtain 8 < √70 < 9."],"The square root of 70 lies between 8 and 9.","Squaring both bounds gives 64 < 70 < 81.")','ex("Use a square root in a problem",["Identify the square area: 324 m².","Use side = √area.","Because 18² = 324, the side is 18 m.","Perimeter = 4 × 18 = 72 m."],"The side is 18 m and the perimeter is 72 m.","Check 18 × 18 = 324 before calculating the perimeter.")')
          s=s.replace('q(2,"Place √50 between consecutive whole numbers.","7 < √50 < 8 because 49 < 50 < 64.","Adjacent perfect squares bound the root.","Compare 50 with 7² and 8².")','q(2,"A square has area 529 cm². Find its side length and explain the inverse relationship used.","23 cm, because 23² = 529, so √529 = 23.","Square root reverses squaring for a perfect square.","Find the whole number whose square is 529.")')
          p.write_text(s)
          b=Path('scripts/build_year7_maths_topic_modules_v2.mjs'); t=b.read_text()
          t=t.replace('visualBlock("rootBounds", { value: 70, lower: 64, upper: 81, lowerRoot: 8, upperRoot: 9, label: "Bound √70 between consecutive whole numbers" })','visualBlock("squareArray", { rows: 18, cols: 18, value: 324, label: "18 × 18 = 324, so √324 = 18" })')
          b.write_text(t)
          PY
          node scripts/build_year7_maths_topic_modules_v2.mjs
      - name: Validate exact 30-code production contract
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const codes=[...Array.from({length:9},(_,i)=>`AC9M7N${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7A${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7M${String(i+1).padStart(2,'0')}`),...Array.from({length:4},(_,i)=>`AC9M7SP${String(i+1).padStart(2,'0')}`),...Array.from({length:3},(_,i)=>`AC9M7ST${String(i+1).padStart(2,'0')}`),...Array.from({length:2},(_,i)=>`AC9M7P${String(i+1).padStart(2,'0')}`)];
          const norm=s=>String(s||'').toLowerCase().replace(/<[^>]+>/g,' ').replace(/[^a-z0-9%√π]+/g,' ').replace(/\s+/g,' ').trim();
          const failures=[];
          function live(file,name){const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync(file,'utf8'),c);return c.window[name]||c.window.quizQuestions||[]}
          for(const code of codes){const l=code.toLowerCase(),a=JSON.parse(fs.readFileSync(`assets/assessment-banks/year7/math/${l}.json`,'utf8')),P=a.filter(x=>x.bank==='practice'),T=a.filter(x=>x.bank==='test');const ps=P.map(x=>norm(x.question)),ts=T.map(x=>norm(x.question));if(P.length!==48||T.length!==16)failures.push(`${code}: canonical ${P.length}/${T.length}`);if(new Set(ps).size!==48||new Set(ts).size!==16)failures.push(`${code}: duplicate stems`);if(ts.some(s=>new Set(ps).has(s)))failures.push(`${code}: Practice/Test overlap`);for(const x of a){if(x.curriculum_code!==code)failures.push(`${code}: curriculum code mismatch`);if(!Array.isArray(x.answers)||x.answers.filter(y=>y.is_correct).length!==1)failures.push(`${code}: malformed answers ${x.id}`);if(new Set((x.answers||[]).map(y=>String(y.text))).size!==(x.answers||[]).length)failures.push(`${code}: duplicate answer text ${x.id}`)}const LP=live(`quiz/year-7/math/${l}/practice/questions.js`,'skillrPracticeQuestions'),LT=live(`quiz/year-7/math/${l}/test/questions.js`,'skillrTestQuestions');if(LP.length!==48||LT.length!==16)failures.push(`${code}: live ${LP.length}/${LT.length}`);if(LP.map(x=>norm(x.question)).join('|')!==ps.join('|'))failures.push(`${code}: practice parity`);if(LT.map(x=>norm(x.question)).join('|')!==ts.join('|'))failures.push(`${code}: test parity`)}
          const scope=fs.readFileSync('scripts/year7-maths-topic-v2-number-a01-overrides.mjs','utf8')+fs.readFileSync('scripts/build_year7_maths_topic_modules_v2.mjs','utf8');if(/√70|√50|non-perfect square root|rootBounds/.test(scope))failures.push('AC9M7N01 residual non-perfect-root teaching');
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('YEAR7_MATHS_ALL_30_EXACT_48_16_PARITY_PASS');
          NODE
      - name: Mark all Year 7 Maths codes verified and regenerate public verification
        run: |
          node <<'NODE'
          const fs=require('fs');const p='data/content-verification-status.json',d=JSON.parse(fs.readFileSync(p,'utf8'));const codes=[...Array.from({length:9},(_,i)=>`AC9M7N${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7A${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7M${String(i+1).padStart(2,'0')}`),...Array.from({length:4},(_,i)=>`AC9M7SP${String(i+1).padStart(2,'0')}`),...Array.from({length:3},(_,i)=>`AC9M7ST${String(i+1).padStart(2,'0')}`),...Array.from({length:2},(_,i)=>`AC9M7P${String(i+1).padStart(2,'0')}`)];d.reviewedCodes=[...new Set([...d.reviewedCodes,...codes])].sort();fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          node scripts/update_content_verification_status.mjs
      - name: Write final closure report and commit
        run: |
          mkdir -p reports/year7-maths-research-authoring
          cat > reports/year7-maths-research-authoring/FINAL-CLOSURE-2026-09-10.md <<'EOF'
          # Year 7 Mathematics final closure — 10 September 2026

          **Status: CLOSED / CONTENT VERIFIED**

          All 30 Year 7 Mathematics curriculum codes have been reconciled against the completed IXL Australia + Khan Academy research master.

          Production gates passed:
          - 48 unique Practice questions per code
          - 16 unique, separate Test questions per code
          - zero normalised Practice/Test stem overlap
          - canonical JSON and live question-bank parity
          - one correct answer per item and no duplicate answer text
          - Topic Guide, Classroom View and worksheet rebuilt across all 30 codes
          - AC9M7N01 non-perfect-root overreach removed and replaced with perfect-square inverse/context transfer
          - all 30 codes added to Content Verified ledger
          - public verification summaries regenerated

          Documented source exceptions remain evidence-boundary notes, not unresolved research tasks. SkillrHub assessment wording is original.
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close all Year 7 Maths research-aligned authoring'
          git push
