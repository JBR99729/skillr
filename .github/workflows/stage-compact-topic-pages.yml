name: Stage compact topic navigation fixes
on:
  push:
    branches: [fix/f10-compact-topic-pages]
    paths: [.github/workflows/stage-compact-topic-pages.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and commit static navigation to the PR branch
        run: |
          set -euo pipefail
          python scripts/stage-compact-topic-pages.py
          git diff --check
          node scripts/validate_year9_science_static_v2.mjs
          python scripts/validate_discovery_navigation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- foundation year{1..10}
          git commit -m "Keep discovery and Year 9 worksheet links in the compact navigation"
          node scripts/check_release_integrity.mjs HEAD^ HEAD
          git push origin HEAD:refs/heads/fix/f10-compact-topic-pages
