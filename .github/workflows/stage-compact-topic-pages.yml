name: Stage compact topic pages
on:
  push:
    branches: [fix/f10-compact-topic-pages]
    paths: [.github/workflows/stage-compact-topic-pages.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate static topic markup
        run: |
          git fetch origin pull/927/head
          python scripts/stage-compact-topic-pages.py
          git diff --check
          node scripts/validate_f10_topic_learning_order.mjs
          node scripts/audit_curriculum_route_integrity.mjs
      - name: Commit reviewed rollout to staging only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- foundation year{1..10}
          git commit -m "Apply compact lesson structure to static topic pages"
          node scripts/check_release_integrity.mjs HEAD^ HEAD
          git push origin HEAD:refs/heads/fix/f10-compact-topic-pages
