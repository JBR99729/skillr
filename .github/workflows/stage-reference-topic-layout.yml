name: Stage reference layout across topics
on:
  push:
    branches: [fix/numbers-reference-topic-preview]
    paths: [.github/workflows/stage-reference-topic-layout.yml, scripts/stage-reference-topic-layout.py]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python scripts/stage-reference-topic-layout.py --write
          git diff --check
          node scripts/audit_curriculum_route_integrity.mjs
          node scripts/audit_years1_7_curriculum_resources.mjs
          python scripts/validate_discovery_navigation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- foundation year{1..10}
          git commit -m "Apply the Numbers to 20 layout across canonical topic pages"
          node scripts/check_release_integrity.mjs HEAD^ HEAD
          git push origin HEAD:refs/heads/fix/numbers-reference-topic-preview
