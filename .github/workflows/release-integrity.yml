name: Release integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preserve-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete release tree
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE: ${{ github.sha }}
        run: node scripts/check_release_integrity.mjs "$BASE" "$CANDIDATE"
