name: Release integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preserve-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete release tree
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE: ${{ github.sha }}
        run: node scripts/check_release_integrity.mjs "$BASE" "$CANDIDATE"
      - name: Prevent retired quiz players and navigation from returning
        run: |
          python3 scripts/test_retire_legacy_quiz_routes.py
          python3 scripts/retire_legacy_quiz_routes.py
      - name: Check static learning and resource discovery
        run: python3 scripts/validate_discovery_navigation.py

      - name: Check static and shared breadcrumb preservation
        run: node --test scripts/tests/test_breadcrumb_preservation.mjs scripts/tests/test_geo_breadcrumbs.mjs scripts/tests/test_seo_routing_preservation.mjs
