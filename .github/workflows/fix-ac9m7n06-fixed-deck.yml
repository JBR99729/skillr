name: Fix AC9M7N06 fixed Teacher Slides

on:
  pull_request:
    paths:
      - 'scripts/fix_ac9m7n06_fixed_deck.mjs'
      - '.github/workflows/fix-ac9m7n06-fixed-deck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Preserve expanded deck as fixed slides
        run: node scripts/fix_ac9m7n06_fixed_deck.mjs
      - name: Validate generated deck
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const dir='year7/maths/ac9m7n06-the-4-operations-with-positive-rational-numbers-including';
          const topic=fs.readFileSync(`${dir}/index.html`,'utf8');
          const viewer=fs.readFileSync(`${dir}/teacher-deck/index.html`,'utf8');
          const slides=fs.readdirSync(`${dir}/teacher-deck`).filter(f=>/^slide-\d+\.svg$/.test(f));
          const errors=[];
          if(slides.length<20)errors.push(`Expected rich multi-page deck, found ${slides.length} pages`);
          if(fs.existsSync(`${dir}/teacher-slides/index.html`))errors.push('One-page duplicate teacher-slides viewer still exists');
          if(!/href=["']teacher-deck\//i.test(topic))errors.push('Topic Guide does not link canonical teacher-deck');
          if(/href=["']teacher-slides\//i.test(topic))errors.push('Topic Guide still links duplicate teacher-slides route');
          if(!/data-slide-previous/.test(viewer)||!/data-slide-next/.test(viewer))errors.push('Viewer lacks page-by-page navigation');
          if(/href=["'][^"']+\.(?:pdf|pptx)/i.test(viewer)||/\bdownload\s*=/i.test(viewer))errors.push('Viewer exposes downloadable deck');
          for(const f of slides){const s=fs.readFileSync(`${dir}/teacher-deck/${f}`,'utf8');if(!s.includes('AC9M7N06')||!s.includes('SkillrHub')||!s.includes('skillrhub.com'))errors.push(`${f}: branding/footer missing`);}
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          console.log(`AC9M7N06 fixed deck verification: PASS (${slides.length} pages)`);
          NODE
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A year7/maths/ac9m7n06-the-4-operations-with-positive-rational-numbers-including
          git commit -m "Preserve AC9M7N06 expanded deck as fixed slides"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
