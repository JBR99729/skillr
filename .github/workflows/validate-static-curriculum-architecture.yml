name: Validate static curriculum architecture

on:
  pull_request:
    paths:
      - 'foundation/**/index.html'
      - 'year*/**/index.html'
      - 'docs/static-curriculum-architecture-v2.md'
      - 'AGENTS.md'
      - 'scripts/validate_static_curriculum_architecture.mjs'
      - '.github/workflows/validate-static-curriculum-architecture.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate_static_curriculum_architecture.mjs
