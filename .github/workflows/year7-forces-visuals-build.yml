name: Build Year 7 forces teaching visuals
on:
  push:
    branches: [agent/year7-forces-high-yield-visuals]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year7-forces-high-yield-visuals
          fetch-depth: 2
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate diagrams and update AC9S7U04
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          out=Path('assets/illustrations/science'); out.mkdir(parents=True,exist_ok=True)
          W,H=640,360; font=ImageFont.load_default()
          def save(img,name):
              p=out/name; img.save(p,'WEBP',quality=38,method=6); assert p.stat().st_size<60*1024
          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((18,16),'Levers and pulleys: force-distance trade-offs',fill='black',font=font)
          d.rectangle((20,45,310,325),outline=(180,180,180),width=2); d.text((35,58),'LEVER',fill='black',font=font)
          d.line((55,215,270,150),fill=(70,70,70),width=8); d.polygon([(155,220),(180,220),(168,190)],fill=(180,120,60))
          d.text((148,228),'fulcrum',fill='black',font=font); d.text((58,235),'effort arm 1.2 m',fill='black',font=font); d.text((205,125),'load arm 0.4 m',fill='black',font=font)
          d.line((65,160,65,215),fill=(40,100,180),width=4); d.polygon([(58,168),(65,155),(72,168)],fill=(40,100,180)); d.text((38,140),'effort',fill='black',font=font)
          d.rectangle((245,130,280,165),fill=(180,180,180),outline=(70,70,70)); d.text((245,112),'load',fill='black',font=font)
          d.rectangle((330,45,620,325),outline=(180,180,180),width=2); d.text((345,58),'PULLEY',fill='black',font=font)
          d.ellipse((380,90,430,140),outline=(70,70,70),width=3); d.ellipse((500,180,550,230),outline=(70,70,70),width=3)
          d.line((405,140,405,265),fill=(70,70,70),width=3); d.line((405,265,525,265),fill=(70,70,70),width=3); d.line((525,265,525,230),fill=(70,70,70),width=3)
          d.rectangle((500,230,550,280),fill=(190,190,190),outline=(70,70,70)); d.text((495,290),'load',fill='black',font=font); d.text((350,150),'fixed pulley changes direction',fill='black',font=font); d.text((350,305),'more supporting ropes -> less ideal effort',fill='black',font=font)
          save(im,'lever-pulley-mechanical-advantage.webp')
          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((18,16),'Orbit = forward motion + inward gravitational acceleration',fill='black',font=font)
          d.ellipse((245,105,395,255),fill=(170,210,245),outline=(40,90,150),width=3); d.text((292,262),'Earth',fill='black',font=font)
          d.ellipse((90,45,550,315),outline=(160,160,160),width=2); d.ellipse((500,165,525,190),fill=(180,180,180),outline=(70,70,70)); d.text((490,198),'satellite',fill='black',font=font)
          d.line((513,177,570,140),fill=(40,100,180),width=4); d.polygon([(565,136),(580,134),(572,148)],fill=(40,100,180)); d.text((530,118),'forward velocity',fill='black',font=font)
          d.line((510,180,410,180),fill=(180,60,60),width=4); d.polygon([(418,173),(405,180),(418,187)],fill=(180,60,60)); d.text((410,188),'gravity inward',fill='black',font=font)
          d.text((18,332),'Gravity is still present in orbit; continuous falling bends the path around Earth.',fill='black',font=font)
          save(im,'orbital-gravity-path.webp')
          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((18,16),'Boomerang airfoil: lift, drag and rotation',fill='black',font=font)
          d.polygon([(130,205),(220,165),(420,150),(500,180),(420,205),(220,220)],fill=(210,170,110),outline=(100,70,40))
          d.line((325,145,325,75),fill=(40,130,70),width=4); d.polygon([(318,84),(325,70),(332,84)],fill=(40,130,70)); d.text((335,78),'lift',fill='black',font=font)
          d.line((200,190,120,190),fill=(180,60,60),width=4); d.polygon([(130,183),(115,190),(130,197)],fill=(180,60,60)); d.text((55,172),'drag',fill='black',font=font)
          d.line((360,210,360,285),fill=(90,90,90),width=4); d.polygon([(353,276),(360,290),(367,276)],fill=(90,90,90)); d.text((370,270),'weight',fill='black',font=font)
          d.arc((185,90,455,300),20,300,fill=(70,90,160),width=3); d.text((455,110),'rotation',fill='black',font=font)
          d.text((18,332),'Unequal aerodynamic effects across rotating arms can create torque and a curved flight path.',fill='black',font=font)
          save(im,'boomerang-airfoil-forces.webp')
          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((18,16),'Spearthrower as an extended lever',fill='black',font=font)
          d.ellipse((95,210,125,240),fill=(190,150,110),outline=(80,60,40)); d.text((70,245),'hand/pivot',fill='black',font=font)
          d.line((110,225,400,130),fill=(110,70,35),width=10); d.line((395,130,565,80),fill=(90,90,90),width=5)
          d.arc((70,55,500,315),200,335,fill=(40,100,180),width=3); d.text((285,285),'longer radius -> higher tip speed',fill='black',font=font)
          d.line((510,95,590,65),fill=(40,130,70),width=4); d.polygon([(580,60),(595,62),(585,73)],fill=(40,130,70)); d.text((485,45),'projectile speed',fill='black',font=font)
          d.text((18,332),'The tool extends the effective lever arm so the projectile end travels farther and faster.',fill='black',font=font)
          save(im,'spearthrower-lever-speed.webp')
          path=Path('year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html')
          text=path.read_text(encoding='utf-8')
          inserts={
            '<details class="curriculum-topic-section"><summary><strong>E5 — Levers and pulleys</strong></summary><div class="curriculum-detail-body">':'<details class="curriculum-topic-section"><summary><strong>E5 — Levers and pulleys</strong></summary><div class="curriculum-detail-body"><figure class="science-premium-diagram"><img src="/assets/illustrations/science/lever-pulley-mechanical-advantage.webp" alt="Lever showing effort arm, load arm and fulcrum alongside pulley systems that change force direction and reduce ideal effort with supporting rope segments" width="640" height="360" loading="lazy" decoding="async"><figcaption>Lever mechanical advantage depends on effort-arm to load-arm ratio; pulley systems trade force for distance through supporting rope segments.</figcaption></figure>',
            '<details class="curriculum-topic-section"><summary><strong>E6 — Gravity in space</strong></summary><div class="curriculum-detail-body">':'<details class="curriculum-topic-section"><summary><strong>E6 — Gravity in space</strong></summary><div class="curriculum-detail-body"><figure class="science-premium-diagram"><img src="/assets/illustrations/science/orbital-gravity-path.webp" alt="Satellite orbit diagram showing forward velocity tangent to the orbit and gravitational acceleration directed inward toward Earth" width="640" height="360" loading="lazy" decoding="async"><figcaption>An orbit is continuous free fall: forward motion carries the object ahead while gravity continually bends its path inward.</figcaption></figure>',
            '<details class="curriculum-topic-section"><summary><strong>E7 — Forces and boomerang design</strong></summary><div class="curriculum-detail-body">':'<details class="curriculum-topic-section"><summary><strong>E7 — Forces and boomerang design</strong></summary><div class="curriculum-detail-body"><figure class="science-premium-diagram"><img src="/assets/illustrations/science/boomerang-airfoil-forces.webp" alt="Boomerang airfoil diagram labelled with lift, drag, weight and rotation to explain curved flight" width="640" height="360" loading="lazy" decoding="async"><figcaption>Returning flight can be modelled using lift, drag, weight, rotation and torque; not all boomerang designs are intended to return.</figcaption></figure>',
            '<details class="curriculum-topic-section"><summary><strong>E8 — First Peoples and Torres Strait Islander engineering contexts</strong></summary><div class="curriculum-detail-body">':'<details class="curriculum-topic-section"><summary><strong>E8 — First Peoples and Torres Strait Islander engineering contexts</strong></summary><div class="curriculum-detail-body"><figure class="science-premium-diagram"><img src="/assets/illustrations/science/spearthrower-lever-speed.webp" alt="Spearthrower lever diagram showing a hand pivot, extended lever arm and increased projectile tip speed" width="640" height="360" loading="lazy" decoding="async"><figcaption>A spearthrower extends the effective lever radius, allowing the projectile end to travel farther and reach greater launch speed.</figcaption></figure>'
          }
          for needle,repl in inserts.items():
              assert needle in text, needle
              text=text.replace(needle,repl,1)
          path.write_text(text,encoding='utf-8')
          print('PASS: AC9S7U04 received 4 high-yield visuals')
          PY
      - name: Validate assets and page
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html').read_text(encoding='utf-8')
          names=['balanced-unbalanced-forces.webp','lever-pulley-mechanical-advantage.webp','orbital-gravity-path.webp','boomerang-airfoil-forces.webp','spearthrower-lever-speed.webp']
          for name in names:
              p=Path('assets/illustrations/science')/name; assert p.exists(),name; assert p.stat().st_size<=60*1024; assert name in page,name
          assert page.count('science-premium-diagram')>=5
          print('PASS: AC9S7U04 now has 5 instructional visuals')
          PY
      - name: Commit static outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrations/science year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html
          git commit -m "Add high-yield force and engineering visuals"
          git push
