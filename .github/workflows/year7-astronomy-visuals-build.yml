name: Build Year 7 astronomy teaching visuals

on:
  push:
    branches:
      - agent/year7-astronomy-high-yield-visuals

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year7-astronomy-high-yield-visuals
          fetch-depth: 2
      - name: Install image dependency
        run: python -m pip install pillow
      - name: Generate lightweight visuals and update AC9S7U03
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path('assets/illustrations/science')
          out.mkdir(parents=True, exist_ok=True)
          W,H=640,360
          font=ImageFont.load_default()

          def save(img,name):
              p=out/name
              img.save(p,'WEBP',quality=38,method=6)
              assert p.stat().st_size < 60*1024, (name,p.stat().st_size)

          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.ellipse((280,140,360,220),fill=(255,205,70),outline=(150,110,20),width=2)
          d.text((300,225),'Sun',fill='black',font=font)
          positions=[(105,180,'Dec'),(320,65,'Mar'),(535,180,'Jun'),(320,295,'Sep')]
          for x,y,label in positions:
              d.ellipse((x-28,y-28,x+28,y+28),fill=(180,220,255),outline=(40,90,150),width=2)
              d.line((x-14,y+34,x+14,y-34),fill=(40,40,40),width=3)
              d.text((x-11,y+38),label,fill='black',font=font)
          d.ellipse((82,42,558,318),outline=(135,135,135),width=2)
          d.text((20,18),'Earth keeps nearly the same axial tilt direction as it orbits the Sun',fill='black',font=font)
          d.text((18,332),'Tilt changes Sun angle and day length - not Earth-Sun distance.',fill='black',font=font)
          save(im,'earth-axial-tilt-seasons.webp')

          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((20,16),'Moon phases: changing view of the Moon’s sunlit half',fill='black',font=font)
          d.ellipse((270,130,370,230),fill=(150,205,245),outline=(40,90,150),width=2); d.text((300,238),'Earth',fill='black',font=font)
          d.line((18,80,125,80),fill=(240,180,30),width=10); d.polygon([(125,70),(145,80),(125,90)],fill=(240,180,30)); d.text((18,55),'Sunlight',fill='black',font=font)
          pts=[(150,180,'New'),(205,75,'Waxing'),(320,45,'First qtr'),(435,75,'Waxing'),(490,180,'Full'),(435,285,'Waning'),(320,315,'Third qtr'),(205,285,'Waning')]
          for x,y,label in pts:
              d.ellipse((x-20,y-20,x+20,y+20),fill=(215,215,215),outline=(60,60,60),width=2)
              d.pieslice((x-20,y-20,x+20,y+20),90,270,fill=(255,245,180))
              d.text((x-20,y+23),label,fill='black',font=font)
          d.ellipse((142,37,498,323),outline=(150,150,150),width=2)
          d.text((18,334),'One new moon to the next is about 29.5 days (synodic month).',fill='black',font=font)
          save(im,'lunar-phases-cycle.webp')

          im=Image.new('RGB',(W,H),'white'); d=ImageDraw.Draw(im)
          d.text((20,16),'Spring tides vs neap tides',fill='black',font=font)
          d.rectangle((20,50,310,320),outline=(180,180,180),width=2); d.text((35,62),'SPRING: larger tidal range',fill='black',font=font)
          d.ellipse((132,150,198,216),fill=(150,205,245),outline=(40,90,150),width=2)
          d.ellipse((118,162,212,204),outline=(40,120,180),width=3)
          d.ellipse((45,165,75,195),fill=(255,205,70),outline=(150,110,20)); d.text((40,202),'Sun',fill='black',font=font)
          d.ellipse((250,169,272,191),fill=(210,210,210),outline=(70,70,70)); d.text((239,202),'Moon',fill='black',font=font)
          d.text((57,275),'Sun-Earth-Moon aligned',fill='black',font=font)
          d.rectangle((330,50,620,320),outline=(180,180,180),width=2); d.text((345,62),'NEAP: smaller tidal range',fill='black',font=font)
          d.ellipse((442,150,508,216),fill=(150,205,245),outline=(40,90,150),width=2)
          d.ellipse((432,158,518,208),outline=(40,120,180),width=3)
          d.ellipse((355,165,385,195),fill=(255,205,70),outline=(150,110,20)); d.text((350,202),'Sun',fill='black',font=font)
          d.ellipse((464,92,486,114),fill=(210,210,210),outline=(70,70,70)); d.text((450,75),'Moon',fill='black',font=font)
          d.line((475,120,475,144),fill=(70,70,70),width=2); d.line((397,183,430,183),fill=(70,70,70),width=2)
          d.text((365,275),'Sun and Moon about 90° apart',fill='black',font=font)
          save(im,'spring-neap-tides.webp')

          path=Path('year7/science/ac9s7u03-model-cyclic-changes-in-the-relative-positions-of-the-earth/index.html')
          text=path.read_text(encoding='utf-8')
          inserts={
            '<section class="curriculum-topic-section"><h2>1. Earth\'s tilt, orbit and seasons — E1</h2>': '<section class="curriculum-topic-section"><h2>1. Earth\'s tilt, orbit and seasons — E1</h2><figure class="science-premium-diagram"><img src="/assets/illustrations/science/earth-axial-tilt-seasons.webp" alt="Earth orbiting the Sun while its axis keeps a fixed tilt direction, explaining seasonal changes in Sun angle and day length" width="640" height="360" loading="lazy" decoding="async"><figcaption>Earth’s axis stays tilted in nearly the same direction through its orbit. This changes sunlight angle and day length in each hemisphere.</figcaption></figure>',
            '<section class="curriculum-topic-section"><h2>2. Tides and gravitational attraction — E2</h2>': '<section class="curriculum-topic-section"><h2>2. Tides and gravitational attraction — E2</h2><figure class="science-premium-diagram"><img src="/assets/illustrations/science/spring-neap-tides.webp" alt="Side-by-side diagram comparing aligned Sun Earth Moon positions for spring tides with right-angle Sun and Moon positions for neap tides" width="640" height="360" loading="lazy" decoding="async"><figcaption>Spring tides occur when solar and lunar tidal effects reinforce; neap tides occur when their directions are roughly at right angles.</figcaption></figure>',
            '<section class="curriculum-topic-section"><h2>3. Lunar phases — E3</h2>': '<section class="curriculum-topic-section"><h2>3. Lunar phases — E3</h2><figure class="science-premium-diagram"><img src="/assets/illustrations/science/lunar-phases-cycle.webp" alt="Moon orbiting Earth with incoming sunlight showing the sequence from new moon through quarter and full moon phases" width="640" height="360" loading="lazy" decoding="async"><figcaption>Moon phases come from our changing view of the Moon’s sunlit half as it orbits Earth, not from Earth’s shadow.</figcaption></figure>'
          }
          for needle,repl in inserts.items():
              assert needle in text, needle
              text=text.replace(needle,repl,1)
          path.write_text(text,encoding='utf-8')
          print('PASS: added 3 high-yield astronomy visuals')
          PY
      - name: Validate assets and page
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('year7/science/ac9s7u03-model-cyclic-changes-in-the-relative-positions-of-the-earth/index.html').read_text(encoding='utf-8')
          for name in ['earth-sun-moon-alignment.webp','earth-axial-tilt-seasons.webp','lunar-phases-cycle.webp','spring-neap-tides.webp']:
              p=Path('assets/illustrations/science')/name
              assert p.exists(),name
              assert p.stat().st_size <= 60*1024,(name,p.stat().st_size)
              assert name in page,name
          assert page.count('science-premium-diagram') >= 4
          print('PASS: AC9S7U03 has 4 distinct instructional visuals, all lightweight')
          PY
      - name: Commit static outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrations/science year7/science/ac9s7u03-model-cyclic-changes-in-the-relative-positions-of-the-earth/index.html
          git commit -m "Add high-yield Earth Sun Moon teaching visuals"
          git push
