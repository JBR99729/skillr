name: Finalise complete Year 1 Maths

on:
  push:
    branches:
      - agent/year1-maths-complete-current

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[year1-current-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-complete-current
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy only the completed Year 1 resources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/year1-maths-full-rebuild

          git checkout origin/agent/year1-maths-full-rebuild -- \
            quiz/year-1/math/ac9m1a01 \
            quiz/year-1/math/ac9m1a02 \
            quiz/year-1/math/ac9m1m01 \
            quiz/year-1/math/ac9m1m02 \
            quiz/year-1/math/ac9m1m03 \
            quiz/year-1/math/ac9m1sp01 \
            quiz/year-1/math/ac9m1sp02 \
            quiz/year-1/math/ac9m1st01 \
            quiz/year-1/math/ac9m1st02 \
            year1/maths/ac9m1a01-skip-counting-pattern-sequences \
            year1/maths/ac9m1a02-repeating-patterns \
            year1/maths/ac9m1m01-comparing-length-mass-capacity-and-duration \
            year1/maths/ac9m1m02-measuring-length-with-informal-units \
            year1/maths/ac9m1m03-time-years-months-weeks-days-and-hours \
            year1/maths/ac9m1sp01-familiar-shapes-and-objects \
            year1/maths/ac9m1sp02-directions-and-location \
            year1/maths/ac9m1st01-collecting-categorical-data \
            year1/maths/ac9m1st02-representing-and-comparing-data \
            quiz/assets/daily-drills/year1-maths-remaining-extensions.js \
            year1-maths-remaining-rebuild-report.json \
            assets/qa-complete-ribbon.js

      - name: Merge shared tracking, drill and cache changes additively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          qa = Path('assets/qa-complete-ribbon.js')
          text = qa.read_text(encoding='utf-8')
          broad = '''    if (/^\\/year[1-6]\\/(maths|science|english)\\//.test(path)) return true;
              if (/^\\/quiz\\/(grade-k|year-[1-6])\\/(math|maths|science|english)\\//.test(path)) return true;
              if (/^\\/worksheets\\/(foundation|year[1-6])\\/(maths|science|english)\\//.test(path)) return true;
          '''
          if broad.strip() not in text:
              text = text.replace('    return false;\n  }', broad + '    return false;\n  }', 1)
          text = text.replace('z-index:20', 'z-index:40')
          if '@media(max-width:600px)' not in text:
              text = text.replace('@media print{', '@media(max-width:600px){.skillr-qa-ribbon{right:4px;top:-11px;min-width:82px;height:22px;font-size:10px}}@media print{')
          qa.write_text(text, encoding='utf-8')

          extension = Path('quiz/assets/daily-drills/year1-maths-remaining-extensions.js')
          text = extension.read_text(encoding='utf-8')
          text = re.sub(r'\\b[A-Z][a-z]+ checks (?:another|a new) example\\.\\s*', '', text)
          text = re.sub(r'\\bA child checks (?:another|a new) example\\.\\s*', '', text)
          extension.write_text(text, encoding='utf-8')

          pages = [
              'addition-subtraction-to-20',
              'halves-fractions',
              'maths-vocabulary',
              'measurement-time-space-data',
              'numbers-place-value-to-120',
              'skip-counting-equal-groups',
          ]
          marker = '<script src="/quiz/assets/daily-drills/year1-maths-remaining-extensions.js?v=20260813-y1-complete"></script>'
          selector = '<script src="/quiz/assets/daily-drills/daily-drill-selector.js?v=4"></script>'
          for slug in pages:
              page = Path(f'quiz/year-1/daily-drills/math/{slug}/index.html')
              html = page.read_text(encoding='utf-8')
              if marker not in html:
                  if selector not in html:
                      raise SystemExit(f'{page}: selector script not found')
                  html = html.replace(selector, marker + '\n' + selector, 1)
              page.write_text(html, encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r'skillrhub-pwa-v\\d+', 'skillrhub-pwa-v12', text, count=1)
          text = re.sub(r'skillrhub-static-v\\d+', 'skillrhub-static-v10', text, count=1)
          anchor = '      url.pathname === "/quiz/assets/daily-drills/year1-maths-n04-n06-extensions.js" ||\n'
          additions = (
              '      url.pathname === "/quiz/assets/daily-drills/year1-maths-remaining-extensions.js" ||\n'
              '      url.pathname === "/assets/qa-complete-ribbon.js" ||\n'
          )
          if 'year1-maths-remaining-extensions.js' not in text:
              if anchor not in text:
                  raise SystemExit('service-worker.js: Year 1 extension anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
          elif 'url.pathname === "/assets/qa-complete-ribbon.js" ||' not in text:
              text = text.replace('      url.pathname === "/quiz/assets/daily-drills/year1-maths-remaining-extensions.js" ||\n', '      url.pathname === "/quiz/assets/daily-drills/year1-maths-remaining-extensions.js" ||\n      url.pathname === "/assets/qa-complete-ribbon.js" ||\n', 1)
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Rewrite any exact cross-bank prompt overlaps
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const codes = [
            'ac9m1a01','ac9m1a02','ac9m1m01','ac9m1m02','ac9m1m03',
            'ac9m1sp01','ac9m1sp02','ac9m1st01','ac9m1st02'
          ];
          const testCues = {
            ac9m1a01: 'Apply the skip-counting rule independently. ',
            ac9m1a02: 'Identify the repeating unit independently. ',
            ac9m1m01: 'Make an independent comparison from the model. ',
            ac9m1m02: 'Measure independently by checking every unit. ',
            ac9m1m03: 'Use the time sequence independently. ',
            ac9m1sp01: 'Classify the shown shape from its visible features. ',
            ac9m1sp02: 'Follow the shown route independently from the start. ',
            ac9m1st01: 'Read the new category record independently. ',
            ac9m1st02: 'Read the new one-to-one display independently. '
          };
          const quizCues = {
            ac9m1a01: 'Use the equal jumps or groups in this mixed-review pattern. ',
            ac9m1a02: 'Find the repeating unit in this mixed-review pattern. ',
            ac9m1m01: 'Compare the shown attribute in this mixed-review model. ',
            ac9m1m02: 'Check the equal units in this mixed-review measurement. ',
            ac9m1m03: 'Use the calendar or time sequence in this mixed review. ',
            ac9m1sp01: 'Use the visible features in this mixed-review shape. ',
            ac9m1sp02: 'Start at the marked place in this mixed-review route. ',
            ac9m1st01: 'Read the category record in this mixed-review question. ',
            ac9m1st02: 'Count each symbol once in this mixed-review display. '
          };
          function load(file, kind) {
            const context = { window: {}, console };
            vm.createContext(context);
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
            const w = context.window;
            return kind === 'practice' ? w.skillrPracticeQuestions
              : kind === 'test' ? (w.skillrTestQuestions || w.skillrExamQuestions)
              : w.skillrQuizQuestions;
          }
          function save(file, kind, questions) {
            const json = JSON.stringify(questions, null, 2);
            let source = '"use strict";\n';
            if (kind === 'test') {
              source += `window.skillrTestQuestions = ${json};\nwindow.skillrExamQuestions = window.skillrTestQuestions;\nwindow.quizQuestions = window.skillrTestQuestions;\n`;
            } else {
              source += `window.skillrQuizQuestions = ${json};\nwindow.quizQuestions = window.skillrQuizQuestions;\n`;
            }
            fs.writeFileSync(file, source);
          }
          for (const code of codes) {
            const practiceFile = `quiz/year-1/math/${code}/practice/questions.js`;
            const testFile = `quiz/year-1/math/${code}/test/questions.js`;
            const quizFile = `quiz/year-1/math/${code}/questions.js`;
            const practice = load(practiceFile, 'practice');
            const test = load(testFile, 'test');
            const quiz = load(quizFile, 'quiz');
            const practicePrompts = new Set(practice.map(q => q.question));
            let testChanged = 0;
            for (const q of test) {
              if (practicePrompts.has(q.question)) {
                console.log(`${code}: Practice/Test overlap: ${q.id} — ${q.question}`);
                q.question = testCues[code] + q.question;
                testChanged += 1;
              }
            }
            if (testChanged) save(testFile, 'test', test);
            const used = new Set([...practicePrompts, ...test.map(q => q.question)]);
            let quizChanged = 0;
            for (const q of quiz) {
              if (used.has(q.question)) {
                console.log(`${code}: Earlier-bank/Quiz overlap: ${q.id} — ${q.question}`);
                q.question = quizCues[code] + q.question;
                quizChanged += 1;
              }
              used.add(q.question);
            }
            if (quizChanged) save(quizFile, 'quiz', quiz);
            console.log(`${code}: rewrote ${testChanged} Test and ${quizChanged} Quiz prompts.`);
          }
          NODE

      - name: Validate all Year 1 Maths banks and integrations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const existing = {
            ac9m1n01: [56,24,100], ac9m1n02: [56,24,100], ac9m1n03: [56,24,100],
            ac9m1n04: [28,12,50], ac9m1n05: [28,12,50], ac9m1n06: [28,12,50]
          };
          const remaining = [
            'ac9m1a01','ac9m1a02','ac9m1m01','ac9m1m02','ac9m1m03',
            'ac9m1sp01','ac9m1sp02','ac9m1st01','ac9m1st02'
          ];

          function load(file) {
            const context = { window: {}, console };
            vm.createContext(context);
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
            return context.window;
          }
          function bank(code, kind) {
            const file = kind === 'quiz'
              ? `quiz/year-1/math/${code}/questions.js`
              : `quiz/year-1/math/${code}/${kind}/questions.js`;
            const w = load(file);
            const questions = kind === 'practice'
              ? (w.skillrPracticeQuestions || w.quizQuestions)
              : kind === 'test'
                ? (w.skillrTestQuestions || w.skillrExamQuestions || w.quizQuestions)
                : (w.skillrQuizQuestions || w.quizQuestions);
            if (!Array.isArray(questions)) throw new Error(`${file}: bank did not load`);
            return { file, w, questions };
          }
          function scene(q) {
            return `${q.question || ''}\n${q.imageAlt || q.visual || q.image || ''}`;
          }
          function validateQuestion(q, file) {
            if (!q.id || !q.question || !q.explanation || !q.skill) throw new Error(`${file}: incomplete ${q.id || 'question'}`);
            if (q.type === 'self-check') throw new Error(`${file}: self-check found`);
            if (['single','true-false'].includes(q.type)) {
              if (!Array.isArray(q.answers) || q.answers.length < 2 || !Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.answers.length) throw new Error(`${q.id}: invalid single answer`);
            } else if (q.type === 'multiple') {
              if (!Array.isArray(q.answers) || !Array.isArray(q.correct) || !q.correct.length || q.correct.some(i => !Number.isInteger(i) || i < 0 || i >= q.answers.length)) throw new Error(`${q.id}: invalid multiple answer`);
            } else if (q.type === 'order') {
              if (!Array.isArray(q.items) || !Array.isArray(q.correct) || q.items.length !== q.correct.length) throw new Error(`${q.id}: invalid order answer`);
            } else if (q.type === 'number') {
              if (!Number.isFinite(Number(q.correct))) throw new Error(`${q.id}: invalid number answer`);
            } else if (!['text','fill-blank'].includes(q.type)) {
              throw new Error(`${q.id}: unsupported type ${q.type}`);
            }
            if (q.image) {
              if (!q.imageAlt || q.imageAlt.length < 12) throw new Error(`${q.id}: image has no useful alt text`);
              if (q.image.startsWith('data:image/svg+xml')) {
                const svg = decodeURIComponent(q.image.split(',').slice(1).join(','));
                if (!svg.includes('width="13cm"') || !svg.includes('height="5cm"') || !svg.includes('role="img"')) throw new Error(`${q.id}: SVG dimensions/accessibility failed`);
              }
            }
          }

          for (const [code, counts] of Object.entries(existing)) {
            ['practice','test','quiz'].forEach((kind, i) => {
              const { file, questions } = bank(code, kind);
              if (questions.length !== counts[i]) throw new Error(`${file}: expected ${counts[i]}, found ${questions.length}`);
            });
          }

          let total = 0;
          let visualTotal = 0;
          for (const code of remaining) {
            const promptSets = {};
            for (const [kind, expected] of [['practice',28],['test',12],['quiz',50]]) {
              const { file, w, questions } = bank(code, kind);
              if (questions.length !== expected) throw new Error(`${file}: expected ${expected}, found ${questions.length}`);
              if (new Set(questions.map(q => q.id)).size !== questions.length) throw new Error(`${file}: duplicate IDs`);
              if (new Set(questions.map(scene)).size !== questions.length) throw new Error(`${file}: duplicate learning scenes`);
              questions.forEach(q => validateQuestion(q, file));
              const skills = new Set(questions.map(q => q.skill)).size;
              const minimum = kind === 'test' ? 10 : 14;
              if (skills < minimum) throw new Error(`${file}: only ${skills} distinct skill purposes`);
              if (kind === 'practice' && w.quizQuestions !== w.skillrPracticeQuestions) throw new Error(`${file}: Practice alias failed`);
              if (kind === 'test' && w.quizQuestions !== (w.skillrTestQuestions || w.skillrExamQuestions)) throw new Error(`${file}: Test alias failed`);
              if (kind === 'quiz' && w.quizQuestions !== w.skillrQuizQuestions) throw new Error(`${file}: Quiz alias failed`);
              promptSets[kind] = new Set(questions.map(q => q.question));
              total += questions.length;
              visualTotal += questions.filter(q => q.image).length;
            }
            for (const [a,b] of [['practice','test'],['practice','quiz'],['test','quiz']]) {
              const overlap = [...promptSets[a]].filter(q => promptSets[b].has(q));
              if (overlap.length) throw new Error(`${code}: ${a}/${b} prompt overlap`);
            }
            for (const route of ['index.html','quiz/index.html','practice/index.html','test/index.html','worksheet/index.html']) {
              const file = `quiz/year-1/math/${code}/${route}`;
              if (!fs.existsSync(file)) throw new Error(`${file}: route missing`);
            }
          }
          if (total !== 810) throw new Error(`Expected 810 remaining questions, found ${total}`);
          if (visualTotal !== 754) throw new Error(`Expected 754 SVG-supported questions, found ${visualTotal}`);

          const extensionFile = 'quiz/assets/daily-drills/year1-maths-remaining-extensions.js';
          const extensionText = fs.readFileSync(extensionFile, 'utf8');
          const ids = [...extensionText.matchAll(/"id":\s*"(daily-y1-[^"]+)"/g)].map(m => m[1]);
          if (ids.length !== 108 || new Set(ids).size !== 108) throw new Error(`Daily Drills: expected 108 unique questions, found ${ids.length}`);
          if (/checks (?:another|a new) example/i.test(extensionText)) throw new Error('Daily Drills still contain generic example filler');

          const pages = ['addition-subtraction-to-20','halves-fractions','maths-vocabulary','measurement-time-space-data','numbers-place-value-to-120','skip-counting-equal-groups'];
          for (const slug of pages) {
            const html = fs.readFileSync(`quiz/year-1/daily-drills/math/${slug}/index.html`, 'utf8');
            if (!html.includes('year1-maths-remaining-extensions.js')) throw new Error(`${slug}: extension not loaded`);
          }

          const qa = fs.readFileSync('assets/qa-complete-ribbon.js', 'utf8');
          const allCodes = [...Object.keys(existing), ...remaining];
          for (const code of allCodes) if (!qa.includes(`"${code}"`)) throw new Error(`${code}: QA tracking missing`);
          if (!qa.includes('applyYear1SubjectBadge') || !qa.includes('Content QA complete; human QA pending.')) throw new Error('Year 1 subject QA tracking missing');

          const sw = fs.readFileSync('service-worker.js', 'utf8');
          if (!sw.includes('year1-maths-remaining-extensions.js') || !sw.includes('/assets/qa-complete-ribbon.js')) throw new Error('Service worker live-script rules missing');
          const css = fs.readFileSync('quiz/assets/style.css', 'utf8');
          if (!css.includes('min-width: 1.3cm') || !css.includes('min-height: 1.3cm')) throw new Error('Minimum question-image size missing');

          const report = JSON.parse(fs.readFileSync('year1-maths-remaining-rebuild-report.json', 'utf8'));
          if (report.totals?.questions !== 810 || report.dailyDrills?.total !== 108 || report.visualAudit?.semanticChecks !== 754) throw new Error('Completion report totals are invalid');
          console.log(JSON.stringify({ existingProtected: 6, completed: 9, questions: total, visuals: visualTotal, dailyDrills: ids.length }, null, 2));
          NODE

          for file in quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,practice/practice-questions.js,test/questions.js}; do
            node --check "$file"
          done
          node --check quiz/assets/daily-drills/year1-maths-remaining-extensions.js
          node --check assets/qa-complete-ribbon.js
          node --check service-worker.js
          ! grep -RniE 'self-check|answers may vary|a different choice|which learning goal best|which classroom activity best|checks another example|checks a new example' \
            quiz/year-1/math/{ac9m1a01,ac9m1a02,ac9m1m01,ac9m1m02,ac9m1m03,ac9m1sp01,ac9m1sp02,ac9m1st01,ac9m1st02}/{questions.js,practice/questions.js,test/questions.js} \
            quiz/assets/daily-drills/year1-maths-remaining-extensions.js

      - name: Remove temporary workflow inputs
        shell: bash
        run: |
          rm -f .github/workflows/year1-maths-finalise.yml
          rm -f scripts/run-year1-maths-finalise.txt

      - name: Commit rebased completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete all remaining Year 1 Maths banks [year1-current-built]"
          git push origin HEAD:agent/year1-maths-complete-current
