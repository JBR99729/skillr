name: Year 1 English batch 1 topic-page browser QA
on:
  pull_request:
    paths:
      - 'year1/english/ac9e1la*/index.html'
      - 'assets/css/year1-english-topic-pages.css'
      - 'assets/topic-visuals/year1/**'
      - 'assets/teaching-models/year1/**'
      - 'assets/topic-visuals/reused/growing-plants.webp'
      - '.github/workflows/year1-english-topic-pages-batch1-browser-qa.yml'
      - 'scripts/qa_year1_english_topic_pages_batch1_browser.cjs'
      - 'docs/qa/year1-english-topic-pages-batch1-20261110/inventory.json'
permissions:
  contents: read
concurrency:
  group: year1-english-topic-pages-batch1-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check 10 authored pages at three screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/year1-english-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/qa_year1_english_topic_pages_batch1_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year1-english-topic-pages-batch1-browser
          path: artifacts/year1-english-topic-pages-batch1-browser/
          retention-days: 7
