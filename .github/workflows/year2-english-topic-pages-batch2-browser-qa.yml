name: Year 2 English batch 2 topic-page browser QA
on:
  pull_request:
    paths:
      - 'year2/english/ac9e2le*/index.html'
      - 'year2/english/ac9e2ly0*/index.html'
      - 'assets/css/year2-english-topic-pages-batch2.css'
      - 'assets/topic-visuals/year1/**'
      - 'assets/teaching-models/year1/**'
      - 'assets/topic-visuals/reused/growing-plants.webp'
      - '.github/workflows/year2-english-topic-pages-batch2-browser-qa.yml'
      - 'scripts/qa_year2_english_topic_pages_batch2_browser.cjs'
      - 'docs/qa/year2-english-topic-pages-batch2-20261110/inventory.json'
permissions:
  contents: read
concurrency:
  group: year2-english-topic-pages-batch2-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check 10 authored pages at three screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/year2-english-batch2-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/qa_year2_english_topic_pages_batch2_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year2-english-topic-pages-batch2-browser
          path: artifacts/year2-english-topic-pages-batch2-browser/
          retention-days: 7
