name: Year 7 Maths final close v8 2026-09-10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/year7-maths-final-close-v8-20260910.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Reconcile current authored banks and fill genuine gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/year7-maths-final-close-v6-20260910.yml').read_text().splitlines()
          target='Reconcile current authored banks and fill genuine gaps'
          i=next(i for i,x in enumerate(src) if x.strip()==f'- name: {target}')
          j=next(j for j in range(i+1,len(src)) if src[j].startswith('        run: |'))+1
          body=[]
          while j<len(src) and not src[j].startswith('      - name: ') and not src[j].startswith('      - uses: '):
              body.append(src[j][10:] if src[j].startswith('          ') else src[j]); j+=1
          Path('/tmp/reconcile.sh').write_text('set -euo pipefail\n'+'\n'.join(body)+'\n')
          PY
          bash /tmp/reconcile.sh
      - name: Repair distractors and synchronise canonical live and legacy banks
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/year7-maths-final-close-v6-20260910.yml').read_text().splitlines()
          target='Repair duplicate distractors and synchronise every bank surface'
          i=next(i for i,x in enumerate(src) if x.strip()==f'- name: {target}')
          j=next(j for j in range(i+1,len(src)) if src[j].startswith('        run: |'))+1
          body=[]
          while j<len(src) and not src[j].startswith('      - name: ') and not src[j].startswith('      - uses: '):
              body.append(src[j][10:] if src[j].startswith('          ') else src[j]); j+=1
          Path('/tmp/sync.sh').write_text('set -euo pipefail\n'+'\n'.join(body)+'\n')
          PY
          bash /tmp/sync.sh
      - name: Correct AC9M7N01 at every source layer and rebuild all learning surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          # 1) Legacy curriculum data is the base layer used to build deep-dive/apply content.
          p=Path('assets/year7-maths-data-n.js'); s=p.read_text()
          start=s.index('    AC9M7N01:{'); end=s.index('    AC9M7N02:{',start)
          old=s[start:end]
          new='''    AC9M7N01:{
      slug:"ac9m7n01-the-relationship-between-perfect-square-numbers-and-square",
      title:"Perfect Squares and Square Roots",
      subtitle:"Connect square arrays, exponent notation, exact square roots and practical square problems",
      desc:"describe the relationship between perfect square numbers and square roots, and use squares and square roots of perfect square numbers to solve problems",
      core:"A perfect square is n² for a natural number n, and the principal square root reverses that relationship: √(n²)=n for n≥0.",
      modelTitle:"Connect a square array with square and root notation",
      modelVisual:{type:"square-array",n:12},
      modelNote:"A 12 by 12 array contains 144 units, so 12²=144 and √144=12. The root identifies the side length of a square with known perfect-square area.",
      applyTitle:"Use exact square roots to solve square problems",
      applyVisual:{type:"table",data:[["task","reasoning"],["square area 144","side=√144=12"],["perimeter","4×12=48 units"],["square area 324","side=√324=18"],["perimeter","4×18=72 units"]]},
      applyNote:"For a square with perfect-square area, the principal square root recovers the whole-number side length. Then use that side to solve related perimeter, area or tiling questions.",
      terms:[["perfect square","number obtained by multiplying a natural number by itself"],["square root","non-negative number whose square equals the given number"],["exponent","small raised number showing repeated multiplication"]],
      mistakes:[["√a is treated as a÷2","A square root asks which non-negative number squares to a."],["A square root is confused with the original square","Squaring and taking the principal square root are inverse operations for non-negative values."],["Every whole number has a whole-number root","Only perfect squares have whole-number square roots."],["Area and perimeter confused","Use √area for side length, then multiply by 4 for perimeter."]],
      quick:["List squares from 1² to 15².","Explain √196.","Use area 324 to find a square side.","Use side 18 to find area.","Use area 225 to find a square perimeter."],
      correctExample:"Because 18²=324, √324=18; a square of area 324 m² has side 18 m and perimeter 72 m",
      fillTemplate:"If n²=144 and n≥0, then n={{blank}}.",
      enrichment1:"Show visually why consecutive square numbers differ by consecutive odd numbers, then use the pattern to generate the next five perfect squares.",
      enrichment2:"Compare two exact methods for recovering the side lengths of squares with areas 225 and 400. Explain how the inverse relationship verifies each result."
    },
'''
          s=s[:start]+new+s[end:]; p.write_text(s)

          # 2) Authored override layer: replace the entire N01 object robustly, not fragile string substitutions.
          p=Path('scripts/year7-maths-topic-v2-number-a01-overrides.mjs'); s=p.read_text()
          start=s.index('AC9M7N01:{'); end=s.index('AC9M7N02:',start)
          n01='''AC9M7N01:{
  ...pack([
    ex("Find the side and perimeter of a square",["Identify the area: 196 cm².","Use side = √area, so side = √196.","Because 14² = 196, the side is 14 cm.","Calculate perimeter: 4 × 14 = 56 cm."],"The side is 14 cm and the perimeter is 56 cm.","Multiply 14 × 14 to recover the given area, 196 cm²."),
    ex("Use a square root in a problem",["Identify the square area: 324 m².","Use side = √area.","Because 18² = 324, the side is 18 m.","Perimeter = 4 × 18 = 72 m."],"The side is 18 m and the perimeter is 72 m.","Check 18 × 18 = 324 before calculating the perimeter.")
  ],[
    q(1,"Write 9² as multiplication and calculate it.","9 × 9 = 81.","Squaring uses the same factor twice.","Multiply 9 by 9."),
    q(1,"Find √121 and justify it.","√121 = 11 because 11 × 11 = 121.","The principal square root is non-negative.","Think of 11 squared."),
    q(1,"Which of 36, 40, 49 and 50 are perfect squares?","36 and 49, because 36 = 6² and 49 = 7².","Perfect squares are products n × n.","Test nearby whole-number squares."),
    q(2,"A square tile has area 169 cm². Find its side length.","The side is √169 = 13 cm.","A square's side is the principal square root of its area.","Find the number whose square is 169."),
    q(2,"A square has area 529 cm². Find its side length and explain the inverse relationship used.","23 cm, because 23² = 529, so √529 = 23.","Square root reverses squaring for a perfect square.","Find the whole number whose square is 529."),
    q(2,"A square courtyard has side 18 m. Find its area.","18² = 324, so the area is 324 m².","Area uses square units.","Multiply the side by itself."),
    q(2,"A square has area 256 cm². Find its perimeter.","The side is √256 = 16 cm, so perimeter = 4 × 16 = 64 cm.","Find the side before the perimeter.","Use √area, then multiply by 4."),
    q(3,"A square park has a whole-number side and area strictly between 400 m² and 500 m². List all possibilities.","The possible sides are 21 m and 22 m, giving 441 m² and 484 m².","Only whole-number squares in the interval qualify.","Test successive whole-number squares."),
    q(3,"Two square gardens have areas 144 m² and 225 m². Compare their perimeters.","Their sides are 12 m and 15 m; perimeters are 48 m and 60 m, so the second is 12 m greater.","Square roots convert areas to sides before perimeter comparison.","Find both roots, then multiply each by 4.")
  ],"A square garden has area 225 m². Find its side and perimeter.","The side is √225 = 15 m and the perimeter is 4 × 15 = 60 m.","Use area → square root → side → perimeter."),
  successCriteria:["I can recognise and generate perfect squares.","I can explain how a principal square root reverses squaring.","I can use exact square roots of perfect squares to solve side, area and perimeter problems."],
  deepDive:["A perfect square is made by multiplying a natural number by itself. Square arrays show this structure directly: 12 rows of 12 make 144, so 12² = 144.","The principal square root reverses squaring for non-negative values. Because 12² = 144, √144 = 12. This inverse relationship lets us recover the side length of a square when its area is a perfect square.","In square contexts, keep units meaningful: area uses square units, side length uses linear units and perimeter is four times the side. A complete solution can be checked by squaring the recovered side or substituting it back into the context."]
},
'''
          s=s[:start]+n01+s[end:]; p.write_text(s)

          # 3) Builder hard-code: exact N01 application visual must stay inside the perfect-square scope.
          p=Path('scripts/build_year7_maths_topic_modules_v2.mjs'); s=p.read_text()
          old='''    {id:`${code.toLowerCase()}-application`,type:"rootBounds",parameters:{lower:64,value:70,upper:81,lowerRoot:8,upperRoot:9},alt:"A number line showing 70 between the perfect squares 64 and 81, so the square root of 70 lies between 8 and 9."}'''
          new='''    {id:`${code.toLowerCase()}-application`,type:"squareArray",parameters:{side:18,total:324},alt:"An 18 by 18 square array containing 324 small squares, showing that 18 squared equals 324 and the principal square root of 324 equals 18."}'''
          if old not in s: raise SystemExit('N01 builder rootBounds source not found')
          p.write_text(s.replace(old,new))
          PY
          node scripts/build_year7_maths_topic_modules_v2.mjs
      - name: Validate all 30 codes and exact N01 generated scope
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const codes=[...Array.from({length:9},(_,i)=>`AC9M7N${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7A${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7M${String(i+1).padStart(2,'0')}`),...Array.from({length:4},(_,i)=>`AC9M7SP${String(i+1).padStart(2,'0')}`),...Array.from({length:3},(_,i)=>`AC9M7ST${String(i+1).padStart(2,'0')}`),...Array.from({length:2},(_,i)=>`AC9M7P${String(i+1).padStart(2,'0')}`)];
          const norm=s=>String(s||'').toLowerCase().replace(/<[^>]+>/g,' ').replace(/[^a-z0-9%√π]+/g,' ').replace(/\s+/g,' ').trim();
          const fail=[];
          function live(file,name){const c={};c.window=c;vm.createContext(c);vm.runInContext(fs.readFileSync(file,'utf8'),c,{filename:file});return c[name]||c.quizQuestions||[]}
          for(const code of codes){
            const l=code.toLowerCase(),all=JSON.parse(fs.readFileSync(`assets/assessment-banks/year7/math/${l}.json`,'utf8')),P=all.filter(x=>x.bank==='practice'),T=all.filter(x=>x.bank==='test');
            const ps=P.map(x=>norm(x.question)),ts=T.map(x=>norm(x.question)),pSet=new Set(ps);
            if(P.length!==48||T.length!==16)fail.push(`${code}: canonical counts ${P.length}/${T.length}`);
            if(new Set(ps).size!==48||new Set(ts).size!==16)fail.push(`${code}: duplicate stems`);
            if(ts.some(s=>pSet.has(s)))fail.push(`${code}: Practice/Test overlap`);
            for(const x of all){if(x.curriculum_code!==code)fail.push(`${code}: curriculum mismatch ${x.id}`);if(!Array.isArray(x.answers)||x.answers.filter(y=>y.is_correct).length!==1)fail.push(`${code}: answer integrity ${x.id}`);if(Array.isArray(x.answers)&&new Set(x.answers.map(y=>String(y.text))).size!==x.answers.length)fail.push(`${code}: duplicate option text ${x.id}`)}
            const LP=live(`quiz/year-7/math/${l}/practice/questions.js`,'skillrPracticeQuestions'),LG=live(`quiz/year-7/math/${l}/practice/practice-questions.js`,'skillrPracticeQuestions'),LT=live(`quiz/year-7/math/${l}/test/questions.js`,'skillrTestQuestions');
            if(LP.length!==48||LG.length!==48||LT.length!==16)fail.push(`${code}: live counts ${LP.length}/${LG.length}/${LT.length}`);
            if(LP.map(x=>norm(x.question)).join('|')!==ps.join('|')||LG.map(x=>norm(x.question)).join('|')!==ps.join('|'))fail.push(`${code}: practice parity`);
            if(LT.map(x=>norm(x.question)).join('|')!==ts.join('|'))fail.push(`${code}: test parity`);
          }
          const n01files=['year7/maths/ac9m7n01-the-relationship-between-perfect-square-numbers-and-square/index.html','year7/maths/ac9m7n01-the-relationship-between-perfect-square-numbers-and-square/teacher-slides/index.html','quiz/year-7/math/ac9m7n01/worksheet/index.html'];
          const n01=n01files.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const bad=/√70|√50|√43|non-perfect root|non-perfect square root|\(a\+b\)²|43²|distributive property/i;
          if(bad.test(n01))fail.push('AC9M7N01 generated learning surfaces still contain out-of-scope material');
          if(fail.length){console.error(fail.join('\n'));process.exit(1)}
          console.log('YEAR7_MATHS_ALL_30_CLOSURE_GATES_PASS');
          NODE
      - name: Mark all 30 Year 7 Maths codes Content Verified and regenerate summaries
        run: |
          node <<'NODE'
          const fs=require('fs');const p='data/content-verification-status.json',d=JSON.parse(fs.readFileSync(p,'utf8'));
          const codes=[...Array.from({length:9},(_,i)=>`AC9M7N${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7A${String(i+1).padStart(2,'0')}`),...Array.from({length:6},(_,i)=>`AC9M7M${String(i+1).padStart(2,'0')}`),...Array.from({length:4},(_,i)=>`AC9M7SP${String(i+1).padStart(2,'0')}`),...Array.from({length:3},(_,i)=>`AC9M7ST${String(i+1).padStart(2,'0')}`),...Array.from({length:2},(_,i)=>`AC9M7P${String(i+1).padStart(2,'0')}`)];
          d.reviewedCodes=[...new Set([...d.reviewedCodes,...codes])].sort();fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          node scripts/update_content_verification_status.mjs
      - name: Write final closure report and commit production
        run: |
          mkdir -p reports/year7-maths-research-authoring
          cat > reports/year7-maths-research-authoring/FINAL-CLOSURE-2026-09-10.md <<'EOF'
          # Year 7 Mathematics final closure — 10 September 2026

          **Status: CLOSED / CONTENT VERIFIED**

          All 30 Australian Curriculum Year 7 Mathematics codes (AC9M7N01–N09, A01–A06, M01–M06, SP01–SP04, ST01–ST03, P01–P02) are complete against the finished IXL Australia + Khan Academy research master.

          Closure gates passed:
          - exactly 48 unique Practice questions per code
          - exactly 16 unique separate Test questions per code
          - zero normalised Practice/Test stem duplication
          - canonical JSON, live Practice/Test and legacy Practice parity
          - one correct answer per item and unique answer-option text
          - Topic Guide, Classroom View and worksheet rebuilt for every Year 7 Maths code
          - AC9M7N01 corrected at legacy data, authored override and builder-visual layers so generated surfaces remain within perfect-square / exact-square-root scope
          - all 30 codes entered in the central Content Verified ledger
          - visible verification summaries regenerated

          The research master's documented source exceptions remain explicit evidence-boundary notes rather than unresolved research tasks. SkillrHub assessment wording is original.
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/assessment-banks/year7/math quiz/year-7/math year7/maths assets/year7-maths-data-n.js scripts/year7-maths-topic-v2-number-a01-overrides.mjs scripts/build_year7_maths_topic_modules_v2.mjs data/content-verification-status.json about.html editorial-standards.html llms.txt llms-full.txt ai-index.json reports/year7-maths-research-authoring/FINAL-CLOSURE-2026-09-10.md
          git commit -m 'Close all Year 7 Maths research-aligned authoring'
          git push
