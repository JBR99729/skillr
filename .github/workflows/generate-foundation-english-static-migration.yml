name: Generate Foundation English static migration

on:
  pull_request:
    paths:
      - 'scripts/migrate_foundation_english_static.mjs'
      - 'scripts/rebuild_foundation_english_student_facing.mjs'
      - 'scripts/validate_foundation_english_student_facing.mjs'
      - 'assets/foundation-english-student-facing-*.js'
      - '.github/workflows/generate-foundation-english-static-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore frozen Foundation Classroom Views
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=499c8a75ccf3f978892a2e74dfbaf89d485bf650
          git ls-tree -r --name-only HEAD foundation/english | grep '/teacher-slides/' | while read -r file; do
            git rm -f --ignore-unmatch -- "$file" >/dev/null || true
          done
          git ls-tree -r --name-only "$BASELINE" foundation/english | grep '/teacher-slides/' | while read -r file; do
            git checkout "$BASELINE" -- "$file"
          done
      - name: Verify authored Foundation English source assets exist
        run: |
          test -f assets/foundation-english-data.js
          test -f assets/foundation-english-topic-module-la-v2.js
          test -f assets/foundation-english-topic-module-le-ly1-v2.js
          test -f assets/foundation-english-topic-module-ly2-v2.js
          test -f assets/foundation-english-topic-module-core-v2.js
          test -f assets/foundation-canonical-v1.1.js
          test -f assets/foundation-english-student-facing-core.js
          test -f assets/foundation-english-student-facing-la.js
          test -f assets/foundation-english-student-facing-le.js
          test -f assets/foundation-english-student-facing-ly1.js
          test -f assets/foundation-english-student-facing-ly2.js
      - name: Validate student-facing banks
        run: node scripts/validate_foundation_english_student_facing.mjs
      - name: Generate student-facing Foundation English topic pages
        run: node scripts/rebuild_foundation_english_student_facing.mjs
      - name: Validate generated static architecture
        run: node scripts/validate_static_curriculum_architecture.mjs
      - name: Verify Foundation English topics no longer depend on runtime topic modules
        run: |
          if grep -R -E 'foundation-english-topic-module|foundation-english-classroom-v2|foundation-canonical-v1\.1\.js' foundation/english --include='index.html' --exclude-dir='teacher-slides'; then
            echo 'Legacy Foundation English runtime dependency remains in a topic page.'
            exit 1
          fi
      - name: Commit generated files to migration branch
        shell: bash
        run: |
          git add foundation/english
          if git diff --cached --quiet; then
            echo 'Generated output is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore frozen Foundation Classroom Views and refresh topics'
          git push origin HEAD:${GITHUB_HEAD_REF}
