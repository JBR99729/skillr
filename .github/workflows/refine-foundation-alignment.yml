name: Refine Foundation classroom alignment
on: push
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: pip install beautifulsoup4
      - name: Strengthen generated model and check prompts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          root=Path('.')
          refined=[]
          weak_markers=['pause after each worked example','read the topic guide','use this unit','open the live classroom','click','estimated lesson time']
          def clean(s):return re.sub(r'\s+',' ',s or '').strip()
          def clip(s,n=440):
            s=clean(s);return s if len(s)<=n else s[:n-1].rsplit(' ',1)[0]+'…'
          for cp in sorted(root.glob('foundation/*/*/teacher-slides/index.html')):
            src=cp.read_text(errors='ignore')
            if 'Teach, ask and check' not in src: continue
            soup=BeautifulSoup(src,'html.parser')
            target=None
            for d in soup.find_all('details'):
              if d.find('summary') and 'Teach, ask and check' in clean(d.find('summary').get_text(' ',strip=True)):
                target=d;break
            if not target:continue
            ps=target.find_all('p')
            modelp=next((p for p in ps if clean(p.get_text(' ',strip=True)).lower().startswith('model it:')),None)
            askp=next((p for p in ps if clean(p.get_text(' ',strip=True)).lower().startswith('ask the learner:')),None)
            lookp=next((p for p in ps if clean(p.get_text(' ',strip=True)).lower().startswith('look for:')),None)
            modeltxt=clean(modelp.get_text(' ',strip=True).split(':',1)[-1]) if modelp else ''
            # Prefer a concrete existing worked-example card from the same classroom.
            examples=[clean(p.get_text(' ',strip=True)) for p in soup.select('.example-card p') if len(clean(p.get_text(' ',strip=True)))>35]
            actual_questions=[]
            for h3 in soup.find_all(['h3','h2']):
              if clean(h3.get_text(' ',strip=True)).lower()=='questions':
                ul=h3.find_next('ul')
                if ul:actual_questions += [clean(li.get_text(' ',strip=True)) for li in ul.find_all('li',recursive=False)]
            hints=[]
            for h3 in soup.find_all(['h3','h2']):
              if 'review hints' in clean(h3.get_text(' ',strip=True)).lower():
                ul=h3.find_next('ul')
                if ul:hints += [clean(li.get_text(' ',strip=True)) for li in ul.find_all('li',recursive=False)]
            need_model=(not modeltxt) or any(m in modeltxt.lower() for m in weak_markers) or len(modeltxt)<45
            if need_model and examples and modelp:
              # Last card commonly contains the worked/think-aloud model; otherwise first substantive card.
              choice=examples[-1] if len(examples[-1])>=55 else examples[0]
              modelp.clear(); strong=soup.new_tag('strong'); strong.string='Model it:'; modelp.append(strong); modelp.append(' '+clip(choice,520))
            if askp and actual_questions:
              askp.clear(); strong=soup.new_tag('strong'); strong.string='Ask the learner:'; askp.append(strong); askp.append(' '+clip(actual_questions[0],420))
            if lookp and hints:
              lookp.clear(); strong=soup.new_tag('strong'); strong.string='Look for:'; lookp.append(strong); lookp.append(' '+clip(' '.join(hints[:2]),440))
            final='<!DOCTYPE html>\n'+str(soup) if src.lstrip().lower().startswith('<!doctype') and not str(soup).lstrip().lower().startswith('<!doctype') else str(soup)
            if final!=src:
              cp.write_text(final);refined.append(str(cp))
          print('refined',len(refined))
          assert refined
          PY
      - name: Commit refinement and clean workflow
        run: |
          rm .github/workflows/refine-foundation-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundation .github/workflows/refine-foundation-alignment.yml
          git commit -m 'content: refine Foundation classroom teaching prompts'
          git push origin HEAD:${{ github.ref_name }}
