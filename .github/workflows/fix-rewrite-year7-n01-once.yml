name: Fix Year 7 N01 rewrite runner once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rewrite-year7-n01-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix naming collision and retrigger N01 rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/rewrite-year7-maths-n01-once.yml')
          s=p.read_text()
          old="const test='\"use strict\";\\nwindow.skillrTestQuestions = '+JSON.stringify(T.map(live),null,2)+';\\nwindow.skillrExamQuestions = window.skillrTestQuestions;\\nwindow.quizQuestions = window.skillrTestQuestions;\\nn';"
          # Use narrowly targeted identifier replacements instead of relying on the full JS string.
          s=s.replace("const test='\"use strict\";", "const testJs='\"use strict\";")
          s=s.replace("fs.writeFileSync(`quiz/year-7/math/${lower}/test/questions.js`,test);", "fs.writeFileSync(`quiz/year-7/math/${lower}/test/questions.js`,testJs);")
          if "const testJs=" not in s or ",testJs);" not in s:
              raise SystemExit('Expected replacements not applied')
          p.write_text(s)
          PY
          git config user.name 'SkillrHub Authoring Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/rewrite-year7-maths-n01-once.yml
          git commit -m 'Fix AC9M7N01 rewrite runner'
          git push origin main
