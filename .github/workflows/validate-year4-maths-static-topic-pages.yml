name: Validate Year 4 Maths static topic pages

on:
  pull_request:
    paths:
      - 'year4/maths/**'
      - 'quiz/year-4/math/**'
      - 'assets/year4-maths-visuals.css'
      - 'scripts/validate_year4_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year4-maths-static-topic-pages.yml'
  push:
    branches: [ main ]
    paths:
      - 'year4/maths/**'
      - 'quiz/year-4/math/**'
      - 'assets/year4-maths-visuals.css'
      - 'scripts/validate_year4_maths_static_topic_pages.mjs'
      - '.github/workflows/validate-year4-maths-static-topic-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Year 4 Maths static topic pages
        run: node scripts/validate_year4_maths_static_topic_pages.mjs
