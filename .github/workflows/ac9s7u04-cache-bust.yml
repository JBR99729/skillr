name: Refresh AC9S7U04 live assets
on:
  push:
    branches: [fix/ac9s7u04-live-cache-bust]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ac9s7u04-live-cache-bust
          fetch-depth: 2
      - name: Add cache-busting asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('/assets/year7-science-premium.css?v=1','/assets/year7-science-premium.css?v=2')
          for name in [
            'balanced-unbalanced-forces.webp','lever-pulley-mechanical-advantage.webp',
            'orbital-gravity-path.webp','boomerang-airfoil-forces.webp','spearthrower-lever-speed.webp']:
              t=t.replace(f'/assets/illustrations/science/{name}"',f'/assets/illustrations/science/{name}?v=626"')
          assert t.count('?v=626') == 5
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add year7/science/ac9s7u04-investigate-and-represent-balanced-and-unbalanced-forces/index.html
          git commit -m 'Refresh AC9S7U04 live asset versions'
          git push
