name: Audit all curriculum resources
# Repository-wide regression gate. Inventory is discovered dynamically from static curriculum indexes.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-curriculum-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit every discovered curriculum code
        run: node scripts/run-corrected-curriculum-audit.js
      - name: Preserve existing Years 1-7 static architecture validator
        run: node scripts/audit_years1_7_curriculum_resources.mjs