name: Locate final AC9M7N01 generated residual 2026-09-10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/year7-n01-generated-residual-diagnostic-20260910.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply N01 source corrections, rebuild and print residuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/year7-maths-topic-v2-number-a01-overrides.mjs'); s=p.read_text()
          replacements=[
          ('ex("Bound a non-perfect square root",["Find the perfect square below 70: 8² = 64.","Find the next perfect square: 9² = 81.","Write 64 < 70 < 81.","Take roots to obtain 8 < √70 < 9."],"The square root of 70 lies between 8 and 9.","Squaring both bounds gives 64 < 70 < 81.")','ex("Use a square root in a problem",["Identify the square area: 324 m².","Use side = √area.","Because 18² = 324, the side is 18 m.","Perimeter = 4 × 18 = 72 m."],"The side is 18 m and the perimeter is 72 m.","Check 18 × 18 = 324 before calculating the perimeter.")'),
          ('q(2,"Place √50 between consecutive whole numbers.","7 < √50 < 8 because 49 < 50 < 64.","Adjacent perfect squares bound the root.","Compare 50 with 7² and 8².")','q(2,"A square has area 529 cm². Find its side length and explain the inverse relationship used.","23 cm, because 23² = 529, so √529 = 23.","Square root reverses squaring for a perfect square.","Find the whole number whose square is 529.")'),
          ('The principal square root reverses squaring by identifying the non-negative side length. Therefore √144 = 12, while a non-perfect root such as √70 can be bounded between nearby perfect squares.','The principal square root reverses squaring by identifying the non-negative side length. Therefore √144 = 12 because 12² = 144; exact square roots of perfect squares recover whole-number side lengths.'),
          ('I can bound a non-perfect root and solve related area or perimeter problems.','I can use exact square roots of perfect squares to solve related area or perimeter problems.')]
          for old,new in replacements: s=s.replace(old,new)
          p.write_text(s)
          b=Path('scripts/build_year7_maths_topic_modules_v2.mjs'); t=b.read_text()
          t=t.replace('visualBlock("rootBounds", { value: 70, lower: 64, upper: 81, lowerRoot: 8, upperRoot: 9, label: "Bound √70 between consecutive whole numbers" })','visualBlock("squareArray", { rows: 18, cols: 18, value: 324, label: "18 × 18 = 324, so √324 = 18" })')
          b.write_text(t)
          PY
          node scripts/build_year7_maths_topic_modules_v2.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('year7/maths/ac9m7n01-the-relationship-between-perfect-square-numbers-and-square/index.html'),Path('year7/maths/ac9m7n01-the-relationship-between-perfect-square-numbers-and-square/teacher-slides/index.html'),Path('quiz/year-7/math/ac9m7n01/worksheet/index.html')]
          pat=re.compile(r'√70|√50|bound a non-perfect|non-perfect root such as',re.I)
          found=0
          for f in files:
            text=f.read_text()
            for m in pat.finditer(text):
              found+=1
              a=max(0,m.start()-180); b=min(len(text),m.end()+220)
              print('\nFILE:',f)
              print(text[a:b].replace('\n',' '))
          print('\nMATCHES',found)
          if found==0: print('NO_BAD_RESIDUAL')
          PY
