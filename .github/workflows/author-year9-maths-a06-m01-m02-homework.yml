name: Author Year 9 Maths A06-M02 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-a06-m01-m02-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Maths homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lines = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9A06',title:'Function transformations',guide:'/year9/curriculum/maths/',intro:'Describe and sketch transformations of familiar functions, including translations, reflections and simple dilations. Connect equations, tables and graphs to explain what changes and what stays the same.',short:['For y = x^2 + 3, describe the transformation from y = x^2.','For y = (x - 4)^2, describe the transformation from y = x^2.','State the reflection that changes y = f(x) into y = -f(x).','If y = f(x) is shifted 2 units left, write the transformed function using f notation.','Describe how y = 2x^2 differs from y = x^2.','Find the new vertex of y = (x + 1)^2 - 5.','Explain the difference between a vertical translation and a horizontal translation.','Sketch the effect of changing y = x^2 to y = -x^2.','Correct this error: y = (x + 3)^2 moves y = x^2 three units right.','Give one real-world graph where shifting or scaling a function could be useful.'],long:['Compare y = x^2, y = x^2 + 4 and y = (x - 3)^2 using words, a table and graph features.','Describe and sketch the transformation from y = x^2 to y = -2(x + 1)^2 + 3.','Given key points on y = f(x), find the matching points after the transformation y = f(x) - 5.','Explain why horizontal transformations inside brackets can feel opposite to the sign shown.','Use a graph to compare a vertical dilation and a vertical translation of y = x^2.','Create two different transformations of y = |x| and describe their vertices and shape.','A parabola has vertex (4, -2) and opens upward with the same width as y = x^2. Write a possible equation.','Model a real situation by shifting a basic function, then explain what each transformation represents.','Identify and correct three transformation mistakes in a student sketch of y = -(x - 2)^2 + 1.','Write a full explanation linking function notation, graph movement and transformed coordinates.'],task:'Choose a simple base graph such as y = x, y = x^2 or y = |x|. Create three transformations, sketch or describe each graph, and explain a real-world meaning for at least one transformation.'},
            {code:'AC9M9M01',title:'Surface area, volume and capacity modelling',guide:'/year9/maths/ac9m9m01-solve-problems-involving-the-volume-and-surface-area-of-right/',intro:'Solve problems involving surface area, volume and capacity of right prisms, cylinders and composite solids. Use suitable units and interpret answers in practical contexts.',short:['Find the volume of a rectangular prism 8 cm by 5 cm by 3 cm.','Convert 2500 cm^3 to litres.','Find the surface area of a cube with side length 6 cm.','State the formula for the volume of a cylinder.','Find the volume of a cylinder with radius 4 cm and height 10 cm in terms of pi.','Explain the difference between volume and surface area.','A tank has capacity 72 000 cm^3. Convert this to litres.','Name one situation where surface area matters more than volume.','Correct this error: surface area of a rectangular prism is length × width × height.','Estimate whether a 1 L bottle can hold 900 cm^3 of water and explain.'],long:['A rectangular aquarium is 60 cm by 30 cm by 40 cm. Find its volume in cm^3 and capacity in litres.','Find the surface area of a closed rectangular box with dimensions 12 cm, 8 cm and 5 cm. Show all faces.','A cylindrical can has radius 3 cm and height 12 cm. Find its volume and total surface area in terms of pi.','A prism is made by joining two rectangular prisms. Explain how to find its total volume without double-counting.','Design packaging for a rectangular product and calculate the cardboard needed, allowing for overlap.','Compare two containers with different dimensions and decide which has greater capacity.','A swimming pool is 8 m long, 4 m wide and 1.5 m deep. Find the volume of water in cubic metres and litres.','Explain why using consistent units is essential in a volume and capacity problem.','Solve a practical problem involving paint, wrapping, filling or storage using surface area or volume.','Write a full modelling response for a container problem, including assumptions, formula, unit conversion and final interpretation.'],task:'Measure or estimate a real container, box, room, tank or package. Calculate its volume/capacity and at least one surface area measurement, then explain assumptions and units.'},
            {code:'AC9M9M02',title:'Scientific notation and measurement accuracy',guide:'/year9/maths/ac9m9m02-solve-problems-involving-very-small-and-very-large-measurements/',intro:'Solve problems involving very large and very small measurements using scientific notation, significant figures and appropriate accuracy. Interpret rounded values carefully.',short:['Write 4 500 000 in scientific notation.','Write 0.00072 in scientific notation.','Convert 3.2 × 10^5 to ordinary notation.','Round 56.738 to 3 significant figures.','State whether 0.00480 has 2, 3 or 4 significant figures and explain.','Explain why scientific notation is useful for very large or very small measurements.','Estimate 6.1 × 10^4 + 2.8 × 10^4.','Write 750 nanometres in metres using scientific notation.','Correct this error: 45 × 10^3 is in standard scientific notation.','Give one example from science or technology where small measurements matter.'],long:['A virus has diameter about 1.2 × 10^-7 m. Write this in ordinary notation and compare it with 0.000001 m.','The distance from Earth to the Sun is about 1.496 × 10^8 km. Round it to 3 significant figures and explain the effect of rounding.','Calculate (3.0 × 10^6) × (2.0 × 10^-4), giving the answer in scientific notation.','Compare 4.5 × 10^-3 and 6.2 × 10^-4. Which is larger and by what factor approximately?','A measurement is reported as 2.40 m. Explain what the trailing zero communicates about accuracy.','Solve a problem involving bytes, kilometres, nanometres or cells using scientific notation and unit conversion.','Explain how rounding too early can affect a multi-step calculation. Give an example.','Create a table comparing ordinary notation, scientific notation and SI prefix form for three measurements.','Evaluate whether a calculator answer should be reported with all digits or rounded suitably in context.','Write a full response solving a very large or very small measurement problem, including units, significant figures and interpretation.'],task:'Research one real very large or very small measurement, such as a planet distance, cell size, atom radius, data storage size or wavelength. Write it in ordinary notation, scientific notation and a suitable SI-prefix form where possible.'}
          ];
          function page(p){const s=p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(4)}</li>`).join('');const l=p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(8)}</li>`).join('');return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct units or notation, and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${s}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${l}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lines(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`}
          for (const p of pages){const file=path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html');fs.writeFileSync(file,page(p));}
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9a06/homework/index.html quiz/year-9/math/ac9m9m01/homework/index.html quiz/year-9/math/ac9m9m02/homework/index.html
          git commit -m "Author Year 9 Maths A06-M02 homework"
          git push
