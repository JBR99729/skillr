name: Author Year 9 Maths SP01-SP03 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-sp01-sp03-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9SP01', title:'Trigonometric ratios and right-triangle sides', guide:'/year9/maths/ac9m9sp01-the-constancy-of-the-sine-cosine-and-tangent-ratios-for/', intro:'Use sine, cosine and tangent ratios in right-angled triangles to connect an acute angle with opposite, adjacent and hypotenuse side lengths.', short:['Label the opposite, adjacent and hypotenuse sides for a chosen acute angle in a right-angled triangle.','Write the three basic ratios: sin θ, cos θ and tan θ.','Explain why the hypotenuse is always opposite the right angle.','Choose the correct ratio for a triangle where the opposite side and hypotenuse are known.','Choose the correct ratio for a triangle where the adjacent side and hypotenuse are known.','Choose the correct ratio for a triangle where the opposite and adjacent sides are known.','Use a calculator to find sin 35° to 3 decimal places.','Rearrange sin θ = opposite ÷ hypotenuse to find the opposite side.','Explain one common mistake students make when choosing opposite and adjacent sides.','State why trigonometric ratios stay constant for similar right triangles.'], long:['Find the missing side in a right triangle with hypotenuse 12 cm and angle 38°, where the missing side is opposite the angle.','Find the adjacent side in a right triangle with hypotenuse 15 m and angle 54°. Show the chosen ratio and substitution.','A ladder makes a 70° angle with the ground and reaches 5.8 m up a wall. Find the ladder length to 1 decimal place.','A ramp rises 0.9 m over a horizontal distance of 4.5 m. Find the angle the ramp makes with the ground.','Compare when sine, cosine and tangent are useful by describing the side information needed for each ratio.','Draw a labelled triangle for a trig problem, then solve it and explain why your ratio choice is correct.','A student uses tan when the hypotenuse is involved. Explain why this is wrong and solve a corrected example.','Use Pythagoras and trigonometry in the same triangle to find two missing measurements.','Create a real-world right-triangle problem involving height or distance and solve it using trigonometry.','Write a full worked solution for a right-triangle problem, including diagram labels, ratio, rearrangement, calculation and units.'], task:'Find a real situation where right-triangle trigonometry is useful, such as surveying, ramps, ladders, roof pitch, navigation or photography. Draw a diagram, identify the known measurements, choose a trig ratio and solve a related problem.'},
            {code:'AC9M9SP02', title:'Similarity, enlargement and scale factors', guide:'/year9/maths/ac9m9sp02-apply-the-enlargement-transformation-to-shapes-and-objects/', intro:'Apply enlargement transformations to shapes and objects, using scale factors to identify similarity and calculate corresponding lengths, areas or model dimensions.', short:['Define similar shapes.','What stays the same when a shape is enlarged?','What changes when a shape is enlarged by scale factor 3?','A side of length 4 cm is enlarged by scale factor 2.5. Find the new length.','A shape is reduced by scale factor 0.5. What happens to its side lengths?','Explain the difference between congruent and similar shapes.','Two corresponding sides are 6 cm and 15 cm. Find the scale factor from the smaller shape to the larger shape.','State why corresponding angles in similar shapes are equal.','Give one real-world use of scale factors.','Correct this misconception: “A scale factor always makes a shape bigger.”'], long:['A triangle has side lengths 3 cm, 4 cm and 5 cm. It is enlarged by scale factor 4. Find the new side lengths and compare the shapes.','Two rectangles are similar. The smaller is 5 cm by 8 cm and the larger has shortest side 20 cm. Find the longer side of the larger rectangle.','Explain how to test whether two triangles are similar using corresponding angles and side ratios.','A map scale is 1 cm represents 2 km. Find the real distance represented by 7.5 cm and explain the scale factor.','A model car is built at scale 1:24. The real car is 4.8 m long. Find the model length in centimetres.','Compare the effect of scale factor 3 on length and area using a simple square example.','A student doubles the sides of a rectangle and says the area also doubles. Explain the error with calculations.','Use coordinates to enlarge a simple triangle from the origin by scale factor 2 and list the new coordinates.','Create a scale drawing problem involving a room, map, model or diagram and solve it fully.','Write a full explanation of similarity, enlargement and scale factor using a labelled example.'], task:'Choose a real scale model, map, floor plan or enlarged image. Identify the scale factor, calculate at least two real or model dimensions, and explain what similarity means in that context.'},
            {code:'AC9M9SP03', title:'Geometric algorithms', guide:'/year9/maths/ac9m9sp03-design-test-and-refine-algorithms-involving-a-sequence-of-steps/', intro:'Design, test and refine algorithms that use a sequence of geometric steps, transformations, measurements or construction rules to solve spatial problems.', short:['What is an algorithm in a geometry context?','Write three ordered steps for constructing a perpendicular bisector.','Why must the order of steps in a geometric algorithm be clear?','Give one example of a geometric construction that can be described as an algorithm.','What does it mean to test an algorithm?','Explain how a flow chart can help describe a geometric process.','Identify one error that could occur in an algorithm for drawing a scaled shape.','Why should an algorithm include exact measurements or rules?','State one way to refine an algorithm after testing it.','Correct this misconception: “An algorithm only belongs in computer coding, not geometry.”'], long:['Write a step-by-step algorithm for enlarging a triangle by scale factor 2 from the origin on a coordinate grid.','Design an algorithm to draw a rectangle with a fixed perimeter of 30 cm and maximum possible area. Explain how you would test it.','Create a sequence of steps for locating the midpoint of a line segment on a grid, then test it with two examples.','Write and refine an algorithm for constructing a triangle when two sides and the included angle are known.','A student’s algorithm for a scale drawing misses the unit conversion step. Explain the error and rewrite the algorithm.','Use pseudocode or numbered instructions to describe how to classify a triangle from its side lengths.','Design an algorithm for checking whether two shapes are similar using side ratios and angle information.','Compare a written algorithm and a flow chart for solving a geometry problem. Which is clearer and why?','Create a geometric algorithm that uses Pythagoras or trigonometry as one step, then test it with values.','Write a full response explaining how you designed, tested and improved a geometric algorithm for a practical spatial problem.'], task:'Design a geometric algorithm for a real task, such as drawing a floor plan, scaling an image, checking a ramp angle, cutting a shape, or constructing a garden layout. Write the steps, test with numbers, find one weakness and improve it.'}
          ];
          function page(p){
            const short = p.short.map(q => `<li><p>${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map(q => `<li><p>${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct units or notation, and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file, page(p));
            console.log(file);
          }
          NODE
      - name: Commit changes
        run: |
          git config user.name "skillr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9sp01/homework/index.html quiz/year-9/math/ac9m9sp02/homework/index.html quiz/year-9/math/ac9m9sp03/homework/index.html
          git commit -m "Author Year 9 Maths SP01-SP03 homework"
          git push
