name: Refresh sitemaps

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
      - 'scripts/clean_sitemap_seo.py'
      - 'scripts/validate_seo_indexability.py'
      - '.github/workflows/refresh-sitemaps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sitemaps
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate sitemap index and child sitemaps
        run: python3 scripts/generate_sitemap.py
      - name: Clean human sitemap SEO
        run: python3 scripts/clean_sitemap_seo.py
      - name: Validate public page indexability
        run: python3 scripts/validate_seo_indexability.py
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=['sitemap.xml']+glob.glob('sitemap-*.xml')
          for f in files: ET.parse(f)
          print('Validated', len(files), 'XML sitemap files')
          PY
      - name: Commit refreshed sitemaps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml sitemap-*.xml sitemap.html assets/site-search-index.json
          if git diff --cached --quiet; then
            echo 'Sitemaps already current.'
          else
            git commit -m 'Refresh generated sitemaps'
            git push
          fi
