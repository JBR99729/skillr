name: Normalize Year 10 Maths section order

on:
  push:
    branches:
      - fix/year10-section-order
    paths:
      - '.github/workflows/normalize-year10-section-order.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year10-section-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock builder to Topic 1 section order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_year10_static_v2.py')
          text = p.read_text()
          old = "write_hubs()\nupdate_sitemaps()\nprint(f'Year 10 Static Curriculum v2 materialised for {len(cfg)} remaining lessons + 4 state hubs.')"
          new = "write_hubs()\nupdate_sitemaps()\nfrom normalize_year10_math_section_order import normalize_all\nnormalize_all()\nprint(f'Year 10 Static Curriculum v2 materialised for {len(cfg)} remaining lessons + 4 state hubs in the AC9M10N01 section order.')"
          if old not in text:
              raise SystemExit('Year 10 builder tail not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Normalize Topics 6-21 to Topic 1 standard
        run: python scripts/normalize_year10_math_section_order.py
      - name: Guard generated diff
        run: git diff --check
      - name: Commit normalized pages
        shell: bash
        run: |
          git add year10/maths scripts/build_year10_static_v2.py scripts/normalize_year10_math_section_order.py
          if git diff --cached --quiet; then
            echo 'No section-order changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align Year 10 Maths section order to AC9M10N01'
          git push origin HEAD:fix/year10-section-order
