name: Foundation English batch 1 topic-page browser QA
on:
  pull_request:
    paths:
      - 'foundation/english/ac9ef*/index.html'
      - 'assets/css/foundation-english-topic-pages.css'
      - 'assets/images/foundation-english/**'
      - '.github/workflows/foundation-english-topic-pages-batch1-browser-qa.yml'
      - 'scripts/qa_foundation_english_topic_pages_batch1_browser.cjs'
      - 'docs/qa/foundation-english-topic-pages-batch1-20261109/inventory.json'
permissions:
  contents: read
concurrency:
  group: foundation-english-topic-pages-batch1-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check 10 authored pages at three screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/foundation-english-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/qa_foundation_english_topic_pages_batch1_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-english-topic-pages-batch1-browser
          path: artifacts/foundation-english-topic-pages-batch1-browser/
          retention-days: 7
