name: Author Year 10 Maths A03-A05 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year10-maths-a03-a05-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M10A03',title:'Exponential relations: equations, tables and graphs',guide:'/year10/maths/ac9m10a03-the-connection-between-algebraic-and-graphical-representations/',intro:'Connect exponential equations, tables and graphs, including recognising constant multiplicative change and interpreting initial value, growth factor, decay factor and intercepts.',short:['Complete the table for y = 2^x when x = 0, 1, 2, 3 and 4.','What feature of a table suggests an exponential relation rather than a linear relation?','State the initial value of y = 5(1.2)^x.','State the growth factor in y = 3(2)^x.','State whether y = 100(0.8)^x represents growth or decay. Explain.','Find y when x = 3 for y = 4(1.5)^x.','Explain why the graph of y = 2^x does not have a constant gradient.','What is the y-intercept of y = 7(0.9)^x?','Correct this misconception: “An exponential graph always increases.”','Give one real situation that may be modelled exponentially.'],long:['Create a table for y = 3(2)^x from x = 0 to 5, then describe the graph shape.','Compare y = 2x + 3 with y = 3(2)^x using tables. Explain how linear and exponential patterns differ.','A population starts at 800 and grows by 6% per year. Write an exponential model and predict the population after 4 years.','A car worth $28 000 depreciates by 12% each year. Write a decay equation and estimate its value after 3 years.','Explain how the values in a table, the equation and the graph all show the same exponential relationship.','Given values 6, 9, 13.5, 20.25, decide whether the pattern is exponential and find the multiplier.','Sketch the key features of y = 10(0.5)^x and describe the intercept and long-term behaviour.','A student models a fixed $50 increase each year using an exponential equation. Explain the error and suggest a better model.','Create an exponential growth or decay question, solve it and interpret the answer in context.','Write a full worked comparison of two exponential models with different initial values and growth factors.'],task:'Find a real exponential growth or decay example, such as population, bacteria, compound interest, cooling, depreciation or radioactive decay. Write a simple model, table of values and explanation of the graph.'},
            {code:'AC9M10A04',title:'Applied growth and decay modelling',guide:'/year10/maths/ac9m10a04-mathematical-modelling-to-solve-applied-problems-involving/',intro:'Use mathematical modelling to solve applied growth and decay problems, including repeated percentage change, compound interest, depreciation and checking the reasonableness of predictions.',short:['Write the multiplier for a 7% increase.','Write the multiplier for a 15% decrease.','Increase $400 by 8%.','Decrease $1200 by 10%.','What does the base in A = P(1 + r)^n represent?','What does n represent in a compound growth model?','State whether multiplying by 0.92 represents growth or decay.','Why is repeated 10% increase not the same as adding 10 percentage points each year?','Correct this error: “A 20% decrease then a 20% increase returns to the original value.”','Give one situation where a decay model may be useful.'],long:['A bank account has $1500 earning 4% compound interest per year. Find the balance after 5 years.','A laptop costs $1800 and depreciates by 18% per year. Estimate its value after 3 years.','A population of 12 000 grows by 2.5% each year. Write a model and predict the population after 6 years.','Compare simple interest and compound interest for $2000 at 5% over 4 years.','A medicine level in the body decreases by 30% each hour. Model the amount remaining from an initial 200 mg after 5 hours.','A city’s waste output decreases by 6% each year after a recycling program. Estimate the percentage remaining after 4 years.','Explain the assumptions and limitations in a repeated percentage growth model.','A student uses 1.12 as the multiplier for a 12% decrease. Explain and correct the mistake.','Create a finance or science modelling problem involving repeated percentage change and solve it fully.','Write a full modelling response with variables, equation, substitution, answer, interpretation and limitation.'],task:'Choose a real repeated percentage context, such as savings, depreciation, population, medicine, inflation or energy use. Build a model, calculate at least three time points, and discuss whether the model is realistic.'},
            {code:'AC9M10A05',title:'Investigating functions with digital tools',guide:'/year10/maths/ac9m10a05-experiment-with-functions-and-relations-using-digital-tools/',intro:'Experiment with functions and relations using digital tools, making and testing conjectures about how changing parameters affects graphs, tables and key features.',short:['What is a parameter in a function?','For y = mx + c, what does m control?','For y = mx + c, what does c control?','How does y = x^2 + 4 compare with y = x^2?','How does y = 2x^2 compare with y = x^2?','What can a graphing tool help you test quickly?','Why should conjectures from digital tools still be checked mathematically?','State one key feature you could compare between two graphs.','Correct this misconception: “If the graph looks right, the equation must be correct.”','Give one function family you could investigate with a graphing tool.'],long:['Use the family y = x^2 + k to make a conjecture about how k affects the graph.','Use the family y = a x^2 to describe how changing a affects graph width and direction.','Compare y = 2^x, y = 3^x and y = (1/2)^x using tables and graph descriptions.','Investigate y = mx + c for three values of m while c stays fixed. Describe the pattern.','A student changes two parameters at once and cannot explain the effect. Explain why one parameter should be changed at a time.','Design a digital-tool investigation into transformations of y = x^2, including a table of values to check one claim.','Use a graph to estimate a solution to x^2 = 2x + 3, then describe how to check algebraically.','Compare a table and a graph for identifying key features of a relation.','Create a conjecture about an exponential family y = a b^x and test it using three examples.','Write a full investigation report: question, function family, parameter tested, observations, conjecture and mathematical check.'],task:'Use or plan a graphing-tool investigation for one function family: linear, quadratic or exponential. Record the equations tested, describe the graph changes, make a conjecture and explain how you checked it.'}
          ];
          function page(p){
            const short = p.short.map(q=>`<li><p>${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map(q=>`<li><p>${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 10 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-10/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 10 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct notation and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 10 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) fs.writeFileSync(`quiz/year-10/math/${p.code.toLowerCase()}/homework/index.html`, page(p));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz/year-10/math/ac9m10a03/homework/index.html quiz/year-10/math/ac9m10a04/homework/index.html quiz/year-10/math/ac9m10a05/homework/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Author Year 10 Maths A03-A05 homework"
          git push
