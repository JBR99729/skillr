name: Rebuild Year 10 English AC9E10LA05
on:
  push:
    branches: [content/year10-english-actual-rebuild]
    paths:
      - 'scripts/rebuild_year10_english_actual_la05.mjs'
      - 'scripts/year10_english_actual/ac9e10la05_authored.mjs'
      - '.github/workflows/rebuild-year10-english-actual-la05.yml'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/year10-english-actual-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialise authored AC9E10LA05 bank
        run: node scripts/rebuild_year10_english_actual_la05.mjs
      - name: Guard Classroom View
        shell: bash
        run: |
          if git status --porcelain | grep -E 'teacher-slides|classroom'; then
            echo 'Classroom View changed unexpectedly'
            exit 1
          fi
      - name: Commit production bank
        shell: bash
        run: |
          git config user.name 'JBR99729'
          git config user.email 'jbhasker9@gmail.com'
          git add assets/assessment-banks/year10/english/ac9e10la05.json quiz/year-10/english/ac9e10la05
          if git diff --cached --quiet; then exit 1; fi
          git commit -m 'Rebuild AC9E10LA05 actual question bank'
          git push origin HEAD:content/year10-english-actual-rebuild
