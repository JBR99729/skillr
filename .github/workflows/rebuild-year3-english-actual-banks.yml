name: Rebuild Year 3 English actual banks
on:
  push:
    branches: [content/year3-english-actual-rebuild]
    paths:
      - '.github/workflows/rebuild-year3-english-actual-banks.yml'
      - 'scripts/rebuild_year3_english_student_facing.mjs'
      - 'scripts/validate_year3_english_student_facing.mjs'
      - 'scripts/year3_english_items_*.mjs'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/year3-english-actual-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild actual Year 3 English banks
        run: |
          node scripts/rebuild_year3_english_student_facing.mjs
          for f in assets/assessment-banks/year3/english/ac9e3*.json; do node scripts/publish_production_question_bank.mjs "$f"; done
      - name: Validate Year 3 English banks
        run: node scripts/validate_year3_english_student_facing.mjs
      - name: Guard Classroom View
        run: |
          if ! git diff --quiet -- 'year-3/english/**/teacher-slides/**' 'year-3/english/**/classroom-view/**'; then
            echo 'Classroom View changed unexpectedly'; git diff -- 'year-3/english/**/teacher-slides/**' 'year-3/english/**/classroom-view/**'; exit 1
          fi
      - name: Commit generated banks
        run: |
          git config user.name 'skillr-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/assessment-banks/year3/english quiz/year-3/english
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Rebuild all Year 3 English question banks' && git push origin HEAD:content/year3-english-actual-rebuild; fi
