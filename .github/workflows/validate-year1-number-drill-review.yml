name: Validate reviewed Year 1 number drill
on:
  push:
    branches: [main]
    paths:
      - 'assets/daily-drill-banks/year1/math/numbers-place-value-to-120.json'
      - 'quiz/assets/daily-drills/year1-daily-drills-math-numbers-place-value-to-120-production.js'
      - 'quiz/year-1/daily-drills/math/numbers-place-value-to-120/**'
      - 'quiz/assets/daily-drills/daily-drill-selector.js'
      - 'quiz/assets/script-runtime-v115.js'
      - 'scripts/year1_maths_drill_review/**'
      - 'scripts/validate-year1-number-drill-review.cjs'
      - '.github/workflows/validate-year1-number-drill-review.yml'
  pull_request:
    paths:
      - 'assets/daily-drill-banks/year1/math/numbers-place-value-to-120.json'
      - 'quiz/assets/daily-drills/year1-daily-drills-math-numbers-place-value-to-120-production.js'
      - 'quiz/year-1/daily-drills/math/numbers-place-value-to-120/**'
      - 'quiz/assets/daily-drills/daily-drill-selector.js'
      - 'quiz/assets/script-runtime-v115.js'
      - 'scripts/year1_maths_drill_review/**'
      - 'scripts/validate-year1-number-drill-review.cjs'
      - '.github/workflows/validate-year1-number-drill-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only DOM dependency
        run: npm install --prefix "$RUNNER_TEMP/number-drill-qa" --no-audit --no-fund jsdom@26.1.0
      - name: Check reproducible authored bank
        run: |
          python3 scripts/year1_maths_drill_review/build.py
          git diff --exit-code -- assets/daily-drill-banks/year1/math/numbers-place-value-to-120.json quiz/assets/daily-drills/year1-daily-drills-math-numbers-place-value-to-120-production.js
      - name: Check all drill questions and the actual runtime
        run: NODE_PATH="$RUNNER_TEMP/number-drill-qa/node_modules" node scripts/validate-year1-number-drill-review.cjs
      - name: Check official review ledger
        run: node scripts/update_content_verification_status.mjs --check
