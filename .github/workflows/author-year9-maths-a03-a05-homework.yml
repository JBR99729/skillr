name: Author Year 9 Maths A03-A05 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-a03-a05-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Maths homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9A03',title:'Gradient, distance, midpoint and line modelling',intro:'Use coordinates to calculate gradient, distance and midpoint, and use these ideas to model linear relationships on the Cartesian plane.',short:['Find the gradient between (1, 3) and (5, 11).','Find the midpoint of A(2, 6) and B(8, 10).','Use the distance formula to find the distance between (0, 0) and (3, 4).','State whether the line through (2, 5) and (6, 5) is horizontal, vertical or sloping.','Write the gradient formula in words or symbols.','Find the equation of a line with gradient 3 and y-intercept -2.','Explain what a gradient of 0 means.','Find the y-intercept of y = -2x + 7.','Correct this error: gradient from (1, 2) to (4, 8) is (4 - 1)/(8 - 2).','Describe a real context where gradient represents a rate of change.'],long:['Calculate the gradient, midpoint and distance between A(-2, 3) and B(4, 11). Show all working.','A road on a map goes from (1, 2) to (7, 5). Interpret the gradient and distance in the context of the map.','Find the equation of a line passing through (0, 4) and (3, 10), then check using both points.','Compare two line segments using gradient and distance. Decide which is steeper and which is longer.','A phone plan has a fixed cost and a cost per GB. Model it with a linear equation and explain the gradient and intercept.','Use midpoint to find the centre of a rectangular garden with opposite corners at (2, 1) and (10, 7).','Explain why the distance formula is connected to Pythagoras. Use a diagram or example.','A student swaps x and y changes when finding gradient. Explain the error and solve a correct example.','Create a coordinate problem involving two locations, then calculate distance, midpoint and gradient.','Write a full solution for a real-world linear modelling problem, including equation, graph features and interpretation.'],task:'Research one use of coordinate geometry in maps, design, sport tracking, robotics or games. Create a coordinate model, calculate gradient, midpoint or distance, and explain what the answer means.'},
            {code:'AC9M9A04',title:'Quadratic patterns, graphs and equations',intro:'Recognise quadratic patterns, connect tables and graphs, expand or factorise simple quadratics, and solve quadratic equations by suitable methods.',short:['Complete the table for y = x^2 when x = -2, -1, 0, 1, 2.','State the shape of the graph of a quadratic relation.','Find the y-intercept of y = x^2 + 3x - 4.','Factorise x^2 + 5x + 6.','Solve x^2 = 49.','Find the axis of symmetry of y = x^2.','Explain how first differences and second differences help identify a quadratic pattern.','Expand (x + 4)(x - 2).','Correct this error: x^2 + 9 = (x + 3)^2.','Give one real-world situation that can form a quadratic relationship.'],long:['Use a table of values to sketch y = x^2 - 4, then describe the vertex and intercepts.','Factorise and solve x^2 + 7x + 12 = 0. Check both solutions by substitution.','Compare the graphs of y = x^2 and y = x^2 + 5. Explain what changes and what stays the same.','A ball is thrown and its height is modelled by h = -t^2 + 6t. Find when it is on the ground and interpret the answer.','Use second differences to decide whether a sequence is quadratic, then predict the next two terms.','Expand (2x + 1)(x - 3), then explain how the expanded form connects to graphing.','Create a quadratic equation with two integer solutions, then expand it and solve it again.','Explain why a quadratic graph can have zero, one or two x-intercepts.','Solve a practical area problem that leads to a quadratic expression.','Write a full response connecting a quadratic table, graph, equation, vertex and intercepts.'],task:'Find or design a real situation that can be modelled by a quadratic, such as projectile motion, area, braking distance or a parabolic shape. Create a simple model, table and explanation.'},
            {code:'AC9M9A05',title:'Linear, quadratic and financial modelling',intro:'Use linear, quadratic and financial models to represent situations, solve problems, compare options and explain limitations of a model.',short:['A taxi charges $5 plus $2 per kilometre. Write a linear model for the cost.','For C = 5 + 2d, find C when d = 12.','A savings account starts with $200 and gains $30 per month. Write a linear model.','Calculate simple interest on $500 at 4% per year for 3 years.','Explain the difference between a linear model and a quadratic model.','Identify the fixed cost and variable cost in C = 40 + 12n.','A rectangle has area A = x(20 - x). Explain why this is quadratic.','State one limitation of using a mathematical model.','Correct this error: a $100 item with 20% discount costs $20.','Give one example of a financial decision that can be modelled mathematically.'],long:['Compare two phone plans: Plan A costs $20 plus $4 per GB, Plan B costs $50 plus $1 per GB. Find the break-even point and interpret it.','A concert ticket company charges a booking fee plus a price per ticket. Create a linear model and use it to answer two questions.','Calculate the simple interest and final value for an investment of $1200 at 5% per year for 4 years.','Model the area of a rectangular enclosure with fixed perimeter 40 m. Explain why the area relation is quadratic.','A shop gives a 30% discount and then adds 10% GST. Find the final price of a $200 item and explain the order.','Compare a linear cost model and a quadratic area model. Explain what each type of model is useful for.','Create a table and graph description for a financial model, identifying the intercept and gradient.','Evaluate a model that assumes prices, rates or conditions never change. Explain the limitation.','Solve a practical modelling problem where choosing the best option depends on usage amount.','Write a full response modelling a real financial or measurement situation, including equation, calculation, interpretation and limitation.'],task:'Research or invent a financial decision, such as subscription plans, transport costs, savings, discounts or simple interest. Build a model, solve a comparison problem and explain one limitation of your model.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="/year9/curriculum/maths/">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct notation and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file, page(p));
          }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9a03/homework/index.html quiz/year-9/math/ac9m9a04/homework/index.html quiz/year-9/math/ac9m9a05/homework/index.html
          git commit -m "Author Year 9 Maths A03-A05 homework"
          git push
