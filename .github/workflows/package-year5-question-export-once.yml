name: Package Year 5 question export once
on:
  push:
    paths:
      - '.github/workflows/package-year5-question-export-once.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: Year5_Maths_and_Science_All_Questions
          path: exports/Year5_Maths_and_Science_All_Questions.txt
          if-no-files-found: error
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/package-year5-question-export-once.yml
          git config user.name 'SkillrHub Exporter'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-shot Year 5 question export packager'
          git push origin HEAD:main
