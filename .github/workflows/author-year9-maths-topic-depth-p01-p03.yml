name: Author Year 9 Maths topic depth P01-P03

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-topic-depth-p01-p03.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write deeper topic pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.mini-table{width:100%;border-collapse:collapse;margin-top:10px}.mini-table th,.mini-table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.mini-table th{background:var(--soft)}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}</style>`;
          const pages = [
            {
              code:'AC9M9P01',
              path:'year9/maths/ac9m9p01-list-all-outcomes-for-compound-events-both-with-and-without/index.html',
              canonical:'https://skillrhub.com/year9/maths/ac9m9p01-list-all-outcomes-for-compound-events-both-with-and-without/',
              title:'Compound events, sample spaces and tree diagrams',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9P01: list outcomes for compound events with and without replacement using tables, organised lists and tree diagrams.',
              intro:'This topic helps students organise all possible outcomes for two-step and multi-step chance events. The focus is systematic listing, deciding whether replacement changes the sample space, and using tree diagrams to avoid missing outcomes.',
              quiz:'ac9m9p01',
              ideas:['A compound event has two or more chance steps, such as tossing two coins or drawing two counters.','A sample space is the full list of possible outcomes.','With replacement means the first item is put back, so the next draw has the same options.','Without replacement means the first item is not put back, so the next draw has fewer or different options.'],
              formulas:['sample space = all possible outcomes','total outcomes = choices in step 1 × choices in step 2, when each step has fixed choices','multiply along branches to count pathway outcomes','use organised lists or tables to check tree diagrams'],
              workedTitle:'Worked example: two draws without replacement',
              worked:['A bag has one red counter, one blue counter and one green counter. Two counters are drawn without replacement.','First draw options: R, B, G.','If the first draw is R, the second draw can be B or G. Continue the same pattern for B and G.','The outcomes are RB, RG, BR, BG, GR and GB.','There are 6 ordered outcomes. RR, BB and GG are impossible because there is no replacement.'],
              misconceptions:['Listing only unordered pairs when order matters.','Forgetting that without replacement changes the second draw.','Writing repeated outcomes such as RR when the item cannot be drawn twice.','Drawing a tree diagram but not checking that every branch follows the condition.'],
              checks:['List the sample space for tossing a coin and spinning a 1–3 spinner.','Explain the difference between drawing with replacement and without replacement.','Why is a tree diagram useful for compound events?'],
              tip:'Ask students to say the condition aloud before listing outcomes: “after the first result, what choices are still possible?” This prevents many replacement errors.'
            },
            {
              code:'AC9M9P02',
              path:'year9/maths/ac9m9p02-calculate-relative-frequencies-from-given-or-collected-data-to/index.html',
              canonical:'https://skillrhub.com/year9/maths/ac9m9p02-calculate-relative-frequencies-from-given-or-collected-data-to/',
              title:'Relative frequency, Venn diagrams and simulation',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9P02: calculate relative frequencies, compare experimental and theoretical probability, and use Venn diagrams and simulations.',
              intro:'This topic connects collected data with probability. Students calculate relative frequency, compare it with theoretical probability, and use representations such as Venn diagrams, tables and simulations to reason about chance.',
              quiz:'ac9m9p02',
              ideas:['Relative frequency is the fraction or proportion of trials where an event happens.','Experimental probability comes from results; theoretical probability comes from the expected model.','As trials increase, relative frequency often becomes more stable.','Venn diagrams help show overlapping events such as students who play sport, music or both.'],
              formulas:['relative frequency = number of times event occurs ÷ total number of trials','P(A or B) counts all outcomes in A, B or both','P(A and B) counts outcomes in the overlap','expected frequency ≈ probability × number of trials'],
              workedTitle:'Worked example: calculate relative frequency',
              worked:['A spinner lands on blue 18 times in 60 spins.','Relative frequency of blue = 18 ÷ 60.','18 ÷ 60 = 0.3.','The experimental probability of blue is 0.3, or 30%.','If the theoretical probability was 1/4, the experiment was close but not exact.'],
              misconceptions:['Thinking experimental results must exactly match theoretical probability.','Using the number of successful trials as the denominator instead of total trials.','Double-counting the overlap in a Venn diagram.','Assuming a short simulation is always reliable.'],
              checks:['A coin lands heads 47 times in 100 tosses. Find the relative frequency of heads.','Explain why 20 trials may be less reliable than 500 trials.','In a Venn diagram, why should the overlap be counted carefully?'],
              tip:'Use real class data or quick digital simulations. Students should compare the relative frequency with what they expected and explain why they may differ.'
            },
            {
              code:'AC9M9P03',
              path:'year9/maths/ac9m9p03-design-and-conduct-repeated-chance-experiments-and-simulations/index.html',
              canonical:'https://skillrhub.com/year9/maths/ac9m9p03-design-and-conduct-repeated-chance-experiments-and-simulations/',
              title:'Designing repeated chance experiments and simulations',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9P03: design and conduct repeated chance experiments and simulations, then compare results with theoretical probability.',
              intro:'This topic asks students to plan, run and evaluate chance experiments or simulations. A strong response explains the random process, records enough trials, calculates relative frequency and comments on reliability.',
              quiz:'ac9m9p03',
              ideas:['A simulation uses a random process to model a real chance situation.','Repeated trials make results more informative than a single trial.','A good simulation must match the real situation fairly.','Results should be interpreted using relative frequency and compared with theoretical probability where possible.'],
              formulas:['relative frequency = successful trials ÷ total trials','expected count = theoretical probability × number of trials','larger samples usually reduce random variation','simulation design must match the event being modelled'],
              workedTitle:'Worked example: simulate a basketball free throw',
              worked:['A player usually scores about 70% of free throws. Use random numbers 1–10 to simulate one shot.','Let 1–7 represent a score and 8–10 represent a miss.','Generate 50 random numbers and record how many are 1–7.','If 36 are scores, relative frequency = 36 ÷ 50 = 0.72.','The simulation result, 72%, is close to the expected 70%, but another run could differ.'],
              misconceptions:['Choosing a simulation tool that does not match the probabilities in the real situation.','Running too few trials and making a strong conclusion.','Changing the rules during the experiment.','Reporting results without explaining the sample size or random method.'],
              checks:['Design a simulation for a 25% chance event using numbers 1–100.','Why are 200 trials usually better than 10 trials?','What information should be recorded so another person can repeat your simulation?'],
              tip:'Make students write the simulation rule before collecting data. If the rule is clear, their results and conclusions are much easier to check.'
            }
          ];
          function page(p){
            const ideas = p.ideas.map(x=>`<div class="grid-card"><h3>Key idea</h3><p>${esc(x)}</p></div>`).join('');
            const formulas = p.formulas.map(x=>`<div class="grid-card"><span class="formula">${esc(x)}</span></div>`).join('');
            const worked = p.worked.map(x=>`<li>${esc(x)}</li>`).join('');
            const misconceptions = p.misconceptions.map(x=>`<li>${esc(x)}</li>`).join('');
            const checks = p.checks.map(x=>`<li>${esc(x)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title)} | ${p.code} Year 9 Maths | SkillrHub</title><meta name="description" content="${esc(p.meta)}"><link rel="canonical" href="${p.canonical}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/maths/">Year 9 Maths</a> › ${p.code}</p><section class="hero"><p class="kicker">Year 9 Maths • ${p.code} • Topic guide</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)}</p><div class="cta"><a class="primary" href="/quiz/year-9/math/${p.quiz}/practice/">Start practice</a><a href="/quiz/year-9/math/${p.quiz}/test/">Take test</a><a href="/quiz/year-9/math/${p.quiz}/homework/">Open homework</a></div></section><section class="card"><p class="kicker">Core understanding</p><h2>What students need to know</h2><div class="grid three">${ideas}</div></section><section class="card"><p class="kicker">Formulas and representations</p><h2>Useful rules and ways to represent the idea</h2><div class="grid">${formulas}</div></section><section class="card worked"><p class="kicker">Worked example</p><h2>${esc(p.workedTitle)}</h2><ol class="steps">${worked}</ol></section><section class="card warning"><p class="kicker">Common misconceptions</p><h2>What to watch for</h2><ul class="checklist">${misconceptions}</ul></section><section class="card"><p class="kicker">Quick check</p><h2>Try these before moving on</h2><ol class="steps">${checks}</ol></section><section class="card"><p class="kicker">Support tip</p><h2>For parents and teachers</h2><p class="note">${esc(p.tip)}</p></section><section class="card"><p class="kicker">Next steps</p><h2>Practise this skill</h2><p>Use the linked homework, practice and test to move from recognition to independent problem solving.</p><div class="cta"><a href="/quiz/year-9/math/${p.quiz}/homework/">Homework</a><a class="primary" href="/quiz/year-9/math/${p.quiz}/practice/">Practice</a><a href="/quiz/year-9/math/${p.quiz}/test/">Test</a></div></section><p class="footer">SkillrHub • Australian Curriculum aligned Year 9 Maths topic guide</p></main></body></html>`;
          }
          for (const p of pages) fs.writeFileSync(p.path, page(p));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add year9/maths/ac9m9p01-list-all-outcomes-for-compound-events-both-with-and-without/index.html year9/maths/ac9m9p02-calculate-relative-frequencies-from-given-or-collected-data-to/index.html year9/maths/ac9m9p03-design-and-conduct-repeated-chance-experiments-and-simulations/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deepen Year 9 Maths P01-P03 topic pages"
          git push
