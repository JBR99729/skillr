name: Hotfix practice question cycling

on:
  push:
    paths:
      - '.github/workflows/hotfix-practice-question-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore no-repeat cycling on practice pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('quiz/assets/script.js')
          text = path.read_text()

          pattern = re.compile(
              r'  if \(isPracticePage\) \{\n'
              r'    config\.preReadSeconds = 0;\n'
              r'(?:    config\.shuffleQuestions = false;\n'
              r'    config\.questionCycle = false;\n){6}'
          )

          replacement = (
              '  if (isPracticePage) {\n'
              '    config.preReadSeconds = 0;\n'
              '    config.shuffleQuestions = false;\n'
              '    const practiceMaximumQuestions = Number(config.maxQuestions);\n'
              '    config.questionCycle = Number.isInteger(practiceMaximumQuestions) &&\n'
              '      practiceMaximumQuestions > 0 &&\n'
              '      questions.length > practiceMaximumQuestions;\n'
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one practice override block; found {count}')

          path.write_text(updated)
          PY

          node --check quiz/assets/script.js
          git diff --check

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'Skillr QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quiz/assets/script.js
          git commit -m 'Fix practice question no-repeat cycle'
          git push origin HEAD:main
