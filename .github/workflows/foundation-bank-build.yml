name: Diagnose Foundation Maths banks

on:
  push:
    branches:
      - agent/complete-foundation-maths-rebuild

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip foundation-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-foundation-maths-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and inspect authored bank source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const chunkWindow = { __skillrFoundationBankChunks: [] };
          const chunkContext = { window: chunkWindow };
          vm.createContext(chunkContext);
          for (let n = 1; n <= 3; n += 1) {
            const text = fs.readFileSync(`quiz/assets/foundation-maths-approved-banks-${n}.js`, 'utf8');
            vm.runInContext(text, chunkContext, { filename: `foundation-bank-chunk-${n}.js` });
          }
          const chunks = chunkWindow.__skillrFoundationBankChunks;
          if (chunks.length !== 3 || chunks.some((chunk) => typeof chunk !== 'string' || !chunk.length)) {
            throw new Error(`Expected three non-empty chunks, received ${chunks.map((x) => typeof x).join(', ')}`);
          }

          const source = Buffer.from(chunks.join(''), 'base64').toString('utf8');
          const window = { location: { pathname: '/quiz/grade-k/math/ac9mfn03/practice/' } };
          const document = {
            readyState: 'complete',
            addEventListener() {},
            querySelector() { return null; },
            querySelectorAll() { return []; }
          };
          const context = {
            window,
            document,
            console,
            TextDecoder,
            TextEncoder,
            URL,
            setTimeout,
            clearTimeout,
            atob: (value) => Buffer.from(value, 'base64').toString('binary'),
            btoa: (value) => Buffer.from(value, 'binary').toString('base64')
          };
          vm.createContext(context);
          const before = new Set(Object.keys(window));
          let evaluationError = null;
          try {
            vm.runInContext(source, context, { filename: 'foundation-authored-source.js' });
          } catch (error) {
            evaluationError = { name: error.name, message: error.message, stack: error.stack };
          }

          const added = Object.keys(window).filter((key) => !before.has(key));
          const inspect = {};
          for (const key of Object.keys(window)) {
            const value = window[key];
            if (Array.isArray(value)) {
              inspect[key] = {
                type: 'array',
                length: value.length,
                sampleKeys: Object.keys(value[0] || {}),
                sample: value[0] || null
              };
            } else if (value && typeof value === 'object') {
              inspect[key] = { type: 'object', keys: Object.keys(value).slice(0, 100) };
            } else {
              inspect[key] = { type: typeof value };
            }
          }

          fs.writeFileSync('foundation-bank-diagnostics.json', JSON.stringify({
            chunkLengths: chunks.map((chunk) => chunk.length),
            sourceLength: source.length,
            sourceHead: source.slice(0, 1800),
            sourceTail: source.slice(-8000),
            evaluationError,
            added,
            inspect
          }, null, 2));
          NODE
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add foundation-bank-diagnostics.json
          git commit -m "Add Foundation bank diagnostics [skip foundation-build]"
          git push origin HEAD:agent/complete-foundation-maths-rebuild
