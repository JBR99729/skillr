name: Normalize all landing hub navigation
on: push
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Normalize landing hub headers only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          candidates = set()
          explicit = [Path('foundation/index.html')]
          explicit += list(root.glob('year[0-9]*/index.html'))
          explicit += list(root.glob('learn/*/index.html'))
          explicit += list(root.glob('teach/*/index.html'))
          explicit += [Path('foundation/curriculum/index.html')]
          explicit += list(root.glob('foundation/curriculum/*/index.html'))
          explicit += list(root.glob('year[0-9]*/curriculum/index.html'))
          explicit += list(root.glob('year[0-9]*/curriculum/*/index.html'))
          for p in explicit:
            if p.exists(): candidates.add(p)

          links = [
            ('/learn/','Learn'),('/teach/','Teach'),('/products/','Products'),
            ('/homeschooling-australia/','Homeschool'),('/worksheets/','Worksheets &amp; Homework'),
            ('/dashboard/','Dashboard'),('/print-and-go.html','Print &amp; Go'),
            ('/teach-and-explain.html','Teach &amp; Explain'),('/updates.html','Updates')
          ]

          def active_for(path):
            s='/' + path.as_posix().lstrip('/')
            if s.startswith('/learn/'): return '/learn/'
            if s.startswith('/teach/'): return '/teach/'
            # Curriculum and year landing hubs are learner-facing entry points.
            if '/curriculum/' in s or re.match(r'^/(foundation|year\d+)/index\.html$', s): return '/learn/'
            return None

          def header(path):
            active = active_for(path)
            def a(href,label):
              cur=' aria-current="page"' if href==active else ''
              return f'<a href="{href}"{cur}>{label}</a>'
            desktop=''.join(a(*x) for x in links)
            mobile=''.join(a(*x) for x in links)
            return ('<header class="site-header skillr-site-header">\n'
                    '  <nav class="site-header__nav" aria-label="Main navigation">\n'
                    '    <a class="site-header__brand" href="/" aria-label="SkillrHub F–10 home"><img src="/icons/skillrhub-mark.svg" alt="" width="38" height="38"><strong>SkillrHub</strong> <span>F–10</span></a>\n'
                    f'    <div class="site-header__links">{desktop}</div>\n'
                    f'    <details class="site-header__menu"><summary>Menu</summary><div class="site-header__menu-panel">{mobile}</div></details>\n'
                    '  </nav>\n'
                    '</header>')

          changed=[]
          failures=[]
          for p in sorted(candidates):
            s=p.read_text()
            original=s
            # Remove any existing site-header block.
            s, n1 = re.subn(r'<header\b[^>]*class="[^"]*site-header[^"]*"[^>]*>.*?</header>\s*', '', s, count=1, flags=re.S|re.I)
            # Otherwise remove the old first main-nav block used by curriculum/year hubs.
            n2=0
            if n1==0:
              s, n2 = re.subn(r'<nav\b[^>]*class="[^"]*\bmain-nav\b[^"]*"[^>]*>.*?</nav>\s*', '', s, count=1, flags=re.S|re.I)
            # Skip files that never had a top navigation; don't guess.
            if n1+n2==0:
              continue
            if '/assets/site-navigation.css' not in s:
              s=s.replace('</head>', '  <link rel="stylesheet" href="/assets/site-navigation.css?v=20260908-landing1">\n</head>', 1)
            # Add shared-nav body class while preserving existing classes.
            m=re.search(r'<body\b([^>]*)>',s,re.I)
            if not m:
              failures.append((str(p),'no body')); continue
            attrs=m.group(1)
            cm=re.search(r'class="([^"]*)"',attrs)
            if cm:
              classes=cm.group(1).split()
              if 'skillr-shared-navigation' not in classes: classes.append('skillr-shared-navigation')
              newattrs=attrs[:cm.start()] + 'class="'+' '.join(classes)+'"' + attrs[cm.end():]
            else:
              newattrs=attrs+' class="skillr-shared-navigation"'
            s=s[:m.start()]+'<body'+newattrs+'>'+s[m.end():]
            # Insert shared header immediately after body so it is not trapped inside page wrappers.
            body_end=s.find('>', s.lower().find('<body'))+1
            s=s[:body_end]+'\n'+header(p)+'\n'+s[body_end:]
            if s!=original:
              p.write_text(s)
              changed.append(str(p))

          if failures:
            raise SystemExit('Failures: '+repr(failures))
          if len(changed) < 40:
            raise SystemExit(f'Expected a broad landing-hub set; only changed {len(changed)} files: {changed}')
          Path('/tmp/landing-nav-files.txt').write_text('\n'.join(changed)+'\n')
          print(f'CHANGED={len(changed)}')
          print('\n'.join(changed))

          # Contract: every changed landing page gets exactly one shared header, the same 9 links
          # in desktop and mobile, and the shared responsive stylesheet.
          for name in changed:
            text=Path(name).read_text()
            assert text.count('class="site-header skillr-site-header"') == 1, name
            assert '/assets/site-navigation.css?v=20260908-landing1' in text, name
            assert 'skillr-shared-navigation' in text, name
            for href,_ in links:
              if text.count(f'href="{href}"') < 2:
                raise AssertionError((name,href,text.count(f'href="{href}"')))
          PY
      - name: Commit and clean temporary workflow
        run: |
          rm .github/workflows/normalize-all-landing-hubs-nav.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify responsive navigation across landing hubs'
          git push origin HEAD:${{ github.ref_name }}
