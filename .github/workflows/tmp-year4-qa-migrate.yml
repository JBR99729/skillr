name: Temporary Year 4 QA migration

on:
  push:
    branches:
      - agent/k6-qa-year4-next12

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k6-qa-year4-next12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped Year 4 static-topic migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            'year4/maths/ac9m4n07-choose-and-use-estimation-and-rounding-to-check-and-explain/index.html',
            'year4/maths/ac9m4n08-mathematical-modelling-to-solve-practical-problems-involving/index.html',
            'year4/maths/ac9m4n09-follow-and-create-algorithms-involving-a-sequence-of-steps-and/index.html',
            'year4/maths/ac9m4p01-possible-everyday-events-and-the-possible-outcomes-of-chance/index.html',
            'year4/maths/ac9m4p02-conduct-repeated-chance-experiments-to-observe-relationships/index.html',
            'year4/maths/ac9m4sp01-represent-and-approximate-composite-shapes-and-objects-in-the/index.html',
            'year4/maths/ac9m4sp02-and-interpret-grid-reference-systems-using-grid-references-and/index.html',
            'year4/maths/ac9m4sp03-line-and-rotational-symmetry-of-shapes-and-create-symmetrical/index.html',
            'year4/maths/ac9m4st01-acquire-data-for-categorical-and-discrete-numerical-variables/index.html',
            'year4/maths/ac9m4st02-analyse-the-effectiveness-of-different-displays-or/index.html',
            'year4/maths/ac9m4st03-conduct-statistical-investigations-collecting-data-through/index.html'
          ];

          const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

          function convertSections(html) {
            if (/<details\b/i.test(html) && /<summary\b/i.test(html)) return html;
            return html.replace(/<section\b([^>]*class=["'][^"']*curriculum-topic-section[^"']*["'][^>]*)>([\s\S]*?)<\/section>/gi, (all, attrs, body) => {
              const h = body.match(/<h2\b[^>]*>([\s\S]*?)<\/h2>/i);
              if (!h) return all;
              const title = h[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
              const rest = body.replace(h[0], '');
              return `<details ${attrs}><summary><strong>${escapeHtml(title)}</strong></summary><div class="curriculum-detail-body">${rest}</div></details>`;
            });
          }

          function normalizeTeacherResource(html) {
            const cleanAnchor = '<a class="curriculum-button primary" href="teacher-slides/" rel="noopener">Open Teacher Slides</a>';
            let out = html.replace(/(<details\b[^>]*class=["'][^"']*teacher-resource[^"']*["'][^>]*>[\s\S]*?)(<a\b[\s\S]*?<\/a>)([\s\S]*?<\/details>)/i, `$1${cleanAnchor}$3`);
            out = out.replace(/Use this one-page PDF to introduce the key idea, vocabulary and teaching sequence before students begin the activities\./gi, 'Open this fixed classroom slide deck to introduce the key idea, vocabulary and teaching sequence before students begin the activities.');
            return out;
          }

          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            html = convertSections(html);
            html = normalizeTeacherResource(html);
            html = html.replace(/<script\b[^>]*src=["'][^"']*(?:lower-materials-render|topic-modules-render|lesson-render|lower-materials-lessons)[^"']*["'][^>]*><\/script>\s*/gi, '');
            if (!/href=["'](?:\.\/)?teacher-slides\/["'][^>]*>\s*Open Teacher Slides\s*<\/a>/i.test(html)) {
              throw new Error(`${file}: valid static Teacher Slides link not produced`);
            }
            if (!/<details\b/i.test(html) || !/<summary\b/i.test(html)) {
              throw new Error(`${file}: native details/summary migration not produced`);
            }
            fs.writeFileSync(file, html);
          }
          NODE

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year4/maths/*/index.html
          if git diff --cached --quiet; then
            echo "No scoped changes required"
            exit 0
          fi
          git commit -m "Migrate next Year 4 Maths topics to static viewer architecture"
          git push origin HEAD:agent/k6-qa-year4-next12
