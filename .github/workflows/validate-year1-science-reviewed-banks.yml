name: Validate reviewed Year 1 Science banks
on:
  push:
    branches: [main]
    paths:
      - 'assets/assessment-banks/year1/science/ac9s1u0[123].json'
      - 'assets/assessment-visuals/year1/science/ixl-review-1/**'
      - 'quiz/year-1/science/ac9s1u0[123]/**'
      - 'scripts/year1_science_ixl_review/**'
      - 'scripts/validate-year1-science-review.cjs'
      - '.github/workflows/validate-year1-science-reviewed-banks.yml'
  pull_request:
    paths:
      - 'assets/assessment-banks/year1/science/ac9s1u0[123].json'
      - 'assets/assessment-visuals/year1/science/ixl-review-1/**'
      - 'quiz/year-1/science/ac9s1u0[123]/**'
      - 'scripts/year1_science_ixl_review/**'
      - 'scripts/validate-year1-science-review.cjs'
      - '.github/workflows/validate-year1-science-reviewed-banks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only DOM dependency
        run: npm install --prefix "$RUNNER_TEMP/science-bank-qa" --no-audit --no-fund jsdom@26.1.0
      - name: Check complete bank journeys
        run: NODE_PATH="$RUNNER_TEMP/science-bank-qa/node_modules" node scripts/validate-year1-science-review.cjs
      - name: Check topic journeys and review ledger
        run: |
          node scripts/validate_year1_science_static_topic_pages.mjs
          node scripts/update_content_verification_status.mjs --check
