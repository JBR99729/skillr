name: Author Year 9 Maths N01-A02 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-n01-a01-a02-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Maths homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9M9N01',title:'Real numbers, exact values and inequalities',intro:'Work with real numbers by comparing rational and irrational values, using exact forms such as π and square roots, estimating when useful, and representing inequalities correctly.',short:['Classify 7/8, √25, √30, 0.125, π and -4 as rational or irrational where appropriate.','Write an exact expression for the circumference of a circle with radius 6 cm, then give a decimal approximation.','Estimate √50 to one decimal place and explain why it is between 7 and 8.','Place √2, 1.5, 3/2 and π/2 in ascending order.','Explain the difference between an exact value and an approximation.','Solve x + 4 < 11 and show the solution on a number line.','Write an inequality for “n is at least 12”.','Round 7π to two decimal places and explain why the exact form may be better.','Correct this misconception: “Every decimal is irrational.”','Give a real-world situation where an inequality is more useful than a single number.'],long:['A circular table has diameter 1.2 m. Find the exact circumference in terms of π and an approximate circumference to the nearest centimetre.','Compare √45 and 6.7 without using a calculator as your only explanation. Show reasoning.','A container must hold at least 2.5 L but less than 3 L. Write and graph an inequality for the capacity c.','Solve 3x - 5 ≥ 16, then test two values to check your solution set.','Explain why √49 is rational but √50 is irrational, using definitions and examples.','A student says 22/7 and π are the same because calculators give close answers. Evaluate the claim.','Use a number line to show an interval of possible values for a measurement rounded to 8.4 cm to the nearest tenth.','Create and solve a practical problem that needs an exact value first and a rounded answer at the end.','Write a full solution to a problem involving real numbers, inequalities and approximation, including a reasonableness check.','Explain how exact values, approximations and inequalities can all be useful in measurement or design.'],task:'Find one real situation involving a measurement limit, tolerance, design size or circular measurement. Create a problem using exact values or inequalities, solve it, and explain the meaning of the answer.'},
            {code:'AC9M9A01',title:'Index laws, negative exponents and SI prefixes',intro:'Use index laws with positive and negative integer exponents, scientific notation and SI prefixes to simplify expressions and interpret very large or very small quantities.',short:['Simplify 3^4 × 3^2.','Simplify a^7 ÷ a^3, where a ≠ 0.','Simplify (x^2)^5.','Write 10^-3 as a fraction and name the SI prefix connected to 10^-3.','Convert 4.5 km to metres.','Convert 3200 mg to grams.','Write 0.000006 in scientific notation.','Explain why 5^0 = 1.','Correct this error: 2^-3 = -8.','Give one real-world context where negative exponents or SI prefixes are useful.'],long:['Simplify (2x^3y^-2)(4x^-1y^5) and write the answer with positive exponents.','A sensor records 0.0000048 m. Write this distance in scientific notation and in micrometres.','Compare 3.2 × 10^5 and 4.7 × 10^4. Explain which is larger and by what factor approximately.','A student writes (a^3)^2 = a^5. Explain the mistake and correct it using the index law.','Convert 7.5 gigabytes to bytes using powers of 10, then explain the meaning of the prefix giga.','Use index laws to simplify a multi-step expression containing multiplication, division and a power of a power.','Explain how SI prefixes help scientists and engineers avoid very long decimals or very large numbers.','A medicine dose is measured in micrograms but a scale reads milligrams. Create and solve a conversion problem.','Write a full worked solution involving scientific notation, SI prefixes and index laws, including unit checks.','Create a table of five SI prefixes from kilo to micro, showing the power of 10 and an example measurement.'],task:'Research one SI prefix used in science, computing, medicine or engineering. Explain its power of 10, give three examples, and create a conversion problem using it.'},
            {code:'AC9M9A02',title:'Algebraic expressions, expansion and factorising',intro:'Expand, simplify and factorise algebraic expressions, including products of binomials and expressions with common factors, while checking answers by reversing the process.',short:['Expand 4(x + 3).','Factorise 6x + 18.','Expand (x + 2)(x + 5).','Simplify 3a + 4b - a + 2b.','Factorise x^2 + 7x + 10.','Expand 2(3x - 4) - 5.','Identify the highest common factor in 12x^2 + 18x.','Factorise 9y^2 - 16 as a difference of squares.','Correct this error: 3(x + 4) = 3x + 4.','Explain how expansion and factorising are inverse processes.'],long:['Expand and simplify 3(2x - 5) + 4(x + 7).','Factorise 15x^2y - 10xy^2 fully and explain how you chose the common factor.','Expand (2x - 3)(x + 5), then substitute x = 2 to check the result.','Factorise x^2 - 9 and explain why it is a difference of squares.','A rectangle has side lengths x + 4 and x + 7. Write and expand an expression for its area.','A student factorises 8x + 12 as 2(4x + 12). Explain why this is incomplete and correct it.','Compare using an area model and distributive law to expand a pair of binomials.','Create a quadratic expression that factorises into two binomials, then expand to verify.','Solve a practical area problem that requires expanding and then simplifying an algebraic expression.','Write a full worked response showing expansion, simplification, factorisation and checking by substitution.'],task:'Find a real or designed rectangular area problem where side lengths are algebraic expressions. Model the area, expand it, factorise it if possible, and explain what each expression represents.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="/year9/curriculum/maths/">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct notation and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','math',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file, page(p));
          }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/math/ac9m9n01/homework/index.html quiz/year-9/math/ac9m9a01/homework/index.html quiz/year-9/math/ac9m9a02/homework/index.html
          git commit -m "Author Year 9 Maths N01-A02 homework"
          git push
