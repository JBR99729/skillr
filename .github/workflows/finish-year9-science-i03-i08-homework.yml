name: Finish Year 9 Science I03-I08 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/finish-year9-science-i03-i08-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9S9I03',title:'Collect Precise, Replicable Data',guide:'/year9/science/ac9s9i03-select-and-use-equipment-to-generate-and-record-data-with/',intro:'Select and use suitable equipment to generate and record data with appropriate precision, units and methods so another group can replicate the data collection.',short:['What does precision mean when recording scientific data?','Why should measurements include units?','Give one example of equipment suitable for measuring temperature accurately.','What is the difference between accuracy and precision?','Why should data be recorded immediately during an investigation?','What does replicable data collection mean?','How can a digital sensor improve data collection?','Why might a measuring cylinder be better than a beaker for measuring volume?','What is one way to reduce parallax error?','Correct this misconception: “More decimal places always means better data.”'],long:['Choose suitable equipment to measure temperature, mass, time and length in a dissolving investigation. Justify each choice.','Design a data table for repeated measurements of reaction time. Include headings, units and space for a mean.','Explain how poor equipment choice can affect the quality of evidence in an investigation.','Compare using a stopwatch, phone timer and light gate for measuring motion. Which gives more useful data and why?','A group records volume as 20, 20.0 mL and 0.021 L. Explain why this is a problem and rewrite it consistently.','Describe how to collect replicable data for an investigation into how ramp height affects trolley speed.','Explain how repeated measurements and averaging can improve confidence in a result.','Identify three possible measurement errors in a heating experiment and explain how to reduce them.','Evaluate whether data collected with no units, no repeats and vague equipment can support a reliable conclusion.','Write a full data-collection plan for one Year 9 investigation, including equipment, precision, units, table and repeat strategy.'],task:'Research one scientific instrument, such as a data logger, thermometer probe, pH meter, microscope, seismometer or light gate. Explain what it measures, its units, its precision and why it improves evidence quality.'},
            {code:'AC9S9I04',title:'Represent Data Without Distortion',guide:'/year9/science/ac9s9i04-select-and-construct-appropriate-representations-including/',intro:'Select and construct appropriate representations, including graphs, tables, models and diagrams, so data patterns are clear and not distorted.',short:['When is a line graph more suitable than a bar graph?','Why should graph axes include labels and units?','What is one way a graph scale can distort a pattern?','What type of representation suits categorical data?','Why is a table useful before making a graph?','What does a trend line show?','How can a diagram communicate a process better than text?','Why should scientific models include labels?','What is one limitation of a pie chart for continuous data?','Correct this misconception: “Any graph type is fine if the numbers are correct.”'],long:['Choose the best representation for data about temperature changing over time. Explain the graph type, axes, units and scale.','A student starts the y-axis at 90 instead of 0 to make a small change look large. Explain why this may mislead readers.','Compare a table, line graph and bar graph for communicating investigation results. State when each is useful.','Construct a representation plan for carbon dioxide levels over several decades, including graph type and scale.','Explain how an incorrect scale or missing units can change the message of a graph.','Design a labelled model to show energy transfers through a device and explain what the model shows well.','Evaluate a graph that has no title, no units, uneven spacing and no key. Suggest improvements.','Use a flow chart to represent a feedback loop in a body system and explain why that representation suits the process.','Create a table layout for an investigation with independent variable, three repeated trials and a calculated mean.','Write a full response explaining how to choose a representation that communicates data clearly without distortion.'],task:'Find a science graph or infographic from a reliable source. Explain what representation it uses, what pattern it shows, and one way the design could accidentally distort interpretation.'},
            {code:'AC9S9I05',title:'Patterns, Trends, Relationships and Anomalies',guide:'/year9/science/ac9s9i05-analyse-and-connect-a-variety-of-data-and-information-to/',intro:'Analyse and connect data to identify patterns, trends, relationships and anomalies, then make careful claims that match the evidence.',short:['What is a trend in scientific data?','What is an anomaly?','Why should an anomalous result be investigated before being removed?','What does a positive relationship between variables mean?','What does a negative relationship between variables mean?','Why can a graph make a trend easier to see than a table?','What is the difference between correlation and causation?','How can repeated trials help identify anomalies?','Write one cautious conclusion sentence using the word “suggests”.','Correct this misconception: “One unusual result should always be deleted.”'],long:['A graph shows reaction rate increasing as temperature increases. Describe the trend and give a possible explanation.','A data set has one result far from all the others. Explain three possible causes and what should be done next.','Compare two data sets and decide which gives stronger evidence, referring to trend, spread and repeats.','Explain why a correlation between two variables does not always prove one causes the other.','Analyse a graph showing heart rate before, during and after exercise. Identify the trend and explain the biology.','Use carbon-cycle data to explain how two pieces of evidence can support the same claim.','Evaluate a conclusion that ignores an anomaly because it does not fit the hypothesis.','Write a claim-evidence-reasoning paragraph from a described pattern in investigation results.','Explain how connecting several sources of data can make a scientific argument stronger.','Create a full analysis of one data pattern, including trend, relationship, anomaly, possible explanation and cautious conclusion.'],task:'Find a published graph or table about climate, health, sport, energy or environment. Identify the trend, one possible anomaly, and a careful conclusion supported by the evidence.'},
            {code:'AC9S9I06',title:'Validity, Reproducibility and Scientific Claims',guide:'/year9/science/ac9s9i06-assess-the-validity-and-reproducibility-of-methods-and-evaluate/',intro:'Assess validity and reproducibility of methods and evaluate whether scientific claims are supported by enough relevant evidence.',short:['What does validity mean for an investigation method?','What does reproducibility mean for a scientific method?','Why can a small sample weaken a claim?','What is an uncontrolled variable?','Why should a claim match the evidence collected?','What is one sign that a science claim may be exaggerated?','Why does peer review help evaluate claims?','How can bias affect data collection?','What question should you ask before trusting a product claim?','Correct this misconception: “If data supports my claim once, the claim is proven.”'],long:['Evaluate a claim that a drink improves concentration because five students felt more alert after drinking it.','A method has no control group, no repeats and vague measurements. Explain how each weakness affects the claim.','Compare a strong evidence-based claim with a weak claim based mostly on opinion or advertising.','Analyse a health, cleaning, energy or fitness product claim. What evidence would be needed to test it fairly?','Explain how confirmation bias could affect how a student records observations.','Rewrite an overconfident conclusion so it accurately reflects limited evidence.','Describe how to improve a weak method so its results are more valid and reproducible.','Evaluate whether one surprising result should lead to a strong claim or further testing.','Create a checklist for judging whether a scientific claim is trustworthy.','Write a full evaluation of one claim, including method quality, evidence strength, limitations and final judgement.'],task:'Choose one science-related claim from an advertisement, article or social media post. Identify the claim, evidence provided, missing evidence, possible bias and your judgement.'},
            {code:'AC9S9I07',title:'Argue from Multiple Lines of Evidence',guide:'/year9/science/ac9s9i07-construct-arguments-based-on-analysis-of-a-variety-of-evidence/',intro:'Construct scientific arguments using several lines of evidence, explaining how each piece supports or limits the conclusion.',short:['What is a scientific argument?','What is meant by a line of evidence?','Why is more than one source of evidence useful?','What is the difference between evidence and reasoning?','Why should counter-evidence be considered?','What makes evidence relevant to a claim?','How can a graph support an argument?','How can a model support an argument?','What is one limitation of relying on a single data source?','Correct this misconception: “A strong argument is just a confident opinion.”'],long:['Construct an argument that body systems help maintain homeostasis using at least two lines of evidence.','Use evidence from atomic models to argue that scientific knowledge changes when new evidence appears.','Build an argument about the carbon cycle using data, a diagram and a real-world example.','Compare two claims about energy efficiency and decide which is better supported by evidence.','Explain how counter-evidence can improve a scientific argument rather than weaken science.','Write a claim-evidence-reasoning response using data from a described investigation.','Evaluate an argument that uses only a personal story and no measured data.','Use multiple pieces of evidence to argue whether a proposed environmental action is scientifically justified.','Create a table listing claim, evidence, reasoning and limitation for a Year 9 science issue.','Write a full scientific argument with claim, at least three evidence points, reasoning, limitation and conclusion.'],task:'Research one current science issue and collect at least three different evidence sources. Build a scientific argument that includes claim, evidence, reasoning, limitations and final judgement.'},
            {code:'AC9S9I08',title:'Effective Scientific Communication',guide:'/year9/science/ac9s9i08-and-create-texts-to-communicate-ideas-findings-and-arguments/',intro:'Create scientific texts that communicate ideas, findings and arguments clearly for a purpose and audience using evidence, representations and correct vocabulary.',short:['Why does audience matter in science communication?','What is one feature of a clear scientific explanation?','Why should scientific claims include evidence?','Name two formats used to communicate science findings.','How can a labelled diagram improve communication?','Why should technical terms be defined for non-expert audiences?','What is the role of a title in a graph or report?','How can a conclusion link evidence and reasoning?','What is one risk of oversimplifying science communication?','Correct this misconception: “Good science communication means using the most difficult words possible.”'],long:['Write a short explanation of negative feedback for a Year 7 audience using clear vocabulary and one example.','Turn investigation results into a claim-evidence-reasoning paragraph suitable for a science report.','Design a one-page infographic plan about the carbon cycle, including headings, visuals and evidence.','Compare how you would explain radioactive isotopes to a doctor, a Year 6 student and a community audience.','Rewrite a confusing conclusion so it includes claim, evidence, reasoning and limitation.','Create a communication plan for a school poster about energy efficiency. Include purpose, audience and key evidence.','Explain how graphs, diagrams and tables can support written scientific arguments.','Evaluate a science infographic for clarity, evidence and possible misleading features.','Write a short speech recommending a science-based action to a local council, using evidence.','Create a full communication product outline for one Year 9 science topic, including audience, format, evidence and visual representation.'],task:'Find a science communication example such as an article, museum display, video, poster or infographic. Explain its audience, message, evidence, strengths and one improvement.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Science ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/science/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Science • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Use precise science language and support longer responses with clear reasoning.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Science homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','science',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file, page(p));
          }
          NODE
      - name: Commit final Year 9 Science inquiry homework
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/science/ac9s9i03/homework/index.html quiz/year-9/science/ac9s9i04/homework/index.html quiz/year-9/science/ac9s9i05/homework/index.html quiz/year-9/science/ac9s9i06/homework/index.html quiz/year-9/science/ac9s9i07/homework/index.html quiz/year-9/science/ac9s9i08/homework/index.html
          git commit -m "Finish Year 9 Science inquiry homework pages"
          git push
