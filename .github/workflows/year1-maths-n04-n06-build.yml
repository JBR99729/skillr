name: Complete Year 1 Maths AC9M1N04-N06 rebuild

on:
  push:
    branches:
      - agent/year1-maths-ac9m1n04-n06-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[y1-n04-n06-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-ac9m1n04-n06-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply the reviewed banks
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/y1-n04-n06-package-b64/part-* | tr -d '\n\r ' | base64 -d > /tmp/year1-maths-n04-n06.tar.gz
          gzip -t /tmp/year1-maths-n04-n06.tar.gz
          tar -xzf /tmp/year1-maths-n04-n06.tar.gz -C .
          node scripts/apply-year1-maths-n04-n06.js

      - name: Validate educational and technical quality gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-year1-maths-n04-n06.js
          node --check assets/qa-complete-ribbon.js
          node --check quiz/assets/daily-drills/year1-maths-n04-n06-extensions.js
          node --check service-worker.js
          for file in quiz/year-1/math/{ac9m1n04,ac9m1n05,ac9m1n06}/{questions.js,practice/questions.js,practice/practice-questions.js,test/questions.js}; do
            node --check "$file"
          done
          ! grep -RniE 'self-check|answers may vary|a different choice|which learning goal best|which classroom activity best' \
            quiz/year-1/math/{ac9m1n04,ac9m1n05,ac9m1n06} \
            quiz/assets/daily-drills/year1-maths-n04-n06-extensions.js

      - name: Remove temporary packaging inputs
        shell: bash
        run: |
          rm -rf scripts/y1-n04-n06-package-b64
          rm -f scripts/apply-year1-maths-n04-n06.js
          rm -f .github/workflows/year1-maths-n04-n06-build.yml

      - name: Commit completed rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild AC9M1N04-AC9M1N06 Year 1 Maths banks [y1-n04-n06-built]"
          git push origin HEAD:agent/year1-maths-ac9m1n04-n06-rebuild
