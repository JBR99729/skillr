name: Author Year 9 Maths topic depth A03-A05

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-topic-depth-a03-a05.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write deeper Year 9 Maths topic pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const style = `<style>
          :root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.mini-table{width:100%;border-collapse:collapse;margin-top:10px}.mini-table th,.mini-table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.mini-table th{background:var(--soft)}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}
          </style>`;
          const pages = [
            {
              code:'AC9M9A03',
              slug:'year9/maths/ac9m9a03-find-the-gradient-of-a-line-segment-the-midpoint-of/index.html',
              canonical:'/year9/maths/ac9m9a03-find-the-gradient-of-a-line-segment-the-midpoint-of/',
              title:'Gradient, midpoint and distance on the Cartesian plane',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9A03: find gradients, midpoints and distances between points, then use these ideas to model straight-line situations.',
              intro:'This topic turns coordinate geometry into a practical toolkit. Students learn how to describe the steepness of a line, locate the exact halfway point between two coordinates, and measure the distance between points on a grid. These skills prepare students for linear graphs, analytic geometry and modelling movement or location.',
              concepts:[
                ['Gradient measures steepness','Gradient compares vertical change with horizontal change. A positive gradient rises left to right; a negative gradient falls left to right; a zero gradient is horizontal.'],
                ['Midpoint finds the halfway coordinate','The midpoint is found by averaging the x-coordinates and averaging the y-coordinates separately.'],
                ['Distance uses Pythagoras','The distance between two points is the hypotenuse of a right triangle formed by the horizontal and vertical changes.'],
                ['Coordinate geometry models real movement','Maps, routes, slopes, paths and screen coordinates all use the same ideas: position, change and distance.']
              ],
              formulas:['gradient = rise/run = (y₂ − y₁)/(x₂ − x₁)','midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2)','distance = √((x₂ − x₁)² + (y₂ − y₁)²)'],
              workedTitle:'Worked example: from A(2, 3) to B(8, 11)',
              worked:['Horizontal change: 8 − 2 = 6. Vertical change: 11 − 3 = 8.','Gradient = 8/6 = 4/3.','Midpoint = ((2 + 8)/2, (3 + 11)/2) = (5, 7).','Distance = √(6² + 8²) = √100 = 10 units.','Interpretation: the segment rises 4 units for every 3 units across, has centre (5, 7), and length 10 units.'],
              quick:['Find the gradient from (1, 4) to (5, 12).','Find the midpoint of (−2, 7) and (6, 1).','Explain why the distance formula is based on Pythagoras.'],
              traps:['Reversing the point order in only one part of the gradient calculation.','Forgetting that a negative gradient is normal when the line falls left to right.','Averaging all four numbers together instead of averaging x-values and y-values separately.','Using x-change + y-change instead of Pythagoras for distance.'],
              parent:'Ask students to explain what each coordinate represents before calculating. A quick sketch often prevents sign errors and helps students choose gradient, midpoint or distance correctly.'
            },
            {
              code:'AC9M9A04',
              slug:'year9/maths/ac9m9a04-and-graph-quadratic-functions-solve-quadratic-equations/index.html',
              canonical:'/year9/maths/ac9m9a04-and-graph-quadratic-functions-solve-quadratic-equations/',
              title:'Quadratic functions, graphs and equations',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9A04: graph quadratic functions, identify key features of parabolas and solve quadratic equations using factorising and graphical reasoning.',
              intro:'Quadratics are the next major step after linear relationships. Instead of a constant rate of change, a quadratic creates a curved graph called a parabola. Students connect tables, equations and graphs, then use factorising and graph features to solve equations.',
              concepts:[
                ['A quadratic has a squared variable','A relation such as y = x² or y = x² + 3x + 2 is quadratic because the highest power of x is 2.'],
                ['The graph is a parabola','A positive x² coefficient opens upward; a negative x² coefficient opens downward. The turning point is the minimum or maximum.'],
                ['Roots are x-intercepts','Solving a quadratic equation often means finding where the graph crosses the x-axis.'],
                ['Factorising links algebra and graphing','If y = (x − 2)(x + 5), the x-intercepts are x = 2 and x = −5.']
              ],
              formulas:['standard form: y = ax² + bx + c','factorised form: y = a(x − r)(x − s)','x-intercepts occur where y = 0'],
              workedTitle:'Worked example: solve x² − 5x + 6 = 0',
              worked:['Look for two numbers that multiply to 6 and add to −5: −2 and −3.','Factorise: x² − 5x + 6 = (x − 2)(x − 3).','Set each factor to zero: x − 2 = 0 or x − 3 = 0.','Solutions: x = 2 or x = 3.','Graph interpretation: the parabola crosses the x-axis at 2 and 3.'],
              quick:['For y = x² − 4, state the two x-intercepts.','Explain why y = −x² opens downward.','Factorise x² + 7x + 12 and identify the roots.'],
              traps:['Treating x² as if it were just 2x.','Forgetting that a quadratic can have two, one or no real x-intercepts.','Thinking the y-intercept and x-intercepts are the same thing.','Solving only one factor after factorising.'],
              parent:'Encourage students to move between table, graph and equation. The best understanding comes from seeing that the same quadratic can be represented in several connected ways.'
            },
            {
              code:'AC9M9A05',
              slug:'year9/maths/ac9m9a05-mathematical-modelling-to-solve-applied-problems-involving/index.html',
              canonical:'/year9/maths/ac9m9a05-mathematical-modelling-to-solve-applied-problems-involving/',
              title:'Mathematical modelling with linear, quadratic and financial contexts',
              meta:'Year 9 Australian Curriculum Maths topic guide for AC9M9A05: use mathematical modelling to solve applied problems, choose variables, form equations, interpret outputs and evaluate assumptions.',
              intro:'Mathematical modelling is about turning a real situation into a useful mathematical representation. In Year 9, students use linear and quadratic relationships, rates, constraints and financial contexts to make predictions, compare options and explain limitations.',
              concepts:[
                ['A model is a simplified version of reality','Models focus on important quantities and ignore some detail. Good models are useful, not perfect.'],
                ['Variables represent changing quantities','Choosing clear variables makes the equation easier to build and interpret.'],
                ['Linear models show constant change','A linear model is suitable when the same amount is added or removed each step.'],
                ['Quadratic models can represent curved patterns','Area, projectile-style paths and some optimisation contexts can involve quadratic behaviour.']
              ],
              formulas:['linear model: y = mx + c','simple interest: I = Prt','total amount: A = P + I','quadratic model example: y = ax² + bx + c'],
              workedTitle:'Worked example: choosing between two hire plans',
              worked:['Plan A costs $20 plus $8 per hour, so A = 20 + 8h.','Plan B costs $50 plus $5 per hour, so B = 50 + 5h.','Set equal to find the break-even point: 20 + 8h = 50 + 5h.','3h = 30, so h = 10.','Interpretation: for 10 hours the plans cost the same; below 10 hours Plan A is cheaper, above 10 hours Plan B is cheaper.'],
              quick:['Write a linear cost model for a $12 booking fee plus $4 per item.','Explain why a model may be useful even if it is not perfectly realistic.','Find the simple interest on $800 at 6% p.a. for 3 years.'],
              traps:['Writing an equation without defining variables.','Forgetting units, such as dollars, hours or years.','Using a linear model when the pattern is not changing by a constant amount.','Giving a numerical answer without interpreting what it means in context.'],
              parent:'Ask students to say what the variables mean, what assumptions are being made, and whether the final answer is sensible. This builds stronger modelling habits than calculation alone.'
            }
          ];
          function cardList(items){return items.map(([h,t])=>`<article class="grid-card"><h3>${esc(h)}</h3><p>${esc(t)}</p></article>`).join('');}
          function bullet(items){return items.map(x=>`<li>${esc(x)}</li>`).join('');}
          function page(p){
            const codeLower = p.code.toLowerCase();
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title)} | ${p.code} Year 9 Maths | SkillrHub</title><meta name="description" content="${esc(p.meta)}"><link rel="canonical" href="https://skillrhub.com${p.canonical}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/maths/">Year 9 Maths</a> › ${p.code}</p><section class="hero"><p class="kicker">Year 9 Maths • ${p.code}</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)}</p><div class="cta"><a class="primary" href="/quiz/year-9/math/${codeLower}/practice/">Start Practice</a><a href="/quiz/year-9/math/${codeLower}/test/">Take Test</a><a href="/quiz/year-9/math/${codeLower}/homework/">Open Homework</a></div></section><section class="card"><p class="kicker">Core understanding</p><h2>What students need to understand</h2><div class="grid">${cardList(p.concepts)}</div></section><section class="card"><p class="kicker">Key tools</p><h2>Formulas and representations</h2>${p.formulas.map(f=>`<p><span class="formula">${esc(f)}</span></p>`).join('')}<p class="note">Choose the formula or representation that matches the question. In Year 9, marks often come from defining variables, showing substitutions and interpreting the result.</p></section><section class="card worked"><p class="kicker">Worked example</p><h2>${esc(p.workedTitle)}</h2><ol class="steps">${bullet(p.worked)}</ol></section><section class="card"><p class="kicker">Quick check</p><h2>Try these before practice</h2><ol class="steps">${bullet(p.quick)}</ol></section><section class="card warning"><p class="kicker">Common misconceptions</p><h2>Watch for these mistakes</h2><ul class="checklist">${bullet(p.traps)}</ul></section><section class="card"><p class="kicker">Support tip</p><h2>For parents and teachers</h2><p>${esc(p.parent)}</p></section><section class="card"><p class="kicker">Next steps</p><h2>Build fluency</h2><p>Use the topic guide first, then practise until the method feels natural. The test should be used only after students can explain the method, not just copy steps.</p><div class="cta"><a class="primary" href="/quiz/year-9/math/${codeLower}/practice/">Practice ${p.code}</a><a href="/quiz/year-9/math/${codeLower}/test/">Test ${p.code}</a><a href="/quiz/year-9/math/${codeLower}/homework/">Homework ${p.code}</a></div></section><p class="footer">SkillrHub • Year 9 Australian Curriculum Maths • ${p.code}</p></main></body></html>`;
          }
          for (const p of pages) fs.writeFileSync(p.slug, page(p));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add year9/maths/ac9m9a03-find-the-gradient-of-a-line-segment-the-midpoint-of/index.html year9/maths/ac9m9a04-and-graph-quadratic-functions-solve-quadratic-equations/index.html year9/maths/ac9m9a05-mathematical-modelling-to-solve-applied-problems-involving/index.html
