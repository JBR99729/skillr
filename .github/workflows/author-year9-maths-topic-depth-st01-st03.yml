name: Author Year 9 Maths topic depth ST01-ST03

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-maths-topic-depth-st01-st03.trigger'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deepen Year 9 Maths ST topic pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html

          css = ":root{--blue:#2457d6;--ink:#18324f;--muted:#5f728a;--line:#dce5f1;--soft:#f5f8ff;--green:#0b7a53;--amber:#8a5a00}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.page{max-width:1040px;margin:0 auto;padding:24px}.crumbs{font-size:.9rem;margin:0 0 14px;color:var(--muted)}.crumbs a{color:var(--blue);font-weight:700;text-decoration:none}.hero,.card,.grid-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:24px;margin:16px 0}.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:900;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.1rem;margin:0 0 8px}.hero p{font-size:1.08rem;color:#304963;max-width:840px}.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.cta a{display:inline-block;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900;border:1px solid #cbd8ea;background:#fff;color:var(--blue)}.cta a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-card{margin:0}.worked{border-left:6px solid var(--green)}.warning{border-left:6px solid var(--amber)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 12px;display:inline-block}.steps{padding-left:1.3rem}.steps li{margin:8px 0}.checklist li{margin:6px 0}.mini-table{width:100%;border-collapse:collapse;margin-top:10px}.mini-table th,.mini-table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.mini-table th{background:var(--soft)}.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}.footer{color:var(--muted);font-size:.9rem;margin:28px 0;text-align:center}@media(max-width:760px){.grid,.three{grid-template-columns:1fr}.page{padding:16px}h1{font-size:2.1rem}}"

          pages = [
            {
              'code':'AC9M9ST01','slug':'ac9m9st01','path':'year9/maths/ac9m9st01-analyse-reports-of-surveys-in-digital-media-and-elsewhere-for/index.html','canonical':'https://skillrhub.com/year9/maths/ac9m9st01-analyse-reports-of-surveys-in-digital-media-and-elsewhere-for/','title':'Analysing survey reports in media and digital contexts','desc':'Year 9 Australian Curriculum Maths topic guide for AC9M9ST01: analyse survey reports in digital media and elsewhere, check claims, and judge reliability of data-based conclusions.','intro':'This topic helps students become careful readers of survey reports. Students learn to identify who was surveyed, how the survey was conducted, what the data actually shows, and whether the conclusion is justified.','ideas':['A survey report should clearly state the population, sample size, sampling method and question wording.','A strong conclusion matches the data and avoids exaggerating beyond what was asked.','Graphs, percentages and headlines can make a claim look stronger than the evidence supports.','Reliability improves when the sample is large, relevant and not obviously biased.'],'rules':['Always ask: who was surveyed?','Check whether percentages include the sample size.','Look for loaded wording, missing options or unclear categories.','Separate the data from the author’s interpretation.'],'example_title':'Worked example: reading a survey claim','steps':['A headline says, “90% of students want longer lunch breaks.”','The report shows only 10 students from one class were surveyed.','90% means 9 out of 10 students, so the percentage is based on a very small sample.','The claim may describe that class, but it is not strong evidence about all students.','A cautious conclusion would say: in this small sample, most students preferred longer lunch breaks.'],'misconceptions':['Trusting a percentage without checking the sample size.','Assuming a survey represents everyone when only one group was asked.','Confusing a headline with the actual statistical evidence.','Ignoring question wording that pushes people toward a certain answer.'],'checks':['A report says 80% of 20 people agree. How many people is that?','Why is “Do you agree with our excellent new policy?” a biased question?','List two details that make a survey report more trustworthy.'],'tip':'Use real news headlines or school survey examples. Ask students to rewrite exaggerated claims as careful statistical conclusions.'
            },
            {
              'code':'AC9M9ST02','slug':'ac9m9st02','path':'year9/maths/ac9m9st02-analyse-how-different-sampling-methods-can-affect-the-results-of/index.html','canonical':'https://skillrhub.com/year9/maths/ac9m9st02-analyse-how-different-sampling-methods-can-affect-the-results-of/','title':'Sampling methods, bias and data representation','desc':'Year 9 Australian Curriculum Maths topic guide for AC9M9ST02: analyse how sampling methods affect survey results, identify sampling bias and represent data fairly.','intro':'This topic focuses on how data is collected. Students compare random, convenience, volunteer and stratified sampling, and explain how sample choice can change survey results.','ideas':['A sample should represent the population being studied.','Convenience and volunteer samples are often easier to collect but may be biased.','Random sampling can reduce bias when done carefully.','Data representation choices can make results look more or less dramatic.'],'rules':['population = the whole group of interest','sample = the smaller group actually surveyed','sampling bias occurs when some groups are over-represented or under-represented','a fair graph uses clear labels, sensible scale and honest categories'],'example_title':'Worked example: identifying sampling bias','steps':['A school asks only students in the chess club whether the school should buy more chess sets.','The population may be all students, but the sample is only chess club members.','Chess club members are more likely to support buying chess sets.','The sample is biased because it does not represent the whole school.','A better method would sample students from different year levels and interest groups.'],'misconceptions':['Thinking a large sample is always fair even if it comes from one biased group.','Using “random” to mean “whoever was nearby”.','Forgetting to define the population before judging the sample.','Using graph scales that exaggerate small differences.'],'checks':['Identify the population in a survey about Year 9 students’ homework habits.','Why might an online poll be biased?','Describe one way to make a school survey more representative.'],'tip':'Have students compare two ways of sampling the same population. The key question is: who might be missed by this method?'
            },
            {
              'code':'AC9M9ST03','slug':'ac9m9st03','path':'year9/maths/ac9m9st03-represent-the-distribution-of-multiple-data-sets-for-numerical/index.html','canonical':'https://skillrhub.com/year9/maths/ac9m9st03-represent-the-distribution-of-multiple-data-sets-for-numerical/','title':'Comparing distributions of multiple data sets','desc':'Year 9 Australian Curriculum Maths topic guide for AC9M9ST03: represent and compare numerical data distributions using centre, spread, shape and outliers.','intro':'This topic helps students compare two or more numerical data sets. Students use graphs and summary statistics to describe centre, spread, shape and unusual values, then write clear comparison statements.','ideas':['Centre describes a typical value, often using median or mean.','Spread describes how varied the data is, using range or interquartile range.','Shape describes the pattern of the distribution, such as clustered, symmetric or skewed.','Outliers can affect the mean and may need explanation.'],'rules':['range = maximum − minimum','median = middle value after ordering','IQR = upper quartile − lower quartile','compare data sets using centre, spread, shape and outliers, not only one number'],'example_title':'Worked example: compare two data sets','steps':['Class A test scores have median 68 and range 40. Class B has median 72 and range 18.','Class B has the higher typical score because its median is 72 compared with 68.','Class B is also more consistent because its range is smaller.','Class A has more spread, so student results vary more.','A complete comparison discusses both centre and spread.'],'misconceptions':['Saying one group is better using only the highest score.','Ignoring spread when comparing typical performance.','Using the mean without checking for outliers.','Forgetting to mention the graph shape when comparing distributions.'],'checks':['Which measure describes the middle of an ordered data set?','Why can a smaller range suggest more consistent results?','Write one sentence comparing two data sets using centre and spread.'],'tip':'Use dot plots or box plots side by side. Encourage students to use the sentence frame: “Group A has a higher/lower centre, while Group B has a larger/smaller spread.”'
            }
          ]

          def card_list(items):
              return ''.join(f'<div class="grid-card"><h3>Key idea</h3><p>{html.escape(x)}</p></div>' for x in items)
          def rule_list(items):
              return ''.join(f'<div class="grid-card"><span class="formula">{html.escape(x)}</span></div>' for x in items)
          def li(items):
              return ''.join(f'<li>{html.escape(x)}</li>' for x in items)

          for p in pages:
              code_lower = p['code'].lower()
              body = f'''<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(p['title'])} | {p['code']} Year 9 Maths | SkillrHub</title><meta name="description" content="{html.escape(p['desc'])}"><link rel="canonical" href="{p['canonical']}"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><link rel="stylesheet" href="/style.css"><style>{css}</style></head><body><main class="page"><p class="crumbs"><a href="/">Home</a> › <a href="/year9/curriculum/maths/">Year 9 Maths</a> › {p['code']}</p><section class="hero"><p class="kicker">Year 9 Maths • {p['code']} • Topic guide</p><h1>{html.escape(p['title'])}</h1><p>{html.escape(p['intro'])}</p><div class="cta"><a class="primary" href="/quiz/year-9/math/{code_lower}/practice/">Start practice</a><a href="/quiz/year-9/math/{code_lower}/test/">Take test</a><a href="/quiz/year-9/math/{code_lower}/homework/">Open homework</a></div></section><section class="card"><p class="kicker">Core understanding</p><h2>What students need to know</h2><div class="grid three">{card_list(p['ideas'])}</div></section><section class="card"><p class="kicker">Formulas and representations</p><h2>Useful rules and ways to represent the idea</h2><div class="grid">{rule_list(p['rules'])}</div></section><section class="card worked"><p class="kicker">Worked example</p><h2>{html.escape(p['example_title'])}</h2><ol class="steps">{li(p['steps'])}</ol></section><section class="card warning"><p class="kicker">Common misconceptions</p><h2>What to watch for</h2><ul class="checklist">{li(p['misconceptions'])}</ul></section><section class="card"><p class="kicker">Quick check</p><h2>Try these before moving on</h2><ol class="steps">{li(p['checks'])}</ol></section><section class="card"><p class="kicker">Support tip</p><h2>For parents and teachers</h2><p class="note">{html.escape(p['tip'])}</p></section><section class="card"><p class="kicker">Next steps</p><h2>Practise this skill</h2><p>Use the linked homework, practice and test to move from recognition to independent problem solving.</p><div class="cta"><a href="/quiz/year-9/math/{code_lower}/homework/">Homework</a><a class="primary" href="/quiz/year-9/math/{code_lower}/practice/">Practice</a><a href="/quiz/year-9/math/{code_lower}/test/">Test</a></div></section><p class="footer">SkillrHub • Australian Curriculum aligned Year 9 Maths topic guide</p></main></body></html>'''
              Path(p['path']).parent.mkdir(parents=True, exist_ok=True)
              Path(p['path']).write_text(body, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add year9/maths/ac9m9st01-analyse-reports-of-surveys-in-digital-media-and-elsewhere-for/index.html year9/maths/ac9m9st02-analyse-how-different-sampling-methods-can-affect-the-results-of/index.html year9/maths/ac9m9st03-represent-the-distribution-of-multiple-data-sets-for-numerical/index.html
          git commit -m "Deepen Year 9 Maths ST01-ST03 topic pages" || exit 0
          git push
