name: Validate Foundation Maths Daily Drill

on:
  push:
    branches: [main]
    paths:
      - "curriculum-question-banks/banks/foundation/foundation-numbers-to-20-daily-drills.json"
      - "quiz/assets/daily-drills/foundation-numbers-to-20-reviewed.js"
      - "quiz/grade-k/daily-drills/math/numbers-to-20/index.html"
      - "scripts/build_foundation_numbers_to_20_reviewed.mjs"
      - "scripts/validate_foundation_numbers_to_20_reviewed.mjs"
      - ".github/workflows/validate-foundation-maths-daily-drill.yml"
  pull_request:
    paths:
      - "curriculum-question-banks/banks/foundation/foundation-numbers-to-20-daily-drills.json"
      - "quiz/assets/daily-drills/foundation-numbers-to-20-reviewed.js"
      - "quiz/grade-k/daily-drills/math/numbers-to-20/index.html"
      - "scripts/build_foundation_numbers_to_20_reviewed.mjs"
      - "scripts/validate_foundation_numbers_to_20_reviewed.mjs"
      - ".github/workflows/validate-foundation-maths-daily-drill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild deterministically
        run: |
          node scripts/build_foundation_numbers_to_20_reviewed.mjs
          git diff --exit-code -- curriculum-question-banks/banks/foundation/foundation-numbers-to-20-daily-drills.json quiz/assets/daily-drills/foundation-numbers-to-20-reviewed.js
      - name: Validate reviewed bank
        run: node scripts/validate_foundation_numbers_to_20_reviewed.mjs
      - name: Check route wiring and review ledger
        run: |
          grep -F 'foundation-numbers-to-20-reviewed.js?v=20260906-2' quiz/grade-k/daily-drills/math/numbers-to-20/index.html
          node scripts/update_content_verification_status.mjs --check
