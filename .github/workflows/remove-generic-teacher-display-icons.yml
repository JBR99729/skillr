name: Remove generic Teacher Display filler visuals

on:
  push:
    branches:
      - fix/remove-generic-teacher-display-icons

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated filler visuals
        run: node scripts/remove_generic_teacher_display_icons.mjs

      - name: Validate static curriculum architecture
        run: node scripts/validate_static_curriculum_architecture.mjs

      - name: Validate F-10 topic layout
        run: node scripts/validate_f10_topic_layout_contract.mjs

      - name: Audit static curriculum site
        run: node scripts/audit_static_curriculum_site.mjs --fail-on-runtime-topics

      - name: Commit generated cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-generic-teacher-display-icons.yml
          git add foundation year1 year2 year3 year4 year5 year6 year7 scripts .github/workflows/remove-generic-teacher-display-icons.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove generic Teacher Display filler visuals through Year 7"
          git push origin HEAD:fix/remove-generic-teacher-display-icons
