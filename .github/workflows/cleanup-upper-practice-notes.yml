name: Cleanup upper practice notes

on:
  push:
    branches: [main]
    paths:
      - '.github/cleanup-upper-practice-notes.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale upper practice notes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const roots = [
            'quiz/year-8/math', 'quiz/year-8/science',
            'quiz/year-9/math', 'quiz/year-9/science',
            'quiz/year-10/math', 'quiz/year-10/science'
          ];

          const replacement = '<section class="pre-read-notes"><h2>Before you start</h2><ul><li>Use the topic guide first if you need a quick review.</li><li>Read each question carefully and choose the best answer.</li><li>After checking your answer, use the feedback to fix mistakes before your next attempt.</li></ul></section>';
          const notePattern = /<section class="pre-read-notes">[\s\S]*?<\/section>/g;
          let changed = 0;

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const entries = [];
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) entries.push(...walk(full));
              else if (item.isFile()) entries.push(full);
            }
            return entries;
          }

          for (const root of roots) {
            for (const file of walk(root)) {
              if (!file.replace(/\\/g, '/').endsWith('/practice/index.html')) continue;
              const original = fs.readFileSync(file, 'utf8');
              if (!notePattern.test(original)) continue;
              notePattern.lastIndex = 0;
              const updated = original.replace(notePattern, replacement);
              if (updated !== original) {
                fs.writeFileSync(file, updated);
                changed += 1;
              }
            }
          }

          console.log(`Updated ${changed} Year 8-10 Maths/Science practice note blocks.`);
          NODE
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-8/math quiz/year-8/science quiz/year-9/math quiz/year-9/science quiz/year-10/math quiz/year-10/science
          git commit -m "Normalize Year 8-10 practice prep notes"
          git push
