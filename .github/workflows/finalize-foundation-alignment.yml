name: Finalize Foundation alignment success criteria
on: push
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: pip install beautifulsoup4
      - name: Fix generated look-for lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          changed=0
          def clean(s):return re.sub(r'\s+',' ',s or '').strip()
          for cp in sorted(Path('.').glob('foundation/*/*/teacher-slides/index.html')):
            src=cp.read_text(errors='ignore')
            if 'Teach, ask and check' not in src:continue
            soup=BeautifulSoup(src,'html.parser')
            target=None
            for d in soup.find_all('details'):
              if d.find('summary') and 'Teach, ask and check' in clean(d.find('summary').get_text(' ',strip=True)):
                target=d;break
            if not target:continue
            ps=target.find_all('p')
            focusp=next((p for p in ps if clean(p.get_text(' ',strip=True)).lower().startswith('learning focus:')),None)
            lookp=next((p for p in ps if clean(p.get_text(' ',strip=True)).lower().startswith('look for:')),None)
            if not focusp or not lookp:continue
            focus=clean(focusp.get_text(' ',strip=True).split(':',1)[-1]).rstrip('.')
            look=clean(lookp.get_text(' ',strip=True).split(':',1)[-1])
            if '?' in look or len(look)<35:
              lookp.clear(); strong=soup.new_tag('strong'); strong.string='Look for:'; lookp.append(strong); lookp.append(f' The learner can {focus} in a fresh example and explain the evidence or reasoning without copying the model.')
              final=str(soup)
              if src.lstrip().lower().startswith('<!doctype') and not final.lstrip().lower().startswith('<!doctype'):
                final='<!DOCTYPE html>\n'+final
              cp.write_text(final);changed+=1
          print('changed',changed)
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/finalize-foundation-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundation .github/workflows/finalize-foundation-alignment.yml
          if ! git diff --cached --quiet; then git commit -m 'content: finalize Foundation classroom success criteria'; git push origin HEAD:${{ github.ref_name }}; fi
