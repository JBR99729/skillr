name: Complete remaining Foundation Science rebuild

on:
  push:
    branches:
      - agent/foundation-science-remaining-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[remaining-science-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-science-remaining-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and apply authored rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/foundation-science-remaining-b64/part-* | tr -d '\n\r ' | base64 -d > /tmp/foundation-science-remaining-rebuild.tar.gz
          gzip -t /tmp/foundation-science-remaining-rebuild.tar.gz
          tar -xzf /tmp/foundation-science-remaining-rebuild.tar.gz -C .
          node scripts/apply-foundation-science-remaining.js

      - name: Validate all six curriculum codes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const codes = ['ac9sfi03','ac9sfi04','ac9sfi05','ac9sfu01','ac9sfu02','ac9sfu03'];
          const expected = { practice: 56, test: 24 };

          function load(file, seedWindow = {}) {
            const context = { window: seedWindow, console };
            vm.createContext(context);
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
            return context.window;
          }
          function signature(q) {
            return `${q.question}\n${q.visual || ''}`;
          }
          for (const code of codes) {
            const banks = {};
            for (const bank of ['practice','test']) {
              const file = `quiz/grade-k/science/${code}/${bank}/questions.js`;
              const win = load(file);
              const qs = win.quizQuestions;
              if (!Array.isArray(qs) || qs.length !== expected[bank]) {
                throw new Error(`${file}: expected ${expected[bank]}, found ${qs?.length}`);
              }
              if (bank === 'practice' && win.skillrPracticeQuestions !== qs) throw new Error(`${file}: Practice handoff failed`);
              if (bank === 'test' && (win.skillrTestQuestions !== qs || win.skillrExamQuestions !== qs)) throw new Error(`${file}: Test handoff failed`);
              if (new Set(qs.map(q => q.id)).size !== qs.length) throw new Error(`${file}: duplicate IDs`);
              if (new Set(qs.map(signature)).size !== qs.length) throw new Error(`${file}: duplicate learning scenes`);
              if (qs.some(q => !q.question || !q.skill || !q.explanation || q.type === 'self-check')) {
                throw new Error(`${file}: incomplete or subjective item found`);
              }
              for (const q of qs) {
                if (['single','true-false'].includes(q.type)) {
                  if (!Array.isArray(q.answers) || q.answers.length < 3 || new Set(q.answers.map(String)).size !== q.answers.length || !Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.answers.length) {
                    throw new Error(`${q.id}: invalid or duplicated single-choice answers`);
                  }
                } else if (q.type === 'multiple') {
                  if (!Array.isArray(q.answers) || new Set(q.answers.map(String)).size !== q.answers.length || !Array.isArray(q.correct) || q.correct.length < 2 || q.correct.some(i => !Number.isInteger(i) || i < 0 || i >= q.answers.length)) {
                    throw new Error(`${q.id}: invalid multiple-choice answers`);
                  }
                } else if (q.type === 'order') {
                  if (!Array.isArray(q.items) || !Array.isArray(q.correct) || q.items.length !== q.correct.length || new Set(q.items.map(String)).size !== q.items.length) {
                    throw new Error(`${q.id}: invalid ordering answer`);
                  }
                } else {
                  throw new Error(`${q.id}: unsupported type ${q.type}`);
                }
              }
              banks[bank] = new Set(qs.map(signature));
            }
            const overlap = [...banks.practice].filter(value => banks.test.has(value));
            if (overlap.length) throw new Error(`${code}: Practice/Test scene overlap`);
          }

          const facts = ['Question guides a test.','Prediction comes first.','Observation records evidence.','Patterns can be represented.','Safe tools support observation.'];
          const keywords = [['question','what we want to find out'],['prediction','what we expect'],['observation','what we notice'],['evidence','recorded information'],['pattern','something repeated or shared']];
          const quick = { F: {} };
          for (const skill of ['scientific-inquiry','science-vocabulary','living-things-earth','materials-forces-energy','science-technology-society']) {
            quick.F[skill] = { facts, keywords };
          }
          const dailyWindow = { SkillrScienceQuickRead: quick };
          load('quiz/assets/daily-drills/science-master-questions.js', dailyWindow);
          const ext = dailyWindow.SkillrDailyQuestionExtensions?.F?.science || {};
          const expectedExtensions = {
            'scientific-inquiry': 96,
            'science-vocabulary': 48,
            'living-things-earth': 32,
            'materials-forces-energy': 48,
            'science-technology-society': 16
          };
          for (const [skill,count] of Object.entries(expectedExtensions)) {
            if (ext[skill]?.length !== count) throw new Error(`${skill}: expected ${count} extension questions, found ${ext[skill]?.length}`);
            if (dailyWindow.SkillrDailyScience.generate('F', skill).length !== 200) throw new Error(`${skill}: core bank no longer generates 200 questions`);
          }

          const titles = {
            ac9sfi03: 'Record Observations and Find Patterns',
            ac9sfi04: 'Compare Predictions and Observations',
            ac9sfi05: 'Share Science Ideas and Evidence',
            ac9sfu01: 'Plant and Animal Features',
            ac9sfu02: 'How Objects Move',
            ac9sfu03: 'Objects and Materials'
          };
          for (const [code,title] of Object.entries(titles)) {
            const html = fs.readFileSync(`quiz/grade-k/science/${code}/index.html`, 'utf8');
            if (!html.includes(`<h1>${title}</h1>`)) throw new Error(`${code}: activity title missing`);
            if (!html.includes('56-question learning bank') || !html.includes('24-question auto-marked bank')) throw new Error(`${code}: updated bank description missing`);
          }

          const report = JSON.parse(fs.readFileSync('foundation-science-remaining-rebuild-report.json','utf8'));
          if (Object.keys(report.codes || {}).length !== 6) throw new Error('Rebuild report does not contain six codes');
          NODE

          for file in quiz/grade-k/science/{ac9sfi03,ac9sfi04,ac9sfi05,ac9sfu01,ac9sfu02,ac9sfu03}/{practice,test}/questions.js; do
            node --check "$file"
          done
          node --check quiz/assets/daily-drills/science-master-questions.js
          node --check service-worker.js
          ! grep -RniE 'rollss|both rolls\\b' quiz/grade-k/science/{ac9sfi03,ac9sfi04,ac9sfi05,ac9sfu01,ac9sfu02,ac9sfu03} quiz/assets/daily-drills/science-master-questions.js

      - name: Remove temporary build inputs
        shell: bash
        run: |
          rm -rf scripts/foundation-science-remaining-b64
          rm -f scripts/apply-foundation-science-remaining.js
          rm -f foundation-science-remaining-source-report.json
          rm -f .github/workflows/foundation-science-remaining-build.yml

      - name: Commit completed rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild remaining Foundation Science banks [remaining-science-built]"
          git push origin HEAD:agent/foundation-science-remaining-rebuild
