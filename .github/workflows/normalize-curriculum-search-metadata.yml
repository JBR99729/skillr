name: Normalize curriculum search metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_curriculum_search_metadata.py'
      - 'data/curriculum-units.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize canonical topic metadata
        run: python3 scripts/normalize_curriculum_search_metadata.py
      - name: Commit normalized topic metadata
        run: |
          if git diff --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation year1 year2 year3 year4 year5 year6 year7 year8 year9 year10 reports/curriculum-search-metadata-audit.json
          git commit -m "Align curriculum metadata with official descriptors and search demand"
          git push
