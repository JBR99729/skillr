name: Normalize curriculum search metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_curriculum_search_metadata.py'
      - 'data/curriculum-units.json'
      - 'data/year6-10-seo-metadata.json'
      - 'scripts/repair_year6_10_seo_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Normalize canonical topic metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], text=True).splitlines()) if os.environ['EVENT_NAME'] == 'push' else set()
          scoped = {'data/year6-10-seo-metadata.json', 'scripts/repair_year6_10_seo_metadata.py'}
          if changed & scoped and 'data/curriculum-units.json' not in changed:
              # A scoped metadata maintenance release must not rewrite other years.
              subprocess.check_call([sys.executable, 'scripts/repair_year6_10_seo_metadata.py'])
          else:
              subprocess.check_call([sys.executable, 'scripts/normalize_curriculum_search_metadata.py'])
              subprocess.check_call([sys.executable, 'scripts/repair_year6_10_seo_metadata.py', '--write'])
          PY
      - name: Commit normalized topic metadata
        run: |
          if git diff --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation year1 year2 year3 year4 year5 year6 year7 year8 year9 year10 reports/curriculum-search-metadata-audit.json reports/year6-10-seo-metadata-2026-10-04.json
          git commit -m "Align curriculum metadata with official descriptors and search demand"
          git push
