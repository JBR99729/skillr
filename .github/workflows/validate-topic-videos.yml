name: Validate optional topic videos
on:
  pull_request:
    paths:
      - 'data/topic-videos.csv'
      - 'scripts/build_topic_video_sections.py'
      - 'scripts/tests/test_topic_video_sections.py'
      - 'assets/css/topic-videos.css'
  push:
    branches: [main]
    paths:
      - 'data/topic-videos.csv'
      - 'scripts/build_topic_video_sections.py'
      - 'scripts/tests/test_topic_video_sections.py'
      - 'assets/css/topic-videos.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify mapping and static output
        run: python scripts/build_topic_video_sections.py --check
      - name: Check preservation and invalid-input safeguards
        run: python -m unittest discover -s scripts/tests -p 'test_topic_video_sections.py'
