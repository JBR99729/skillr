name: Rebuild Year 1 Science AC9S1H01
on:
  push:
    branches: [content/year1-science-actual-rebuild]
    paths: ['scripts/year1_science_actual/ac9s1h01_authored.mjs','scripts/materialise_year1_science_h01.mjs','.github/workflows/rebuild-year1-science-actual-h01.yml']
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: content/year1-science-actual-rebuild, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/materialise_year1_science_h01.mjs
      - name: Guard non-assessment content
        run: "if git status --porcelain | grep -E 'teacher-slides|worksheet|/index.html'; then exit 1; fi"
      - name: Commit production bank
        run: |
          git config user.name JBR99729
          git config user.email jbhasker9@gmail.com
          git add quiz/year-1/science/ac9s1h01/practice/questions.js quiz/year-1/science/ac9s1h01/practice/practice-questions.js quiz/year-1/science/ac9s1h01/test/questions.js
          git diff --cached --quiet && exit 1
          git commit -m 'Rebuild AC9S1H01 actual question bank'
          git push origin HEAD:content/year1-science-actual-rebuild