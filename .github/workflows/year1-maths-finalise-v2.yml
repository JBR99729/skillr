name: Correctly finalise complete Year 1 Maths

on:
  push:
    branches:
      - agent/year1-maths-complete-current

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[year1-current-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/year1-maths-complete-current
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute the reviewed finaliser with corrected cleanup rules
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'

          workflow = YAML.load_file('.github/workflows/year1-maths-finalise.yml')
          steps = workflow.fetch('jobs').fetch('build').fetch('steps')
          skipped = ['Remove temporary workflow inputs', 'Commit rebased completion']

          steps.each_with_index do |step, index|
            next unless step['run']
            next if skipped.include?(step['name'])

            command = step['run'].lines.map do |line|
              if line.include?('text = re.sub') && line.include?('checks')
                indent = line[/^\s*/]
                if line.include?('A child')
                  indent + "text = re.sub(r'A child checks (?:another|a new) example[.] *', '', text)\n"
                else
                  indent + "text = re.sub(r'[A-Z][A-Za-z-]* checks (?:another|a new) example[.] *', '', text)\n"
                end
              else
                line
              end
            end.join

            script = "/tmp/year1-finaliser-step-#{index}.sh"
            File.write(script, command)
            puts "Running: #{step['name']}"
            abort "Failed: #{step['name']}" unless system('bash', script)
          end
          RUBY

      - name: Commit the validated current-main completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete all remaining Year 1 Maths banks [year1-current-built]"
          git push origin HEAD:agent/year1-maths-complete-current
