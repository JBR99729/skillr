name: One-time Year 7 static topic hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-year7-static-topics.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert Year 7 topic pages to static HTML
        run: node scripts/hotfix_year7_static_topics.mjs
      - name: Commit static topic pages and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-year7-static-topics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add year7/maths year7/science year7/english .github/workflows/hotfix-year7-static-topics.yml
          if git diff --cached --quiet; then
            echo 'No Year 7 topic changes required.'
            exit 0
          fi
          git commit -m 'Hotfix Year 7 topic pages to static HTML only'
          git push origin HEAD:main
