name: Validate question-bank quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-question-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject templated question stems
        run: node scripts/validate_no_templated_question_stems.mjs

      - name: Validate authored upper-year banks
        run: node scripts/build_missing_upper_assessment_banks.mjs
