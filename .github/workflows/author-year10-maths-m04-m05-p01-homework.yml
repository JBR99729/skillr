name: Author Year 10 Maths M04-M05-P01 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year10-maths-m04-m05-p01-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lineBlock = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {
              code:'AC9M10M04',
              title:'Measurement error and accuracy of results',
              guide:'/year10/maths/ac9m10m04-the-impact-of-measurement-errors-on-the-accuracy-of-results/',
              intro:'Analyse how measurement errors affect the accuracy of calculated results, including absolute error, percentage error, rounding, significant figures and error propagation in practical contexts.',
              short:[
                'Define measurement error in your own words.',
                'What is the difference between accuracy and precision?',
                'A length is measured as 48 cm but the true length is 50 cm. Find the absolute error.',
                'Using the same measurement, calculate the percentage error.',
                'Why can rounding too early affect a final answer?',
                'State the possible error when a measurement is rounded to the nearest centimetre.',
                'Explain why a small error in radius can cause a larger error in circle area.',
                'Give one example of a systematic measurement error.',
                'Give one example of a random measurement error.',
                'Correct this misconception: “More decimal places always means a more accurate measurement.”'
              ],
              long:[
                'A rectangle is measured as 12.4 cm by 8.1 cm. Each measurement is rounded to the nearest 0.1 cm. Explain the possible error in each measurement and how it may affect the calculated area.',
                'A student measures a cylinder radius as 4.0 cm instead of 4.2 cm. Calculate the percentage error in the radius and explain why the volume may be affected more strongly.',
                'Compare two measurements: 2 mm error in 20 mm and 2 mm error in 200 mm. Calculate percentage error and interpret which is more serious.',
                'A tank volume is calculated using rounded dimensions. Explain why the final answer should not be reported with unrealistic precision.',
                'A speed is calculated from distance and time. Discuss how errors in both measurements can affect the final speed.',
                'A builder measures a room as 5.8 m by 4.2 m. Estimate the floor area and discuss how measurement error affects buying flooring.',
                'A student records 3.0 m, 3.00 m and 3 m as equivalent. Explain how the number of significant figures changes the meaning.',
                'Create a practical measurement problem involving area or volume, include possible measurement errors and explain their impact.',
                'Explain why repeated measurements can reduce random error but may not remove systematic error.',
                'Write a full response for a measurement-error problem, including calculation, units, percentage error and interpretation of reliability.'
              ],
              task:'Choose a real object such as a table, room, container or sports field. Measure or estimate two dimensions, state possible measurement errors, calculate a derived result, and explain how reliable the result is.'
            },
            {
              code:'AC9M10M05',
              title:'Proportion and scaling models',
              guide:'/year10/maths/ac9m10m05-mathematical-modelling-to-solve-practical-problems-involving/',
              intro:'Use mathematical modelling to solve practical problems involving direct proportion, rates, ratio, scaling, similar figures and conversion between real and model quantities.',
              short:[
                'Define direct proportion.',
                'If y is directly proportional to x and x doubles, what happens to y?',
                'A recipe for 4 people uses 300 g of rice. How much rice is needed for 10 people?',
                'A map scale is 1 cm represents 5 km. What real distance is represented by 6 cm?',
                'Convert a scale of 1:50 into a sentence.',
                'Explain why units must be consistent in scale problems.',
                'A model is built at 1:20 scale. Is the model larger or smaller than the real object?',
                'Give one example where direct proportion is reasonable.',
                'Give one example where direct proportion may not be reasonable.',
                'Correct this misconception: “Doubling the side length of a shape doubles its area.”'
              ],
              long:[
                'A floor plan uses a scale of 1:100. A wall is 7.2 cm on the plan. Find the real wall length in metres.',
                'A photograph is enlarged by scale factor 1.5. Original dimensions are 12 cm by 8 cm. Find the new dimensions and compare the areas.',
                'A car travels 180 km using 12 L of fuel. Assuming direct proportion, estimate fuel used for 450 km and state a limitation.',
                'A recipe uses flour, sugar and butter in the ratio 5:2:3. Scale the recipe to use 800 g of flour.',
                'A model bridge is 42 cm long and represents a real bridge 21 m long. Find the scale and use it to find the real width if the model width is 8 cm.',
                'Compare linear scale factor, area scale factor and volume scale factor using a cube enlarged by factor 3.',
                'A student scales a 2D shape by 4 and says the area also scales by 4. Explain and correct the error.',
                'Create a practical scaling problem involving a map, model, recipe or plan and solve it fully.',
                'Explain how proportional modelling can be useful but also risky when the relationship is not truly proportional.',
                'Write a full modelling response using assumptions, variables, proportional calculation, answer and limitation.'
              ],
              task:'Choose a real scale model, map, plan, recipe or design. Identify the scale or proportional relationship, calculate at least two unknown values, and discuss whether proportional modelling is appropriate.'
            },
            {
              code:'AC9M10P01',
              title:'Conditional probability language',
              guide:'/year10/maths/ac9m10p01-the-language-of-if-then-given-of-knowing-that/',
              intro:'Use the language of “if ... then”, “given”, “of”, “knowing that” and “conditional on” to interpret conditional probability statements and avoid confusing joint, conditional and simple probabilities.',
              short:[
                'What does “given that” mean in probability?',
                'Rewrite “the probability of A given B” using probability notation.',
                'Explain the difference between P(A) and P(A given B).',
                'What does P(A and B) mean?',
                'What does P(A or B) mean?',
                'A card is known to be red. How does this change the sample space?',
                'Explain why conditional probability depends on the information already known.',
                'Give one everyday example of conditional probability language.',
                'What is the meaning of “if a student plays sport, then what is the chance they also play music?”',
                'Correct this misconception: “P(A given B) always equals P(B given A).”'
              ],
              long:[
                'In a class of 30 students, 18 play sport, 12 play music and 8 do both. Find the probability a student plays music given that they play sport.',
                'Using the same class data, find the probability a student plays sport given that they play music. Compare the two answers.',
                'A bag has 5 red, 3 blue and 2 green counters. One counter is known not to be green. Find the probability it is red.',
                'A two-way table shows 40 students, with 22 using the bus and 15 owning a bike, including 9 who do both. Use conditional language to answer one probability question.',
                'Explain how the sample space changes when the word “given” appears in a probability question.',
                'Create a Venn diagram situation and write two different conditional probability questions from it.',
                'A medical test example gives the probability of a positive test given a condition. Explain why this is not the same as the probability of the condition given a positive test.',
                'A student confuses “of the students who passed, how many studied?” with “of the students who studied, how many passed?” Explain the difference.',
                'Write and solve a conditional probability problem using a table, including numerator, denominator and final interpretation.',
                'Compare simple probability, joint probability and conditional probability using one consistent example.'
              ],
              task:'Find or create a two-way table about a real context, such as sport and music, transport and year level, or app use and study time. Write two conditional probability questions and explain why their denominators are different.'
            }
          ];
          function page(p){
            const short = p.short.map(q=>`<li><p>${esc(q)}</p>${lineBlock(4)}</li>`).join('');
            const long = p.long.map(q=>`<li><p>${esc(q)}</p>${lineBlock(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 10 Maths ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-10/math/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 10 Maths • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Show working, use correct notation and check reasonableness.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lineBlock(10)}</section><p class="hw-footer">SkillrHub • Authored Year 10 Maths homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = `quiz/year-10/math/${p.code.toLowerCase()}/homework/index.html`;
            fs.writeFileSync(file, page(p));
          }
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz/year-10/math/ac9m10m04/homework/index.html quiz/year-10/math/ac9m10m05/homework/index.html quiz/year-10/math/ac9m10p01/homework/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Author Year 10 Maths M04-M05-P01 homework"
          git push
