name: Author Year 9 Science U01-U03 homework

on:
  push:
    branches: [main]
    paths:
      - '.github/author-year9-science-u01-u03-homework.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write authored Year 9 Science homework pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const lines = n => `<div class="answer-lines">${'<span></span>'.repeat(n)}</div>`;
          const style = `<style>:root{--blue:#2457d6;--ink:#18324f;--muted:#62748a;--line:#dce5f1;--soft:#f5f8ff}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.hw-shell{max-width:980px;margin:auto;padding:24px}.hw-brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border:1px solid #cbd8ea;border-radius:16px;background:#fff}.hw-brand__mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:1.35rem}.hw-brand strong{display:block;color:var(--blue);font-size:1.15rem}.hw-brand span{display:block;color:var(--muted);font-size:.9rem}.hw-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.hw-nav a,.hw-print{border:1px solid #cbd8ea;border-radius:999px;background:#fff;color:var(--blue);font-weight:800;text-decoration:none;padding:8px 12px}.hw-print{cursor:pointer}.hw-hero,.hw-section,.hw-task{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(26,55,99,.06);padding:22px;margin:14px 0}.hw-kicker{color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 10px}h2{margin:0 0 12px}.hw-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.hw-meta div{background:var(--soft);border-radius:12px;padding:12px}.hw-questions{padding-left:1.2rem}.hw-questions li{break-inside:avoid;margin:0 0 18px}.hw-questions p{font-weight:700}.answer-lines{display:grid;gap:10px;margin-top:10px}.answer-lines span{display:block;border-bottom:1px solid #9fb0c5;min-height:24px}.hw-task{border-left:6px solid var(--blue)}.hw-footer{color:var(--muted);font-size:.9rem;text-align:center;margin:24px 0}@media print{body{background:#fff}.hw-shell{max-width:none;padding:0}.hw-nav,.hw-print{display:none}.hw-brand{display:flex!important;border:0;border-bottom:2px solid #2457d6;border-radius:0;margin:0 0 10px;padding:8px 0;background:#fff;box-shadow:none}.hw-brand__mark{background:#2457d6!important;color:#fff!important}.hw-hero,.hw-section,.hw-task{box-shadow:none;border-radius:0;border-left:0}.answer-lines span{min-height:22px}}</style>`;
          const pages = [
            {code:'AC9S9U01',title:'Body systems, stimuli and regulation',guide:'/year9/science/ac9s9u01-the-role-of-body-systems-in-regulating-and-coordinating-the/',intro:'Compare how nervous and endocrine body systems coordinate responses to stimuli, and explain how negative feedback helps maintain stable internal conditions.',short:[
              'Define stimulus and response using a biological example.','Name the receptor, control centre and effector in a simple response pathway.','Explain why the nervous system usually produces faster responses than the endocrine system.','What is a hormone, and how does it travel around the body?','Define homeostasis in your own words.','What is negative feedback?','Give one example of a body condition that is regulated by negative feedback.','Explain the role of an effector in a response to a stimulus.','Describe one difference between a reflex response and a voluntary response.','Correct this misconception: “Negative feedback makes the original change bigger.”'
            ],long:[
              'Trace the response pathway when a person touches a hot object and quickly pulls their hand away. Include stimulus, receptor, control centre, effector and response.','Compare nervous coordination and endocrine coordination using speed, signal type, pathway and duration of response.','Explain how negative feedback helps regulate body temperature when a person becomes too hot.','Explain how the body may respond to a drop in blood glucose, including the role of hormones.','A student says body systems work independently. Use an example to show how two or more systems work together to regulate the body.','Describe how heart rate, breathing rate and sweating can change during exercise and how these changes help the body.','Create a labelled flow chart for a homeostatic feedback loop and explain each step.','Evaluate why maintaining stable internal conditions is important for enzyme function and cell survival.','Interpret a possible graph of body temperature before, during and after exercise. Describe the pattern and explain the regulation involved.','Write a full explanation of one regulated body system, identifying the stimulus, response pathway, feedback mechanism and final effect.'
            ],task:'Research one homeostatic mechanism such as temperature regulation, blood glucose control or water balance. Summarise the stimulus, receptor/control system, effectors, response and why negative feedback is important.'},
            {code:'AC9S9U02',title:'Reproductive systems, gametes and reproduction',guide:'/year9/science/ac9s9u02-the-form-and-function-of-reproductive-cells-and-organs-in/',intro:'Describe the structure and function of reproductive cells and organs in plants and animals, and analyse how sexual and asexual reproduction support species survival.',short:[
              'Define gamete and give one animal example and one plant example.','Describe one structural feature of sperm that helps its function.','Describe one structural feature of an egg cell that helps its function.','What is fertilisation?','What is the difference between sexual and asexual reproduction?','Name one plant structure involved in sexual reproduction and state its function.','Explain why offspring from sexual reproduction are usually genetically varied.','Give one advantage of asexual reproduction in a stable environment.','Give one disadvantage of asexual reproduction in a changing environment.','Correct this misconception: “All reproduction requires two parents.”'
            ],long:[
              'Compare sexual and asexual reproduction using number of parents, gametes, genetic variation, speed and environmental advantage.','Explain how the structure of sperm and egg cells relates to their roles in fertilisation.','Describe how flowering plants use pollen, ovules and seeds in sexual reproduction.','Analyse why genetic variation can help a species survive when the environment changes.','A population reproduces asexually very quickly. Explain one advantage and one risk for long-term survival.','Use a table to compare animal reproductive organs or plant reproductive structures and their functions.','Explain how pollination and fertilisation are different but connected in flowering plants.','Evaluate whether sexual reproduction or asexual reproduction is more useful in a rapidly changing environment.','Create a life-cycle diagram for a plant or animal and explain where gametes and fertilisation occur.','Write a full response explaining how reproductive cells, reproductive organs and reproduction type contribute to survival of a species.'
            ],task:'Research one organism that can reproduce asexually, or one flowering plant with a specialised pollination method. Explain how the reproduction method works and what advantages or trade-offs it provides.'},
            {code:'AC9S9U03',title:'Carbon Cycle and Earth Spheres',guide:'/year9/science/ac9s9u03-represent-the-carbon-cycle-and-examine-how-key-processes/',intro:'Represent the carbon cycle and explain how photosynthesis, respiration, combustion and decomposition move carbon between the atmosphere, biosphere, hydrosphere and geosphere.',short:[
              'Name the four Earth spheres involved in the carbon cycle.','Which process removes carbon dioxide from the atmosphere and stores carbon in plants?','Which process releases carbon dioxide when living things use glucose for energy?','Explain how combustion moves carbon into the atmosphere.','What is decomposition, and how does it affect carbon movement?','Give one example of carbon stored in the geosphere.','Explain how the ocean can be part of the carbon cycle.','What is the difference between a carbon store and a carbon transfer?','Write one word equation connected to the carbon cycle.','Correct this misconception: “Carbon is only found in the atmosphere.”'
            ],long:[
              'Draw or describe a carbon cycle diagram that includes photosynthesis, respiration, combustion and decomposition.','Explain how carbon moves from the atmosphere into plants, then into animals, then back to the atmosphere.','Analyse how burning fossil fuels changes the rate of carbon transfer between the geosphere and atmosphere.','Compare photosynthesis and respiration in terms of reactants, products and carbon movement.','Explain how the biosphere and atmosphere interact during a forest fire and during forest regrowth.','Describe how carbon can move between the hydrosphere and atmosphere.','Evaluate the effect of deforestation on carbon stores and carbon transfers.','Use a cause-and-effect chain to explain how increased combustion can influence the carbon cycle.','Create a table that separates carbon stores from carbon transfer processes and justify each example.','Write a full explanation of how Earth’s spheres interact through the carbon cycle, using at least three named processes.'
            ],task:'Research one real carbon-cycle issue such as fossil fuel combustion, reforestation, ocean carbon storage, bushfires or soil carbon. Explain the carbon stores, transfer processes and Earth spheres involved.'}
          ];
          function page(p){
            const short = p.short.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(4)}</li>`).join('');
            const long = p.long.map((q,i)=>`<li><p>${i+1}. ${esc(q)}</p>${lines(8)}</li>`).join('');
            return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>${p.code} Authored Homework | ${esc(p.title)}</title><meta name="description" content="Authored SkillrHub homework for Year 9 Science ${p.code} with 10 short-answer questions, 10 long-answer questions and one research task."><link rel="canonical" href="https://skillrhub.com/quiz/year-9/science/${p.code.toLowerCase()}/homework/"><link rel="stylesheet" href="/style.css">${style}</head><body><main class="hw-shell"><header class="hw-brand" aria-label="SkillrHub homework branding"><div class="hw-brand__mark" aria-hidden="true">S</div><div><strong>SkillrHub</strong><span>Free Australian Curriculum homework • skillrhub.com</span></div></header><nav class="hw-nav" aria-label="Homework navigation"><a href="/">Home</a><a href="${p.guide}">Topic guide</a><a href="../practice/">Practice</a><a href="../test/">Test</a><button class="hw-print" type="button" onclick="window.print()">Print or save as PDF</button></nav><header class="hw-hero"><p class="hw-kicker">Year 9 Science • ${p.code} • Authored homework</p><h1>${esc(p.title)}</h1><p>${esc(p.intro)} Use topic vocabulary, evidence and clear cause-and-effect reasoning in longer answers.</p><div class="hw-meta"><div><strong>10</strong><br>Short-answer questions</div><div><strong>10</strong><br>Long-answer questions</div><div><strong>1</strong><br>Research/application task</div></div></header><section class="hw-section"><p class="hw-kicker">Part A</p><h2>Short-answer questions</h2><ol class="hw-questions">${short}</ol></section><section class="hw-section"><p class="hw-kicker">Part B</p><h2>Long-answer questions</h2><ol class="hw-questions">${long}</ol></section><section class="hw-task"><p class="hw-kicker">Part C</p><h2>Research and understanding task</h2><p>${esc(p.task)}</p>${lines(10)}</section><p class="hw-footer">SkillrHub • Authored Year 9 Science homework • Print or save as PDF</p></main></body></html>`;
          }
          for (const p of pages) {
            const file = path.join('quiz','year-9','science',p.code.toLowerCase(),'homework','index.html');
            fs.writeFileSync(file, page(p));
          }
          NODE
      - name: Commit authored pages
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/year-9/science/ac9s9u01/homework/index.html quiz/year-9/science/ac9s9u02/homework/index.html quiz/year-9/science/ac9s9u03/homework/index.html
          git commit -m "Author Year 9 Science U01-U03 homework"
          git push
