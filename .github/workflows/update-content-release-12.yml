name: Update content release 12

on:
  push:
    branches:
      - content/updates-release-12-20260908

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update content-only release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('updates.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"dateModified":"2026-09-02"', '"dateModified":"2026-09-08"')

          release = '''          <article class="info-update"><div class="info-date"><time datetime="2026-09-08" title="8 Sep 2026">Release 12.0</time></div><div><h2>Video learning, homeschool planners and reviewed curriculum content</h2><ul><li><strong>Optional video explanations</strong> have been added to topic learning across SkillrHub, giving students and home educators another way to understand a concept while keeping the written lesson, examples and practice at the centre of the learning pathway.</li><li>New <strong>homeschool planner packs</strong> are available for <a href="/homeschooling-australia/foundation/">Foundation</a>, <a href="/homeschooling-australia/year-1/">Year 1</a> and <a href="/homeschooling-australia/year-2/">Year 2</a>, helping families organise curriculum learning and use SkillrHub resources in a practical sequence.</li><li><strong>Topic pages have been enhanced</strong> with stronger quick-learning support, clearer teaching content and examples, and optional video help so learners can get into a topic more easily before moving to worksheets, Practice and Tests.</li><li><strong>Content verification is now complete across Foundation, Year 1, Year 2 and Year 3</strong> for Mathematics, Science and English. These learning areas now display the Content Verified status after their curriculum question banks completed the documented review process.</li><li><strong>Year 3 English and Science</strong> received substantial reviewed content upgrades, including more authentic literacy tasks, composing and editing work, oral-reading and interaction tasks, curriculum-specific diagrams, and strengthened Practice and Test banks.</li><li><strong>Year 4 Mathematics is now complete and Content Verified</strong> across all 23 curriculum codes. Every code has 48 Practice and 16 Test questions, alongside strengthened teaching resources, worked models and homework support.</li><li><strong>Year 4 Science review has also progressed</strong>, with AC9S4U01–AC9S4U03 receiving reviewed full resource sets and 48 Practice + 16 Test assessment banks.</li></ul></div></article>\n\n'''

          marker = '        <div class="info-timeline">\n'
          if 'Release 12.0' not in text:
              if marker not in text:
                  raise SystemExit('Could not find timeline marker')
              text = text.replace(marker, marker + release, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/update-content-release-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.html
          git commit -m 'content: publish Release 12.0 learning updates'
          git push
