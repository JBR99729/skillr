name: Check existing video-catalogue baseline
on:
  pull_request:
    paths: [.github/workflows/check-video-baseline.yml]
  push:
    branches: [fix/topic-videos-after-lessons-20261101]
    paths: [.github/workflows/check-video-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Measure existing main catalogue drift without changes
        run: |
          python scripts/build_topic_video_sections.py --check || echo "BASELINE_VIDEO_CATALOGUE_DRIFT"
          python scripts/normalize_topic_entry_order.py || echo "BASELINE_VIDEO_ORDER_DRIFT"
