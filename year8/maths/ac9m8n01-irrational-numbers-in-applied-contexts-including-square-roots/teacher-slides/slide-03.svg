<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Where does square root of two appear?</title><desc id="d">A unit square has diagonal square root of two by Pythagoras.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".06" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="150" y="250" transform="rotate(-18 150 250)">SkillrHub • skillrhub.com</text><text x="830" y="610" transform="rotate(-18 830 610)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="90" y="62" fill="white" font-family="Arial" font-size="34" font-weight="700">SkillrHub • AC9M8N01</text><text x="90" y="180" fill="#173a72" font-family="Arial" font-size="56" font-weight="700">Where does √2 appear?</text><rect x="160" y="305" width="430" height="430" fill="#e8eef9" stroke="#173a72" stroke-width="8"/><line x1="160" y1="735" x2="590" y2="305" stroke="#d97706" stroke-width="12"/><text x="345" y="790" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">1</text><text x="100" y="535" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">1</text><text x="380" y="475" fill="#b45309" font-family="Arial" font-size="42" font-weight="700" transform="rotate(-45 380 475)">√2</text><text x="720" y="350" fill="#0f172a" font-family="Arial" font-size="40" font-weight="700">Pythagoras</text><text x="720" y="430" fill="#0f172a" font-family="Arial" font-size="38">d² = 1² + 1²</text><text x="720" y="500" fill="#0f172a" font-family="Arial" font-size="38">d² = 2</text><text x="720" y="570" fill="#173a72" font-family="Arial" font-size="42" font-weight="700">d = √2 ≈ 1.414</text><rect x="720" y="635" width="720" height="120" rx="24" fill="#e8eef9"/><text x="760" y="685" fill="#0f172a" font-family="Arial" font-size="29">√2 is the exact length.</text><text x="760" y="730" fill="#0f172a" font-family="Arial" font-size="29">1.414 is a decimal approximation.</text><rect x="0" y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M8N01 • SkillrHub • skillrhub.com</text></svg>