<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Measure pi with any circle</title><desc id="d">Circumference divided by diameter gives pi, with a quick check.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".06" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="120" y="250" transform="rotate(-18 120 250)">SkillrHub • skillrhub.com</text><text x="800" y="590" transform="rotate(-18 800 590)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="90" y="62" fill="white" font-family="Arial" font-size="34" font-weight="700">SkillrHub • AC9M8N01</text><text x="90" y="180" fill="#173a72" font-family="Arial" font-size="56" font-weight="700">Measure π with any circle</text><circle cx="410" cy="480" r="220" fill="#e8eef9" stroke="#173a72" stroke-width="10"/><line x1="190" y1="480" x2="630" y2="480" stroke="#d97706" stroke-width="10"/><text x="390" y="455" fill="#b45309" font-family="Arial" font-size="38" font-weight="700">d</text><path d="M235 315 A220 220 0 0 1 585 315" fill="none" stroke="#16a34a" stroke-width="10"/><text x="390" y="255" fill="#166534" font-family="Arial" font-size="38" font-weight="700">C</text><text x="760" y="360" fill="#0f172a" font-family="Arial" font-size="37">Different circles have different</text><text x="760" y="410" fill="#0f172a" font-family="Arial" font-size="37">circumferences and diameters.</text><text x="760" y="510" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">C ÷ d = π</text><text x="760" y="585" fill="#334155" font-family="Arial" font-size="33">Measured values should be close to 3.14159…</text><rect x="735" y="640" width="730" height="135" rx="24" fill="#e8eef9"/><text x="775" y="690" fill="#173a72" font-family="Arial" font-size="29" font-weight="700">Quick check</text><text x="775" y="740" fill="#0f172a" font-family="Arial" font-size="29">What stays invariant as the circle changes size?</text><rect x="0" y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M8N01 • SkillrHub • skillrhub.com</text></svg>