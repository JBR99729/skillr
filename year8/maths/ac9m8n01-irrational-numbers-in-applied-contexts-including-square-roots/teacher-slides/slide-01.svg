<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AC9M8N01 Learning intention</title><desc id="d">Learning intention and success criteria for irrational numbers.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".06" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="120" y="240" transform="rotate(-18 120 240)">SkillrHub • skillrhub.com</text><text x="760" y="500" transform="rotate(-18 760 500)">SkillrHub • skillrhub.com</text><text x="250" y="760" transform="rotate(-18 250 760)">SkillrHub • skillrhub.com</text></g><rect x="0" y="0" width="1600" height="96" fill="#173a72"/><text x="90" y="62" fill="white" font-family="Arial" font-size="34" font-weight="700">SkillrHub • Year 8 Maths</text><text x="90" y="180" fill="#173a72" font-family="Arial" font-size="58" font-weight="700">Irrational numbers in context</text><text x="90" y="255" fill="#334155" font-family="Arial" font-size="34">Learning intention</text><text x="90" y="330" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">Irrational numbers can have exact values even when</text><text x="90" y="385" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">their decimals never terminate or repeat.</text><rect x="90" y="455" width="1420" height="250" rx="28" fill="#e8eef9"/><text x="135" y="520" fill="#173a72" font-family="Arial" font-size="34" font-weight="700">By the end, students can:</text><text x="145" y="585" fill="#0f172a" font-family="Arial" font-size="31">• distinguish exact values such as π and √2 from decimal approximations</text><text x="145" y="640" fill="#0f172a" font-family="Arial" font-size="31">• locate irrational numbers approximately on a number line</text><text x="145" y="695" fill="#0f172a" font-family="Arial" font-size="31">• verify a conclusion using another representation or estimate</text><rect x="0" y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M8N01 • SkillrHub • skillrhub.com</text></svg>