<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Where does pi live?</title><desc id="d">Pi is placed between 3.141 and 3.142 on a number line.</desc><rect width="1600" height="900" fill="#f8fafc"/><g opacity=".06" fill="#1d4ed8" font-family="Arial" font-size="34" font-weight="700"><text x="120" y="250" transform="rotate(-18 120 250)">SkillrHub • skillrhub.com</text><text x="760" y="520" transform="rotate(-18 760 520)">SkillrHub • skillrhub.com</text></g><rect width="1600" height="96" fill="#173a72"/><text x="90" y="62" fill="white" font-family="Arial" font-size="34" font-weight="700">SkillrHub • AC9M8N01</text><text x="90" y="180" fill="#173a72" font-family="Arial" font-size="58" font-weight="700">Where does π live?</text><text x="90" y="240" fill="#334155" font-family="Arial" font-size="31">An irrational number has one exact position even when its decimal never finishes.</text><line x1="200" y1="480" x2="1400" y2="480" stroke="#173a72" stroke-width="9"/><line x1="290" y1="440" x2="290" y2="520" stroke="#173a72" stroke-width="7"/><line x1="1310" y1="440" x2="1310" y2="520" stroke="#173a72" stroke-width="7"/><circle cx="810" cy="480" r="24" fill="#d97706"/><text x="235" y="575" fill="#0f172a" font-family="Arial" font-size="36" font-weight="700">3.141</text><text x="1245" y="575" fill="#0f172a" font-family="Arial" font-size="36" font-weight="700">3.142</text><text x="785" y="420" fill="#b45309" font-family="Arial" font-size="48" font-weight="700">π</text><text x="515" y="660" fill="#173a72" font-family="Arial" font-size="44" font-weight="700">3.141 &lt; π &lt; 3.142</text><rect x="210" y="710" width="1180" height="88" rx="22" fill="#e8eef9"/><text x="250" y="766" fill="#0f172a" font-family="Arial" font-size="31">Quick check: give a tighter pair of decimal bounds for π.</text><rect x="0" y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M8N01 • SkillrHub • skillrhub.com</text></svg>