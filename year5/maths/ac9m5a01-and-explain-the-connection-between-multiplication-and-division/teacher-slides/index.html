5A01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Build complete fact families</text><text x="100" y="210" class="s">6 × 8 = 48</text><text x="100" y="300" class="s">8 × 6 = 48</text><text x="100" y="390" class="s">48 ÷ 6 = 8</text><text x="100" y="480" class="s">48 ÷ 8 = 6</text><text x="70" y="650" class="f">SkillrHub • AC9M5A01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Quick check</text><text x="100" y="210" class="s">1. Write the fact family for 7, 9 and 63.</text><text x="100" y="300" class="s">2. Use an inverse fact to solve 72 ÷ 8.</text><text x="100" y="390" class="s">3. Explain why multiplication can check division.</text><text x="70" y="650" class="f">SkillrHub • AC9M5A01</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script><script src="/assets/curriculum-progression.js?v=1"></script></body></html>
