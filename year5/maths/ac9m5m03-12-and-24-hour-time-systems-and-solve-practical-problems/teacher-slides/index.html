ems in real timetables</text><text x="100" y="210" class="s">Depart 16:25 → 4:25 pm</text><text x="100" y="300" class="s">Arrive 18:05 → 6:05 pm</text><text x="100" y="410" class="p">Timetables, flights and transport often use 24-hour time.</text><text x="70" y="650" class="f">SkillrHub • AC9M5M03</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Quick check</text><text x="100" y="210" class="s">1. Convert 17:40 to 12-hour time.</text><text x="100" y="300" class="s">2. Convert 8:15 pm to 24-hour time.</text><text x="100" y="390" class="s">3. Explain why 00:00 is midnight.</text><text x="70" y="650" class="f">SkillrHub • AC9M5M03</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script><script src="/assets/curriculum-progression.js?v=1"></script></body></html>
