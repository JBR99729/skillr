<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>AC9S5U03 Teacher Slides | SkillrHub</title>
  <link rel="canonical" href="https://skillrhub.com/year5/science/ac9s5u03-sources-of-light-recognise-that-light-travels-in-a-straight/">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root{--slide-blue:#173968;--slide-accent:#2457d6;--slide-line:#d8e2ef;--slide-soft:#f5f8ff}
    body{margin:0;background:#eef4fb;color:#1f2937;font-family:Arial,sans-serif}
    .slide-page{width:min(1200px,calc(100% - 28px));margin:0 auto;padding:18px 0 32px}
    .slide-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .slide-nav a{font-weight:800;color:var(--slide-blue);text-decoration:none}
    .slide-title{margin:8px 0 16px;color:var(--slide-blue);font-size:clamp(1.35rem,3vw,2rem)}
    .fixed-slide-viewer{background:#fff;border:1px solid var(--slide-line);border-radius:18px;padding:14px;box-shadow:0 14px 34px rgba(15,23,42,.08)}
    .fixed-slide-viewer__stage{aspect-ratio:16/9;background:#fff;border:1px solid var(--slide-line);border-radius:12px;overflow:hidden}
    .fixed-slide-viewer figure{width:100%;height:100%;margin:0}
    .fixed-slide-viewer figure[hidden]{display:none}
    .fixed-slide-viewer svg{display:block;width:100%;height:100%;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)}
    .t{font:700 48px Arial;fill:var(--slide-blue)}
    .s{font:700 30px Arial;fill:var(--slide-accent)}
    .p{font:500 26px Arial;fill:#334155}
    .f{font:600 19px Arial;fill:#64748b}
    .fixed-slide-viewer__controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
    .fixed-slide-viewer__controls button{min-height:42px;padding:9px 14px;border:1px solid #c9d8fb;border-radius:8px;background:#fff;color:var(--slide-blue);font-weight:800;cursor:pointer}
    .fixed-slide-viewer__controls button:hover{background:#eef4ff;border-color:var(--slide-accent);color:var(--slide-accent)}
    .fixed-slide-viewer__controls span{min-width:64px;text-align:center;font-weight:800;color:#475569}
    @media(max-width:700px){.t{font-size:38px}.s{font-size:25px}.p{font-size:22px}.f{font-size:17px}}
    @media(max-width:480px){.t{font-size:31px}.s{font-size:21px}.p{font-size:18px}.f{font-size:15px}.slide-page{width:min(100% - 18px,1200px)}}
  </style>
</head>
<body>
  <div class="slide-page">
    <nav class="slide-nav" aria-label="Teacher slide navigation">
      <a href="/year5/science/ac9s5u03-sources-of-light-recognise-that-light-travels-in-a-straight/">← Topic Guide</a>
      <a href="/year5/curriculum/science/">All Year 5 Science</a>
    </nav>
    <h1 class="slide-title">AC9S5U03 Teacher Slides</h1>
    <section class="fixed-slide-viewer" data-fixed-slide-viewer aria-label="AC9S5U03 teacher slide deck">
      <div class="fixed-slide-viewer__stage" aria-live="polite">
        <figure data-slide>
          <svg viewBox="0 0 1200 675" role="img" aria-label="Light travels from sources in straight paths">
            <text x="70" y="85" class="t">Light travels from sources in straight paths</text>
            <text x="90" y="205" class="s">Source → straight path → object or eye</text>
            <text x="90" y="325" class="p">We see luminous sources directly and other objects when light reaches</text>
            <text x="90" y="365" class="p">and reflects from them.</text>
            <text x="70" y="645" class="f">SkillrHub • AC9S5U03 • skillrhub.com</text>
          </svg>
        </figure>
        <figure data-slide hidden>
          <svg viewBox="0 0 1200 675" role="img" aria-label="Shadows form when light is blocked">
            <text x="70" y="85" class="t">Shadows form when light is blocked</text>
            <text x="90" y="205" class="s">Light source • opaque object • shadow region</text>
            <text x="90" y="325" class="p">Changing the positions of the source, object or screen changes the shadow.</text>
            <text x="70" y="645" class="f">SkillrHub • AC9S5U03</text>
          </svg>
        </figure>
        <figure data-slide hidden>
          <svg viewBox="0 0 1200 675" role="img" aria-label="Reflection changes light direction">
            <text x="70" y="85" class="t">Reflection changes light's direction</text>
            <text x="90" y="205" class="s">Smooth surfaces such as mirrors produce clear reflections.</text>
            <text x="90" y="325" class="p">A reflected ray leaves the surface in a new direction.</text>
            <text x="70" y="645" class="f">SkillrHub • AC9S5U03</text>
          </svg>
        </figure>
        <figure data-slide hidden>
          <svg viewBox="0 0 1200 675" role="img" aria-label="Refraction occurs when light enters another material">
            <text x="70" y="85" class="t">Refraction occurs when light enters another material</text>
            <text x="90" y="205" class="s">Air → water or glass: light can change direction.</text>
            <text x="90" y="325" class="p">This is why a straw partly in water can appear bent.</text>
            <text x="70" y="645" class="f">SkillrHub • AC9S5U03</text>
          </svg>
        </figure>
        <figure data-slide hidden>
          <svg viewBox="0 0 1200 675" role="img" aria-label="Quick check questions">
            <text x="70" y="85" class="t">Quick check</text>
            <text x="90" y="195" class="s">1. What three things are needed for a shadow?</text>
            <text x="90" y="285" class="s">2. Define reflection.</text>
            <text x="90" y="375" class="s">3. Give one example of refraction.</text>
            <text x="70" y="645" class="f">SkillrHub • AC9S5U03</text>
          </svg>
        </figure>
      </div>
      <div class="fixed-slide-viewer__controls">
        <button type="button" data-slide-previous>Previous</button>
        <span data-slide-counter>1 / 5</span>
        <button type="button" data-slide-next>Next</button>
        <button type="button" data-slide-fullscreen>Fullscreen</button>
      </div>
    </section>
  </div>
  <script>
    (() => {
      const viewer = document.querySelector('[data-fixed-slide-viewer]');
      if (!viewer) return;
      const slides = [...viewer.querySelectorAll('[data-slide]')];
      const counter = viewer.querySelector('[data-slide-counter]');
      let current = 0;
      const show = (index) => {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, i) => { slide.hidden = i !== current; });
        if (counter) counter.textContent = `${current + 1} / ${slides.length}`;
      };
      viewer.querySelector('[data-slide-previous]')?.addEventListener('click', () => show(current - 1));
      viewer.querySelector('[data-slide-next]')?.addEventListener('click', () => show(current + 1));
      viewer.querySelector('[data-slide-fullscreen]')?.addEventListener('click', () => {
        const stage = viewer.querySelector('.fixed-slide-viewer__stage');
        if (!document.fullscreenElement) stage?.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') show(current - 1);
        if (event.key === 'ArrowRight') show(current + 1);
      });
      show(0);
    })();
  </script>
</body>
</html>
