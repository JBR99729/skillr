<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">An image can show information words leave out</title><desc id="desc">Two signs have the same words, This way. The left sign has a left-pointing arrow; the right sign has a right-pointing arrow.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="60" y="45" width="260" height="175" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="190" y="92" text-anchor="middle" fill="#17334d" font-size="30" font-weight="normal">This way</text><rect x="400" y="45" width="260" height="175" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="530" y="92" text-anchor="middle" fill="#17334d" font-size="30" font-weight="normal">This way</text><path d="M260 155H125M440 155H575" fill="none" stroke="#28786f" stroke-width="7" marker-end="url(#arrow)"/></g></svg>
