<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Check the letters when a word does not fit</title><desc id="desc">frog: f, r, o, g. One box represents each spoken sound; a box may contain more than one letter.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="90.0" y="73" width="125.0" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="152.5" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">f</text><rect x="225.0" y="73" width="125.0" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="287.5" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">r</text><rect x="360.0" y="73" width="125.0" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="422.5" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">o</text><rect x="495.0" y="73" width="125.0" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="557.5" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">g</text><text x="360" y="210" text-anchor="middle" fill="#17334d" font-size="34" font-weight="normal">frog</text><text x="360" y="250" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">One box for each sound in this word</text></g></svg>
