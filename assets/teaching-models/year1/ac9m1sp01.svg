<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">A shape keeps its properties when it turns</title><desc id="desc">Two triangles in different orientations each have three sides and corners. A circle has no corners.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><path d="M75 195L140 55L205 195Z M315 75L315 205L455 140Z" fill="#fff" stroke="#17334d" stroke-width="3"/><circle cx="590" cy="137" r="66" fill="#fff" stroke="#17334d" stroke-width="3"/><text x="140" y="242" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">3 corners</text><text x="370" y="242" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">3 corners</text><text x="590" y="242" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">no corners</text></g></svg>
