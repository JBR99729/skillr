<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">See where numbers belong</title><desc id="desc">Number line from 96 to 104 in steps of one. Marked numbers: 99, 100, 103.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><path d="M48 135H672" stroke="#17334d" stroke-width="3"/><path d="M48.0 125V145" stroke="#17334d" stroke-width="2"/><text x="48.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">96</text><path d="M126.0 125V145" stroke="#17334d" stroke-width="2"/><text x="126.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">97</text><path d="M204.0 125V145" stroke="#17334d" stroke-width="2"/><text x="204.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">98</text><path d="M282.0 125V145" stroke="#17334d" stroke-width="2"/><text x="282.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">99</text><path d="M360.0 125V145" stroke="#17334d" stroke-width="2"/><text x="360.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">100</text><path d="M438.0 125V145" stroke="#17334d" stroke-width="2"/><text x="438.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">101</text><path d="M516.0 125V145" stroke="#17334d" stroke-width="2"/><text x="516.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">102</text><path d="M594.0 125V145" stroke="#17334d" stroke-width="2"/><text x="594.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">103</text><path d="M672.0 125V145" stroke="#17334d" stroke-width="2"/><text x="672.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">104</text><circle cx="282.0" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="360.0" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="594.0" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="360" y="65" text-anchor="middle" fill="#17334d" font-size="25" font-weight="normal">Equal spaces show equal steps</text></g></svg>
