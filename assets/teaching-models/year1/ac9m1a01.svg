d" font-size="22" font-weight="normal">8</text><path d="M609.6 125V145" stroke="#17334d" stroke-width="2"/><text x="609.6" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">9</text><path d="M672.0 125V145" stroke="#17334d" stroke-width="2"/><text x="672.0" y="178" text-anchor="middle" fill="#17334d" font-size="22" font-weight="normal">10</text><circle cx="48.0" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="172.8" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="297.6" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="422.4" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="547.2" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="672.0" cy="135" r="7" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="360" y="65" text-anchor="middle" fill="#17334d" font-size="25" font-weight="normal">Equal spaces show equal steps</text></g></svg>
