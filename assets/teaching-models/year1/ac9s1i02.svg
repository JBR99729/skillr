<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" role="img" aria-labelledby="title desc"><title id="title">Make a safe, useful plan with an adult</title><desc id="desc">Prepare: Adult checks space and equipment; Try: Release the toy safely; Record: Observe, then pack away.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="334" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="25" y="16" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="46" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Prepare</text><text x="45" y="80" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Adult checks space and equipment</text><rect x="25" y="121" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="151" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Try</text><text x="45" y="185" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Release the toy safely</text><rect x="25" y="226" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="256" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Record</text><text x="45" y="290" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Observe, then pack away</text></g></svg>
