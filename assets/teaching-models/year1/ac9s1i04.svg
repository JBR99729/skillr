<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 269" width="720" height="269" role="img" aria-labelledby="title desc"><title id="title">Keep counts matched to their labels</title><desc id="desc">One-to-one display: Day 1: 2; Day 2: 4; Day 3: 4. Each circle represents one flower.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="269" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="190" y="82" text-anchor="end" fill="#17334d" font-size="24" font-weight="normal">Day 1</text><circle cx="235" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="293" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="640" y="82" text-anchor="middle" fill="#17334d" font-size="24" font-weight="bold">2</text><text x="190" y="145" text-anchor="end" fill="#17334d" font-size="24" font-weight="normal">Day 2</text><circle cx="235" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="293" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="351" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="409" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="640" y="145" text-anchor="middle" fill="#17334d" font-size="24" font-weight="bold">4</text><text x="190" y="208" text-anchor="end" fill="#17334d" font-size="24" font-weight="normal">Day 3</text><circle cx="235" cy="201" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="293" cy="201" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="351" cy="201" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="409" cy="201" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="640" y="208" text-anchor="middle" fill="#17334d" font-size="24" font-weight="bold">4</text><text x="360" y="253" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">Key: one circle = one flower</text></g></svg>
