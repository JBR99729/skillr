<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" width="720" height="394" role="img" aria-labelledby="title desc"><title id="title">Keep noticing, wondering and predicting separate</title><desc id="desc">I noticed: The car went farther on the board than on the rug; I wonder: Will it happen again?; I predict: It may go farther on the board than on the rug.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="394" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="25" y="16" width="670" height="122" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="46" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">I noticed</text><text x="45" y="80" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">The car went farther on the board than on</text><text x="45" y="110" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">the rug</text><rect x="25" y="151" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="181" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">I wonder</text><text x="45" y="215" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Will it happen again?</text><rect x="25" y="256" width="670" height="122" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="286" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">I predict</text><text x="45" y="320" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">It may go farther on the board than on the</text><text x="45" y="350" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">rug</text></g></svg>
