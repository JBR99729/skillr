<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Show the force direction and observe its effect</title><desc id="desc">A rightward force arrow labelled push points towards a generic object. The arrow represents force direction, not a measured movement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="270" y="105" width="130" height="65" rx="8" fill="#edf6f5" stroke="#28786f" stroke-width="2"/><text x="335" y="145" text-anchor="middle" fill="#17334d" font-size="24" font-weight="normal">Object</text><path d="M65 136H240" stroke="#28786f" stroke-width="5" marker-end="url(#arrow)"/><text x="155" y="88" text-anchor="middle" fill="#17334d" font-size="26" font-weight="normal">Push</text><text x="520" y="140" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">Force to the right</text><text x="360" y="232" text-anchor="middle" fill="#17334d" font-size="25" font-weight="normal">Observe what changes</text></g></svg>
