<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Compare the same feature</title><desc id="desc">Two strips aligned to the same start. Strip A is four units long; strip B is six units long.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="101" text-anchor="start" fill="#17334d" font-size="24" font-weight="normal">Strip A</text><rect x="165" y="72" width="268" height="42" rx="8" fill="#edf6f5" stroke="#28786f" stroke-width="2"/><text x="453" y="101" text-anchor="start" fill="#17334d" font-size="23" font-weight="normal">4 units</text><text x="35" y="196" text-anchor="start" fill="#17334d" font-size="24" font-weight="normal">Strip B</text><rect x="165" y="167" width="402" height="42" rx="8" fill="#edf6f5" stroke="#28786f" stroke-width="2"/><text x="587" y="196" text-anchor="start" fill="#17334d" font-size="23" font-weight="normal">6 units</text><path d="M165 45V235" stroke="#17334d" stroke-width="2" stroke-dasharray="6 5"/></g></svg>
