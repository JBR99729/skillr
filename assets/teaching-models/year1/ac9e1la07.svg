<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" role="img" aria-labelledby="title desc"><title id="title">Use the job of a word in its sentence</title><desc id="desc">Who or what?: bird; What kind?: small; What happened?: sang.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="334" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="25" y="16" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="46" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Who or what?</text><text x="45" y="80" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">bird</text><rect x="25" y="121" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="151" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">What kind?</text><text x="45" y="185" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">small</text><rect x="25" y="226" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="256" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">What happened?</text><text x="45" y="290" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">sang</text></g></svg>
