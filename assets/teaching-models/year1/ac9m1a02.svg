<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Find the smallest repeating unit</title><desc id="desc">Triangle, circle, square repeated three times. A bracket marks the first three shapes as one repeating unit.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><path d="M45 140L70 85L95 140Z" fill="#fff" stroke="#17334d" stroke-width="3"/><circle cx="146" cy="115" r="25" fill="#fff" stroke="#17334d" stroke-width="3"/><rect x="197" y="90" width="50" height="50" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><path d="M273 140L298 85L323 140Z" fill="#fff" stroke="#17334d" stroke-width="3"/><circle cx="374" cy="115" r="25" fill="#fff" stroke="#17334d" stroke-width="3"/><rect x="425" y="90" width="50" height="50" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><path d="M501 140L526 85L551 140Z" fill="#fff" stroke="#17334d" stroke-width="3"/><circle cx="602" cy="115" r="25" fill="#fff" stroke="#17334d" stroke-width="3"/><rect x="653" y="90" width="50" height="50" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><path d="M40 165V183H247V165" fill="none" stroke="#28786f" stroke-width="3"/><text x="145" y="225" text-anchor="middle" fill="#17334d" font-size="24" font-weight="normal">one unit</text></g></svg>
