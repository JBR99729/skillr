<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Make the space between words visible</title><desc id="desc">The words cat and sat are shown separately, with a bracket highlighting their word space. This is a spacing model, not a handwriting formation exemplar.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="90" text-anchor="start" fill="#17334d" font-size="27" font-weight="normal">Words need a space</text><text x="80" y="165" text-anchor="start" fill="#17334d" font-size="47" font-weight="normal">cat</text><text x="310" y="165" text-anchor="start" fill="#17334d" font-size="47" font-weight="normal">sat</text><path d="M208 184V200H292V184" fill="none" stroke="#28786f" stroke-width="3"/><text x="250" y="242" text-anchor="middle" fill="#17334d" font-size="24" font-weight="normal">word space</text></g></svg>
