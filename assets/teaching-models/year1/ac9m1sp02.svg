<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="title desc"><title id="title">Use a clear start and facing direction</title><desc id="desc">Five-column, four-row grid. Start in row four column two, facing up. Move two cells up, turn right, move one cell right to row two column three.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="310" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="180" y="18" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="240" y="18" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="300" y="18" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="360" y="18" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="420" y="18" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="180" y="78" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="240" y="78" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="300" y="78" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="360" y="78" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="420" y="78" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="180" y="138" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="240" y="138" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="300" y="138" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="360" y="138" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="420" y="138" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="180" y="198" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="240" y="198" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="300" y="198" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="360" y="198" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><rect x="420" y="198" width="60" height="60" rx="0" fill="#fff" stroke="#28786f" stroke-width="2"/><path d="M270 244V211" stroke="#17334d" stroke-width="3" marker-end="url(#arrow)"/><circle cx="330" cy="108" r="10" fill="white" stroke="#28786f" stroke-width="3"/><path d="M270 211V108H330" fill="none" stroke="#28786f" stroke-width="5" marker-end="url(#arrow)"/><text x="155" y="235" text-anchor="end" fill="#17334d" font-size="23" font-weight="normal">Start</text><text x="520" y="110" text-anchor="start" fill="#17334d" font-size="23" font-weight="normal">Finish</text><text x="360" y="278" text-anchor="middle" fill="#17334d" font-size="24" font-weight="normal">Forward 2 → turn right → forward 1</text></g></svg>
