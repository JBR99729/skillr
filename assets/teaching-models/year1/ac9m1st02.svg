<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="title desc"><title id="title">Compare counts using the picture key</title><desc id="desc">One-to-one display: Walking: 4; Cycling: 2. Each circle represents one child response.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="250" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="190" y="82" text-anchor="end" fill="#17334d" font-size="24" font-weight="normal">Walking</text><circle cx="235" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="293" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="351" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="409" cy="75" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="640" y="82" text-anchor="middle" fill="#17334d" font-size="24" font-weight="bold">4</text><text x="190" y="145" text-anchor="end" fill="#17334d" font-size="24" font-weight="normal">Cycling</text><circle cx="235" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><circle cx="293" cy="138" r="14" fill="#28786f" stroke="#17334d" stroke-width="1.5"/><text x="640" y="145" text-anchor="middle" fill="#17334d" font-size="24" font-weight="bold">2</text><text x="360" y="234" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">Key: one circle = one child response</text></g></svg>
