<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Blend a digraph as one sound</title><desc id="desc">ship: sh, i, p. One box represents each spoken sound; a box may contain more than one letter.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="150.0" y="73" width="130" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="215.0" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">sh</text><rect x="290.0" y="73" width="130" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="355.0" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">i</text><rect x="430.0" y="73" width="130" height="83" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="495.0" y="127" text-anchor="middle" fill="#17334d" font-size="40" font-weight="bold">p</text><text x="360" y="210" text-anchor="middle" fill="#17334d" font-size="34" font-weight="normal">ship</text><text x="360" y="250" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">One box for each sound in this word</text></g></svg>
