<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" role="img" aria-labelledby="title desc"><title id="title">Give a short talk a clear shape</title><desc id="desc">Opening: I will tell you about frogs.; Middle: Frogs need suitable water and food.; Ending: That is why their habitat matters..</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="334" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="25" y="16" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="46" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Opening</text><text x="45" y="80" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">I will tell you about frogs.</text><rect x="25" y="121" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="151" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Middle</text><text x="45" y="185" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Frogs need suitable water and food.</text><rect x="25" y="226" width="670" height="92" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="45" y="256" text-anchor="start" fill="#28786f" font-size="21" font-weight="bold">Ending</text><text x="45" y="290" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">That is why their habitat matters.</text></g></svg>
