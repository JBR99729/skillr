<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc"><title id="title">Follow a contents entry to a page</title><desc id="desc">A contents page lists Nests on page 4 and Food on page 6. An arrow leads to a model page headed Nests, numbered 4.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28786f"/></marker></defs><rect width="720" height="280" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="40" y="35" width="280" height="205" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="65" y="75" text-anchor="start" fill="#17334d" font-size="29" font-weight="bold">Contents</text><text x="65" y="125" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Nests .......... 4</text><text x="65" y="175" text-anchor="start" fill="#17334d" font-size="26" font-weight="normal">Food ........... 6</text><rect x="400" y="35" width="280" height="205" rx="8" fill="#fff" stroke="#28786f" stroke-width="2"/><text x="425" y="75" text-anchor="start" fill="#17334d" font-size="29" font-weight="bold">Nests</text><text x="425" y="128" text-anchor="start" fill="#17334d" font-size="24" font-weight="normal">Birds build nests.</text><text x="650" y="219" text-anchor="middle" fill="#17334d" font-size="23" font-weight="normal">4</text><path d="M333 130H382" stroke="#28786f" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
