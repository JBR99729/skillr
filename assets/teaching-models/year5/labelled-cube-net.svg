<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Labelled Cube Net</title><desc id="desc">Six equal squares: the row is A, B, C, D; E is directly above B and F directly below B. Shared square edges are fold lines.</desc><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><rect x="110" y="110" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="155" y="163" text-anchor="middle">A</text><rect x="200" y="110" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="245" y="163" text-anchor="middle">B</text><rect x="290" y="110" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="335" y="163" text-anchor="middle">C</text><rect x="380" y="110" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="425" y="163" text-anchor="middle">D</text><rect x="200" y="20" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="245" y="73" text-anchor="middle">E</text><rect x="200" y="200" width="90" height="90" fill="#e4f1e9" stroke="#17344b" stroke-width="2"/><text x="245" y="253" text-anchor="middle">F</text></g></svg>
