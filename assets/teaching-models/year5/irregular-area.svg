<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Irregular Area</title><desc id="desc">A 6 m by 4 m rectangle has a 2 m by 1 m corner removed at the lower left. The shaded region is the remaining area.</desc><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><path d="M100 30H460V270H220V210H100Z" fill="#d9eee4" stroke="#17344b" stroke-width="3"/><line x1="220" y1="210" x2="220" y2="270" stroke="#17344b"  stroke-width="2" stroke-dasharray="5 5"/><text x="280" y="24" text-anchor="middle">6 m</text><text x="480" y="155">4 m</text><text x="105" y="238" font-size="14">removed</text><text x="105" y="260" font-size="14">2 m × 1 m</text></g></svg>
