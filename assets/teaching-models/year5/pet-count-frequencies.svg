<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Pet Count Frequencies</title><desc id="desc">Illustrative frequency graph: zero pets has frequency 1, one pet 2, two pets 3, three pets 1 and four pets 1. Total 8 respondents.</desc><rect width="640" height="340" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><rect x="120" y="190" width="45" height="60" fill="#12695f"/><text x="142" y="278" text-anchor="middle">0</text><rect x="205" y="130" width="45" height="120" fill="#12695f"/><text x="227" y="278" text-anchor="middle">1</text><rect x="290" y="70" width="45" height="180" fill="#12695f"/><text x="312" y="278" text-anchor="middle">2</text><rect x="375" y="190" width="45" height="60" fill="#12695f"/><text x="397" y="278" text-anchor="middle">3</text><rect x="460" y="190" width="45" height="60" fill="#12695f"/><text x="482" y="278" text-anchor="middle">4</text><line x1="90" y1="250" x2="535" y2="250" stroke="#d5e5dc"  stroke-width="2" /><text x="70" y="256">0</text><line x1="90" y1="190" x2="535" y2="190" stroke="#d5e5dc"  stroke-width="2" /><text x="70" y="196">1</text><line x1="90" y1="130" x2="535" y2="130" stroke="#d5e5dc"  stroke-width="2" /><text x="70" y="136">2</text><line x1="90" y1="70" x2="535" y2="70" stroke="#d5e5dc"  stroke-width="2" /><text x="70" y="76">3</text><text x="320" y="315" text-anchor="middle">Number of pets</text><text x="320" y="30" text-anchor="middle">Number of respondents (frequency)</text></g></svg>
