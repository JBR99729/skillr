<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Tank Volume Over Time</title><desc id="desc">Illustrative tank volumes at hours 0, 1, 2, 3 and 4 are 10, 14, 14, 8 and 12 litres. The vertical axis runs from 0 to 20 litres in equal 4-litre intervals.</desc><rect width="640" height="380" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><line x1="90" y1="290" x2="550" y2="290" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="296" text-anchor="middle">0</text><line x1="90" y1="250" x2="550" y2="250" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="256" text-anchor="middle">4</text><line x1="90" y1="210" x2="550" y2="210" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="216" text-anchor="middle">8</text><line x1="90" y1="170" x2="550" y2="170" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="176" text-anchor="middle">12</text><line x1="90" y1="130" x2="550" y2="130" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="136" text-anchor="middle">16</text><line x1="90" y1="90" x2="550" y2="90" stroke="#d4e3da"  stroke-width="2" /><text x="65" y="96" text-anchor="middle">20</text><text x="100" y="320" text-anchor="middle">0</text><circle cx="100" cy="190" r="5" fill="#12695f"/><text x="205" y="320" text-anchor="middle">1</text><circle cx="205" cy="150" r="5" fill="#12695f"/><text x="310" y="320" text-anchor="middle">2</text><circle cx="310" cy="150" r="5" fill="#12695f"/><text x="415" y="320" text-anchor="middle">3</text><circle cx="415" cy="210" r="5" fill="#12695f"/><text x="520" y="320" text-anchor="middle">4</text><circle cx="520" cy="170" r="5" fill="#12695f"/><polyline points="100,190 205,150 310,150 415,210 520,170" fill="none" stroke="#12695f" stroke-width="3"/><text x="320" y="355" text-anchor="middle">Time (hours)</text><text x="320" y="38" text-anchor="middle">Tank volume (litres)</text></g></svg>
