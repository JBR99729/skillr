e">3/6</text><line x1="406.6666666666667" y1="192" x2="406.6666666666667" y2="208" stroke="#17344b"  stroke-width="2" /><text x="406.6666666666667" y="238" font-size="20" text-anchor="middle">4/6</text><line x1="493.3333333333333" y1="192" x2="493.3333333333333" y2="208" stroke="#17344b"  stroke-width="2" /><text x="493.3333333333333" y="238" font-size="20" text-anchor="middle">5/6</text><line x1="580.0" y1="192" x2="580.0" y2="208" stroke="#17344b"  stroke-width="2" /><text x="580.0" y="238" font-size="20" text-anchor="middle">6/6</text><circle cx="406.667" cy="200" r="7" fill="#12695f"/><circle cx="493.333" cy="200" r="7" fill="#bb6826"/></g></svg>
