<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Angle Opening</title><desc id="desc">Two rays meet at a vertex. The marked smaller opening is 45 degrees, an acute angle. Extending either ray would not change the opening.</desc><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><line x1="150" y1="230" x2="480" y2="230" stroke="#17344b"  stroke-width="2" /><line x1="150" y1="230" x2="315" y2="65" stroke="#17344b"  stroke-width="2" /><text x="230" y="200">45°</text><path d="M225 230 A75 75 0 0 0 203 177" fill="none" stroke="#12695f" stroke-width="3"/><text x="155" y="265">vertex</text></g></svg>
