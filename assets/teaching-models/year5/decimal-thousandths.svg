<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Decimal Thousandths</title><desc id="desc">Ten equal thousandth intervals run from 2.330 to 2.340. A point at the fifth interval marks 2.335.</desc><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="18" fill="#17344b"><line x1="60" y1="140" x2="580" y2="140" stroke="#17344b"  stroke-width="2" /><line x1="60" y1="130" x2="60" y2="150" stroke="#17344b"  stroke-width="2" /><text x="60" y="180" font-size="20" text-anchor="middle">2.330</text><line x1="112" y1="130" x2="112" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="164" y1="130" x2="164" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="216" y1="130" x2="216" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="268" y1="130" x2="268" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="320" y1="130" x2="320" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="372" y1="130" x2="372" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="424" y1="130" x2="424" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="476" y1="130" x2="476" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="528" y1="130" x2="528" y2="150" stroke="#17344b"  stroke-width="2" /><line x1="580" y1="130" x2="580" y2="150" stroke="#17344b"  stroke-width="2" /><text x="580" y="180" font-size="20" text-anchor="middle">2.340</text><circle cx="320" cy="140" r="7" fill="#12695f"/><text x="320" y="100" text-anchor="middle">2.335</text></g></svg>
