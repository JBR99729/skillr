<svg xmlns="http://www.w3.org/2000/svg"><symbol id="u02-p-005" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Rock observations</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Rock A</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Red • rough</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Rock B</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Red • smooth</text></symbol><symbol id="u02-p-009" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Different kinds of property</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Surface texture</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Rough</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Overall edges</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Rounded</text></symbol><symbol id="u02-p-024" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Soil grain observations</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil A</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Many large grains</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil B</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Mostly tiny grains</text></symbol><symbol id="u02-p-027" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Water collected after 5 minutes</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil A</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">70 mL</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil B</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">25 mL</text></symbol><symbol id="u02-p-046" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Drainage test: same conditions</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil A</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">60 mL in 5 minutes</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil B</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">10 mL in 5 minutes</text></symbol><symbol id="u02-t-001" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Compare the samples</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Sample X</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Smooth • pale</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Sample Y</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Rough • pale</text></symbol><symbol id="u02-t-010" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f5faff"/><text x="320" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Equal inputs • equal time</text><rect x="35" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="167.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil P</text><text x="167.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">50 mL collected</text><rect x="340" y="100" width="265" height="95" rx="12" fill="white" stroke="#3184a6" stroke-width="2"/><text x="472.5" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">Soil Q</text><text x="472.5" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#16324f">15 mL collected</text></symbol></svg>
