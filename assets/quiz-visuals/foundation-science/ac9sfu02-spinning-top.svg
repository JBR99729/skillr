<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">A colourful spinning top turning</title>
  <desc id="desc">A red, yellow, blue and purple toy top spins around its pointed base, with curved arrows showing the turning movement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <linearGradient id="topBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.32" stop-color="#ff9f43"/>
      <stop offset="0.58" stop-color="#ffd93d"/>
      <stop offset="0.8" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#845ef7"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f3dc4"/>
      <stop offset="1" stop-color="#364fc7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#173968" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2457d6"/>
    </marker>
    <clipPath id="bodyClip">
      <path d="M320 112 C399 112 447 151 425 205 C409 244 365 276 320 302 C275 276 231 244 215 205 C193 151 241 112 320 112 Z"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" rx="28" fill="url(#background)"/>
  <circle cx="92" cy="74" r="30" fill="#ffffff" opacity="0.65"/>
  <circle cx="548" cy="90" r="42" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="320" cy="313" rx="112" ry="18" fill="#173968" opacity="0.12"/>

  <path d="M190 173 C207 91 283 58 357 74" fill="none" stroke="#2457d6" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M451 188 C438 265 366 301 291 291" fill="none" stroke="#2457d6" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="298" y="48" width="44" height="82" rx="18" fill="url(#handle)" stroke="#342182" stroke-width="6"/>
    <ellipse cx="320" cy="50" rx="34" ry="14" fill="#9775fa" stroke="#342182" stroke-width="6"/>
    <path d="M320 112 C399 112 447 151 425 205 C409 244 365 276 320 302 C275 276 231 244 215 205 C193 151 241 112 320 112 Z" fill="url(#topBody)" stroke="#173968" stroke-width="7" stroke-linejoin="round"/>
    <g clip-path="url(#bodyClip)" fill="none" stroke-linecap="round">
      <path d="M202 155 C267 179 374 183 438 151" stroke="#ffffff" stroke-width="15" opacity="0.9"/>
      <path d="M207 210 C273 231 371 234 432 208" stroke="#ffffff" stroke-width="13" opacity="0.82"/>
      <path d="M245 263 C293 278 350 278 395 260" stroke="#ffffff" stroke-width="10" opacity="0.72"/>
    </g>
    <ellipse cx="320" cy="126" rx="79" ry="25" fill="#ff8787" stroke="#173968" stroke-width="6"/>
    <ellipse cx="320" cy="126" rx="34" ry="11" fill="#ffd43b" opacity="0.92"/>
    <path d="M320 301 L306 326 Q320 337 334 326 Z" fill="#495057" stroke="#173968" stroke-width="5" stroke-linejoin="round"/>
    <path d="M281 150 C303 134 331 131 353 137" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g fill="#2457d6" font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="109" y="245" font-size="24">turns around</text>
    <text x="109" y="274" font-size="24">and around</text>
  </g>
</svg>
