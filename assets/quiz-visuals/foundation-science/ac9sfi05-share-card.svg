<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Science share card</title><desc id="d">A simple share card includes a question, prediction and observation.</desc><rect width="640" height="360" rx="24" fill="#eef2ff"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Share the science clearly</text><rect x="95" y="82" width="450" height="225" rx="18" fill="#fff" stroke="#4f46e5" stroke-width="5"/><text x="135" y="130" font-family="Arial" font-size="20" font-weight="700" fill="#4f46e5">Question:</text><text x="250" y="130" font-family="Arial" font-size="20" fill="#17324d">Which leaf is longest?</text><text x="135" y="190" font-family="Arial" font-size="20" font-weight="700" fill="#4f46e5">Prediction:</text><text x="260" y="190" font-family="Arial" font-size="20" fill="#17324d">The red leaf.</text><text x="135" y="250" font-family="Arial" font-size="20" font-weight="700" fill="#4f46e5">Observation:</text><text x="270" y="250" font-family="Arial" font-size="20" fill="#17324d">Red leaf = 8 cubes.</text></svg>
