<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Observation leads to a question</title><desc id="d">A leaf with spots is observed, then a question card asks what made the spots.</desc><rect width="640" height="360" rx="24" fill="#f0fdf4"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Notice → Observe → Ask</text><path d="M120 210c35-95 150-95 190 0-60 40-130 40-190 0z" fill="#86efac" stroke="#166534" stroke-width="6"/><path d="M160 205c40-20 80-20 120 0" fill="none" stroke="#166534" stroke-width="4"/><circle cx="185" cy="170" r="10" fill="#92400e"/><circle cx="235" cy="154" r="8" fill="#92400e"/><circle cx="260" cy="188" r="9" fill="#92400e"/><rect x="370" y="115" width="190" height="145" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="465" y="165" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2563eb">Question</text><text x="465" y="205" text-anchor="middle" font-family="Arial" font-size="19" fill="#17324d">What made</text><text x="465" y="231" text-anchor="middle" font-family="Arial" font-size="19" fill="#17324d">the spots?</text><path d="M315 185h45" stroke="#17324d" stroke-width="6"/><path d="M358 185l-18-14v28z" fill="#17324d"/></svg>
