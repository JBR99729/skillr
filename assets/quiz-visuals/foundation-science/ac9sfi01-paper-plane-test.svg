  <path d="m92 246 116 43-73 20-19 42-24-105Z" fill="#fff" stroke="#3465a4" stroke-width="6"/><path d="M208 289c135 1 236-18 330-92" fill="none" stroke="#df603c" stroke-width="9" stroke-dasharray="15 11"/><path d="m510 196 35-5-10 34" fill="none" stroke="#df603c" stroke-width="9"/>
