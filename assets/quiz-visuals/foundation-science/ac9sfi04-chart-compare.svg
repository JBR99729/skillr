<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Prediction differs from observation</title><desc id="d">A simple chart compares a prediction of three snails with an observation of one snail.</desc><rect width="640" height="360" rx="24" fill="#fff7ed"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Same or different?</text><rect x="110" y="82" width="420" height="220" rx="18" fill="#fff" stroke="#f97316" stroke-width="5"/><path d="M110 155h420M320 82v220" stroke="#fed7aa" stroke-width="5"/><text x="215" y="128" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">Prediction</text><text x="425" y="128" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">Observation</text><g fill="#fde68a" stroke="#92400e" stroke-width="4"><ellipse cx="165" cy="215" rx="23" ry="14"/><circle cx="190" cy="205" r="11"/><path d="M187 194v-16M196 194v-16"/><ellipse cx="215" cy="215" rx="23" ry="14"/><circle cx="240" cy="205" r="11"/><path d="M237 194v-16M246 194v-16"/><ellipse cx="265" cy="215" rx="23" ry="14"/><circle cx="290" cy="205" r="11"/><path d="M287 194v-16M296 194v-16"/><ellipse cx="415" cy="215" rx="25" ry="15"/><circle cx="442" cy="205" r="12"/><path d="M439 193v-17M448 193v-17"/></g><text x="320" y="332" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#9a3412">3 is different from 1</text></svg>
