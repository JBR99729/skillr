<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">A shadow at two times</title><desc id="desc">A short shadow beside a post in the morning and a longer shadow beside the same post in the afternoon.</desc>
