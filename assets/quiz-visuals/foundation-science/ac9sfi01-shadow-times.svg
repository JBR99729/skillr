  <circle cx="95" cy="75" r="37" fill="#ffd34e"/><path d="M190 275V130" stroke="#714b2d" stroke-width="24"/><path d="M190 275 92 306" stroke="#617183" stroke-width="24" stroke-linecap="round" opacity=".7"/>
  <circle cx="522" cy="104" r="37" fill="#ffd34e"/><path d="M430 275V130" stroke="#714b2d" stroke-width="24"/><path d="M430 275 586 320" stroke="#617183" stroke-width="24" stroke-linecap="round" opacity=".7"/>
  <path d="M320 42v278" stroke="#b9cede" stroke-width="4"/><text x="119" y="342" font-family="Arial,sans-serif" font-size="28" fill="#29445a">morning</text><text x="394" y="342" font-family="Arial,sans-serif" font-size="28" fill="#29445a">afternoon</text>
</svg>
