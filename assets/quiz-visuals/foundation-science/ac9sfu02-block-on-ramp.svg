<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">A flat wooden block gently released on a ramp</title>
  <desc id="desc">A yellow rectangular wooden block rests with a flat face on the upper part of a blue sloping ramp. A dashed arrow points down the ramp.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#fff8e7"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74c0fc"/>
      <stop offset="1" stop-color="#228be6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="0.55" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#173968" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#e03131"/>
    </marker>
  </defs>

  <rect width="640" height="360" rx="28" fill="url(#sky)"/>
  <circle cx="92" cy="70" r="34" fill="#ffffff" opacity="0.62"/>
  <circle cx="545" cy="76" r="46" fill="#ffffff" opacity="0.5"/>
  <path d="M0 305 C115 286 210 300 318 291 C440 280 529 292 640 270 L640 360 L0 360 Z" fill="#b2f2bb"/>
  <path d="M130 294 L502 104 L558 215 L187 322 Z" fill="url(#ramp)" stroke="#174f8a" stroke-width="7" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M145 287 L510 100" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  <path d="M168 316 L534 129" fill="none" stroke="#1864ab" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <g transform="translate(394 109) rotate(-27)" filter="url(#shadow)">
    <rect x="0" y="0" width="112" height="76" rx="10" fill="url(#wood)" stroke="#8f4b00" stroke-width="6"/>
    <path d="M20 20 C42 10 71 12 94 24" fill="none" stroke="#fff3bf" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <path d="M18 55 C43 45 70 47 96 58" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <path d="M435 202 C383 226 326 254 270 280" fill="none" stroke="#e03131" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 15" marker-end="url(#arrow)"/>

  <g transform="translate(492 34)">
    <path d="M12 66 C29 45 35 20 48 12 C58 6 68 12 65 23 L59 39 C72 27 84 18 93 22 C103 27 97 39 88 48 L71 65 C61 75 49 82 34 82 C23 82 15 75 12 66 Z" fill="#ffcc9a" stroke="#9c542f" stroke-width="5"/>
    <path d="M20 65 C34 68 49 68 64 57" fill="none" stroke="#e89b6b" stroke-width="4" stroke-linecap="round"/>
    <path d="M8 89 L78 89" stroke="#2457d6" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 9"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="525" y="148" font-size="22" fill="#2457d6">hand lets go</text>
    <text x="164" y="95" font-size="25" fill="#173968">flat face touches the ramp</text>
  </g>
  <path d="M282 105 C329 118 350 132 374 151" fill="none" stroke="#173968" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
