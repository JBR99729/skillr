  <rect x="55" y="90" width="230" height="105" rx="10" fill="#9edcf0" fill-opacity=".46" stroke="#297a9a" stroke-width="7"/><path d="M75 92v23m30-23v15m30-15v23m30-23v15m30-15v23m30-23v15m30-15v23" stroke="#297a9a" stroke-width="4"/>
  <rect x="355" y="90" width="230" height="105" rx="10" fill="#b77a43" stroke="#70431f" stroke-width="7"/><path d="M371 116c49-25 95 25 150-4m-147 51c62-21 106 15 192-12" fill="none" stroke="#8f5a2d" stroke-width="5"/>
