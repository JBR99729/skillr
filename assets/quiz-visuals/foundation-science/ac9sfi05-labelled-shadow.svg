<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Labelled shadow drawing</title><desc id="d">A labelled drawing shows a torch, block and shadow.</desc><rect width="640" height="360" rx="24" fill="#fefce8"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Labels help others understand</text><circle cx="125" cy="170" r="42" fill="#facc15" stroke="#ca8a04" stroke-width="5"/><text x="125" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#854d0e">torch</text><rect x="295" y="145" width="80" height="95" rx="8" fill="#60a5fa" stroke="#2563eb" stroke-width="5"/><text x="335" y="270" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">block</text><ellipse cx="485" cy="252" rx="95" ry="24" fill="#94a3b8" opacity=".75"/><text x="485" y="300" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">shadow</text><path d="M170 170h115M375 185l95 45" stroke="#facc15" stroke-width="9" stroke-linecap="round"/></svg>
