<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Nature observation record</title><desc id="d">A simple three-day plant record shows two leaves, two leaves, then three leaves.</desc><rect width="640" height="360" rx="24" fill="#eff6ff"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Look again to learn</text><rect x="80" y="85" width="480" height="215" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><path d="M80 145h480M240 85v215M400 85v215" stroke="#bfdbfe" stroke-width="4"/><text x="160" y="123" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">Mon</text><text x="320" y="123" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">Wed</text><text x="480" y="123" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">Fri</text><g fill="#22c55e" stroke="#166534" stroke-width="3"><path d="M150 245v-45"/><ellipse cx="138" cy="205" rx="18" ry="10"/><ellipse cx="162" cy="205" rx="18" ry="10"/><path d="M310 245v-45"/><ellipse cx="298" cy="205" rx="18" ry="10"/><ellipse cx="322" cy="205" rx="18" ry="10"/><path d="M470 245v-55"/><ellipse cx="458" cy="200" rx="18" ry="10"/><ellipse cx="482" cy="200" rx="18" ry="10"/><ellipse cx="470" cy="178" rx="16" ry="9"/></g><text x="320" y="332" text-anchor="middle" font-family="Arial" font-size="20" fill="#17324d">The record shows a change.</text></svg>
