<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Prediction and observation match</title><desc id="d">A card predicts ice will get smaller and an observation card shows the ice got smaller.</desc><rect width="640" height="360" rx="24" fill="#f8fbff"/><text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Compare prediction and observation</text><rect x="70" y="90" width="220" height="190" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><rect x="350" y="90" width="220" height="190" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="180" y="125" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#2563eb">Prediction</text><text x="460" y="125" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#16a34a">Observation</text><circle cx="180" cy="195" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="460" cy="205" r="26" fill="#dbeafe" stroke="#16a34a" stroke-width="4"/><text x="180" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">ice will get smaller</text><text x="460" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#17324d">ice got smaller</text><path d="M300 185h40" stroke="#17324d" stroke-width="6"/><path d="M340 185l-18-14v28z" fill="#17324d"/><text x="320" y="325" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#166534">Match</text></svg>
