<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Poem lines</title><desc id="d">Four short poem lines are shown on a page with musical notes.</desc><rect width="640" height="360" rx="24" fill="#fff7ed"/><rect x="145" y="55" width="350" height="250" rx="16" fill="#fff" stroke="#fb923c" stroke-width="5"/><text x="190" y="115" font-family="Arial" font-size="26" fill="#17243a">Rain taps</text><text x="190" y="155" font-family="Arial" font-size="26" fill="#17243a">on my hat</text><text x="190" y="195" font-family="Arial" font-size="26" fill="#17243a">Drip drop</text><text x="190" y="235" font-family="Arial" font-size="26" fill="#17243a">pitter pat</text><text x="455" y="110" font-family="Arial" font-size="38" fill="#c2410c">♪</text><text x="455" y="240" font-family="Arial" font-size="38" fill="#c2410c">♪</text></svg>