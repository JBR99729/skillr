<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Party invitation</title><desc id="d">A colourful invitation card gives a party day and time.</desc><rect width="640" height="360" rx="24" fill="#fdf2f8"/><rect x="150" y="65" width="340" height="230" rx="18" fill="#fff" stroke="#db2777" stroke-width="6"/><text x="320" y="125" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#be185d">Party!</text><text x="320" y="175" text-anchor="middle" font-family="Arial" font-size="24" fill="#17243a">Saturday</text><text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="24" fill="#17243a">2 o'clock</text><circle cx="220" cy="115" r="14" fill="#facc15"/><circle cx="430" cy="245" r="14" fill="#60a5fa"/></svg>