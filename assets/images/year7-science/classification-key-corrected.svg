<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">A complete key for four example cards</title><desc id="desc">This restricted key covers bird, furry mammal, six-legged insect and eight-legged arachnid cards only. Backbone yes leads to feathered bird or furry mammal; backbone no leads to six-legged insect or eight-legged arachnid. It is not a key for all animals.</desc><rect width="800" height="420" fill="#fff"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#285f70"/></marker></defs><text x="400" y="28" font-size="24" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Four-card example key: not all animals</text><rect x="290.0" y="60" width="220" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="400" y="87" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Backbone present?</text><path d="M400 100 L210 165" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="305.0" y="135" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Yes</text><path d="M400 100 L590 165" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="495.0" y="135" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">No</text><rect x="87.5" y="165" width="245" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="210" y="192" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Feathers present?</text><rect x="472.5" y="165" width="235" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="590" y="192" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Six jointed legs?</text><path d="M210 205 L105 285" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="149.5" y="250" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Yes</text><path d="M210 205 L300 285" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="247.0" y="250" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">No</text><path d="M590 205 L505 285" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="539.5" y="250" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Yes</text><path d="M590 205 L695 285" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="634.5" y="250" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">No</text><rect x="17.5" y="287" width="175" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="105" y="314" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Bird</text><rect x="212.5" y="287" width="175" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="300" y="314" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Furry mammal</text><rect x="417.5" y="287" width="175" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="505" y="314" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Insect</text><rect x="607.5" y="287" width="175" height="40" rx="10" fill="#e0efea" stroke="#3e7881"/><text x="695" y="314" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Arachnid</text><text x="105" y="360" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Feathers</text><text x="300" y="360" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Fur</text><text x="505" y="360" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">6 jointed legs</text><text x="695" y="360" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">8 jointed legs</text><text x="400" y="402" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Supplied cards have exactly the traits shown at their terminals.</text></svg>