<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">Lever and fully threaded pulley models</title><desc id="desc">Lever: downward effort on a 1.2 metre left arm balances a 60 newton load on a 0.4 metre right arm with 20 newtons ideal effort. Fixed pulley: rope passes over one supported wheel, load at one end and downward effort at the other; one supporting segment. Movable system: rope anchored above left, passes under load pulley, then over a fixed guide pulley, to a downward effort end. Two upward rope tensions support the moving load, halving ideal effort while doubling pulled distance. Friction and component weights neglected.</desc><rect width="900" height="690" fill="#fff"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#285f70"/></marker></defs><text x="450" y="30" font-size="26" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Ideal models: force traded for distance</text><line x1="110" y1="145" x2="590" y2="145" stroke="#285f70" stroke-width="8"/><path d="M470 145 L440 195 L500 195 Z" fill="#b8cbc8" stroke="#285f70" stroke-width="2"/><text x="470" y="220" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Fulcrum</text><path d="M110 145 L110 185" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M590 145 L590 265" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="110" y="110" font-size="21" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">20 N effort ↓</text><text x="705" y="235" font-size="21" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">60 N load ↓</text><line x1="110" y1="65" x2="470" y2="65" stroke="#2b6872" stroke-width="3"/><line x1="470" y1="65" x2="590" y2="65" stroke="#2b6872" stroke-width="3"/><text x="290" y="58" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">1.2 m</text><text x="530" y="58" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">0.4 m</text><text x="450" y="300" font-size="22" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">At ideal balance: 20 × 1.2 = 60 × 0.4</text><text x="230" y="350" font-size="24" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Fixed pulley</text><line x1="200" y1="380" x2="260" y2="380" stroke="#2b6872" stroke-width="3"/><line x1="230" y1="380" x2="230" y2="410" stroke="#2b6872" stroke-width="3"/><circle cx="230" cy="438" r="28" fill="#d8e7e1" stroke="#254f5e" stroke-width="2"/><path d="M202 570 V438 A28 28 0 0 1 258 438 V570" stroke="#92764c" stroke-width="5" fill="none"/><rect x="176" y="570" width="52" height="40" rx="5" fill="#a2cbd4" stroke="#285f70"/><text x="202" y="598" font-size="17" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Load</text><path d="M292 510 L292 575" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="335" y="505" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Pull down</text><text x="230" y="645" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">1 supporting segment: effort = load</text><text x="665" y="350" font-size="24" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Movable + fixed guide</text><line x1="585" y1="380" x2="760" y2="380" stroke="#2b6872" stroke-width="3"/><line x1="706" y1="380" x2="706" y2="410" stroke="#2b6872" stroke-width="3"/><circle cx="706" cy="438" r="28" fill="#d8e7e1" stroke="#254f5e" stroke-width="2"/><circle cx="650" cy="538" r="28" fill="#d8e7e1" stroke="#254f5e" stroke-width="2"/><path d="M622 380 V538 A28 28 0 0 0 678 538 V438 A28 28 0 0 1 734 438 V600" stroke="#92764c" stroke-width="5" fill="none"/><line x1="650" y1="566" x2="650" y2="587" stroke="#2b6872" stroke-width="3"/><rect x="620" y="587" width="60" height="40" rx="5" fill="#a2cbd4" stroke="#285f70"/><text x="650" y="614" font-size="17" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Load</text><path d="M604 520 L604 465" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M695 520 L695 465" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="600" y="450" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">T</text><text x="695" y="450" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">T</text><path d="M772 525 L772 590" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="813" y="510" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Pull</text><text x="665" y="662" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">2 supporting segments: effort = load ÷ 2</text></svg>