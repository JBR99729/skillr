<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="AC9S7U03-visual-title AC9S7U03-visual-desc"><title id="AC9S7U03-visual-title">Opposite seasons with the same axis direction</title><desc id="AC9S7U03-visual-desc">Sun centrally; June Earth on the left has its north pole tilted toward the Sun, while December Earth on the right has its north pole tilted away. The two axes are parallel. Sizes and distances are not to scale.</desc><text x="350" y="28" font-size="22" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Parallel axes at opposite orbital positions</text><circle cx="350" cy="175" r="43" fill="#e9bd57" stroke="#254f5e" stroke-width="2"/><text x="350" y="182" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Sun</text><circle cx="130" cy="175" r="49" fill="#9fc9d3" stroke="#254f5e" stroke-width="2"/><line x1="103" y1="237" x2="157" y2="113" stroke="#315d75" stroke-width="4"/><text x="166" y="105" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">N</text><text x="95" y="257" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">S</text><text x="130" y="302" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">June</text><text x="130" y="330" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">South: winter</text><circle cx="570" cy="175" r="49" fill="#9fc9d3" stroke="#254f5e" stroke-width="2"/><line x1="543" y1="237" x2="597" y2="113" stroke="#315d75" stroke-width="4"/><text x="606" y="105" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">N</text><text x="535" y="257" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">S</text><text x="570" y="302" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">December</text><text x="570" y="330" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">South: summer</text><line x1="190" y1="155" x2="292" y2="155" stroke="#d1a32f" stroke-width="3"/><line x1="190" y1="195" x2="292" y2="195" stroke="#d1a32f" stroke-width="3"/><line x1="408" y1="155" x2="510" y2="155" stroke="#d1a32f" stroke-width="3"/><line x1="408" y1="195" x2="510" y2="195" stroke="#d1a32f" stroke-width="3"/></svg>