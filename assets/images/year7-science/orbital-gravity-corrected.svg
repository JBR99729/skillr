<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Velocity tangent to a circular orbit</title><desc id="desc">At the rightmost point of the circular orbit, velocity points vertically up, tangent to the orbit. Gravitational acceleration points left toward Earth. This is a simplified circular-orbit model, not to scale.</desc><rect width="700" height="430" fill="#fff"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#285f70"/></marker></defs><text x="350" y="32" font-size="25" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">One instant in a circular orbit</text><circle cx="270" cy="220" r="135" fill="none" stroke="#7c9ca5" stroke-width="3" stroke-dasharray="8 7"/><circle cx="270" cy="220" r="48" fill="#a2cbd4" stroke="#254f5e" stroke-width="2"/><text x="270" y="227" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Earth</text><circle cx="405" cy="220" r="10" fill="#d9ac68" stroke="#254f5e" stroke-width="2"/><path d="M405 220 L405 75" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M405 220 L325 220" stroke="#285f70" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="520" y="100" font-size="22" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Velocity: tangent</text><text x="520" y="130" font-size="22" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">to the orbit</text><text x="470" y="270" font-size="22" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Gravity: inward</text><text x="350" y="405" font-size="21" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Gravity changes the direction of motion; it has not disappeared.</text></svg>