<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="title desc"><title id="title">Spring and neap tide positions only</title><desc id="desc">Left: a full-Moon example shows Sun, Earth and Moon aligned, associated with larger spring tidal range. Right: quarter Moon lies at a right angle to the Sun–Earth direction, associated with smaller neap range. No local water bulges, tide times or heights are shown. Not to scale.</desc><rect width="800" height="370" fill="#fff"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#285f70"/></marker></defs><text x="200" y="35" font-size="24" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Spring: larger range</text><text x="600" y="35" font-size="24" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Neap: smaller range</text><line x1="70" y1="190" x2="325" y2="190" stroke="#a2b7b8" stroke-width="2"/><circle cx="70" cy="190" r="27" fill="#e9bd57" stroke="#254f5e" stroke-width="2"/><circle cx="230" cy="190" r="29" fill="#9fc9d3" stroke="#254f5e" stroke-width="2"/><circle cx="325" cy="190" r="13" fill="#bbc6c7" stroke="#254f5e" stroke-width="2"/><text x="70" y="245" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Sun</text><text x="230" y="245" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Earth</text><text x="325" y="245" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Moon</text><text x="200" y="305" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Full-Moon example: aligned</text><line x1="455" y1="190" x2="610" y2="190" stroke="#a2b7b8" stroke-width="2"/><line x1="610" y1="190" x2="610" y2="95" stroke="#a2b7b8" stroke-width="2"/><circle cx="455" cy="190" r="27" fill="#e9bd57" stroke="#254f5e" stroke-width="2"/><circle cx="610" cy="190" r="29" fill="#9fc9d3" stroke="#254f5e" stroke-width="2"/><circle cx="610" cy="95" r="13" fill="#bbc6c7" stroke="#254f5e" stroke-width="2"/><text x="455" y="245" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Sun</text><text x="610" y="245" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Earth</text><text x="710" y="100" font-size="18" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Quarter Moon</text><text x="600" y="305" font-size="20" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Sun–Earth–Moon: right angle</text><text x="400" y="353" font-size="19" fill="#183b47" text-anchor="middle" font-family="Arial,sans-serif">Positions only; not a local tide-height or tide-time forecast.</text></svg>