<svg id="model" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><title>Two equal-square arrangements: A shares a full side and forms a rectangle; B touches at one corner.</title><rect width="640" height="400" fill="white"/><g stroke="#173968" stroke-width="3"><rect x="70" y="110" width="90" height="90" fill="#c4ddff"/><rect x="160" y="110" width="90" height="90" fill="#ffdb9c"/><rect x="370" y="110" width="90" height="90" fill="#c4ddff"/><rect x="460" y="200" width="90" height="90" fill="#ffdb9c"/><text x="160" y="335" text-anchor="middle" fill="#173968" stroke="none" font-size="22">A: full shared side</text><text x="455" y="335" text-anchor="middle" fill="#173968" stroke="none" font-size="22">B: corner contact only</text></g></svg>