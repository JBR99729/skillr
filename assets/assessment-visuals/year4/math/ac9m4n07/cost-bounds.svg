<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Use basic facts to bound a cost"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="bold">Use basic facts to bound a cost</text><text x="320" y="72" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968" font-weight="normal">One packet costs $2.40: more than $2, less than $3.</text><rect x="55" y="102" width="105" height="48" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><text x="107.5" y="134" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$2</text><rect x="160" y="102" width="105" height="48" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><text x="212.5" y="134" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$2</text><rect x="265" y="102" width="105" height="48" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><text x="317.5" y="134" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$2</text><rect x="370" y="102" width="105" height="48" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><text x="422.5" y="134" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$2</text><text x="515" y="134" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968" font-weight="normal">= $8</text><rect x="55" y="177" width="105" height="48" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="107.5" y="209" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$3</text><rect x="160" y="177" width="105" height="48" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="212.5" y="209" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$3</text><rect x="265" y="177" width="105" height="48" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="317.5" y="209" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$3</text><rect x="370" y="177" width="105" height="48" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="422.5" y="209" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">$3</text><text x="515" y="209" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968" font-weight="normal">= $12</text><text x="320" y="275" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968" font-weight="normal">Keep the number of packets fixed at four.</text></symbol><use href="#model"/></svg>
