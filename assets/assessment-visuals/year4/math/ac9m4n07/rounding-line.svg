<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Round to the nearest hundred"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="bold">Round to the nearest hundred</text><line x1="65" y1="151" x2="575" y2="151" stroke="#173968" stroke-width="2"/><line x1="65.0" y1="142" x2="65.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="116.0" y1="142" x2="116.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="167.0" y1="142" x2="167.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="218.0" y1="142" x2="218.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="269.0" y1="142" x2="269.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="320.0" y1="142" x2="320.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="371.0" y1="142" x2="371.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="422.0" y1="142" x2="422.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="473.0" y1="142" x2="473.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="524.0" y1="142" x2="524.0" y2="160" stroke="#173968" stroke-width="2"/><line x1="575.0" y1="142" x2="575.0" y2="160" stroke="#173968" stroke-width="2"/><text x="65.0" y="195" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">400</text><text x="320.0" y="195" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">450</text><text x="575.0" y="195" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">500</text><circle cx="437.3" cy="151" r="8" fill="#b54e35"/><line x1="437.3" y1="95" x2="437.3" y2="138" stroke="#b54e35" stroke-width="2"/><text x="437.3" y="82" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173968" font-weight="normal">473</text><text x="320" y="248" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968" font-weight="normal">450 is halfway between 400 and 500.</text></symbol><use href="#model"/></svg>
