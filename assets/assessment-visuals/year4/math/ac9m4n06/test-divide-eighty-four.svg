<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Share 84 equally among 3 groups"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968">Share 84 equally among 3 groups</text><text x="270" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968">60 counters</text><text x="410" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968">24</text><text x="103" y="164" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968">3 rows</text><rect x="170" y="93" width="200" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="370" y="93" width="80" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="270" y="121" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">20</text><text x="410" y="121" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">8</text><rect x="170" y="136" width="200" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="370" y="136" width="80" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="270" y="164" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">20</text><text x="410" y="164" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">8</text><rect x="170" y="179" width="200" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="370" y="179" width="80" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="270" y="207" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">20</text><text x="410" y="207" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968">8</text><text x="320" y="268" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968">Every group receives one third of both parts.</text></symbol><use href="#model"/></svg>
