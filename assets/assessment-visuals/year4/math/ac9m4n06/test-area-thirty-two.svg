<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Use the two parts of a 32 × 7 region"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968">Use the two parts of a 32 × 7 region</text><rect x="150" y="110" width="300" height="70" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="450" y="110" width="20" height="70" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="300" y="91" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968">30</text><text x="460" y="91" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968">2</text><text x="124" y="150" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968">7</text><text x="300" y="154" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173968">7 × 30</text><text x="454" y="226" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968">Right part: 7 × 2</text><text x="320" y="267" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968">32 is split into 30 and 2.</text></symbol><use href="#model"/></svg>
