<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Partition a 23 × 4 region"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="bold">Partition a 23 × 4 region</text><rect x="65" y="95" width="400" height="80" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="465" y="95" width="60" height="80" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="265" y="78" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">20</text><text x="495" y="78" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">3</text><text x="42" y="142" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">4</text><text x="265" y="144" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#173968" font-weight="normal">4 × 20</text><text x="495" y="142" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#173968" font-weight="normal">4 × 3</text><text x="320" y="244" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968" font-weight="normal">23 is split into 20 and 3; the height stays 4.</text></symbol><use href="#model"/></svg>
