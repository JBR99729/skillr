<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Share 96 equally among 3 groups"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#f7faff"/><text x="320" y="31" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="bold">Share 96 equally among 3 groups</text><text x="305" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968" font-weight="normal">90 counters</text><text x="545" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173968" font-weight="normal">6</text><rect x="80" y="93" width="450" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="530" y="93" width="30" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="305" y="121" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968" font-weight="normal">30</text><text x="545" y="121" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">2</text><rect x="80" y="136" width="450" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="530" y="136" width="30" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="305" y="164" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968" font-weight="normal">30</text><text x="545" y="164" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">2</text><rect x="80" y="179" width="450" height="43" fill="#e4efff" stroke="#2457a6" stroke-width="2"/><rect x="530" y="179" width="30" height="43" fill="#d7f2e8" stroke="#2457a6" stroke-width="2"/><text x="305" y="207" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173968" font-weight="normal">30</text><text x="545" y="207" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173968" font-weight="normal">2</text><text x="39" y="165" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173968" font-weight="normal">3</text><text x="320" y="264" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173968" font-weight="normal">Each row receives one third of both parts.</text></symbol><use href="#model"/></svg>
