<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="34" font-family="Arial,sans-serif" font-size="21" fill="#172554" text-anchor="middle">Start with a whole number</text><path d="M320 45V65" stroke="#475569" stroke-width="3"/><path d="M320 64L478 123L320 182L162 123Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="320" y="117" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle">Is the ones digit</text><text x="320" y="141" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle">0, 2, 4, 6 or 8?</text><path d="M162 123H90V207M478 123H550V207" fill="none" stroke="#475569" stroke-width="3"/><text x="113" y="110" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle">Yes</text><text x="524" y="110" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle">No</text><rect x="35" y="207" width="150" height="58" rx="12" fill="#d1fae5" stroke="#047857"/><rect x="455" y="207" width="150" height="58" rx="12" fill="#ffedd5" stroke="#c2410c"/><text x="110" y="244" font-family="Arial,sans-serif" font-size="23" fill="#172554" text-anchor="middle">Even</text><text x="530" y="244" font-family="Arial,sans-serif" font-size="23" fill="#172554" text-anchor="middle">Odd</text></symbol><use href="#model"/></svg>