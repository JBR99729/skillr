<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start">Place-value chart</text><rect x="40" y="75" width="185" height="120" fill="#fff" stroke="#64748b"/><text x="132" y="112" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle">Ones</text><text x="132" y="166" font-family="Arial,sans-serif" font-size="30" fill="#172554" text-anchor="middle">6</text><rect x="225" y="75" width="185" height="120" fill="#fff" stroke="#64748b"/><text x="317" y="112" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle">Tenths</text><text x="317" y="166" font-family="Arial,sans-serif" font-size="30" fill="#172554" text-anchor="middle">0</text><rect x="410" y="75" width="185" height="120" fill="#fff" stroke="#64748b"/><text x="502" y="112" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle">Hundredths</text><text x="502" y="166" font-family="Arial,sans-serif" font-size="30" fill="#172554" text-anchor="middle">8</text><text x="320" y="245" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle">The decimal point goes after the ones place.</text></symbol><use href="#model"/></svg>