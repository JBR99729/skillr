<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start">Count the notes and coins</text><rect x="35" y="75" width="175" height="62" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="122" y="112" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">3 × $20 notes</text><rect x="225" y="75" width="175" height="62" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="312" y="112" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">2 × $10 notes</text><rect x="415" y="75" width="175" height="62" rx="9" fill="#ffedd5" stroke="#64748b"/><text x="502" y="112" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">1 × $5 note</text><rect x="35" y="160" width="175" height="62" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="122" y="197" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">4 × $2 coins</text><rect x="225" y="160" width="175" height="62" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="312" y="197" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">3 × 20c coins</text><rect x="415" y="160" width="175" height="62" rx="9" fill="#ffedd5" stroke="#64748b"/><text x="502" y="197" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="middle">1 × 5c coin</text><text x="320" y="278" font-family="Arial,sans-serif" font-size="16" fill="#172554" text-anchor="middle">Denominations are shown; pictures are not to scale.</text></symbol><use href="#model"/></svg>