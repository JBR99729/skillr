<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><title>Whole ribbon and one sample piece</title><defs><symbol id="p043-ribbon" viewBox="0 0 640 300"><rect x="0" y="0" width="640" height="300" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#173968">Ribbon to cut into equal pieces</text><rect x="40" y="88" width="560" height="47" rx="0" fill="#eef5ff" stroke="#5e789c" stroke-width="2"/><text x="320" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#173968">960 cm altogether</text><rect x="40" y="189" width="120" height="45" rx="0" fill="#cdeede" stroke="#5e789c" stroke-width="2"/><text x="100" y="219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#173968">30 cm</text><text x="194" y="213" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#173968">One piece</text><text x="320" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#173968">Whole ribbon and sample piece are not to the same scale.</text></symbol></defs><use href="#p043-ribbon"/></svg>
