<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Flowchart: if the input is greater than 5, multiply by 2; otherwise add 3; record the resulting output."><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16354a"/></marker></defs><text x="320" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#16354a">Use one branch for each input</text><rect x="245" y="40" width="150" height="38" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="320" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#16354a">Input</text><path d="M320 78L320 94" fill="none" stroke="#16354a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M320 94L423 134L320 174L217 134Z" fill="#fff0cf" stroke="#16354a" stroke-width="2"/><text x="320" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">Input &gt; 5?</text><path d="M217 134L150 134" fill="none" stroke="#16354a" stroke-width="2.5" marker-end="url(#arr)"/><text x="177" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16354a">Yes</text><rect x="45" y="115" width="105" height="40" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="97" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">× 2</text><path d="M423 134L490 134" fill="none" stroke="#16354a" stroke-width="2.5" marker-end="url(#arr)"/><text x="455" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16354a">No</text><rect x="490" y="115" width="105" height="40" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="543" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">+ 3</text><path d="M97 155V208H320M543 155V208H320" fill="none" stroke="#16354a" stroke-width="2.5"/><path d="M320 208L320 230" fill="none" stroke="#16354a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="220" y="230" width="200" height="40" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="320" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#16354a">Record output</text></symbol><use href="#model"/></svg>
