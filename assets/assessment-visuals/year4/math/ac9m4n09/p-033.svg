"40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="420.0" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">12</text><rect x="50" y="217.0" width="200" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="150.0" y="244.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">4</text><rect x="250" y="217.0" width="340" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="420.0" y="244.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">16</text></symbol><use href="#model"/></svg>
