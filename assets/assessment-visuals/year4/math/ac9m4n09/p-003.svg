<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Input/output table for multiply by 5 then add 2: inputs 1, 2, 3 have outputs 7, 12, 17; input 4 has unknown output."><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><text x="320" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#16354a">One rule for each input</text><rect x="50" y="57.0" width="130" height="40.0" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="115.0" y="84.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">Input</text><rect x="180" y="57.0" width="280" height="40.0" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="320.0" y="84.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">Working</text><rect x="460" y="57.0" width="130" height="40.0" rx="3" fill="#e5f3fa" stroke="#16354a" stroke-width="2"/><text x="525.0" y="84.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">Output</text><rect x="50" y="97.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="115.0" y="124.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">1</text><rect x="180" y="97.0" width="280" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="320.0" y="124.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">1 × 5 + 2</text><rect x="460" y="97.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="525.0" y="124.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">7</text><rect x="50" y="137.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="115.0" y="164.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">2</text><rect x="180" y="137.0" width="280" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="320.0" y="164.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">2 × 5 + 2</text><rect x="460" y="137.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="525.0" y="164.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">12</text><rect x="50" y="177.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="115.0" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">3</text><rect x="180" y="177.0" width="280" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="320.0" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">3 × 5 + 2</text><rect x="460" y="177.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="525.0" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">17</text><rect x="50" y="217.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="115.0" y="244.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">4</text><rect x="180" y="217.0" width="280" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="320.0" y="244.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">4 × 5 + 2</text><rect x="460" y="217.0" width="130" height="40.0" rx="3" fill="#fff" stroke="#16354a" stroke-width="2"/><text x="525.0" y="244.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#16354a">?</text></symbol><use href="#model"/></svg>
