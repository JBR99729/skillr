<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><rect width="640" height="300" fill="#fff"/><text x="107" y="36" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#173968" font-weight="bold">1. First fold</text><text x="320" y="36" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#173968" font-weight="bold">2. Match the edge</text><text x="532" y="36" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#173968" font-weight="bold">3. Use the corner</text><rect x="28" y="91" width="158" height="112" fill="#eaf2ff" stroke="#173968" stroke-width="3"/><path d="M 28.00 203.00 L 186.00 203.00" fill="none" stroke="#13795b" stroke-width="5" stroke-linecap="round"/><text x="107" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#13795b" font-weight="normal">First folded edge</text><rect x="242" y="91" width="156" height="112" fill="#eaf2ff" stroke="#173968" stroke-width="3"/><path d="M 242.00 203.00 L 398.00 203.00" fill="none" stroke="#13795b" stroke-width="5" stroke-linecap="round"/><path d="M 320.00 88.00 L 320.00 211.00" fill="none" stroke="#173968" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M 383 167 Q 320 115 255 167" fill="none" stroke="#b84e00" stroke-width="3"/><path d="M 258 153 L255 167 L269 166" fill="none" stroke="#b84e00" stroke-width="3"/><text x="320" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#173968" font-weight="normal">Fold edge onto itself.</text><rect x="490" y="91" width="78" height="112" fill="#eaf2ff" stroke="#173968" stroke-width="3"/><path d="M 490.00 203.00 L 568.00 203.00" fill="none" stroke="#13795b" stroke-width="5" stroke-linecap="round"/><path d="M 568.00 91.00 L 568.00 203.00" fill="none" stroke="#173968" stroke-width="5" stroke-linecap="round"/><path d="M 548 203 L548 183 L568 183" fill="none" stroke="#b84e00" stroke-width="3"/><text x="532" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#173968" font-weight="normal">Folds meet at a</text><text x="532" y="261" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#173968" font-weight="normal">right angle.</text><text x="25" y="286" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="start" fill="#55657a" font-weight="normal">At the second fold, the two parts of the first folded edge must match.</text></svg>
