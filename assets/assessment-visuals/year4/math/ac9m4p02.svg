<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><defs><symbol viewBox="0 0 640 300" id="coins"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Example: 20 two-coin trials</text><rect x="100" y="148" width="65" height="92" fill="#3d7dcc"/><text x="120" y="265" font-size="19" fill="#173968">HH</text><text x="120" y="138" font-size="18" fill="#173968">4</text><rect x="225" y="79" width="65" height="161" fill="#3d7dcc"/><text x="245" y="265" font-size="19" fill="#173968">HT</text><text x="245" y="69" font-size="18" fill="#173968">7</text><rect x="350" y="125" width="65" height="115" fill="#3d7dcc"/><text x="370" y="265" font-size="19" fill="#173968">TH</text><text x="370" y="115" font-size="18" fill="#173968">5</text><rect x="475" y="148" width="65" height="92" fill="#3d7dcc"/><text x="495" y="265" font-size="19" fill="#173968">TT</text><text x="495" y="138" font-size="18" fill="#173968">4</text><path d="M65 55V240H600" fill="none" stroke="#173968" stroke-width="2"/><text x="18" y="175" transform="rotate(-90 18 175)" font-size="14" fill="#173968">Count</text><text x="35" y="245" font-size="15" fill="#173968">0</text><text x="35" y="199" font-size="15" fill="#173968">2</text><text x="35" y="153" font-size="15" fill="#173968">4</text><text x="35" y="107" font-size="15" fill="#173968">6</text><text x="35" y="61" font-size="15" fill="#173968">8</text></symbol><symbol viewBox="0 0 640 300" id="sets"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Example: two sets of 10 coin tosses</text><text x="30" y="95" font-size="22" fill="#173968">Set A: 4 heads and 6 tails</text><text x="30" y="150" font-size="22" fill="#173968">Set B: 7 heads and 3 tails</text><text x="30" y="225" font-size="22" fill="#173968">Both total 10; the results differ.</text></symbol><symbol viewBox="0 0 640 300" id="outcomes"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Two labelled coins: four ordered outcomes</text><text x="45" y="105" font-size="22" fill="#173968">A heads, B heads: HH</text><text x="45" y="155" font-size="22" fill="#173968">A heads, B tails: HT</text><text x="335" y="105" font-size="22" fill="#173968">A tails, B heads: TH</text><text x="335" y="155" font-size="22" fill="#173968">A tails, B tails: TT</text><text x="45" y="240" font-size="22" fill="#173968">HT and TH both mean one of each.</text></symbol><symbol viewBox="0 0 640 300" id="cards"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Record two features of the same card</text><text x="35" y="105" font-size="22" fill="#173968">Queen of clubs</text><text x="35" y="170" font-size="22" fill="#173968">Suit: clubs</text><text x="335" y="170" font-size="22" fill="#173968">Type: picture</text><text x="35" y="245" font-size="22" fill="#173968">Return the card, then shuffle.</text></symbol></defs></svg>