<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><defs><symbol viewBox="0 0 640 300" id="bags"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Bag compositions shown as equal-width wholes</text><text x="20" y="82" font-size="22" fill="#173968">A</text><rect x="65" y="65" width="280.0" height="35" fill="#df5965"/><rect x="345.0" y="65" width="140.0" height="35" fill="#fff" stroke="#173968"/><text x="70" y="124" font-size="17" fill="#173968">10 red, 5 white</text><text x="20" y="158" font-size="22" fill="#173968">B</text><rect x="65" y="141" width="210.0" height="35" fill="#df5965"/><rect x="275.0" y="141" width="210.0" height="35" fill="#fff" stroke="#173968"/><text x="70" y="200" font-size="17" fill="#173968">20 red, 20 white</text><text x="20" y="234" font-size="22" fill="#173968">C</text><rect x="65" y="217" width="233.33333333333334" height="35" fill="#df5965"/><rect x="298.33333333333337" y="217" width="186.66666666666666" height="35" fill="#fff" stroke="#173968"/><text x="70" y="276" font-size="17" fill="#173968">25 red, 20 white</text></symbol><symbol viewBox="0 0 640 300" id="replace"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Returning a counter restores the bag</text><text x="30" y="100" font-size="22" fill="#173968">Start: 2 red, 2 blue</text><text x="30" y="150" font-size="22" fill="#173968">Keep red out: 1 red, 2 blue</text><text x="30" y="200" font-size="22" fill="#173968">Return red and mix: 2 red, 2 blue</text></symbol><symbol viewBox="0 0 640 300" id="spinner"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Four equal sectors: red, red, blue, green</text><path d="M210 165 L210 65 A100 100 0 0 1 310 165 Z" fill="#df5965" stroke="#173968"/><path d="M210 165 L310 165 A100 100 0 0 1 210 265 Z" fill="#df5965" stroke="#173968"/><path d="M210 165 L210 265 A100 100 0 0 1 110 165 Z" fill="#3d7dcc" stroke="#173968"/><path d="M210 165 L110 165 A100 100 0 0 1 210 65 Z" fill="#42aa80" stroke="#173968"/><text x="235" y="130" font-size="22" fill="#173968">R</text><text x="235" y="218" font-size="22" fill="#173968">R</text><text x="155" y="218" font-size="22" fill="#173968">B</text><text x="150" y="130" font-size="22" fill="#173968">G</text><text x="355" y="130" font-size="18" fill="#173968">R = red</text><text x="355" y="170" font-size="18" fill="#173968">B = blue</text><text x="355" y="210" font-size="18" fill="#173968">G = green</text></symbol><symbol viewBox="0 0 640 300" id="scale"><rect width="640" height="300" fill="white"/><text x="20" y="30" font-size="22" fill="#173968">Likelihood language</text><text x="20" y="95" font-size="23" fill="#173968">Impossible → unlikely → even chance</text><text x="150" y="155" font-size="23" fill="#173968">→ likely → certain</text><text x="20" y="235" font-size="22" fill="#173968">Likely does not mean guaranteed.</text></symbol></defs></svg>