<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Count on from 46 to 103</title><desc id="desc">A proportional number line shows 46 to 50 with an increase of 4, 50 to 100 with an increase of 50, and 100 to 103 with an increase of 3.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2457d6"/></marker></defs><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f4f8ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="30" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">Count on from 46 to 103</text><line x1="57" y1="209" x2="583" y2="209" stroke="#173968" stroke-width="2"/><line x1="57" y1="201" x2="57" y2="216" stroke="#173968" stroke-width="2"/><text x="57" y="241" text-anchor="middle" font-size="18" font-weight="600" fill="#173968">46</text><line x1="93.9123" y1="201" x2="93.9123" y2="216" stroke="#173968" stroke-width="2"/><text x="93.9123" y="241" text-anchor="middle" font-size="18" font-weight="600" fill="#173968">50</text><line x1="555.316" y1="201" x2="555.316" y2="216" stroke="#173968" stroke-width="2"/><text x="552.316" y="241" text-anchor="end" font-size="18" font-weight="600" fill="#173968">100</text><line x1="583" y1="201" x2="583" y2="216" stroke="#173968" stroke-width="2"/><text x="586" y="241" text-anchor="start" font-size="18" font-weight="600" fill="#173968">103</text><path d="M57 200 Q75.4561 136 93.9123 200" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="75.4561" y="151" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">+4</text><path d="M93.9123 200 Q324.614 76 555.316 200" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="324.614" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">+50</text><path d="M555.316 200 Q569.158 136 583 200" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="569.158" y="151" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">+3</text><text x="320" y="281" text-anchor="middle" font-size="16" font-weight="600" fill="#173968">The increases combine to make the missing addend.</text></g></symbol><use href="#model"/></svg>
