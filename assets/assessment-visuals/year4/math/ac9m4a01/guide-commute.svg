571" y2="121" stroke="#173968" stroke-width="1.5"/><text x="512.571" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">6</text><line x1="588" y1="110" x2="588" y2="121" stroke="#173968" stroke-width="1.5"/><text x="588" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">7</text><path d="M60 106 Q248.571 47 437.143 106" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="248.571" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="#173968">+5</text><path d="M437.143 106 Q512.571 47 588 106" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="512.571" y="70" text-anchor="middle" font-size="21" font-weight="600" fill="#173968">+2</text><text x="588" y="43" text-anchor="end" font-size="14" font-weight="600" fill="#173968">Journey 1</text><line x1="60" y1="233" x2="588" y2="233" stroke="#173968" stroke-width="2"/><line x1="60" y1="228" x2="60" y2="239" stroke="#173968" stroke-width="1.5"/><text x="60" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">0</text><line x1="135.429" y1="228" x2="135.429" y2="239" stroke="#173968" stroke-width="1.5"/><text x="135.429" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">1</text><line x1="210.857" y1="228" x2="210.857" y2="239" stroke="#173968" stroke-width="1.5"/><text x="210.857" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">2</text><line x1="286.286" y1="228" x2="286.286" y2="239" stroke="#173968" stroke-width="1.5"/><text x="286.286" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">3</text><line x1="361.714" y1="228" x2="361.714" y2="239" stroke="#173968" stroke-width="1.5"/><text x="361.714" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#173968">4</text><line x1="437.143" y1="228" x2="437.143" y2="239" stroke="#173968" stroke-width="1.5"/><text x="437.143" y="258" text-a