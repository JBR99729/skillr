<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Whole and parts</title><desc id="desc">A whole of 185 is partitioned into a part of 79 and an unknown part. The bar widths are proportional to their amounts.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2457d6"/></marker></defs><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f4f8ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="32" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">Whole and parts</text><text x="320" y="86" text-anchor="middle" font-size="22" font-weight="600" fill="#173968">Whole: 185</text><path d="M54 104 V94 H586 V104" fill="none" stroke="#173968" stroke-width="2"/><rect x="54" y="121" width="532" height="76" rx="4" fill="#fff" stroke="#173968" stroke-width="2"/><rect x="54" y="121" width="227.178" height="76" fill="#dce8ff"/><line x1="281.178" y1="121" x2="281.178" y2="197" stroke="#173968" stroke-width="2"/><text x="167.589" y="168" text-anchor="middle" font-size="27" font-weight="600" fill="#173968">79</text><text x="433.589" y="168" text-anchor="middle" font-size="30" font-weight="600" fill="#173968">□</text><text x="167.589" y="230" text-anchor="middle" font-size="18" font-weight="600" fill="#173968">Known part</text><text x="433.589" y="230" text-anchor="middle" font-size="18" font-weight="600" fill="#173968">Unknown part</text><text x="320" y="273" text-anchor="middle" font-size="17" font-weight="600" fill="#173968">The two parts make the labelled whole.</text></g></symbol><use href="#model"/></svg>
