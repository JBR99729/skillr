dth="6"/><path d="M302 85 V124 M536 85 V124" stroke="#13795b" stroke-width="2" fill="none"/><text x="302" y="78" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">14</text><text x="536" y="78" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">27</text><text x="419" y="79" text-anchor="middle" font-size="16" font-weight="600" fill="#173968">gap 13</text><line x1="50" y1="230" x2="590" y2="230" stroke="#173968" stroke-width="2"/><line x1="50" y1="226" x2="50" y2="236" stroke="#173968"/><text x="50" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">0</text><line x1="140" y1="226" x2="140" y2="236" stroke="#173968"/><text x="140" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">5</text><line x1="230" y1="226" x2="230" y2="236" stroke="#173968"/><text x="230" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">10</text><line x1="320" y1="226" x2="320" y2="236" stroke="#173968"/><text x="320" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">15</text><line x1="410" y1="226" x2="410" y2="236" stroke="#173968"/><text x="410" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">20</text><line x1="500" y1="226" x2="500" y2="236" stroke="#173968"/><text x="500" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">25</text><line x1="590" y1="226" x2="590" y2="236" stroke="#173968"/><text x="590" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">30</text><line x1="122" y1="200" x2="356" y2="200" stroke="#13795b" stroke-width="6"/><path d="M122 193 V232 M356 193 V232" stroke="#13795b" stroke-width="2" fill="none"/><text x="122" y="186" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">4</text><text x="356" y="186" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">17</text><text x="239" y="187" text-anchor="middle" font-size="1