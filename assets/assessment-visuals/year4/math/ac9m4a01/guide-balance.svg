<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">6 + 8 = □ + 10</title><desc id="desc">A level balance scale has groups of 6 and 8 identical counters on the left pan. The right pan has 10 identical counters and a covered group with an unknown number of identical counters.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2457d6"/></marker></defs><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f4f8ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="29" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">6 + 8 = □ + 10</text><text x="320" y="54" text-anchor="middle" font-size="16" font-weight="600" fill="#173968">Every counter has the same mass.</text><path d="M66 87 H574 M320 87 V258 M270 264 H370" fill="none" stroke="#173968" stroke-width="5" stroke-linecap="round"/><path d="M320 75 L310 90 H330 Z" fill="#9a6700"/><path d="M166 88 L49 204 M166 88 L283 204 M474 88 L357 204 M474 88 L591 204" stroke="#bfd0e6" stroke-width="2" fill="none"/><path d="M44 204 Q166 235 288 204 M352 204 Q474 235 596 204" stroke="#173968" stroke-width="4" fill="#eaf0fa"/><text x="116" y="118" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">6</text><text x="214" y="118" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">8</text><text x="164" y="169" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">+</text><circle cx="97" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="116" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="135" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="97" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="116" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="135" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="195" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="214" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="233" cy="144" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="195" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="214" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="233" cy="163" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="204.5" cy="182" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="223.5" cy="182" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><text x="540" y="118" text-anchor="middle" font-size="20" font-weight="600" fill="#173968">10</text><circle cx="511.5" cy="138" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="530.5" cy="138" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="549.5" cy="138" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="568.5" cy="138" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="511.5" cy="157" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="530.5" cy="157" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="549.5" cy="157" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="568.5" cy="157" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="530.5" cy="176" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><circle cx="549.5" cy="176" r="7" fill="#2457d6" stroke="#173968" stroke-width="1"/><text x="477" y="169" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">+</text><rect x="380" y="130" width="76" height="66" rx="8" fill="#fff6d8" stroke="#9a6700" stroke-width="2"/><text x="418" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">Unknown</t