<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Compare the two gaps</title><desc id="desc">Two number lines with the same scale from 0 to 40. Their highlighted intervals run from 12 to 31 and from 17 to 36. Both intervals have length 19.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2457d6"/></marker></defs><symbol id="model" viewBox="0 0 640 300"><rect width="640" height="300" rx="16" fill="#f4f8ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="30" text-anchor="middle" font-size="23" font-weight="600" fill="#173968">Compare the two gaps</text><line x1="50" y1="122" x2="590" y2="122" stroke="#173968" stroke-width="2"/><line x1="50" y1="118" x2="50" y2="128" stroke="#173968"/><text x="50" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">0</text><line x1="117.5" y1="118" x2="117.5" y2="128" stroke="#173968"/><text x="117.5" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">5</text><line x1="185" y1="118" x2="185" y2="128" stroke="#173968"/><text x="185" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">10</text><line x1="252.5" y1="118" x2="252.5" y2="128" stroke="#173968"/><text x="252.5" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">15</text><line x1="320" y1="118" x2="320" y2="128" stroke="#173968"/><text x="320" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">20</text><line x1="387.5" y1="118" x2="387.5" y2="128" stroke="#173968"/><text x="387.5" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">25</text><line x1="455" y1="118" x2="455" y2="128" stroke="#173968"/><text x="455" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">30</text><line x1="522.5" y1="118" x2="522.5" y2="128" stroke="#173968"/><text x="522.5" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">35</text><line x1="590" y1="118" x2="590" y2="128" stroke="#173968"/><text x="590" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">40</text><line x1="212" y1="92" x2="468.5" y2="92" stroke="#13795b" stroke-width="6"/><path d="M212 85 V124 M468.5 85 V124" stroke="#13795b" stroke-width="2" fill="none"/><text x="212" y="78" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">12</text><text x="468.5" y="78" text-anchor="middle" font-size="19" font-weight="600" fill="#13795b">31</text><line x1="50" y1="230" x2="590" y2="230" stroke="#173968" stroke-width="2"/><line x1="50" y1="226" x2="50" y2="236" stroke="#173968"/><text x="50" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">0</text><line x1="117.5" y1="226" x2="117.5" y2="236" stroke="#173968"/><text x="117.5" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">5</text><line x1="185" y1="226" x2="185" y2="236" stroke="#173968"/><text x="185" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">10</text><line x1="252.5" y1="226" x2="252.5" y2="236" stroke="#173968"/><text x="252.5" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">15</text><line x1="320" y1="226" x2="320" y2="236" stroke="#173968"/><text x="320" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">20</text><line x1="387.5" y1="226" x2="387.5" y2="236" stroke="#173968"/><text x="387.5" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">25</text><line x1="455" y1="226" x2="455" y2="236" stroke="#173968"/><text x="455" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#173968">30</text><line x1="522.5" y1="226" x2="522.5" y2="236" stroke="#173968"/><text x="522.5" y="255" text-anchor="middle" font-size="13" font-weight="600" 