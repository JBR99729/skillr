<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A shoe combines a flexible fabric upper, soft lining and tough rubber sole."><title>A shoe combines a flexible fabric upper, soft lining and tough rubber sole.</title><g id="model"><rect width="640" height="300" fill="#f4f8ff"/><text x="320" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#173968">Different parts, different properties</text><path d="M60 180Q100 150 130 95L230 110L290 157L420 172Q492 180 500 218L60 218Z" fill="#dceaff" stroke="#2457d6" stroke-width="3"/><path d="M60 218H500V242H60Z" fill="#405a6c"/><path d="M138 105L224 119" stroke="#db8c4f" stroke-width="16"/><path d="M224 166L366 92" stroke="#173968" stroke-width="2"/><text x="365" y="74" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#173968">Fabric upper</text><text x="365" y="98" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#173968">flexible cover</text><path d="M142 103L72 65" stroke="#173968" stroke-width="2"/><text x="30" y="53" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173968">Soft lining</text><path d="M384 230L540 230" stroke="#173968" stroke-width="2"/><text x="515" y="208" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173968">Sole</text><text x="320" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173968">Rubber sole: grip and resistance to wear</text></g></svg>