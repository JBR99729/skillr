<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Read a thermometer scale</title><desc id="desc">Thermometer labelled 30 and 40 degrees Celsius with five equal spaces. Coloured column reaches the second small step above 30.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Read a thermometer scale</text><rect x="110" y="55" width="28" height="205" rx="14" fill="#fff" stroke="#173968" stroke-width="2"/><circle cx="124" cy="250" r="18" fill="#b22d3c"/><rect x="118" y="180" width="12" height="70" fill="#b22d3c"/><path d="M144 240h28" stroke="#173968" stroke-width="2"/><text x="183" y="246">30</text><path d="M144 210h28" stroke="#173968" stroke-width="2"/><path d="M144 180h28" stroke="#173968" stroke-width="2"/><path d="M144 150h28" stroke="#173968" stroke-width="2"/><path d="M144 120h28" stroke="#173968" stroke-width="2"/><path d="M144 90h28" stroke="#173968" stroke-width="2"/><text x="183" y="96">40</text><text x="235" y="83">Temperature (°C)</text><text x="280" y="139">Count equal spaces</text><text x="280" y="165">between numbered marks.</text><text x="280" y="205">Read the top of</text><text x="280" y="231">the coloured column.</text></g></svg>