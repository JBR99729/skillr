<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Account for the starting mark</title><desc id="desc">A leaf model begins at the one centimetre mark and ends at the seven centimetre mark on a ruler with equal one-centimetre intervals.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Account for the starting mark</text><rect x="66" y="165" width="500" height="75" fill="#ffe4a8" stroke="#173968" stroke-width="2"/><path d="M116 138H416" stroke="#13795b" stroke-width="15"/><text x="225" y="106">Leaf model</text><text x="470" y="110">Length (cm)</text><path d="M66 165v25" stroke="#173968" stroke-width="2"/><text x="61" y="216">0</text><path d="M116 165v25" stroke="#173968" stroke-width="2"/><text x="111" y="216">1</text><path d="M166 165v25" stroke="#173968" stroke-width="2"/><text x="161" y="216">2</text><path d="M216 165v25" stroke="#173968" stroke-width="2"/><text x="211" y="216">3</text><path d="M266 165v25" stroke="#173968" stroke-width="2"/><text x="261" y="216">4</text><path d="M316 165v25" stroke="#173968" stroke-width="2"/><text x="311" y="216">5</text><path d="M366 165v25" stroke="#173968" stroke-width="2"/><text x="361" y="216">6</text><path d="M416 165v25" stroke="#173968" stroke-width="2"/><text x="411" y="216">7</text><path d="M466 165v25" stroke="#173968" stroke-width="2"/><text x="461" y="216">8</text><path d="M516 165v25" stroke="#173968" stroke-width="2"/><text x="511" y="216">9</text><path d="M116 133V165M416 133V165" stroke="#13795b" stroke-dasharray="4 3"/><text x="66" y="277">The ruler drawing is a model; do not measure the screen.</text></g></svg>