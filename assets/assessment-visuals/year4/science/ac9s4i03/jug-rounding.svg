<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Round a scaled measurement</title><desc id="desc">Measuring container marked every ten millilitres, with labels zero, twenty, forty, sixty, eighty and one hundred. Water level is between sixty and seventy, closer to seventy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Round a scaled measurement</text><path d="M110 42V250H230V42" fill="#fff" stroke="#173968" stroke-width="3"/><path d="M112 116H228V248H112Z" fill="#92cfe8"/><path d="M205 250h25" stroke="#173968" stroke-width="2"/><text x="242" y="256">0</text><path d="M205 230h25" stroke="#173968" stroke-width="2"/><path d="M205 210h25" stroke="#173968" stroke-width="2"/><text x="242" y="216">20</text><path d="M205 190h25" stroke="#173968" stroke-width="2"/><path d="M205 170h25" stroke="#173968" stroke-width="2"/><text x="242" y="176">40</text><path d="M205 150h25" stroke="#173968" stroke-width="2"/><path d="M205 130h25" stroke="#173968" stroke-width="2"/><text x="242" y="136">60</text><path d="M205 110h25" stroke="#173968" stroke-width="2"/><path d="M205 90h25" stroke="#173968" stroke-width="2"/><text x="242" y="96">80</text><path d="M205 70h25" stroke="#173968" stroke-width="2"/><path d="M205 50h25" stroke="#173968" stroke-width="2"/><text x="242" y="56">100</text><text x="320" y="80">Volume (mL)</text><text x="320" y="127">The water is between</text><text x="320" y="153">two scale marks.</text><text x="320" y="197">Record to the nearest</text><text x="320" y="223">ten millilitres.</text></g></svg>