<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Equal containers: both start at 100 millilitres. Open ends at 76 millilitres; covered ends at 96 millilitres."><title>Equal containers: both start at 100 millilitres. Open ends at 76 millilitres; covered ends at 96 millilitres.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2457d6"/></marker></defs><g id="model"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="320" y="34" text-anchor="middle" font-size="22" font-weight="bold">Same place and time • no leaks</text><text x="170" y="75" text-anchor="middle" font-size="20">Open</text><text x="470" y="75" text-anchor="middle" font-size="20">Covered</text><path d="M80 100V240H260V100M380 100V240H560V100" fill="none" stroke="#173968" stroke-width="4"/><rect x="82" y="143" width="176" height="95" fill="#83c8ee"/><rect x="382" y="118" width="176" height="120" fill="#83c8ee"/><path d="M375 100H565" stroke="#53657d" stroke-width="12"/><text x="170" y="185" text-anchor="middle" font-size="22">76 mL left</text><text x="470" y="185" text-anchor="middle" font-size="22">96 mL left</text><text x="320" y="278" text-anchor="middle" font-size="20">Both started with 100 mL</text></g></g></svg>