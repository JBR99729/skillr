<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Water supply sequence: bore, treatment, storage tank, homes."><title>Water supply sequence: bore, treatment, storage tank, homes.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2457d6"/></marker></defs><g id="model"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="320" y="40" text-anchor="middle" font-size="23" font-weight="bold">One town’s water supply</text><rect x="15" y="110" width="130" height="82" rx="10" fill="white" stroke="#2457d6" stroke-width="2"/><text x="80" y="157" text-anchor="middle" font-size="20">Bore</text><rect x="175" y="110" width="130" height="82" rx="10" fill="white" stroke="#2457d6" stroke-width="2"/><text x="240" y="157" text-anchor="middle" font-size="20">Treatment</text><rect x="335" y="110" width="130" height="82" rx="10" fill="white" stroke="#2457d6" stroke-width="2"/><text x="400" y="157" text-anchor="middle" font-size="20">Tank</text><rect x="495" y="110" width="130" height="82" rx="10" fill="white" stroke="#2457d6" stroke-width="2"/><text x="560" y="157" text-anchor="middle" font-size="20">Homes</text><path d="M147 151H171" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><path d="M307 151H331" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><path d="M467 151H491" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="246" text-anchor="middle" font-size="20">Follow the arrows from source to use</text></g></g></svg>