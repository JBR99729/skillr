<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Explore changing producer numbers</title><desc id="desc">Two rounds of a classroom food-chain simulation. Each consumer needs three producer tokens. Round one has twelve producer tokens and four consumers: four can be fed. Round two has six producer tokens and four consumers: two can be fed. This is a simplified rule, not a prediction of exact real populations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Explore changing producer numbers</text><text x="35" y="70">Rule: each consumer needs three producer tokens.</text><rect x="32" y="93" width="272" height="150" fill="#fff" stroke="#173968"/><rect x="332" y="93" width="272" height="150" fill="#fff" stroke="#173968"/><text x="48" y="119" font-weight="bold">Round one</text><text x="348" y="119" font-weight="bold">Round two</text><text x="48" y="152">12 producer tokens</text><text x="348" y="152">6 producer tokens</text><text x="48" y="185">4 consumer counters</text><text x="348" y="185">4 consumer counters</text><text x="48" y="220">All 4 can receive 3.</text><text x="348" y="220">Only 2 can receive 3.</text><text x="32" y="276" font-size="16">A simplified classroom rule; real habitats have more relationships.</text></g></svg>