<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Locate water sources and a leak</title><desc id="desc">Fictional school map with north up. Library at upper left and garden at lower right. A blue water-source circle A is east of library; blue water-source circle C is west of garden. Red observed-leak square B is north of garden. Key labels blue circle Water source and red square Observed leak.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Locate water sources and a leak</text><rect x="60" y="70" width="360" height="175" fill="#e6f0dd" stroke="#173968" stroke-width="2"/><rect x="85" y="95" width="90" height="55" fill="#e2eafa" stroke="#173968"/><text x="130" y="127" text-anchor="middle" font-size="16">Library</text><rect x="270" y="170" width="115" height="50" fill="#fff0ca" stroke="#173968"/><text x="327" y="201" text-anchor="middle" font-size="16">Garden</text><circle cx="214" cy="115" r="11" fill="#2457d6"/><text x="214" y="98" text-anchor="middle">A</text><rect x="296" y="117" width="21" height="21" fill="#b22d3c"/><text x="306" y="101" text-anchor="middle">B</text><circle cx="200" cy="204" r="11" fill="#2457d6"/><text x="200" y="232" text-anchor="middle">C</text><path d="M458 105V62" stroke="#173968" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="48">N</text><circle cx="463" cy="156" r="9" fill="#2457d6"/><text x="482" y="162" font-size="16">Water source</text><rect x="454" y="188" width="18" height="18" fill="#b22d3c"/><text x="482" y="202" font-size="16">Observed leak</text><text x="60" y="278" font-size="16">Fictional school map · Symbols show observations, not scale.</text></g></svg>