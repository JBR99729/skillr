<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Show forces acting on an object</title><desc id="desc">A box slides right on a horizontal surface. An arrow starting on the box points right labelled Push on box. Another arrow starts on the box and points left labelled Friction on box. Only horizontal forces are shown; arrow lengths are not measured.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173968"/></marker></defs><g id="model" font-family="Arial, sans-serif" font-size="18" fill="#173968"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="30" font-size="21" font-weight="bold">Show forces acting on an object</text><path d="M55 235H590" stroke="#173968" stroke-width="3"/><rect x="268" y="140" width="115" height="90" rx="5" fill="#ffe4a8" stroke="#173968" stroke-width="3"/><text x="325" y="180" text-anchor="middle">Box</text><circle cx="325" cy="194" r="5" fill="#173968"/><path d="M325 194H500" stroke="#173968" stroke-width="5" marker-end="url(#arrow)"/><text x="415" y="157" font-size="17">Push on box</text><path d="M325 210H175" stroke="#173968" stroke-width="4" marker-end="url(#arrow)"/><text x="103" y="185" font-size="17">Friction on box</text><text x="55" y="77">Box sliding right on the surface</text><text x="55" y="272" font-size="16">Selected horizontal forces only; arrow lengths are not measured.</text></g></svg>