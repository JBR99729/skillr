<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Magnets: observe before predicting</title><desc id="desc">Classroom observations with the same two magnets: unlike poles moved together at 1 cm and 2 cm, with no visible movement at 6 cm; like poles moved apart at 1 cm and 2 cm, with no visible movement at 6 cm.</desc><g id="model"><rect width="640" height="300" rx="14" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="24" y="34" font-size="22" font-weight="bold">Magnets: observe before predicting</text><text x="28" y="66" font-size="16">Same magnets and surface; compare gaps within each row</text><rect x="24" y="82" width="592" height="152" rx="8" fill="#fff" stroke="#bacde3"/><g font-size="18"><text x="40" y="109" font-weight="bold">Facing poles</text><text x="276" y="109" font-weight="bold">1 cm</text><text x="392" y="109" font-weight="bold">2 cm</text><text x="503" y="109" font-weight="bold">6 cm</text><text x="40" y="149">Unlike (N facing S)</text><text x="267" y="149">Together</text><text x="383" y="149">Together</text><text x="497" y="144">No visible</text><text x="497" y="165">movement</text><text x="40" y="200">Like (N facing N)</text><text x="282" y="200">Apart</text><text x="397" y="200">Apart</text><text x="497" y="195">No visible</text><text x="497" y="216">movement</text></g><text x="28" y="253" font-size="15">Invented classroom observations; not a universal distance rule.</text><text x="24" y="282" font-size="13">AC9S4I01 · SkillrHub · Classroom model</text></g></g></svg>
