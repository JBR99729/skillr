<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Which material keeps water out?</title><desc id="desc">Equal-sized material samples under the same drip test: cotton 7 mL passed through, coated fabric 1 mL, tissue 10 mL. These are imaginary classroom results, not product ratings.</desc><g id="model"><rect width="640" height="300" rx="14" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="24" y="34" font-size="22" font-weight="bold">Which material keeps water out?</text><text x="26" y="65" font-size="16">Same sample area, water added and time in a drip test</text><g font-size="19"><text x="34" y="110">Cotton</text><rect x="216" y="87" width="238" height="30" fill="#4489cc"/><text x="468" y="109">7 mL</text><text x="34" y="159">Coated fabric</text><rect x="216" y="136" width="34" height="30" fill="#4489cc"/><text x="267" y="159">1 mL</text><text x="34" y="208">Tissue</text><rect x="216" y="185" width="340" height="30" fill="#4489cc"/><text x="569" y="208">10 mL</text></g><text x="27" y="244" font-size="16">Volume passing through: less means less leakage in this test.</text><text x="24" y="282" font-size="13">AC9S4I01 · SkillrHub · Classroom model</text></g></g></svg>
