<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Food chain: follow a change</title><desc id="desc">A simplified chain: grass is eaten by grasshoppers, which are eaten by frogs, which are eaten by snakes. Arrows run from food to eater.</desc><g id="model"><rect width="640" height="300" rx="14" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="24" y="34" font-size="22" font-weight="bold">Food chain: follow a change</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker></defs><g font-size="18" font-weight="bold" text-anchor="middle"><rect x="20" y="104" width="114" height="74" rx="9" fill="#dcf4df"/><text x="77" y="147">Grass</text><rect x="172" y="104" width="146" height="74" rx="9" fill="#e1ecff"/><text x="245" y="147">Grasshoppers</text><rect x="355" y="104" width="112" height="74" rx="9" fill="#e1ecff"/><text x="411" y="147">Frogs</text><rect x="507" y="104" width="112" height="74" rx="9" fill="#e1ecff"/><text x="563" y="147">Snakes</text></g><g stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"><path d="M137 141H166"/><path d="M321 141H349"/><path d="M470 141H501"/></g><text x="28" y="76" font-size="17">Arrows point from food to the organism that eats it.</text><text x="28" y="219" font-size="17">What might change if many grasshoppers disappear?</text><text x="28" y="246" font-size="15">A simplified model: real food webs have more connections.</text><text x="24" y="282" font-size="13">AC9S4I01 · SkillrHub · Classroom model</text></g></g></svg>
