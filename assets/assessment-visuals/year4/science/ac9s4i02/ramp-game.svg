<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Prototype: a paper-ball ramp game</title><desc id="desc">A paper ramp game: a rolled paper ball starts at a marked release line on a low card ramp and rolls towards a target on a level table. Gravity starts the roll; friction helps slow the ball. Release without pushing, keep the start and ball the same, and compare landing surfaces.</desc><g id="model"><rect width="640" height="300" rx="14" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="24" y="34" font-size="22" font-weight="bold">Prototype: a paper-ball ramp game</text><defs><marker id="motion" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2457d6"/></marker></defs><path d="M55 103L245 220H588" stroke="#62748c" stroke-width="8" fill="none"/><circle cx="91" cy="107" r="15" fill="#f4c868" stroke="#173968" stroke-width="2"/><path d="M79 120L96 132" stroke="#c63b3b" stroke-width="5"/><ellipse cx="503" cy="220" rx="52" ry="11" fill="none" stroke="#13795b" stroke-width="3"/><path d="M128 125L217 181" stroke="#2457d6" stroke-width="3" marker-end="url(#motion)"/><g font-size="17"><text x="24" y="69">Same ball; marked start; no push</text><text x="259" y="106">Gravity helps start the roll.</text><text x="259" y="137">Friction helps slow the ball.</text><text x="345" y="183">Compare landing surfaces</text><text x="58" y="183" font-size="15">Roll direction</text><text x="452" y="251">Fixed target</text></g><text x="24" y="282" font-size="13">AC9S4I02 · SkillrHub · Classroom model</text></g></g></svg>
