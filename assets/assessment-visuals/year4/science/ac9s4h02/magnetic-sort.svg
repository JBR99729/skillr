<svg xmlns="http://www.w3.org/2000/svg" id="model" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">A magnet separates suitable steel pieces; aluminium and plastic remain for other sorting.</title><rect width="640" height="300" fill="white"/><g font-family="Arial,sans-serif" fill="#173968" font-size="20"><text x="25" y="35">Magnetic sorting: one useful step</text><rect x="250" y="65" width="140" height="45" rx="8" fill="#cddfff"/><text x="281" y="95">magnet</text><path d="M320 165V125" stroke="#2457d6" stroke-width="5"/><path d="M310 130L320 115L330 130Z" fill="#2457d6"/><rect x="290" y="165" width="60" height="30" fill="#bcc4ce"/><text x="291" y="220">steel</text><rect x="65" y="170" width="75" height="30" fill="#e4e6e8"/><text x="43" y="230">aluminium</text><rect x="490" y="170" width="75" height="30" fill="#f9d49a"/><text x="494" y="230">plastic</text><text x="60" y="277">Not attracted strongly</text><text x="405" y="277">Not attracted</text></g></svg>