<svg xmlns="http://www.w3.org/2000/svg" id="model" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">Equal-sized compost samples contain 12 plastic pieces before a sorting change and 2 after.</title><rect width="640" height="300" fill="white"/><g font-family="Arial,sans-serif" fill="#173968" font-size="20"><text x="25" y="35">Plastic pieces in equal-sized samples</text><text x="25" y="95">Before</text><rect x="150" y="65" width="360" height="42" fill="#507bc0"/><text x="525" y="95">12</text><text x="25" y="175">After</text><rect x="150" y="145" width="60" height="42" fill="#13795b"/><text x="225" y="175">2</text><text x="25" y="245">Same sampling method; count of visible pieces</text></g></svg>