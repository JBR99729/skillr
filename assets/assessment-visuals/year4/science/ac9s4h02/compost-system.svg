<svg xmlns="http://www.w3.org/2000/svg" id="model" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">Suitable scraps and managed conditions support decomposers producing compost.</title><rect width="640" height="300" fill="white"/><g font-family="Arial,sans-serif" fill="#173968" font-size="20"><text x="25" y="35">How composting meets a waste need</text><rect x="25" y="70" width="170" height="130" rx="12" fill="#e4f3e8"/><text x="45" y="105">Suitable organic</text><text x="65" y="135">scraps</text><text x="42" y="177" font-size="16">Check accepted items</text><path d="M205 135H230" stroke="#173968" stroke-width="4"/><path d="M230 125L245 135L230 145Z"/><rect x="250" y="70" width="185" height="130" rx="12" fill="#e4edff"/><text x="275" y="107">Decomposers</text><text x="276" y="145" font-size="17">Suitable air, water</text><text x="275" y="172" font-size="17">and temperature</text><path d="M445 135H465" stroke="#173968" stroke-width="4"/><path d="M465 125L480 135L465 145Z"/><rect x="485" y="70" width="130" height="130" rx="12" fill="#f4e6d4"/><text x="505" y="140">Compost</text><text x="40" y="255" font-size="18">Industrial processes may provide different conditions from home heaps.</text></g></svg>