<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><g id="model"><title id="title">A feeding model to explain</title><desc id="desc">Grass is eaten by grasshopper; grasshopper is eaten by small bird; small bird is eaten by introduced cat. Arrows show food and energy to the eater.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#173968"/></marker></defs><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="34" font-family="Arial" font-size="22" font-weight="bold" fill="#173968">A feeding model to explain</text><rect x="20" y="90" width="120" height="90" rx="8" fill="#ffffff" stroke="#173968" stroke-width="2"/><text x="80" y="124" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#173968">Grass</text><text x="80" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#173968">producer</text><line x1="145" y1="135" x2="175" y2="135" stroke="#173968" stroke-width="3" marker-end="url(#arrow)"/><rect x="180" y="90" width="120" height="90" rx="8" fill="#ffffff" stroke="#173968" stroke-width="2"/><text x="240" y="124" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#173968">Grasshopper</text><text x="240" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#173968">consumer</text><line x1="305" y1="135" x2="335" y2="135" stroke="#173968" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="90" width="120" height="90" rx="8" fill="#ffffff" stroke="#173968" stroke-width="2"/><text x="400" y="124" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#173968">Small bird</text><text x="400" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#173968">consumer</text><line x1="465" y1="135" x2="495" y2="135" stroke="#173968" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="90" width="120" height="90" rx="8" fill="#ffffff" stroke="#173968" stroke-width="2"/><text x="560" y="124" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#173968">Cat</text><text x="560" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#173968">introduced</text><text x="24" y="224" font-family="Arial" font-size="17" fill="#173968">Arrow key: food and energy move from source to eater.</text><text x="24" y="258" font-family="Arial" font-size="16" fill="#173968">A simplified scenario: other feeding links are not shown.</text></g></svg>