<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><g id="model"><title id="title">Material evidence for a model tent</title><desc id="desc">Coated nylon; Yes; Yes; Cotton cloth; No; Yes; Thin card; Yes; No</desc><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="32" font-family="Arial" font-size="21" font-weight="bold" fill="#173968">Material evidence for a model tent</text><rect x="24.0" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="34.0" y="77" font-family="Arial" font-size="17" fill="#ffffff">Test sample</text><rect x="221.33333333333334" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="231.33333333333334" y="77" font-family="Arial" font-size="17" fill="#ffffff">Dry after spray?</text><rect x="418.6666666666667" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="428.6666666666667" y="77" font-family="Arial" font-size="17" fill="#ffffff">Folds to shape?</text><rect x="24.0" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="120" font-family="Arial" font-size="17" fill="#173968">Coated nylon</text><rect x="221.33333333333334" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="120" font-family="Arial" font-size="17" fill="#173968">Yes</text><rect x="418.6666666666667" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="120" font-family="Arial" font-size="17" fill="#173968">Yes</text><rect x="24.0" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="163" font-family="Arial" font-size="17" fill="#173968">Cotton cloth</text><rect x="221.33333333333334" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="163" font-family="Arial" font-size="17" fill="#173968">No</text><rect x="418.6666666666667" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="163" font-family="Arial" font-size="17" fill="#173968">Yes</text><rect x="24.0" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="206" font-family="Arial" font-size="17" fill="#173968">Thin card</text><rect x="221.33333333333334" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="206" font-family="Arial" font-size="17" fill="#173968">Yes</text><rect x="418.6666666666667" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="206" font-family="Arial" font-size="17" fill="#173968">No</text><text x="24" y="253" font-family="Arial" font-size="16" fill="#173968">Needs: dry inside AND folds to the required shape.</text><text x="24" y="276" font-family="Arial" font-size="16" fill="#173968">Same sample size; one short spray and folding test.</text></g></svg>