<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><g id="model"><title id="title">A reminder trial: tap running time</title><desc id="desc">Before reminder; 16 minutes; One lunch break; After reminder; 11 minutes; One lunch break</desc><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="32" font-family="Arial" font-size="21" font-weight="bold" fill="#173968">A reminder trial: tap running time</text><rect x="24.0" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="34.0" y="77" font-family="Arial" font-size="17" fill="#ffffff">Observation</text><rect x="221.33333333333334" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="231.33333333333334" y="77" font-family="Arial" font-size="17" fill="#ffffff">Running time</text><rect x="418.6666666666667" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="428.6666666666667" y="77" font-family="Arial" font-size="17" fill="#ffffff">Period</text><rect x="24.0" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="120" font-family="Arial" font-size="17" fill="#173968">Before reminder</text><rect x="221.33333333333334" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="120" font-family="Arial" font-size="17" fill="#173968">16 minutes</text><rect x="418.6666666666667" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="120" font-family="Arial" font-size="17" fill="#173968">One lunch break</text><rect x="24.0" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="163" font-family="Arial" font-size="17" fill="#173968">After reminder</text><rect x="221.33333333333334" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="163" font-family="Arial" font-size="17" fill="#173968">11 minutes</text><rect x="418.6666666666667" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="163" font-family="Arial" font-size="17" fill="#173968">One lunch break</text><text x="24" y="253" font-family="Arial" font-size="16" fill="#173968">Same number of users; matching observation periods.</text><text x="24" y="276" font-family="Arial" font-size="16" fill="#173968">Time is measured in minutes, not litres.</text></g></svg>