fill="#173968">24 events</text><rect x="418.6666666666667" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="163" font-family="Arial" font-size="17" fill="#173968">2 events</text><text x="24" y="253" font-family="Arial" font-size="16" fill="#173968">Counts are events, not litres. Numbers of people differ.</text><text x="24" y="276" font-family="Arial" font-size="16" fill="#173968">Compare categories, then ask about the context.</text></g></svg>