<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><g id="model"><title id="title">Model roofs: two requirements</title><desc id="desc">Plain paper; Wet; No; Coated card; Dry; Yes; Mesh; Wet; Yes</desc><rect width="640" height="300" rx="12" fill="#f4f8ff"/><text x="24" y="32" font-family="Arial" font-size="21" font-weight="bold" fill="#173968">Model roofs: two requirements</text><rect x="24.0" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="34.0" y="77" font-family="Arial" font-size="17" fill="#ffffff">Roof</text><rect x="221.33333333333334" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="231.33333333333334" y="77" font-family="Arial" font-size="17" fill="#ffffff">Inside after spray</text><rect x="418.6666666666667" y="50" width="197.33333333333334" height="43" fill="#173968" stroke="#a6b7cc"/><text x="428.6666666666667" y="77" font-family="Arial" font-size="17" fill="#ffffff">Holds 4 blocks?</text><rect x="24.0" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="120" font-family="Arial" font-size="17" fill="#173968">Plain paper</text><rect x="221.33333333333334" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="120" font-family="Arial" font-size="17" fill="#173968">Wet</text><rect x="418.6666666666667" y="93" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="120" font-family="Arial" font-size="17" fill="#173968">No</text><rect x="24.0" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="163" font-family="Arial" font-size="17" fill="#173968">Coated card</text><rect x="221.33333333333334" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="163" font-family="Arial" font-size="17" fill="#173968">Dry</text><rect x="418.6666666666667" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="163" font-family="Arial" font-size="17" fill="#173968">Yes</text><rect x="24.0" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="206" font-family="Arial" font-size="17" fill="#173968">Mesh</text><rect x="221.33333333333334" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="206" font-family="Arial" font-size="17" fill="#173968">Wet</text><rect x="418.6666666666667" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="206" font-family="Arial" font-size="17" fill="#173968">Yes</text><text x="24" y="253" font-family="Arial" font-size="16" fill="#173968">Purpose: keep the inside dry AND hold four blocks.</text><text x="24" y="276" font-family="Arial" font-size="16" fill="#173968">Same roof size, spray amount and loading method.</text></g></svg>