33333333334" y="163" font-family="Arial" font-size="17" fill="#173968">88, 90, 89</text><rect x="418.6666666666667" y="136" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="163" font-family="Arial" font-size="17" fill="#173968">Same marked point</text><rect x="24.0" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="34.0" y="206" font-family="Arial" font-size="17" fill="#173968">C</text><rect x="221.33333333333334" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="231.33333333333334" y="206" font-family="Arial" font-size="17" fill="#173968">121, 119, 120</text><rect x="418.6666666666667" y="179" width="197.33333333333334" height="43" fill="#ffffff" stroke="#a6b7cc"/><text x="428.6666666666667" y="206" font-family="Arial" font-size="17" fill="#173968">Higher release point</text><text x="24" y="253" font-family="Arial" font-size="16" fill="#173968">Same block and surface; each group made three trials.</text><text x="24" y="276" font-family="Arial" font-size="16" fill="#173968">Check method differences before explaining the numbers.</text></g></svg>