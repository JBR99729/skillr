<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Model data over equal time: surface A starts at 35 and ends at 40 degrees Celsius; surface B starts at 20 and ends at 30 degrees Celsius."><title>Model data over equal time: surface A starts at 35 and ends at 40 degrees Celsius; surface B starts at 20 and ends at 30 degrees Celsius.</title><g id="model"><rect width="640" height="300" rx="12" fill="#f4f8ff"/><g font-family="Arial,sans-serif" fill="#173968"><text x="320" y="35" text-anchor="middle" font-size="22" font-weight="bold">Model data • equal time interval</text><rect x="45" y="70" width="550" height="170" fill="white" stroke="#8ca8cb"/><path d="M45 120H595M45 180H595M225 70V240M405 70V240" stroke="#8ca8cb" stroke-width="2"/><text x="135" y="104" text-anchor="middle" font-size="22">Surface</text><text x="315" y="104" text-anchor="middle" font-size="22">Start</text><text x="500" y="104" text-anchor="middle" font-size="22">End</text><text x="135" y="159" text-anchor="middle" font-size="22">A</text><text x="315" y="159" text-anchor="middle" font-size="22">35°C</text><text x="500" y="159" text-anchor="middle" font-size="22">40°C</text><text x="135" y="219" text-anchor="middle" font-size="22">B</text><text x="315" y="219" text-anchor="middle" font-size="22">20°C</text><text x="500" y="219" text-anchor="middle" font-size="22">30°C</text><text x="320" y="276" text-anchor="middle" font-size="20">Compare the change, not only the final value</text></g></g></svg>