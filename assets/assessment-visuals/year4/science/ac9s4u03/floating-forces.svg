<svg xmlns="http://www.w3.org/2000/svg" id="model" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">A floating cork with equal upward water push and downward gravitational pull.</title><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="22" fill="#173968"><rect x="35" y="165" width="530" height="115" fill="#d5ecff"/><path d="M35 165H565" stroke="#2478ad" stroke-width="3"/><rect x="240" y="140" width="120" height="50" rx="15" fill="#d5ab72" stroke="#755630"/><text x="274" y="172" font-size="18">cork</text><path d="M280 140V65" stroke="#13795b" stroke-width="7"/><path d="M269 65L280 45L291 65Z" fill="#13795b"/><text x="310" y="70">water pushes up</text><path d="M320 190V265" stroke="#bc4436" stroke-width="7"/><path d="M309 265L320 285L331 265Z" fill="#bc4436"/><text x="55" y="250">gravity pulls down</text></g></svg>