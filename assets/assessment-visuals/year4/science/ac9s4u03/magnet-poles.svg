<svg xmlns="http://www.w3.org/2000/svg" id="model" viewBox="0 0 640 300" role="img" aria-labelledby="title"><title id="title">Unlike facing poles attract; like facing poles repel, with a gap between the magnets.</title><rect width="640" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="22" fill="#173968"><text x="25" y="35">Unlike poles: attract</text><rect x="70" y="65" width="120" height="45" fill="#f4c9c4"/><text x="112" y="96">N</text><rect x="410" y="65" width="120" height="45" fill="#c8def4"/><text x="455" y="96">S</text><path d="M215 88H265M385 88H335" stroke="#173968" stroke-width="5"/><path d="M265 78L282 88L265 98ZM335 78L318 88L335 98Z"/><text x="25" y="175">Like poles: repel</text><rect x="170" y="205" width="100" height="45" fill="#f4c9c4"/><text x="207" y="236">N</text><rect x="330" y="205" width="100" height="45" fill="#f4c9c4"/><text x="367" y="236">N</text><path d="M145 228H95M455 228H505" stroke="#173968" stroke-width="5"/><path d="M95 218L78 228L95 238ZM505 218L522 228L505 238Z"/></g></svg>