<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <style>.bg{fill:#f4f8ff;stroke:#2457d6;stroke-width:4}.shape{fill:#dfeaff;stroke:#173a86;stroke-width:4}.accent{fill:#ffe59a;stroke:#c47800;stroke-width:3}.line{fill:none;stroke:#173a86;stroke-width:4}.text{font:700 22px system-ui,sans-serif;fill:#173a86;text-anchor:middle}</style>
  <symbol id="square" viewBox="0 0 640 300"><rect class="bg" x="8" y="8" width="624" height="284" rx="24"/><rect class="shape" x="210" y="45" width="220" height="220"/><path class="line" d="M210 100h220M210 155h220M210 210h220M265 45v220M320 45v220M375 45v220"/><text class="text" x="320" y="35">side × side = area</text></symbol>
  <symbol id="numberline" viewBox="0 0 640 300"><rect class="bg" x="8" y="8" width="624" height="284" rx="24"/><path class="line" d="M70 155h500M120 125v60M320 115v80M520 125v60"/><circle class="accent" cx="390" cy="155" r="17"/><text class="text" x="320" y="70">neighbouring perfect squares</text><text class="text" x="120" y="225">n²</text><text class="text" x="520" y="225">(n + 1)²</text></symbol>
  <symbol id="pattern" viewBox="0 0 640 300"><rect class="bg" x="8" y="8" width="624" height="284" rx="24"/><g class="shape"><rect x="65" y="155" width="70" height="70"/><rect x="205" y="125" width="100" height="100"/><rect x="375" y="95" width="130" height="130"/></g><path class="line" d="M145 190h45M315 175h45"/><text class="text" x="285" y="55">growing square arrays</text></symbol>
  <symbol id="split" viewBox="0 0 640 300"><rect class="bg" x="8" y="8" width="624" height="284" rx="24"/><rect class="shape" x="190" y="35" width="260" height="230"/><path class="line" d="M390 35v230M190 210h260"/><rect class="accent" x="390" y="210" width="60" height="55"/><text class="text" x="320" y="290">a² + 2ab + b²</text></symbol>
</svg>
