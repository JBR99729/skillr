<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" role="img" aria-label="Each circle represents one animal. Ducks: 4 circles. Magpies: 2 circles."><defs><symbol id="model" viewBox="0 0 640 300"><text x="30" y="35" font-family="Arial,sans-serif" font-size="27" fill="#17324d">Key: each circle = one animal</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="29" fill="#17324d">Ducks</text><circle cx="255" cy="110" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/><circle cx="320" cy="110" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/><circle cx="385" cy="110" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/><circle cx="450" cy="110" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/><text x="30" y="218" font-family="Arial,sans-serif" font-size="29" fill="#17324d">Magpies</text><circle cx="255" cy="210" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/><circle cx="320" cy="210" r="20" fill="#397aa3" stroke="#17324d" stroke-width="2"/></symbol></defs><use href="#model" xlink:href="#model" width="640" height="300"/></svg>
