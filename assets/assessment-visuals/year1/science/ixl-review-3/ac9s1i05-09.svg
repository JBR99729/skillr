<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" role="img" aria-label="Prediction: Towel A will hold more water.. Result: Towel B held more water.."><defs><symbol id="model" viewBox="0 0 640 300"><rect x="12" y="12" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="41" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Prediction</text><text x="28" y="70" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Towel A will hold more water.</text><rect x="12" y="108" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="137" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Result</text><text x="28" y="166" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Towel B held more water.</text></symbol></defs><use href="#model" xlink:href="#model" width="640" height="300"/></svg>
