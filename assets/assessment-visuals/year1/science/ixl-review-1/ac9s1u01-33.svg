<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" role="img" aria-label="The butterfly needs flowers for food and leaves for shelter. Garden A has both. Garden B has flowers only. Garden C has leaves only."><defs><symbol id="model" viewBox="0 0 640 300"><rect x="12" y="12" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="41" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Butterfly needs</text><text x="28" y="70" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Flowers for food; leaves for</text><text x="28" y="98" font-family="Arial,sans-serif" font-size="28" fill="#17324d">shelter</text><rect x="12" y="108" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="137" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Garden A</text><text x="28" y="166" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Flowers and leaves</text><rect x="12" y="204" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="233" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Gardens B / C</text><text x="28" y="262" font-family="Arial,sans-serif" font-size="28" fill="#17324d">B: flowers only. C: leaves only.</text></symbol></defs><use href="#model" xlink:href="#model" width="640" height="300"/></svg>
