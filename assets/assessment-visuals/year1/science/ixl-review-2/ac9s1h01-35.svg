<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" role="img" aria-label="After sunny days: Lights stayed on longer. After cloudy days: Lights stayed on for less time."><defs><symbol id="model" viewBox="0 0 640 300"><rect x="12" y="12" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="41" font-family="Arial,sans-serif" font-size="28" fill="#17324d">After sunny days</text><text x="28" y="70" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Lights stayed on longer</text><rect x="12" y="108" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="137" font-family="Arial,sans-serif" font-size="28" fill="#17324d">After cloudy days</text><text x="28" y="166" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Lights stayed on for less time</text></symbol></defs><use href="#model" xlink:href="#model" width="640" height="300"/></svg>
