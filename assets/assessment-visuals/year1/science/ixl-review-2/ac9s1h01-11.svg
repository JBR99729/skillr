<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" role="img" aria-label="Warm, breezy days: Washing dried quickly: 3 days. Cool, still days: Washing dried slowly: 3 days."><defs><symbol id="model" viewBox="0 0 640 300"><rect x="12" y="12" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="41" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Warm, breezy days</text><text x="28" y="70" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Washing dried quickly: 3 days</text><rect x="12" y="108" width="616" height="92" rx="12" fill="#eef6fa" stroke="#7895aa"/><text x="28" y="137" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Cool, still days</text><text x="28" y="166" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Washing dried slowly: 3 days</text></symbol></defs><use href="#model" xlink:href="#model" width="640" height="300"/></svg>
