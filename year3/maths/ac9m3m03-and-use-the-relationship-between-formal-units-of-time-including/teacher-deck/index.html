<script>
const S=[
['title','Understanding Time: Days, Hours, Minutes & Seconds','Recognising, estimating, comparing and measuring durations',['AC9M3M03','24 hours','60 minutes','60 seconds'],'clock'],
['image','Acknowledgement of Country','We acknowledge the Traditional Custodians of the land on which we learn, and pay our respects to Elders past and present.',['We recognise their continuing connection to Country, and the knowledge of seasons, skies and cycles that has guided time-keeping here for thousands of years.','Teacher prompt: Insert the name of the Country your school is on, and the local seasonal calendar you will refer to in Lesson 3.'],'🌅'],
['map','Lesson Map: Three Lessons','This deck runs across three 60-minute lessons.',['Lesson 1 - Units of time - Slides 5-11 - 60 min','Lesson 2 - Timers & measuring - Slides 12-18 - 60 min','Lesson 3 - Cycles in nature - Slides 19-26 - 60 min','Each lesson: 10 min warm-up - 20 min teaching - 25 min activity - 5 min exit ticket.'],'clock'],
['goals','Learning Goals','Students will learn to:',['Recognise formal units of time','Estimate how long events take','Compare durations','Plan a sequence of events','Read and set digital timers','Measure short durations','Explore First Nations Australian time cycles'],'clock'],
['lesson','LESSON 1','Units of Time',['60 minutes','Warm-up (10 min): what can you do in one minute?','Teaching (20 min): formal units and key relationships','Activity (25 min): Estimate & Check with the recording sheet','Wrap-up (5 min): share estimates that were closest'],'clock'],
['cards','What Are Formal Units of Time?','Time units help us measure how long things take.',['Days - long events','Hours - medium events','Minutes - short events','Seconds - very short events','Key relationships: 1 day = 24 hours; 1 hour = 60 minutes; 1 minute = 60 seconds'],'clock'],
['cards','Why Do We Need Different Units?','We do not measure everything the same way.',['A movie → hours','A game → minutes','A blink → seconds','A school week → days','Teacher prompt: Which unit makes sense for this event?'],'clock'],
['cards','Examples of Time Units','Match the event to the correct unit:',['Brushing teeth → minutes','Jumping once → seconds','Sleeping overnight → hours','Weekend → days'],'clock'],
['cards','Estimating Duration (AC9M3M03_E1)','Students estimate how long tasks take.',['Reading a short passage - 2 min','Sharpening a pencil - 10 sec','Walking to the library - 3 min','Saying the alphabet - 20 sec','Teacher prompt: How long do you think this will take? Why?'],'clock'],
['activity','Activity: Estimate & Check','Students guess first, then measure with timers.',['25 minutes','Tasks: Clap 20 times; Write your name; Tie your shoelace; Read 3 sentences','Check using: Digital timer, Stopwatch, Sand timer','Support: give a 10-second and a 1-minute benchmark to compare against first.','Extend: time a partner, then predict a task you have never timed before.'],'⏳'],
['sheet','Student Sheet: Estimate & Check','Print one per student. Estimate first, then time it.',['Name: ______________________   Date: ______________','Which estimate was closest? ______________________________','Table: Task | My estimate | Actual time | Difference','Rows: Clap 20 times; Write your name; Tie your shoelace; Read 3 sentences; My own task: ______'],'clock'],
['cards','Planning Events (AC9M3M03_E2)','Example: our class party plan',['Musical chairs - 10 minutes','Balloon relay - 8 minutes','Snack break - 12 minutes','Dance time - 15 minutes','Time available: 45:00','Our plan adds up to 45 minutes.','Teacher prompt: Does our plan fit into the time we have?'],'clock'],
['activity','Activity: Build a Schedule','25 minutes',['Students create a schedule for a class party, a sports afternoon, a reading session or a science experiment.','They estimate each activity, add up the minutes, and check whether the total fits the time available.','Support: give three activities with times already filled in - just add them up.','Extend: cut the time available to 30 minutes and re-plan to fit.'],'clock'],
['lesson','LESSON 2','Timers & Measuring',['60 minutes','Warm-up (10 min): read these digital times aloud','Teaching (20 min): reading and setting digital timers','Activity (25 min): One-Minute Challenge','Wrap-up (5 min): compare durations - which took longer?'],'clock'],
['digital','Reading Digital Time (AC9M3M03_E3)','Digital devices show time using numbers.',['3:00 = 3 minutes','0:45 = 45 seconds','1:30 = 1 minute 30 seconds','10:00 = 10 minutes','Teacher prompt: What does 2:15 mean?'],'⏲️'],
['digital','Setting Digital Timers','Students practise setting:',['A countdown timer','A stopwatch','A microwave timer','A tablet or phone timer','Try setting: 3 minutes = 3:00; 45 seconds = 0:45; 1 min 10 sec = 1:10'],'⏲️'],
['activity','Measuring Short Durations (AC9M3M03_E4)','Students use timers to measure short intervals.',['Tools: Sand timers, Stopwatches, Digital timers','Measure: 1:00 one minute; 3:00 three minutes; 5:00 five minutes','Teacher prompt: How close was your estimate?'],'⏱️'],
['activity','Activity: One-Minute Challenge','Can you do each of these for exactly one minute?',['25 minutes','Jump for 1 minute - 1:00','Draw for 1 minute - 1:00','Sit silently for 1 minute - 1:00','Count to 60 in 1 minute - 1:00','Support: count aloud with a partner keeping time on a sand timer.','Extend: estimate 30 seconds and 90 seconds with no timer showing.'],'clock'],
['compare','Comparing Durations','Which event takes longer?',['Reading a page vs Reading a chapter → the chapter','Walking to the gate vs Running to the gate → walking','Singing a whole song vs Singing one chorus → the whole song','Writing a sentence vs Writing a paragraph → the paragraph','Answers: a longer text, a longer distance and more writing all take more time. Accept any answer backed by a reason.'],'clock'],
['lesson','LESSON 3','Cycles in Nature',['60 minutes','Warm-up (10 min): what changes in nature tell us time has passed?','Teaching (20 min): First Nations time cycles and your local seasonal calendar','Activity (25 min): start the nature time journal','Wrap-up (5 min): exit ticket'],'clock'],
['cards','First Nations Time Cycles (AC9M3M03_E5)','First Nations Australians understand time through nature.',['Cycles include: movement of the sun; phases of the moon; patterns of the stars; seasonal changes; cultural stories and traditions.','Examples: moon phases guide fishing; star positions signal seasonal changes; sun movement guides daily activities.','Teacher prompt: How does nature help us tell time?'],'🌙'],
['cards','Seasonal Calendars on Our Country','Before teaching, replace the example below with your local calendar.',['Find the Traditional Custodians of your school\'s Country.','Look up their seasonal calendar (the Bureau of Meteorology Indigenous Weather Knowledge site publishes several).','Invite a local Elder or Aboriginal Education Officer to share it - always seek permission first.','Compare it with the four-season calendar the class already knows.','Teacher prompt: Which seasons do people on this Country name, and what tells us each one has begun?'],'🌙'],
['cards','Story Example: A Cultural Connection','The Yolŋu People of the Northern Territory',['Moon phases → to know when certain foods are available','Star patterns → to know when the seasons change','Sun movement → to guide daily routines','Time is not only clocks - it is also the cycles we can see in nature.'],'🌌'],
['activity','Activity: Nature Time','Students explore and record over one week:',['25 minutes','Sunrise and sunset times','Moon phases','Seasonal changes','Weather patterns','Keep a nature time journal - one observation each day, then talk about the patterns you notice.'],'🌿'],
['sheet','Student Sheet: Nature Time Journal','Print one per student. One observation each day for a week.',['Name: ______________________   Week beginning: ______________','A pattern I noticed: ____________________________________________','Table: Day | Sunrise | Sunset | Moon shape | What I noticed outside','Rows: Monday, Tuesday, Wednesday, Thursday, Friday'],'clock'],
['goals','Putting It All Together','Students should now be able to:',['Recognise time units','Estimate durations','Compare durations','Plan events','Use timers','Understand cultural time cycles'],'clock'],
['exit','Exit Ticket','Students answer:',['Which unit measures very short events?','How many minutes are in an hour?','Estimate how long it takes to read one page.','Name one way First Nations Australians understand time.','Time to answer: 5:00','Five minutes, then hand it in.'],'clock'],
['answers','Exit Ticket: Answer Key','Model responses - accept any answer that shows the same thinking.',['Which unit measures very short events? Seconds. Accept: seconds - like one blink or one jump.','How many minutes are in an hour? 60 minutes. Look for confident recall, not counting up.','Estimate how long it takes to read one page. About 1-3 minutes. Any estimate in minutes with a reason is correct - the unit matters more than the number.','Name one way First Nations Australians understand time. Moon phases, star positions, the sun\'s movement, or seasonal change on Country.'],'clock'],
['end','Great work today!','You now understand how time units help us measure and plan our day.',['skillrhub.com','AC9M3M03'],'clock']
];
