<figure class="fixed-slide-viewer__slide" data-slide><svg viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="65" y="95" class="t">How Long Does It Take?</text><text x="65" y="145" class="p">Days • hours • minutes • seconds</text><circle cx="600" cy="340" r="145" fill="#eaf5ff" stroke="#277da1" stroke-width="6"/><text x="505" y="330" style="font:700 64px Arial;fill:#14213d">1:00</text><text x="470" y="390" class="s">Estimate → time → compare</text><rect x="190" y="535" width="820" height="62" rx="20" class="yellow"/><text x="270" y="575" class="p">Today we become duration detectives!</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="90" class="t">Today I can…</text><rect x="70" y="145" width="500" height="150" rx="24" class="blue"/><text x="105" y="205" class="s">Choose a time unit</text><text x="105" y="250" class="p">seconds, minutes, hours or days</text><rect x="630" y="145" width="500" height="150" rx="24" class="green"/><text x="665" y="205" class="s">Estimate & compare</text><text x="665" y="250" class="p">which events are shorter or longer</text><rect x="70" y="335" width="500" height="150" rx="24" class="yellow"/><text x="105" y="395" class="s">Use a timer</text><text x="105" y="440" class="p">read and set minutes and seconds</text><rect x="630" y="335" width="500" height="150" rx="24" class="pink"/><text x="665" y="395" class="s">Plan activities</text><text x="665" y="440" class="p">so they fit the time available</text><text x="335" y="555" class="s">I can explain why my estimate makes sense.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Pick the unit that fits</text><rect x="70" y="145" width="245" height="330" rx="24" class="pink"/><text x="120" y="205" class="s">SECONDS</text><text x="125" y="285" style="font:700 70px Arial">⚡</text><text x="105" y="390" class="p">blink</text><text x="105" y="430" class="p">short sprint</text><rect x="340" y="145" width="245" height="330" rx="24" class="blue"/><text x="385" y="205" class="s">MINUTES</text><text x="405" y="285" style="font:700 70px Arial">⏱</text><text x="375" y="390" class="p">brush teeth</text><text x="375" y="430" class="p">short game</text><rect x="610" y="145" width="245" height="330" rx="24" class="green"/><text x="660" y="205" class="s">HOURS</text><text x="675" y="285" style="font:700 70px Arial">🕒</text><text x="645" y="390" class="p">movie</text><text x="645" y="430" class="p">school day</text><rect x="880" y="145" width="245" height="330" rx="24" class="yellow"/><text x="935" y="205" class="s">DAYS</text><text x="945" y="285" style="font:700 70px Arial">📅</text><text x="915" y="390" class="p">camp</text><text x="915" y="430" class="p">holiday</text><text x="285" y="545" class="s">Ask: which unit tells the duration most clearly?</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Time units are connected</text><rect x="100" y="165" width="1000" height="330" rx="26" class="blue"/><text x="160" y="245" class="s">60 seconds</text><text x="410" y="245" class="t">=</text><text x="520" y="245" class="s">1 minute</text><text x="160" y="335" class="s">60 minutes</text><text x="410" y="335" class="t">=</text><text x="520" y="335" class="s">1 hour</text><text x="160" y="425" class="s">24 hours</text><text x="410" y="425" class="t">=</text><text x="520" y="425" class="s">1 day</text><rect x="760" y="220" width="270" height="200" rx="22" class="yellow"/><text x="800" y="285" class="s">Not base 100!</text><text x="800" y="340" class="p">1 hour is</text><text x="800" y="385" class="s">60 minutes</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Estimate first!</text><text x="65" y="135" class="p">An estimate is a sensible guess based on what you already know.</text><rect x="80" y="185" width="320" height="300" rx="24" class="pink"/><text x="125" y="245" class="s">Sharpen a pencil</text><text x="175" y="335" style="font:700 68px Arial">✏️</text><text x="145" y="430" class="p">about 10 seconds?</text><rect x="440" y="185" width="320" height="300" rx="24" class="blue"/><text x="500" y="245" class="s">Read a passage</text><text x="545" y="335" style="font:700 68px Arial">📖</text><text x="505" y="430" class="p">about 2 minutes?</text><rect x="800" y="185" width="320" height="300" rx="24" class="green"/><text x="865" y="245" class="s">Walk to library</text><text x="900" y="335" style="font:700 68px Arial">🚶</text><text x="865" y="430" class="p">about 3 minutes?</text><text x="310" y="555" class="s">Tell a partner: Why is your estimate reasonable?</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Estimate → measure → compare</text><rect x="80" y="170" width="300" height="300" rx="24" class="yellow"/><text x="145" y="230" class="s">1. ESTIMATE</text><text x="165" y="325" style="font:700 70px Arial">🤔</text><text x="125" y="420" class="p">“I think 40 seconds.”</text><text x="400" y="325" class="t">→</text><rect x="450" y="170" width="300" height="300" rx="24" class="blue"/><text x="525" y="230" class="s">2. MEASURE</text><text x="545" y="325" style="font:700 70px Arial">⏱</text><text x="510" y="420" class="p">Timer says 52 seconds.</text><text x="770" y="325" class="t">→</text><rect x="820" y="170" width="300" height="300" rx="24" class="green"/><text x="885" y="230" class="s">3. COMPARE</text><text x="910" y="325" style="font:700 70px Arial">↔</text><text x="865" y="405" class="p">My estimate was</text><text x="900" y="440" class="p">12 s too short.</text><text x="300" y="555" class="s">A good estimate does not have to be exact.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Which takes longer?</text><rect x="120" y="170" width="400" height="320" rx="24" class="blue"/><text x="205" y="235" class="s">Read one page</text><text x="250" y="340" style="font:700 78px Arial">📄</text><text x="220" y="435" class="p">about 2 minutes</text><rect x="680" y="170" width="400" height="320" rx="24" class="green"/><text x="760" y="235" class="s">Read a chapter</text><text x="815" y="340" style="font:700 78px Arial">📚</text><text x="770" y="435" class="p">about 20 minutes</text><text x="310" y="555" class="s">Compare the event, the number and the unit.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Can our party plan fit?</text><text x="65" y="135" class="p">We have 45 minutes.</text><rect x="90" y="180" width="230" height="220" rx="22" class="pink"/><text x="125" y="235" class="s">Game</text><text x="145" y="310" class="t">10</text><text x="135" y="355" class="p">minutes</text><rect x="350" y="180" width="230" height="220" rx="22" class="blue"/><text x="390" y="235" class="s">Relay</text><text x="410" y="310" class="t">8</text><text x="395" y="355" class="p">minutes</text><rect x="610" y="180" width="230" height="220" rx="22" class="yellow"/><text x="650" y="235" class="s">Snack</text><text x="665" y="310" class="t">12</text><text x="655" y="355" class="p">minutes</text><rect x="870" y="180" width="230" height="220" rx="22" class="green"/><text x="910" y="235" class="s">Dance</text><text x="925" y="310" class="t">15</text><text x="915" y="355" class="p">minutes</text><text x="335" y="480" class="s">10 + 8 + 12 + 15 = 45 minutes</text><text x="395" y="540" class="s">Yes — it fits exactly!</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M03</text></svg></figure>
