<figure class="fixed-slide-viewer__slide" data-slide><svg viewBox="0 0 1200 675"><text x="70" y="100" class="t">Telling Time to the Nearest Minute</text><text x="70" y="150" class="p">Analogue and digital clocks • Year 3 • AC9M3M04</text><circle cx="600" cy="355" r="175" class="c"/><line x1="600" y1="355" x2="600" y2="245" class="hh"/><line x1="600" y1="355" x2="725" y2="305" class="mh"/><circle cx="600" cy="355" r="8" fill="#15233b"/><text x="410" y="590" class="p">Hours tell us where we are in the hour.</text><text x="380" y="625" class="p">Minutes tell us how far through the hour we have travelled.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">1</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="95" class="t">Learning goals</text><rect x="70" y="135" width="1060" height="430" rx="18" class="box"/><text x="105" y="195" class="s">Students will learn to:</text><text x="120" y="255" class="p">• read analogue clocks to the nearest minute</text><text x="120" y="305" class="p">• read and write digital time correctly</text><text x="120" y="355" class="p">• connect analogue, digital and spoken time</text><text x="120" y="405" class="p">• use quarter past, half past, quarter to, minutes past and minutes to</text><text x="120" y="455" class="p">• explain how the hour hand and minute hand move together</text><text x="120" y="505" class="p">• check whether a clock reading makes sense</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">2</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Parts of an analogue clock</text><circle cx="350" cy="350" r="190" class="c"/><text x="335" y="145" class="s">12</text><text x="535" y="360" class="s">3</text><text x="342" y="565" class="s">6</text><text x="145" y="360" class="s">9</text><line x1="350" y1="350" x2="310" y2="255" class="hh"/><line x1="350" y1="350" x2="468" y2="230" class="mh"/><text x="650" y="210" class="s">Hour hand</text><text x="650" y="250" class="p">Shorter hand • shows the hour</text><text x="650" y="345" class="s">Minute hand</text><text x="650" y="385" class="p">Longer hand • shows the minutes</text><text x="650" y="480" class="s">Minute marks</text><text x="650" y="520" class="p">60 small marks around the clock</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">3</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Count minutes around the clock</text><text x="70" y="140" class="p">One full turn of the minute hand is 60 minutes.</text><rect x="70" y="180" width="1060" height="350" rx="18" class="accent"/><text x="105" y="235" class="s">Each number represents 5 minutes:</text><text x="120" y="295" class="p">1 → 05    2 → 10    3 → 15    4 → 20</text><text x="120" y="350" class="p">5 → 25    6 → 30    7 → 35    8 → 40</text><text x="120" y="405" class="p">9 → 45   10 → 50   11 → 55   12 → 00</text><text x="105" y="485" class="s">Strategy: skip-count in 5s, then count extra minute marks.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">4</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Read to the nearest minute</text><rect x="70" y="150" width="500" height="360" rx="18" class="box"/><text x="105" y="205" class="s">Example</text><text x="105" y="260" class="p">Minute hand is 3 marks past 4.</text><text x="105" y="315" class="p">4 × 5 = 20</text><text x="105" y="365" class="p">20 + 3 = 23 minutes</text><text x="105" y="430" class="s">Minute part = :23</text><rect x="620" y="150" width="510" height="360" rx="18" class="good"/><text x="655" y="205" class="s">Teacher prompt</text><text x="655" y="265" class="p">“What number did you reach?”</text><text x="655" y="315" class="p">“How many minutes is that?”</text><text x="655" y="365" class="p">“How many extra marks?”</text><text x="655" y="430" class="p">Then combine the hour and minutes.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">5</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">The hour hand does not stay still</text><text x="70" y="145" class="p">As minutes pass, the hour hand slowly moves toward the next hour.</text><rect x="70" y="190" width="1060" height="345" rx="18" class="box"/><text x="110" y="250" class="s">At 3:00</text><text x="330" y="250" class="p">hour hand is exactly on 3</text><text x="110" y="320" class="s">At 3:15</text><text x="330" y="320" class="p">hour hand is a little past 3</text><text x="110" y="390" class="s">At 3:30</text><text x="330" y="390" class="p">hour hand is halfway between 3 and 4</text><text x="110" y="460" class="s">At 3:59</text><text x="330" y="460" class="p">hour hand is almost at 4</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">6</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Read both hands together</text><rect x="70" y="160" width="1060" height="380" rx="18" class="accent"/><text x="105" y="220" class="s">Reliable routine</text><text x="120" y="280" class="p">1. Read the minute hand.</text><text x="120" y="330" class="p">2. Find the hour that has just passed.</text><text x="120" y="380" class="p">3. Write hour : minutes.</text><text x="120" y="430" class="p">4. Check the hour-hand position matches the minutes.</text><text x="120" y="490" class="s">Example: hour hand between 2 and 3 + minute 40 = 2:40</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">7</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Digital time</text><text x="70" y="155" class="p">Digital clocks show the hour first and the minutes second.</text><rect x="250" y="210" width="700" height="190" rx="22" class="accent"/><text x="405" y="330" style="font:700 86px Arial,sans-serif;fill:#15233b">10 : 05</text><text x="320" y="455" class="s">10 = hour</text><text x="690" y="455" class="s">05 = minutes</text><text x="300" y="520" class="p">Use two minute digits: write 7:05, not 7:5.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">8</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Time language</text><rect x="70" y="145" width="1060" height="405" rx="18" class="box"/><text x="110" y="210" class="s">12:15</text><text x="310" y="210" class="p">quarter past 12 • 15 minutes past 12</text><text x="110" y="280" class="s">3:30</text><text x="310" y="280" class="p">half past 3</text><text x="110" y="350" class="s">12:45</text><text x="310" y="350" class="p">quarter to 1 • 15 minutes before 1</text><text x="110" y="420" class="s">10:05</text><text x="310" y="420" class="p">5 minutes past 10</text><text x="110" y="490" class="s">3:50</text><text x="310" y="490" class="p">10 minutes to 4</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">9</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Past or to?</text><rect x="70" y="150" width="500" height="390" rx="18" class="good"/><text x="105" y="210" class="s">PAST</text><text x="105" y="265" class="p">Use the hour that has started.</text><text x="105" y="330" class="p">4:23 = 23 minutes past 4</text><text x="105" y="395" class="p">2:15 = quarter past 2</text><rect x="620" y="150" width="510" height="390" rx="18" class="warn"/><text x="655" y="210" class="s">TO</text><text x="655" y="265" class="p">Count how many minutes remain.</text><text x="655" y="330" class="p">4:50 = 10 minutes to 5</text><text x="655" y="395" class="p">8:45 = quarter to 9</text><text x="655" y="470" class="p">60 − minutes = minutes to next hour</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">10</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Worked examples: nearest minute</text><rect x="70" y="145" width="1060" height="410" rx="18" class="accent"/><text x="105" y="210" class="s">2:07</text><text x="285" y="210" class="p">minute hand at minute 7 • hour hand just past 2</text><text x="105" y="280" class="s">4:38</text><text x="285" y="280" class="p">minute hand at minute 38 • hour hand well past 4, moving toward 5</text><text x="105" y="350" class="s">7:06</text><text x="285" y="350" class="p">minute hand one mark after 5 • hour hand just past 7</text><text x="105" y="420" class="s">9:58</text><text x="285" y="420" class="p">minute hand two marks before 12 • hour hand almost at 10</text><text x="105" y="500" class="small">Ask students to justify both hands, not just name the digital time.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">11</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Common mistakes</text><rect x="70" y="145" width="1060" height="415" rx="18" class="warn"/><text x="105" y="205" class="p">• Reading the number 7 as 7 minutes instead of 35 minutes.</text><text x="105" y="260" class="p">• Leaving the hour hand exactly on the hour after minutes have passed.</text><text x="105" y="315" class="p">• Reading 4:45 as quarter past 4 instead of quarter to 5.</text><text x="105" y="370" class="p">• Reversing hour and minute parts in digital time.</text><text x="105" y="425" class="p">• Writing 8:5 instead of 8:05.</text><text x="105" y="480" class="p">• Looking at only one hand instead of checking both.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">12</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Guided practice</text><rect x="70" y="150" width="1060" height="390" rx="18" class="box"/><text x="105" y="215" class="s">1.</text><text x="160" y="215" class="p">Minute hand is 2 marks past 4; hour hand is between 1 and 2. What time?</text><text x="105" y="300" class="s">2.</text><text x="160" y="300" class="p">The clock shows 6:14. Where should the hour hand be?</text><text x="105" y="385" class="s">3.</text><text x="160" y="385" class="p">Write 12:45 in two different ways using words.</text><text x="105" y="470" class="s">4.</text><text x="160" y="470" class="p">A clock shows 11:59. Explain what happens one minute later.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">13</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Real-life time</text><rect x="70" y="145" width="1060" height="410" rx="18" class="good"/><text x="105" y="210" class="s">School</text><text x="300" y="210" class="p">Recess starts at 10:45. Where are both hands?</text><text x="105" y="280" class="s">Bus</text><text x="300" y="280" class="p">A bus arrives at 3:27. Show the time on an analogue clock.</text><text x="105" y="350" class="s">Cooking</text><text x="300" y="350" class="p">Cookies go in at 4:05 and bake for 15 minutes. Ready when?</text><text x="105" y="420" class="s">Sport</text><text x="300" y="420" class="p">Training begins at 5:30. Say the time in words.</text><text x="105" y="490" class="small">Use familiar contexts so students connect clock reading with daily life.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">14</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Independent challenge</text><rect x="70" y="150" width="1060" height="390" rx="18" class="accent"/><text x="105" y="215" class="p">Draw the hands for 4:23, 9:58, 12:45 and 7:06.</text><text x="105" y="285" class="p">Explain why the hour hand is between numbers most of the time.</text><text x="105" y="355" class="p">Which is correct for 2:40: 40 minutes past 2 or 20 minutes to 3?</text><text x="105" y="425" class="p">A student says 5:52 has the hour hand “a little past 5”. Correct or improve the description.</text><text x="105" y="495" class="small">Expected: at 5:52 the hour hand is very close to 6, not merely a little past 5.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">15</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Exit ticket</text><rect x="70" y="145" width="1060" height="410" rx="18" class="box"/><text x="105" y="215" class="s">1.</text><text x="160" y="215" class="p">What does the minute hand show?</text><text x="105" y="290" class="s">2.</text><text x="160" y="290" class="p">Write 12:45 in words.</text><text x="105" y="365" class="s">3.</text><text x="160" y="365" class="p">At 3:27, where should the hour hand be?</text><text x="105" y="440" class="s">4.</text><text x="160" y="440" class="p">Explain why the hour hand moves toward the next number as minutes pass.</text><text x="105" y="515" class="p">Success = students can justify both hands and connect analogue, digital and words.</text><line x1="70" y1="645" x2="1130" y2="645" class="rule"/><text x="70" y="667" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="667" class="num">16</text></svg></figure>
</div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 16</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script><script src="/assets/curriculum-progression.js?v=1"></script></body></html>
