<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>AC9M3M04 Teacher Slides | SkillrHub</title><link rel="canonical" href="https://skillrhub.com/year3/maths/ac9m3m04-the-relationship-between-the-hours-and-minutes-on-analog-and/"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/assets/teacher-slide-viewer.css?v=1"><style>.fixed-slide-viewer svg{width:100%;height:auto;display:block;background:#fff}.t{font:700 44px Arial,sans-serif;fill:#14213d}.s{font:700 28px Arial,sans-serif;fill:#14213d}.p{font:500 24px Arial,sans-serif;fill:#26354d}.small{font:500 20px Arial,sans-serif;fill:#26354d}.brand{font:600 13px Arial,sans-serif;fill:#97a2b1}.num{font:600 14px Arial,sans-serif;fill:#97a2b1}.clock{fill:#fff;stroke:#27364d;stroke-width:5}.hh{stroke:#e76f51;stroke-width:12;stroke-linecap:round}.mh{stroke:#277da1;stroke-width:7;stroke-linecap:round}.box{fill:#f7fbff;stroke:#cddced;stroke-width:2}.blue{fill:#eaf5ff;stroke:#84b9df;stroke-width:2}.yellow{fill:#fff7d6;stroke:#e5c95d;stroke-width:2}.green{fill:#eef9ef;stroke:#8bc79a;stroke-width:2}.pink{fill:#fff0f3;stroke:#e6a6b3;stroke-width:2}.rule{stroke:#e1e7ef;stroke-width:2}.main-nav,.fixed-slide-viewer__controls{position:relative;z-index:20}</style></head><body><nav class="main-nav"><a href="../">Topic Guide</a><a href="/quiz/year-3/math/ac9m3m04/worksheet/">Worksheet</a><a href="/quiz/year-3/math/ac9m3m04/practice/">Practice</a><a href="/quiz/year-3/math/ac9m3m04/test/">Test</a></nav><main><h1>AC9M3M04 Teacher Slides</h1><section class="fixed-slide-viewer" data-fixed-slide-viewer tabindex="0"><div class="fixed-slide-viewer__stage">
<figure class="fixed-slide-viewer__slide" data-slide><svg viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fcff"/><text x="65" y="95" class="t">Telling Time to the Nearest Minute</text><text x="65" y="145" class="p">Let’s become clock detectives!</text><circle cx="600" cy="355" r="180" class="clock"/><text x="582" y="205" class="s">12</text><text x="750" y="365" class="s">3</text><text x="590" y="520" class="s">6</text><text x="430" y="365" class="s">9</text><line x1="600" y1="355" x2="548" y2="285" class="hh"/><line x1="600" y1="355" x2="710" y2="245" class="mh"/><circle cx="600" cy="355" r="9" fill="#14213d"/><rect x="130" y="555" width="940" height="58" rx="18" class="yellow"/><text x="240" y="593" class="p">Red short hand = hours     Blue long hand = minutes</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">1</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="90" class="t">Today I can…</text><rect x="70" y="145" width="500" height="150" rx="24" class="blue"/><text x="105" y="205" class="s">Read a clock</text><text x="105" y="250" class="p">to the nearest minute</text><rect x="630" y="145" width="500" height="150" rx="24" class="green"/><text x="665" y="205" class="s">Write digital time</text><text x="665" y="250" class="p">like 7:05 and 3:27</text><rect x="70" y="335" width="500" height="150" rx="24" class="yellow"/><text x="105" y="395" class="s">Say time in words</text><text x="105" y="440" class="p">past, half past and to</text><rect x="630" y="335" width="500" height="150" rx="24" class="pink"/><text x="665" y="395" class="s">Explain both hands</text><text x="665" y="440" class="p">and how they move together</text><text x="330" y="555" class="s">I can explain how the hands move together.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">2</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Meet the clock</text><circle cx="390" cy="350" r="205" class="clock"/><text x="372" y="185" class="s">12</text><text x="555" y="360" class="s">3</text><text x="380" y="535" class="s">6</text><text x="210" y="360" class="s">9</text><line x1="390" y1="350" x2="340" y2="255" class="hh"/><line x1="390" y1="350" x2="505" y2="245" class="mh"/><circle cx="390" cy="350" r="9" fill="#14213d"/><rect x="650" y="155" width="440" height="105" rx="20" class="pink"/><text x="685" y="205" class="s">Hour hand</text><text x="685" y="240" class="small">shorter • tells the hour</text><rect x="650" y="290" width="440" height="105" rx="20" class="blue"/><text x="685" y="340" class="s">Minute hand</text><text x="685" y="375" class="small">longer • tells the minutes</text><rect x="650" y="425" width="440" height="105" rx="20" class="green"/><text x="685" y="475" class="s">Minute marks</text><text x="685" y="510" class="small">60 little marks around the face</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">3</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Count around by 5s</text><circle cx="350" cy="350" r="205" class="clock"/><text x="333" y="175" class="s">00</text><text x="455" y="220" class="s">05</text><text x="520" y="335" class="s">10</text><text x="505" y="465" class="s">15</text><text x="400" y="535" class="s">20</text><text x="275" y="535" class="s">25</text><text x="170" y="465" class="s">30</text><text x="155" y="335" class="s">35</text><text x="220" y="220" class="s">40</text><rect x="650" y="180" width="450" height="300" rx="24" class="yellow"/><text x="690" y="245" class="s">Say it together:</text><text x="700" y="315" class="p">5, 10, 15, 20, 25, 30…</text><text x="700" y="365" class="p">35, 40, 45, 50, 55, 60!</text><text x="690" y="435" class="s">Then count extra tiny marks.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">4</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Clock detective: find 23 minutes</text><circle cx="350" cy="350" r="205" class="clock"/><line x1="350" y1="350" x2="490" y2="245" class="mh"/><line x1="350" y1="350" x2="315" y2="260" class="hh"/><circle cx="350" cy="350" r="9" fill="#14213d"/><rect x="640" y="155" width="470" height="380" rx="24" class="blue"/><text x="680" y="220" class="s">1. Count to the 4</text><text x="700" y="265" class="p">4 × 5 = 20 minutes</text><text x="680" y="335" class="s">2. Count 3 more marks</text><text x="700" y="380" class="p">20 + 3 = 23 minutes</text><text x="680" y="455" class="s">3. Check the short hand</text><text x="700" y="500" class="p">It has moved past the hour.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">5</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Watch the hour hand creep!</text><text x="65" y="135" class="p">The red hand keeps moving while the blue hand travels.</text><g transform="translate(70,190)"><circle cx="120" cy="120" r="105" class="clock"/><line x1="120" y1="120" x2="120" y2="50" class="hh"/><line x1="120" y1="120" x2="120" y2="30" class="mh"/><text x="75" y="270" class="s">3:00</text></g><g transform="translate(335,190)"><circle cx="120" cy="120" r="105" class="clock"/><line x1="120" y1="120" x2="138" y2="53" class="hh"/><line x1="120" y1="120" x2="210" y2="120" class="mh"/><text x="75" y="270" class="s">3:15</text></g><g transform="translate(600,190)"><circle cx="120" cy="120" r="105" class="clock"/><line x1="120" y1="120" x2="168" y2="72" class="hh"/><line x1="120" y1="120" x2="120" y2="210" class="mh"/><text x="75" y="270" class="s">3:30</text></g><g transform="translate(865,190)"><circle cx="120" cy="120" r="105" class="clock"/><line x1="120" y1="120" x2="183" y2="95" class="hh"/><line x1="120" y1="120" x2="30" y2="120" class="mh"/><text x="75" y="270" class="s">3:45</text></g><rect x="220" y="525" width="760" height="70" rx="20" class="green"/><text x="275" y="570" class="p">More minutes = the hour hand gets closer to 4.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">6</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">My 4-step clock check</text><rect x="70" y="145" width="1060" height="390" rx="24" class="yellow"/><text x="125" y="235" class="p">1. Read the long blue minute hand.</text><text x="125" y="305" class="p">2. Find the hour the short red hand has just passed.</text><text x="125" y="375" class="p">3. Write hour : minutes.</text><text x="125" y="445" class="p">4. Ask: “Do both hands make sense?”</text><text x="255" y="510" class="s">I can explain why my answer is correct.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">7</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Digital time</text><rect x="250" y="150" width="700" height="190" rx="28" class="blue"/><text x="405" y="280" style="font:700 92px Arial,sans-serif;fill:#14213d">10 : 05</text><text x="320" y="415" class="s">10 = hour</text><text x="690" y="415" class="s">05 = minutes</text><rect x="250" y="465" width="700" height="85" rx="18" class="pink"/><text x="330" y="518" class="p">Minutes under 10 need a zero: 7:05, not 7:5.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">8</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Past or to?</text><rect x="70" y="150" width="500" height="390" rx="24" class="green"/><text x="105" y="215" class="s">PAST</text><text x="105" y="275" class="p">Count from the hour</text><text x="105" y="340" class="p">4:23 = 23 minutes past 4</text><text x="105" y="405" class="p">2:15 = quarter past 2</text><rect x="630" y="150" width="500" height="390" rx="24" class="yellow"/><text x="665" y="215" class="s">TO</text><text x="665" y="275" class="p">Count to the next hour</text><text x="665" y="340" class="p">4:50 = 10 minutes to 5</text><text x="665" y="405" class="p">8:45 = quarter to 9</text><text x="665" y="475" class="s">60 − minutes = minutes to</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">9</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Which clock matches 4:38?</text><circle cx="300" cy="335" r="150" class="clock"/><line x1="300" y1="335" x2="255" y2="260" class="hh"/><line x1="300" y1="335" x2="185" y2="405" class="mh"/><text x="245" y="540" class="s">Clock A</text><circle cx="600" cy="335" r="150" class="clock"/><line x1="600" y1="335" x2="660" y2="270" class="hh"/><line x1="600" y1="335" x2="485" y2="405" class="mh"/><text x="545" y="540" class="s">Clock B</text><circle cx="900" cy="335" r="150" class="clock"/><line x1="900" y1="335" x2="965" y2="300" class="hh"/><line x1="900" y1="335" x2="785" y2="405" class="mh"/><text x="845" y="540" class="s">Clock C</text><text x="285" y="600" class="p">Think: at 38 minutes, the hour hand is more than halfway to 5.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">10</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Real-life clock challenge</text><rect x="70" y="145" width="500" height="390" rx="24" class="blue"/><text x="105" y="210" class="s">The bus arrives at 3:27.</text><text x="105" y="275" class="p">Where is the minute hand?</text><text x="105" y="330" class="p">Where is the hour hand?</text><text x="105" y="385" class="p">Say the time in words.</text><text x="105" y="455" class="s">Turn and explain to a partner.</text><circle cx="850" cy="335" r="180" class="clock"/><text x="832" y="185" class="s">12</text><text x="1008" y="345" class="s">3</text><text x="842" y="510" class="s">6</text><text x="675" y="345" class="s">9</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">11</text></svg></figure>
<figure class="fixed-slide-viewer__slide" data-slide hidden><svg viewBox="0 0 1200 675"><text x="65" y="85" class="t">Exit ticket</text><rect x="70" y="145" width="1060" height="390" rx="24" class="green"/><text x="115" y="220" class="s">Show what you know</text><text x="130" y="285" class="p">1. Write quarter to 1 as digital time.</text><text x="130" y="345" class="p">2. Where is the hour hand at 5:30?</text><text x="130" y="405" class="p">3. Explain why the hour hand is almost at 10 at 9:58.</text><text x="130" y="465" class="p">4. Draw 3:27 on a blank clock.</text><text x="370" y="575" class="s">I can read time to the nearest minute.</text><line x1="70" y1="640" x2="1130" y2="640" class="rule"/><text x="70" y="662" class="brand">SkillrHub • AC9M3M04</text><text x="1100" y="662" class="num">12</text></svg></figure>
