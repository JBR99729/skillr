<text x="70" y="85" class="t">Scientists may revise explanations</text><text x="90" y="205" class="s">New data can support, weaken or change an earlier idea.</text><text x="90" y="325" class="p">Changing an explanation when evidence changes is a strength of science.</text><text x="70" y="645" class="f">SkillrHub • AC9S3H01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="85" class="t">Quick check</text><text x="90" y="195" class="s">1. What comes between data and an explanation?</text><text x="90" y="285" class="s">2. Give one piece of evidence for a claim.</text><text x="90" y="375" class="s">3. Why might a scientist change an explanation?</text><text x="70" y="645" class="f">SkillrHub • AC9S3H01</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script></body></html>
