g things depend on their environment</text><text x="90" y="205" class="s">Plants need suitable light, water and nutrients.</text><text x="90" y="305" class="s">Animals need food, water, shelter and suitable conditions.</text><text x="70" y="645" class="f">SkillrHub • AC9S3U01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="85" class="t">Quick check</text><text x="90" y="195" class="s">1. Give two characteristics of living things.</text><text x="90" y="285" class="s">2. Why is movement alone not enough?</text><text x="90" y="375" class="s">3. Classify a seed and justify your answer.</text><text x="70" y="645" class="f">SkillrHub • AC9S3U01</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script></body></html>
