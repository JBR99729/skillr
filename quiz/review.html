<!DOCTYPE html>
<html lang="en-AU">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Review Quiz Answers | SkillrHub
  </title>

  <meta
    name="description"
    content="Review your SkillrHub maths practice answers, corrections and explanations."
  >

  <!-- Review pages are personalised/session pages,
       so they should not appear in Google results. -->
  <meta
    name="robots"
    content="noindex, follow"
  >

  <link
    rel="canonical"
    href="https://skillrhub.com/quiz/review.html"
  >


  <!-- ==============================================
       GOOGLE ANALYTICS
       ============================================== -->

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-8P22BET45N"
  ></script>

  <script>

    window.dataLayer =
      window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag(
      "js",
      new Date()
    );

    gtag(
      "config",
      "G-8P22BET45N"
    );

  </script>


  <!-- ==============================================
       GOOGLE ADSENSE
       ============================================== -->

  <meta
    name="google-adsense-account"
    content="ca-pub-7734963540104771"
  >

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7734963540104771"
    crossorigin="anonymous"
  ></script>


  <!-- ==============================================
       STYLES
       ============================================== -->

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <link
    rel="stylesheet"
    href="/quiz/assets/style.css?v=104"
  >


  <style>

    .review-page {
      width: min(
        900px,
        calc(100% - 32px)
      );

      margin: 0 auto;
      padding: 36px 0 60px;
    }


    .review-heading-card {
      padding:
        clamp(
          24px,
          5vw,
          42px
        );

      text-align: center;
    }


    .review-score {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 120px;

      margin: 18px auto 6px;
      padding: 12px 20px;

      border-radius: 999px;

      color: var(--primary);
      background: #eef4ff;

      font-size: 1.2rem;
      font-weight: 900;
    }


    .review-list {
      display: grid;
      gap: 18px;

      margin-top: 26px;
    }


    .review-answer-card {
      padding:
        clamp(
          18px,
          4vw,
          26px
        );

      border: 1px solid var(--border);
      border-left: 6px solid var(--border);
      border-radius: 16px;

      background: #ffffff;
      box-shadow:
        0 8px 30px
        rgba(
          23,
          32,
          51,
          0.06
        );
    }


    .review-answer-card.is-correct {
      border-left-color:
        var(--success);
    }


    .review-answer-card.is-wrong {
      border-left-color:
        var(--danger);
    }


    .review-question-number {
      margin: 0 0 8px;

      color: var(--primary);

      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }


    .review-question {
      margin: 0 0 16px;

      color: var(--text);

      font-size: 1.08rem;
      line-height: 1.5;
    }


    .review-status {
      display: inline-block;

      margin-bottom: 14px;
      padding: 6px 10px;

      border-radius: 999px;

      font-size: 0.82rem;
      font-weight: 900;
    }


    .review-answer-card.is-correct
    .review-status {
      color: var(--success);
      background: var(--success-bg);
    }


    .review-answer-card.is-wrong
    .review-status {
      color: var(--danger);
      background: var(--danger-bg);
    }


    .review-detail {
      margin: 8px 0 0;

      color: var(--muted);

      line-height: 1.55;
    }


    .review-detail strong {
      color: var(--text);
    }


    .review-explanation {
      margin-top: 16px;
      padding: 14px 16px;

      border-radius: 12px;

      background: #f8fafc;

      color: var(--text);

      line-height: 1.6;
    }


    .review-explanation strong {
      color: var(--primary);
    }


    .review-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;

      margin-top: 30px;
    }


    .review-empty {
      margin-top: 24px;
      padding: 28px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: #ffffff;

      text-align: center;
    }


    @media (
      max-width: 640px
    ) {

      .review-page {
        width:
          min(
            100% - 20px,
            900px
          );

        padding:
          18px 0 40px;
      }


      .review-actions {
        display: grid;
        grid-template-columns: 1fr;
      }


      .review-actions .button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <main class="review-page">


    <!-- ==============================================
         BREADCRUMB
         ============================================== -->

    <nav
      class="quiz-breadcrumb"
      aria-label="Breadcrumb"
    >

      <ol>

        <li>
          <a href="/">
            Home
          </a>
        </li>

        <li>
          <a href="/quiz/">
            Practice
          </a>
        </li>

        <li aria-current="page">
          Review answers
        </li>

      </ol>

    </nav>


    <!-- ==============================================
         REVIEW HEADING
         ============================================== -->

    <section
      class="card review-heading-card"
    >

      <p
        class="eyebrow"
        id="reviewLabel"
      >
        Quiz review
      </p>

      <h1
        class="review-heading"
        id="reviewTitle"
      >
        Review your answers
      </h1>

      <p class="intro-text">
        Check each question,
        your answer and the correct answer.
      </p>

      <div
        class="review-score"
        id="reviewScore"
      >
        0 / 0
      </div>

    </section>


    <!-- ==============================================
         ANSWERS
         ============================================== -->

    <section
      class="review-list"
      id="reviewList"
      aria-label="Quiz answer review"
    ></section>


    <!-- ==============================================
         EMPTY / ERROR STATE
         ============================================== -->

    <section
      class="review-empty"
      id="emptyReview"
      hidden
    >

      <h2>
        No quiz review found
      </h2>

      <p class="intro-text">
        Complete a practice quiz first,
        then choose Review answers.
      </p>

      <a
        class="button button-primary"
        href="/quiz/"
      >
        Find a practice quiz
      </a>

    </section>


    <!-- ==============================================
         ACTIONS
         ============================================== -->

    <div
      class="review-actions"
      id="reviewActions"
    >

      <button
        class="button button-primary"
        id="tryAgainButton"
        type="button"
      >
        Try another 5 questions
      </button>

      <button
        class="button button-secondary"
        id="backToQuizButton"
        type="button"
      >
        Back to practice
      </button>

    </div>


  </main>


  <script>

    "use strict";


    /* ================================================
       LOAD REVIEW DATA
       ================================================ */

    const storedReview =
      sessionStorage.getItem(
        "skillrQuizReview"
      );


    const reviewTitle =
      document.getElementById(
        "reviewTitle"
      );


    const reviewLabel =
      document.getElementById(
        "reviewLabel"
      );


    const reviewScore =
      document.getElementById(
        "reviewScore"
      );


    const reviewList =
      document.getElementById(
        "reviewList"
      );


    const emptyReview =
      document.getElementById(
        "emptyReview"
      );


    const reviewActions =
      document.getElementById(
        "reviewActions"
      );


    const tryAgainButton =
      document.getElementById(
        "tryAgainButton"
      );


    const backToQuizButton =
      document.getElementById(
        "backToQuizButton"
      );


    let reviewData =
      null;


    try {

      reviewData =
        storedReview
          ? JSON.parse(
              storedReview
            )
          : null;

    } catch (error) {

      console.error(
        "Could not read quiz review:",
        error
      );

    }


    /* ================================================
       NO REVIEW AVAILABLE
       ================================================ */

    if (
      !reviewData ||
      !Array.isArray(
        reviewData.answers
      )
    ) {

      reviewList.hidden =
        true;

      reviewActions.hidden =
        true;

      emptyReview.hidden =
        false;

    } else {


      /* ==============================================
         HEADING
         ============================================== */

      reviewTitle.textContent =
        reviewData.quizTitle ||
        "Review your answers";


      reviewLabel.textContent =
        reviewData.quizLabel ||
        "Quiz review";


      reviewScore.textContent =
        `${reviewData.score || 0} / ${reviewData.total || 0}`;


      document.title =
        `${reviewData.quizTitle || "Quiz"} Review | SkillrHub`;


      /* ==============================================
         BUILD ANSWER CARDS
         ============================================== */

      reviewData.answers.forEach(
        (
          answer,
          index
        ) => {


          const card =
            document.createElement(
              "article"
            );


          card.className =
            `review-answer-card ${
              answer.isCorrect
                ? "is-correct"
                : "is-wrong"
            }`;


          /* Question number */

          const number =
            document.createElement(
              "p"
            );

          number.className =
            "review-question-number";

          number.textContent =
            `Question ${index + 1}`;


          /* Question */

          const question =
            document.createElement(
              "h2"
            );

          question.className =
            "review-question";

          question.textContent =
            answer.question ||
            "Question";


          /* Status */

          const status =
            document.createElement(
              "div"
            );

          status.className =
            "review-status";

          status.textContent =
            answer.isCorrect
              ? "✓ Correct"
              : "✕ Try again";


          /* Student answer */

          const selected =
            document.createElement(
              "p"
            );

          selected.className =
            "review-detail";


          const selectedLabel =
            document.createElement(
              "strong"
            );

          selectedLabel.textContent =
            "Your answer: ";


          selected.append(
            selectedLabel,
            document.createTextNode(
              answer.selectedAnswer ||
              "No answer"
            )
          );


          /* Correct answer */

          const correct =
            document.createElement(
              "p"
            );

          correct.className =
            "review-detail";


          const correctLabel =
            document.createElement(
              "strong"
            );

          correctLabel.textContent =
            "Correct answer: ";


          correct.append(
            correctLabel,
            document.createTextNode(
              answer.correctAnswer ||
              ""
            )
          );


          card.append(
            number,
            question,
            status,
            selected,
            correct
          );


          /* Explanation */

          if (
            answer.explanation
          ) {

            const explanation =
              document.createElement(
                "div"
              );


            explanation.className =
              "review-explanation";


            const explanationLabel =
              document.createElement(
                "strong"
              );


            explanationLabel.textContent =
              "Why? ";


            explanation.append(
              explanationLabel,
              document.createTextNode(
                answer.explanation
              )
            );


            card.appendChild(
              explanation
            );

          }


          reviewList.appendChild(
            card
          );

        }
      );


      /* ==============================================
         TRY ANOTHER 5

         Navigating back to the quiz URL gives a
         complete fresh page load and therefore a
         newly shuffled question set.
         ============================================== */

      tryAgainButton.addEventListener(
        "click",
        () => {

          window.location.href =
            reviewData.quizUrl ||
            "/quiz/";

        }
      );


      /* ==============================================
         BACK TO PRACTICE
         ============================================== */

      backToQuizButton.addEventListener(
        "click",
        () => {

          window.location.href =
            reviewData.quizUrl ||
            "/quiz/";

        }
      );

    }

  </script>


</body>

</html>
