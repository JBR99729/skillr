 y="85" class="t">Decomposers recycle materials</text><text x="90" y="205" class="s">Fungi and many microorganisms break down dead material and waste.</text><text x="90" y="325" class="p">Nutrients return to the environment and can be used again by producers.</text><text x="70" y="645" class="f">SkillrHub • AC9S4U01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="85" class="t">Quick check</text><text x="90" y="195" class="s">1. Classify grass, kangaroo and fungus by role.</text><text x="90" y="285" class="s">2. Why are decomposers important?</text><text x="90" y="375" class="s">3. Describe one interaction in a food chain.</text><text x="70" y="645" class="f">SkillrHub • AC9S4U01</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script></body></html>
