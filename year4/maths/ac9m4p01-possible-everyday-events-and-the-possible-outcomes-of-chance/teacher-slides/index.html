</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Dependent events change what can happen next</text><text x="100" y="210" class="s">If an item is removed and not replaced, the next chance can change.</text><text x="100" y="330" class="p">Also ask whether one event affects whether another event can occur.</text><text x="100" y="450" class="s">Independent or dependent? Explain why.</text><text x="70" y="650" class="f">SkillrHub • AC9M4P01</text></svg></figure><figure data-slide hidden><svg viewBox="0 0 1200 675"><text x="70" y="90" class="t">Quick check</text><text x="100" y="210" class="s">1. Order: rolling a 7, rolling an even number, rolling 1–6.</text><text x="100" y="300" class="s">2. Are successive fair coin tosses independent?</text><text x="100" y="390" class="s">3. Give one example of dependent events.</text><text x="70" y="650" class="f">SkillrHub • AC9M4P01</text></svg></figure></div><div class="fixed-slide-viewer__controls"><button data-slide-previous>Previous</button><span data-slide-counter>1 / 5</span><button data-slide-next>Next</button><button data-slide-fullscreen>Fullscreen</button></div></section></main><script src="/assets/teacher-slide-viewer.js?v=1"></script><script src="/assets/curriculum-progression.js?v=1"></script></body></html>
