<script>
const teacherDisplayPages={

let code=(params.get("code")||"").toUpperCase();
if(!code){
  const match=location.pathname.match(/\/(ac9s3[a-z0-9]+)-teacher-slide\.pdf$/i);

}
const target=teacherDisplayPages[code]||"/sitemap.html";
if(target) location.replace(target);

<body>
<main>

</main>
<script>
const link=document.getElementById("fallbackLink");
if(teacherDisplayPages[code]){link.href=teacherDisplayPages[code];link.textContent="Open " + code + " Teacher Display Page";}
</script>
