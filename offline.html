<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2457d6">
  <title>You're Offline | SkillrHub</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f7fb;
    }

    main {
      width: min(560px, 100%);
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
    }

    h1 {
      margin: 20px 0 12px;
    }

    p {
      line-height: 1.6;
      color: #667085;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 700;
      background: #2457d6;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <img src="/icons/icon-192.png" alt="SkillrHub logo">
    <h1>You're offline</h1>
    <p>
      SkillrHub quizzes work best while connected to the internet.
      Reconnect and try again to continue learning.
    </p>
    <button type="button" onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
