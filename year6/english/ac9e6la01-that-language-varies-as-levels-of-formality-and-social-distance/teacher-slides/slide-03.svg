<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A continuum, not two boxes</title><desc id="desc">Language choices sit on a continuum from highly conversational to highly formal. Effective choices depend on audience, purpose, social distance, authority, culture and urgency—not on a rule that formal always means respectful. Quick check: Where would a polite conversation with a new teammate sit, and why?</desc><rect width="1600" height="900" fill="#f8fbff"/><rect width="1600" height="72" fill="#173968"/><text x="72" y="47" font-size="25" font-weight="800" fill="#ffffff">AC9E6LA01 · YEAR 6 ENGLISH</text><text x="1325" y="47" font-size="23" font-weight="700" fill="#ffffff">SkillrHub</text><g opacity="0.055" fill="#2457d6" font-size="34" font-weight="700" transform="rotate(-18 800 450)"><text x="170" y="340">SkillrHub • skillrhub.com</text><text x="660" y="530">SkillrHub • skillrhub.com</text><text x="1010" y="720">SkillrHub • skillrhub.com</text></g><text x="92" y="142" font-size="46" font-weight="800" fill="#173968">A continuum, not two boxes</text><text x="112" y="255" font-size="26" font-weight="600" fill="#17243a">• Language choices sit on a continuum from highly conversational to highly</text><text x="145" y="289" font-size="26" font-weight="600" fill="#17243a">formal. Effective choices depend on audience, purpose, social distance,</text><text x="145" y="323" font-size="26" font-weight="600" fill="#17243a">authority, culture and urgency—not on a rule that formal always means</text><text x="145" y="357" font-size="26" font-weight="600" fill="#17243a">respectful.</text><text x="112" y="391" font-size="26" font-weight="600" fill="#17243a">• Quick check: Where would a polite conversation with a new teammate sit,</text><text x="145" y="425" font-size="26" font-weight="600" fill="#17243a">and why?</text><line x1="72" x2="1528" y1="840" y2="840" stroke="#cad8eb"/><text x="72" y="875" font-size="22" font-weight="700" fill="#53657d">AC9E6LA01 • SkillrHub • skillrhub.com</text><text x="1480" y="875" text-anchor="end" font-size="22" font-weight="700" fill="#53657d">3/12</text></svg>