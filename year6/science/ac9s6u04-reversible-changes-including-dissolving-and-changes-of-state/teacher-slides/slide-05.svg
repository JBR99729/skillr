<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Evidence of reaction</title><desc id="desc">A lasting new colour, gas, odour, temperature change or residue may support new-substance formation, especially when several observations agree. One visible change alone is not always decisive.</desc><rect width="1600" height="900" fill="#f8fbff"/><rect width="1600" height="72" fill="#173968"/><text x="72" y="47" font-size="25" font-weight="800" fill="#fff">AC9S6U04 · YEAR 6 SCIENCE</text><text x="1325" y="47" font-size="23" font-weight="700" fill="#fff">SkillrHub</text><g opacity=".055" fill="#2457d6" font-size="34" font-weight="700" transform="rotate(-18 800 450)"><text x="170" y="340">SkillrHub • skillrhub.com</text><text x="660" y="530">SkillrHub • skillrhub.com</text><text x="1010" y="720">SkillrHub • skillrhub.com</text></g><text x="92" y="142" font-size="46" font-weight="800" fill="#173968">Evidence of reaction</text><text x="112" y="255" font-size="26" font-weight="600" fill="#17243a">• A lasting new colour, gas, odour, temperature change or residue may</text><text x="145" y="289" font-size="26" font-weight="600" fill="#17243a">support new-substance formation, especially when several observations</text><text x="145" y="323" font-size="26" font-weight="600" fill="#17243a">agree. One visible change alone is not always decisive.</text><line x1="72" x2="1528" y1="840" y2="840" stroke="#cad8eb"/><text x="72" y="875" font-size="22" font-weight="700" fill="#53657d">AC9S6U04 • SkillrHub • skillrhub.com</text><text x="1480" y="875" text-anchor="end" font-size="22" font-weight="700" fill="#53657d">5/9</text></svg>