<line x1="535" y1="390" x2="535" y2="475" stroke="#24324a" stroke-width="4"/>
<line x1="745" y1="390" x2="745" y2="475" stroke="#24324a" stroke-width="4"/>
<text x="1040" y="445" text-anchor="middle" fill="#166534" class="sub">1/4</text>
<rect x="115" y="525" width="840" height="65" fill="#fff" class="shape"/>
<rect x="115" y="525" width="105" height="65" fill="#fed7aa"/>
