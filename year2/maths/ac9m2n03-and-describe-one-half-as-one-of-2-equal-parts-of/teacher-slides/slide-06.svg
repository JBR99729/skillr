<text x="1148" y="54" text-anchor="end" fill="#fff" class="small">6 / 7</text>
<text x="60" y="145" fill="#173a72" class="title">More equal parts mean smaller pieces</text>
<text x="60" y="198" fill="#475569" class="text">This comparison is true only when the whole is the same size.</text>
