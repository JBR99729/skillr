<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The denominator names the equal parts</title>
<desc id="desc">A table connects two, four and eight equal parts to one-half, one-quarter and one-eighth.</desc>
<style>
  .title{font:700 47px Arial,sans-serif}.sub{font:700 29px Arial,sans-serif}.text{font:500 25px Arial,sans-serif}.small{font:500 20px Arial,sans-serif}.footer{font:700 18px Arial,sans-serif}.watermark{font:700 31px Arial,sans-serif;letter-spacing:4px}
</style>
<rect width="1200" height="675" fill="#f8fafc"/>
<rect width="1200" height="82" fill="#173a72"/>
<text x="52" y="54" fill="#fff" class="sub">SkillrHub • Year 2 Maths</text>
<text x="1148" y="54" text-anchor="end" fill="#fff" class="small">5 / 7</text>
<text x="60" y="150" fill="#173a72" class="title">The denominator names the equal parts</text>
<text x="60" y="205" fill="#475569" class="text">The numerator 1 tells us that one part is selected.</text>
<rect x="95" y="245" width="1010" height="320" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>
<line x1="95" y1="325" x2="1105" y2="325" stroke="#cbd5e1" stroke-width="3"/>
<line x1="95" y1="405" x2="1105" y2="405" stroke="#cbd5e1" stroke-width="3"/>
<line x1="95" y1="485" x2="1105" y2="485" stroke="#cbd5e1" stroke-width="3"/>
<line x1="360" y1="245" x2="360" y2="565" stroke="#cbd5e1" stroke-width="3"/>
<line x1="660" y1="245" x2="660" y2="565" stroke="#cbd5e1" stroke-width="3"/>
<text x="225" y="297" text-anchor="middle" fill="#173a72" class="sub">Equal parts</text>
<text x="510" y="297" text-anchor="middle" fill="#173a72" class="sub">One part</text>
<text x="880" y="297" text-anchor="middle" fill="#173a72" class="sub">Read as</text>
<text x="225" y="378" text-anchor="middle" fill="#0f172a" class="sub">2</text>
<text x="510" y="378" text-anchor="middle" fill="#1d4ed8" class="sub">1/2</text>
<text x="880" y="378" text-anchor="middle" fill="#0f172a" class="text">one-half</text>
<text x="225" y="458" text-anchor="middle" fill="#0f172a" class="sub">4</text>
<text x="510" y="458" text-anchor="middle" fill="#166534" class="sub">1/4</text>
<text x="880" y="458" text-anchor="middle" fill="#0f172a" class="text">one-quarter</text>
<text x="225" y="538" text-anchor="middle" fill="#0f172a" class="sub">8</text>
<text x="510" y="538" text-anchor="middle" fill="#9a3412" class="sub">1/8</text>
<text x="880" y="538" text-anchor="middle" fill="#0f172a" class="text">one-eighth</text>
<text x="600" y="590" text-anchor="middle" fill="#173a72" opacity=".055" class="watermark">SKILLRHUB • SKILLRHUB</text>
