<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>AC9M2N03 Teacher Slides | SkillrHub</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/teacher-slide-viewer.css?v=1">
  <style>
    .fixed-slide-viewer img{width:100%;height:auto;display:block;background:#fff}
    @media print{
      body>*{display:none!important}
      body:before{
        content:'SkillrHub Teacher Slides are available for live classroom display.';
        display:block;
        padding:32px;
        font:700 20pt Arial,sans-serif
      }
    }
  </style>
</head>
<body oncontextmenu="return false">
  <nav class="main-nav">
    <a href="../">Topic Guide</a>
    <a href="/year2/curriculum/maths/">Year 2 Maths</a>
  </nav>
  <main style="padding:clamp(12px,3vw,32px)">
    <h1>AC9M2N03 Teacher Slides</h1>
    <p>Year 2 Fractions: Halves, Quarters and Eighths • fixed static classroom presentation</p>
    <section class="fixed-slide-viewer" data-fixed-slide-viewer tabindex="0" aria-label="AC9M2N03 Teacher Slides">
      <div class="fixed-slide-viewer__stage">
        <figure class="fixed-slide-viewer__slide" data-slide>
          <img src="slide-01.svg" alt="Fractions describe equal parts of one whole: one-half is 1 of 2 equal parts" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-02.svg" alt="Equal and unequal partitions: two parts are halves only when they are equal" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-03.svg" alt="Twelve counters shared into two equal groups: half of 12 is 6" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-04.svg" alt="Repeated halving connects halves, quarters and eighths" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-05.svg" alt="Two, four and eight equal parts correspond to one-half, one-quarter and one-eighth" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-06.svg" alt="For the same whole, more equal parts make smaller unit fractions" draggable="false">
        </figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden>
          <img src="slide-07.svg" alt="Quick check questions for halves, quarters and eighths" draggable="false">
        </figure>
      </div>
      <div class="fixed-slide-viewer__controls">
        <button type="button" data-slide-previous>Previous</button>
        <span class="fixed-slide-viewer__counter" data-slide-counter>1 / 7</span>
        <button type="button" data-slide-next>Next</button>
        <button type="button" data-slide-fullscreen>Fullscreen</button>
      </div>
    </section>
  </main>
  <script src="/assets/teacher-slide-viewer.js?v=1"></script>
  <script src="/assets/curriculum-progression.js?v=1"></script>
  <script>document.addEventListener('dragstart',event=>event.preventDefault());</script>
</body>
</html>
