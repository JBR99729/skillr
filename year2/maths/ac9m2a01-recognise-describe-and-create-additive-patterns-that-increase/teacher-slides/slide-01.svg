<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Additive patterns change by the same amount</title><desc id="d">The sequence 4, 7, 10, 13 increases by 3 each time.</desc><style>.t{font:700 48px Arial}.s{font:700 30px Arial}.p{font:500 25px Arial}.f{font:700 18px Arial}.w{font:700 31px Arial;letter-spacing:4px}</style><rect width="1200" height="675" fill="#f8fafc"/><rect width="1200" height="82" fill="#173a72"/><text x="52" y="54" fill="#fff" class="s">SkillrHub • Year 2 Maths</text><text x="1148" y="54" text-anchor="end" fill="#fff" class="p">1 / 7</text><text x="60" y="150" fill="#173a72" class="t">Additive patterns change by the same amount</text><text x="60" y="205" fill="#475569" class="p">Find the constant change between neighbouring terms.</text><g fill="#dbeafe" stroke="#24324a" stroke-width="4"><circle cx="190" cy="350" r="65"/><circle cx="430" cy="350" r="65"/><circle cx="670" cy="350" r="65"/><circle cx="910" cy="350" r="65"/></g><text x="190" y="365" text-anchor="middle" class="s">4</text><text x="430" y="365" text-anchor="middle" class="s">7</text><text x="670" y="365" text-anchor="middle" class="s">10</text><text x="910" y="365" text-anchor="middle" class="s">13</text><text x="310" y="270" text-anchor="middle" fill="#166534" class="s">+3</text><text x="550" y="270" text-anchor="middle" fill="#166534" class="s">+3</text><text x="790" y="270" text-anchor="middle" fill="#166534" class="s">+3</text><text x="600" y="525" text-anchor="middle" fill="#173a72" class="s">Rule: start at 4 and add 3 each time</text><text x="600" y="395" text-anchor="middle" fill="#173a72" opacity=".055" class="w">SKILLRHUB • SKILLRHUB</text><rect y="620" width="1200" height="55" fill="#173a72"/><text x="52" y="655" fill="#fff" class="f">AC9M2A01 • SkillrHub • skillrhub.com</text></svg>