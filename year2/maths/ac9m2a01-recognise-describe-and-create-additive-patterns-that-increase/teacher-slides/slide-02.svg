<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Patterns can increase or decrease</title><desc id="d">One pattern adds 5 and another subtracts 3.</desc><style>.t{font:700 48px Arial}.s{font:700 30px Arial}.p{font:500 25px Arial}.f{font:700 18px Arial}.w{font:700 31px Arial;letter-spacing:4px}</style><rect width="1200" height="675" fill="#f8fafc"/><rect width="1200" height="82" fill="#173a72"/><text x="52" y="54" fill="#fff" class="s">SkillrHub • Year 2 Maths</text><text x="1148" y="54" text-anchor="end" fill="#fff" class="p">2 / 7</text><text x="60" y="150" fill="#173a72" class="t">Patterns can increase or decrease</text><rect x="90" y="235" width="1020" height="125" rx="22" fill="#ecfdf5" stroke="#86efac" stroke-width="4"/><text x="140" y="300" class="s">5, 10, 15, 20</text><text x="760" y="300" fill="#166534" class="s">add 5</text><rect x="90" y="405" width="1020" height="125" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="4"/><text x="140" y="470" class="s">30, 27, 24, 21</text><text x="760" y="470" fill="#9a3412" class="s">subtract 3</text><text x="600" y="575" text-anchor="middle" fill="#475569" class="p">The change between every pair of neighbouring terms must stay the same.</text><text x="600" y="395" text-anchor="middle" fill="#173a72" opacity=".055" class="w">SKILLRHUB • SKILLRHUB</text><rect y="620" width="1200" height="55" fill="#173a72"/><text x="52" y="655" fill="#fff" class="f">AC9M2A01 • SkillrHub • skillrhub.com</text></svg>