<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Quick check</title><desc id="desc">AC9M2A02 classroom slide</desc><rect width="1200" height="675" fill="#f7faff"/><g fill="#1a3a72" opacity=".055" font-family="Arial" font-size="25" font-weight="700"><text x="90" y="190">SkillrHub • skillrhub.com</text><text x="630" y="190">SkillrHub • skillrhub.com</text><text x="90" y="390">SkillrHub • skillrhub.com</text><text x="630" y="390">SkillrHub • skillrhub.com</text></g><rect x="45" y="35" width="1110" height="555" rx="26" fill="#fff" stroke="#1a3a72" stroke-width="4"/><text x="80" y="105" fill="#1a3a72" font-family="Arial" font-size="50" font-weight="700">Quick check</text><text x="95" y="225" fill="#1f2937" font-family="Arial" font-size="31" font-weight="700">1. Use a near double to solve 6 + 7.</text><text x="95" y="315" fill="#1f2937" font-family="Arial" font-size="31">2. Bridge through 10 to solve 9 + 8.</text><text x="95" y="405" fill="#0b6b53" font-family="Arial" font-size="31" font-weight="700">3. Write both subtraction facts for 8 + 7 = 15.</text><text x="95" y="495" fill="#1f2937" font-family="Arial" font-size="28">Explain the strategy, not only the answer.</text><rect y="610" width="1200" height="65" fill="#1a3a72"/><text x="600" y="652" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">AC9M2A02 • SkillrHub • skillrhub.com</text></svg>
