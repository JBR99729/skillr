<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">4 / 6</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Regrouping can make calculation easier</text><text x="90" y="235" fill="#475569" font-family="Arial" font-size="29">Trade one ten for 10 ones without changing the number.</text><rect x="190" y="320" width="1220" height="330" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="290" y="435" fill="#1d4ed8" font-family="Arial" font-size="52" font-weight="700">62 = 6 tens + 2 ones</text><path d="M510 500H1080" stroke="#173a72" stroke-width="10"/><path d="M1080 500l-32-22v44z" fill="#173a72"/><text x="290" y="605" fill="#166534" font-family="Arial" font-size="52" font-weight="700">62 = 5 tens + 12 ones</text><text x="800" y="750" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="34" font-weight="700">The grouping changes. The value does not.</text><text x="800" y="470" text-anchor="middle" fill="#173a72" opacity=".05" font-family="Arial" font-size="44" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M2N02 • SkillrHub • skillrhub.com</text></svg>