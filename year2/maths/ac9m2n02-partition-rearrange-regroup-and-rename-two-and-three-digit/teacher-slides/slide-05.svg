<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">5 / 6</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Zero keeps place-value positions clear</text><text x="90" y="235" fill="#475569" font-family="Arial" font-size="29">407 has 4 hundreds, 0 tens and 7 ones.</text><g font-family="Arial" text-anchor="middle"><rect x="170" y="330" width="360" height="300" rx="28" fill="#eff6ff"/><text x="350" y="410" fill="#1d4ed8" font-size="31" font-weight="700">HUNDREDS</text><text x="350" y="540" fill="#0f172a" font-size="96" font-weight="700">4</text><rect x="620" y="330" width="360" height="300" rx="28" fill="#fef2f2"/><text x="800" y="410" fill="#b91c1c" font-size="31" font-weight="700">TENS</text><text x="800" y="540" fill="#0f172a" font-size="96" font-weight="700">0</text><rect x="1070" y="330" width="360" height="300" rx="28" fill="#fff7ed"/><text x="1250" y="410" fill="#9a3412" font-size="31" font-weight="700">ONES</text><text x="1250" y="540" fill="#0f172a" font-size="96" font-weight="700">7</text></g><text x="800" y="745" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="34" font-weight="700">Without the zero, 47 would mean a different number.</text><text x="800" y="470" text-anchor="middle" fill="#173a72" opacity=".05" font-family="Arial" font-size="44" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M2N02 • SkillrHub • skillrhub.com</text></svg>