<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">6 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Zero and inverse operations help us check</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Adding zero keeps the number the same; addition can check subtraction.</text><rect x="150" y="315" width="560" height="300" rx="28" fill="#eff6ff"/><text x="430" y="390" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="35" font-weight="700">ADDING ZERO</text><text x="430" y="500" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="64" font-weight="700">34 + 20 = 54</text><text x="430" y="565" text-anchor="middle" fill="#475569" font-family="Arial" font-size="29">4 ones + 0 ones = 4 ones</text><rect x="890" y="315" width="560" height="300" rx="28" fill="#ecfdf5"/><text x="1170" y="390" text-anchor="middle" fill="#166534" font-family="Arial" font-size="35" font-weight="700">INVERSE CHECK</text><text x="1170" y="485" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="55" font-weight="700">63 − 27 = 36</text><text x="1170" y="560" text-anchor="middle" fill="#166534" font-family="Arial" font-size="42" font-weight="700">36 + 27 = 63 ✓</text><rect x="355" y="700" width="890" height="78" rx="20" fill="#fff7ed"/><text x="800" y="750" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="30" font-weight="700">A correct inverse fact returns to the original whole.</text><text x="800" y="460" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N04 • SkillrHub • skillrhub.com</text></svg>