<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Near doubles make close facts easier</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Use a known double, then adjust by one.</text><rect x="190" y="320" width="1220" height="310" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="260" y="430" fill="#173a72" font-family="Arial" font-size="76" font-weight="700">7 + 8</text><text x="610" y="430" fill="#475569" font-family="Arial" font-size="56">=</text><text x="710" y="430" fill="#166534" font-family="Arial" font-size="64" font-weight="700">7 + 7 + 1</text><text x="610" y="555" fill="#475569" font-family="Arial" font-size="56">=</text><text x="710" y="555" fill="#9a3412" font-family="Arial" font-size="64" font-weight="700">14 + 1 = 15</text><rect x="390" y="700" width="820" height="80" rx="20" fill="#ecfdf5"/><text x="800" y="750" text-anchor="middle" fill="#166534" font-family="Arial" font-size="31" font-weight="700">8 was split into 7 and 1. The value did not change.</text><text x="800" y="460" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N04 • SkillrHub • skillrhub.com</text></svg>