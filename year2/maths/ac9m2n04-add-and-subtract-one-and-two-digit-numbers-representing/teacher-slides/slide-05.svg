<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">5 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Count up to find a difference</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Subtraction can mean finding how far apart two numbers are.</text><line x1="180" y1="520" x2="1420" y2="520" stroke="#334155" stroke-width="8"/><line x1="220" y1="480" x2="220" y2="560" stroke="#334155" stroke-width="6"/><line x1="500" y1="480" x2="500" y2="560" stroke="#334155" stroke-width="6"/><line x1="1280" y1="480" x2="1280" y2="560" stroke="#334155" stroke-width="6"/><text x="220" y="610" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="36" font-weight="700">38</text><text x="500" y="610" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="36" font-weight="700">40</text><text x="1280" y="610" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="36" font-weight="700">52</text><path d="M220 460 Q360 300 500 460" fill="none" stroke="#1d4ed8" stroke-width="7"/><path d="M500 460 Q890 210 1280 460" fill="none" stroke="#16a34a" stroke-width="7"/><text x="350" y="330" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="36" font-weight="700">+2</text><text x="890" y="270" text-anchor="middle" fill="#166534" font-family="Arial" font-size="36" font-weight="700">+12</text><text x="800" y="730" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="52" font-weight="700">2 + 12 = 14, so 52 − 38 = 14</text><text x="800" y="450" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-