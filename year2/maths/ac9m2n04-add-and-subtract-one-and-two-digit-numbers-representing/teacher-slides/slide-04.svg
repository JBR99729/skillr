<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">4 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Partition tens and ones</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Calculate the tens and ones, then recombine.</text><rect x="150" y="300" width="1300" height="360" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="220" y="410" fill="#173a72" font-family="Arial" font-size="70" font-weight="700">34 + 28</text><text x="700" y="390" fill="#1d4ed8" font-family="Arial" font-size="43" font-weight="700">30 + 20 = 50</text><text x="700" y="485" fill="#166534" font-family="Arial" font-size="43" font-weight="700">4 + 8 = 12</text><line x1="680" y1="535" x2="1300" y2="535" stroke="#cbd5e1" stroke-width="4"/><text x="700" y="615" fill="#9a3412" font-family="Arial" font-size="54" font-weight="700">50 + 12 = 62</text><rect x="350" y="710" width="900" height="80" rx="20" fill="#fff7ed"/><text x="800" y="760" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="31" font-weight="700">12 ones can also be renamed as 1 ten and 2 ones.</text><text x="800" y="460" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N04 • SkillrHub • skillrhub.com</text></svg>