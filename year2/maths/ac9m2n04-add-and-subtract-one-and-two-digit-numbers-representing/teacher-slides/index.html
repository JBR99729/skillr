<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>AC9M2N04 Teacher Slides | SkillrHub</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/teacher-slide-viewer.css?v=1">
  <style>
    .fixed-slide-viewer img{width:100%;height:auto;display:block;background:#fff}
    @media print{body>*{display:none!important}body:before{content:'SkillrHub Teacher Slides are available for live classroom display.';display:block;padding:32px;font:700 20pt Arial,sans-serif}}
  </style>
</head>
<body oncontextmenu="return false">
  <nav class="main-nav"><a href="../">Topic Guide</a><a href="/year2/curriculum/maths/">Year 2 Maths</a></nav>
  <main style="padding:clamp(12px,3vw,32px)">
    <h1>AC9M2N04 Teacher Slides</h1>
    <p>Addition and subtraction strategies • fixed static classroom presentation</p>
    <section class="fixed-slide-viewer" data-fixed-slide-viewer tabindex="0" aria-label="AC9M2N04 Teacher Slides">
      <div class="fixed-slide-viewer__stage">
        <figure class="fixed-slide-viewer__slide" data-slide><img src="slide-01.svg" alt="Part-part-whole model connecting 24 plus 13 with the whole 37" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-02.svg" alt="Near doubles strategy showing 7 plus 8 as 7 plus 7 plus 1" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-03.svg" alt="Bridge to the next ten strategy for 47 plus 6" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-04.svg" alt="Partition tens and ones to calculate 34 plus 28" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-05.svg" alt="Count up on a number line to find 52 minus 38" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-06.svg" alt="Adding zero and checking subtraction with the inverse operation" draggable="false"></figure>
        <figure class="fixed-slide-viewer__slide" data-slide hidden><img src="slide-07.svg" alt="Quick check for Year 2 addition and subtraction strategies" draggable="false"></figure>
      </div>
      <div class="fixed-slide-viewer__controls">
        <button type="button" data-slide-previous>Previous</button>
        <span class="fixed-slide-viewer__counter" data-slide-counter>1 / 7</span>
        <button type="button" data-slide-next>Next</button>
        <button type="button" data-slide-fullscreen>Fullscreen</button>
      </div>
    </section>
  </main>
  <script src="/assets/teacher-slide-viewer.js?v=1"></script>
  <script src="/assets/curriculum-progression.js?v=1"></script>
  <script>document.addEventListener('dragstart',event=>event.preventDefault());</script>
</body>
</html>
