<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Part-part-whole connects addition and subtraction</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Name the whole and the two parts before choosing an operation.</text><rect x="525" y="300" width="550" height="120" rx="24" fill="#dbeafe"/><text x="800" y="375" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="58" font-weight="700">WHOLE = 37</text><rect x="260" y="525" width="430" height="150" rx="24" fill="#ecfdf5"/><rect x="910" y="525" width="430" height="150" rx="24" fill="#fff7ed"/><text x="475" y="620" text-anchor="middle" fill="#166534" font-family="Arial" font-size="54" font-weight="700">PART = 24</text><text x="1125" y="620" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="54" font-weight="700">PART = 13</text><path d="M700 420 L520 525 M900 420 L1080 525" stroke="#334155" stroke-width="8" fill="none"/><text x="800" y="760" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="38" font-weight="700">24 + 13 = 37 • 37 − 24 = 13 • 37 − 13 = 24</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N04 • SkillrHub • skillrhub.com</text></svg>