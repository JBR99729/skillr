<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">3 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Bridge to the next friendly ten</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Split one addend so the first jump lands on a multiple of 10.</text><text x="160" y="365" fill="#173a72" font-family="Arial" font-size="78" font-weight="700">47 + 6</text><path d="M520 340 H890" stroke="#334155" stroke-width="8"/><path d="M890 340 l-28 -18 v36z" fill="#334155"/><text x="610" y="300" fill="#166534" font-family="Arial" font-size="36" font-weight="700">+3</text><text x="900" y="365" fill="#173a72" font-family="Arial" font-size="78" font-weight="700">50</text><path d="M1015 340 H1280" stroke="#334155" stroke-width="8"/><path d="M1280 340 l-28 -18 v36z" fill="#334155"/><text x="1080" y="300" fill="#9a3412" font-family="Arial" font-size="36" font-weight="700">+3</text><text x="1320" y="365" fill="#173a72" font-family="Arial" font-size="78" font-weight="700">53</text><rect x="300" y="525" width="1000" height="170" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="800" y="600" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">6 = 3 + 3</text><text x="800" y="660" text-anchor="middle" fill="#475569" font-family="Arial" font-size="31">47 + 3 = 50, then 50 + 3 = 53</text><text x="800" y="460" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N04 • SkillrHub • skillrhub.com</text></svg>