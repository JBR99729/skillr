<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="white" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="white" font-family="Arial" font-size="25">4 / 5</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Compare place value from left to right</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Which is greater: 586 or 568?</text><g font-family="Arial" text-anchor="middle"><rect x="170" y="330" width="500" height="330" rx="30" fill="#eff6ff"/><text x="420" y="410" fill="#1d4ed8" font-size="64" font-weight="700">586</text><text x="420" y="500" fill="#334155" font-size="29">5 hundreds • 8 tens • 6 ones</text><rect x="930" y="330" width="500" height="330" rx="30" fill="#ecfdf5"/><text x="1180" y="410" fill="#166534" font-size="64" font-weight="700">568</text><text x="1180" y="500" fill="#334155" font-size="29">5 hundreds • 6 tens • 8 ones</text><text x="800" y="525" fill="#173a72" font-size="90" font-weight="700">&gt;</text></g><rect x="260" y="710" width="1080" height="90" rx="22" fill="#fff7ed"/><text x="800" y="750" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="30" font-weight="700">Hundreds are equal, so compare the tens.</text><text x="800" y="787" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="27">8 tens is greater than 6 tens → 586 &gt; 568</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="white" font-family="Arial" font-size="26" font-weight="700">AC9M2N01 • SkillrHub • skillrhub.com</text></svg>