<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">4 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Division can mean sharing equally</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">The number of groups is known. Find how many are in each group.</text><text x="160" y="340" fill="#173a72" font-family="Arial" font-size="66" font-weight="700">12 shared into 3 equal groups</text><g fill="#d9e8ff" stroke="#24324a" stroke-width="3"><circle cx="330" cy="500" r="30"/><circle cx="410" cy="500" r="30"/><circle cx="490" cy="500" r="30"/><circle cx="570" cy="500" r="30"/><circle cx="730" cy="500" r="30"/><circle cx="810" cy="500" r="30"/><circle cx="890" cy="500" r="30"/><circle cx="970" cy="500" r="30"/><circle cx="1130" cy="500" r="30"/><circle cx="1210" cy="500" r="30"/><circle cx="1290" cy="500" r="30"/><circle cx="1370" cy="500" r="30"/></g><rect x="270" y="430" width="360" height="150" rx="25" fill="none" stroke="#1d4ed8" stroke-width="5"/><rect x="670" y="430" width="360" height="150" rx="25" fill="none" stroke="#16a34a" stroke-width="5"/><rect x="1070" y="430" width="360" height="150" rx="25" fill="none" stroke="#f59e0b" stroke-width="5"/><text x="800" y="700" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="54" font-weight="700">12 ÷ 3 = 4</text><text x="800" y="760" text-anchor="middle" fill="#475569" font-family="Arial" font-size="30">Each group has 4 counters.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1