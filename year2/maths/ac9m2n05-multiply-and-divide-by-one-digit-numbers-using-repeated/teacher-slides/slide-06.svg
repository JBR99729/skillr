<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">6 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">A Think Board connects different representations</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Explain the story, model, diagram and number sentence together.</text><rect x="100" y="300" width="660" height="190" rx="26" fill="#eff6ff"/><text x="140" y="355" fill="#1d4ed8" font-family="Arial" font-size="31" font-weight="700">STORY</text><text x="140" y="415" fill="#0f172a" font-family="Arial" font-size="29">$36 shared equally between 4 people.</text><text x="140" y="460" fill="#475569" font-family="Arial" font-size="26">How many dollars does each person receive?</text><rect x="840" y="300" width="660" height="190" rx="26" fill="#ecfdf5"/><text x="880" y="355" fill="#166534" font-family="Arial" font-size="31" font-weight="700">NUMBER SENTENCE</text><text x="1170" y="440" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="58" font-weight="700">36 ÷ 4 = 9</text><rect x="100" y="545" width="660" height="190" rx="26" fill="#fff7ed"/><text x="140" y="600" fill="#9a3412" font-family="Arial" font-size="31" font-weight="700">BAR MODEL</text><g stroke="#9a3412" stroke-width="4" fill="#ffedd5"><rect x="150" y="645" width="130" height="55"/><rect x="280" y="645" width="130" height="55"/><rect x="410" y="645" width="130" height="55"/><rect x="540" y="645" width="130" height="55"/></g><text x="410" y="680" text-anchor="middle" fill="#7c2d12" font-family="Arial" font-size="25" font-weight="700">9     9     9     9</text><rect x="840" y="545" width="660" height="190" rx="26" fill="#fefce8"/><text x="880" y="600" fill="#854d0e" font-family="Arial" font-size="31" font-weight="700">INTERPRET</text><text x="1170" y="660" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="31" font-weight="700">Each person receives $9.</text><text x="1170" y="705" text-anchor="middle" fill="#475569" font-family="Arial" font-size="25">The answer is dollars, not people.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N05 • SkillrHub • skillrhub.com</text></svg>