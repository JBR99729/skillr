<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">2 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Arrays show equal rows and columns</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">The same 12 objects can be read in two directions.</text><g fill="#d9e8ff" stroke="#24324a" stroke-width="3"><circle cx="360" cy="330" r="32"/><circle cx="470" cy="330" r="32"/><circle cx="580" cy="330" r="32"/><circle cx="690" cy="330" r="32"/><circle cx="360" cy="440" r="32"/><circle cx="470" cy="440" r="32"/><circle cx="580" cy="440" r="32"/><circle cx="690" cy="440" r="32"/><circle cx="360" cy="550" r="32"/><circle cx="470" cy="550" r="32"/><circle cx="580" cy="550" r="32"/><circle cx="690" cy="550" r="32"/></g><rect x="880" y="300" width="560" height="300" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="1160" y="400" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="42" font-weight="700">3 rows of 4 = 12</text><text x="1160" y="500" text-anchor="middle" fill="#166534" font-family="Arial" font-size="42" font-weight="700">4 columns of 3 = 12</text><text x="1160" y="565" text-anchor="middle" fill="#475569" font-family="Arial" font-size="27">Different view, same total.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N05 • SkillrHub • skillrhub.com</text></svg>