<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 7</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Multiplication describes equal groups</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">The same number of objects appears in every group.</text><g fill="#bfdbfe" stroke="#24324a" stroke-width="4"><circle cx="260" cy="390" r="38"/><circle cx="340" cy="390" r="38"/><circle cx="420" cy="390" r="38"/><circle cx="620" cy="390" r="38"/><circle cx="700" cy="390" r="38"/><circle cx="780" cy="390" r="38"/><circle cx="980" cy="390" r="38"/><circle cx="1060" cy="390" r="38"/><circle cx="1140" cy="390" r="38"/><circle cx="1340" cy="390" r="38"/><circle cx="1420" cy="390" r="38"/><circle cx="1500" cy="390" r="38"/></g><text x="800" y="540" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">4 groups of 3</text><text x="800" y="630" text-anchor="middle" fill="#166534" font-family="Arial" font-size="44" font-weight="700">3 + 3 + 3 + 3 = 12</text><text x="800" y="710" text-anchor="middle" fill="#9a3412" font-family="Arial" font-size="52" font-weight="700">4 × 3 = 12</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".055" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N05 • SkillrHub • skillrhub.com</text></svg>