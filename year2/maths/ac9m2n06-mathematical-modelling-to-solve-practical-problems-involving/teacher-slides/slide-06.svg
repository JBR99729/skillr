<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">6 / 8</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">A calendar can be the mathematical model</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Make the start date, endpoint and included days clear.</text><rect x="170" y="315" width="1260" height="330" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="250" y="380" fill="#173a72" font-family="Arial" font-size="34" font-weight="700">Example: How many days after 24 December until 31 December?</text><g font-family="Arial" font-size="34" font-weight="700" text-anchor="middle"><rect x="250" y="455" width="120" height="100" rx="16" fill="#fee2e2"/><text x="310" y="515" fill="#b91c1c">24</text><rect x="390" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="450" y="515" fill="#1d4ed8">25</text><rect x="530" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="590" y="515" fill="#1d4ed8">26</text><rect x="670" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="730" y="515" fill="#1d4ed8">27</text><rect x="810" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="870" y="515" fill="#1d4ed8">28</text><rect x="950" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="1010" y="515" fill="#1d4ed8">29</text><rect x="1090" y="455" width="120" height="100" rx="16" fill="#dbeafe"/><text x="1150" y="515" fill="#1d4ed8">30</text><rect x="1230" y="455" width="120" height="100" rx="16" fill="#bbf7d0"/><text x="1290" y="515" fill="#166534">31</text></g><text x="800" y="605" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="34" font-weight="700">Count 25, 26, 27, 28, 29, 30, 31 → 7 days</text><rect x="360" y="700" width="880" height="80" rx="20" fill="#fefce8"/><text x="800" y="750" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="29" font-weight="700">Say whether the starting day is included before you count.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".05" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N06 • SkillrHub • skillrhub.com</text></svg>