<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">7 / 8</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Use First Nations game contexts from authorised sources</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Keep cultural information accurate and keep the mathematical model connected to the source.</text><g font-family="Arial"><rect x="120" y="315" width="1360" height="95" rx="20" fill="#eff6ff"/><text x="165" y="375" fill="#1d4ed8" font-size="29" font-weight="700">1. Use the authorised curriculum or community-approved description of the game.</text><rect x="120" y="430" width="1360" height="95" rx="20" fill="#ecfdf5"/><text x="165" y="490" fill="#166534" font-size="29" font-weight="700">2. Identify the equal grouping or sharing relationship shown in that source.</text><rect x="120" y="545" width="1360" height="95" rx="20" fill="#fff7ed"/><text x="165" y="605" fill="#9a3412" font-size="29" font-weight="700">3. Represent the relationship with materials, a diagram and a number sentence.</text><rect x="120" y="660" width="1360" height="95" rx="20" fill="#fef2f2"/><text x="165" y="720" fill="#b91c1c" font-size="29" font-weight="700">4. Do not invent game rules, cultural meanings or community details.</text></g><text x="800" y="790" text-anchor="middle" fill="#173a72" font-family="Arial" font-size="27" font-weight="700">Curriculum example: Yangamini from the Tiwi Island Peoples — use only sourced descriptions.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".05" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N06 • SkillrHub • skillrhub.com</text></svg>