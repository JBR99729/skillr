<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">1 / 8</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Use a modelling cycle for practical problems</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Do not stop at the calculation — connect the answer back to the situation.</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="330" width="210" height="180" rx="24" fill="#eff6ff"/><rect x="338" y="330" width="210" height="180" rx="24" fill="#ecfdf5"/><rect x="576" y="330" width="210" height="180" rx="24" fill="#fff7ed"/><rect x="814" y="330" width="210" height="180" rx="24" fill="#fef2f2"/><rect x="1052" y="330" width="210" height="180" rx="24" fill="#f5f3ff"/><rect x="1290" y="330" width="210" height="180" rx="24" fill="#f0fdfa"/><text x="205" y="390" fill="#1d4ed8" font-size="28" font-weight="700">1. UNDERSTAND</text><text x="443" y="390" fill="#166534" font-size="28" font-weight="700">2. REPRESENT</text><text x="681" y="390" fill="#9a3412" font-size="28" font-weight="700">3. CHOOSE</text><text x="919" y="390" fill="#b91c1c" font-size="28" font-weight="700">4. SOLVE</text><text x="1157" y="390" fill="#6d28d9" font-size="28" font-weight="700">5. CHECK</text><text x="1395" y="390" fill="#0f766e" font-size="28" font-weight="700">6. COMMUNICATE</text><text x="205" y="455" fill="#334155" font-size="23">What is known?</text><text x="443" y="455" fill="#334155" font-size="23">Draw or model</text><text x="681" y="455" fill="#334155" font-size="23">Which operation?</text><text x="919" y="455" fill="#334155" font-size="23">Calculate</text><text x="1157" y="455