<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="96" fill="#173a72"/><text x="88" y="62" fill="#fff" font-family="Arial" font-size="32" font-weight="700">SkillrHub • Year 2 Maths</text><text x="1460" y="62" text-anchor="end" fill="#fff" font-family="Arial" font-size="25">8 / 8</text><text x="90" y="175" fill="#173a72" font-family="Arial" font-size="52" font-weight="700">Quick modelling check</text><text x="90" y="230" fill="#475569" font-family="Arial" font-size="29">Show a representation, choose an operation and answer in context.</text><rect x="120" y="300" width="1360" height="105" rx="22" fill="#eff6ff"/><text x="170" y="365" fill="#0f172a" font-family="Arial" font-size="31">1. A toy costs $14 and a puzzle costs $9. What is the total cost?</text><rect x="120" y="440" width="1360" height="105" rx="22" fill="#ecfdf5"/><text x="170" y="505" fill="#0f172a" font-family="Arial" font-size="31">2. You have $30 and spend $18. Why is subtraction suitable?</text><rect x="120" y="580" width="1360" height="105" rx="22" fill="#fff7ed"/><text x="170" y="645" fill="#0f172a" font-family="Arial" font-size="31">3. Put 23 students into teams of 5. How many full teams and what remains?</text><rect x="310" y="720" width="980" height="70" rx="20" fill="#fefce8"/><text x="800" y="765" text-anchor="middle" fill="#854d0e" font-family="Arial" font-size="28" font-weight="700">Finish one answer with a sentence that names what the number means.</text><text x="800" y="455" text-anchor="middle" fill="#173a72" opacity=".05" font-family="Arial" font-size="48" font-weight="700">SKILLRHUB • SKILLRHUB</text><rect y="835" width="1600" height="65" fill="#173a72"/><text x="70" y="877" fill="#fff" font-family="Arial" font-size="26" font-weight="700">AC9M2N06 • SkillrHub • skillrhub.com</text></svg>