:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1240px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1240px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.5rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.82rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.74rem}.flow-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.flow-row span{flex:1;min-width:90px;background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.64rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.model h2{margin:2px 0 5px;font-size:.88rem;color:var(--navy)}.sheet .y4-subject-board{padding:7px;margin:3px 0}.sheet .y4-subject-board>p{font-size:.67rem;margin-top:4px}.sheet .y4-subject-cards span,.sheet .y4-subject-flow span{min-height:28px;padding:5px 6px;font-size:.62rem}.sheet .y4-subject-table span{padding:4px;font-size:.58rem}.sheet .y4-subject-sentence>div{min-width:105px;padding:6px}.reasoning{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.reasoning>div{border:1px solid #d9e5f5;border-radius:9px;background:#f7faff;padding:6px;font-size:.66rem}.reasoning strong{display:block;color:var(--brand)}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.84rem;color:var(--navy)}.card p,.card li{font-size:.68rem}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.58rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.66rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none}.skillr-repeat-watermark span{transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;color:rgba(36,87,214,.05)}@media(max-width:900px){.hero,.model-grid,.grid,.reasoning{grid-template-columns:1fr}.flow-row span{min-width:140px}}
