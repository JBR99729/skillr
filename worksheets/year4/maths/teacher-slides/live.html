:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1240px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1240px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.55rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.84rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.76rem}.flow-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.flow-row span{flex:1;min-width:90px;background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.66rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.model h2{margin:2px 0 5px;font-size:.9rem;color:var(--navy)}.sheet .y4-maths-board{padding:8px;margin:4px 0}.sheet .y4-maths-board>p{font-size:.7rem;margin-top:5px}.sheet .y4-card-row span,.sheet .y4-flow span{min-height:29px;padding:5px 7px;font-size:.66rem}.sheet .y4-table span{padding:5px;font-size:.62rem}.sheet .y4-hundred-grid{width:120px}.sheet .y4-decimal-place small{font-size:.49rem}.sheet .y4-decimal-place strong{font-size:1rem;padding:6px}.sheet .y4-number-line{padding:10px 6px 25px}.sheet .y4-bargraph{height:110px}.sheet .y4-dotplot{min-height:100px}.sheet .y4-angle{transform:scale(.78);transform-origin:center}.sheet .y4-composite{height:125px}.reasoning{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.reasoning>div{border:1px solid #d9e5f5;border-radius:9px;background:#f7faff;padding:6px;font-size:.67rem}.reasoning strong{display:block;color:var(--brand)}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.85rem;color:var(--navy)}.card p,.card li{font-size:.7rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.6rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.67rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.055)}@media(max-width:900px){.hero,.model-grid,.grid,.reasoning{grid-template-columns:1fr}.flow-row span{min-width:14 <body>
<div class="toolbar"><a id="backLink" href="/year4/curriculum/maths/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:16px">Loading Year 4 Maths slide...</p></main>
<script src="/assets/year4-maths-data-base.js?v=4"></script>
<script src="/assets/year4-maths-data-n1.js?v=4"></script>
<script src="/assets/year4-maths-data-n2.js?v=4"></script>
<script src="/assets/year4-maths-data-n3.js?v=4"></script>
<script src="/assets/year4-maths-data-a.js?v=4"></script>
<script src="/assets/year4-maths-data-m1.js?v=4"></script>
<script src="/assets/year4-maths-data-m2.js?v=4"></script>
<script src="/assets/year4-maths-data-sp.js?v=4"></script>
<script src="/assets/year4-maths-data-st.js?v=4"></script>
<script src="/assets/year4-maths-data-p.js?v=4"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const code = (params.get("code") || "AC9M4N01").toUpperCase();
  const unit = window.SkillrYear4MathsData?.[code];
  const root = document.getElementById("slideRoot");
  const back = document.getElementById("backLink");
  const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
  if (!unit || !root) { if (root) root.innerHTML = '<p style="padding:16px">Slide content is still loading. Refresh once if needed.</p>'; return; }
  document.title = `${code} ${unit.title} Teacher Slide | SkillrHub`;
  back.href = `/year4/maths/${unit.slug}/`;
  const routine = unit.routine.split("→").map((part) => `<span>${esc(part.trim())}</span>`).join("");
  const mixups = unit.mistakes.slice(0, 3).map(([name, fix]) => `<li><strong>${esc(name)}:</strong> ${esc(fix)}</li>`).join("");
  const checks = unit.quick.slice(0, 4).map((item) => `<li>${esc(item)}</li>`).join("");
  const activities = unit.activities.slice(0, 3).map((activity) => `<li><strong>${esc(activity.title)}:</strong> ${esc(activity.text)}</li>`).join("");
  root.innerHTML = `<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>"<span>SkillrHub F–10 • skillrhub.com</span>").join("")}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 4 Maths • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 4 Maths</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Reasoning routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow-row">${routine}</div><section class="model"><div class="model-grid"><div><span class="tag">Teach It</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}</div><div><span class="tag">Apply and transfer</span><h2>${esc(unit.apply_title)}</h2>${unit.apply_html}</div></div></section><section class="reasoning"><div><strong>Notice</strong>What mathematical structure is visible?</div><div><strong>Explain</strong>Why does the strategy or representation work?</div><div><strong>Verify</strong>Which estimate, inverse, equivalent form or counterexample checks it?</div></section><section class="grid"><div class="card"><span class="tag">Try it</span><h2>Activities</h2><ul>${activities}</ul></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mixups}</ul></div><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>Project directly in class • same models as the topic page</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/assets/year4-maths-slide-strands.js?v=1"></script>
</body>
</html>
