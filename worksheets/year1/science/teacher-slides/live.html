<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><meta name="google-adsense-account" content="ca-pub-7734963540104771"><title>Year 1 Science Teacher Slide | SkillrHub</title><style>:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff;--green:#f2fbf4;--amber:#fff9ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.25}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px;display:flex;gap:8px;flex-wrap:wrap}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:800;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.watermark{position:absolute;z-index:-1;left:50%;top:53%;transform:translate(-50%,-50%) rotate(-25deg);font-weight:900;font-size:5.4rem;color:rgba(36,87,214,.045);white-space:nowrap}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.58rem}.subtitle,.goal{margin:3px 0}.subtitle{font-weight:800}.goal{font-size:.84rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.78rem}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.flow span,.tagword{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.7rem;font-weight:900;color:var(--navy)}.visuals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tagword{font-size:.78rem;padding:7px 9px}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.97)}.card h2{margin:0 0 4px;font-size:.86rem;color:var(--navy)}.card p,.card li{font-size:.72rem}.card p{margin:2px 0}.card ol,.card ul{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.model{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f8fafc;border:1px dashed #b9c8db;border-radius:8px;padding:7px;line-height:1.45}.teach{background:#f7fbff}.mistake{background:var(--amber)}.check{background:var(--green)}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}@media(max-width:850px){.hero,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}@media print{.toolbar{display:none}.sheet{margin:0;max-width:none;border:0;box-shadow:none;border-radius:0}}</style><script src="/assets/display-only.js?v=2"></script><script src="/assets/year1-science-data.js?v=1"></script></head><body><div class="toolbar"><a id="backLink" href="/year1/curriculum/science/">Back to topic</a></div><main class="sheet" id="slideRoot"><p>Loading teacher slide…</p></main><script>(()=>{const params=new URLSearchParams(location.search);const code=(params.get('code')||'AC9S1U01').toUpperCase();const unit=window.SkillrYear1ScienceData?.[code];const root=document.getElementById('slideRoot');const esc=(v)=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));if(!unit){root.innerHTML='<p>Teacher slide not found.</p>';return;}document.title=`${code} ${unit.title} Teacher Slide | SkillrHub`;document.getElementById('backLink').href=`/year1/science/${unit.slug}/`;const flow=unit.routine.split(/\s*→\s*/).map(x=>`<span>${esc(x)}</span>`).join('');const visuals=unit.visuals.map(x=>`<span class="tagword">${esc(x)}</span>`).join('');const mix=(unit.mistakes||[]).slice(0,3).map(([n,f])=>`<li><strong>${esc(n)}:</strong> ${esc(f)}</li>`).join('');const checks=(unit.quick||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('');root.innerHTML=`<div class="watermark">SkillrHub F–10</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 1 Science • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 1 Science</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow">${flow}</div><section class="visuals">${visuals}</section><section class="grid"><div class="card teach"><span class="tag">Teach</span><h2>${esc(unit.model_title)}</h2><div class="model">${unit.model_html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}</div></div><div class="card teach"><span class="tag">Solved example</span><h2>Model one answer</h2><p>${esc(unit.solved_example)}</p></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mix}</ul></div></section><section class="grid" style="margin-top:6px"><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${checks}</ol></div><div class="card teach"><span class="tag">Try It</span><h2>${esc(unit.activities[0]?.title||'Activity')}</h2><p>${esc(unit.activities[0]?.text||'Use the lesson model with a classroom example.')}</p><div class="model">${esc(unit.activities[0]?.visual||'')}</div></div><div class="card teach"><span class="tag">Next</span><h2>Practice / Test</h2><p>Students should read the 60-second notes first, then answer independently.</p></div></section><div class="footer"><span>For live classroom display • SkillrHub F–10</span><span>skillrhub.com • ${code}</span></div>`;})();</script></body></html>
