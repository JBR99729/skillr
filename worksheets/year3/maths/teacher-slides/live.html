<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1220px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1220px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.55rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.86rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.78rem}.flow-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.flow-row span{flex:1;min-width:95px;background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.68rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.model h2{margin:2px 0 5px;font-size:.92rem;color:var(--navy)}.sheet .y3-vector-board{padding:8px;margin:4px 0}.sheet .y3-card-row span,.sheet .y3-flow span{min-height:30px;padding:6px 7px;font-size:.69rem}.sheet .y3-clock{width:100px;height:100px}.sheet .y3-bargraph{height:115px}.sheet .y3-angle{transform:scale(.85)}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.72rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.055)}@media(max-width:880px){.hero,.model-grid,.grid{grid-template-columns:1fr}.flow-row span{min-width:140px}}
</style>
<style>.sheet{max-width:1180px}.deck-brand{display:flex;align-items:center;gap:9px;margin-bottom:12px}.deck-brand img{width:38px;height:38px}.deck-brand span{margin-left:auto}.core-slide{min-height:min(640px,78vh);padding:clamp(24px,5vw,64px);margin:0 0 22px;border:2px solid #d8e2ef;border-radius:18px;background:#fff;display:flex;flex-direction:column;justify-content:center}.core-slide h1{font-size:clamp(2rem,4vw,3.4rem)}.core-slide h2{font-size:clamp(1.65rem,3vw,2.6rem)}.core-slide li,.core-slide p,.core-slide aside{font-size:clamp(1.05rem,1.7vw,1.5rem);line-height:1.45}.core-slide details{border:2px solid #2457d6;border-radius:14px;padding:18px}.core-slide summary{font-weight:900;cursor:pointer}@media print{.toolbar{display:none}.core-slide{break-after:page;min-height:180mm}}</style>
<script src="/assets/display-only.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backLink" href="/year3/curriculum/maths/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:16px">Loading Year 3 Maths slide...</p></main>
<script src="/assets/year3-maths-data-base.js?v=1"></script>
<script src="/assets/year3-maths-data-n1.js?v=1"></script>
<script src="/assets/year3-maths-data-n2.js?v=1"></script>
<script src="/assets/year3-maths-data-n3.js?v=1"></script>
<script src="/assets/year3-maths-data-a.js?v=1"></script>
<script src="/assets/year3-maths-data-m1.js?v=1"></script>
<script src="/assets/year3-maths-data-m2.js?v=1"></script>
<script src="/assets/year3-maths-data-sp.js?v=1"></script>
<script src="/assets/year3-maths-data-st.js?v=1"></script>
<script src="/assets/year3-maths-data-p.js?v=1"></script>
<script type="text/plain" data-preserved-legacy-slide>
(() => {
  const params=new URLSearchParams(location.search);
  const code=(params.get("code")||"AC9M3N01").toUpperCase();
  const unit=window.SkillrYear3MathsData?.[code];
  const root=document.getElementById("slideRoot"), back=document.getElementById("backLink");
  const esc=(value)=>String(value??"").replace(/[&<>"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
  if(!unit||!root){if(root)root.innerHTML='<p style="padding:16px">Slide content is still loading. Refresh once if needed.</p>';return;}
  document.title=`${code} ${unit.title} Teacher Slide | SkillrHub`;
  back.href=`/year3/maths/${unit.slug}/`;
  const routine=unit.routine.split("→").map((part)=>`<span>${esc(part.trim())}</span>`).join("");
  const mixups=unit.mistakes.slice(0,3).map(([name,fix])=>`<li><strong>${esc(name)}:</strong> ${esc(fix)}</li>`).join("");
  const checks=unit.quick.slice(0,4).map((item)=>`<li>${esc(item)}</li>`).join("");
  const activities=unit.activities.slice(0,3).map((activity)=>`<li><strong>${esc(activity.title)}:</strong> ${esc(activity.text)}</li>`).join("");
  root.innerHTML=`<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>"<span>SkillrHub F–10 • skillrhub.com</span>").join("")}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 3 Maths • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 3 Maths</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow-row">${routine}</div><section class="model"><div class="model-grid"><div><span class="tag">Teach It</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}</div><div><span class="tag">Apply</span><h2>${esc(unit.apply_title)}</h2>${unit.apply_html}</div></div></section><section class="grid"><div class="card"><span class="tag">Try it</span><h2>Activities</h2><ul>${activities}</ul></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mixups}</ul></div><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>Project directly in class • same visuals as the topic page</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/assets/year3-maths-slide.js?v=1"></script>
<script src="/pwa-register.js"></script>
</body>
</html>
