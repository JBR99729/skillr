<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Year 2 English Teacher Slide | SkillrHub</title>
<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.35fr 1.05fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.5rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.84rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.76rem}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.flow span{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.67rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.english-model-board{border:1px dashed #bdc9da;background:#f8fafc;border-radius:10px;padding:8px;margin:4px 0;overflow:hidden}.english-model-board p{margin:5px 0 0;font-size:.69rem}.english-card-row,.english-flow,.english-sentence-strip,.english-sound-boxes{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}.english-card-row span,.english-flow span,.english-sentence-strip span,.english-sound-boxes span{display:inline-flex;align-items:center;justify-content:center;min-height:31px;border:1px solid #d9e5f5;border-radius:8px;background:#fff;padding:5px 7px;color:var(--navy);font-size:.65rem;font-weight:900;text-align:center}.english-flow b{color:var(--brand)}.english-sentence-strip span{border-radius:5px}.english-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.english-panels>div{position:relative;min-height:75px;border:1px solid #d9e5f5;border-radius:8px;background:#fff;padding:20px 6px 6px;display:grid;place-items:center;text-align:center}.english-panels small{position:absolute;top:4px;left:4px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:.48rem;font-weight:900}.english-panels strong{font-size:.6rem;color:var(--navy)}.english-sound-boxes span{min-width:32px;border-width:2px}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.71rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.055)}@media(max-width:850px){.hero,.model-grid,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/assets/display-only.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backLink" href="/year2/curriculum/english/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:16px">Loading Year 2 English slide...</p></main>
<script src="/assets/year2-english-data.js?v=1"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || 'AC9E2LA01').toUpperCase();
  const unit = window.SkillrYear2EnglishData?.[code];
  const root = document.getElementById('slideRoot');
  const back = document.getElementById('backLink');
  const esc = (value) => String(value ?? '').replace(/[&<>\"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]));
  if (!unit || !root) { if (root) root.innerHTML = '<p style="padding:16px">Slide content is still loading. Refresh once if needed.</p>'; return; }
  document.title = `${code} ${unit.title} Teacher Slide | SkillrHub`;
  back.href = `/year2/english/${unit.slug}/`;
  const routine = unit.routine.split('→').map((part) => `<span>${esc(part.trim())}</span>`).join('');
  const mixups = unit.mistakes.slice(0,3).map(([name,fix]) => `<li><strong>${esc(name)}:</strong> ${esc(fix)}</li>`).join('');
  const checks = unit.quick.slice(0,4).map((item) => `<li>${esc(item)}</li>`).join('');
  const activities = unit.activities.slice(0,3).map((activity) => `<li><strong>${esc(activity.title)}:</strong> ${esc(activity.text)}</li>`).join('');
  root.innerHTML = `<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>'<span>SkillrHub F–10 • skillrhub.com</span>').join('')}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 2 English • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 2 English</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow">${routine}</div><section class="model"><div class="model-grid"><div><span class="tag">Teach It</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}</div><div><span class="tag">Apply</span><h2>${esc(unit.apply_title)}</h2>${unit.apply_html}</div></div></section><section class="grid"><div class="card"><span class="tag">Try It</span><h2>Class activities</h2><ul>${activities}</ul></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mixups}</ul></div><div class="card check"><span class="tag">Quick Check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>Project directly in class • same models as the topic page</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/pwa-register.js"></script>
</body>
</html>
