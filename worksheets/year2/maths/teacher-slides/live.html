<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.35fr 1.05fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.55rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.86rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.78rem}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}.flow span{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.68rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.math-model-board{border:1px dashed #bdc9da;background:#f8fafc;border-radius:10px;padding:9px}.math-card-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.math-card-row span{display:inline-flex;align-items:center;justify-content:center;min-height:32px;border:1px solid #d9e5f5;border-radius:9px;background:#fff;padding:6px 8px;font-weight:900;color:var(--navy);font-size:.74rem}.y2-base-ten{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:5px;margin:4px 0}.y2-block{display:grid;place-items:center;min-height:58px;border-radius:10px;border:1px solid #d8e5f4;background:#fff}.y2-block strong{font-size:1.35rem;color:var(--brand)}.y2-block span{font-size:.62rem;font-weight:900;color:#49627f;text-transform:uppercase}.y2-hundreds{background:linear-gradient(90deg,rgba(36,87,214,.08) 1px,transparent 1px),linear-gradient(rgba(36,87,214,.08) 1px,transparent 1px),#fff;background-size:10px 10px}.y2-tens{background:repeating-linear-gradient(90deg,#fff 0 8px,#edf5ff 8px 16px)}.y2-ones{background:radial-gradient(circle at 13px 13px,rgba(36,87,214,.22) 0 4px,transparent 5px),#fff;background-size:24px 24px}.y2-place-table{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #d9e5f5;border-radius:10px;overflow:hidden;background:#fff;margin:6px 0}.y2-place-table span,.y2-place-table strong{text-align:center;padding:6px;border-right:1px solid #e3ebf6}.y2-place-table span:nth-child(3),.y2-place-table strong:nth-child(6){border-right:0}.y2-place-table span{font-size:.63rem;font-weight:900;background:#eef5ff;color:var(--navy);text-transform:uppercase}.y2-place-table strong{font-size:1.12rem;color:#203047}.y2-number-line{margin:4px 0;border:1px solid #d9e5f5;background:#fff;border-radius:10px;padding:9px}.y2-number-line__rail{position:relative;height:12px;border-bottom:3px solid var(--navy);margin:0 7px 4px}.y2-number-line__rail::before,.y2-number-line__rail::after{content:'';position:absolute;bottom:-6px;width:2px;height:10px;background:var(--navy)}.y2-number-line__rail::before{left:0}.y2-number-line__rail::after{right:0}.y2-number-line__rail span{position:absolute;bottom:-6px;width:12px;height:12px;border-radius:999px;background:var(--brand);transform:translateX(-50%)}.y2-number-line__labels{display:flex;justify-content:space-between;font-size:.62rem;color:#49627f}.y2-number-line p{margin:5px 0 0;font-size:.7rem}.y2-chart-puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#eef5ff;border:1px solid #d9e5f5;border-radius:10px;padding:5px;margin:5px 0}.y2-chart-puzzle span{background:#fff;border:1px solid #d9e5f5;border-radius:7px;text-align:center;padding:5px 2px;font-weight:900;color:var(--navy);font-size:.68rem}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.72rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.055)}@media(max-width:850px){.hero,.model-grid,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/assets/display-only.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backLink" href="/year2/curriculum/maths/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:16px">Loading Year 2 Maths slide...</p></main>
<script src="/assets/year2-maths-data.js?v=2"></script>
<script src="/assets/year2-maths-data-extra.js?v=1"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || 'AC9M2N01').toUpperCase();
  const unit = window.SkillrYear2MathsData?.[code];
  const root = document.getElementById('slideRoot');
  const back = document.getElementById('backLink');
  const esc = (value) => String(value ?? '').replace(/[&<>\"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]));
  if (!unit || !root) { if (root) root.innerHTML = '<p style="padding:16px">Slide content is still loading. Refresh once if needed.</p>'; return; }
  document.title = `${code} ${unit.title} Teacher Slide | SkillrHub`;
  back.href = `/year2/maths/${unit.slug}/`;
  const flow = unit.routine.split('→').map((part) => `<span>${esc(part.trim())}</span>`).join('');
  const mixups = unit.mistakes.slice(0,3).map(([name,fix]) => `<li><strong>${esc(name)}:</strong> ${esc(fix)}</li>`).join('');
  const checks = unit.quick.slice(0,4).map((item) => `<li>${esc(item)}</li>`).join('');
  const activities = unit.activities.slice(0,3).map((activity) => `<li><strong>${esc(activity.title)}:</strong> ${esc(activity.text)}</li>`).join('');
  root.innerHTML = `<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>'<span>SkillrHub F–10 • skillrhub.com</span>').join('')}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 2 Maths • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 2 Maths</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow">${flow}</div><section class="model"><div class="model-grid"><div><span class="tag">Teach It</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}</div><div><span class="tag">Apply</span><h2>${esc(unit.apply_title)}</h2>${unit.apply_html}</div></div></section><section class="grid"><div class="card"><span class="tag">Try it</span><h2>Visual activities</h2><ul>${activities}</ul></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mixups}</ul></div><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>For live classroom display • same visuals as the topic page</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/pwa-register.js"></script>
</body>
</html>
