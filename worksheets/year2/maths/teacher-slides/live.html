<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Year 2 Maths Teacher Slides | SkillrHub</title>
</head>
<body>
<p>Opening the fixed SkillrHub teacher slide deck…</p>
<script src="/assets/year2-maths-data.js?v=3"></script>
<script src="/assets/year2-maths-data-extra.js?v=2"></script>
<script>
(() => {
  const code=(new URLSearchParams(location.search).get('code')||'').toUpperCase();
  const unit=window.SkillrYear2MathsData?.[code];
  const target=unit?.slug ? `/year2/maths/${unit.slug}/teacher-slides/` : '/year2/curriculum/maths/';
  location.replace(target);
})();
</script>
</body>
</html>
