<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:850;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:800}.hero{display:grid;grid-template-columns:1.35fr 1.05fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:900;text-transform:uppercase}.hero h1{margin:0;font-size:1.5rem}.subtitle{margin:3px 0;font-weight:800}.goal{margin:4px 0;font-size:.84rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.76rem}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.flow span{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.67rem;font-weight:900;color:var(--navy)}.model{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:9px;margin-bottom:7px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.y2-vector-board{border:1px dashed #bdc9da;background:#f8fafc;border-radius:10px;padding:8px;margin:4px 0;overflow:hidden}.y2-vector-board p{margin:5px 0 0;font-size:.69rem}.y2-vector-row,.y2-vector-flow,.y2-safety-model{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}.y2-vector-tile,.y2-vector-flow span,.y2-safety-model span{display:inline-flex;align-items:center;justify-content:center;min-height:30px;border:1px solid #d9e5f5;border-radius:8px;background:#fff;padding:5px 7px;color:var(--navy);font-size:.65rem;font-weight:900}.y2-vector-flow b{color:var(--brand)}.y2-vector-timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.y2-vector-timeline>div{border:1px solid #d9e5f5;border-radius:8px;background:#fff;padding:5px;text-align:center}.y2-vector-timeline i{display:block;width:7px;height:7px;border-radius:50%;margin:0 auto 2px;background:var(--brand)}.y2-vector-timeline strong,.y2-vector-timeline small{display:block;font-size:.57rem}.y2-vector-table{display:grid;grid-template-columns:repeat(2,1fr);font-size:.62rem;border:1px solid #d9e5f5;border-radius:8px;overflow:hidden;background:#fff}.y2-vector-table span{padding:5px;border-right:1px solid #e3ebf6;border-bottom:1px solid #e3ebf6}.y2-vector-table span:nth-child(2n){border-right:0}.y2-orbit{position:relative;min-height:120px;display:grid;place-items:center}.y2-orbit .sun{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffe18a;border:2px solid #eab84b;font-size:.65rem;font-weight:900;color:#714d00}.earth-orbit{position:absolute;width:110px;height:110px;border:1px dashed #9ab2d3;border-radius:50%}.earth{position:absolute;right:-14px;top:38px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#bfe0ff;border:2px solid #3d7eb8;font-size:.52rem;font-weight:900}.moon-orbit{position:absolute;inset:-10px;border:1px dashed #8a98aa;border-radius:50%}.moon-orbit span{position:absolute;right:-9px;top:8px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#edf0f4;border:1px solid #9aa5b1;font-size:.36rem}.y2-sound-model{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;min-height:90px}.y2-sound-model .string{height:38px;border-left:3px solid var(--navy);border-right:3px solid var(--navy);display:grid;place-items:center}.y2-sound-model .string span{width:100%;height:4px;background:var(--brand);transform:skewY(-8deg)}.y2-sound-model .waves{display:flex;gap:3px}.y2-sound-model .waves i{display:block;border:2px solid var(--brand);border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%;width:10px;height:31px}.y2-sound-model strong{grid-column:1/-1;text-align:center;font-size:.64rem}.y2-material-model{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.material-strip{width:65px;height:22px;display:grid;place-items:center;border-radius:6px;background:#e8d5af;border:1px solid #a87b37;font-size:.55rem;font-weight:900}.material-strip.bent{transform:rotate(10deg)}.material-strip.twisted{transform:skewX(-15deg)}.y2-material-model b{font-size:.55rem}.y2-report-model{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.y2-report-model>div{border:1px solid #d9e5f5;border-radius:7px;background:#fff;padding:5px}.y2-report-model strong,.y2-report-model span{display:block;font-size:.57rem}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.71rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:900;margin-bottom:3px;color:var(--navy)}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.055)}@media(max-width:850px){.hero,.model-grid,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/assets/display-only.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backLink" href="/year2/curriculum/science/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:16px">Loading Year 2 Science slide...</p></main>
<script src="/assets/year2-science-data.js?v=1"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || 'AC9S2U01').toUpperCase();
  const unit = window.SkillrYear2ScienceData?.[code];
  const root = document.getElementById('slideRoot');
  const back = document.getElementById('backLink');
  const esc = (value) => String(value ?? '').replace(/[&<>\"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]));
  if (!unit || !root) { if (root) root.innerHTML = '<p style="padding:16px">Slide content is still loading. Refresh once if needed.</p>'; return; }
  document.title = `${code} ${unit.title} Teacher Slide | SkillrHub`;
  back.href = `/year2/science/${unit.slug}/`;
  const routine = unit.routine.split('→').map((part) => `<span>${esc(part.trim())}</span>`).join('');
  const mixups = unit.mistakes.slice(0,3).map(([name,fix]) => `<li><strong>${esc(name)}:</strong> ${esc(fix)}</li>`).join('');
  const checks = unit.quick.slice(0,4).map((item) => `<li>${esc(item)}</li>`).join('');
  const activities = unit.activities.slice(0,3).map((activity) => `<li><strong>${esc(activity.title)}:</strong> ${esc(activity.text)}</li>`).join('');
  root.innerHTML = `<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>'<span>SkillrHub F–10 • skillrhub.com</span>').join('')}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Year 2 Science • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Year 2 Science</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Curriculum focus</strong></p><p>${esc(unit.desc)}</p><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p></div></section><div class="flow">${routine}</div><section class="model"><div class="model-grid"><div><span class="tag">Teach It</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}</div><div><span class="tag">Apply</span><h2>${esc(unit.apply_title)}</h2>${unit.apply_html}</div></div></section><section class="grid"><div class="card"><span class="tag">Try It</span><h2>Class activities</h2><ul>${activities}</ul></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mixups}</ul></div><div class="card check"><span class="tag">Quick Check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>Project directly in class • same visuals as the topic page</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/pwa-register.js"></script>
</body>
</html>
