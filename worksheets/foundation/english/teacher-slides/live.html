<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-7734963540104771">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#173968">
<title>Foundation English Teacher Slide | SkillrHub</title>
<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px}.toolbar a{border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:800;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px;background:#fff}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:700}.hero{display:grid;grid-template-columns:1.65fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:800;text-transform:uppercase}.hero h1{margin:0;font-size:1.6rem}.subtitle{margin:3px 0;font-weight:700}.goal{margin:4px 0;font-size:.87rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.8rem}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.flow span{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.72rem;font-weight:800;color:var(--navy)}.english-card-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.english-card-row span{display:grid;place-items:center;min-height:78px;padding:10px;border:1px solid #d9e5f5;border-radius:12px;background:#fff;color:var(--navy);font-size:1.05rem;font-weight:900;text-align:center}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.73rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:800;margin-bottom:3px;color:var(--navy)}.note{background:#f7fbff}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}.skillr-repeat-watermark{position:absolute;inset:0;z-index:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:800 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.07)}@media(max-width:800px){.hero{grid-template-columns:1fr}.grid,.english-card-row{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/assets/display-only.js?v=1"></script>
<script src="/assets/foundation-english-data.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backToTopic" href="/foundation/curriculum/english/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p style="padding:24px;font-weight:800">Loading Foundation English teacher slide…</p></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const code = String(params.get('code') || '').toUpperCase();
  const unit = window.SkillrFoundationEnglishData?.[code];
  const root = document.getElementById('slideRoot');
  const back = document.getElementById('backToTopic');
  const esc = (v) => String(v ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
  if (!unit || !root) { if(root) root.innerHTML = '<p style="padding:24px;font-weight:800">Choose a valid Foundation English code.</p>'; return; }
  document.title = `${code} ${unit.title} Teacher Slide | SkillrHub`;
  if(back) back.href = `/foundation/english/${unit.slug}/`;
  const cards = (unit.model_html.match(/<span>(.*?)<\/span>/g) || []).map(x => x.replace(/<\/?span>/g,''));
  const cardHtml = cards.length ? cards.slice(0,3).map(c => `<span>${c}</span>`).join('') : `<span>${esc(unit.model_title)}</span><span>${esc(unit.apply_title)}</span><span>${esc(unit.routine)}</span>`;
  const mix = unit.mistakes || [];
  root.innerHTML = `<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>'<span>SkillrHub F–10 • skillrhub.com</span>').join('')}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Foundation English • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Foundation English</p><h1>${esc(unit.title)}</h1><p class="subtitle">${esc(unit.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(unit.learn)}</p></div><div class="hero-box"><p><strong>Classroom routine</strong></p><p>${esc(unit.routine)}</p><p><strong>Key language</strong></p><p>word • sentence • text • sound • meaning • evidence</p></div></section><div class="flow"><span>Listen/look</span><span>Notice</span><span>Model</span><span>Try</span><span>Explain</span></div><section class="english-card-row">${cardHtml}</section><section class="grid"><div class="card note"><span class="tag">Teach</span><h2>${esc(unit.model_title)}</h2>${unit.model_html}<p><strong>Use it:</strong> ${esc(unit.apply_title)}.</p></div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mix.map(([a,b])=>`<li><strong>${esc(a)}:</strong> ${esc(b)}</li>`).join('')}</ul></div><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${unit.quick.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div></section><div class="footer"><span>For live classroom display • SkillrHub F–10</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/pwa-register.js"></script>
</body>
</html>
