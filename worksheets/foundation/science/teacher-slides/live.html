<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Foundation Science Teacher Slide | SkillrHub</title>
<style>
:root{--brand:#2457d6;--navy:#173968;--line:#d8e2ef;--text:#203047;--muted:#5d6c80;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f4f7fb;line-height:1.28}.toolbar{max-width:1180px;margin:12px auto 0;padding:0 14px}.toolbar a{display:inline-block;border:1px solid #cbd8e8;background:#fff;color:var(--brand);border-radius:999px;padding:8px 12px;font-weight:800;text-decoration:none}.sheet{position:relative;isolation:isolate;overflow:hidden;max-width:1180px;margin:10px auto 20px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(28,55,91,.08)}.brandbar{position:relative;z-index:22;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:7px 10px;border:1px solid #dce6f5;border-radius:10px;background:#fff}.brand{font-weight:900;color:var(--brand)}.brand span{color:var(--navy)}.brandbar small{color:var(--muted);font-weight:700}.hero{position:relative;z-index:22;display:grid;grid-template-columns:1.65fr 1fr;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.eyebrow{margin:0 0 2px;font-size:.72rem;font-weight:800;text-transform:uppercase}.hero h1{margin:0;font-size:1.6rem}.subtitle{margin:3px 0;font-weight:700}.goal{margin:4px 0;font-size:.87rem}.hero-box{border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px;background:rgba(255,255,255,.08)}.hero-box p{margin:2px 0;font-size:.8rem}.flow{position:relative;z-index:22;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.flow span{background:var(--soft);border:1px solid #d9e7fb;border-radius:8px;padding:5px;text-align:center;font-size:.72rem;font-weight:800;color:var(--navy)}.visuals{position:relative;z-index:30;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:7px}.visuals.two{grid-template-columns:repeat(2,minmax(0,1fr))}.visual{position:relative;z-index:30;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.visual img{position:relative;z-index:31;display:block;width:100%;height:175px;object-fit:cover;background:#fff}.visual-body{position:relative;z-index:31;padding:7px;background:#fff}.visual h2{margin:0 0 3px;font-size:.88rem;color:var(--navy)}.visual p{margin:2px 0;font-size:.72rem}.credit{font-size:.6rem!important;color:#718096}.credit a{color:inherit}.grid{position:relative;z-index:22;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}.card{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(255,255,255,.98)}.card h2{margin:0 0 4px;font-size:.87rem;color:var(--navy)}.card p,.card li{font-size:.73rem}.card p{margin:2px 0}.card ul,.card ol{margin:2px 0;padding-left:1rem}.tag{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid #d9e7fb;padding:2px 5px;font-size:.61rem;font-weight:800;margin-bottom:3px;color:var(--navy)}.note{background:#f7fbff}.mistake{background:#fffaf2}.check{background:#f7fbf8}.footer{position:relative;z-index:22;display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted);background:#fff}.skillr-repeat-watermark{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;overflow:hidden;pointer-events:none;user-select:none}.skillr-repeat-watermark span{display:block;transform:rotate(-24deg);white-space:nowrap;font:800 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.03em;color:rgba(36,87,214,.07)}@media(max-width:800px){.hero{grid-template-columns:1fr}.visuals,.visuals.two,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}.visual img{height:220px}.skillr-repeat-watermark{grid-template-columns:repeat(2,minmax(0,1fr))}.skillr-repeat-watermark span{font-size:13px}}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7734963540104771" crossorigin="anonymous"></script>
<script src="/assets/display-only.js?v=1"></script>
</head>
<body>
<div class="toolbar"><a id="backLink" href="/foundation/curriculum/science/">Back to topic</a></div>
<main class="sheet" id="slideRoot"><p>Loading teacher slide…</p></main>
<script src="/assets/foundation-science-data.js?v=1"></script>
<script>
(() => {
  const params=new URLSearchParams(location.search);const code=(params.get('code')||'AC9SFU01').toUpperCase();const u=window.SkillrFoundationScienceData?.[code];const root=document.getElementById('slideRoot');if(!u){root.innerHTML='<p>Teacher slide not found.</p>';return;}
  document.title=`${code} ${u.title} Teacher Slide | SkillrHub`;document.getElementById('backLink').href=`/foundation/science/${u.slug}/`;
  const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
  const visuals=u.visuals.map(v=>`<article class="visual"><img src="${esc(v.src)}" alt="${esc(v.alt)}"><div class="visual-body"><h2>${esc(v.title)}</h2><p>${esc(v.body)}</p><p class="credit">${esc(v.credit)} / <a href="${esc(v.source)}" rel="nofollow noopener" target="_blank">Unsplash</a></p></div></article>`).join('');
  const mix=u.mistakes.map(([n,f])=>`<li><strong>${esc(n)}:</strong> ${esc(f)}</li>`).join('');
  const checks=u.quick.map(x=>`<li>${esc(x)}</li>`).join('');
  const flow=u.routine.split('→').map(x=>`<span>${esc(x.trim())}</span>`).join('');
  root.innerHTML=`<div class="skillr-repeat-watermark" aria-hidden="true">${Array.from({length:15},()=>'<span>SkillrHub F–10 • skillrhub.com</span>').join('')}</div><div class="brandbar"><div class="brand">SkillrHub <span>F–10</span></div><small>Foundation Science • Live classroom display</small></div><section class="hero"><div><p class="eyebrow">${code} • Foundation Science</p><h1>${esc(u.title)}</h1><p class="subtitle">${esc(u.subtitle)}</p><p class="goal"><strong>Learning goal:</strong> ${esc(u.learn)}</p></div><div class="hero-box"><p><strong>Classroom routine</strong></p><p>${esc(u.routine)}</p><p><strong>Important idea</strong></p><p>${esc(u.apply_title)}</p></div></section><div class="flow">${flow}</div><section class="visuals${u.visuals.length===2?' two':''}">${visuals}</section><section class="grid"><div class="card note"><span class="tag">Teach</span><h2>${esc(u.model_title)}</h2>${u.model_html}<h2 style="margin-top:5px">${esc(u.apply_title)}</h2>${u.apply_html}</div><div class="card mistake"><span class="tag">Common Mix-Ups</span><h2>Watch for</h2><ul>${mix}</ul></div><div class="card check"><span class="tag">Quick check</span><h2>Ask</h2><ol>${checks}</ol></div></section><div class="footer"><span>For live classroom display • SkillrHub F–10</span><span>skillrhub.com • ${code}</span></div>`;
})();
</script>
<script src="/pwa-register.js"></script>
</body></html>
